/* SELECTED SUPPORT */

let selectedSupport = 0;

let selectedGift = null;



/* OPEN / CLOSE GIFT PANEL */

function toggleGiftPanel(){

const panel =
document.getElementById("giftPanel");


if(panel.style.display === "block"){

panel.style.display = "none";

}else{

panel.style.display = "block";

}

}



/* MONEY TAB */

function showMoney(){

document
.getElementById("moneyOptions")
.style.display = "flex";


document
.getElementById("giftOptions")
.style.display = "none";

}



/* GIFTS TAB */

function showGifts(){

document
.getElementById("moneyOptions")
.style.display = "none";


document
.getElementById("giftOptions")
.style.display = "flex";

}



/* SELECT MONEY */

function selectSupport(amount){

selectedSupport = amount;

selectedGift = null;


alert(
"You selected $" +
amount +
" support."
);

}



/* SELECT GIFT */

function selectGift(
emoji,
name,
amount
){

selectedGift = {

emoji:emoji,

name:name,

amount:amount

};


selectedSupport = amount;


alert(
"You selected " +
emoji +
" " +
name +
" ($" +
amount +
")"
);

}



/* SEND GIFT */

function sendGift(){

if(selectedSupport === 0){

alert(
"Please select a gift or amount first."
);

return;

}


if(selectedGift){

alert(
"You sent " +
selectedGift.emoji +
" " +
selectedGift.name +
" worth $" +
selectedGift.amount +
" to RafiGaming! ❤️"
);

}else{

alert(
"You supported RafiGaming with $" +
selectedSupport +
"! ❤️"
);

}


selectedSupport = 0;

selectedGift = null;

}
