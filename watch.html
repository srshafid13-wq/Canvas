<style>

/* =========================================
   WATCH PAGE
========================================= */

.watch-page {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 25px 15px 100px;
}


/* =========================================
   VIDEO CONTAINER
========================================= */

.watch-video-box {

    width: 100%;
    aspect-ratio: 16 / 9;

    background: #251b17;

    border-radius: 20px;
    overflow: hidden;

    position: relative;

    border: 1px solid #eaded6;

    box-shadow:
        0 8px 25px rgba(75,51,38,0.12);

    display: flex;
    align-items: center;
    justify-content: center;
}


#liveVideo {

    width: 100%;
    height: 100%;

    display: block;

    object-fit: contain;

    background: #000;
}


/* =========================================
   VIDEO LOADING
========================================= */

.video-message {

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%,-50%);

    width: 90%;

    text-align: center;

    color: #ffffff;

    font-size: 16px;
    font-weight: 700;

    z-index: 2;
}


.video-message.hidden {
    display: none;
}


/* =========================================
   LIVE BADGE
========================================= */

.watch-live-badge {

    position: absolute;

    top: 12px;
    left: 12px;

    padding: 6px 11px;

    border-radius: 8px;

    background: #d93025;

    color: #ffffff;

    font-size: 12px;
    font-weight: 800;

    z-index: 5;
}


/* =========================================
   WATCH INFORMATION
========================================= */

.watch-info {

    margin-top: 16px;

    padding: 18px;

    background: #ffffff;

    border: 1px solid #eaded6;

    border-radius: 18px;

    box-shadow:
        0 5px 18px rgba(75,51,38,0.06);
}


.watch-title {

    color: #4b3326;

    font-size: 24px;
    font-weight: 800;

    line-height: 1.3;

    margin-bottom: 10px;

    word-break: break-word;
}


.creator-row {

    display: flex;

    align-items: center;

    gap: 10px;
}


.creator-picture {

    width: 40px;
    height: 40px;

    flex-shrink: 0;

    border-radius: 50%;

    object-fit: cover;

    border: 2px solid #d4a62a;

    background: #f1f1f1;

    display: flex;

    align-items: center;
    justify-content: center;
}


.creator-picture img {

    width: 100%;
    height: 100%;

    border-radius: 50%;

    object-fit: cover;
}


.creator-details {

    min-width: 0;

    flex: 1;
}


.creator-name {

    color: #4b3326;

    font-size: 16px;
    font-weight: 800;
}


.creator-username {

    color: #806c60;

    font-size: 13px;

    margin-top: 3px;
}


/* =========================================
   VIEWER COUNT
========================================= */

.viewer-count {

    margin-top: 12px;

    color: #75645b;

    font-size: 14px;

    font-weight: 700;
}


/* =========================================
   FOLLOW BUTTON
========================================= */

.follow-button {

    margin-top: 15px;

    padding: 12px 20px;

    border: none;

    border-radius: 12px;

    background: #4b3326;

    color: #ffffff;

    font-size: 15px;

    font-weight: 800;

    cursor: pointer;
}


.follow-button:active {

    transform: scale(0.97);
}


.follow-button.following {

    background: #d4a62a;

    color: #ffffff;

    cursor: default;
}


.follow-button:disabled {

    opacity: 0.7;

    cursor: not-allowed;
}


/* =========================================
   WATCH ERROR
========================================= */

.watch-error {

    padding: 40px 20px;

    text-align: center;

    background: #fff8f6;

    border: 1px solid #f0d8d3;

    border-radius: 18px;

    color: #8a3028;
}


.watch-error h2 {

    margin-bottom: 10px;

    color: #6f2d26;
}


.watch-error p {

    color: #806c60;

    font-size: 14px;

    line-height: 1.5;
}


/* =========================================
   CLEAN EXPLORE ICON
========================================= */

.explore-nav-icon {

    width: 24px;
    height: 24px;

    display: block;

    flex-shrink: 0;
}


/* =========================================
   PROFILE NAV ICON
========================================= */

.bottom-profile-image {

    width: 24px;
    height: 24px;

    border-radius: 50%;

    object-fit: cover;

    display: block;
}


/* =========================================
   TOP PROFILE IMAGE
========================================= */

.top-profile-image {

    width: 30px;
    height: 30px;

    border-radius: 50%;

    object-fit: cover;

    display: block;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width:600px) {

    .watch-page {

        padding:
            20px 15px 95px;
    }


    .watch-video-box {

        border-radius: 16px;
    }


    .watch-info {

        padding: 15px;

        border-radius: 16px;
    }


    .watch-title {

        font-size: 21px;
    }


    .creator-picture {

        width: 37px;
        height: 37px;
    }

}

</style>

<script>

/* =========================================
   CANVAS BACKEND
========================================= */

const API_BASE =
    "https://canvas-kh9p.onrender.com";


/* =========================================
   STREAM STATE
========================================= */

let currentStream = null;

let isFollowing = false;


/* =========================================
   GET STREAM ID
========================================= */

function getStreamId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("stream");

}


/* =========================================
   LOAD STREAM
========================================= */

async function loadStream(){

    const streamId =
        getStreamId();


    if(!streamId){

        showStreamError(
            "No stream was selected."
        );

        return;

    }


    try{

        const response =
            await fetch(
                API_BASE +
                "/api/streams/" +
                encodeURIComponent(
                    streamId
                )
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Unable to load Canvas stream."
            );

        }


        currentStream =
            data.stream ||
            data;


        renderStream(
            currentStream
        );


        checkFollowStatus();


    }

    catch(error){

        console.error(
            "Unable to load Canvas stream:",
            error
        );


        showStreamError(
            "Unable to load Canvas stream."
        );

    }

}


/* =========================================
   RENDER STREAM
========================================= */

function renderStream(stream){

    if(!stream) return;


    /* =====================================
       TITLE
    ===================================== */

    const title =
        document.getElementById(
            "streamTitle"
        );


    if(title){

        title.textContent =
            stream.title ||
            "Canvas Live Stream";

    }


    /* =====================================
       CREATOR NAME
    ===================================== */

    const creator =
        document.getElementById(
            "creatorName"
        );


    if(creator){

        creator.textContent =
            stream.name ||
            stream.display_name ||
            stream.username ||
            "Canvas Creator";

    }


    /* =====================================
       USERNAME
    ===================================== */

    const username =
        document.getElementById(
            "creatorUsername"
        );


    if(username){

        username.textContent =
            stream.username
                ? "@" +
                  stream.username
                : "";

    }


    /* =====================================
       VIEWER COUNT
    ===================================== */

    const viewers =
        document.getElementById(
            "viewerCount"
        );


    if(viewers){

        const count =
            Number(
                stream.viewer_count ??
                stream.viewers ??
                stream.viewerCount ??
                0
            );


        viewers.textContent =
            count.toLocaleString() +
            " Watching";

    }


    /* =====================================
       CREATOR PROFILE PICTURE
    ===================================== */

    const pictureContainer =
        document.getElementById(
            "creatorPicture"
        );


    const profileImage =
        stream.profile_picture ||
        stream.profilePicture ||
        stream.avatar ||
        stream.avatar_url ||
        "";


    if(
        pictureContainer &&
        profileImage
    ){

        pictureContainer.innerHTML =
            '<img src="' +
            escapeHTML(
                profileImage
            ) +
            '" alt="Creator profile">';

    }


    /* =====================================
       STREAM THUMBNAIL
    ===================================== */

    const video =
        document.getElementById(
            "liveVideo"
        );


    if(video){

        const thumbnail =
            stream.thumbnail ||
            stream.thumbnail_url ||
            "";


        if(thumbnail){

            video.poster =
                thumbnail;

        }

    }


    /* =====================================
       VIDEO
    ===================================== */

    setupVideo(
        stream
    );

}


/* =========================================
   VIDEO SETUP
========================================= */

function setupVideo(stream){

    const video =
        document.getElementById(
            "liveVideo"
        );


    if(!video) return;


    const videoUrl =
        stream.video_url ||
        stream.videoUrl ||
        stream.playback_url ||
        stream.playbackUrl ||
        stream.stream_url ||
        stream.streamUrl ||
        "";


    if(videoUrl){

        if(
            video.src !==
            videoUrl
        ){

            video.src =
                videoUrl;

            video.load();

        }

        video.play()
        .catch(function(error){

            console.log(
                "Video autoplay waiting:",
                error
            );

        });

    }

}


/* =========================================
   STREAM ERROR
========================================= */

function showStreamError(message){

    const errorBox =
        document.getElementById(
            "streamError"
        );


    if(errorBox){

        errorBox.textContent =
            message;

        errorBox.style.display =
            "block";

    }

    else{

        const videoMessage =
            document.getElementById(
                "videoMessage"
            );


        if(videoMessage){

            videoMessage.textContent =
                message;

        }

    }


    const video =
        document.getElementById(
            "liveVideo"
        );


    if(video){

        video.style.display =
            "none";

    }

}


/* =========================================
   CHECK FOLLOW STATUS
========================================= */

async function checkFollowStatus(){

    if(!currentStream){

        return;

    }


    const creatorId =
        getCreatorId();


    const token =
        localStorage.getItem(
            "canvasAuthToken"
        );


    if(
        !creatorId ||
        !token
    ){

        return;

    }


    try{

        const response =
            await fetch(
                API_BASE +
                "/api/follow/status/" +
                encodeURIComponent(
                    creatorId
                ),
                {
                    method: "GET",

                    headers: {

                        "Authorization":
                            "Bearer " +
                            token

                    }

                }
            );


        if(!response.ok){

            return;

        }


        const data =
            await response.json();


        isFollowing =
            Boolean(
                data.following ??
                data.isFollowing ??
                false
            );


        updateFollowButton(
            isFollowing
        );

    }

    catch(error){

        console.log(
            "Follow status unavailable:",
            error
        );

    }

}


/* =========================================
   GET CREATOR ID
========================================= */

function getCreatorId(){

    if(!currentStream){

        return null;

    }


    return (
        currentStream.user_id ||
        currentStream.userId ||
        currentStream.creator_id ||
        currentStream.creatorId ||
        currentStream.owner_id ||
        currentStream.ownerId ||
        null
    );

}


/* =========================================
   FOLLOW CREATOR
========================================= */

async function followCreator(){

    if(!currentStream){

        alert(
            "Stream information is not available."
        );

        return;

    }


    const creatorId =
        getCreatorId();


    if(!creatorId){

        alert(
            "Creator information is unavailable."
        );

        return;

    }


    const token =
        localStorage.getItem(
            "canvasAuthToken"
        );


    if(!token){

        alert(
            "Please log in to follow this creator."
        );

        return;

    }


    const button =
        document.getElementById(
            "followButton"
        );


    if(button){

        button.disabled =
            true;

    }


    try{

        const response =
            await fetch(
                API_BASE +
                "/api/follow",
                {
                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            token

                    },

                    body:
                        JSON.stringify({

                            userId:
                                creatorId

                        })

                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Unable to follow creator."
            );

        }


        isFollowing =
            true;


        updateFollowButton(
            true
        );

    }

    catch(error){

        console.error(
            "Follow failed:",
            error
        );


        alert(
            error.message ||
            "Unable to follow creator."
        );


        if(button){

            button.disabled =
                false;

        }

    }

}


/* =========================================
   FOLLOW BUTTON UI
========================================= */

function updateFollowButton(
    following
){

    const button =
        document.getElementById(
            "followButton"
        );


    if(!button) return;


    if(following){

        button.textContent =
            "✓ Following";

        button.classList.add(
            "following"
        );

        button.disabled =
            false;

    }

    else{

        button.textContent =
            "❤️ Follow";

        button.classList.remove(
            "following"
        );

        button.disabled =
            false;

    }

}


/* =========================================
   FOLLOW BUTTON EVENT
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        const button =
            document.getElementById(
                "followButton"
            );


        if(button){

            button.addEventListener(
                "click",
                function(){

                    if(
                        !isFollowing
                    ){

                        followCreator();

                    }

                }
            );

        }

    }
);


/* =========================================
   SEND CHAT MESSAGE
========================================= */

async function sendChatMessage(){

    const input =
        document.getElementById(
            "chatInput"
        );


    if(!input) return;


    const message =
        input.value.trim();


    if(!message) return;


    const token =
        localStorage.getItem(
            "canvasAuthToken"
        );


    if(!token){

        alert(
            "Please log in to chat."
        );

        return;

    }


    if(!currentStream){

        return;

    }


    try{

        const response =
            await fetch(
                API_BASE +
                "/api/streams/" +
                encodeURIComponent(
                    currentStream.id
                ) +
                "/chat",
                {
                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            token

                    },

                    body:
                        JSON.stringify({

                            message:
                                message

                        })

                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Unable to send message."
            );

        }


        input.value =
            "";


        if(data.message){

            addChatMessage(
                data.message
            );

        }

    }

    catch(error){

        console.error(
            "Chat message failed:",
            error
        );


        alert(
            error.message ||
            "Unable to send message."
        );

    }

}


/* =========================================
   ADD CHAT MESSAGE
========================================= */

function addChatMessage(message){

    const chat =
        document.getElementById(
            "chatMessages"
        );


    if(!chat) return;


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "message";


    const username =
        message.name ||
        message.username ||
        "User";


    row.innerHTML =

        "<strong>" +

        escapeHTML(
            username
        ) +

        ":</strong> " +

        escapeHTML(
            message.message ||
            ""
        );


    chat.appendChild(
        row
    );


    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value){

    return String(
        value || ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================
   CHAT ENTER KEY
========================================= */

document.addEventListener(
    "keydown",
    function(event){

        const input =
            document.getElementById(
                "chatInput"
            );


        if(
            event.key === "Enter" &&
            document.activeElement === input
        ){

            event.preventDefault();

            sendChatMessage();

        }

    }
);


/* =========================================
   INITIAL LOAD
========================================= */

window.addEventListener(
    "DOMContentLoaded",
    function(){

        loadStream();

    }
);

</script>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<script>

/* =========================================
   CANVAS SOCKET
========================================= */

let canvasSocket = null;


/* =========================================
   VIEWER JOIN STATE
========================================= */

let viewerJoined = false;


/* =========================================
   CONNECT TO CANVAS SERVER
========================================= */

function connectCanvasSocket(){

    if(
        typeof io === "undefined"
    ){

        console.error(
            "Socket.IO client not loaded."
        );

        return;

    }


    if(canvasSocket){

        return;

    }


    try{

        canvasSocket =
            io(
                API_BASE,
                {
                    transports: [
                        "websocket",
                        "polling"
                    ]
                }
            );


        /* =================================
           CONNECTED
        ================================= */

        canvasSocket.on(
            "connect",
            function(){

                console.log(
                    "Canvas watch connected:",
                    canvasSocket.id
                );


                const streamId =
                    getStreamId();


                if(!streamId){

                    return;

                }


                /*
                 * Tell the backend that this
                 * viewer entered this stream.
                 */

                canvasSocket.emit(
                    "join-stream",
                    {
                        streamId:
                            streamId
                    }
                );


                viewerJoined =
                    true;

            }
        );


        /* =================================
           VIEWER COUNT
        ================================= */

        canvasSocket.on(
            "viewer-count",
            function(data){

                if(!data){

                    return;

                }


                const currentId =
                    getStreamId();


                /*
                 * Ignore counts belonging
                 * to another stream.
                 */

                if(
                    data.streamId &&
                    String(
                        data.streamId
                    ) !==
                    String(
                        currentId
                    )
                ){

                    return;

                }


                const viewers =
                    document.getElementById(
                        "viewerCount"
                    );


                if(
                    viewers &&
                    data.count !== undefined
                ){

                    const count =
                        Math.max(
                            0,
                            Number(
                                data.count
                            ) || 0
                        );


                    viewers.textContent =
                        count.toLocaleString() +
                        " Watching";

                }

            }
        );


        /* =================================
           STREAM UPDATED
        ================================= */

        canvasSocket.on(
            "stream-updated",
            function(stream){

                if(!stream){

                    return;

                }


                const currentId =
                    getStreamId();


                if(
                    stream.id &&
                    String(
                        stream.id
                    ) !==
                    String(
                        currentId
                    )
                ){

                    return;

                }


                currentStream =
                    {
                        ...(currentStream || {}),
                        ...stream
                    };


                renderStream(
                    currentStream
                );

            }
        );


        /* =================================
           NEW CHAT MESSAGE
        ================================= */

        canvasSocket.on(
            "chat-message",
            function(message){

                if(!message){

                    return;

                }


                const currentId =
                    getStreamId();


                if(
                    message.streamId &&
                    String(
                        message.streamId
                    ) !==
                    String(
                        currentId
                    )
                ){

                    return;

                }


                addChatMessage(
                    message
                );

            }
        );


        /* =================================
           STREAM ENDED
        ================================= */

        canvasSocket.on(
            "stream-ended",
            function(stream){

                const currentId =
                    getStreamId();


                if(
                    stream &&
                    stream.id &&
                    String(
                        stream.id
                    ) !==
                    String(
                        currentId
                    )
                ){

                    return;

                }


                showStreamEnded();

            }
        );


        /* =================================
           DISCONNECTED
        ================================= */

        canvasSocket.on(
            "disconnect",
            function(){

                console.log(
                    "Canvas watch disconnected."
                );


                viewerJoined =
                    false;

            }
        );


        /* =================================
           CONNECTION ERROR
        ================================= */

        canvasSocket.on(
            "connect_error",
            function(error){

                console.error(
                    "Canvas Socket error:",
                    error.message
                );

            }
        );

    }

    catch(error){

        console.error(
            "Canvas socket setup failed:",
            error
        );

    }

}


/* =========================================
   LEAVE CURRENT STREAM
========================================= */

function leaveCurrentStream(){

    if(
        !canvasSocket ||
        !canvasSocket.connected
    ){

        return;

    }


    const streamId =
        getStreamId();


    if(!streamId){

        return;

    }


    if(viewerJoined){

        canvasSocket.emit(
            "leave-stream",
            {
                streamId:
                    streamId
            }
        );


        viewerJoined =
            false;

    }

}


/* =========================================
   STREAM ENDED SCREEN
========================================= */

function showStreamEnded(){

    const video =
        document.getElementById(
            "liveVideo"
        );


    if(video){

        try{

            video.pause();

        }

        catch(error){

            console.log(
                "Video pause failed."
            );

        }


        video.removeAttribute(
            "src"
        );

        video.load();

        video.style.display =
            "none";

    }


    const message =
        document.getElementById(
            "videoMessage"
        );


    if(message){

        message.textContent =
            "This live stream has ended.";

        message.classList.remove(
            "hidden"
        );

    }


    const followButton =
        document.getElementById(
            "followButton"
        );


    if(followButton){

        followButton.disabled =
            true;

    }

}


/* =========================================
   PROFILE PICTURE SYNC
========================================= */

function loadProfilePicture(){

    const savedProfile =
        localStorage.getItem(
            "canvasProfile"
        );


    if(!savedProfile){

        return;

    }


    try{

        const profile =
            JSON.parse(
                savedProfile
            );


        if(
            !profile ||
            !profile.photo
        ){

            return;

        }


        /* ================================
           TOP PROFILE
        ================================= */

        const topProfile =
            document.getElementById(
                "topProfileIcon"
            );


        if(topProfile){

            topProfile.innerHTML =
                '<img class="top-profile-image" src="' +
                escapeHTML(
                    profile.photo
                ) +
                '" alt="Profile">';

        }


        /* ================================
           BOTTOM PROFILE
        ================================= */

        const bottomProfile =
            document.getElementById(
                "bottomProfileIcon"
            );


        if(bottomProfile){

            bottomProfile.innerHTML =
                '<img class="bottom-profile-image" src="' +
                escapeHTML(
                    profile.photo
                ) +
                '" alt="Profile">' +
                '<span>Profile</span>';

        }

    }

    catch(error){

        console.error(
            "Profile picture sync failed:",
            error
        );

    }

}


/* =========================================
   STREAM REFRESH
========================================= */

let streamRefreshTimer =
    null;


function startStreamRefresh(){

    streamRefreshTimer =
        setInterval(
            async function(){

                /*
                 * Socket.IO handles real-time
                 * updates while connected.
                 */

                if(
                    canvasSocket &&
                    canvasSocket.connected
                ){

                    return;

                }


                const streamId =
                    getStreamId();


                if(!streamId){

                    return;

                }


                try{

                    const response =
                        await fetch(
                            API_BASE +
                            "/api/streams/" +
                            encodeURIComponent(
                                streamId
                            )
                        );


                    if(
                        response.status ===
                        404
                    ){

                        showStreamEnded();

                        return;

                    }


                    if(!response.ok){

                        return;

                    }


                    const data =
                        await response.json();


                    const stream =
                        data.stream ||
                        data;


                    if(stream){

                        currentStream =
                            stream;

                        renderStream(
                            stream
                        );

                    }

                }

                catch(error){

                    console.error(
                        "Watch refresh failed:",
                        error
                    );

                }

            },
            10000
        );

}


/* =========================================
   STOP REFRESH
========================================= */

function stopStreamRefresh(){

    if(
        streamRefreshTimer
    ){

        clearInterval(
            streamRefreshTimer
        );

        streamRefreshTimer =
            null;

    }

}


/* =========================================
   INITIAL WATCH PAGE
========================================= */

window.addEventListener(
    "DOMContentLoaded",
    function(){

        loadProfilePicture();

        connectCanvasSocket();

        startStreamRefresh();

    }
);


/* =========================================
   CLOSE WATCH PAGE
========================================= */

window.addEventListener(
    "beforeunload",
    function(){

        stopStreamRefresh();

        leaveCurrentStream();


        if(canvasSocket){

            canvasSocket.disconnect();

            canvasSocket =
                null;

        }

    }
);


/* =========================================
   PAGE VISIBILITY
========================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(document.hidden){

            /*
             * Don't destroy the socket here.
             * Mobile browsers can temporarily
             * hide the page without the viewer
             * actually leaving.
             */

            return;

        }


        if(
            !canvasSocket ||
            !canvasSocket.connected
        ){

            loadStream();

            connectCanvasSocket();

        }

    }
);

</script>
