<style>

/* =========================================
   WATCH PAGE
========================================= */

.watch-page{
    width:100%;
    max-width:900px;
    margin:0 auto;
    padding:25px 15px 100px;
}


/* =========================================
   VIDEO
========================================= */

.watch-video-box{
    width:100%;
    aspect-ratio:16 / 9;
    background:#251b17;
    border-radius:20px;
    overflow:hidden;
    position:relative;
    border:1px solid #eaded6;
    box-shadow:
        0 8px 25px rgba(75,51,38,0.12);
    display:flex;
    align-items:center;
    justify-content:center;
}


#liveVideo{
    width:100%;
    height:100%;
    display:block;
    object-fit:contain;
    background:#000;
}


.video-message{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:90%;
    text-align:center;
    color:#fff;
    font-size:16px;
    font-weight:700;
    z-index:2;
}


.video-message.hidden{
    display:none;
}


/* =========================================
   LIVE BADGE
========================================= */

.watch-live-badge{
    position:absolute;
    top:12px;
    left:12px;
    padding:6px 11px;
    border-radius:8px;
    background:#d93025;
    color:#fff;
    font-size:12px;
    font-weight:800;
    z-index:5;
}


/* =========================================
   WATCH INFORMATION
========================================= */

.watch-info{
    margin-top:16px;
    padding:18px;
    background:#fff;
    border:1px solid #eaded6;
    border-radius:18px;
    box-shadow:
        0 5px 18px rgba(75,51,38,0.06);
}


.watch-title{
    color:#4b3326;
    font-size:24px;
    font-weight:800;
    line-height:1.3;
    margin-bottom:10px;
    word-break:break-word;
}


.creator-row{
    display:flex;
    align-items:center;
    gap:10px;
}


.creator-picture{
    width:40px;
    height:40px;
    flex-shrink:0;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #d4a62a;
    background:#f1f1f1;
}


.creator-details{
    min-width:0;
    flex:1;
}


.creator-name{
    color:#4b3326;
    font-size:16px;
    font-weight:800;
}


.creator-username{
    color:#806c60;
    font-size:13px;
    margin-top:3px;
}


.viewer-count{
    margin-top:12px;
    color:#75645b;
    font-size:14px;
}


/* =========================================
   FOLLOW
========================================= */

.follow-button{
    margin-top:15px;
    padding:12px 20px;
    border:none;
    border-radius:12px;
    background:#4b3326;
    color:#fff;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
}


.follow-button:active{
    transform:scale(.97);
}


/* =========================================
   ERROR
========================================= */

.watch-error{
    padding:40px 20px;
    text-align:center;
    background:#fff8f6;
    border:1px solid #f0d8d3;
    border-radius:18px;
    color:#8a3028;
}


.watch-error h2{
    margin-bottom:10px;
    color:#6f2d26;
}


.watch-error p{
    color:#806c60;
    font-size:14px;
    line-height:1.5;
}


/* =========================================
   BOTTOM NAV
========================================= */

.bottom-nav{
    position:fixed;
    left:0;
    bottom:0;
    width:100%;
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-around;
    padding:5px 7px;
    background:#fff;
    border-top:none !important;
    box-shadow:
        0 -5px 20px rgba(75,51,38,.08);
    z-index:1000;
}


.bottom-nav a{
    flex:1;
    min-width:0;
    height:58px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    border-radius:12px;
    color:#4b3326;
    text-decoration:none;
    font-size:23px;
    position:relative;
}


.bottom-nav a span{
    font-size:10px;
    font-weight:700;
}


/* =========================================
   EXACT EXPLORE ICON
========================================= */

.explore-icon{
    width:23px;
    height:23px;
    display:block;
}


/* =========================================
   REMOVE MUSTARD ACTIVE SPOT
========================================= */

.bottom-nav a::before,
.bottom-nav a::after,
.bottom-nav a.active::before,
.bottom-nav a.active::after{
    content:none !important;
    display:none !important;
}


.bottom-nav a.active{
    background:transparent !important;
    box-shadow:none !important;
}


/* =========================================
   TOP PROFILE
========================================= */

#topProfileIcon{
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border-radius:50%;

#topProfileIcon img{

/* =========================================

========================================= */

@media(max-width:600px){

    }


    .watch-title{
        font-size:21px;
    }


    .creator-picture{
        width:37px;
        height:37px;
    }

}

</style>

<script>

const API_BASE =
    "https://canvas-kh9p.onrender.com";


let currentStream = null;

let selectedSupport = 0;

let selectedGift = null;


/* =========================================
   CHAT DUPLICATE PROTECTION
========================================= */

const displayedChatIds =
    new Set();

const recentChatMessages =
    new Map();


function getChatMessageKey(message){

    if(!message){
        return "";
    }


    const id =
        message.id ||
        message.message_id ||
        message.chat_id ||
        message.chatId;


    if(id){

        return "id:" + String(id);

    }


    return "text:" +
        (
            message.name ||
            message.username ||
            "User"
        ) +
        "|" +
        (
            message.message ||
            ""
        ).trim();

}


/* =========================================
   GET STREAM ID
========================================= */

function getStreamId(){

    const params =
        new URLSearchParams(
            window.location.search
        );


    return (
        params.get("id") ||
        params.get("stream")
    );

}


/* =========================================
   LOAD STREAM
========================================= */

async function loadStream(){

    const streamId =
        getStreamId();


    if(!streamId){

        showStreamError(
            "No stream was selected."
        );

        return;

    }


    try{

        const response =
            await fetch(
                API_BASE +
                "/api/streams/" +
                encodeURIComponent(
                    streamId
                )
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Unable to load Canvas stream."
            );

        }


        currentStream =
            data.stream ||
            data;


        renderStream(
            currentStream
        );

    }

    catch(error){

        console.error(
            "Unable to load Canvas stream:",
            error
        );


        showStreamError(
            "Unable to load Canvas stream."
        );

    }

}


/* =========================================
   RENDER STREAM
========================================= */

function renderStream(stream){

    if(!stream){
        return;
    }


    const title =
        document.getElementById(
            "streamTitle"
        );


    if(title){

        title.textContent =
            stream.title ||
            "Canvas Live Stream";

    }


    const creator =
        document.getElementById(
            "creatorName"
        );


    if(creator){

        creator.textContent =
            stream.name ||
            stream.username ||
            "Canvas Creator";

    }


    const username =
        document.getElementById(
            "creatorUsername"
        );


    if(username){

        username.textContent =
            stream.username
                ? "@" +
                  stream.username
                : "";

    }


    const viewers =
        document.getElementById(
            "viewerCount"
        );


    if(viewers){

        const count =
            Number(
                stream.viewer_count ||
                stream.viewers ||
                0
            );


        viewers.textContent =
            count.toLocaleString() +
            " Watching";

    }


    const creatorContainer =
        document.getElementById(
            "creatorPictureContainer"
        );


    const profilePhoto =
        stream.profile_picture ||
        stream.profileImage ||
        stream.profilePhoto ||
        stream.avatar ||
        stream.userPhoto ||
        "";


    if(
        creatorContainer &&
        profilePhoto
    ){

        creatorContainer.innerHTML =
            '<img class="creator-picture" src="' +
            escapeHTML(profilePhoto) +
            '" alt="Profile">';

    }


    const video =
        document.getElementById(
            "liveVideo"
        );


    if(video){

        const thumbnail =
            stream.thumbnail ||
            stream.thumbnail_url ||
            stream.thumbnailUrl ||
            "";


        if(thumbnail){

            video.poster =
                thumbnail;

        }

    }


    setupVideo(
        stream
    );

}


/* =========================================
   VIDEO SETUP
========================================= */

function setupVideo(stream){

    const video =
        document.getElementById(
            "liveVideo"
        );


    if(!video){
        return;
    }


    const videoUrl =
        stream.video_url ||
        stream.videoUrl ||
        stream.playback_url ||
        stream.playbackUrl ||
        stream.stream_url ||
        stream.streamUrl ||
        "";


    if(videoUrl){

        video.src =
            videoUrl;

        video.load();

    }

}


/* =========================================
   STREAM ERROR
========================================= */

function showStreamError(message){

    const errorBox =
        document.getElementById(
            "streamError"
        );


    if(errorBox){

        errorBox.textContent =
            message;

        errorBox.style.display =
            "block";

    }


    const video =
        document.getElementById(
            "liveVideo"
        );


    if(video){

        video.style.display =
            "none";

    }

}

</script>
<script>

/* =========================================
   FOLLOW CREATOR
========================================= */

async function followCreator(){

    if(!currentStream){

        alert(
            "Stream information is not available."
        );

        return;

    }


    const creatorId =
        currentStream.user_id ||
        currentStream.userId ||
        currentStream.creator_id ||
        currentStream.creatorId;


    if(!creatorId){

        alert(
            "Creator information is unavailable."
        );

        return;

    }


    const token =
        localStorage.getItem(
            "canvasAuthToken"
        );


    if(!token){

        alert(
            "Please log in to follow this creator."
        );

        return;

    }


    try{

        const response =
            await fetch(
                API_BASE +
                "/api/follow",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            token
                    },

                    body:
                        JSON.stringify({
                            userId:
                                creatorId
                        })
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Unable to follow creator."
            );

        }


        updateFollowButton(true);

    }

    catch(error){

        console.error(
            "Follow failed:",
            error
        );


        alert(
            error.message ||
            "Unable to follow creator."
        );

    }

}


/* =========================================
   FOLLOW BUTTON
========================================= */

function updateFollowButton(isFollowing){

    const button =
        document.getElementById(
            "followButton"
        );


    if(!button){
        return;
    }


    if(isFollowing){

        button.textContent =
            "✓ Following";

        button.classList.add(
            "following"
        );

    }

    else{

        button.textContent =
            "❤️ Follow";

        button.classList.remove(
            "following"
        );

    }

}


/* =========================================
   GIFT PANEL
========================================= */

function toggleGiftPanel(){

    const panel =
        document.getElementById(
            "giftPanel"
        );


    if(!panel){
        return;
    }


    panel.classList.toggle(
        "active"
    );

}


/* =========================================
   MONEY TAB
========================================= */

function showMoney(){

    const money =
        document.getElementById(
            "moneyOptions"
        );


    const gifts =
        document.getElementById(
            "giftOptions"
        );


    if(money){

        money.style.display =
            "flex";

    }


    if(gifts){

        gifts.style.display =
            "none";

    }


    selectedGift =
        null;

}


/* =========================================
   GIFTS TAB
========================================= */

function showGifts(){

    const money =
        document.getElementById(
            "moneyOptions"
        );


    const gifts =
        document.getElementById(
            "giftOptions"
        );


    if(money){

        money.style.display =
            "none";

    }


    if(gifts){

        gifts.style.display =
            "flex";

    }


    selectedSupport =
        0;

}


/* =========================================
   SELECT SUPPORT
========================================= */

function selectSupport(amount){

    selectedSupport =
        Number(amount) || 0;

    selectedGift =
        null;

    updateSelectedSupport();

}


/* =========================================
   SELECT GIFT
========================================= */

function selectGift(
    emoji,
    name,
    amount
){

    selectedGift = {

        emoji:emoji,

        name:name,

        amount:
            Number(amount) || 0

    };


    selectedSupport =
        selectedGift.amount;


    updateSelectedSupport();

}


/* =========================================
   SUPPORT STATUS
========================================= */

function updateSelectedSupport(){

    const status =
        document.getElementById(
            "supportStatus"
        );


    if(!status){
        return;
    }


    if(selectedGift){

        status.textContent =
            "Selected: " +
            selectedGift.emoji +
            " " +
            selectedGift.name +
            " ($" +
            selectedGift.amount +
            ")";

        return;

    }


    if(selectedSupport > 0){

        status.textContent =
            "Selected support: $" +
            selectedSupport;

        return;

    }


    status.textContent =
        "Select an amount or gift.";

}


/* =========================================
   SEND SUPPORT
========================================= */

async function sendGift(){

    if(selectedSupport <= 0){

        alert(
            "Please select a gift or amount first."
        );

        return;

    }


    if(!currentStream){

        alert(
            "Stream information is unavailable."
        );

        return;

    }


    const token =
        localStorage.getItem(
            "canvasAuthToken"
        );


    if(!token){

        alert(
            "Please log in to support a creator."
        );

        return;

    }


    const creatorId =
        currentStream.user_id ||
        currentStream.userId ||
        currentStream.creator_id ||
        currentStream.creatorId;


    if(!creatorId){

        alert(
            "Creator information is unavailable."
        );

        return;

    }


    const payload = {

        creatorId:creatorId,

        streamId:
            currentStream.id,

        amount:
            selectedSupport,

        type:
            selectedGift
                ? "gift"
                : "money"

    };


    if(selectedGift){

        payload.gift =
            selectedGift.name;

        payload.emoji =
            selectedGift.emoji;

    }


    try{

        const response =
            await fetch(
                API_BASE +
                "/api/support",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            token
                    },

                    body:
                        JSON.stringify(
                            payload
                        )
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Support could not be sent."
            );

        }


        alert(
            selectedGift
                ? "You sent " +
                  selectedGift.emoji +
                  " " +
                  selectedGift.name +
                  "! ❤️"
                : "You supported the creator with $" +
                  selectedSupport +
                  "! ❤️"
        );


        selectedSupport = 0;

        selectedGift = null;

        updateSelectedSupport();

        toggleGiftPanel();

    }

    catch(error){

        console.error(
            "Support failed:",
            error
        );


        alert(
            error.message ||
            "Unable to send support."
        );

    }

}


/* =========================================
   SEND CHAT MESSAGE
========================================= */

async function sendChatMessage(){

    const input =
        document.getElementById(
            "chatInput"
        );


    if(!input){
        return;
    }


    const message =
        input.value.trim();


    if(!message){
        return;
    }


    const token =
        localStorage.getItem(
            "canvasAuthToken"
        );


    if(!token){

        alert(
            "Please log in to chat."
        );

        return;

    }


    if(!currentStream){
        return;
    }


    try{

        const response =
            await fetch(
                API_BASE +
                "/api/streams/" +
                encodeURIComponent(
                    currentStream.id
                ) +
                "/chat",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            token
                    },

                    body:
                        JSON.stringify({
                            message:message
                        })
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Unable to send message."
            );

        }


        input.value = "";


        /*
         * IMPORTANT:
         * Do NOT manually add the returned
         * message here.
         *
         * The server broadcasts it through
         * Socket.IO. Adding it here AND when
         * Socket.IO receives it caused:
         *
         * hi
         * hi
         *
         * This is the duplicate-chat fix.
         */

    }

    catch(error){

        console.error(
            "Chat message failed:",
            error
        );


        alert(
            error.message ||
            "Unable to send message."
        );

    }

}


/* =========================================
   ADD CHAT MESSAGE
========================================= */

function addChatMessage(message){

    const chat =
        document.getElementById(
            "chatMessages"
        );


    if(!chat || !message){
        return;
    }


    const key =
        getChatMessageKey(message);


    if(key){

        if(
            displayedChatIds.has(key)
        ){

            return;

        }


        const now =
            Date.now();


        const previous =
            recentChatMessages.get(
                key
            );


        /*
         * Protect against the same message
         * arriving from multiple realtime
         * paths within a short period.
         */

        if(
            previous &&
            now - previous < 5000
        ){

            return;

        }


        recentChatMessages.set(
            key,
            now
        );


        displayedChatIds.add(
            key
        );

    }


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "message";


    const username =
        message.name ||
        message.username ||
        "User";


    row.innerHTML =
        "<strong>" +
        escapeHTML(username) +
        ":</strong> " +
        escapeHTML(
            message.message ||
            ""
        );


    chat.appendChild(
        row
    );


    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value){

    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================
   CHAT ENTER KEY
========================================= */

document.addEventListener(
    "keydown",
    function(event){

        const input =
            document.getElementById(
                "chatInput"
            );


        if(
            event.key === "Enter" &&
            document.activeElement === input
        ){

            event.preventDefault();

            sendChatMessage();

        }

    }
);


/* =========================================
   INITIAL LOAD
========================================= */

window.addEventListener(
    "DOMContentLoaded",
    function(){

        loadStream();

        updateSelectedSupport();

    }
);

</script>
<script>

/* =========================================
   CANVAS SOCKET
========================================= */

let canvasSocket = null;


/* =========================================
   CONNECT TO CANVAS SERVER
========================================= */

function connectCanvasSocket(){

    if(typeof io === "undefined"){
        console.error("Socket.IO client not loaded.");
        return;
    }


    if(canvasSocket){
        return;
    }


    try{

        canvasSocket =
            io(
                API_BASE,
                {
                    transports:[
                        "websocket",
                        "polling"
                    ]
                }
            );


        canvasSocket.on(
            "connect",
            function(){

                console.log(
                    "Canvas watch connected:",
                    canvasSocket.id
                );


                const streamId =
                    getStreamId();


                if(streamId){

                    canvasSocket.emit(
                        "join-stream",
                        {
                            streamId:streamId
                        }
                    );

                }

            }
        );


        /* =====================================
           STREAM UPDATED
        ===================================== */

        canvasSocket.on(
            "stream-updated",
            function(stream){

                if(!stream){
                    return;
                }


                const currentId =
                    getStreamId();


                const incomingId =
                    stream.id ||
                    stream.stream_id ||
                    stream.streamId;


                if(
                    incomingId &&
                    String(incomingId) !==
                    String(currentId)
                ){

                    return;

                }


                currentStream = {
                    ...(currentStream || {}),
                    ...stream
                };


                renderStream(
                    currentStream
                );

            }
        );


        /* =====================================
           VIEWER COUNT
        ===================================== */

        canvasSocket.on(
            "viewer-count",
            function(data){

                if(!data){
                    return;
                }


                const currentId =
                    getStreamId();


                if(
                    data.streamId &&
                    String(data.streamId) !==
                    String(currentId)
                ){

                    return;

                }


                const viewers =
                    document.getElementById(
                        "viewerCount"
                    );


                if(
                    viewers &&
                    data.count !== undefined
                ){

                    viewers.textContent =
                        Number(
                            data.count
                        ).toLocaleString() +
                        " Watching";

                }

            }
        );


        /* =====================================
           CHAT MESSAGE
        ===================================== */

        canvasSocket.on(
            "chat-message",
            function(message){

                if(!message){
                    return;
                }


                const currentId =
                    getStreamId();


                const messageStreamId =
                    message.streamId ||
                    message.stream_id;


                if(
                    messageStreamId &&
                    String(messageStreamId) !==
                    String(currentId)
                ){

                    return;

                }


                /*
                 * Only Socket.IO adds the message.
                 * sendChatMessage() does not add it,
                 * preventing "hi hi" duplicates.
                 */

                addChatMessage(
                    message
                );

            }
        );


        /* =====================================
           STREAM ENDED
        ===================================== */

        canvasSocket.on(
            "stream-ended",
            function(stream){

                const currentId =
                    getStreamId();


                if(stream){

                    const incomingId =
                        stream.id ||
                        stream.stream_id ||
                        stream.streamId;


                    if(
                        incomingId &&
                        String(incomingId) !==
                        String(currentId)
                    ){

                        return;

                    }

                }


                showStreamEnded();

            }
        );


        /* =====================================
           DISCONNECT
        ===================================== */

        canvasSocket.on(
            "disconnect",
            function(reason){

                console.log(
                    "Canvas watch disconnected:",
                    reason
                );

            }
        );


        /* =====================================
           CONNECTION ERROR
        ===================================== */

        canvasSocket.on(
            "connect_error",
            function(error){

                console.error(
                    "Canvas Socket error:",
                    error.message
                );

            }
        );

    }

    catch(error){

        console.error(
            "Canvas socket setup failed:",
            error
        );

    }

}


/* =========================================
   STREAM ENDED
========================================= */

function showStreamEnded(){

    const video =
        document.getElementById(
            "liveVideo"
        );


    if(video){

        try{
            video.pause();
        }
        catch(error){}


        video.removeAttribute(
            "src"
        );


        video.load();


        video.style.display =
            "none";

    }


    const message =
        document.getElementById(
            "videoMessage"
        );


    if(message){

        message.textContent =
            "This live stream has ended.";

        message.classList.remove(
            "hidden"
        );

    }


    const badge =
        document.getElementById(
            "liveBadge"
        );


    if(badge){

        badge.style.display =
            "none";

    }


    const followButton =
        document.getElementById(
            "followButton"
        );


    if(followButton){

        followButton.disabled =
            true;

    }


    const giftPanel =
        document.getElementById(
            "giftPanel"
        );


    if(giftPanel){

        giftPanel.classList.remove(
            "active"
        );

    }

}


/* =========================================
   PROFILE PICTURE SYNC
========================================= */

function loadProfilePicture(){

    const savedProfile =
        localStorage.getItem(
            "canvasProfile"
        );


    if(!savedProfile){
        return;
    }


    try{

        const profile =
            JSON.parse(
                savedProfile
            );


        if(!profile){
            return;
        }


        const photo =
            profile.photo ||
            profile.profileImage ||
            profile.profilePhoto ||
            profile.image ||
            profile.profile_picture ||
            "";


        if(!photo){
            return;
        }


        const topProfile =
            document.getElementById(
                "topProfileIcon"
            );


        if(topProfile){

            topProfile.innerHTML =
                '<img src="' +
                escapeHTML(photo) +
                '" alt="Profile">';

        }


        const bottomProfile =
            document.getElementById(
                "bottomProfileIcon"
            );


        if(bottomProfile){

            bottomProfile.innerHTML =
                '<img src="' +
                escapeHTML(photo) +
                '" alt="Profile">' +
                '<span>Profile</span>';

        }

    }

    catch(error){

        console.error(
            "Profile picture sync failed:",
            error
        );

    }

}


/* =========================================
   PROFILE PHOTO UPDATE
========================================= */

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key ===
            "canvasProfile"
        ){

            loadProfilePicture();

        }

    }
);

</script>
<script>

/* =========================================
   STREAM REFRESH
========================================= */

let streamRefreshTimer = null;


function startStreamRefresh(){

    if(streamRefreshTimer){

        clearInterval(
            streamRefreshTimer
        );

    }


    streamRefreshTimer =
        setInterval(
            async function(){

                /*
                 * Socket.IO handles live updates.
                 * REST is only the fallback.
                 */

                if(
                    canvasSocket &&
                    canvasSocket.connected
                ){

                    return;

                }


                const streamId =
                    getStreamId();


                if(!streamId){
                    return;
                }


                try{

                    const response =
                        await fetch(
                            API_BASE +
                            "/api/streams/" +
                            encodeURIComponent(
                                streamId
                            ),
                            {
                                method:"GET",
                                headers:{
                                    "Accept":
                                        "application/json"
                                },
                                cache:"no-store"
                            }
                        );


                    if(
                        response.status === 404
                    ){

                        showStreamEnded();

                        return;

                    }


                    if(!response.ok){
                        return;
                    }


                    const data =
                        await response.json();


                    const stream =
                        data.stream ||
                        data;


                    if(stream){

                        currentStream =
                            stream;

                        renderStream(
                            stream
                        );

                    }

                }

                catch(error){

                    console.error(
                        "Watch refresh failed:",
                        error
                    );

                }

            },
            10000
        );

}


/* =========================================
   STOP REFRESH
========================================= */

function stopStreamRefresh(){

    if(streamRefreshTimer){

        clearInterval(
            streamRefreshTimer
        );

        streamRefreshTimer = null;

    }

}


/* =========================================
   INITIAL WATCH PAGE
========================================= */

window.addEventListener(
    "DOMContentLoaded",
    function(){

        loadProfilePicture();

        connectCanvasSocket();

        startStreamRefresh();

    }
);


/* =========================================
   PAGE SHOW
========================================= */

window.addEventListener(
    "pageshow",
    function(){

        loadProfilePicture();

    }
);


/* =========================================
   PAGE VISIBILITY
========================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(document.hidden){
            return;
        }


        loadProfilePicture();


        if(
            !canvasSocket ||
            !canvasSocket.connected
        ){

            loadStream();

            connectCanvasSocket();

        }

    }
);


/* =========================================
   CLOSE WATCH PAGE
========================================= */

window.addEventListener(
    "beforeunload",
    function(){

        stopStreamRefresh();


        if(canvasSocket){

            const streamId =
                getStreamId();


            if(streamId){

                try{

                    canvasSocket.emit(
                        "leave-stream",
                        {
                            streamId:
                                streamId
                        }
                    );

                }

                catch(error){}

            }


            canvasSocket.disconnect();

            canvasSocket = null;

        }

    }
);

</script>
