 /* =========================================
    LOCAL PROFILE PHOTO
 ========================================= */

 function findLocalProfilePhoto(){

     const keys = [

         "canvasProfile",
         "canvasAccount"

     ];


     for(
         const key of keys
     ){

         const value =
             localStorage.getItem(
                 key
             );


         if(!value){

             continue;

         }


         try{

             const parsed =
                 JSON.parse(
                     value
                 );


             const photo =
                 getValue(
                     parsed,
                     [
                         "profilePhoto",
                         "profile_photo",
                         "profilePicture",
                         "profile_picture",
                         "avatar",
                         "photo",
                         "image",
                         "picture",
                         "photoUrl",
                         "photoURL",
                         "profilePhotoUrl",
                         "profile_picture_url",
                         "avatarUrl",
                         "avatarURL"
                     ],
                     ""
                 );


             if(photo){

                 return String(
                     photo
                 );

             }

         }catch(error){

             console.warn(
                 "Unable to read local profile:",
                 error
             );

         }

     }


     return "";

 }


 /* =========================================
    BOTTOM PROFILE ICON
 ========================================= */

 function updateBottomProfileIcon(){

     const profileNav =
         document.querySelector(
             '.bottom-nav a[href="profile.html"]'
         );


     if(!profileNav){

         return;

     }


     const photo =
         findLocalProfilePhoto();


     /*
        Only update the navigation icon when
        its actual state changed.
     */

     const currentState =
         profileNav.dataset.profilePhoto ||
         "";


     if(
         currentState ===
         photo
     ){

         return;

     }


     profileNav.dataset.profilePhoto =
         photo;


     if(photo){

         profileNav.innerHTML =
             "";


         const image =
             document.createElement(
                 "img"
             );


         image.src =
             photo;


         image.alt =
             "Profile";


         image.style.width =
             "25px";


         image.style.height =
             "25px";


         image.style.borderRadius =
             "50%";


         image.style.objectFit =
             "cover";


         profileNav.appendChild(
             image
         );


     }else{

         profileNav.innerHTML =
             "⬤";

     }


     /*
        Keep the existing Profile label.
     */

     const label =
         document.createElement(
             "span"
         );


     label.textContent =
         "Profile";


     profileNav.appendChild(
         label
     );

 }


 /* =========================================
    STORAGE SYNC
 ========================================= */

 window.addEventListener(
     "storage",
     event => {

         if(
             event.key ===
                 "canvasProfile" ||
             event.key ===
                 "canvasAccount" ||
             event.key ===
                 "canvasAuthToken"
         ){

             updateBottomProfileIcon();

         }

     }
 );


 /* =========================================
    ONLINE EVENT
 ========================================= */

 window.addEventListener(
     "online",
     () => {

         /*
            Avoid an immediate duplicate refresh
            if another lifecycle event just ran.
         */

         refreshStream();


         if(
             !socket ||
             !socket.connected
         ){

             connectSocket();

         }else{

             joinCurrentStream();

         }

     }
 );


 /* =========================================
    VISIBILITY CHANGE
 ========================================= */

 document.addEventListener(
     "visibilitychange",
     () => {

         if(
             document.visibilityState !==
             "visible"
         ){

             return;

         }


         /*
            refreshStream() is throttled, so
            returning to the page does not cause
            a burst of API requests.
         */

         refreshStream();


         if(
             !socket ||
             !socket.connected
         ){

             connectSocket();

         }else{

             joinCurrentStream();

         }

     }
 );
   /* =========================================
    INITIALIZE CANVAS WATCH
 ========================================= */

 async function initializeCanvasWatch(){

     leavingStream =
         false;


     updateBottomProfileIcon();


     await loadStream();


     connectSocket();


     /*
        Give the socket a moment to establish
        before attempting the compatibility
        join events.
     */

     setTimeout(
         () => {

             if(
                 !leavingStream
             ){

                 joinCurrentStream();

             }

         },
         500
     );


     startStreamRefresh();

 }


 /* =========================================
    DOM READY
 ========================================= */

 if(
     document.readyState ===
     "loading"
 ){

     document.addEventListener(
         "DOMContentLoaded",
         initializeCanvasWatch,
         {
             once:
                 true
         }
     );

 }else{

     initializeCanvasWatch();

 }


 /* =========================================
    PAGE SHOW
 ========================================= */

 window.addEventListener(
     "pageshow",
     () => {

         if(
             !currentStreamId
         ){

             initializeCanvasWatch();

             return;

         }


         leavingStream =
             false;


         refreshStream();


         if(
             !socket ||
             !socket.connected
         ){

             connectSocket();

         }else{

             joinCurrentStream();

         }

     }
 );


 /* =========================================
    BEFORE UNLOAD
 ========================================= */

 window.addEventListener(
     "beforeunload",
     () => {

         leaveCurrentStream();

     }
 );


 /* =========================================
    PAGE HIDE
 ========================================= */

 window.addEventListener(
     "pagehide",
     () => {

         leaveCurrentStream();


         if(refreshTimer){

             clearInterval(
                 refreshTimer
             );


             refreshTimer =
                 null;

         }

     }
 );


 /* =========================================
    PROFILE SYNC
 ========================================= */

 /*
    REMOVED:
    The old 1000ms setInterval profile polling
    caused unnecessary work and contributed to
    Watch-page lag.

    Profile updates are now handled by:
    - initial sync
    - storage event
    - final sync below
 */

 function syncProfileIcon(){

     updateBottomProfileIcon();

 }


 syncProfileIcon();


 /* =========================================
    CHAT INPUT SCROLL
 ========================================= */

 if(chatInput){

     chatInput.addEventListener(
         "focus",
         () => {

             setTimeout(
                 () => {

                     if(
                         chatMessages
                     ){

                         scrollChatToBottom();

                     }

                 },
                 100
             );

         }
     );


     chatInput.addEventListener(
         "input",
         () => {

             /*
                Keep the existing visual behavior
                without performing any expensive
                operations.
             */

             chatInput.style.opacity =
                 chatInput.value.length
                     ? "1"
                     : "1";

         }
     );

 }


 /* =========================================
    DOUBLE-SEND PROTECTION
 ========================================= */

 let sendingChat =
     false;


 const originalSendChatMessage =
     sendChatMessage;


 sendChatMessage =
     async function(
         messageText
     ){

         if(sendingChat){

             return;

         }


         const text =
             String(
                 messageText || ""
             ).trim();


         if(!text){

             return;

         }


         sendingChat =
             true;


         try{

             await originalSendChatMessage(
                 text
             );

         }finally{

             /*
                Small release delay prevents a
                double tap from creating duplicate
                messages while keeping the chat
                responsive.
             */

             setTimeout(
                 () => {

                     sendingChat =
                         false;

                 },
                 250
             );

         }

     };


 /* =========================================
    FOLLOW STATE REFRESH
 ========================================= */

 async function refreshFollowState(){

     /*
        loadFollowState() itself is throttled,
        so focus/visibility events cannot create
        repeated follow requests.
     */

     await loadFollowState();

 }


 /* =========================================
    WINDOW FOCUS
 ========================================= */

 let lastFocusRefresh =
     0;


 window.addEventListener(
     "focus",
     () => {

         const now =
             Date.now();


         /*
            Several mobile/browser lifecycle
            events can fire together. Only allow
            one focus refresh within 3 seconds.
         */

         if(
             now - lastFocusRefresh <
             3000
         ){

             return;

         }


         lastFocusRefresh =
             now;


         refreshStream();


         refreshFollowState();


         if(
             socket &&
             socket.connected
         ){

             joinCurrentStream();

         }else{

             connectSocket();

         }

     }
 );


 /* =========================================
    SOCKET RECONNECT
 ========================================= */

 function reconnectCanvasSocket(){

     if(leavingStream){

         return;

     }


     if(
         socket &&
         socket.connected
     ){

         joinCurrentStream();

         return;

     }


     connectSocket();

 }


 /* =========================================
    OFFLINE / ONLINE RETRY
 ========================================= */

 let retryTimer =
     null;


 window.addEventListener(
     "offline",
     () => {

         socketConnected =
             false;

     }
 );


 window.addEventListener(
     "online",
     () => {

         if(retryTimer){

             clearTimeout(
                 retryTimer
             );

         }


         retryTimer =
             setTimeout(
                 () => {

                     retryTimer =
                         null;


                     reconnectCanvasSocket();

                 },
                 300
             );

     }
 );


 /* =========================================
    CLEANUP
 ========================================= */

 function cleanupCanvasWatch(){

     leavingStream =
         true;


     if(refreshTimer){

         clearInterval(
             refreshTimer
         );


         refreshTimer =
             null;

     }


     if(retryTimer){

         clearTimeout(
             retryTimer
         );


         retryTimer =
             null;

     }


     leaveCurrentStream();


     if(socket){

         try{

             socket.removeAllListeners();

             socket.disconnect();

         }catch(error){

             console.warn(
                 "Socket cleanup failed:",
                 error
             );

         }


         socket =
             null;

     }


     socketConnected =
         false;


     joinedStreamId =
         null;

 }


 window.addEventListener(
     "unload",
     cleanupCanvasWatch
 );


 /* =========================================
    FINAL PROFILE SYNC
 ========================================= */

 /*
    One final lightweight sync instead of the
    previous continuous 1-second polling loop.
 */

 setTimeout(
     () => {

         if(
             !leavingStream
         ){

             updateBottomProfileIcon();

         }

     },
     500
 );


 /* =========================================
    RESIZE CHAT SCROLL
 ========================================= */

 window.addEventListener(
     "resize",
     () => {

         if(chatMessages){

             requestAnimationFrame(
                 () => {

                     scrollChatToBottom();

                 }
             );

         }

     }
 );


 /* =========================================
    GLOBAL ERROR LOGGING
 ========================================= */

 window.addEventListener(
     "error",
     event => {

         console.warn(
             "Canvas Watch error:",
             event.error ||
             event.message
         );

     }
 );


 window.addEventListener(
     "unhandledrejection",
     event => {

         console.warn(
             "Canvas Watch promise error:",
             event.reason
         );

     }
 );


 /* =========================================
    FINAL STREAM REFRESH
 ========================================= */

 setTimeout(
     () => {

         if(
             !leavingStream &&
             currentStreamId
         ){

             refreshStream(
                 true
             );

         }

     },
     1500
 );


 /* =========================================
    FINAL CHAT SCROLL
 ========================================= */

 setTimeout(
     () => {

         scrollChatToBottom();

     },
     300
 );

</script>
