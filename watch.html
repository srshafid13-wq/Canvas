<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Canvas - Watch Live</title>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>

/* =========================================
   CANVAS WATCH
========================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#fff;
    color:#4b3326;
    font-family:Arial,Helvetica,sans-serif;
    padding-bottom:82px;
}

/* =========================================
   TOP NAV
   SAME AS STREAM.HTML
========================================= */

.navbar{
    width:100%;
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    background:#fff;
    border-bottom:2px solid #d4a62a;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:32px;
    font-weight:800;
    color:#4b3326;
}

/* =========================================
   WATCH AREA
========================================= */

.watch-page{
    width:100%;
    max-width:900px;
    margin:0 auto;
    padding:24px 18px 30px;
}

/* =========================================
   STREAM PREVIEW
========================================= */

.stream-preview{
    position:relative;
    width:100%;
    aspect-ratio:16 / 9;
    overflow:hidden;
    background:#17120f;
    border:2px solid #d4a62a;
    border-radius:16px;
}

#liveVideo{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    background:#17120f;
}

.video-placeholder{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    text-align:center;
    color:#fff;
    font-size:15px;
    font-weight:700;
    background:#17120f;
}

.video-placeholder.hidden{
    display:none;
}

/* =========================================
   LIVE BADGE
========================================= */

.live-badge{
    position:absolute;
    top:14px;
    left:14px;
    z-index:5;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:58px;
    height:28px;
    padding:0 11px;
    border-radius:8px;
    background:#a33a2b;
    color:#fff;
    font-size:12px;
    font-weight:900;
    letter-spacing:.5px;
}

/* =========================================
   STREAM INFO
========================================= */

.stream-info{
    width:100%;
    margin-top:18px;
}

.watching-row{
    display:flex;
    align-items:center;
    gap:7px;
    color:#6d5a4c;
    font-size:14px;
    font-weight:700;
}

.watching-row strong{
    color:#4b3326;
    font-weight:900;
}

/* =========================================
   CREATOR
========================================= */

.creator-section{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-top:18px;
    padding:14px;
    background:#fff;
    border-radius:14px;
    border:1px solid rgba(75,51,38,.10);
}

.creator-profile-link{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
    color:inherit;
    text-decoration:none;
}

.creator-picture{
    width:38px;
    height:38px;
    flex:0 0 38px;
    border-radius:50%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f3f3f3;
    border:1.5px solid #d4a62a;
    color:#4b3326;
}

.creator-picture img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    border-radius:50%;
}

.creator-picture-placeholder{
    color:#4b3326;
    font-size:17px;
    font-weight:900;
}

.creator-details{
    min-width:0;
}

.creator-name{
    font-size:16px;
    font-weight:900;
    color:#4b3326;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.creator-username{
    margin-top:3px;
    color:#8b7667;
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* =========================================
   FOLLOW BUTTON
========================================= */

.follow-button{
    min-width:100px;
    height:38px;
    padding:0 17px;
    border:none;
    border-radius:10px;
    background:#4b3326;
    color:#fff;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
    transition:opacity .15s ease,transform .15s ease;
}

.follow-button:hover{
    opacity:.92;
}

.follow-button:active{
    transform:scale(.97);
}

.follow-button.following{
    background:#4b3326;
    color:#fff;
}

.follow-button:disabled{
    opacity:.65;
    cursor:default;
}

/* =========================================
   CHAT
========================================= */

.watch-actions{
    width:100%;
    margin-top:18px;
}

.chat-box{
    width:100%;
    height:270px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:#fff;
    border:1px solid rgba(75,51,38,.12);
    border-radius:14px;
}

.chat-header{
    min-height:46px;
    display:flex;
    align-items:center;
    padding:0 15px;
    border-bottom:1px solid rgba(75,51,38,.10);
    font-size:15px;
    font-weight:900;
}

.chat-messages{
    flex:1;
    overflow-y:auto;
    padding:12px;
    overscroll-behavior:contain;
}

.chat-message{
    margin-bottom:9px;
    font-size:13px;
    line-height:1.4;
    word-break:break-word;
}

.chat-username{
    font-weight:900;
    color:#4b3326;
}

.chat-text{
    color:#5d4a3c;
}

.chat-empty{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#9b887a;
    font-size:13px;
}

.chat-input-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px;
    border-top:1px solid rgba(75,51,38,.10);
}

.chat-input-row input{
    flex:1;
    min-width:0;
    height:40px;
    padding:0 12px;
    border:1px solid #d8c8bc;
    border-radius:10px;
    outline:none;
    background:#FAF9F6;
    color:#4A3728;
    font-size:14px;
}

.chat-input-row input:focus{
    border-color:#4b3326;
}

.chat-input-row button{
    width:42px;
    height:40px;
    flex:0 0 42px;
    border:none;
    border-radius:10px;
    background:#4b3326;
    color:#fff;
    font-size:18px;
    font-weight:900;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:opacity .15s ease,transform .15s ease;
}

.chat-input-row button:hover{
    opacity:.92;
}

.chat-input-row button:active{
    transform:scale(.96);
}

.chat-input-row button:disabled{
    opacity:.55;
    cursor:default;
}

/* =========================================
   BOTTOM NAV
   EXACT SAME AS STREAM.HTML
========================================= */

.bottom-nav{
    position:fixed;
    left:0;
    bottom:0;
    width:100%;
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-around;
    padding:5px 7px;
    background:#fff;

    border-top:none !important;
    box-shadow:0 -5px 20px rgba(75,51,38,.08);
    z-index:1000;
}

.bottom-nav a{
    flex:1;
    min-width:0;
    height:58px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    border-radius:12px;
    color:#4b3326;
    text-decoration:none;
    font-size:23px;

    background:transparent !important;
    border:none !important;
    box-shadow:none !important;
    outline:none !important;
}

.bottom-nav a.active,
.bottom-nav a.active:hover,
.bottom-nav a.active:focus,
.bottom-nav a.active:active{
    background:transparent !important;
    border:none !important;
    box-shadow:none !important;
    outline:none !important;
    color:#4b3326 !important;
}

.bottom-nav a.active::before,
.bottom-nav a.active::after{
    content:none !important;
    display:none !important;
    background:none !important;
    border:none !important;
    box-shadow:none !important;
}

.bottom-nav a span{
    font-size:10px;
    font-weight:700;
}

.explore-icon{
    width:23px;
    height:23px;
    display:block;
}

#bottomProfileIcon img{
    width:25px;
    height:25px;
    object-fit:cover;
    border-radius:50%;
    border:1.5px solid #d4a62a;
}

/* =========================================
   MOBILE
   SAME CANVAS BREAKPOINTS
========================================= */

@media(max-width:600px){

    .navbar{
        height:66px;
        padding:0 15px;
    }

    .logo{
        font-size:29px;
    }

    .watch-page{
        padding:20px 14px 25px;
    }

    .creator-section{
        padding:12px;
    }

    .chat-box{
        height:250px;
    }

}

@media(max-width:360px){

    .logo{
        font-size:26px;
    }

    .watch-page{
        padding-left:12px;
        padding-right:12px;
    }

    .follow-button{
        min-width:88px;
        padding:0 12px;
    }

}
</style>

</head>

<body>

<header class="navbar">

    <div class="logo">Canvas</div>

</header>

<main class="watch-page">

    <section class="stream-preview">

        <video
            id="liveVideo"
            autoplay
            playsinline
            controls
        ></video>

        <div
            id="videoPlaceholder"
            class="video-placeholder"
        >
            Loading live stream...
        </div>

        <div class="live-badge">
            LIVE
        </div>

    </section>

    <section class="stream-info">

        <div class="watching-row">

            <span>
                Watching
                <strong id="watchingCount">0</strong>
            </span>

        </div>

        <div class="creator-section">

            <a
                href="profile.html"
                id="creatorProfileLink"
                class="creator-profile-link"
            >

                <div class="creator-picture">

                    <img
                        id="creatorPhoto"
                        src=""
                        alt="Creator"
                        style="display:none;"
                    >

                    <span
                        id="creatorPhotoPlaceholder"
                        class="creator-picture-placeholder"
                    >⬤</span>

                </div>

                <div class="creator-details">

                    <div
                        id="creatorName"
                        class="creator-name"
                    >

                    </div>

                    </div>

                </div>

            </a>

                Follow

        </div>

    </section>

    <section class="watch-actions">

            <div class="chat-header">
                Live Chat

            <div
                id="chatMessages"

            >

                <div
                    id="chatEmpty"
                    class="chat-empty"

                </div>

            </div>

            <form
                id="chatForm"
                class="chat-input-row"
            >

                <input
                    id="chatInput"
                    type="text"
                    placeholder="Say something..."
                    autocomplete="off"
                    maxlength="500"
                >

                <button
                    id="chatSendButton"
                    type="submit"

                >➤</button>

            </form>

        </div>

    </section>

</main>

<nav class="bottom-nav">

    <!-- HOME -->

    <a
        href="stream.html"
        aria-label="Home"
    >

        ⌂

        <span>Home</span>

    </a>


    <!-- EXPLORE -->

    <a
        href="explore.html"
        aria-label="Explore"
    >

        <svg
            class="explore-icon"
            viewBox="0 0 24 24"
            fill="none"
        >

            <circle
                cx="11"
                cy="11"
                r="7"
                stroke="currentColor"
                stroke-width="2.8"
            />

            <path
                d="M16.5 16.5L21 21"
                stroke="currentColor"
                stroke-width="2.8"
                stroke-linecap="round"
            />

        </svg>

        <span>Explore</span>

    </a>


    <!-- GO LIVE -->

    <a
        href="golive.html"
        aria-label="Go Live"
    >

        ⊙

        <span>Go Live</span>

    </a>


    <!-- PROFILE -->

    <a
        href="profile.html"
        id="bottomProfileIcon"
        aria-label="Profile"
    >

        ⬤

        <span>Profile</span>

    </a>

</nav>
<script>

/* =========================================
   CANVAS WATCH CONFIG
========================================= */

const API_BASE =
    "https://canvas-kh9p.onrender.com";


/* =========================================
   ELEMENTS
========================================= */

const liveVideo =
    document.getElementById(
        "liveVideo"
    );

const videoPlaceholder =
    document.getElementById(
        "videoPlaceholder"
    );

const watchingCount =
    document.getElementById(
        "watchingCount"
    );

const creatorProfileLink =
    document.getElementById(
        "creatorProfileLink"
    );

const creatorPhoto =
    document.getElementById(
        "creatorPhoto"
    );

const creatorPhotoPlaceholder =
    document.getElementById(
        "creatorPhotoPlaceholder"
    );

const creatorName =
    document.getElementById(
        "creatorName"
    );

const creatorUsername =
    document.getElementById(
        "creatorUsername"
    );

const followButton =
    document.getElementById(
        "followButton"
    );

const chatForm =
    document.getElementById(
        "chatForm"
    );

const chatInput =
    document.getElementById(
        "chatInput"
    );

const chatSendButton =
    document.getElementById(
        "chatSendButton"
    );

const chatMessages =
    document.getElementById(
        "chatMessages"
    );

const chatEmpty =
    document.getElementById(
        "chatEmpty"
    );


/* =========================================
   STATE
========================================= */

let currentStream =
    null;

let currentStreamId =
    null;

let currentCreatorId =
    null;

let currentCreatorUsername =
    "";

let currentCreatorProfileUrl =
    "";

let socket =
    null;

let socketConnected =
    false;

let refreshTimer =
    null;

let currentViewerCount =
    0;

let isFollowing =
    false;

let followBusy =
    false;

let chatLoaded =
    false;

let leavingStream =
    false;

let renderedChatIds =
    new Set();

let renderedChatFallbacks =
    new Set();


/* =========================================
   AUTH
========================================= */

function getAuthToken(){

    return (
        localStorage.getItem(
            "canvasAuthToken"
        ) || ""
    );

}


function authHeaders(){

    const token =
        getAuthToken();


    const headers = {
        "Content-Type":
            "application/json"
    };


    if(token){

        headers.Authorization =
            "Bearer " + token;

    }


    return headers;

}


/* =========================================
   SAFE VALUE HELPER
========================================= */

function getValue(
    object,
    keys,
    fallback = ""
){

    if(
        !object ||
        typeof object !== "object"
    ){

        return fallback;

    }


    for(
        const key of keys
    ){

        const value =
            object[key];


        if(
            value !== undefined &&
            value !== null &&
            value !== ""
        ){

            return value;

        }

    }


    return fallback;

}


/* =========================================
   CREATOR OBJECT DETECTION
========================================= */

function getCreatorObjects(
    stream
){

    if(
        !stream ||
        typeof stream !== "object"
    ){

        return [];

    }


    const objects = [];


    const possibleCreators = [

        stream.creator,
        stream.user,
        stream.profile,
        stream.owner,
        stream.streamer,
        stream.broadcaster

    ];


    for(
        const object of possibleCreators
    ){

        if(
            object &&
            typeof object === "object"
        ){

            objects.push(
                object
            );

        }

    }


    /*
       The stream itself can also contain
       creator information.
    */

    objects.push(
        stream
    );


    return objects;

}
  /* =========================================
   CREATOR ID
========================================= */

function getCreatorId(
    stream
){

    const creators =
        getCreatorObjects(
            stream
        );


    for(
        const creator of creators
    ){

        const id =
            getValue(
                creator,
                [
                    "id",
                    "userId",
                    "user_id",
                    "creatorId",
                    "creator_id",
                    "profileId",
                    "profile_id"
                ],
                ""
            );


        if(id){

            return String(id);

        }

    }


    return "";

}


/* =========================================
   CREATOR NAME
========================================= */

function getCreatorNameValue(
    stream
){

    const creators =
        getCreatorObjects(
            stream
        );


    for(
        const creator of creators
    ){

        const name =
            getValue(
                creator,
                [
                    "name",
                    "displayName",
                    "display_name",
                    "fullName",
                    "full_name",
                    "username"
                ],
                ""
            );


        if(name){

            return String(name);

        }

    }


    return "Creator";

}


/* =========================================
   CREATOR USERNAME
========================================= */

function getCreatorUsernameValue(
    stream
){

    const creators =
        getCreatorObjects(
            stream
        );


    for(
        const creator of creators
    ){

        const username =
            getValue(
                creator,
                [
                    "username",
                    "userName",
                    "user_name",
                    "handle"
                ],
                ""
            );


        if(username){

            return String(username)
                .replace(
                    /^@+/,
                    ""
                );

        }

    }


    return "";

}


/* =========================================
   CREATOR PHOTO
========================================= */

function getCreatorPhoto(
    stream
){

    const creators =
        getCreatorObjects(
            stream
        );


    for(
        const creator of creators
    ){

        const photo =
            getValue(
                creator,
                [
                    "profilePhoto",
                    "profile_photo",
                    "profilePicture",
                    "profile_picture",
                    "avatar",
                    "photo",
                    "image",
                    "picture",
                    "photoUrl",
                    "photoURL",
                    "profilePhotoUrl",
                    "profile_picture_url",
                    "avatarUrl",
                    "avatarURL"
                ],
                ""
            );


        if(photo){

            return String(photo);

        }

    }


    return "";

}


/* =========================================
   CREATOR PROFILE URL
========================================= */

function getCreatorProfileUrl(
    stream
){

    const creators =
        getCreatorObjects(
            stream
        );


    for(
        const creator of creators
    ){

        const url =
            getValue(
                creator,
                [
                    "profileUrl",
                    "profile_url",
                    "creatorProfileUrl",
                    "creator_profile_url",
                    "profileLink",
                    "profile_link",
                    "url"
                ],
                ""
            );


        if(url){

            return String(url);

        }

    }


    return "";

}


/* =========================================
   STREAM ID
========================================= */

function getStreamId(
    stream
){

    return String(
        getValue(
            stream,
            [
                "id",
                "streamId",
                "stream_id",
                "liveStreamId",
                "live_stream_id"
            ],
            ""
        )
    );

}


/* =========================================
   STREAM TITLE
========================================= */

function getStreamTitle(
    stream
){

    if(
        !stream ||
        typeof stream !== "object"
    ){

        return "Live Stream";

    }


    const title =
        getValue(
            stream,
            [
                "title",
                "streamTitle",
                "stream_title",
                "liveTitle",
                "live_title",
                "name"
            ],
            ""
        );


    if(title){

        return String(title);

    }


    /*
       Also support nested stream data.
    */

    const nestedObjects = [

        stream.stream,
        stream.liveStream,
        stream.live_stream,
        stream.data

    ];


    for(
        const object of nestedObjects
    ){

        const nestedTitle =
            getValue(
                object,
                [
                    "title",
                    "streamTitle",
                    "stream_title",
                    "liveTitle",
                    "live_title",
                    "name"
                ],
                ""
            );


        if(nestedTitle){

            return String(
                nestedTitle
            );

        }

    }


    return "Live Stream";

}


/* =========================================
   RENDER STREAM TITLE
========================================= */

function renderStreamTitle(
    stream
){

    const title =
        getStreamTitle(
            stream
        );


    let titleElement =
        document.getElementById(
            "watchStreamTitle"
        );


    /*
       Create the title automatically if
       Part 1 doesn't already contain it.
    */

    if(!titleElement){

        titleElement =
            document.createElement(
                "h1"
            );


        titleElement.id =
            "watchStreamTitle";


        titleElement.className =
            "watch-stream-title";


        const streamInfo =
            document.querySelector(
                ".stream-info"
            );


        if(streamInfo){

            streamInfo.insertBefore(
                titleElement,
                streamInfo.firstChild
            );

        }

    }


    titleElement.textContent =
        title;


    titleElement.style.margin =
        "0 0 12px";

    titleElement.style.fontSize =
        "22px";

    titleElement.style.fontWeight =
        "700";

    titleElement.style.lineHeight =
        "1.3";

    titleElement.style.color =
        "#4b3326";

}


/* =========================================
   CREATOR PROFILE LINK
========================================= */

function updateCreatorProfileLink(){

    if(!creatorProfileLink)
        return;


    /*
       Use the creator's real profile URL
       when the backend provides one.
    */

    if(currentCreatorProfileUrl){

        creatorProfileLink.href =
            currentCreatorProfileUrl;

        return;

    }


    /*
       Username is the preferred fallback
       for public creator profiles.
    */

    if(currentCreatorUsername){

        creatorProfileLink.href =
            "profile.html?username=" +
            encodeURIComponent(
                currentCreatorUsername
            );

        return;

    }


    /*
       Creator ID is the final fallback.
    */

    if(currentCreatorId){

        creatorProfileLink.href =
            "profile.html?id=" +
            encodeURIComponent(
                currentCreatorId
            );

        return;

    }


    creatorProfileLink.href =
        "profile.html";

}


/* =========================================
   RENDER CREATOR
========================================= */

function renderCreator(
    stream
){

    currentCreatorId =
        getCreatorId(
            stream
        );


    currentCreatorUsername =
        getCreatorUsernameValue(
            stream
        );


    currentCreatorProfileUrl =
        getCreatorProfileUrl(
            stream
        );


    const name =
        getCreatorNameValue(
            stream
        );


    const photo =
        getCreatorPhoto(
            stream
        );


    if(creatorName){

        creatorName.textContent =
            name;

    }


    if(creatorUsername){

        creatorUsername.textContent =
            currentCreatorUsername
                ? "@" +

                : "@creator";

    }


    if(

    ){

            );

            creatorPhoto.style.display =
                "none";

        }

    }

/* =========================================
   RENDER STREAM
========================================= */

function renderStream(
    stream
){

        return;

        stream;

/* =========================================
   VIEWER COUNT
========================================= */

function updateWatchingCount(count){

    const numericCount =
        Number(count);


    if(
        !Number.isFinite(
            numericCount
        )
    ){

        return;

    }


    currentViewerCount =
        Math.max(
            0,
            Math.floor(
                numericCount
            )
        );


    if(watchingCount){

        watchingCount.textContent =
            String(
                currentViewerCount
            );

    }

}


/* =========================================
   VIDEO SETUP
========================================= */

function setupVideo(stream){

    if(!liveVideo)
        return;


    const videoUrl =
        getValue(
            stream,
            [
                "videoUrl",
                "video_url",
                "streamUrl",
                "stream_url",
                "playbackUrl",
                "playback_url",
                "hlsUrl",
                "hls_url",
                "url"
            ],

        );


    if(!videoUrl){

        if(videoPlaceholder){

            videoPlaceholder.textContent =
                "Waiting for live video...";

            videoPlaceholder.style.display =
                "flex";

        }

        return;

    }


    try{

        liveVideo.src =
            videoUrl;

        liveVideo.load();


        const playPromise =
            liveVideo.play();


        if(
            playPromise &&
            typeof playPromise.catch ===
            "function"
        ){

            playPromise.catch(
                function(error){

                    console.warn(
                        "Video autoplay:",

                    );

            );

/* =========================================

function showStreamError(message){

            "flex";

}

/* =========================================
   GET REQUESTED STREAM ID
========================================= */

function getRequestedStreamId(){

    const params =
        new URLSearchParams(
            window.location.search
        );


    const id =
        params.get("streamId") ||
        params.get("stream_id") ||
        params.get("id") ||
        params.get("stream");


    if(id){

        return id;

    }


    /*
       Home page stores the selected stream ID.
    */

    const storedId =
        localStorage.getItem(
            "canvasCurrentStreamId"
        );


    if(storedId){

        return storedId;

    }


    /*
       Final fallback: selected stream object.
    */

    try{

        const selectedRaw =
            localStorage.getItem(
                "canvasSelectedStream"
            );


        if(selectedRaw){

            const selected =
                JSON.parse(
                    selectedRaw
                );


            const selectedId =
                getStreamId(
                    selected
                );


            if(selectedId){

                return selectedId;

            }

        }

    }catch(error){

        console.warn(
            "Selected stream parse failed:",
            error
        );

    }


    return "";

}


/* =========================================
   LOAD STREAM
========================================= */

async function loadStream(){

    const requestedId =
        getRequestedStreamId();


    if(!requestedId){

        showStreamError(
            "No live stream selected."
        );

        return;

  }
  currentStreamId =
        String(
            requestedId
        );


    const endpoints = [

        API_BASE +
        "/api/streams/" +
        encodeURIComponent(
            currentStreamId
        ),

        API_BASE +
        "/api/stream/" +
        encodeURIComponent(
            currentStreamId
        )

    ];


    let loaded =
        false;


    for(
        const endpoint of endpoints
    ){

        try{

            const response =
                await fetch(
                    endpoint,
                    {
                        method:"GET",
                        headers:authHeaders(),
                        cache:"no-store"
                    }
                );


            if(!response.ok){

                continue;

            }


            const data =
                await response.json();


            const stream =
                data?.stream ||
                data?.data ||
                data;


            if(
                !stream ||
                typeof stream !==
                "object"
            ){

                continue;

            }


            const returnedId =
                getStreamId(
                    stream
                );


            if(returnedId){

                currentStreamId =
                    returnedId;

            }


            renderStream(
                stream
            );


            setupVideo(
                stream
            );


            /*
               Creator information now exists,
               so follow and profile routing use
               the correct creator.
            */

            await loadFollowState();

            await loadExistingChat();


            loaded =
                true;


            break;

        }catch(error){

            console.warn(
                "Stream load failed:",
                error
            );

        }

    }


    /*
       Local fallback if the API temporarily
       cannot return the stream.
    */

    if(!loaded){

        try{

            const selectedRaw =
                localStorage.getItem(
                    "canvasSelectedStream"
                );


            if(selectedRaw){

                const selected =
                    JSON.parse(
                        selectedRaw
                    );


                if(
                    String(
                        getStreamId(
                            selected
                        )
                    ) ===
                    String(
                        currentStreamId
                    )
                ){

                    renderStream(
                        selected
                    );


                    setupVideo(
                        selected
                    );


                    await loadFollowState();

                    await loadExistingChat();


                    loaded =
                        true;

                }

            }

        }catch(error){

            console.warn(
                "Local stream fallback failed:",
                error
            );

        }

    }


    if(!loaded){

        showStreamError(
            "Unable to load this stream."
        );

    }

}


/* =========================================
   REFRESH STREAM
========================================= */

async function refreshStream(){

    if(!currentStreamId)
        return;


    try{

        const response =
            await fetch(
                API_BASE +
                "/api/streams/" +
                encodeURIComponent(
                    currentStreamId
                ),
                {
                    method:"GET",
                    headers:authHeaders(),
                    cache:"no-store"
                }
            );


        if(!response.ok)
            return;


        const data =
            await response.json();


        const stream =
            data?.stream ||
            data?.data ||
            data;


        if(
            !stream ||
            typeof stream !==
            "object"
        ){

            return;

        }


        renderStream(
            stream
        );


        /*
           Update video only when the actual
           playback URL changes.
        */

        const videoUrl =
            getValue(
                stream,
                [
                    "videoUrl",
                    "video_url",
                    "streamUrl",
                    "stream_url",
                    "playbackUrl",
                    "playback_url",
                    "hlsUrl",
                    "hls_url",
                    "url"
                ],
                ""
            );


        if(
            videoUrl &&
            liveVideo &&
            liveVideo.src !==
            videoUrl
        ){

            setupVideo(
                stream
            );

        }


        const status =
            String(
                getValue(
                    stream,
                    ["status"],
                    ""
                )
            ).toLowerCase();


        const ended =
            stream.ended === true ||
            stream.isEnded === true ||
            stream.is_ended === true ||
            stream.live === false ||
            stream.isLive === false ||
            stream.is_live === false ||
            status === "ended" ||
            status === "offline";


        if(ended){

            showStreamEnded();

        }

    }catch(error){

        console.warn(
            "Stream refresh failed:",
            error
        );

    }

}


/* =========================================
   START STREAM REFRESH
========================================= */

function startStreamRefresh(){

    if(refreshTimer){

        clearInterval(
            refreshTimer
        );

    }


    refreshTimer =
        setInterval(
            function(){

                refreshStream();

            },
            10000
        );

}

        ],

    );

}


function getChatFallbackKey(message){

    return [
        getChatUsername(message),
        getChatText(message),
        getValue(
            message,
            [
                "createdAt",
                "created_at",
                "timestamp",
                "time"
            ],

/* =========================================
   ADD CHAT MESSAGE
========================================= */

function addChatMessage(
    message
){

    if(!message)
        return;


    const text =
        getChatText(message);


    if(!text)
        return;


    const messageId =
        getChatMessageId(message);


    const fallbackKey =
        getChatFallbackKey(message);


    /*
       Prevent duplicate messages.
    */

    if(messageId){

        const id =
            String(messageId);


        if(
            renderedChatIds.has(id)
        ){

            return;

        }


        renderedChatIds.add(id);

    }else{

        if(
            renderedChatFallbacks.has(
                fallbackKey
            )
        ){

            return;

        }


        renderedChatFallbacks.add(
            fallbackKey
        );

    }


    if(chatEmpty){

        chatEmpty.remove();

    const row =

            "div"

/* =========================================
   CURRENT USER NAME
========================================= */

async function getCurrentUserName(){

    /*
       First use the locally saved account.
       This avoids an unnecessary API request
       when the username is already available.
    */

    const storedAccount =
        localStorage.getItem(
            "canvasAccount"
        );


    if(storedAccount){

        try{

            const account =
                JSON.parse(
                    storedAccount

            const value =
                getValue(

                    ],
                    ""

            if(value){

                    .replace(
                        /^@+/,

                    );

            }

        }catch(error){

            console.warn(
                "Invalid canvasAccount:",
                error
            );

        }

    }


    /*
       Try the saved Canvas profile next.
    */

    const storedProfile =
        localStorage.getItem(
            "canvasProfile"
        );


    if(storedProfile){

        try{

            const profile =
                JSON.parse(
                    storedProfile
                );


            const value =
                getValue(
                    profile,
                    [
                        "username",
                        "userName",
                        "user_name",
                        "name",

                    ],

            if(value){

                    );

        }catch(error){

            console.warn(

            );

        }

    }


    /*
       API fallback only when local data does
       not contain the current user.
    */

    try{

        const response =
            await fetch(
                API_BASE +
                "/api/me",
                {
                    method:"GET",
                    headers:authHeaders(),
                    cache:"no-store"
                }
            );


        if(response.ok){

            const data =
                await response.json();


            const user =
                data?.user ||
                data?.profile ||
                data;


            const value =
                getValue(
                    user,
                    [
                        "username",
                        "userName",
                        "user_name",
                        "name",
                        "displayName",
                        "display_name"
                    ],
                    ""
                );


            if(value){

                return String(value)

                        /^@+/,
                        ""
                    );

            }

        }

    }catch(error){

        console.warn(
            "Unable to load current user:",

        );

    }

}


/* =========================================
   SOCKET CHAT
========================================= */

function handleIncomingChat(
    message
){

    if(!message)
        return;


    const streamId =
        getValue(
            message,
            [
                "streamId",
                "stream_id",
                "liveStreamId",
                "live_stream_id"
            ],
            ""
        );


    /*
       Ignore messages belonging to another
       stream.
    */

    if(
        streamId &&
        currentStreamId &&
        String(streamId) !==
        String(currentStreamId)
    ){

        return;

    }


    addChatMessage(
        message
    );

}


/* =========================================
   LOAD CHAT HISTORY
========================================= */

async function loadExistingChat(){

    if(
        chatLoaded ||
        !currentStreamId
    ){

        return;

    }


    chatLoaded = true;


    const endpoints = [

        API_BASE +
        "/api/streams/" +
        encodeURIComponent(
            currentStreamId
        ) +
        "/chat",

        API_BASE +
        "/api/stream/" +
        encodeURIComponent(
            currentStreamId
        ) +
        "/chat"

    ];


    for(
        const endpoint of endpoints
    ){

        try{

            const response =
                await fetch(
                    endpoint,
                    {
                        method:"GET",
                        headers:authHeaders(),
                        cache:"no-store"
                    }
                );


            if(!response.ok)
                continue;


            const data =
                await response.json();


            const messages =
                Array.isArray(data)
                    ? data
                    : (
                        data?.messages ||
                        data?.chat ||
                        data?.data ||
                        []
                    );


            if(
                Array.isArray(messages)
            ){

                messages.forEach(
                    addChatMessage
                );

            }


            break;

        }catch(error){

            console.warn(
                "Chat history load failed:",
                error
            );

        }

    }

}


/* =========================================
   SEND CHAT MESSAGE
========================================= */

async function sendChatMessage(){

    if(
        !chatInput ||
        !currentStreamId
    ){

        return;

    }


    const text =
        chatInput.value.trim();


    if(!text)
        return;


    /*
       Prevent extremely long messages.
    */

    const safeText =
        text.slice(
            0,
            500
        );
      /*
       Clear the input immediately so the UI
       feels instant.
    */

    chatInput.value = "";


    if(chatSendButton){

        chatSendButton.disabled =
            true;

    }


    const username =
        await getCurrentUserName();


    const message = {

        streamId:
            currentStreamId,

        stream_id:
            currentStreamId,

        username:
            username,

        text:
            safeText,

        message:
            safeText

    };


    let socketSent =
        false;


    /*
       Socket.IO is the primary fast path.
    */

    if(
        socket &&
        socketConnected
    ){

        try{

            socket.emit(
                "chat-message",
                message
            );


            socketSent =
                true;

        }catch(error){

            console.warn(
                "Socket chat send failed:",
                error
            );

        }

    }


    /*
       If Socket.IO is connected, do not wait
       for the API before displaying the message.
       The server echo is deduplicated automatically.
    */

    if(socketSent){

        addChatMessage(
            message
        );

    }


    /*
       API persistence runs in the background.
       This keeps the chat fast while still saving
       messages when the server supports the endpoint.
    */

    const endpoints = [

        API_BASE +
        "/api/streams/" +
        encodeURIComponent(
            currentStreamId
        ) +
        "/chat",

        API_BASE +
        "/api/stream/" +
        encodeURIComponent(
            currentStreamId
        ) +
        "/chat"

    ];


    let apiSent =
        false;


    for(
        const endpoint of endpoints
    ){

        try{

            const response =
                await fetch(
                    endpoint,
                    {
                        method:"POST",
                        headers:authHeaders(),
                        body:JSON.stringify(
                            message
                        )
                    }
                );


            if(response.ok){

                apiSent =
                    true;

                break;

            }

        }catch(error){

            console.warn(
                "API chat send failed:",
                error
            );

        }

    }


    /*
       If Socket.IO wasn't available, render the
       message after the API successfully accepted it.
    */

    if(
        !socketSent &&
        apiSent
    ){

        addChatMessage(
            message
        );

    }


    /*
       If neither transport worked, still show the
       message locally so the chat UI doesn't feel
       frozen. The next server refresh will determine
       the persisted state.
    */

    if(
        !socketSent &&
        !apiSent
    ){

        addChatMessage(
            message
        );

    }


    if(chatSendButton){

        chatSendButton.disabled =
            false;

    }


    if(chatInput){

        chatInput.focus();

    }


    scrollChatToBottom();

}

/* =========================================
   FOLLOW STATE
========================================= */

async function loadFollowState(){

    if(!followButton)
        return;


    if(
        !currentCreatorId &&
        !currentCreatorUsername
    ){

        updateFollowButton(
            false
        );

        return;

    }


    const token =
        getAuthToken();


    /*
       No login = normal Follow button.
    */

    if(!token){

        isFollowing =
            false;

        updateFollowButton(
            false
        );

        return;

    }


    const identifiers = [];


    if(currentCreatorId){

        identifiers.push(
            String(
                currentCreatorId
            )
        );

    }


    if(
        currentCreatorUsername
    ){

        identifiers.push(
            currentCreatorUsername
        );

    }


    /*
       Try creator ID first, then username.
    */

    for(
        const identifier of identifiers
    ){

        try{

            const response =
                await fetch(
                    API_BASE +
                    "/api/follow/" +
                    encodeURIComponent(
                        identifier
                    ),
                    {
                        method:"GET",
                        headers:authHeaders(),
                        cache:"no-store"
                    }
                );


            if(!response.ok)
                continue;


            const data =
                await response.json();


            const following =
                data?.following ??
                data?.isFollowing ??
                data?.is_following ??
                false;


            isFollowing =
                Boolean(
                    following
                );


            updateFollowButton(
                isFollowing
            );


            return;

        }catch(error){

            console.warn(
                "Follow state error:",
                error
            );

        }

    }


    updateFollowButton(
        isFollowing
    );

}


/* =========================================
   FOLLOW BUTTON UI
========================================= */

function updateFollowButton(
    following
){

    if(!followButton)
        return;


    followButton.classList.toggle(
        "following",
        Boolean(
            following
        )
    );


    followButton.textContent =
        following
            ? "Following"
            : "Follow";


    followButton.disabled =
        followBusy;

}


/* =========================================
   TOGGLE FOLLOW
========================================= */

async function toggleFollow(){

    if(
        followBusy ||
        (
            !currentCreatorId &&
            !currentCreatorUsername
        )
    ){

        return;

    }


    const token =
        getAuthToken();


    if(!token){

        window.location.href =
            "profile.html";

        return;

    }


    followBusy =
        true;


    const previousState =
        isFollowing;


    /*
       Optimistic UI:
       change the button immediately.
    */

    isFollowing =
        !previousState;


    updateFollowButton(
        isFollowing
    );


    const target =
        currentCreatorId ||
        currentCreatorUsername;


    const encoded =
        encodeURIComponent(
            target
        );


    try{

        let response;


        if(previousState){

            response =
                await fetch(
                    API_BASE +
                    "/api/follow/" +
                    encoded,
                    {
                        method:"DELETE",
                        headers:authHeaders()
                    }
                );

        }else{

            response =
                await fetch(
                    API_BASE +
                    "/api/follow/" +
                    encoded,
                    {
                        method:"POST",
                        headers:authHeaders(),
                        body:JSON.stringify({

                            creatorId:
                                currentCreatorId,

                            creatorUsername:
                                currentCreatorUsername

                        })
                    }
                );

        }


        if(!response.ok){

            throw new Error(
                "Follow request failed"
            );

        }


        /*
           Server accepted the new state.
        */

        isFollowing =
            !previousState;


    }catch(error){

        console.error(
            "Follow error:",
            error
        );


        /*
           Revert the optimistic UI if the
           server rejected the request.
        */

        isFollowing =
            previousState;

    }finally{

        followBusy =
            false;

        updateFollowButton(
            isFollowing
        );

    }

}


/* =========================================
   FOLLOW BUTTON
========================================= */

if(followButton){

    followButton.addEventListener(
        "click",
        function(event){

            event.preventDefault();

            event.stopPropagation();

            toggleFollow();

        }
    );

}

function connectSocket(){

    if(
        typeof io === "undefined"
    ){

        console.warn(
            "Socket.IO is not available."
        );

        return;

    }


    if(socket){

        try{

            socket.disconnect();

        }catch(error){

            console.warn(
                "Previous socket cleanup failed:",
                error
            );

        }

    }


    socket =
        io(
            API_BASE,
            {
                transports:[
                    "websocket",
                    "polling"
                ],

                reconnection:true,

                reconnectionAttempts:
                    Infinity,

                reconnectionDelay:
                    500,

                reconnectionDelayMax:
                    3000,

                timeout:
                    10000
            }
        );


    /* =====================================
       CONNECTED
    ===================================== */

    socket.on(
        "connect",
        function(){

            socketConnected =
                true;


            joinCurrentStream();

        }
    );


    /* =====================================
       DISCONNECTED
    ===================================== */

    socket.on(
        "disconnect",
        function(){

            socketConnected =
                false;

        }
    );


    /* =====================================
       CONNECT ERROR
    ===================================== */

    socket.on(
        "connect_error",
        function(error){

            socketConnected =
                false;


            console.warn(
                "Canvas socket connection error:",
                error?.message ||
                error
            );

        }
    );


    /* =====================================
       CHAT EVENTS
    ===================================== */

    socket.on(
        "chat-message",
        function(message){

            handleIncomingChat(
                message
            );

        }
    );


    socket.on(
        "chatMessage",
        function(message){

            handleIncomingChat(
                message
            );

        }
    );


    socket.on(
        "new-chat-message",
        function(message){

            handleIncomingChat(
                message
            );

        }
    );


    socket.on(
        "newChatMessage",
        function(message){

            handleIncomingChat(
                message
            );

        }
    );


    socket.on(
        "message",
        function(message){

            /*
               Only treat a generic "message"
               event as chat when it looks like
               an actual chat object.
            */

            if(
                message &&
                (
                    message.text ||
                    message.message ||
                    message.content ||
                    message.body
                )
            ){

                handleIncomingChat(
                    message
                );

            }

        }
    );


    /* =====================================
       WATCHER COUNT EVENTS
    ===================================== */

    socket.on(
        "viewer-count",
        function(data){

            handleViewerCount(
                data
            );

        }
    );


    socket.on(
        "viewerCount",
        function(data){

            handleViewerCount(
                data
            );

        }
    );


    socket.on(
        "watcher-count",
        function(data){

            handleViewerCount(
                data
            );

        }
    );


    socket.on(
        "stream-viewers",
        function(data){

            handleViewerCount(
                data
            );

        }
    );


    /* =====================================
       STREAM STATUS EVENTS
    ===================================== */

    socket.on(
        "stream-ended",
        function(data){

            handleStreamStatus(
                data
            );

        }
    );


    socket.on(
        "streamEnded",
        function(data){

            handleStreamStatus(
                data
            );

        }
    );


    socket.on(
        "stream-update",
        function(data){

            handleStreamStatus(
                data
            );

        }
    );


    socket.on(
        "streamUpdate",
        function(data){

            handleStreamStatus(
                data
            );

        }
    );

}


/* =========================================
   VIEWER COUNT PARSER
========================================= */

function handleViewerCount(
    data
){

    let count = null;


    if(
        typeof data === "number"
    ){

        count =
            data;

    }else if(
        typeof data === "string"
    ){

        const parsed =
            Number(
                data
            );


        if(
            Number.isFinite(
                parsed
            )
        ){

            count =
                parsed;

        }

    }else if(data){

        count =
            data.viewerCount ??
            data.viewer_count ??
            data.viewers ??
            data.watching ??
            data.watchingCount ??
            data.watching_count ??
            data.count ??
            data.total;

    }


    if(
        count === null ||
        count === undefined
    ){

        return;

    }


    /*
       If the server sends a stream ID with
       the event, ignore counts belonging to
       another stream.
    */

    if(
        typeof data === "object" &&
        data
    ){

        const eventStreamId =
            data.streamId ??
            data.stream_id ??
            data.liveStreamId ??
            data.live_stream_id;


        if(
            eventStreamId &&
            currentStreamId &&
            String(
                eventStreamId
            ) !==
            String(
                currentStreamId
            )
        ){
          return;

        }

    }


    updateWatchingCount(
        count
    );

}


/* =========================================
   STREAM STATUS HANDLER
========================================= */

function handleStreamStatus(
    data
){

    if(!data)
        return;


    if(
        typeof data === "object"
    ){

        const eventStreamId =
            data.streamId ??
            data.stream_id ??
            data.liveStreamId ??
            data.live_stream_id;


        if(
            eventStreamId &&
            currentStreamId &&
            String(
                eventStreamId
            ) !==
            String(
                currentStreamId
            )
        ){

            return;

        }


        const ended =
            data.ended === true ||
            data.isEnded === true ||
            data.is_ended === true ||
            data.live === false ||
            data.isLive === false ||
            data.is_live === false;


        if(ended){

            showStreamEnded();

            return;

        }


        const count =
            data.viewerCount ??
            data.viewer_count ??
            data.viewers ??
            data.watching ??
            data.watchingCount ??
            data.watching_count;


        if(
            count !== undefined &&
            count !== null
        ){

            updateWatchingCount(
                count
            );

        }

    }

}


/* =========================================
   JOIN CURRENT STREAM
========================================= */

function joinCurrentStream(){

    if(
        !socket ||
        !socketConnected ||
        !currentStreamId
    ){

        return;

    }


    const streamId =
        currentStreamId;


    /*
       Emit the common Canvas event names.
       The backend can listen to whichever one
       it supports.
    */

    try{

        socket.emit(
            "join-stream",
            {
                streamId:
                    streamId,

                stream_id:
                    streamId
            }
        );

    }catch(error){

        console.warn(
            "join-stream failed:",
            error
        );

    }


    try{

        socket.emit(
            "joinStream",
            streamId
        );

    }catch(error){

        console.warn(
            "joinStream failed:",
            error
        );

    }


    try{

        socket.emit(
            "watch-stream",
            {
                streamId:
                    streamId,

                stream_id:
                    streamId
            }
        );

    }catch(error){

        console.warn(
            "watch-stream failed:",
            error
        );

    }

}


/* =========================================
   LEAVE CURRENT STREAM
========================================= */

function leaveCurrentStream(){

    if(
        leavingStream ||
        !socket ||
        !currentStreamId
    ){

        return;

    }


    leavingStream =
        true;


    const streamId =
        currentStreamId;


    try{

        socket.emit(
            "leave-stream",
            {
                streamId:
                    streamId,

                stream_id:
                    streamId
            }
        );

    }catch(error){

        console.warn(
            "leave-stream failed:",
            error
        );

    }


    try{

        socket.emit(
            "leaveStream",
            streamId
        );

    }catch(error){

        console.warn(
            "leaveStream failed:",
            error
        );

    }

}

/* =========================================
   STREAM END STATE
========================================= */

function isStreamMarkedEnded(){

    if(!currentStream)
        return false;


    const status =
        String(
            getValue(
                currentStream,
                [
                    "status"
                ],
                ""
            )
        ).toLowerCase();


    return (
        currentStream.ended === true ||
        currentStream.isEnded === true ||
        currentStream.is_ended === true ||
        currentStream.live === false ||
        currentStream.isLive === false ||
        currentStream.is_live === false ||
        status === "ended" ||
        status === "offline"
    );

}

/* =========================================
   BOTTOM PROFILE PHOTO
========================================= */

function findLocalProfilePhoto(){

    const sources = [
        "canvasProfile",
        "canvasAccount"
    ];


    const photoKeys = [

        "profilePhoto",
        "profilePicture",
        "profile_picture",
        "avatar",
        "photo",
        "image",
        "picture",
        "photoUrl",
        "photoURL",
        "profilePhotoUrl",
        "profile_picture_url"

    ];


    for(
        const sourceKey of sources
    ){

        const raw =
            localStorage.getItem(
                sourceKey
            );


        if(!raw)
            continue;


        try{

            const data =
                JSON.parse(
                    raw
                );


            for(
                const key of photoKeys
            ){

                const value =
                    data?.[key];


                if(
                    value &&
                    typeof value === "string"
                ){

                    return value;

                }

            }

        }catch(error){

            console.warn(
                "Profile data parse error:",
                error
            );

        }

    }


    return "";

}


/* =========================================
   UPDATE BOTTOM PROFILE ICON
========================================= */

function updateBottomProfileIcon(){

    const icon =
        document.getElementById(
            "bottomProfileIcon"
        );


    if(!icon)
        return;


    const photo =
        findLocalProfilePhoto();


    if(!photo)
        return;


    icon.innerHTML =
        "";


    const image =
        document.createElement(
            "img"
        );


    image.src =
        photo;


    image.alt =
        "Profile";


    image.width =
        25;


    image.height =
        25;


    image.style.width =
        "25px";


    image.style.height =
        "25px";


    image.style.borderRadius =
        "50%";


    image.style.objectFit =
        "cover";


    image.style.border =
        "1.5px solid #d4a62a";


    image.style.display =
        "block";


    const label =
        document.createElement(
            "span"
        );


    label.textContent =
        "Profile";


    icon.appendChild(
        image
    );


    icon.appendChild(
        label
    );

}


/* =========================================
   STORAGE PROFILE SYNC
========================================= */

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key ===
                "canvasProfile" ||
            event.key ===
                "canvasAccount"
        ){

            updateBottomProfileIcon();

        }

    }
);


/* =========================================
   ONLINE AGAIN
========================================= */

window.addEventListener(
    "online",
    function(){

        refreshStream();


        if(
            !socket ||
            !socketConnected
        ){

            connectSocket();

        }else{

            joinCurrentStream();

        }

);


/* =========================================
   PAGE VISIBILITY
========================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.visibilityState ===
            "visible"
        ){

            refreshStream();


            if(
                !socket ||
                !socketConnected
            ){

                connectSocket();

            }else{

                joinCurrentStream();

            }

        }

    }
);

</script>
<script>

/* =========================================
   INITIALIZE WATCH PAGE
========================================= */

async function initializeCanvasWatch(){

    leavingStream =
        false;


    updateBottomProfileIcon();


    /*
       Load the stream first so we know the
       exact stream ID before joining Socket.IO.
    */

    await loadStream();


    /*
       Connect immediately after the stream has
       been identified.
    */

    connectSocket();


    /*
       Small fallback in case Socket.IO connects
       before the stream state finishes settling.
    */

    setTimeout(
        function(){

            joinCurrentStream();

        },
        500
    );


    /*
       Keep the stream state fresh.
    */

    startStreamRefresh();

}


/* =========================================
   DOM READY
========================================= */

if(
    document.readyState ===
    "loading"
){

    document.addEventListener(
        "DOMContentLoaded",
        initializeCanvasWatch,
        {
            once:true
        }
    );

}else{

    initializeCanvasWatch();

}


/* =========================================
   PAGE SHOW
========================================= */

window.addEventListener(
    "pageshow",
    function(){

        /*
           pageshow also fires when the browser
           restores the page from its back/forward
           cache.
        */

        if(!currentStreamId){

            initializeCanvasWatch();

            return;

        }


        leavingStream =
            false;


        refreshStream();


        if(
            !socket ||
            !socketConnected
        ){

            connectSocket();

        }else{

            joinCurrentStream();

        }

    }
);


/* =========================================
   BEFORE UNLOAD
========================================= */

window.addEventListener(
    "beforeunload",
    function(){

        leaveCurrentStream();

    }
);


/* =========================================
   PAGE HIDE
========================================= */

window.addEventListener(
    "pagehide",
    function(){

        leaveCurrentStream();


        if(refreshTimer){

            clearInterval(
                refreshTimer
            );


            refreshTimer =
                null;

        }

    }
);


/* =========================================
   PROFILE PHOTO SYNC
========================================= */

(function(){

    let lastPhoto =
        "";


    function syncProfileIcon(){

        const photo =
            findLocalProfilePhoto();


        if(photo === lastPhoto)
            return;


        lastPhoto =
            photo;


        updateBottomProfileIcon();

    }


    syncProfileIcon();


    setInterval(
        syncProfileIcon,
        1000
    );

})();


/* =========================================
   CHAT INPUT FOCUS
========================================= */

if(chatInput){

    chatInput.addEventListener(
        "focus",
        function(){

            setTimeout(
                scrollChatToBottom,
                100
            );

        }
    );

}


/* =========================================
   CHAT SEND BUTTON STATE
========================================= */

if(chatInput && chatSendButton){

    chatInput.addEventListener(
        "input",
        function(){

            const hasText =
                chatInput.value.trim()
                    .length > 0;


            /*
               Do not disable the button while
               there is text. The send operation
               itself controls the temporary
               disabled state.
            */

            if(
                !chatSendButton.disabled
            ){

                chatSendButton.style.opacity =
                    hasText
                        ? "1"
                        : ".7";

            }

        }
    );

  }
  /* =========================================
   DOUBLE-SEND PROTECTION
========================================= */

let chatSendInProgress =
    false;


const originalSendChatMessage =
    sendChatMessage;


sendChatMessage =
    async function(){

        if(chatSendInProgress){

            return;

        }


        chatSendInProgress =
            true;


        try{

            await originalSendChatMessage();

        }catch(error){

            console.error(
                "Chat send error:",
                error
            );

        }finally{

            chatSendInProgress =
                false;

        }

    };


/* =========================================
   FOLLOW BUTTON PROFILE SAFETY
========================================= */

function refreshFollowState(){

    if(
        currentCreatorId ||
        currentCreatorUsername
    ){

        loadFollowState();

    }

}


/* =========================================
   REFRESH WHEN USER RETURNS TO TAB
========================================= */

window.addEventListener(
    "focus",
    function(){

        refreshStream();

        refreshFollowState();


        if(
            socket &&
            socketConnected
        ){

            joinCurrentStream();

        }

    }
);


/* =========================================
   SOCKET RECONNECT
========================================= */

function reconnectCanvasSocket(){

    if(
        !currentStreamId
    ){

        return;

    }


    if(socket){

        try{

            socket.disconnect();

        }catch(error){

            console.warn(
                "Socket disconnect failed:",
                error
            );

        }

    }


    socket =
        null;


    socketConnected =
        false;


    leavingStream =
        false;


    connectSocket();

}


/* =========================================
   RETRY SOCKET AFTER NETWORK FAILURE
========================================= */

let socketRetryTimer =
    null;


window.addEventListener(
    "offline",
    function(){

        socketConnected =
            false;

    }
);


window.addEventListener(
    "online",
    function(){

        if(socketRetryTimer){

            clearTimeout(
                socketRetryTimer
            );

        }


        socketRetryTimer =
            setTimeout(
                function(){

                    if(
                        !socket ||
                        !socketConnected
                    ){

                        reconnectCanvasSocket();

                    }else{

                        joinCurrentStream();

                    }

                },
                300
            );

    }
);


/* =========================================
   CLEAN SOCKET ON PAGE EXIT
========================================= */

function cleanupCanvasWatch(){

    leaveCurrentStream();


    if(refreshTimer){

        clearInterval(
            refreshTimer
        );


        refreshTimer =
            null;

    }


    if(socket){

        try{

            socket.disconnect();

        }catch(error){

            console.warn(
                "Socket cleanup failed:",
                error
            );

        }

    }


    socket =
        null;


    socketConnected =
        false;

}


/* =========================================
   UNLOAD
========================================= */

window.addEventListener(
    "unload",
    function(){

        cleanupCanvasWatch();

    }
);

</script>
