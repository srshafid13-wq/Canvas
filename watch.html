<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Canvas - Watch Live</title>

<link
    rel="stylesheet"
    href="style.css"
>

<style>

/* =========================================
   WATCH PAGE
========================================= */

.watch-page{
    width:100%;
    max-width:900px;
    margin:0 auto;
    padding:25px 15px 110px;
}


/* =========================================
   VIDEO
========================================= */

.watch-video-box{
    width:100%;
    aspect-ratio:16 / 9;
    background:#251b17;
    border-radius:20px;
    overflow:hidden;
    position:relative;
    border:1px solid #eaded6;
    box-shadow:0 8px 25px rgba(75,51,38,.12);
    display:flex;
    align-items:center;
    justify-content:center;
}

#liveVideo{
    width:100%;
    height:100%;
    display:block;
    object-fit:contain;
    background:#000;
}

.video-message{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:90%;
    text-align:center;
    color:#fff;
    font-size:16px;
    font-weight:700;
    z-index:2;
}

.video-message.hidden{
    display:none;
}


/* =========================================
   LIVE BADGE
========================================= */

.watch-live-badge{
    position:absolute;
    top:12px;
    left:12px;
    padding:6px 11px;
    border-radius:8px;
    background:#d93025;
    color:#fff;
    font-size:12px;
    font-weight:800;
    z-index:5;
}


/* =========================================
   ERROR
========================================= */

.watch-error{
    display:none;
    margin-top:14px;
    padding:18px;
    text-align:center;
    background:#fff8f6;
    border:1px solid #f0d8d3;
    border-radius:16px;
    color:#8a3028;
    font-size:14px;
    font-weight:700;
}


/* =========================================
   STREAM INFO
========================================= */

.watch-info{
    margin-top:16px;
    padding:18px;
    background:#fff;
    border:1px solid #eaded6;
    border-radius:18px;
    box-shadow:0 5px 18px rgba(75,51,38,.06);
}

.watch-title{
    color:#4b3326;
    font-size:24px;
    font-weight:800;
    line-height:1.3;
    margin-bottom:12px;
    word-break:break-word;
}

.creator-row{
    display:flex;
    align-items:center;
    gap:10px;
}

.creator-picture{
    width:40px;
    height:40px;
    flex-shrink:0;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #d4a62a;
    background:#f1f1f1;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    color:#4b3326;
    font-weight:900;
}

.creator-picture img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.creator-details{
    min-width:0;
    flex:1;
}

.creator-name{
    color:#4b3326;
    font-size:16px;
    font-weight:800;
}

.creator-username{
    color:#806c60;
    font-size:13px;
    margin-top:3px;
}

.viewer-count{
    margin-top:12px;
    color:#75645b;
    font-size:14px;
}


/* =========================================
   FOLLOW
========================================= */

.follow-button{
    margin-top:15px;
    padding:12px 20px;
    border:none;
    border-radius:12px;
    background:#4b3326;
    color:#fff;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
}

.follow-button:active{
    transform:scale(.97);
}

.follow-button.following{
    background:#d4a62a;
    color:#4b3326;
}


/* =========================================
   CHAT
========================================= */

.chat-section{
    margin-top:16px;
    background:#fff;
    border:1px solid #eaded6;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 5px 18px rgba(75,51,38,.06);
}

.chat-header{
    padding:14px 16px;
    border-bottom:1px solid #eee2da;
    color:#4b3326;
    font-size:17px;
    font-weight:800;
}

.chat-messages{
    height:260px;
    overflow-y:auto;
    padding:12px;
    background:#fffdfb;
}

.chat-empty{
    text-align:center;
    padding:30px 15px;
    color:#9a887d;
    font-size:14px;
}

.message{
    margin-bottom:9px;
    padding:8px 10px;
    border-radius:10px;
    background:#f7efe7;
    color:#4b3326;
    font-size:14px;
    line-height:1.4;
    word-break:break-word;
}

.message strong{
    font-weight:800;
}

.chat-input-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px;
    border-top:1px solid #eee2da;
    background:#fff;
}

.chat-input{
    flex:1;
    min-width:0;
    height:44px;
    padding:0 14px;
    border:1px solid #dfd2c9;
    border-radius:13px;
    outline:none;
    background:#faf9f6;
    color:#4b3326;
    font-size:14px;
}

.chat-input:focus{
    border-color:#d4a62a;
}

.chat-send{
    width:44px;
    height:44px;
    flex-shrink:0;
    border:none;
    border-radius:13px;
    background:#4b3326;
    color:#fff;
    font-size:22px;
    font-weight:900;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}

.chat-send:active{
    transform:scale(.94);
}


/* =========================================
   SUPPORT
========================================= */

.support-section{
    margin-top:16px;
    padding:16px;
    background:#fff;
    border:1px solid #eaded6;
    border-radius:18px;
    box-shadow:0 5px 18px rgba(75,51,38,.06);
}

.support-button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:13px;
    background:#4b3326;
    color:#fff;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
}

.support-button:active{
    transform:scale(.98);
}

.gift-panel{
    display:none;
    margin-top:13px;
    padding:13px;
    border-radius:14px;
    background:#faf9f6;
    border:1px solid #eaded6;
}

.gift-panel.active{
    display:block;
}

.support-tabs{
    display:flex;
    gap:8px;
    margin-bottom:12px;
}

.support-tab{
    flex:1;
    padding:10px;
    border:none;
    border-radius:10px;
    background:#eee5dd;
    color:#4b3326;
    font-weight:800;
    cursor:pointer;
}

.support-options{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.support-option{
    flex:1 0 calc(33.333% - 8px);
    min-width:70px;
    padding:10px 7px;
    border:1px solid #dfd2c9;
    border-radius:11px;
    background:#fff;
    color:#4b3326;
    font-weight:800;
    cursor:pointer;
}

.support-option:active{
    transform:scale(.96);
}

.support-status{
    margin-top:12px;
    min-height:20px;
    color:#806c60;
    font-size:13px;
    text-align:center;
}

.send-support{
    width:100%;
    margin-top:10px;
    padding:12px;
    border:none;
    border-radius:11px;
    background:#d4a62a;
    color:#4b3326;
    font-size:14px;
    font-weight:900;
    cursor:pointer;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    .watch-page{
        padding:20px 15px 100px;
    }

    .watch-video-box{
        border-radius:16px;
    }

    .watch-info{
        padding:15px;
        border-radius:16px;
    }

    .watch-title{
        font-size:21px;
    }

    .creator-picture{
        width:37px;
        height:37px;
    }

    .chat-messages{
        height:230px;
    }

    .support-option{
        flex-basis:calc(33.333% - 8px);
    }

}

</style>

</head>

                    d="M16.5 16.5L21 21"
                    stroke="currentColor"

<!-- =========================================
     WATCH PAGE
========================================= -->

<main class="watch-page">


    <!-- VIDEO -->

    <div class="watch-video-box">

        <div
            class="watch-live-badge"
            id="liveBadge"
        >
            🔴 LIVE
        </div>

        <video
            id="liveVideo"

            playsinline

        ></video>

        <div

            id="videoMessage"
        >

        </div>

    </div>


    <!-- ERROR -->

    <div
        class="watch-error"
        id="streamError"
    ></div>


    <!-- STREAM INFORMATION -->

    <section class="watch-info">

        <h1
            class="watch-title"
            id="streamTitle"

        <div class="creator-row">

  <!-- =========================================
     PART 2/3 — CANVAS WATCH JAVASCRIPT
========================================= -->

<script>

const API_BASE =
    "https://canvas-kh9p.onrender.com";

let currentStream = null;
let selectedSupport = 0;
let selectedGift = null;


/* =========================================
   STREAM ID
========================================= */

function getStreamId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("stream");
}


/* =========================================
   LOAD STREAM
========================================= */

async function loadStream(){

    const streamId =
        getStreamId();

    if(!streamId){

        showStreamError(
            "No stream was selected."
        );

        return;
    }

    try{

        const response =
            await fetch(
                API_BASE +
                "/api/streams/" +
                encodeURIComponent(streamId)
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.message ||
                "Unable to load Canvas stream."
            );
        }

        currentStream =
            data.stream ||
            data;

        renderStream(
            currentStream
        );

    }

    catch(error){

        console.error(
            "Stream loading failed:",
            error
        );

        showStreamError(
            "Unable to load Canvas stream."
        );
    }
}


/* =========================================
   RENDER STREAM
========================================= */

function renderStream(stream){

    if(!stream) return;


    const title =
        document.getElementById(
            "streamTitle"
        );

    if(title){

        title.textContent =
            stream.title ||
            "Canvas Live Stream";
    }


    const creatorName =
        document.getElementById(
            "creatorName"
        );

    if(creatorName){

        creatorName.textContent =
            stream.name ||
            stream.full_name ||
            stream.username ||
            "Canvas Creator";
    }


    const creatorUsername =
        document.getElementById(
            "creatorUsername"
        );

    if(creatorUsername){

        creatorUsername.textContent =
            stream.username
                ? "@" + stream.username
                : "";
    }


    const viewerCount =
        document.getElementById(
            "viewerCount"
        );

    if(viewerCount){

        const count =
            Number(
                stream.viewer_count ??
                stream.viewers ??
                0
            );

        viewerCount.textContent =
            "👀 " +
            count.toLocaleString() +
            " Watching";
    }


    /* =====================================
       CREATOR PHOTO
    ===================================== */

    const picture =
        document.getElementById(
            "creatorPictureContainer"
        );

    if(picture){

        const photo =
            stream.profile_picture ||
            stream.profilePicture ||
            stream.avatar ||
            stream.photo ||
            "";

        if(photo){

            picture.innerHTML =
                '<img src="' +
                escapeHTML(photo) +
                '" alt="Creator">';

        }

        else{

            picture.innerHTML =
                "⬤";
        }
    }


    /* =====================================
       VIDEO THUMBNAIL
    ===================================== */

    const video =
        document.getElementById(
            "liveVideo"
        );

    if(video){

        const thumbnail =
            stream.thumbnail ||
            stream.thumbnail_url ||
            "";

        if(thumbnail){

            video.poster =
                thumbnail;
        }
    }


    setupVideo(stream);
}


/* =========================================
   VIDEO SETUP
========================================= */

function setupVideo(stream){

    const video =
        document.getElementById(
            "liveVideo"
        );

    if(!video) return;


    const videoUrl =
        stream.video_url ||
        stream.videoUrl ||
        stream.playback_url ||
        stream.playbackUrl ||
        stream.stream_url ||
        stream.streamUrl ||
        "";


    if(videoUrl){

        video.src =
            videoUrl;

        video.load();

        video.play()
            .catch(function(){
                console.log(
                    "Autoplay requires user interaction."
                );
            });

        hideVideoMessage();

    }

}


/* =========================================
   VIDEO MESSAGE
========================================= */

function hideVideoMessage(){

    const message =
        document.getElementById(
            "videoMessage"
        );

    if(message){

        message.classList.add(
            "hidden"
        );
    }
}


/* =========================================
   STREAM ERROR
========================================= */

function showStreamError(message){

    const errorBox =
        document.getElementById(
            "streamError"
        );

    if(errorBox){

        errorBox.textContent =
            message;

        errorBox.style.display =
            "block";
    }


    const video =
        document.getElementById(
            "liveVideo"
        );

    if(video){

        video.style.display =
            "none";
    }
}


/* =========================================
   FOLLOW
========================================= */

async function followCreator(){

    if(!currentStream){

        alert(
            "Stream information is not available."
        );

        return;
    }


    const creatorId =
        currentStream.user_id ||
        currentStream.userId ||
        currentStream.creator_id ||
        currentStream.creatorId;


    if(!creatorId){

        alert(
            "Creator information is unavailable."
        );

        return;
    }


    const token =
        localStorage.getItem(
            "canvasAuthToken"
        );


    if(!token){

        alert(
            "Please log in to follow this creator."
        );

        return;
    }


    try{

        const response =
            await fetch(
                API_BASE +
                "/api/follow",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            token
                    },

                    body:JSON.stringify({

                        userId:
                            creatorId

                    })
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Unable to follow creator."
            );
        }


        updateFollowButton(true);

    }

    catch(error){

        console.error(
            "Follow failed:",
            error
        );

        alert(
            error.message ||
            "Unable to follow creator."
        );
    }
}


/* =========================================
   FOLLOW BUTTON
========================================= */

function updateFollowButton(isFollowing){

    const button =
        document.getElementById(
            "followButton"
        );

    if(!button) return;


    if(isFollowing){

        button.textContent =
            "✓ Following";

        button.classList.add(
            "following"
        );
    }

    else{

        button.textContent =
            "❤️ Follow";

        button.classList.remove(
            "following"
        );
    }
}


/* =========================================
   SUPPORT PANEL
========================================= */

function toggleGiftPanel(){

    const panel =
        document.getElementById(
            "giftPanel"
        );

    if(!panel) return;


    panel.classList.toggle(
        "active"
    );
}


/* =========================================
   MONEY
========================================= */

function showMoney(){

    const money =
        document.getElementById(
            "moneyOptions"
        );

    const gifts =
        document.getElementById(
            "giftOptions"
        );

    if(money){

        money.style.display =
            "flex";
    }

    if(gifts){

        gifts.style.display =
            "none";
    }

    selectedGift =
        null;

    updateSelectedSupport();
}


/* =========================================
   GIFTS
========================================= */

function showGifts(){

    const money =
        document.getElementById(
            "moneyOptions"
        );

    const gifts =
        document.getElementById(
            "giftOptions"
        );

    if(money){

        money.style.display =
            "none";
    }

    if(gifts){

        gifts.style.display =
            "flex";
    }

    selectedSupport =
        0;

    updateSelectedSupport();
}


/* =========================================
   SELECT MONEY
========================================= */

function selectSupport(amount){

    selectedSupport =
        Number(amount) || 0;

    selectedGift =
        null;

    updateSelectedSupport();
}


/* =========================================
   SELECT GIFT
========================================= */

function selectGift(
    emoji,
    name,
    amount
){

    selectedGift = {

        emoji:emoji,

        name:name,

        amount:
            Number(amount) || 0
    };


    selectedSupport =
        selectedGift.amount;


    updateSelectedSupport();
}


/* =========================================
   SUPPORT STATUS
========================================= */

function updateSelectedSupport(){

    const status =
        document.getElementById(
            "supportStatus"
        );

    if(!status) return;


    if(selectedGift){

        status.textContent =
            "Selected: " +
            selectedGift.emoji +
            " " +
            selectedGift.name +
            " ($" +
            selectedGift.amount +
            ")";

        return;
    }


    if(selectedSupport > 0){

        status.textContent =
            "Selected support: $" +
            selectedSupport;

        return;
    }


    status.textContent =
        "Select an amount or gift.";
}


/* =========================================
   SEND SUPPORT
========================================= */

async function sendGift(){

    if(selectedSupport <= 0){

        alert(
            "Please select a gift or amount first."
        );

        return;
    }


    if(!currentStream){

        alert(
            "Stream information is unavailable."
        );

        return;
    }


    const token =
        localStorage.getItem(
            "canvasAuthToken"
        );


    if(!token){

        alert(
            "Please log in to support a creator."
        );

        return;
    }


    const creatorId =
        currentStream.user_id ||
        currentStream.userId ||
        currentStream.creator_id ||
        currentStream.creatorId;


    if(!creatorId){

        alert(
            "Creator information is unavailable."
        );

        return;
    }


    const payload = {

        creatorId:
            creatorId,

        streamId:
            currentStream.id ||
            getStreamId(),

        amount:
            selectedSupport,

        type:
            selectedGift
                ? "gift"
                : "money"
    };


    if(selectedGift){

        payload.gift =
            selectedGift.name;

        payload.emoji =
            selectedGift.emoji;
    }


    try{

        const response =
            await fetch(
                API_BASE +
                "/api/support",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            token
                    },

                    body:
                        JSON.stringify(
                            payload
                        )
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Support could not be sent."
            );
        }


        const creator =
            currentStream.name ||
            currentStream.username ||
            "the creator";


        if(selectedGift){

            alert(
                "You sent " +
                selectedGift.emoji +
                " " +
                selectedGift.name +
                " to " +
                creator +
                "! ❤️"
            );

        }

        else{

            alert(
                "You supported " +
                creator +
                " with $" +
                selectedSupport +
                "! ❤️"
            );
        }


        selectedSupport =
            0;

        selectedGift =
            null;

        updateSelectedSupport();

        toggleGiftPanel();

    }

    catch(error){

        console.error(
            "Support failed:",
            error
        );

        alert(
            error.message ||
            "Unable to send support."
        );
    }
}


/* =========================================
   CHAT SEND
========================================= */

async function sendChatMessage(){

    const input =
        document.getElementById(
            "chatInput"
        );

    if(!input) return;


    const message =
        input.value.trim();


    if(!message) return;


    const token =
        localStorage.getItem(
            "canvasAuthToken"
        );


    if(!token){

        alert(
            "Please log in to chat."
        );

        return;
    }


    if(!currentStream){

        alert(
            "Stream information is unavailable."
        );

        return;
    }


    try{

        const response =
            await fetch(
                API_BASE +
                "/api/streams/" +
                encodeURIComponent(
                    currentStream.id ||
                    getStreamId()
                ) +
                "/chat",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            token
                    },

                    body:
                        JSON.stringify({

                            message:
                                message

                        })
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Unable to send comment."
            );
        }


        input.value =
            "";

        input.focus();


        if(data.message){

            addChatMessage(
                data.message
            );
        }

    }

    catch(error){

        console.error(
            "Chat failed:",
            error
        );

        alert(
            error.message ||
            "Unable to send comment."
        );
    }
}


/* =========================================
   ADD CHAT MESSAGE
========================================= */

function addChatMessage(message){

    const chat =
        document.getElementById(
            "chatMessages"
        );

    if(!chat) return;


    const empty =
        document.getElementById(
            "chatEmpty"
        );


    if(empty){

        empty.remove();
    }


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "message";


    const username =
        message.name ||
        message.username ||
        "User";


    row.innerHTML =
        "<strong>" +
        escapeHTML(username) +
        ":</strong> " +
        escapeHTML(
            message.message ||
            ""
        );


    chat.appendChild(
        row
    );


    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value){

    return String(
        value || ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );
}


/* =========================================
   ENTER TO SEND
========================================= */

document.addEventListener(
    "keydown",
    function(event){

        const input =
            document.getElementById(
                "chatInput"
            );


        if(
            input &&
            event.key === "Enter" &&
            document.activeElement === input
        ){

            event.preventDefault();

            sendChatMessage();
        }
    }
);


/* =========================================
   INITIAL LOAD
========================================= */

window.addEventListener(
    "DOMContentLoaded",
    function(){

        loadStream();

        updateSelectedSupport();

    }
);

</script>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<script>

let canvasSocket = null;
let streamRefreshTimer = null;


/* =========================================
   SOCKET CONNECTION
========================================= */

function connectCanvasSocket(){

    if(typeof io === "undefined"){

        console.error(
            "Socket.IO client not loaded."
        );

        return;
    }


    try{

        canvasSocket =
            io(
                API_BASE,
                {
                    transports:[
                        "websocket",
                        "polling"
                    ]
                }
            );


        /* ================================
           CONNECTED
        ================================= */

        canvasSocket.on(
            "connect",
            function(){

                console.log(
                    "Canvas watch connected:",
                    canvasSocket.id
                );


                const streamId =
                    getStreamId();


                if(streamId){

                    canvasSocket.emit(
                        "join-stream",
                        {
                            streamId:streamId
                        }
                    );
                }

            }
        );


        /* ================================
           STREAM UPDATED
        ================================= */

        canvasSocket.on(
            "stream-updated",
            function(stream){

                if(!stream) return;


                const currentId =
                    getStreamId();


                if(
                    stream.id &&
                    String(stream.id) !==
                    String(currentId)
                ){

                    return;
                }


                currentStream = {

                    ...currentStream,
                    ...stream

                };


                renderStream(
                    currentStream
                );

            }
        );


        /* ================================
           VIEWER COUNT
        ================================= */

        canvasSocket.on(
            "viewer-count",
            function(data){

                if(!data) return;


                const currentId =
                    getStreamId();


                if(
                    data.streamId &&
                    String(data.streamId) !==
                    String(currentId)
                ){

                    return;
                }


                const viewers =
                    document.getElementById(
                        "viewerCount"
                    );


                if(
                    viewers &&
                    data.count !== undefined
                ){

                    viewers.textContent =
                        "👀 " +
                        Number(
                            data.count
                        ).toLocaleString() +
                        " Watching";
                }

            }
        );


        /* ================================
           NEW COMMENT
        ================================= */

        canvasSocket.on(
            "chat-message",
            function(message){

                if(!message) return;


                const currentId =
                    getStreamId();


                if(
                    message.streamId &&
                    String(message.streamId) !==
                    String(currentId)
                ){

                    return;
                }


                addChatMessage(
                    message
                );

            }
        );


        /* ================================
           STREAM ENDED
        ================================= */

        canvasSocket.on(
            "stream-ended",
            function(stream){

                const currentId =
                    getStreamId();


                if(
                    stream &&
                    stream.id &&
                    String(stream.id) !==
                    String(currentId)
                ){

                    return;
                }


                showStreamEnded();

            }
        );


        canvasSocket.on(
            "disconnect",
            function(){

                console.log(
                    "Canvas watch disconnected."
                );

            }
        );


        canvasSocket.on(
            "connect_error",
            function(error){

                console.error(
                    "Canvas Socket error:",
                    error.message
                );

            }
        );

    }

    catch(error){

        console.error(
            "Socket setup failed:",
            error
        );

    }
}


/* =========================================
   STREAM ENDED
========================================= */

function showStreamEnded(){

    const video =
        document.getElementById(
            "liveVideo"
        );


    if(video){

        try{

            video.pause();

        }

        catch(error){}


        video.removeAttribute(
            "src"
        );

        video.load();

        video.style.display =
            "none";
    }


    const message =
        document.getElementById(
            "videoMessage"
        );


    if(message){

        message.textContent =
            "This live stream has ended.";

        message.classList.remove(
            "hidden"
        );
    }


    const badge =
        document.getElementById(
            "liveBadge"
        );


    if(badge){

        badge.textContent =
            "STREAM ENDED";
    }


    badge &&
    (
        badge.style.background =
            "#6f625b"
    );


    const errorBox =
        document.getElementById(
            "streamError"
        );


    if(errorBox){

        errorBox.textContent =
            "This live stream has ended.";

        errorBox.style.display =
            "block";
    }


    const follow =
        document.getElementById(
            "followButton"
        );


    if(follow){

        follow.disabled =
            true;
    }


    const support =
        document.getElementById(
            "supportButton"
        );


    if(support){

        support.disabled =
            true;
    }


    const panel =
        document.getElementById(
            "giftPanel"
        );


    if(panel){

        panel.classList.remove(
            "active"
        );
    }
}


/* =========================================
   PROFILE ICON
========================================= */

function loadProfilePicture(){

    const saved =
        localStorage.getItem(
            "canvasProfile"
        );


    if(!saved) return;


    try{

        const profile =
            JSON.parse(saved);


        const photo =
            profile.photo ||
            profile.profile_picture ||
            profile.profilePicture ||
            "";


        if(!photo) return;


        const top =
            document.getElementById(
                "topProfileIcon"
            );


        if(top){

            top.innerHTML =
                '<img src="' +
                escapeHTML(photo) +
                '" alt="Profile">';


            top.style.overflow =
                "hidden";

            top.style.borderRadius =
                "50%";
        }


        const bottom =
            document.getElementById(
                "bottomProfileIcon"
            );


        if(bottom){

            bottom.innerHTML =
                '<img src="' +
                escapeHTML(photo) +
                '" alt="Profile">' +
                '<span>Profile</span>';
        }

    }

    catch(error){

        console.error(
            "Profile picture error:",
            error
        );
    }
}


/* =========================================
   STREAM REFRESH
========================================= */

function startStreamRefresh(){

    streamRefreshTimer =
        setInterval(
            async function(){

                if(
                    canvasSocket &&
                    canvasSocket.connected
                ){

                    return;
                }


                const streamId =
                    getStreamId();


                if(!streamId) return;


                try{

                    const response =
                        await fetch(
                            API_BASE +
                            "/api/streams/" +
                            encodeURIComponent(
                                streamId
                            )
                        );


                    if(
                        response.status ===
                        404
                    ){

                        showStreamEnded();

                        return;
                    }


                    if(!response.ok){

                        return;
                    }


                    const data =
                        await response.json();


                    const stream =
                        data.stream ||
                        data;


                    if(stream){

                        currentStream =
                            stream;

                        renderStream(
                            stream
                        );
                    }

                }

                catch(error){

                    console.error(
                        "Stream refresh failed:",
                        error
                    );
                }

            },
            10000
        );
}


/* =========================================
   STOP REFRESH
========================================= */

function stopStreamRefresh(){

    if(streamRefreshTimer){

        clearInterval(
            streamRefreshTimer
        );

        streamRefreshTimer =
            null;
    }
}


/* =========================================
   PAGE START
========================================= */

window.addEventListener(
    "DOMContentLoaded",
    function(){

        loadProfilePicture();

        connectCanvasSocket();

        startStreamRefresh();

    }
);


/* =========================================
   PAGE CLOSE
========================================= */

window.addEventListener(
    "beforeunload",
    function(){

        stopStreamRefresh();


        if(canvasSocket){

            const streamId =
                getStreamId();


            if(streamId){

                canvasSocket.emit(
                    "leave-stream",
                    {
                        streamId:
                            streamId
                    }
                );
            }


            canvasSocket.disconnect();

            canvasSocket =
                null;
        }

    }
);


/* =========================================
   PAGE VISIBILITY
========================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(document.hidden){

            return;
        }


        if(
            !canvasSocket ||
            !canvasSocket.connected
        ){

            loadStream();
        }

    }
);

</script>
