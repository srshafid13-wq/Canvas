<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Canvas - Watch Live</title>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>

/* =========================================
   CANVAS WATCH
   KEEPING ORIGINAL WATCH DESIGN
========================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#000;
    color:#fff;
    overflow-x:hidden;
}


/* =========================================
   TOP NAV
   SAME CANVAS LOGO AS STREAM
========================================= */

.top-nav{
    width:100%;
    height:70px;
    display:flex;
    align-items:center;
    padding:0 20px;
    background:#000;
}

.logo{
    text-decoration:none;
    color:#fff;
    font-size:32px;
    font-weight:800;
    line-height:1;
}

.logo:visited,
.logo:hover,
.logo:active{
    color:#fff;
}


/* =========================================
   WATCH PAGE
========================================= */

.watch-page{
    width:100%;
    max-width:900px;
    margin:0 auto;
    padding:15px 15px 90px;
}


/* =========================================
   VIDEO
========================================= */

.video-section{
    width:100%;
}

.video-wrapper{
    position:relative;
    width:100%;
    aspect-ratio:16 / 9;
    background:#111;
    border-radius:12px;
    overflow:hidden;
}

#liveVideo{
    width:100%;
    height:100%;
    display:block;
    object-fit:contain;
    background:#000;
}

.video-placeholder{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#aaa;
    font-size:15px;
    background:#111;
}

.video-placeholder.hidden{
    display:none;
}


/* =========================================
   LIVE BADGE
========================================= */

.live-badge{
    position:absolute;
    top:12px;
    left:12px;
    padding:5px 9px;
    border-radius:6px;
    background:#e53935;
    color:#fff;
    font-size:12px;
    font-weight:700;
    letter-spacing:.4px;
}


/* =========================================
   WATCHING COUNT
========================================= */

.watching-count{
    position:absolute;
    top:12px;
    right:12px;
    padding:5px 9px;
    border-radius:6px;
    background:rgba(0,0,0,.65);
    color:#fff;
    font-size:12px;
    font-weight:600;
}


/* =========================================
   STREAM ENDED
========================================= */

.stream-ended{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    background:#111;
    padding:20px;
}

.stream-ended.show{
    display:flex;
}

.stream-ended-title{
    font-size:22px;
    font-weight:700;
    margin-bottom:8px;
}

.stream-ended-text{
    color:#aaa;
    font-size:14px;
}


/* =========================================
   STREAM INFORMATION
========================================= */

.stream-info{
    width:100%;
    padding:16px 0 10px;
}

.stream-title{
    font-size:21px;
    font-weight:700;
    line-height:1.3;
    word-break:break-word;
}

.stream-status{
    margin-top:6px;
    color:#aaa;
    font-size:13px;
}


/* =========================================
   CREATOR ROW
========================================= */

.creator-row{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:10px 0 15px;
}

.creator-main{
    min-width:0;
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
}

.creator-main:focus{
    outline:none;
}

.creator-photo{
    width:38px;
    height:38px;
    min-width:38px;
    min-height:38px;
    border-radius:50%;
    object-fit:cover;
    border:1.5px solid #d4af37;
    background:#111;
}

.creator-details{
    min-width:0;
}

.creator-name{
    font-size:15px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.creator-username{
    margin-top:2px;
    color:#999;
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}


/* =========================================
   FOLLOW BUTTON
========================================= */

.follow-button{
    flex-shrink:0;
    border:none;
    border-radius:7px;
    padding:8px 15px;
    background:#fff;
    color:#000;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
}

.follow-button.following{
    background:#222;
    color:#fff;
    border:1px solid #444;
}

.follow-button:disabled{
    opacity:.6;
    cursor:default;
}


/* =========================================
   SUPPORT
========================================= */

.support-button{
    width:100%;
    height:42px;
    border:none;
    border-radius:8px;
    background:#d4af37;
    color:#000;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    margin-bottom:15px;
}


/* =========================================
   CHAT
========================================= */

.chat-section{
    width:100%;
    border:1px solid #222;
    border-radius:10px;
    overflow:hidden;
    background:#080808;
}

.chat-header{
    height:45px;
    display:flex;
    align-items:center;
    padding:0 14px;
    border-bottom:1px solid #222;
    font-size:14px;
    font-weight:700;
}

.chat-messages{
    width:100%;
    height:300px;
    overflow-y:auto;
    padding:10px;
}

.chat-empty{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#666;
    font-size:13px;
}

.chat-message{
    display:flex;
    align-items:flex-start;
    gap:9px;
    margin-bottom:11px;
}

.chat-avatar{
    width:30px;
    height:30px;
    min-width:30px;
    border-radius:50%;
    object-fit:cover;
    background:#111;
}

.chat-content{
    min-width:0;
}

.chat-user{
    font-size:12px;
    font-weight:700;
    margin-bottom:2px;
}

.chat-text{
    color:#ddd;
    font-size:13px;
    line-height:1.4;
    word-break:break-word;
}

.chat-input-row{
    width:100%;
    display:flex;
    gap:8px;
    padding:10px;
    border-top:1px solid #222;
}

#chatInput{
    flex:1;
    min-width:0;
    height:40px;
    border:1px solid #292929;
    border-radius:8px;
    outline:none;
    background:#111;
    color:#fff;
    padding:0 12px;
    font-size:13px;
}

#chatInput:focus{
    border-color:#444;
}

#chatSend{
    width:42px;
    height:40px;
    border:none;
    border-radius:8px;
    background:#fff;
    color:#000;
    font-size:20px;
    font-weight:700;
    cursor:pointer;
}


/* =========================================
   BOTTOM NAV
   EXACT STREAM SIZING
========================================= */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:1000;
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-around;
    background:#000;
    border-top:1px solid #222;
}

.bottom-nav a{
    width:25%;
    height:58px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    color:#aaa;
    text-decoration:none;
    font-size:11px;
}

.bottom-nav a.active{
    color:#fff;
}

.bottom-nav-icon{
    width:23px;
    height:23px;
    font-size:23px;
    line-height:23px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.bottom-nav-icon svg{
    width:23px;
    height:23px;
    display:block;
}

.bottom-profile-image{
    width:25px;
    height:25px;
    min-width:25px;
    min-height:25px;
    border-radius:50%;
    object-fit:cover;
    background:#111;
}


/* =========================================
   TOAST
========================================= */

.toast{
    position:fixed;
    left:50%;
    bottom:82px;
    transform:translateX(-50%);
    z-index:2000;
    display:none;
    padding:10px 15px;
    border-radius:8px;
    background:#222;
    color:#fff;
    font-size:13px;
    white-space:nowrap;
}

.toast.show{
    display:block;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    .top-nav{
        padding:0 15px;
    }

    .logo{
        font-size:29px;
    }

    .watch-page{
        padding-left:12px;
        padding-right:12px;
    }

}

@media(max-width:360px){

    .logo{
        font-size:26px;
    }

}

</style>

</head>

<body>


<!-- =======================================
     TOP NAV
======================================== -->

<header class="top-nav">

    <a
        href="index.html"
        class="logo"
        aria-label="Canvas Home"
    >
        Canvas
    </a>

</header>


<!-- =======================================
     WATCH PAGE
======================================== -->

<main class="watch-page">


    <!-- VIDEO -->

    <section class="video-section">

        <div class="video-wrapper">

            <video
                id="liveVideo"
                autoplay
                playsinline
                controls
            ></video>

            <div
                id="videoPlaceholder"

            </div>

            <div
                id="liveBadge"

                id="watchingCount"

      <!-- =====================================

    <!-- =====================================

    <section class="chat-section">

        </div>

</main>


<!-- =========================================
     TOAST
========================================= -->

<div
    id="toast"
    class="toast"
></div>


<!-- =========================================
     BOTTOM NAV
     SAME SIZE AS STREAM
========================================= -->

<nav
    class="bottom-nav"
    aria-label="Canvas navigation"
>

    <a
        href="index.html"
        aria-label="Home"
    >

        <span class="bottom-nav-icon">
            ⌂
        </span>

        <span>
            Home
        </span>

    </a>


    <a
        href="explore.html"
        aria-label="Explore"
    >

        <span class="bottom-nav-icon">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"

            >

                <circle
                    cx="11"
                    cy="11"
                    r="7"
                ></circle>

                <line
                    x1="16.2"
                    y1="16.2"
                    x2="21"

            </svg>

        </span>

        <span>

        </span>

    <a
        href="golive.html"
        aria-label="Go Live"
    >

        <span class="bottom-nav-icon">
            ◉
        </span>

        <span>
            Go Live
        </span>

    <a

        aria-label="Profile"
    >

        <img
            id="bottomProfileImage"
            class="bottom-profile-image"
            src=""
            alt="Profile"

        </span>

</nav>


<script>

/* =========================================
   CANVAS WATCH
========================================= */

const API_BASE =
    "https://canvas-kh9p.onrender.com";


/* =========================================
   DOM
========================================= */

const liveVideo =
    document.getElementById(
        "liveVideo"
    );

const videoPlaceholder =
    document.getElementById(
        "videoPlaceholder"
    );

const liveBadge =
    document.getElementById(
        "liveBadge"
    );

const watchingCount =
    document.getElementById(
        "watchingCount"
    );

const streamEnded =
    document.getElementById(
        "streamEnded"
    );

const streamTitle =
    document.getElementById(
        "streamTitle"
    );

const streamStatus =
    document.getElementById(
        "streamStatus"
    );

const creatorMain =
    document.getElementById(
        "creatorMain"
    );

const creatorPhoto =
    document.getElementById(
        "creatorPhoto"
    );

const creatorName =
    document.getElementById(
        "creatorName"
    );

const creatorUsername =
    document.getElementById(
        "creatorUsername"
    );

const followButton =
    document.getElementById(
        "followButton"
    );

const supportButton =
    document.getElementById(
        "supportButton"
    );

const chatMessages =
    document.getElementById(
        "chatMessages"
    );

const chatEmpty =
    document.getElementById(
        "chatEmpty"
    );

const chatInput =
    document.getElementById(
        "chatInput"
    );

const chatSend =
    document.getElementById(
        "chatSend"
    );

const bottomProfileImage =
    document.getElementById(
        "bottomProfileImage"
    );

const toast =
    document.getElementById(
        "toast"
    );


/* =========================================
   STATE
========================================= */

let socket = null;

let streamData = null;

let streamId = "";

let creatorData = null;

let creatorId = "";

let creatorUsernameValue = "";

let currentUser = null;

let currentUserId = "";

let authToken = "";

let isFollowing = false;

let followRequestRunning = false;

let supportRequestRunning = false;

let chatSending = false;

let socketConnected = false;

let socketJoined = false;

let currentSocketRoom = "";

let viewerCountValue = 0;

let streamIsLive = true;

let reconnectTimer = null;

let chatMessageIds =
    new Set();

let localMessageIds =
    new Set();

let chatLoaded = false;


/* =========================================
   DEFAULT PROFILE
========================================= */

const DEFAULT_PROFILE_IMAGE =
    "data:image/svg+xml," +
    encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">' +
        '<rect width="200" height="200" fill="#111"/>' +
        '<circle cx="100" cy="75" r="38" fill="#777"/>' +
        '<path d="M35 180c8-40 34-60 65-60s57 20 65 60" fill="#777"/>' +
        '</svg>'
    );


/* =========================================
   PROFILE DEFAULTS
========================================= */

creatorPhoto.src =
    DEFAULT_PROFILE_IMAGE;

bottomProfileImage.src =
    DEFAULT_PROFILE_IMAGE;


/* =========================================
   TOAST
========================================= */

function showToast(
    message
){

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toast._timer
    );

    toast._timer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =========================================
   AUTH
========================================= */

function getAuthToken(){

    return (
        localStorage.getItem(
            "canvasAuthToken"
        ) ||
        localStorage.getItem(
            "authToken"
        ) ||
        ""
    );

}

authToken =
    getAuthToken();


function authHeaders(){

    if(!authToken){

        return {};

    }

    return {
        Authorization:
            "Bearer " +
            authToken
    };

}
/* =========================================
   GET STREAM ID
========================================= */

function getStreamId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return (
        params.get("streamId") ||
        params.get("stream") ||
        params.get("id") ||
        ""
    ).trim();

}

streamId =
    getStreamId();


/* =========================================
   NORMALIZE ID
========================================= */

function normalizeId(
    value
){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }

    return String(
        value
    ).trim();

}


/* =========================================
   EXTRACT CREATOR
========================================= */

function extractCreator(
    stream
){

    if(!stream){

        return {};

    }

    return (
        stream.creator ||
        stream.user ||
        stream.owner ||
        stream.host ||
        stream.profile ||
        {}
    );

}


/* =========================================
   EXTRACT CREATOR ID
========================================= */

function extractCreatorId(
    stream
){

    const creator =
        extractCreator(
            stream
        );

    const value =

        creator.id ||
        creator.userId ||
        creator.user_id ||
        creator._id ||

        stream.creatorId ||
        stream.creator_id ||
        stream.userId ||
        stream.user_id ||
        stream.ownerId ||
        stream.owner_id ||
        "";

    return normalizeId(
        value
    );

}


/* =========================================
   EXTRACT CREATOR USERNAME
========================================= */

function extractCreatorUsername(
    stream
){

    const creator =
        extractCreator(
            stream
        );

    const value =

        creator.username ||
        creator.userName ||
        creator.handle ||

        stream.creatorUsername ||
        stream.creator_username ||
        stream.username ||
        stream.userName ||

        "";

    return String(
        value
    )
    .trim()
    .replace(
        /^@/,
        ""
    );

}


/* =========================================
   EXTRACT CREATOR NAME
========================================= */

function extractCreatorName(
    stream
){

    const creator =
        extractCreator(
            stream
        );

    const value =

        creator.name ||
        creator.displayName ||
        creator.display_name ||
        creator.fullName ||
        creator.full_name ||

        stream.creatorName ||
        stream.creator_name ||
        stream.name ||

        "Creator";

    return String(
        value
    ).trim();

}


/* =========================================
   EXTRACT CREATOR PHOTO
========================================= */

function extractCreatorPhoto(
    stream
){

    const creator =
        extractCreator(
            stream
        );

    const values = [

        creator.profilePhoto,
        creator.profile_photo,

        creator.profilePicture,
        creator.profile_picture,

        creator.avatar,
        creator.avatarUrl,
        creator.avatar_url,

        creator.photo,
        creator.photoUrl,
        creator.photo_url,

        creator.image,
        creator.imageUrl,
        creator.image_url,

        stream.creatorPhoto,
        stream.creator_photo,

        stream.profilePhoto,
        stream.profile_photo,

        stream.profilePicture,
        stream.profile_picture,

        stream.avatar,
        stream.avatarUrl,
        stream.avatar_url

    ];

    for(
        const value of values
    ){

        if(
            value !== null &&
            value !== undefined &&
            String(value).trim()
        ){

            return String(
                value
            ).trim();

        }

    }

    return DEFAULT_PROFILE_IMAGE;

}


/* =========================================
   EXTRACT STREAM TITLE
========================================= */

function extractStreamTitle(
    stream
){

    if(!stream){

        return "Live Stream";

    }

    const value =

        stream.title ||
        stream.streamTitle ||
        stream.stream_title ||
        stream.name ||
        "Live Stream";

    return String(
        value
    ).trim();

}


/* =========================================
   EXTRACT VIDEO URL
========================================= */

function extractVideoUrl(
    stream
){

    if(!stream){

        return "";

    }

    const values = [

        stream.videoUrl,
        stream.video_url,

        stream.streamUrl,
        stream.stream_url,

        stream.playbackUrl,
        stream.playback_url,

        stream.hlsUrl,
        stream.hls_url,

        stream.url,

        stream.video,

        stream.playback

    ];

    for(
        const value of values
    ){

        if(
            typeof value === "string" &&
            value.trim()
        ){

            return value.trim();

        }

    }

    return "";

}


/* =========================================
   STREAM LIVE STATE
========================================= */

function getLiveState(
    stream
){

    if(!stream){

        return false;

    }

    if(
        stream.isLive === false ||
        stream.is_live === false ||
        stream.live === false ||
        stream.active === false
    ){

        return false;

    }

    if(
        stream.ended === true ||
        stream.isEnded === true ||
        stream.is_ended === true
    ){

        return false;

    }

    const status =
        String(
            stream.status ||
            ""
        ).toLowerCase();

    if(
        status === "ended" ||
        status === "offline" ||
        status === "finished"
    ){

        return false;

    }

    return true;

}


/* =========================================
   APPLY STREAM DATA
========================================= */

function applyStreamData(
    stream
){

    if(!stream){

        return;

    }

    streamData =
        stream;

    creatorData =
        extractCreator(
            stream
        );

    const newCreatorId =
        extractCreatorId(
            stream
        );

    const newUsername =
        extractCreatorUsername(
            stream
        );

    creatorId =
        newCreatorId;

    creatorUsernameValue =
        newUsername;


    streamTitle.textContent =

    ){

        return data.stream;

    ){

        return data.data;

    }

    if(
        data.result &&
        typeof data.result === "object"
    ){

        return data.result;

/* =========================================

async function loadStream(){

        API_BASE +

            const data =

            const stream =
                getStreamObject(
                    data
                );

            if(!stream){

            }

            streamData =
                stream;

            applyStreamData(
                stream
            );

                "Stream request failed:",
                error
            );

        }

    }

}

/* =========================================
   SOCKET CONNECTION
========================================= */

function connectSocket(){

    if(!streamId){

        return;

    }

    if(socket){

        try{

            socket.disconnect();

        }catch(error){

            console.log(
                "Socket cleanup failed:",
                error
            );

        }

    }

    socketConnected =
        false;

    socketJoined =
        false;

    socket =
        io(
            API_BASE,
            {
                transports:[
                    "websocket",
                    "polling"
                ],
                reconnection:true,
                reconnectionAttempts:Infinity,
                reconnectionDelay:500,
                reconnectionDelayMax:5000
            }
        );


    /* =====================================
       CONNECTED
    ====================================== */

    socket.on(
        "connect",
        function(){

            socketConnected =
                true;

            joinStream();

        }
    );


    /* =====================================
       DISCONNECTED
    ====================================== */

    socket.on(
        "disconnect",
        function(){

            socketConnected =
                false;

            socketJoined =
                false;

            scheduleReconnect();

        }
    );


    /* =====================================
       CONNECTION ERROR
    ====================================== */

    socket.on(
        "connect_error",
        function(error){

            console.log(
                "Canvas socket error:",
                error
            );

            socketConnected =
                false;

        }
    );


    /* =====================================
       VIEWER COUNT
    ====================================== */

    socket.on(
        "viewer:count",
        function(data){

            updateViewerCount(
                data
            );

        }
    );


    socket.on(
        "viewer-count",
        function(data){

            updateViewerCount(
                data
            );

        }
    );


    socket.on(
        "viewers",
        function(data){

            updateViewerCount(
                data
            );

        }
    );


    socket.on(
        "stream:viewers",
        function(data){

            updateViewerCount(
                data
            );

        }
    );


    /* =====================================
       LIVE CHAT
    ====================================== */

    socket.on(
        "chat:message",
        function(message){

            addChatMessage(
                message
            );

        }
    );


    socket.on(
        "chat-message",
        function(message){

            addChatMessage(
                message
            );

        }
    );


    /* =====================================
       STREAM ENDED
    ====================================== */

    socket.on(
        "stream:ended",
        function(data){

            if(
                !data ||
                isSameStream(
                    data
                )
            ){

                handleStreamEnded();

            }

        }
    );


    socket.on(
        "stream-ended",
        function(data){

            if(
                !data ||
                isSameStream(
                    data
                )
            ){

                handleStreamEnded();

            }

        }
    );

}


/* =========================================
   JOIN STREAM
========================================= */

function joinStream(){

    if(
        !socket ||
        !socketConnected ||
        !streamId ||
        socketJoined
    ){

        return;

    }

    socket.emit(
        "stream:join",
        {
            streamId:
                streamId
        }
    );

    socketJoined =
        true;

}


/* =========================================
   LEAVE STREAM
========================================= */

function leaveStream(){

    if(
        !socket ||
        !socketConnected ||
        !streamId
    ){

        return;

    }

    socket.emit(
        "stream:leave",
        {
            streamId:
                streamId
        }
    );

    socketJoined =
        false;

}


/* =========================================
   VIEWER COUNT
========================================= */

function updateViewerCount(
    data
){

    let count = null;


    if(
        typeof data === "number"
    ){

        count =
            data;

    }else if(
        data &&
        typeof data.count === "number"
    ){

        count =
            data.count;

    }else if(
        data &&
        typeof data.viewerCount === "number"
    ){

        count =
            data.viewerCount;

    }else if(
        data &&
        typeof data.viewers === "number"
    ){

        count =
            data.viewers;

    }


    if(
        count === null
    ){

        return;

    }


    viewerCountValue =
        Math.max(
            0,
            Math.floor(
                count
            )
        );


    watchingCount.textContent =
        "👁 " +
        viewerCountValue +
        " watching";

}


/* =========================================
   SOCKET RECONNECT
========================================= */

function scheduleReconnect(){

    if(
        reconnectTimer
    ){

        return;

    }

    reconnectTimer =
        setTimeout(
            function(){

                reconnectTimer =
                    null;

                if(
                    streamId &&
                    !socketConnected &&
                    streamIsLive
                ){

                    connectSocket();

                }

            },
            1000
        );

}


/* =========================================
   KEEP SOCKET ALIVE
========================================= */

setInterval(
    function(){

        if(
            !streamId ||
            !streamIsLive
        ){

            return;

        }

        if(
            !socketConnected
        ){

            scheduleReconnect();

            return;

        }

        if(
            !socketJoined
        ){

            joinStream();

        }

    },
    3000
);

            }

    }

            );

        }

    }

}


/* =========================================
   EMPTY CHAT
========================================= */

function showChatEmpty(){

    if(
        chatEmpty &&
        !chatMessages.contains(
            chatEmpty
        )
    ){

        chatMessages.appendChild(
            chatEmpty
        );

    }

}


function removeChatEmpty(){

    if(
        chatEmpty &&
        chatEmpty.parentNode ===
        chatMessages
    ){

        chatEmpty.remove();

    }

}


/* =========================================
   ADD CHAT MESSAGE
========================================= */

function addChatMessage(data){

    const message =
        getMessageObject(
            data
        );

    if(!message){
        return;
    }


    const text =
        getMessageText(
            message
        );

    if(!text){
        return;
    }


    const messageId =
        getMessageId(
            message
        );


    if(
        messageId &&
        chatMessageIds.has(
            messageId
        )
    ){

        return;

    }


    if(messageId){

        chatMessageIds.add(
            messageId
        );

    }


    removeChatEmpty();


    const author =
        getMessageAuthor(
            message
        );


    const name =
        String(
            author.name ||
            author.displayName ||
            message.username ||
            message.userName ||
            "User"
        );


    const username =
        String(
            author.username ||
            message.username ||
            ""
        );


    const photo =
        author.profilePicture ||
        author.profilePhoto ||
        author.avatar ||
        author.photo ||
        message.profilePicture ||
        message.profilePhoto ||
        "";


    const row =
        document.createElement(
            "div"
        );

    row.className =
        "chat-message";


    const avatar =
        document.createElement(
            "img"
        );

    avatar.className =
        "chat-avatar";

    avatar.src =
        photo ||
        DEFAULT_PROFILE_IMAGE;

    avatar.alt =
        name;


    avatar.onerror =
        function(){

            this.src =
                DEFAULT_PROFILE_IMAGE;

        };


    const body =
        document.createElement(
            "div"
        );

    body.className =
        "chat-message-body";


    const authorLine =
        document.createElement(
            "div"
        );

    authorLine.className =
        "chat-author";


    authorLine.textContent =
        username ?
        name + " @" + username :
        name;


    const textElement =
        document.createElement(
            "div"
        );

    textElement.className =
        "chat-text";


    textElement.textContent =
        text;


    body.appendChild(
        authorLine
    );

    body.appendChild(
        textElement
    );


    row.appendChild(
        avatar
    );

    row.appendChild(
        body
    );


    chatMessages.appendChild(
        row
    );


    chatMessages.scrollTop =
        chatMessages.scrollHeight;

}


/* =========================================
   SEND CHAT
========================================= */

async function sendChatMessage(){

    if(
        chatSending
    ){
        return;
    }


    const text =
        chatInput.value.trim();


    if(!text){
        return;
    }


    if(!streamId){
        return;
    }


    chatSending =
        true;

    chatSend.disabled =
        true;


    const messagePayload = {

        streamId:
            streamId,

        text:
            text

    };


    try{

        if(
            socket &&
            socketConnected
        ){

            socket.emit(
                "chat:send",
                messagePayload
            );


            chatInput.value =
                "";

            return;

        }


        const endpoints = [

            API_BASE +
            "/api/streams/" +
            encodeURIComponent(
                streamId
            ) +
            "/chat",

            API_BASE +
            "/api/stream/" +
            encodeURIComponent(
                streamId
            ) +
            "/chat"

        ];


        for(
            const endpoint of endpoints
        ){

            try{

                const response =
                    await fetch(
                        endpoint,
                        {
                            method:"POST",

                            headers:{
                                "Content-Type":
                                    "application/json",

                                ...(authToken ?
                                    {
                                        Authorization:
                                            "Bearer " +
                                            authToken
                                    } :
                                    {})
                            },

                            body:
                                JSON.stringify(
                                    messagePayload
                                )
                        }
                    );


                if(
                    !response.ok
                ){

                    continue;

                }


                const data =
                    await response.json();


                const message =
                    getMessageObject(
                        data
                    );


                if(message){

                    addChatMessage(
                        message
                    );

                }else{

                    addChatMessage({

                        id:
                            "local-" +
                            Date.now(),

                        text:
                            text,

                        username:
                            currentUser &&
                            currentUser.username ?
                            currentUser.username :
                            "You",

                        name:
                            currentUser &&
                            currentUser.name ?
                            currentUser.name :
                            "You"

                    });

                }


                chatInput.value =
                    "";

                break;

            }catch(error){

                console.log(
                    "Chat send failed:",
                    error
                );

            }

        }

    }finally{

        chatSending =
            false;

        chatSend.disabled =
            false;

        chatInput.focus();

    }

}


/* =========================================
   CHAT BUTTON
========================================= */

chatSend.addEventListener(
    "click",
    function(){

        sendChatMessage();

    }
);


/* =========================================
   ENTER TO SEND
========================================= */

chatInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            sendChatMessage();

        }

    }
);


/* =========================================
   CHAT INPUT FAST RESPONSE
========================================= */

chatInput.addEventListener(
    "input",
    function(){

        if(
            this.value.length >
            500
        ){

            this.value =
                this.value.substring(
                    0,
                    500
                );

        }

    }
);


/* =========================================
   CREATOR PHOTO FALLBACK
========================================= */

creatorPhoto.addEventListener(
    "error",
    function(){

        this.src =
            DEFAULT_PROFILE_IMAGE;

    }
);


/* =========================================
   PROFILE PHOTO CLICK
========================================= */

creatorPhoto.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        openCreatorProfile();

    }
);

</script>
