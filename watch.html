<style>

/* =========================================
   CANVAS WATCH
========================================= */

.video-placeholder{

}

/* =========================================
   STREAM INFORMATION
========================================= */

.stream-information{

/* =========================================
   FOLLOW

========================================= */

.follow-area{

    justify-content:flex-start;

}

.follow-button{

    padding:0 17px;

    border-radius:10px;

    color:#fff;

}

.follow-button:hover{

}

.follow-button:active{

}

.follow-button.following{
    background:#4b3326;
    color:#fff;
}

.follow-button:disabled{
    opacity:.65;
    cursor:not-allowed;
}

/* =========================================
   CREATOR
========================================= */

.creator-row{

    display:flex;
    align-items:center;

}

.creator-profile-link{
    flex:1;

    align-items:center;

    text-decoration:none;

}

.creator-picture{

    height:48px;

    align-items:center;

}

.creator-details{

.creator-name{

.creator-username{

/* =========================================

.stream-message{

    color:#6b5545;
    text-align:center;
    font-size:14px;
    line-height:1.5;
}

.stream-message.show{
    display:block;

<script>

/* =========================================
   CANVAS WATCH JAVASCRIPT
========================================= */

const API_BASE =
    "https://canvas-kh9p.onrender.com";


/* =========================================
   ELEMENTS
========================================= */

const liveVideo =
    document.getElementById("liveVideo");

const videoPlaceholder =
    document.getElementById(
        "videoPlaceholder"
    );

const streamTitle =

    );

const chatSendButton =

    );

const giftPanel =

    );


/* =========================================
   IMPORTANT:
   THESE WERE MISSING BEFORE
========================================= */

const moneyOptions =
    document.getElementById(
        "moneyOptions"
    );

const giftOptions =
    document.getElementById(
        "giftOptions"
    );

const supportStatus =
    document.getElementById(
        "supportStatus"
    );


/* =========================================
   STATE
========================================= */

let currentStream = null;

let currentStreamId = "";

let currentCreatorId = "";

let currentCreatorUsername = "";

let currentCreatorProfileUrl = "";

let socket = null;

let socketConnected = false;

let refreshTimer = null;

let currentViewerCount = 0;

let isFollowing = false;

let followBusy = false;

let chatLoaded = false;

let leavingStream = false;


/*
 * Messages already displayed.
 * These prevent Socket.IO from
 * showing the same message twice.
 */

const renderedChatIds =
    new Set();


/*
 * Fallback duplicate protection
 * for messages that don't have an ID.
 */

const renderedChatFallbacks =
    new Map();


/*
 * Messages displayed immediately
 * before the server sends its echo.
 */

const pendingChatMessages =
    new Map();


/* =========================================
   AUTH HELPERS
========================================= */

function getAuthToken(){

    return (
        localStorage.getItem(
            "canvasAuthToken"
        ) ||
        localStorage.getItem(
            "authToken"
        ) ||
        ""
    );

}


function authHeaders(){

    const token =
        getAuthToken();

    const headers = {
        "Content-Type":
            "application/json"
    };

    if(token){

        headers.Authorization =
            "Bearer " + token;

    }

    return headers;

}


/* =========================================
   SAFE VALUE HELPER
========================================= */

function getValue(
    object,
    keys,
    fallback=""
){

    if(
        !object ||
        typeof object !== "object"
    ){
        return fallback;
    }

    for(
        const key of keys
    ){

        const value =
            object[key];

        if(
            value !== undefined &&
            value !== null &&
            String(value).trim() !== ""
        ){

            return value;

        }

    }

    return fallback;

}
<script>
function getCreatorObjects(stream){
    const objects = [];

    if(
        stream &&
        typeof stream === "object"
    ){
        objects.push(stream);

        const possibleCreatorObjects = [
            stream.creator,
            stream.user,
            stream.profile,
            stream.owner,
            stream.creatorProfile,
            stream.creatorUser,
            stream.userProfile,
            stream.ownerProfile
        ];

        for(
            const item of possibleCreatorObjects
        ){
            if(
                item &&
                typeof item === "object"
            ){
                objects.push(item);

                if(
                    item.profile &&
                    typeof item.profile === "object"
                ){
                    objects.push(item.profile);
                }

                if(
                    item.user &&
                    typeof item.user === "object"
                ){
                    objects.push(item.user);
                }

                if(
                    item.creator &&
                    typeof item.creator === "object"
                ){
                    objects.push(item.creator);
                }

                if(
                    item.owner &&
                    typeof item.owner === "object"
                ){
                    objects.push(item.owner);
                }
            }
        }
    }

    return objects;
}


function getCreatorId(stream){
    const objects =
        getCreatorObjects(stream);

    const keys = [
        "creatorId",
        "creator_id",
        "userId",
        "user_id",
        "ownerId",
        "owner_id",
        "profileId",
        "profile_id",
        "id"
    ];

    for(
        const object of objects
    ){
        const value =
            getValue(
                object,
                keys,
                ""
            );

        if(
            value !== "" &&
            value !== null &&
            value !== undefined
        ){
            return String(value);
        }
    }

    return "";
}


function getCreatorNameValue(stream){
    const objects =
        getCreatorObjects(stream);

    const keys = [
        "creatorName",
        "creator_name",
        "displayName",
        "display_name",
        "fullName",
        "full_name",
        "name",
        "username"
    ];

    for(
        const object of objects
    ){
        const value =
            getValue(
                object,
                keys,
                ""
            );

        if(
            String(value).trim() !== ""
        ){
            return String(value).trim();
        }
    }

    return "Creator";
}


function getCreatorUsernameValue(stream){
    const objects =
        getCreatorObjects(stream);

    const keys = [
        "creatorUsername",
        "creator_username",
        "username",
        "userName",
        "user_name",
        "handle"
    ];

    for(
        const object of objects
    ){
        const value =
            getValue(
                object,
                keys,
                ""
            );

        if(
            String(value).trim() !== ""
        ){
            let username =
                String(value).trim();

            if(
                username.startsWith("@")
            ){
                username =
                    username.substring(1);
            }

            return username;
        }
    }

    return "";
}


function getCreatorPhoto(stream){
    const objects =
        getCreatorObjects(stream);

    const keys = [
        "creatorPhoto",
        "creator_photo",
        "profilePhoto",
        "profile_photo",
        "profilePicture",
        "profile_picture",
        "avatar",
        "avatarUrl",
        "avatar_url",
        "photo",
        "photoUrl",
        "photo_url",
        "image",
        "imageUrl",
        "image_url"
    ];

    for(
        const object of objects
    ){
        const value =
            getValue(
                object,
                keys,
                ""
            );

        if(
            String(value).trim() !== ""
        ){
            return String(value).trim();
        }
    }

    return "";
}


function getCreatorProfileUrl(stream){
    const objects =
        getCreatorObjects(stream);

    const keys = [
        "creatorProfileUrl",
        "creator_profile_url",
        "profileUrl",
        "profile_url",
        "profileLink",
        "profile_link",
        "url"
    ];

    for(
        const object of objects
    ){
        const value =
            getValue(
                object,
                keys,
                ""
            );

        const text =
            String(value).trim();

        if(
            text &&
            (
                text.includes("profile") ||
                text.startsWith("/") ||
                text.startsWith("http")
            )
        ){
            return text;
        }
    }

    return "";
}


function getStreamId(){
    const params =
        new URLSearchParams(
            window.location.search
        );

    return (
        params.get("streamId") ||
        params.get("stream_id") ||
        params.get("id") ||
        params.get("stream") ||
        ""
    ).trim();
}


function updateCreatorProfileLink(stream){
    if(
        !creatorProfileLink
    ){
        return;
    }

    const creatorId =
        getCreatorId(stream);

    const username =
        getCreatorUsernameValue(stream);

    const directUrl =
        getCreatorProfileUrl(stream);

    currentCreatorId =
        creatorId;

    currentCreatorUsername =
        username;

    currentCreatorProfileUrl =
        directUrl;

    let profileUrl =
        directUrl;

    if(
        !profileUrl
    ){
        const params =
            new URLSearchParams();

        if(
            creatorId
        ){
            params.set(
                "userId",
                creatorId
            );
        }

        if(
            username
        ){
            params.set(
                "username",
                username
            );
        }

        profileUrl =
            "profile.html";

        const query =
            params.toString();

        if(
            query
        ){
            profileUrl +=
                "?" + query;
        }
    }

    creatorProfileLink.href =
        profileUrl;

    creatorProfileLink.dataset.userId =
        creatorId;

    creatorProfileLink.dataset.username =
        username;
}


function renderCreator(stream){
    const name =
        getCreatorNameValue(stream);

    const username =
        getCreatorUsernameValue(stream);

    const photo =
        getCreatorPhoto(stream);

    creatorName.textContent =
        name || "Creator";

    creatorUsername.textContent =
        username
            ? "@" + username
            : "@username";

    creatorPictureContainer.innerHTML = "";

    if(
        photo
    ){
        const image =
            document.createElement("img");

        image.src =
            photo;

        image.alt =
            name || "Creator";

        image.loading =
            "lazy";

        image.onerror =
            function(){
                creatorPictureContainer.innerHTML =
                    '<span id="creatorDefaultIcon">⬤</span>';
            };

        creatorPictureContainer.appendChild(
            image
        );
    }else{
        creatorPictureContainer.innerHTML =
            '<span id="creatorDefaultIcon">⬤</span>';
    }

    updateCreatorProfileLink(
        stream
    );
}


function renderStream(stream){
    if(
        !stream ||
        typeof stream !== "object"
    ){
        return;
    }

    currentStream =
        stream;

    const title =
        getValue(
            stream,
            [
                "title",
                "streamTitle",
                "stream_title",
                "name"
            ],
            "Live Stream"
        );

    streamTitle.textContent =
        String(title);

    renderCreator(
        stream
    );

    const initialViewers =
        getValue(
            stream,
            [
                "viewerCount",
                "viewer_count",
                "viewers",
                "watching",
                "currentViewers"
            ],
            0
        );

    const numericViewers =
        Number(initialViewers);

    if(
        Number.isFinite(numericViewers)
    ){
        currentViewerCount =
            Math.max(
                0,
                numericViewers
            );
    }

    updateWatchingCount(
        currentViewerCount
    );
}


function setupVideo(stream){
    if(
        !liveVideo
    ){
        return;
    }

    const videoUrl =
        getValue(
            stream,
            [
                "video_url",
                "videoUrl",
                "stream_url",
                "streamUrl",
                "playback_url",
                "playbackUrl",
                "hls_url",
                "hlsUrl",
                "url"
            ],
            ""
        );

    if(
        !videoUrl
    ){
        liveVideo.removeAttribute(
            "src"
        );

        liveVideo.style.display =
            "none";

        if(
            videoPlaceholder
        ){
            videoPlaceholder.style.display =
                "flex";

            videoPlaceholder.textContent =
                "Live video is unavailable.";
        }

        return;
    }

    liveVideo.src =
        String(videoUrl);

    liveVideo.style.display =
        "block";

    if(
        videoPlaceholder
    ){
        videoPlaceholder.style.display =
            "none";
    }

    liveVideo.load();

    const playPromise =
        liveVideo.play();

    if(
        playPromise &&
        typeof playPromise.catch === "function"
    ){
        playPromise.catch(
            function(){
                /* Browser autoplay policy may block playback. */
            }
        );
    }
}


function showStreamError(message){
    if(
        videoPlaceholder
    ){
        videoPlaceholder.style.display =
            "flex";

        videoPlaceholder.textContent =
            message ||
            "Unable to load this stream.";
    }

    if(
        liveVideo
    ){
        liveVideo.style.display =
            "none";
    }

    if(
        streamMessage
    ){
        streamMessage.textContent =
            message ||

                await response.json();

            data = null;
        }

        if(
            !response.ok
        ){
            throw new Error(
                data &&
                (
                    data.message ||
                    data.error
                )
                    ? (
                        data.message ||
                        data.error
                    )
                    : "Unable to load stream."
            );
        }

        ){

            );

        ){

function updateWatchingCount(count){
    let value =
        Number(count);

    if(
        !Number.isFinite(value)
    ){
        value = 0;
    }

    value =
        Math.max(
            0,
            Math.floor(value)
        );

    currentViewerCount =
        value;

    if(
        watchingCount
    ){
        watchingCount.textContent =
            value.toLocaleString();
    }
}


function extractViewerCount(payload){
    if(
        typeof payload === "number"
    ){
        return payload;
    }

    if(
        typeof payload === "string" &&
        payload.trim() !== ""
    ){
        const number =
            Number(payload);

        if(
            Number.isFinite(number)
        ){
            return number;
        }
    }

    if(
        payload &&
        typeof payload === "object"
    ){
        const value =
            getValue(
                payload,
                [
                    "count",
                    "viewers",
                    "viewerCount",
                    "viewer_count",
                    "watching",
                    "currentViewers",
                    "current_viewers"
                ],
                null
            );

        if(
            value !== null &&
            value !== ""
        ){
            const number =
                Number(value);

            if(
                Number.isFinite(number)
            ){
                return number;
            }
        }
    }

    return null;
}


function isSameStreamPayload(payload){
    if(
        !payload ||
        typeof payload !== "object"
    ){
        return true;
    }

    const payloadStreamId =
        getValue(
            payload,
            [
                "streamId",
                "stream_id",
                "id"
            ],
            ""
        );

    if(
        !payloadStreamId
    ){
        return true;
    }

    return String(
        payloadStreamId
    ) === String(
        currentStreamId
    );
}


function normalizeMessageText(value){
    return String(
        value === undefined ||
        value === null
            ? ""
            : value
    ).trim();
}


function getChatText(message){
    if(
        typeof message === "string"
    ){
        return normalizeMessageText(
            message
        );
    }

    if(
        !message ||
        typeof message !== "object"
    ){
        return "";
    }

    return normalizeMessageText(
        getValue(
            message,
            [
                "message",
                "text",
                "content",
                "body",
                "chat"
            ],
            ""
        )
    );
}


function getChatUsername(message){
    if(
        !message ||
        typeof message !== "object"
    ){
        return "";
    }

    let username =
        getValue(
            message,
            [
                "username",
                "userName",
                "user_name",
                "displayName",
                "display_name",
                "name"
            ],
            ""
        );

    if(
        !username &&
        message.user &&
        typeof message.user === "object"
    ){
        username =
            getValue(
                message.user,
                [
                    "username",
                    "userName",
                    "user_name",
                    "displayName",
                    "display_name",
                    "name"
                ],
                ""
            );
    }

    username =
        normalizeMessageText(
            username
        );

    if(
        username.startsWith("@")
    ){
        username =
            username.substring(1);
    }

    return username;
}


function getChatMessageId(message){
    if(
        !message ||
        typeof message !== "object"
    ){
        return "";
    }

    const value =
        getValue(
            message,
            [
                "id",
                "messageId",
                "message_id",
                "chatId",
                "chat_id",
                "_id"
            ],
            ""
        );

    return normalizeMessageText(
        value
    );
}


function getChatFallbackKey(message){
    const text =
        getChatText(
            message
        );

    const username =
        getChatUsername(
            message
        );

    const createdAt =
        getValue(
            message,
            [
                "createdAt",
                "created_at",
                "timestamp",
                "time"
            ],
            ""
        );

    return [
        username,
        text,
        String(createdAt)
    ].join("|");
  }

function getCurrentUserName(){
    const keys = [
        "canvasCurrentUser",
        "canvasUser",
        "canvasUserProfile"
    ];

    for(
        const key of keys
    ){
        try{
            const raw =
                localStorage.getItem(
                    key
                );

            if(
                !raw
            ){
                continue;
            }

            let value =
                raw;

            try{
                value =
                    JSON.parse(
                        raw
                    );
            }catch(error){
                /* Plain string is also supported. */
            }

            if(
                typeof value === "string"
            ){
                const name =
                    value.trim();

                if(
                    name
                ){
                    return name;
                }
            }

            if(
                value &&
                typeof value === "object"
            ){
                const name =
                    getValue(
                        value,
                        [
                            "username",
                            "userName",
                            "user_name",
                            "displayName",
                            "display_name",
                            "name"
                        ],
                        ""
                    );

                if(
                    String(name).trim()
                ){
                    return String(
                        name
                    ).trim();
                }
            }
        }catch(error){
            console.warn(
                "Unable to read current user:",
                error
            );
        }
    }

    return "You";
}


function getCurrentUserId(){

                            ],

                        );

                }

            }

    return "";
}


function addChatMessage(
    message,
    options = {}
){
    if(
        !chatMessages
    ){
        return null;
    }

    const text =
        getChatText(
            message
        );

    if(
        !text
    ){
        return null;
    }

    const messageId =
        getChatMessageId(
            message
        );

    const fallbackKey =
        getChatFallbackKey(
            message
        );

    if(
        messageId &&
        renderedChatIds.has(
            messageId
        )
    ){
        return null;
    }

    if(
        fallbackKey &&
        renderedChatFallbacks.has(
            fallbackKey
        )
    ){
        return renderedChatFallbacks.get(
            fallbackKey
        );
    }

    const username =
        getChatUsername(
            message
        ) ||
        (
            options.username ||
            getCurrentUserName()
        );

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "chat-message";

    if(
        options.local
    ){
        wrapper.classList.add(
            "chat-message-local"
        );
    }

    if(
        messageId
    ){
        wrapper.dataset.messageId =
            messageId;

        renderedChatIds.add(
            messageId
        );
    }

    if(
        fallbackKey
    ){
        wrapper.dataset.fallbackKey =
            fallbackKey;

        renderedChatFallbacks.set(
            fallbackKey,
            wrapper
        );
    }

    const nameElement =
        document.createElement(
            "strong"
        );

    nameElement.className =
        "chat-username";

    nameElement.textContent =
        username || "User";

    const textElement =
        document.createElement(
            "span"
        );

    textElement.className =
        "chat-text";

    textElement.textContent =
        text;

    wrapper.appendChild(
        nameElement
    );

    wrapper.appendChild(
        document.createTextNode(
            " "
        )
    );

    wrapper.appendChild(
        textElement
    );

    removeChatEmpty();

    chatMessages.appendChild(
        wrapper
    );

    if(
        options.scroll !== false
    ){
        scrollChatToBottom();
    }

    return wrapper;
}


function markPendingChat(
    text,
    messageId = ""
){
    const key =
        normalizeMessageText(
            text
        );

    if(
        !key
    ){
        return;
    }

    pendingChatMessages.set(
        key,
        {
            text:key,
            messageId:
                messageId || "",
            createdAt:
                Date.now()
        }
    );
}


function consumePendingChat(
    message
){
    const text =
        getChatText(
            message
        );

    if(
        !text
    ){
        return false;
    }

    const pending =
        pendingChatMessages.get(
            text
        );

    if(
        !pending
    ){
        return false;
    }

    pendingChatMessages.delete(
        text
    );

    if(
        pending.messageId
    ){
        const incomingId =
            getChatMessageId(
                message
            );

        if(
            incomingId &&
            incomingId !==
                pending.messageId
        ){
            return false;
        }
    }

    return true;
}


function handleIncomingChat(message){
    if(
        !message
    ){
        return;
    }

    if(
        !isSameStreamPayload(
            message
        )
    ){
        return;
    }

    const text =
        getChatText(
            message
        );

    if(
        !text
    ){
        return;
    }

    const messageId =
        getChatMessageId(
            message
        );

    /*
     * If this is the server echo of a message
     * already shown instantly on this device,
     * do not append it a second time.
     */
    const wasPending =
        consumePendingChat(
            message
        );

    if(
        wasPending &&
        messageId
    ){
        renderedChatIds.add(
            messageId
        );

        const localFallback =
            getChatFallbackKey(
                {
                    ...message,
                    username:
                        getChatUsername(
                            message
                        ) ||
                        getCurrentUserName()
                }
            );

        if(
            localFallback
        ){
            renderedChatFallbacks.set(
                localFallback,
                true
            );
        }

        return;
    }

    addChatMessage(
        message,
        {
            local:false,
            scroll:true
        }
    );
}


async function loadExistingChat(){

                            "application/json"
                    },
                    cache:"no-store"
                }
            );

        if(
            !response.ok
        ){
            return;
        }

        const data =
            await response.json();

        let messages =
            [];

        if(
            Array.isArray(data)
        ){
            messages =
                data;
        }else if(
            data &&
            Array.isArray(
                data.messages
            )
        ){
            messages =
                data.messages;
        }else if(

            )
        ){
            messages =
                data.chat;
        }else if(
            data &&
            Array.isArray(
                data.data
            )
        ){
            messages =
                data.data;
        }

        messages.forEach(
            function(message){
                addChatMessage(
                    message,
                    {
                        local:false,
                        scroll:false
                    }
                );
            }
        );

        scrollChatToBottom();

            "Unable to load existing chat:",

        );
    }

async function sendChatMessage(){
    if(
        !chatInput ||
        !currentStreamId
    ){
        return;
    }

    const text =
        normalizeMessageText(
            chatInput.value
        );

    if(
        !text
    ){
        return;
    }

    /*
     * Clear immediately so the user can
     * type the next message without waiting
     * for the server.
     */
    chatInput.value =
        "";

    const username =
        getCurrentUserName();

    const userId =
        getCurrentUserId();

    const localMessage = {
        id:
            "local-" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .slice(2),

        streamId:
            currentStreamId,

        stream_id:
            currentStreamId,

        userId:
            userId,

        username:
            username,

        text:
            text,

        message:
            text,

        createdAt:
            new Date().toISOString()
    };

    /*
     * Render instantly.
     */
    addChatMessage(
        localMessage,
        {
            local:true,
            username:username,
            scroll:true
        }
    );

    markPendingChat(
        text,
        localMessage.id
    );

    if(
        socket &&
        socketConnected
    ){
        try{
            socket.emit(
                "chat-message",
                {
                    streamId:
                        currentStreamId,

                    stream_id:
                        currentStreamId,

                    userId:
                        userId,

                    username:
                        username,

                    text:
                        text,

                    message:
                        text
                }
            );

            return;
        }catch(error){
            console.warn(
                "Socket chat failed:",
                error
            );
        }
    }

    /*
     * Socket unavailable:
     * save through the normal API.
     * The message is already visible locally,
     * so there is no visible sending delay.
     */
    try{
        const response =
            await fetch(
                API_BASE +
                "/api/streams/" +
                encodeURIComponent(
                    currentStreamId
                ) +
                "/chat",
                {
                    method:"POST",
                    headers:{
                        ...authHeaders(),
                        "Content-Type":
                            "application/json",
                        "Accept":
                            "application/json"
                    },
                    body:
                        JSON.stringify({
                            streamId:
                                currentStreamId,

                            stream_id:
                                currentStreamId,

                            userId:
                                userId,

                            username:
                                username,

                            text:
                                text,

                            message:
                                text
                        })
                }
            );

        if(
            response.ok
        ){
            let data = null;

            try{
                data =
                    await response.json();
            }catch(error){
                data = null;
            }

            const serverMessage =
                data &&
                (
                    data.message ||
                    data.chat ||
                    data.data
                );

            if(
                serverMessage &&
                typeof serverMessage === "object"
            ){
                const serverId =
                    getChatMessageId(
                        serverMessage
                    );

                if(
                    serverId
                ){
                    renderedChatIds.add(
                        serverId
                    );
                }
            }

            /*
             * Never append serverMessage here.
             * It is either already displayed locally
             * or will arrive through Socket.IO.
             */
            return;
        }

        console.warn(
            "Chat API returned:",
            response.status
        );

    }catch(error){
        console.warn(
            "Chat send failed:",
            error
        );
    }
        }
  async function loadFollowState(){

            );

        );

function updateFollowButton(){
    if(
        !followButton
    ){
        return;
    }

    if(
        isFollowing
    ){
        followButton.textContent =
            "Following";

        followButton.classList.add(
            "following"
        );

        followButton.setAttribute(
            "aria-pressed",
            "true"
        );
    }else{

            "Follow";

        followButton.classList.remove(
            "following"
        );

        followButton.setAttribute(
            "aria-pressed",
            "false"
        );
    }

        followBusy ||

}


async function toggleFollow(){
    if(
        followBusy ||
        !currentCreatorId
    ){
        return;
    }

    followBusy =
        true;

    const previousState =
        isFollowing;

    /*
     * Optimistic update:
     * the button changes immediately.
     */
    isFollowing =
        !previousState;

    updateFollowButton();

    try{
        const nextState =
            isFollowing;

        const currentUserId =
            getCurrentUserId();

        const response =
            await fetch(
                API_BASE +
                "/api/follow",
                {
                    method:"POST",
                    headers:{
                        ...authHeaders(),
                        "Content-Type":
                            "application/json",
                        "Accept":
                            "application/json"
                    },
                    body:
                        JSON.stringify({
                            creatorId:
                                currentCreatorId,

                            creator_id:
                                currentCreatorId,

                            userId:
                                currentUserId,

                            user_id:
                                currentUserId,

                            following:
                                nextState,

                            follow:
                                nextState
                        })
                }
            );

        if(
            !response.ok
        ){
            throw new Error(
                "Follow request failed."
            );
        }

        let data = null;

        try{
            data =
                await response.json();
        }catch(error){
            data = null;
        }

        if(
            data &&
            typeof data === "object"
        ){
            const serverState =
                getValue(
                    data,
                    [
                        "following",
                        "isFollowing",
                        "is_following",
                        "followed"
                    ],
                    null
                );

            if(
                serverState !== null
            ){
                isFollowing =
                    serverState === true ||
                    serverState === "true" ||
                    serverState === 1 ||
                    serverState === "1";
            }
        }

    }catch(error){
        console.warn(
            "Follow request failed:",
            error
        );

        /*
         * Restore the previous state if the
         * server rejected the request.
         */
        isFollowing =
            previousState;

    }finally{
        followBusy =
            false;

        updateFollowButton();
    }
}


function showSupportStatus(

    isError = false
){
    if(
        !supportStatus
    ){
        return;
    }

    supportStatus.textContent =
        message || "";

    supportStatus.style.display =
        message
            ? "block"
            : "none";

    if(
        isError
    ){
        supportStatus.setAttribute(
            "data-error",
            "true"
        );
    }else{
        supportStatus.removeAttribute(
            "data-error"
        );
    }
}


function getSelectedSupportAmount(){
    if(
        !moneyOptions
    ){
        return 0;
    }

    const selected =
        moneyOptions.querySelector(
            "button.selected"
        );

    if(
        !selected
    ){
        return 0;
    }

    const amount =
        Number(
            selected.dataset.amount ||
            selected.textContent
                .replace(/[^\d.]/g,"")
        );

    return Number.isFinite(amount)
        ? amount
        : 0;
}


function getSelectedGift(){
    if(
        !giftOptions
    ){
        return "";
    }

    const selected =
        giftOptions.querySelector(
            "button.selected"
        );

    if(
        !selected
    ){
        return "";
    }

    return (
        selected.dataset.gift ||
        selected.dataset.name ||
        selected.textContent.trim()
    );
}


function clearSupportSelections(){
    const selected =
        document.querySelectorAll(
            "#moneyOptions button.selected, #giftOptions button.selected"

    selected.forEach(
        function(button){
            button.classList.remove(
                "selected"
            );

    );
}


async function sendSupport(){
    if(
        !currentStreamId ||
        !currentCreatorId
    ){
        showSupportStatus(
            "Creator information is unavailable.",
            true
        );

        return;
    }

    const amount =
        getSelectedSupportAmount();

    const gift =
        getSelectedGift();

    if(
        !amount &&
        !gift
    ){
        showSupportStatus(
            "Choose a support amount or gift first.",
            true
        );

        return;
    }

    const type =
        gift
            ? "gift"
            : "money";

    const payload = {
        streamId:
            currentStreamId,

        stream_id:
            currentStreamId,

        creatorId:
            currentCreatorId,

        creator_id:
            currentCreatorId,

        type:
            type,

        amount:
            amount || 0,

        gift:
            gift || ""
    };

    if(
        supportButton
    ){
        supportButton.disabled =
            true;
    }

    showSupportStatus(
        "Sending..."
    );

    try{
        const response =
            await fetch(
                API_BASE +
                "/api/support",
                {
                    method:"POST",
                    headers:{
                        ...authHeaders(),
                        "Content-Type":
                            "application/json",
                        "Accept":
                            "application/json"
                    },
                    body:
                        JSON.stringify(
                            payload
                        )
                }
            );

        if(
            !response.ok
        ){
            throw new Error(
                "Support request failed."
            );
        }

        showSupportStatus(
            gift
                ? "Gift sent successfully."
                : "Support sent successfully."
        );

        clearSupportSelections();

    }catch(error){
        console.warn(
            "Support request failed:",
            error
        );

        showSupportStatus(
            "Unable to send support right now.",
            true
        );

    }finally{
        if(
            supportButton
        ){
            supportButton.disabled =
                false;
        }
    }
}

  function connectSocket(){
    if(
        !currentStreamId
    ){
        return;
    }

    if(
        typeof io !== "function"
    ){
        console.warn(
            "Socket.IO is not available."
        );
        return;
    }

    try{
        socket =
            io(
                API_BASE,
                {
                    transports:[
                        "websocket",
                        "polling"
                    ],
                    reconnection:true,
                    reconnectionAttempts:Infinity,
                    reconnectionDelay:1000,
                    timeout:10000
                }
            );

        socket.on(
            "connect",
            function(){
                socketConnected =
                    true;

                console.log(
                    "Canvas Watch socket connected."
                );

                socket.emit(
                    "join-stream",
                    {
                        streamId:
                            currentStreamId,

                        stream_id:
                            currentStreamId
                    }
                );
            }
        );


        socket.on(
            "viewer-count",
            function(payload){
                if(
                    !isSameStreamPayload(
                        payload
                    )
                ){
                    return;
                }

                const count =
                    extractViewerCount(
                        payload
                    );

                if(
                    count !== null
                ){
                    updateWatchingCount(
                        count
                    );
                }
            }
        );


        socket.on(
            "chat-message",
            function(payload){
                handleIncomingChat(
                    payload
                );
            }
        );


        socket.on(
            "stream-updated",
            function(payload){
                if(
                    !isSameStreamPayload(
                        payload
                    )
                ){
                    return;
                }

                const updatedStream =
                    payload &&
                    (
                        payload.stream ||
                        payload.data ||
                        payload
                    );

                if(
                    updatedStream &&
                    typeof updatedStream === "object"
                ){
                    currentStream =
                        {
                            ...currentStream,
                            ...updatedStream
                        };

                    renderStream(
                        currentStream
                    );

                    setupVideo(
                        currentStream
                    );
                }

                const count =
                    extractViewerCount(
                        payload
                    );

                if(
                    count !== null
                ){
                    updateWatchingCount(
                        count
                    );
                }
            }
        );


        socket.on(
            "stream-ended",
            function(payload){
                if(
                    !isSameStreamPayload(
                        payload
                    )
                ){
                    return;
                }

                showStreamEnded();
            }
        );


        socket.on(
            "disconnect",
            function(){
                socketConnected =
                    false;

                console.log(
                    "Canvas Watch socket disconnected."
                );
            }
        );


        socket.on(
            "connect_error",
            function(error){
                socketConnected =
                    false;

                console.warn(
                    "Canvas Watch socket error:",
                    error
                );
            }
        );

    }catch(error){
        socketConnected =
            false;

        console.warn(
            "Unable to connect to Watch socket:",
            error
        );
    }
}


function findLocalProfilePhoto(){
    const keys = [
        "canvasCurrentUser",
        "canvasUser",
        "canvasUserProfile"
    ];

    for(
        const key of keys
    ){
        try{
            const raw =
                localStorage.getItem(
                    key
                );

            if(
                !raw
            ){
                continue;
            }

            let value =
                raw;

            try{
                value =
                    JSON.parse(
                        raw
                    );
            }catch(error){
                /* Plain strings are allowed. */
            }

            if(
                value &&
                typeof value === "object"
            ){
                const photo =
                    getValue(
                        value,
                        [
                            "profilePhoto",
                            "profile_photo",
                            "profilePicture",
                            "profile_picture",
                            "avatar",
                            "avatarUrl",
                            "avatar_url",
                            "photo",
                            "photoUrl",
                            "photo_url",
                            "image",
                            "imageUrl",
                            "image_url"
                        ],
                        ""
                    );

                if(
                    String(photo).trim()
                ){
                    return String(
                        photo
                    ).trim();
                }
            }
        }catch(error){
            console.warn(
                "Unable to read profile photo:",
                error
            );
        }
    }

    return "";
}


function updateBottomProfileIcon(){
    const bottomProfile =
        document.getElementById(
            "bottomProfileIcon"
        );

    if(
        !bottomProfile
    ){
        return;
    }

    const photo =
        findLocalProfilePhoto();

    if(
        photo
    ){
        bottomProfile.innerHTML =
            "";

        const image =
            document.createElement(
                "img"
            );

        image.src =
            photo;

        image.alt =
            "Profile";

        image.loading =
            "lazy";

        image.onerror =
            function(){
                bottomProfile.innerHTML =
                    "⬤" +
                    "<span>Profile</span>";
            };

        bottomProfile.appendChild(
            image
        );

        const label =
            document.createElement(
                "span"
            );

        label.textContent =
            "Profile";

        bottomProfile.appendChild(
            label
        );

    }else{
        bottomProfile.innerHTML =
            "⬤" +
            "<span>Profile</span>";
    }
}

function setupVideoEvents(){
    if(
        !liveVideo
    ){
        return;
    }

    liveVideo.addEventListener(
        "loadeddata",
        function(){
            if(
                videoPlaceholder
            ){
                videoPlaceholder.style.display =
                    "none";
            }

            liveVideo.style.display =
                "block";
        }
    );

    liveVideo.addEventListener(
        "playing",
        function(){
            if(
                videoPlaceholder
            ){
                videoPlaceholder.style.display =
                    "none";
            }
        }
    );

    liveVideo.addEventListener(
        "ended",
        function(){
            showStreamEnded();
        }
    );

    liveVideo.addEventListener(
        "error",
        function(){
            if(
                !currentStream
            ){
                return;
            }

            const url =
                getValue(
                    currentStream,
                    [
                        "video_url",
                        "videoUrl",
                        "stream_url",
                        "streamUrl",
                        "playback_url",
                        "playbackUrl",
                        "hls_url",
                        "hlsUrl",
                        "url"
                    ],
                    ""
                );

            if(
                !url
            ){
                return;
            }

            if(
                videoPlaceholder
            ){
                videoPlaceholder.style.display =
                    "flex";

                videoPlaceholder.textContent =
                    "Live video is unavailable.";
            }
        }
    );
  }
  function bindWatchEvents(){
    if(
        followButton
    ){
        followButton.addEventListener(
            "click",
            function(){
                toggleFollow();
            }
        );
    }


    if(
        chatSendButton
    ){
        chatSendButton.addEventListener(
            "click",
            function(){
                sendChatMessage();
            }
        );
    }


    if(
        chatInput
    ){
        chatInput.addEventListener(
            "keydown",
            function(event){
                if(
                    event.key === "Enter" &&
                    !event.shiftKey
                ){
                    event.preventDefault();

                    sendChatMessage();
                }
            }
        );
    }


    if(
        supportButton
    ){
        supportButton.addEventListener(
            "click",
            function(){
                toggleGiftPanel();
            }
        );
    }


    /*
     * The creator row is a real link.
     * It always uses the creator's ID/username
     * prepared by updateCreatorProfileLink().
     *
     * It never redirects to the viewer's own
     * profile automatically.
     */
    if(
        creatorProfileLink
    ){
        creatorProfileLink.addEventListener(
            "click",
            function(event){
                const href =
                    creatorProfileLink.getAttribute(
                        "href"
                    );

                if(
                    !href ||
                    href === "#"
                ){
                    event.preventDefault();

                    return;
                }
            }
        );
    }

    bindSupportOptions();

    setupVideoEvents();
}


async function initializeWatchPage(){
    if(
        window.__canvasWatchInitialized
    ){
        return;
    }

    window.__canvasWatchInitialized =
        true;

    leavingStream =
        false;

    updateBottomProfileIcon();

    bindWatchEvents();

    currentStreamId =
        getStreamId();

    if(
        !currentStreamId
    ){
        showStreamError(
            "Stream information is unavailable."
        );

        if(
            followButton
        ){
            followButton.disabled =
                true;
        }

        return;
    }

    /*
     * Load the stream first so the creator,
     * creator profile and viewer count are known
     * before Follow/Socket logic starts.
     */
    const stream =
        await loadStream();

    if(
        !stream
    ){
        return;
    }

    /*
     * Existing chat is loaded once.
     * Socket messages arriving afterward are
     * handled separately.
     */
    await loadExistingChat();

    connectSocket();

    startStreamRefresh();
}


function leaveCurrentStream(){
    if(
        leavingStream
    ){
        return;
    }

    leavingStream =
        true;

    stopStreamRefresh();

    if(
        socket &&
        socketConnected &&
        currentStreamId
    ){
        try{
            socket.emit(
                "leave-stream",
                {
                    streamId:
                        currentStreamId,

                    stream_id:
                        currentStreamId
                }
            );
        }catch(error){
            console.warn(
                "Unable to leave stream:",
                error
            );
        }
    }

    if(
        socket
    ){
        try{
            socket.disconnect();
        }catch(error){
            console.warn(
                "Unable to disconnect socket:",
                error
            );
        }

        socket =
            null;
    }

    socketConnected =
        false;
}


document.addEventListener(
    "visibilitychange",
    function(){
        if(
            document.visibilityState ===
            "visible"
        ){
            if(
                !leavingStream &&
                currentStreamId &&
                !socketConnected
            ){
                connectSocket();
            }

            return;
        }

        /*
         * Do not leave the stream just because the
         * browser temporarily hides the page.
         * Mobile browsers commonly trigger this when
         * switching apps.
         */
    }
);


window.addEventListener(
    "pagehide",
    function(){
        leaveCurrentStream();
    }
);


window.addEventListener(
    "beforeunload",
    function(){
        leaveCurrentStream();
    }
);


window.addEventListener(
    "storage",
    function(event){
        if(
            event.key ===
                "canvasCurrentUser" ||
            event.key ===
                "canvasUser" ||
            event.key ===
                "canvasUserProfile"
        ){
            updateBottomProfileIcon();
        }
    }
);


if(
    document.readyState ===
    "loading"
){
    document.addEventListener(
        "DOMContentLoaded",
        initializeWatchPage,
        {
            once:true
        }
    );
}else{
    initializeWatchPage();
}
