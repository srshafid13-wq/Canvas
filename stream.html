<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Canvas - Home</title>

<link
    rel="stylesheet"
    href="style.css"
>

<style>

/* =========================================
   CANVAS HOME / STREAM
   UPGRADED NAVIGATION
========================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#ffffff;
    color:#4b3326;
    font-family:Arial,Helvetica,sans-serif;
    padding-bottom:82px;
}


/* =========================================
   TOP NAVIGATION
========================================= */

.navbar{
    width:100%;
    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 20px;

    background:#ffffff;

    border-bottom:2px solid #d4a62a;

    position:sticky;
    top:0;

    z-index:1500;
}

.logo{
    font-size:32px;
    font-weight:800;
    color:#4b3326;
}

.top-icons{
    display:flex;
    align-items:center;
    gap:10px;
}


/* =========================================
   PROFILE
   KEEPING EXISTING SIZE
========================================= */

#topProfileIcon{
    width:40px;
    height:40px;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    border-radius:50%;
    border:2px solid #d4a62a;

    background:#f3f3f3;

    color:#4b3326;

    font-size:20px;

    text-decoration:none;
}

#topProfileIcon img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}


/* =========================================
   SEARCH / EXPLORE BUTTON
========================================= */

.search-button{
    width:40px;
    height:40px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid rgba(75,51,38,.18);
    border-radius:13px;

    background:#ffffff;
    color:#4b3326;

    cursor:pointer;

    box-shadow:
        0 3px 10px rgba(75,51,38,.07);

    transition:.2s ease;
}

.search-button:active{
    transform:scale(.94);
}


/* =========================================
   MAIN
========================================= */

.container{
    width:100%;
    max-width:820px;

    margin:0 auto;

    padding:24px 18px 30px;
}


/* =========================================
   HOME HEADER
========================================= */

.page-title{
    text-align:center;
    margin-bottom:22px;
}

.page-title h1{
    margin:0 0 6px;

    font-size:34px;
    line-height:1.15;

    font-weight:800;

    color:#4b3326;
}

.page-title p{
    margin:0;

    color:#6a574c;

    font-size:15px;
    line-height:1.5;
}


/* =========================================
   LIVE STREAM SECTION
========================================= */

.live-section{
    width:100%;
}

.live-section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:14px;
}

.live-section-title h2{
    font-size:21px;
    font-weight:800;
    color:#4b3326;
}

.live-indicator{
    font-size:12px;
    font-weight:800;
    color:#a33a2b;
}


/* =========================================
   STREAM LIST
========================================= */

.stream-list{
    width:100%;

    display:flex;
    flex-direction:column;

    gap:15px;
}


/* =========================================
   LIVE STREAM CARD
========================================= */

.stream-card{
    width:100%;

    background:#ffffff;

    border:1px solid #eadfd8;
    border-radius:18px;

    overflow:hidden;

    box-shadow:
        0 5px 20px rgba(75,51,38,.07);

    cursor:pointer;

    transition:.2s ease;
}

.stream-card:active{
    transform:scale(.99);
}

.stream-thumbnail{
    width:100%;

    aspect-ratio:16 / 9;

    background:#251b17;

    overflow:hidden;
}

.stream-thumbnail img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;
}

.stream-thumbnail-placeholder{
    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#ffffff;

    font-size:16px;
    font-weight:700;
}

.stream-info{
    padding:14px;
}

.stream-title{
    margin-bottom:6px;

    color:#4b3326;

    font-size:17px;
    font-weight:800;

    line-height:1.3;
}

.stream-creator{
    color:#6a574c;

    font-size:13px;
    font-weight:600;
}

.stream-category{
    margin-top:6px;

    color:#d4a62a;

    font-size:12px;
    font-weight:800;
}

.no-streams{
    width:100%;

    padding:35px 20px;

    text-align:center;

    color:#6a574c;

    border:1px dashed #d8c7bb;
    border-radius:18px;
}


/* =========================================
   BOTTOM NAVIGATION
========================================= */

.bottom-nav{
    position:fixed;

    left:0;
    bottom:0;

    width:100%;
    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-around;

    padding:5px 7px;

    background:#ffffff;

    border-top:2px solid #d4a62a;

    box-shadow:
        0 -5px 20px rgba(75,51,38,.08);

    z-index:1500;
}

.bottom-nav a{
    flex:1;
    min-width:0;

    height:58px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:2px;

    border-radius:12px;

    color:#4b3326;

    text-decoration:none;

    font-size:23px;
}

.bottom-nav a span{
    font-size:10px;
    font-weight:700;
}

.bottom-nav a.active{
    color:#d4a62a;
}


/* =========================================
   PROFILE ICON
   SAME SIZE — DO NOT CHANGE
========================================= */

#bottomProfileIcon img{
    width:25px;
    height:25px;

    object-fit:cover;

    display:block;

    border-radius:50%;

    border:1.5px solid #d4a62a;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    .navbar{
        height:66px;
        padding:0 15px;
    }

    .logo{
        font-size:29px;
    }

    .container{
        padding:20px 14px 25px;
    }

    .page-title{
        margin-bottom:18px;
    }

    .page-title h1{
        font-size:30px;
    }

}


/* =========================================
   VERY SMALL DEVICES
========================================= */

@media(max-width:360px){

    .logo{
        font-size:26px;
    }

    .search-button,
    #topProfileIcon{
        width:37px;
        height:37px;
    }

}

</style>

</head>

<body>


<!-- =========================================
     TOP NAVIGATION
========================================= -->

<header class="navbar">

    <div class="logo">
        Canvas
    </div>

    <div class="top-icons">

        <!-- Existing search icon -->
        <button
            type="button"
            class="search-button"
            id="searchButton"
            aria-label="Explore"
        >

            <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
            >

                <circle
                    cx="11"
                    cy="11"
                    r="7"
                    stroke="currentColor"
                    stroke-width="2.8"
                />

                <path
                    d="M16.5 16.5L21 21"
                    stroke="currentColor"
                    stroke-width="2.8"
                    stroke-linecap="round"
                />

            </svg>

        </button>


        <!-- Profile stays exactly the same -->
        <a
            href="profile.html"
            id="topProfileIcon"
        >
            ⬤
        </a>

    </div>

</header>


<!-- =========================================
     MAIN CONTENT
========================================= -->

<main class="container">

    <section class="page-title">

        <h1>
            Canvas
        </h1>

        <p>
            Live streams happening now
        </p>

    </section>


    <!-- =====================================
         LIVE STREAMS
    ====================================== -->

    <section class="live-section">

        <div class="live-section-title">

            <h2>
                Live Now
            </h2>

            <span class="live-indicator">
                🔴 LIVE
            </span>

        </div>


        <div
            id="streamList"
            class="stream-list"
        >

            <div
                id="noStreams"
                class="no-streams"
            >
                Loading live streams...
            </div>

        </div>

    </section>

</main>


<!-- =========================================
     BOTTOM NAVIGATION
========================================= -->

<nav class="bottom-nav">

    <a
        href="stream.html"
        class="active"
    >

        ⌂

        <span>
            Home
        </span>

    </a>


    <!-- Stream replaced by Explore -->
    <a href="explore.html">

        <svg
            width="23"
            height="23"
            viewBox="0 0 24 24"
            fill="none"
        >

            <circle
                cx="11"
                cy="11"
                r="7"
                stroke="currentColor"
                stroke-width="2.8"
            />

            <path
                d="M16.5 16.5L21 21"
                stroke="currentColor"
                stroke-width="2.8"
                stroke-linecap="round"
            />

        </svg>

        <span>
            Explore
        </span>

    </a>


    <a href="golive.html">

        ⊙

        <span>
            Go Live
        </span>

    </a>


    <a
        href="profile.html"
        id="bottomProfileIcon"
    >

        ⬤

        <span>
            Profile
        </span>

    </a>

</nav>


<script>

/* =========================================
   PART 1 ENDS HERE
========================================= */
  /* =========================================
   PROFILE
========================================= */

let savedProfile = {};


/* =========================================
   LOAD SAVED PROFILE
========================================= */

function loadSavedProfile(){

    try{

        const data =
            localStorage.getItem(
                "canvasProfile"
            );

        savedProfile =
            data
                ? JSON.parse(data) || {}
                : {};

    }catch(error){

        console.error(
            "Canvas profile load failed:",
            error
        );

        savedProfile = {};

    }

}


/* =========================================
   PROFILE PHOTO
========================================= */

function getProfilePhoto(){

    return (
        savedProfile.photo ||
        savedProfile.profileImage ||
        savedProfile.profilePhoto ||
        savedProfile.image ||
        savedProfile.profile_picture ||
        ""
    );

}


/* =========================================
   HTML ESCAPE
========================================= */

function escapeHtml(value){

    const div =
        document.createElement("div");

    div.textContent =
        String(value || "");

    return div.innerHTML;

}


/* =========================================
   UPDATE PROFILE ICONS
========================================= */

function updateProfileIcons(){

    const photo =
        getProfilePhoto();


    const top =
        document.getElementById(
            "topProfileIcon"
        );


    if(top){

        top.innerHTML =
            photo
                ? '<img src="' +
                  escapeHtml(photo) +
                  '" alt="Profile">'
                : "⬤";

    }


    const bottom =
        document.getElementById(
            "bottomProfileIcon"
        );


    if(bottom){

        bottom.innerHTML =
            photo
                ? '<img src="' +
                  escapeHtml(photo) +
                  '" alt="Profile">' +
                  '<span>Profile</span>'
                : '⬤<span>Profile</span>';

    }

}


/* =========================================
   BACKEND
========================================= */

const CANVAS_API =
    "https://canvas-kh9p.onrender.com";


/* =========================================
   AUTH TOKEN
========================================= */

function getAuthToken(){

    return localStorage.getItem(
        "canvasAuthToken"
    ) || "";

}


/* =========================================
   STREAM LIST ELEMENTS
========================================= */

const streamList =
    document.getElementById(
        "streamList"
    );


const noStreams =
    document.getElementById(
        "noStreams"
    );


/* =========================================
   CREATE STREAM CARD
========================================= */

function createStreamCard(stream){

    const card =
        document.createElement("article");


    card.className =
        "stream-card";


    const thumbnail =
        stream.thumbnail ||
        stream.thumbnailUrl ||
        stream.image ||
        stream.imageUrl ||
        "";


    const title =
        stream.title ||
        "Untitled stream";


    const creator =
        stream.name ||
        stream.username ||
        stream.creator ||
        "Canvas Creator";


    const category =
        stream.category ||
        "Other";


    let thumbnailHTML;


    if(thumbnail){

        thumbnailHTML =
            '<img src="' +
            escapeHtml(thumbnail) +
            '" alt="Stream thumbnail">';

    }else{

        thumbnailHTML =
            '<div class="stream-thumbnail-placeholder">' +
            '🔴 Canvas Live' +
            '</div>';

    }


    card.innerHTML =

        '<div class="stream-thumbnail">' +
            thumbnailHTML +
        '</div>' +

        '<div class="stream-info">' +

            '<div class="stream-title">' +
                escapeHtml(title) +
            '</div>' +

            '<div class="stream-creator">' +
                '👤 ' +
                escapeHtml(creator) +
            '</div>' +

            '<div class="stream-category">' +
                escapeHtml(category) +
            '</div>' +

        '</div>';


    /* =====================================
       OPEN WATCH PAGE
    ===================================== */

    card.addEventListener(
        "click",
        function(){

            const id =
                stream.id ||
                stream.streamId ||
                "";


            if(!id){

                console.error(
                    "No stream ID found:",
                    stream
                );

                return;

            }


            /*
             * Save selected stream so
             * watch.html can load it.
             */

            try{

                localStorage.setItem(
                    "canvasSelectedStream",
                    JSON.stringify(stream)
                );

                localStorage.setItem(
                    "canvasCurrentStreamId",
                    String(id)
                );

            }catch(error){

                console.error(
                    "Could not save selected stream:",
                    error
                );

            }


            window.location.href =
                "watch.html?id=" +
                encodeURIComponent(id);

        }
    );


    return card;

}


/* =========================================
   DISPLAY STREAMS
========================================= */

function displayStreams(streams){

    if(!streamList){

        return;

    }


    streamList.innerHTML = "";


    if(
        !Array.isArray(streams) ||
        !streams.length
    ){

        const empty =
            document.createElement("div");


        empty.className =
            "no-streams";


        empty.textContent =
            "No one is live right now.";


        streamList.appendChild(
            empty
        );


        return;

    }


    streams.forEach(
        function(stream){

            if(!stream){

                return;

            }


            const card =
                createStreamCard(
                    stream
                );


            streamList.appendChild(
                card
            );

        }
    );

}


/* =========================================
   LOAD LIVE STREAMS
========================================= */

async function loadLiveStreams(){

    if(!streamList){

        return;

    }


    if(noStreams){

        noStreams.textContent =
            "Loading live streams...";

    }


    try{

        const response =
            await fetch(
                CANVAS_API +
                "/api/streams/live",
                {
                    method:"GET",

                    headers:{
                        "Accept":
                            "application/json"
                    }
                }
            );


        let data = {};


        try{

            data =
                await response.json();

        }catch(error){

            data = {};

        }


        if(!response.ok){

            throw new Error(
                data.message ||
                data.error ||
                "Unable to load live streams."
            );

        }


        /*
         * Backend currently returns
         * an object containing streams.
         */

        const streams =
            Array.isArray(
                data.streams
            )
                ? data.streams
                : Array.isArray(data)
                    ? data
                    : [];


        displayStreams(
            streams
        );


        console.log(
            "Canvas live streams:",
            streams
        );


    }catch(error){

        console.error(
            "Canvas live streams error:",
            error
        );


        if(!streamList){

            return;

        }


        streamList.innerHTML = "";


        const errorBox =
            document.createElement("div");


        errorBox.className =
            "no-streams";


        errorBox.innerHTML =
            "<strong>Unable to load live streams.</strong>" +
            "<br>" +
            "Please try again in a moment.";


        streamList.appendChild(
            errorBox
        );

    }

}


/* =========================================
   REFRESH LIVE STREAMS
========================================= */

let liveStreamRefreshTimer =
    null;


function startLiveStreamRefresh(){

    if(liveStreamRefreshTimer){

        clearInterval(
            liveStreamRefreshTimer
        );

    }


    /*
     * Refresh every 10 seconds.
     *
     * This keeps Home updated when
     * creators start or end streams.
     */

    liveStreamRefreshTimer =
        setInterval(
            function(){

                loadLiveStreams();

            },
            10000
        );

}


/* =========================================
   PAGE VISIBILITY
========================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(!document.hidden){

            loadLiveStreams();

        }

    }
);


/* =========================================
   PROFILE STORAGE UPDATE
========================================= */

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key ===
            "canvasProfile"
        ){

            loadSavedProfile();

            updateProfileIcons();

        }

    }
);


/* =========================================
   PART 2 ENDS HERE
========================================= */
  /* =========================================
   EXPLORE NAVIGATION
========================================= */

function openExplore(){

    window.location.href =
        "explore.html";

}


/* =========================================
   TOP SEARCH BUTTON
========================================= */

if(searchButton){

    searchButton.addEventListener(
        "click",
        function(event){

            event.preventDefault();

            openExplore();

        }
    );

}


/* =========================================
   KEYBOARD ACCESS
========================================= */

if(searchButton){

    searchButton.addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter" ||
                event.key === " "
            ){

                event.preventDefault();

                openExplore();

            }

        }
    );

}


/* =========================================
   OPTIONAL CURRENT USER STREAM
========================================= */

function checkLocalLiveStream(){

    try{

        const stored =
            localStorage.getItem(
                "canvasActiveStream"
            );


        if(!stored){

            return null;

        }


        const stream =
            JSON.parse(stored);


        if(
            !stream ||
            !stream.isLive
        ){

            return null;

        }


        return stream;

    }catch(error){

        console.error(
            "Local stream check failed:",
            error
        );

        return null;

    }

}


/* =========================================
   REMOVE ENDED LOCAL STREAM
========================================= */

function cleanupLocalStream(){

    const localStream =
        checkLocalLiveStream();


    if(!localStream){

        return;

    }


    /*
     * Do not display an old local stream
     * as live when its backend record
     * is no longer returned by /live.
     *
     * Backend remains the source of truth.
     */

}


/* =========================================
   INITIAL PAGE LOAD
========================================= */

function initializeHome(){

    loadSavedProfile();

    updateProfileIcons();

    cleanupLocalStream();

    loadLiveStreams();

    startLiveStreamRefresh();

}


/* =========================================
   STOP REFRESH WHEN PAGE CLOSES
========================================= */

window.addEventListener(
    "pagehide",
    function(){

        if(liveStreamRefreshTimer){

            clearInterval(
                liveStreamRefreshTimer
            );

            liveStreamRefreshTimer =
                null;

        }

    }
);


/* =========================================
   DOM READY
========================================= */

if(
    document.readyState ===
    "loading"
){

    document.addEventListener(
        "DOMContentLoaded",
        initializeHome
    );

}else{

    initializeHome();

}


/* =========================================
   BACK / FORWARD RECOVERY
========================================= */

window.addEventListener(
    "pageshow",
    function(){

        loadSavedProfile();

        updateProfileIcons();

        loadLiveStreams();

    }
);


/* =========================================
   CONNECTION RECOVERY
========================================= */

window.addEventListener(
    "online",
    function(){

        loadLiveStreams();

    }
);


/* =========================================
   HOME STREAM NAVIGATION HELPER
========================================= */

function openStream(stream){

    if(!stream){

        return;

    }


    const streamId =
        stream.id ||
        stream.streamId ||
        "";


    if(!streamId){

        return;

    }


    try{

        localStorage.setItem(
            "canvasSelectedStream",
            JSON.stringify(stream)
        );

        localStorage.setItem(
            "canvasCurrentStreamId",
            String(streamId)
        );

    }catch(error){

        console.error(
            "Stream selection save failed:",
            error
        );

    }


    window.location.href =
        "watch.html?id=" +
        encodeURIComponent(
            streamId
        );

}


/* =========================================
   FINAL HOME SAFETY CHECK
========================================= */

function refreshHome(){

    if(
        document.hidden
    ){

        return;

    }


    loadSavedProfile();

    updateProfileIcons();

    loadLiveStreams();

}


/* =========================================
   PART 3 ENDS HERE
========================================= */
 /* =========================================
   FINAL STREAM CARD SAFETY
========================================= */

if(streamList){

    streamList.addEventListener(
        "click",
        function(event){

            const card =
                event.target.closest(
                    ".stream-card"
                );


            if(!card){

                return;

            }

        }
    );

}


/* =========================================
   PERIODIC HOME REFRESH
========================================= */

let homeRefreshTimer =
    null;


function startHomeRefresh(){

    if(homeRefreshTimer){

        clearInterval(
            homeRefreshTimer
        );

    }


    homeRefreshTimer =
        setInterval(
            function(){

                if(
                    !document.hidden
                ){

                    loadLiveStreams();

                }

            },
            15000
        );

}


/* =========================================
   START HOME REFRESH
========================================= */

startHomeRefresh();


/* =========================================
   CLEANUP
========================================= */

window.addEventListener(
    "beforeunload",
    function(){

        if(liveStreamRefreshTimer){

            clearInterval(
                liveStreamRefreshTimer
            );

            liveStreamRefreshTimer =
                null;

        }


        if(homeRefreshTimer){

            clearInterval(
                homeRefreshTimer
            );

            homeRefreshTimer =
                null;

        }

    }
);


/* =========================================
   CANVAS HOME READY
========================================= */

console.log(
    "Canvas Home initialized successfully."
);

</script>

</body>

</html>
