<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Canvas - Home</title>

<link
    rel="stylesheet"
    href="style.css"
>

<style>

/* =========================================
   CANVAS HOME
========================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#ffffff;
    color:#4b3326;
    font-family:Arial,Helvetica,sans-serif;
    padding-bottom:82px;
}


/* =========================================
   TOP NAVIGATION
========================================= */

.navbar{
    width:100%;
    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 20px;

    background:#ffffff;

    border-bottom:2px solid #d4a62a;

    position:sticky;
    top:0;

    z-index:1500;
}

.logo{
    font-size:32px;
    font-weight:800;
    color:#4b3326;
}


/* =========================================
   PROFILE
========================================= */

#topProfileIcon{
    width:40px;
    height:40px;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    border-radius:50%;
    border:2px solid #d4a62a;

    background:#f3f3f3;

    color:#4b3326;

    font-size:20px;

    text-decoration:none;
}

#topProfileIcon img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}


/* =========================================
   MAIN
========================================= */

.container{
    width:100%;
    max-width:820px;

    margin:0 auto;

    padding:24px 18px 30px;
}


/* =========================================
   LIVE STREAM SECTION
========================================= */

.live-section{
    width:100%;
}

.live-section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:14px;
}

.live-section-title h2{
    font-size:21px;
    font-weight:800;
    color:#4b3326;
}

.live-indicator{
    font-size:12px;
    font-weight:800;
    color:#a33a2b;
}


/* =========================================
   STREAM LIST
========================================= */

.stream-list{
    width:100%;

    display:flex;
    flex-direction:column;

    gap:15px;
}


/* =========================================
   LIVE STREAM CARD
========================================= */

.stream-card{
    width:100%;

    background:#ffffff;

    border:1px solid #eadfd8;

    border-radius:18px;

    overflow:hidden;

    box-shadow:
        0 5px 20px
        rgba(75,51,38,.07);

    cursor:pointer;

    transition:.2s ease;
}

.stream-card:active{
    transform:scale(.99);
}


/* =========================================
   THUMBNAIL
========================================= */

.stream-thumbnail{
    width:100%;

    aspect-ratio:16 / 9;

    background:#251b17;

    overflow:hidden;

    position:relative;
}

.stream-thumbnail img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;
}

.stream-thumbnail-placeholder{
    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#f3e8d3;

    color:#4b3326;

    font-size:16px;
    font-weight:700;
}


/* =========================================
   LIVE BADGE
========================================= */

.stream-live-badge{
    position:absolute;

    top:10px;
    left:10px;

    padding:5px 8px;

    border-radius:7px;

    background:#a33a2b;

    color:#ffffff;

    font-size:11px;

    font-weight:800;
}


/* =========================================
   STREAM INFO
========================================= */

.stream-info{
    padding:14px;
}

.stream-title{
    margin-bottom:9px;

    color:#4b3326;

    font-size:17px;

    font-weight:800;

    line-height:1.3;
}


/* =========================================
   CREATOR ROW
========================================= */

.stream-creator-row{
    width:100%;

    display:flex;
    align-items:center;

    gap:10px;

    margin-bottom:8px;
}


/* =========================================
   CREATOR PROFILE PICTURE
========================================= */

.creator-avatar{
    width:38px;
    height:38px;

    min-width:38px;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    border-radius:50%;

    border:1.5px solid #d4a62a;

    background:#f3f3f3;

    color:#4b3326;

    font-size:17px;
}

.creator-avatar img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    border-radius:50%;
}


/* =========================================
   CREATOR DETAILS
========================================= */

.creator-details{
    min-width:0;

    display:flex;
    flex-direction:column;

    gap:2px;
}

.stream-creator{
    color:#4b3326;

    font-size:13px;

    font-weight:800;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.stream-category{
    color:#d4a62a;

    font-size:11px;

    font-weight:800;
}


/* =========================================
   NO STREAMS
========================================= */

.no-streams{
    width:100%;

    padding:35px 20px;

    text-align:center;

    color:#6a574c;

    border:1px dashed #d8c7bb;

    border-radius:18px;

    font-size:14px;

    line-height:1.5;
}


/* =========================================
   BOTTOM NAVIGATION
========================================= */

.bottom-nav{
    position:fixed;

    left:0;
    bottom:0;

    width:100%;
    height:70px;

    display:flex;

    align-items:center;
    justify-content:space-around;

    padding:5px 7px;

    background:#ffffff;

    border-top:2px solid #d4a62a;

    box-shadow:
        0 -5px 20px
        rgba(75,51,38,.08);

    z-index:1500;
}

.bottom-nav a{
    flex:1;

    min-width:0;

    height:58px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:2px;

    border-radius:12px;

    color:#4b3326;

    text-decoration:none;

    font-size:23px;
}

.bottom-nav a span{
    font-size:10px;

    font-weight:700;
}

.bottom-nav a.active{
    color:#4b3326;
}


/* =========================================
   EXPLORE ICON
   SAME CLEAN ICON — NO MUSTARD SPOT
========================================= */

.bottom-nav .explore-icon{
    width:23px;
    height:23px;

    display:block;
}


/* =========================================
   PROFILE BOTTOM ICON
========================================= */

#bottomProfileIcon{
    position:relative;
}

#bottomProfileIcon img{
    width:25px;
    height:25px;

    object-fit:cover;

    display:block;

    border-radius:50%;

    border:1.5px solid #d4a62a;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    .navbar{
        height:66px;

        padding:0 15px;
    }

    .logo{
        font-size:29px;
    }

    .container{
        padding:
            20px 14px 25px;
    }

    .stream-list{
        gap:14px;
    }

    .stream-card{
        border-radius:17px;
    }

}


/* =========================================
   VERY SMALL DEVICES
========================================= */

@media(max-width:360px){

    .logo{
        font-size:26px;
    }

    .container{
        padding-left:12px;
        padding-right:12px;
    }

    .creator-avatar{
        width:36px;
        height:36px;

        min-width:36px;
    }

}

</style>

</head>

<body>


<!-- =========================================
     TOP NAVIGATION
========================================= -->

<header class="navbar">

    <div class="logo">
        Canvas
    </div>


    <!--
        Top search button removed.

        Profile remains on the right.
    -->

    <a
        href="profile.html"
        id="topProfileIcon"
        aria-label="Profile"
    >
        ⬤
    </a>

</header>


<!-- =========================================
     MAIN CONTENT
     
     The old large "Canvas" page heading
     has been removed.
========================================= -->

<main class="container">


    <!-- =====================================
         LIVE STREAMS
    ====================================== -->

    <section class="live-section">

        <div class="live-section-title">

            <h2>
                Live Now
            </h2>

            <span class="live-indicator">
                🔴 LIVE
            </span>

        </div>


        <div
            id="streamList"
            class="stream-list"
        >

            <div
                id="noStreams"
                class="no-streams"
            >
                Loading live streams...
            </div>

        </div>

    </section>

</main>


<!-- =========================================
     BOTTOM NAVIGATION
========================================= -->

<nav class="bottom-nav">


    <!-- HOME -->

    <a
        href="stream.html"
        class="active"
        aria-label="Home"
    >

        ⌂

        <span>
            Home
        </span>

    </a>


    <!-- EXPLORE -->

    <a
        href="explore.html"
        aria-label="Explore"
    >

        <svg
            class="explore-icon"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
        >

            <circle
                cx="11"
                cy="11"
                r="7"
                stroke="currentColor"
                stroke-width="2.8"
            />

            <path
                d="M16.5 16.5L21 21"
                stroke="currentColor"
                stroke-width="2.8"
                stroke-linecap="round"
            />

        </svg>

        <span>
            Explore
        </span>

    </a>


    <!-- GO LIVE -->

    <a
        href="golive.html"
        aria-label="Go Live"
    >

        ⊙

        <span>
            Go Live
        </span>

    </a>


    <!-- PROFILE -->

    <a
        href="profile.html"
        id="bottomProfileIcon"
        aria-label="Profile"
    >

        ⬤

        <span>
            Profile
        </span>

    </a>

</nav>


<script>

/* =========================================
   CANVAS HOME - PART 1
========================================= */


/* =========================================
   BACKEND
========================================= */

const CANVAS_API =
    "https://canvas-kh9p.onrender.com";


/* =========================================
   PROFILE STATE
========================================= */

let savedProfile = {};


/* =========================================
   LOAD SAVED PROFILE
========================================= */

function loadSavedProfile(){

    try{

        const data =
            localStorage.getItem(
                "canvasProfile"
            );

        savedProfile =
            data
                ? JSON.parse(data) || {}
                : {};

    }catch(error){

        console.error(
            "Canvas profile load failed:",
            error
        );

        savedProfile = {};

    }

}


/* =========================================
   GET PROFILE PHOTO
========================================= */

function getProfilePhoto(){

    return (
        savedProfile.photo ||
        savedProfile.profileImage ||
        savedProfile.profilePhoto ||
        savedProfile.image ||
        savedProfile.profile_picture ||
        ""
    );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        String(value || "");

    return div.innerHTML;

}


/* =========================================
   UPDATE CURRENT USER PROFILE ICONS
========================================= */

function updateProfileIcons(){

    const photo =
        getProfilePhoto();


    const top =
        document.getElementById(
            "topProfileIcon"
        );


    if(top){

        top.innerHTML =
            photo
                ? '<img src="' +
                  escapeHtml(photo) +
                  '" alt="Profile">'
                : "⬤";

    }


    const bottom =
        document.getElementById(
            "bottomProfileIcon"
        );


    if(bottom){

        bottom.innerHTML =
            photo
                ? '<img src="' +
                  escapeHtml(photo) +
                  '" alt="Profile">' +
                  '<span>Profile</span>'
                : '⬤<span>Profile</span>';

    }

}


/* =========================================
   STREAM LIST ELEMENTS
========================================= */

const streamList =
    document.getElementById(
        "streamList"
    );


const noStreams =
    document.getElementById(
        "noStreams"
    );


/* =========================================
   PROFILE PHOTO FROM STREAM DATA
========================================= */

function getStreamProfilePhoto(
    stream
){

    if(!stream){

        return "";

    }


    return (
        stream.profileImage ||
        stream.profilePhoto ||
        stream.profile_picture ||
        stream.profile ||
        stream.avatar ||
        stream.userPhoto ||
        stream.userAvatar ||
        stream.creatorPhoto ||
        stream.creatorImage ||
        ""
    );

}


/* =========================================
   CREATOR NAME
========================================= */

function getStreamCreator(
    stream
){

    if(!stream){

        return "Canvas Creator";

    }


    return (
        stream.name ||
        stream.username ||
        stream.creator ||
        stream.creatorName ||
        "Canvas Creator"
    );

}


/* =========================================
   STREAM THUMBNAIL
========================================= */

function getStreamThumbnail(
    stream
){

    if(!stream){

        return "";

    }


    return (
        stream.thumbnail ||
        stream.thumbnailUrl ||
        stream.image ||
        stream.imageUrl ||
        ""
    );

}


/* =========================================
   STREAM ID
========================================= */

function getStreamId(
    stream
){

    if(!stream){

        return "";

    }


    return (
        stream.id ||
        stream.streamId ||
        ""
    );

}


/* =========================================
   STREAM TITLE
========================================= */

function getStreamTitle(
    stream
){

    if(!stream){

        return "Untitled stream";

    }


    return (
        stream.title ||
        "Untitled stream"
    );

}


/* =========================================
   STREAM CATEGORY
========================================= */

function getStreamCategory(
    stream
){

    if(!stream){

        return "Other";

    }


    return (
        stream.category ||
        "Other"
    );

}


/* =========================================
   CREATE PROFILE AVATAR
========================================= */

function createCreatorAvatar(
    photo
){

    if(photo){

        return (
            '<img src="' +
            escapeHtml(photo) +
            '" alt="Profile" ' +
            'onerror="this.style.display=\'none\'">'
        );

    }


    /*
     * Only use the placeholder when the
     * backend genuinely has no profile photo.
     */

    return "⬤";

}


/* =========================================
   PART 1 ENDS HERE
========================================= */
  <script>

/* =========================================
   CREATE STREAM CARD
========================================= */

function createStreamCard(stream){

    if(!stream){

        return null;

    }


    const card =
        document.createElement("article");


    card.className =
        "stream-card";


    const thumbnail =
        getStreamThumbnail(
            stream
        );


    const title =
        getStreamTitle(
            stream
        );


    const creator =
        getStreamCreator(
            stream
        );


    const category =
        getStreamCategory(
            stream
        );


    const profilePhoto =
        getStreamProfilePhoto(
            stream
        );


    let thumbnailHTML;


    if(thumbnail){

        thumbnailHTML =
            '<img src="' +
            escapeHtml(thumbnail) +
            '" ' +
            'alt="Stream thumbnail" ' +
            'onerror="this.style.display=\'none\'">';

    }else{

        thumbnailHTML =
            '<div class="stream-thumbnail-placeholder">' +
                '🔴 Canvas Live' +
            '</div>';

    }


    const avatarHTML =
        createCreatorAvatar(
            profilePhoto
        );


    card.innerHTML =

        '<div class="stream-thumbnail">' +

            thumbnailHTML +

            '<div class="stream-live-badge">' +
                '🔴 LIVE' +
            '</div>' +

        '</div>' +


        '<div class="stream-info">' +

            '<div class="stream-title">' +
                escapeHtml(title) +
            '</div>' +


            '<div class="stream-creator-row">' +

                '<div class="creator-avatar">' +
                    avatarHTML +
                '</div>' +


                '<div class="creator-details">' +

                    '<div class="stream-creator">' +
                        escapeHtml(creator) +
                    '</div>' +

                    '<div class="stream-category">' +
                        escapeHtml(category) +
                    '</div>' +

                '</div>' +

            '</div>' +

        '</div>';


    /* =====================================
       PROFILE IMAGE ERROR HANDLING
    ====================================== */

    const avatarImage =
        card.querySelector(
            ".creator-avatar img"
        );


    if(avatarImage){

        avatarImage.addEventListener(
            "error",
            function(){

                /*
                 * If a bad/expired image URL is
                 * returned, use the normal
                 * placeholder instead.
                 */

                this.remove();

                const avatar =
                    card.querySelector(
                        ".creator-avatar"
                    );

                if(avatar){

                    avatar.textContent =
                        "⬤";

                }

            }
        );

    }


    /* =====================================
       OPEN WATCH PAGE
    ====================================== */

    card.addEventListener(
        "click",
        function(){

            openStream(
                stream
            );

        }
    );


    return card;

}


/* =========================================
   DISPLAY STREAMS
========================================= */

function displayStreams(
    streams
){

    if(!streamList){

        return;

    }


    streamList.innerHTML =
        "";


    if(
        !Array.isArray(streams) ||
        !streams.length
    ){

        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "no-streams";


        empty.textContent =
            "No one is live right now.";


        streamList.appendChild(
            empty
        );


        return;

    }


    streams.forEach(
        function(stream){

            if(!stream){

                return;

            }


            const card =
                createStreamCard(
                    stream
                );


            if(card){

                streamList.appendChild(
                    card
                );

            }

        }
    );

}


/* =========================================
   LOAD LIVE STREAMS
========================================= */

async function loadLiveStreams(){

    if(!streamList){

        return;

    }


    if(noStreams){

        noStreams.textContent =
            "Loading live streams...";

    }


    try{

        const response =
            await fetch(
                CANVAS_API +
                "/api/streams/live",
                {

                    method:"GET",

                    headers:{
                        "Accept":
                            "application/json"
                    },

                    cache:
                        "no-store"

                }
            );


        let data = {};


        try{

            data =
                await response.json();

        }catch(error){

            data = {};

        }


        if(!response.ok){

            throw new Error(
                data.message ||
                data.error ||
                "Unable to load live streams."
            );

        }


        const streams =
            Array.isArray(
                data.streams
            )
                ? data.streams
                : Array.isArray(data)
                    ? data
                    : [];


        displayStreams(
            streams
        );


        console.log(
            "Canvas live streams:",
            streams
        );


    }catch(error){

        console.error(
            "Canvas live streams error:",
            error
        );


        if(!streamList){

            return;

        }


        streamList.innerHTML =
            "";


        const errorBox =
            document.createElement(
                "div"
            );


        errorBox.className =
            "no-streams";


        errorBox.innerHTML =
            "<strong>" +
            "Unable to load live streams." +
            "</strong>" +
            "<br>" +
            "Please try again in a moment.";


        streamList.appendChild(
            errorBox
        );

    }

}


/* =========================================
   OPEN STREAM
========================================= */

function openStream(
    stream
){

    if(!stream){

        return;

    }


    const streamId =
        getStreamId(
            stream
        );


    if(!streamId){

        console.error(
            "No stream ID found:",
            stream
        );

        return;

    }


    try{

        localStorage.setItem(
            "canvasSelectedStream",
            JSON.stringify(
                stream
            )
        );


        localStorage.setItem(
            "canvasCurrentStreamId",
            String(
                streamId
            )
        );


    }catch(error){

        console.error(
            "Stream selection save failed:",
            error
        );

    }


    window.location.href =
        "watch.html?id=" +
        encodeURIComponent(
            streamId
        );

}


/* =========================================
   PROFILE STORAGE UPDATE
========================================= */

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key ===
            "canvasProfile"
        ){

            loadSavedProfile();

            updateProfileIcons();

        }

    }
);


/* =========================================
   PAGE VISIBILITY
========================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(!document.hidden){

            loadSavedProfile();

            updateProfileIcons();

            loadLiveStreams();

        }

    }
);


/* =========================================
   CONNECTION RECOVERY
========================================= */

window.addEventListener(
    "online",
    function(){

        loadLiveStreams();

    }
);


/* =========================================
   LIVE STREAM REFRESH
========================================= */

let liveStreamRefreshTimer =
    null;


function startLiveStreamRefresh(){

    if(liveStreamRefreshTimer){

        clearInterval(
            liveStreamRefreshTimer
        );

    }


    liveStreamRefreshTimer =
        setInterval(
            function(){

                if(
                    !document.hidden
                ){

                    loadLiveStreams();

                }

            },
            10000
        );

}


/* =========================================
   CLEAN LOCAL STREAM DATA
========================================= */

function checkLocalLiveStream(){

    try{

        const stored =
            localStorage.getItem(
                "canvasActiveStream"
            );


        if(!stored){

            return null;

        }


        const stream =
            JSON.parse(
                stored
            );


        if(
            !stream ||
            !stream.isLive
        ){

            return null;

        }


        return stream;

    }catch(error){

        console.error(
            "Local stream check failed:",
            error
        );

        return null;

    }

}


/* =========================================
   BACKEND IS SOURCE OF TRUTH
========================================= */

function cleanupLocalStream(){

    const localStream =
        checkLocalLiveStream();


    if(!localStream){

        return;

    }


    /*
     * Do not place the local stream directly
     * on Home.
     *
     * /api/streams/live is the source of
     * truth for currently live streams.
     */

}


/* =========================================
   PAGE INITIALIZATION
========================================= */

function initializeHome(){

    loadSavedProfile();

    updateProfileIcons();

    cleanupLocalStream();

    loadLiveStreams();

    startLiveStreamRefresh();

}


/* =========================================
   INITIALIZE
========================================= */

if(
    document.readyState ===
    "loading"
){

    document.addEventListener(
        "DOMContentLoaded",
        initializeHome
    );

}else{

    initializeHome();

}


/* =========================================
   PAGE SHOW RECOVERY
========================================= */

window.addEventListener(
    "pageshow",
    function(){

        loadSavedProfile();

        updateProfileIcons();

        loadLiveStreams();

    }
);


/* =========================================
   PART 2 ENDS HERE
========================================= */
  <script>

/* =========================================
   HOME REFRESH
========================================= */

let homeRefreshTimer =
    null;


function startHomeRefresh(){

    if(homeRefreshTimer){

        clearInterval(
            homeRefreshTimer
        );

    }


    homeRefreshTimer =
        setInterval(
            function(){

                if(
                    document.hidden
                ){

                    return;

                }


                loadLiveStreams();

            },
            15000
        );

}


/* =========================================
   STOP REFRESH
========================================= */

function stopHomeRefresh(){

    if(liveStreamRefreshTimer){

        clearInterval(
            liveStreamRefreshTimer
        );

        liveStreamRefreshTimer =
            null;

    }


    if(homeRefreshTimer){

        clearInterval(
            homeRefreshTimer
        );

        homeRefreshTimer =
            null;

    }

}


/* =========================================
   PAGE HIDDEN / VISIBLE
========================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(document.hidden){

            return;

        }


        loadSavedProfile();

        updateProfileIcons();

        loadLiveStreams();

    }
);


/* =========================================
   BEFORE PAGE CLOSE
========================================= */

window.addEventListener(
    "pagehide",
    function(){

        stopHomeRefresh();

    }
);


/* =========================================
   BEFORE UNLOAD
========================================= */

window.addEventListener(
    "beforeunload",
    function(){

        stopHomeRefresh();

    }
);


/* =========================================
   FINAL PROFILE REFRESH
========================================= */

function refreshProfile(){

    loadSavedProfile();

    updateProfileIcons();

}


/* =========================================
   PROFILE PHOTO CHANGE
========================================= */

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key ===
            "canvasProfile"
        ){

            refreshProfile();

        }

    }
);


/* =========================================
   HOME STREAM CARD SAFETY
========================================= */

if(streamList){

    streamList.addEventListener(
        "click",
        function(event){

            const card =
                event.target.closest(
                    ".stream-card"
                );


            if(!card){

                return;

            }

        }
    );

}


/* =========================================
   START HOME REFRESH
========================================= */

startHomeRefresh();


/* =========================================
   FINAL PROFILE LOAD
========================================= */

refreshProfile();


/* =========================================
   CANVAS HOME READY
========================================= */

console.log(
    "Canvas Home initialized successfully."
);

</script>


</body>

</html>
