<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Canvas - Stream</title>

<link
    rel="stylesheet"
    href="style.css"
>

<style>

/* =========================================
   CANVAS STREAM
========================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#ffffff;
    color:#4b3326;
    font-family:Arial,Helvetica,sans-serif;
    padding-bottom:82px;
}


/* =========================================
   TOP NAVIGATION
========================================= */

.navbar{
    width:100%;
    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 20px;

    background:#ffffff;

    border-bottom:2px solid #d4a62a;

    position:sticky;
    top:0;

    z-index:1500;
}

.logo{
    font-size:32px;
    font-weight:800;
    color:#4b3326;
}

.top-icons{
    display:flex;
    align-items:center;
    gap:10px;
}


/* =========================================
   TOP PROFILE
========================================= */

#topProfileIcon{
    width:40px;
    height:40px;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    border-radius:50%;
    border:2px solid #d4a62a;

    background:#f3f3f3;

    color:#4b3326;

    font-size:20px;

    text-decoration:none;
}

#topProfileIcon img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}


/* =========================================
   MAIN CONTAINER
========================================= */

.container{
    width:100%;
    max-width:820px;

    margin:0 auto;

    padding:24px 18px 30px;
}


/* =========================================
   STREAM HEADER
========================================= */

.page-title{
    text-align:center;
    margin-bottom:22px;
}

.page-title h1{
    margin:0 0 6px;

    font-size:32px;
    line-height:1.15;

    font-weight:800;

    color:#4b3326;
}

.page-title p{
    margin:0;

    color:#6a574c;

    font-size:15px;
    line-height:1.5;
}


/* =========================================
   LIVE STREAM SECTION
========================================= */

.live-section{
    width:100%;
}

.live-section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:14px;
}

.live-section-title h2{
    font-size:21px;
    font-weight:800;
    color:#4b3326;
}

.live-indicator{
    font-size:12px;
    font-weight:800;
    color:#a33a2b;
}


/* =========================================
   STREAM LIST
========================================= */

.stream-list{
    width:100%;

    display:flex;
    flex-direction:column;

    gap:15px;
}


/* =========================================
   STREAM CARD
========================================= */

.stream-card{
    width:100%;

    background:#ffffff;

    border:1px solid #eadfd8;

    border-radius:18px;

    overflow:hidden;

    box-shadow:
        0 5px 20px rgba(75,51,38,.07);

    cursor:pointer;

    transition:.2s ease;
}

.stream-card:active{
    transform:scale(.99);
}

.stream-thumbnail{
    width:100%;

    aspect-ratio:16 / 9;

    background:#251b17;

    overflow:hidden;
}

.stream-thumbnail img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;
}


/* =========================================
   STREAM INFO
========================================= */

.stream-info{
    padding:14px;
}

.stream-title{
    margin-bottom:8px;

    color:#4b3326;

    font-size:17px;
    font-weight:800;

    line-height:1.3;
}

.stream-creator{
    display:flex;
    align-items:center;

    gap:8px;

    color:#6a574c;

    font-size:13px;
    font-weight:600;
}


/* =========================================
   CREATOR PROFILE PICTURE
========================================= */

.stream-creator-photo{
    width:30px;
    height:30px;

    flex:none;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    border-radius:50%;

    background:#f3f3f3;

    border:1.5px solid #d4a62a;

    color:#4b3326;

    font-size:15px;
}

.stream-creator-photo img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;
}


/* =========================================
   CATEGORY
========================================= */

.stream-category{
    margin-top:7px;

    color:#d4a62a;

    font-size:12px;
    font-weight:800;
}


/* =========================================
   EMPTY STATE
========================================= */

.no-streams{
    width:100%;

    padding:35px 20px;

    text-align:center;

    color:#6a574c;

    border:1px dashed #d8c7bb;

    border-radius:18px;
}


/* =========================================
   BOTTOM NAVIGATION
========================================= */

.bottom-nav{
    position:fixed;

    left:0;
    bottom:0;

    width:100%;
    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-around;

    padding:5px 7px;

    background:#ffffff;

    border-top:2px solid #d4a62a;

    box-shadow:
        0 -5px 20px rgba(75,51,38,.08);

    z-index:1500;
}

.bottom-nav a{
    flex:1;
    min-width:0;

    height:58px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:2px;

    border-radius:12px;

    color:#4b3326;

    text-decoration:none;

    font-size:23px;

    position:relative;
}

.bottom-nav a span{
    font-size:10px;
    font-weight:700;
}

.bottom-nav a.active{
    color:#d4a62a;
}


/* =========================================
   REMOVE MUSTARD ACTIVE DOT
========================================= */

.bottom-nav a.active::before,
.bottom-nav a.active::after{
    content:none !important;
    display:none !important;
}


/* =========================================
   PROFILE ICON
========================================= */

#bottomProfileIcon{
    position:relative;
}

#bottomProfileIcon img{
    width:25px;
    height:25px;

    object-fit:cover;

    display:block;

    border-radius:50%;

    border:1.5px solid #d4a62a;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    .navbar{
        height:66px;
        padding:0 15px;
    }

    .logo{
        font-size:29px;
    }

    .container{
        padding:20px 14px 25px;
    }

    .page-title{
        margin-bottom:18px;
    }

    .page-title h1{
        font-size:30px;
    }

}


/* =========================================
   VERY SMALL DEVICES
========================================= */

@media(max-width:360px){

    .logo{
        font-size:26px;
    }

    #topProfileIcon{
        width:37px;
        height:37px;
    }

}

</style>

</head>

<body>


<!-- =========================================
     TOP NAVIGATION
========================================= -->

<header class="navbar">

    <div class="logo">
        Canvas
    </div>

    <div class="top-icons">

        <a
            href="profile.html"
            id="topProfileIcon"
            aria-label="Profile"
        >
            ⬤
        </a>

    </div>

</header>


<!-- =========================================
     MAIN CONTENT
========================================= -->

<main class="container">

    <section class="page-title">

        <h1>
            Live Streams
        </h1>

        <p>
            Watch creators live on Canvas
        </p>

    </section>


    <section class="live-section">

        <div class="live-section-title">

    

      

         <span class="live-indicator">
                🔴 LIVE
            </span>

        </div>


        <div
            id="streamList"
            class="stream-list"
        >

            <div
                id="noStreams"
                class="no-streams"
            >
                Loading live streams...
            </div>

        </div>

    </section>

</main>


<!-- =========================================
     BOTTOM NAVIGATION
========================================= -->

<nav class="bottom-nav">

    <a
        href="stream.html"
        class="active"
    >

        ⌂

        <span>
            Home
        </span>

    </a>


    <a href="explore.html">

        <svg
            width="23"
            height="23"
            viewBox="0 0 24 24"
            fill="none"
        >

            <circle
                cx="11"
                cy="11"
                r="7"
                stroke="currentColor"
                stroke-width="2.8"
            />

            <path
                d="M16.5 16.5L21 21"
                stroke="currentColor"
                stroke-width="2.8"
                stroke-linecap="round"
            />

        </svg>

        <span>
            Explore
        </span>

    </a>


    <a href="golive.html">

        ⊙

        <span>
            Go Live
        </span>

    </a>


    <a
        href="profile.html"
        id="bottomProfileIcon"
    >

        ⬤

        <span>
            Profile
        </span>

    </a>

</nav>


<script>

/* =========================================
   PART 1 ENDS HERE
========================================= */
  /* =========================================
   PROFILE DATA
========================================= */

let savedProfile = {};


/* =========================================
   CANVAS API
========================================= */

const CANVAS_API =
    "https://canvas-kh9p.onrender.com";


/* =========================================
   AUTH TOKEN
========================================= */

function getAuthToken(){

    return localStorage.getItem(
        "canvasAuthToken"
    ) || "";

}


/* =========================================
   LOAD LOCAL PROFILE
========================================= */

function loadSavedProfile(){

    try{

        const data =
            localStorage.getItem(
                "canvasProfile"
            );

        savedProfile =
            data
                ? JSON.parse(data) || {}
                : {};

    }catch(error){

        console.error(
            "Canvas profile load failed:",
            error
        );

        savedProfile = {};

    }

}


/* =========================================
   PROFILE PHOTO
========================================= */

function getProfilePhoto(){

    return (
        savedProfile.photo ||
        savedProfile.profileImage ||
        savedProfile.profilePhoto ||
        savedProfile.image ||
        savedProfile.profile_picture ||
        ""
    );

}


/* =========================================
   HTML ESCAPE
========================================= */

function escapeHtml(value){

    const div =
        document.createElement("div");

    div.textContent =
        String(value || "");

    return div.innerHTML;

}


/* =========================================
   UPDATE PROFILE ICONS
========================================= */

function updateProfileIcons(){

    const photo =
        getProfilePhoto();


    const top =
        document.getElementById(
            "topProfileIcon"
        );


    if(top){

        top.innerHTML =
            photo
                ? '<img src="' +
                  escapeHtml(photo) +
                  '" alt="Profile">'
                : "⬤";

    }


    const bottom =
        document.getElementById(
            "bottomProfileIcon"
        );


    if(bottom){

        bottom.innerHTML =
            photo
                ? '<img src="' +
                  escapeHtml(photo) +
                  '" alt="Profile">' +
                  '<span>Profile</span>'
                : '⬤<span>Profile</span>';

    }

}


/* =========================================
   LOAD PROFILE FROM BACKEND
========================================= */

async function loadBackendProfile(){

    const token =
        getAuthToken();


    if(!token){

        return;

    }


    try{

        const response =
            await fetch(
                CANVAS_API +
                "/api/profile",
                {
                    method:"GET",

                    headers:{
                        "Accept":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            token
                    }
                }
            );


        if(!response.ok){

            return;

        }


        const data =
            await response.json();


        if(
            !data ||
            !data.success ||
            !data.profile
        ){

            return;

        }


        const profile =
            data.profile;


        /*
         * Backend profile_picture is
         * the main source for the image.
         */

        const backendPhoto =
            profile.profile_picture ||
            "";


        savedProfile = {

            ...savedProfile,

            name:
                profile.name ||
                savedProfile.name ||
                "",

            username:
                profile.username ||
                savedProfile.username ||
                "",

            email:
                profile.email ||
                savedProfile.email ||
                "",

            bio:
                profile.bio ||
                savedProfile.bio ||
                "",

            photo:
                backendPhoto ||
                savedProfile.photo ||
                ""

        };


        localStorage.setItem(
            "canvasProfile",
            JSON.stringify(
                savedProfile
            )
        );


        updateProfileIcons();


    }catch(error){

        console.error(
            "Backend profile loading error:",
            error
        );

    }

}


/* =========================================
   STREAM ELEMENTS
========================================= */

const streamList =
    document.getElementById(
        "streamList"
    );


const noStreams =
    document.getElementById(
        "noStreams"
    );


/* =========================================
   CREATE CREATOR PROFILE IMAGE
========================================= */

function createCreatorPhoto(
    profilePicture
){

    const photo =
        String(
            profilePicture || ""
        ).trim();


    if(photo){

        return (
            '<div class="stream-creator-photo">' +

                '<img src="' +
                escapeHtml(photo) +
                '" alt="Creator profile">' +

            '</div>'
        );

    }


    /*
     * Keep a simple placeholder only
     * when the creator has no picture.
     */

    return (
        '<div class="stream-creator-photo">' +
            '⬤' +
        '</div>'
    );

}


/* =========================================
   CREATE STREAM CARD
========================================= */

function createStreamCard(stream){

    const card =
        document.createElement("article");


    card.className =
        "stream-card";


    const thumbnail =
        stream.thumbnail ||
        stream.thumbnailUrl ||
        stream.image ||
        stream.imageUrl ||
        "";


    const title =
        stream.title ||
        "Untitled stream";


    const creator =
        stream.name ||
        stream.username ||
        stream.creator ||
        "Canvas Creator";


    const category =
        stream.category ||
        "Other";


    /*
     * IMPORTANT:
     *
     * The backend sends the creator's
     * profile image as profile_picture.
     */

    const creatorPhoto =
        stream.profile_picture ||
        stream.profilePicture ||
        stream.creatorProfilePicture ||
        "";


    let thumbnailHTML;


    if(thumbnail){

        thumbnailHTML =
            '<img src="' +
            escapeHtml(thumbnail) +
            '" alt="Stream thumbnail">';

    }else{

        thumbnailHTML =
            '<div class="stream-thumbnail-placeholder">' +
                '🔴 Canvas Live' +
            '</div>';

    }


    card.innerHTML =

        '<div class="stream-thumbnail">' +

            thumbnailHTML +

        '</div>' +

        '<div class="stream-info">' +

            '<div class="stream-title">' +
                escapeHtml(title) +
            '</div>' +

            '<div class="stream-creator">' +

                createCreatorPhoto(
                    creatorPhoto
                ) +

                '<span>' +
                    escapeHtml(creator) +
                '</span>' +

            '</div>' +

            '<div class="stream-category">' +
                escapeHtml(category) +
            '</div>' +

        '</div>';


    /* =====================================
       OPEN WATCH PAGE
    ===================================== */

    card.addEventListener(
        "click",
        function(){

            const id =
                stream.id ||
                stream.streamId ||
                "";


            if(!id){

                console.error(
                    "No stream ID found:",
                    stream
                );

                return;

            }


            try{

                localStorage.setItem(
                    "canvasSelectedStream",
                    JSON.stringify(
                        stream
                    )
                );


                localStorage.setItem(
                    "canvasCurrentStreamId",
                    String(id)
                );

            }catch(error){

                console.error(
                    "Could not save selected stream:",
                    error
                );

            }


            window.location.href =
                "watch.html?id=" +
                encodeURIComponent(id);

        }
    );


    return card;

}


/* =========================================
   DISPLAY STREAMS
========================================= */

function displayStreams(
    streams
){

    if(!streamList){

        return;

    }


    streamList.innerHTML = "";


    if(
        !Array.isArray(streams) ||
        !streams.length
    ){

        const empty =
            document.createElement("div");


        empty.className =
            "no-streams";


        empty.textContent =
            "No one is live right now.";


        streamList.appendChild(
            empty
        );


        return;

    }


    streams.forEach(
        function(stream){

            if(!stream){

                return;

            }


            const card =
                createStreamCard(
                    stream
                );


            streamList.appendChild(
                card
            );

        }
    );

}


/* =========================================
   PART 2 ENDS HERE
========================================= */
  /* =========================================
   LOAD LIVE STREAMS
========================================= */

async function loadLiveStreams(){

    if(!streamList){

        return;

    }


    if(noStreams){

        noStreams.textContent =
            "Loading live streams...";

    }


    try{

        const response =
            await fetch(
                CANVAS_API +
                "/api/streams/live",
                {
                    method:"GET",

                    headers:{
                        "Accept":
                            "application/json"
                    }
                }
            );


        let data = {};


        try{

            data =
                await response.json();

        }catch(error){

            data = {};

        }


        if(!response.ok){

            throw new Error(
                data.message ||
                data.error ||
                "Unable to load live streams."
            );

        }


        const streams =
            Array.isArray(
                data.streams
            )
                ? data.streams
                : Array.isArray(data)
                    ? data
                    : [];


        displayStreams(
            streams
        );


        console.log(
            "Canvas live streams:",
            streams
        );


    }catch(error){

        console.error(
            "Canvas live streams error:",
            error
        );


        if(!streamList){

            return;

        }


        streamList.innerHTML = "";


        const errorBox =
            document.createElement("div");


        errorBox.className =
            "no-streams";


        errorBox.innerHTML =
            "<strong>Unable to load live streams.</strong>" +
            "<br>" +
            "Please try again in a moment.";


        streamList.appendChild(
            errorBox
        );

    }

}


/* =========================================
   REFRESH LIVE STREAMS
========================================= */

let liveStreamRefreshTimer =
    null;


function startLiveStreamRefresh(){

    if(liveStreamRefreshTimer){

        clearInterval(
            liveStreamRefreshTimer
        );

    }


    liveStreamRefreshTimer =
        setInterval(
            function(){

                if(
                    !document.hidden
                ){

                    loadLiveStreams();

                }

            },
            10000
        );

}


/* =========================================
   PAGE VISIBILITY
========================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(!document.hidden){

            loadBackendProfile();

            loadLiveStreams();

        }

    }
);


/* =========================================
   PROFILE STORAGE UPDATE
========================================= */

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key ===
            "canvasProfile"
        ){

            loadSavedProfile();

            updateProfileIcons();

            loadBackendProfile();

        }

    }
);


/* =========================================
   LOCAL LIVE STREAM CHECK
========================================= */

function checkLocalLiveStream(){

    try{

        const stored =
            localStorage.getItem(
                "canvasActiveStream"
            );


        if(!stored){

            return null;

        }


        const stream =
            JSON.parse(stored);


        if(
            !stream ||
            !stream.isLive
        ){

            return null;

        }


        return stream;

    }catch(error){

        console.error(
            "Local stream check failed:",
            error
        );

        return null;

    }

}


/* =========================================
   REMOVE ENDED LOCAL STREAM
========================================= */

function cleanupLocalStream(){

    const localStream =
        checkLocalLiveStream();


    if(!localStream){

        return;

    }


    /*
     * Backend remains the source
     * of truth for live streams.
     */

}


/* =========================================
   OPEN STREAM
========================================= */

function openStream(stream){

    if(!stream){

        return;

    }


    const streamId =
        stream.id ||
        stream.streamId ||
        "";


    if(!streamId){

        return;

    }


    try{

        localStorage.setItem(
            "canvasSelectedStream",
            JSON.stringify(
                stream
            )
        );


        localStorage.setItem(
            "canvasCurrentStreamId",
            String(streamId)
        );

    }catch(error){

        console.error(
            "Stream selection save failed:",
            error
        );

    }


    window.location.href =
        "watch.html?id=" +
        encodeURIComponent(
            streamId
        );

}


/* =========================================
   HOME / STREAM REFRESH
========================================= */

function refreshStreamPage(){

    if(document.hidden){

        return;

    }


    loadSavedProfile();

    updateProfileIcons();

    loadBackendProfile();

    loadLiveStreams();

}


/* =========================================
   PART 3 ENDS HERE
========================================= */
  /* =========================================
   INITIALIZE STREAM PAGE
========================================= */

async function initializeStream(){

    /*
     * Load local profile first so the icon
     * appears immediately without waiting
     * for the backend.
     */

    loadSavedProfile();

    updateProfileIcons();


    /*
     * Then load the latest profile from
     * the Canvas backend.
     */

    await loadBackendProfile();


    /*
     * Load live streams.
     */

    cleanupLocalStream();

    loadLiveStreams();


    /*
     * Keep the stream list updated.
     */

    startLiveStreamRefresh();

}


/* =========================================
   DOM READY
========================================= */

if(
    document.readyState ===
    "loading"
){

    document.addEventListener(
        "DOMContentLoaded",
        function(){

            initializeStream();

        }
    );

}else{

    initializeStream();

}


/* =========================================
   BACK / FORWARD RECOVERY
========================================= */

window.addEventListener(
    "pageshow",
    function(){

        loadSavedProfile();

        updateProfileIcons();

        loadBackendProfile();

        loadLiveStreams();

    }
);


/* =========================================
   CONNECTION RECOVERY
========================================= */

window.addEventListener(
    "online",
    function(){

        loadBackendProfile();

        loadLiveStreams();

    }
);


/* =========================================
   FINAL STREAM CARD SAFETY
========================================= */

if(streamList){

    streamList.addEventListener(
        "click",
        function(event){

            const card =
                event.target.closest(
                    ".stream-card"
                );


            if(!card){

                return;

            }

        }
    );

}


/* =========================================
   PERIODIC PAGE REFRESH
========================================= */

let streamPageRefreshTimer =
    null;


function startStreamPageRefresh(){

    if(streamPageRefreshTimer){

        clearInterval(
            streamPageRefreshTimer
        );

    }


    streamPageRefreshTimer =
        setInterval(
            function(){

                if(
                    !document.hidden
                ){

                    loadLiveStreams();

                }

            },
            15000
        );

}


/* =========================================
   START PAGE REFRESH
========================================= */

startStreamPageRefresh();


/* =========================================
   PAGE HIDDEN / VISIBLE
========================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.hidden
        ){

            return;

        }


        refreshStreamPage();

    }
);


/* =========================================
   CLEANUP
========================================= */

window.addEventListener(
    "beforeunload",
    function(){

        if(liveStreamRefreshTimer){

            clearInterval(
                liveStreamRefreshTimer
            );

            liveStreamRefreshTimer =
                null;

        }


        if(streamPageRefreshTimer){

            clearInterval(
                streamPageRefreshTimer
            );

            streamPageRefreshTimer =
                null;

        }

    }
);


/* =========================================
   FINAL PROFILE RECOVERY
========================================= */

setTimeout(
    function(){

        loadSavedProfile();

        updateProfileIcons();

        loadBackendProfile();

    },
    500
);


/* =========================================
   CANVAS STREAM READY
========================================= */

console.log(
    "Canvas Stream initialized successfully."
);
