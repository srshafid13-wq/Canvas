<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Canvas - Stream</title>

<link rel="stylesheet" href="style.css">

</head>

<body>


<!-- =========================================
     TOP NAVBAR
========================================= -->

<header class="navbar">

    <div class="logo">
        Canvas
    </div>

    <div class="top-icons">

        <span>
            🔍
        </span>

        <a href="profile.html" class="icon">
            ⬤
        </a>

    </div>

</header>



<!-- =========================================
     STREAM PAGE
========================================= -->

<main class="stream-page">


    <section class="stream-header">

        <h1>
            Stream
        </h1>

        <p>
            Watch live streams on Canvas
        </p>

    </section>



    <!-- =====================================
         LIVE STREAM AREA
    ====================================== -->

    <section class="live-streams">

        <div class="empty-stream">

            <div class="stream-symbol">
                ▣
            </div>

            <h2>
                No live streams yet
            </h2>

            <p>
                When someone goes live, their stream will appear here.
            </p>

            <a
                href="golive.html"
                class="go-live-button"
            >
                🔴 Start Streaming
            </a>

        </div>

    </section>


</main>



<!-- =========================================
     BOTTOM NAVIGATION
========================================= -->

<nav class="bottom-nav">


    <!-- HOME -->

    <a href="stream.html">

        ⌂

        <span>
            Home
        </span>

    </a>



    <!-- STREAM -->

    <a
        href="stream.html"
        class="active"
    >

        ▣

        <span>
            Stream
        </span>

    </a>



    <!-- GO LIVE -->

    <a href="golive.html">

        ⊙

        <span>
            Go Live
        </span>

    </a>



    <!-- PROFILE -->

    <a href="profile.html">

        ⬤

        <span>
            Profile
        </span>

    </a>


</nav>


</body>

  </html>
