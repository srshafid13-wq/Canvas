<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Canvas</title>

<link
    rel="stylesheet"
    href="style.css"
>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#fff;
    color:#4b3326;
    font-family:Arial,Helvetica,sans-serif;
    padding-bottom:82px;
}


/* TOP NAV */

.navbar{
    width:100%;
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    background:#fff;
    border-bottom:2px solid #d4a62a;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:32px;
    font-weight:800;
    color:#4b3326;
}


/* STREAM AREA */

.container{
    width:100%;
    max-width:820px;
    margin:0 auto;
    padding:24px 18px 30px;
}

.stream-list{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:15px;
}


/* CARD */

.stream-card{
    width:100%;
    background:#fff;
    border:1px solid #eadfd8;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(75,51,38,.07);
    cursor:pointer;
}

.stream-thumbnail{
    width:100%;
    aspect-ratio:16/9;
    background:#251b17;
    overflow:hidden;
    position:relative;
}

.stream-thumbnail img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.stream-thumbnail-placeholder{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f3e8d3;
    color:#4b3326;
    font-size:16px;
    font-weight:700;
}


/* ONLY LIVE BADGE */

.stream-live-badge{
    position:absolute;
    top:10px;
    left:10px;
    padding:5px 8px;
    border-radius:7px;
    background:#a33a2b;
    color:#fff;
    font-size:11px;
    font-weight:800;
}

.stream-info{
    padding:14px;
}

.stream-title{
    margin-bottom:9px;
    color:#4b3326;
    font-size:17px;
    font-weight:800;
    line-height:1.3;
    word-break:break-word;
}

.stream-creator-row{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
}

.creator-avatar{
    width:38px;
    height:38px;
    min-width:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border-radius:50%;
    border:1.5px solid #d4a62a;
    background:#f3f3f3;
    color:#4b3326;
    font-size:17px;
}

.creator-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
}

.creator-details{
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:2px;
}

.stream-creator{
    color:#4b3326;
    font-size:13px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.stream-username{
    color:#6a574c;
    font-size:11px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.stream-category{
    color:#d4a62a;
    font-size:11px;
    font-weight:800;
}


/* EMPTY / ERROR */

.no-streams{
    width:100%;
    padding:35px 20px;
    text-align:center;
    color:#6a574c;
    border:1px dashed #d8c7bb;
    border-radius:18px;
    font-size:14px;
    line-height:1.5;
}


/* BOTTOM NAV */

.bottom-nav{
    position:fixed;
    left:0;
    bottom:0;
    width:100%;
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-around;
    padding:5px 7px;
    background:#fff;

    border-top:none !important;
    box-shadow:0 -5px 20px rgba(75,51,38,.08);
    z-index:1000;
}

.bottom-nav a{
    flex:1;
    min-width:0;
    height:58px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    border-radius:12px;
    color:#4b3326;
    text-decoration:none;
    font-size:23px;

    background:transparent !important;
    border:none !important;
    box-shadow:none !important;
    outline:none !important;
}


/* HOME ACTIVE STATE — NO MUSTARD SPOT */

.bottom-nav a.active,
.bottom-nav a.active:hover,
.bottom-nav a.active:focus,
.bottom-nav a.active:active{
    background:transparent !important;
    border:none !important;
    box-shadow:none !important;
    outline:none !important;
    color:#4b3326 !important;
}


/* REMOVE POSSIBLE CSS PSEUDO-ELEMENT SPOT */

.bottom-nav a.active::before,
.bottom-nav a.active::after{
    content:none !important;
    display:none !important;
    background:none !important;
    border:none !important;
    box-shadow:none !important;
}


/* KEEP LABEL NORMAL */

.bottom-nav a span{
    font-size:10px;
    font-weight:700;
}

.explore-icon{
    width:23px;
    height:23px;
    display:block;
}

#bottomProfileIcon img{
    width:25px;
    height:25px;
    object-fit:cover;
    border-radius:50%;
    border:1.5px solid #d4a62a;
}


@media(max-width:600px){

    .navbar{
        height:66px;
        padding:0 15px;
    }

    .logo{
        font-size:29px;
    }

    .container{
        padding:20px 14px 25px;
    }

    .stream-card{
        border-radius:17px;
    }

}


@media(max-width:360px){

    .logo{
        font-size:26px;
    }

    .container{
        padding-left:12px;
        padding-right:12px;
    }

    .creator-avatar{
        width:36px;
        height:36px;
        min-width:36px;
    }

}

</style>

</head>

<body>


<header class="navbar">

    <div class="logo">
        Canvas
    </div>

</header>


<main class="container">

    <div
        id="streamList"
        class="stream-list"
    >

        <div
            id="noStreams"
            class="no-streams"
        >
            Loading live streams...
        </div>

    </div>

</main>


<nav class="bottom-nav">


    <!-- HOME -->

    <a
        href="stream.html"
        class="active"
        aria-label="Home"
    >

        ⌂

        <span>
            Home
        </span>

    </a>


    <!-- EXPLORE -->

    <a
        href="explore.html"
        aria-label="Explore"
    >

        <svg
            class="explore-icon"
            viewBox="0 0 24 24"
            fill="none"
        >

            <circle
                cx="11"
                cy="11"
                r="7"
                stroke="currentColor"
                stroke-width="2.8"
            />

            <path
                d="M16.5 16.5L21 21"
                stroke="currentColor"
                stroke-width="2.8"
                stroke-linecap="round"
            />

        </svg>

        <span>
            Explore
        </span>

    </a>


    <!-- GO LIVE -->

    <a
        href="golive.html"
        aria-label="Go Live"
    >

        ⊙

        <span>
            Go Live
        </span>

    </a>


    <!-- PROFILE -->

    <a
        href="profile.html"
        id="bottomProfileIcon"
        aria-label="Profile"
    >

        ⬤

        <span>
            Profile
        </span>

    </a>

</nav>


<script>

const CANVAS_API =
    "https://canvas-kh9p.onrender.com";


/* =========================================
   ELEMENTS
========================================= */

const streamList =
    document.getElementById(
        "streamList"
    );


const noStreams =
    document.getElementById(
        "noStreams"
    );


/* =========================================
   PROFILE
========================================= */

function loadProfileIcons(){

    let profile = {};

    try{

        const saved =
            localStorage.getItem(
                "canvasProfile"
            );

        if(saved){

            profile =
                JSON.parse(saved) || {};

        }

    }
    catch(error){

        console.log(
            "Profile storage error:",
            error
        );

    }


    const photo =
        profile.photo ||
        profile.profileImage ||
        profile.profilePhoto ||
        profile.image ||
        profile.profile_picture ||
        "";


    const bottom =
        document.getElementById(
            "bottomProfileIcon"
        );


    if(bottom){

        bottom.innerHTML = photo
            ? '<img src="' +
              escapeHtml(photo) +
              '" alt="Profile">' +
              '<span>Profile</span>'
            : '⬤<span>Profile</span>';

    }

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(value || "");


    return div.innerHTML;

}


/* =========================================
   STREAM VALUES
   ONLY REAL DATA
========================================= */

function getStreamId(stream){

    return (
        stream.id ||
        stream.stream_id ||
        stream.streamId ||
        ""
    );

}


/* =========================================
   CREATOR OBJECT
========================================= */

function getCreatorObject(stream){

    return (
        stream.creator ||
        stream.user ||
        stream.profile ||
        stream.owner ||
        {}
    );

}


/* =========================================
   TITLE
   NO DEFAULT TITLE
========================================= */

function getTitle(stream){

    const title =
        stream.title ??
        stream.stream_title ??
        stream.streamTitle ??
        "";


    return String(
        title
    ).trim();

}


/* =========================================
   CREATOR NAME
========================================= */

function getCreatorName(stream){

    const creator =
        getCreatorObject(stream);


    const name =
        stream.creator_name ||
        stream.creatorName ||
        creator.name ||
        creator.display_name ||
        creator.displayName ||
        stream.name ||
        "";


    return String(
        name
    ).trim();

}


/* =========================================
   CREATOR USERNAME
========================================= */

function getCreatorUsername(stream){

    const creator =
        getCreatorObject(stream);


    const username =
        stream.creator_username ||
        stream.creatorUsername ||
        creator.username ||
        creator.user_name ||
        stream.username ||
        "";


    const clean =
        String(username)
            .trim()
            .replace(/^@/, "");


    return clean
        ? "@" + clean
        : "";

}


/* =========================================
   CATEGORY
   NO DEFAULT CATEGORY
========================================= */

function getCategory(stream){

    const category =
        stream.category ??
        stream.stream_category ??
        stream.streamCategory ??
        "";


    return String(
        category
    ).trim();

}


/* =========================================
   THUMBNAIL
========================================= */

function getThumbnail(stream){

    return (
        stream.thumbnail ||
        stream.thumbnailUrl ||
        stream.image ||
        stream.imageUrl ||
        ""
    );

}


/* =========================================
   PROFILE PHOTO
========================================= */

function getProfilePhoto(stream){

    const creator =
        getCreatorObject(stream);


    return (
        stream.profile_picture ||
        stream.profileImage ||
        stream.profilePhoto ||
        stream.avatar ||
        stream.userPhoto ||

        creator.profile_picture ||
        creator.profileImage ||
        creator.profilePhoto ||
        creator.avatar ||
        creator.photo ||

        ""
    );

}


/* =========================================
   CREATE STREAM CARD
========================================= */

function createStreamCard(stream){

    const id =
        getStreamId(stream);


    if(!id){

        return null;

    }


    const card =
        document.createElement(
            "article"
        );


    card.className =
        "stream-card";


    const thumbnail =
        getThumbnail(stream);


    const title =
        getTitle(stream);


    const creator =
        getCreatorName(stream);


    const username =
        getCreatorUsername(stream);


    const category =
        getCategory(stream);


    const photo =
        getProfilePhoto(stream);


    let thumbnailHTML;


    if(thumbnail){

        thumbnailHTML =
            '<img src="' +
            escapeHtml(thumbnail) +
            '" alt="Stream thumbnail">';

    }
    else{

        thumbnailHTML =
            '<div class="stream-thumbnail-placeholder">' +
            'Canvas Live' +
            '</div>';

    }


    const avatarHTML =
        photo
            ? '<img src="' +
              escapeHtml(photo) +
              '" alt="Profile">'
            : "⬤";


    /*
       ONLY SHOW TITLE IF CREATOR
       ACTUALLY ENTERED ONE.
    */

    const titleHTML =
        title
            ? '<div class="stream-title">' +
              escapeHtml(title) +
              '</div>'
            : "";


    /*
       ONLY SHOW CREATOR NAME IF
       REAL DATA EXISTS.
    */

    const creatorHTML =
        creator
            ? '<div class="stream-creator">' +
              escapeHtml(creator) +
              '</div>'
            : "";


    /*
       ONLY SHOW USERNAME IF
       REAL DATA EXISTS.
    */

    const usernameHTML =
        username
            ? '<div class="stream-username">' +
              escapeHtml(username) +
              '</div>'
            : "";


    /*
       ONLY SHOW CATEGORY IF
       CREATOR ACTUALLY SELECTED ONE.
    */

    const categoryHTML =
        category
            ? '<div class="stream-category">' +
              escapeHtml(category) +
              '</div>'
            : "";


    card.innerHTML =

        '<div class="stream-thumbnail">' +

            thumbnailHTML +

            '<div class="stream-live-badge">' +
                '🔴 LIVE' +
            '</div>' +

        '</div>' +

        '<div class="stream-info">' +

            titleHTML +

            '<div class="stream-creator-row">' +

                '<div class="creator-avatar">' +
                    avatarHTML +
                '</div>' +

                '<div class="creator-details">' +

                    creatorHTML +

                    usernameHTML +

                    categoryHTML +

                '</div>' +

            '</div>' +

        '</div>';


    const avatar =
        card.querySelector(
            ".creator-avatar img"
        );


    if(avatar){

        avatar.addEventListener(
            "error",
            function(){

                this.remove();


                const box =
                    card.querySelector(
                        ".creator-avatar"
                    );


                if(box){

                    box.textContent =
                        "⬤";

                }

            }
        );

    }


    card.addEventListener(
        "click",
        function(){

            try{

                localStorage.setItem(
                    "canvasSelectedStream",
                    JSON.stringify(stream)
                );


                localStorage.setItem(
                    "canvasCurrentStreamId",
                    String(id)
                );

            }
            catch(error){

                console.log(
                    "Stream storage error:",
                    error
                );

            }


            window.location.href =
                "watch.html?id=" +
                encodeURIComponent(id);

        }
    );


    return card;

}


/* =========================================
   DISPLAY STREAMS
========================================= */

function displayStreams(streams){

    if(!streamList){

        return;

    }


    streamList.innerHTML =
        "";


    if(
        !Array.isArray(streams) ||
        streams.length === 0
    ){

        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "no-streams";


        empty.textContent =
            "No one is live right now.";


        streamList.appendChild(
            empty
        );


        return;

    }


    streams.forEach(
        function(stream){

            const card =
                createStreamCard(
                    stream
                );


            if(card){

                streamList.appendChild(
                    card
                );

            }

        }
    );

}


/* =========================================
   LOAD LIVE STREAMS
========================================= */

async function loadLiveStreams(){

    if(!streamList){

        return;

    }


    try{

        const response =
            await fetch(
                CANVAS_API +
                "/api/streams",
                {
                    method:"GET",

                    headers:{
                        "Accept":
                            "application/json"
                    },

                    cache:"no-store"

                }
            );


        let data = {};


        try{

            data =
                await response.json();

        }
        catch(error){

            data = {};

        }


        if(!response.ok){

            throw new Error(
                data.message ||
                "Unable to load streams."
            );

        }


        const streams =
            Array.isArray(
                data.streams
            )
                ? data.streams
                : [];


        displayStreams(
            streams
        );


        console.log(
            "Canvas streams loaded:",
            streams
        );

    }

    catch(error){

        console.error(
            "Canvas stream loading error:",
            error
        );


        streamList.innerHTML =
            "";


        const box =
            document.createElement(
                "div"
            );


        box.className =
            "no-streams";


        box.textContent =
            "Unable to load live streams. Please try again.";


        streamList.appendChild(
            box
        );

    }

}


/* =========================================
   INITIAL LOAD
========================================= */

function initializeCanvasHome(){

    loadProfileIcons();

    loadLiveStreams();

}


/* =========================================
   START
========================================= */

if(
    document.readyState ===
    "loading"
){

    document.addEventListener(
        "DOMContentLoaded",
        initializeCanvasHome
    );

}
else{

    initializeCanvasHome();

}


/* =========================================
   AUTO REFRESH
========================================= */

let refreshTimer =
    null;


function startRefresh(){

    if(refreshTimer){

        clearInterval(
            refreshTimer
        );

    }


    refreshTimer =
        setInterval(
            function(){

                if(
                    !document.hidden
                ){

                    loadLiveStreams();

                }

            },
            10000
        );

}


startRefresh();


/* =========================================
   REFRESH PROFILE WHEN RETURNING
========================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            !document.hidden
        ){

            loadProfileIcons();

            loadLiveStreams();

        }

    }
);


/* =========================================
   PROFILE PHOTO UPDATE
========================================= */

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key ===
            "canvasProfile"
        ){

            loadProfileIcons();

        }

    }
);


/* =========================================
   NETWORK RECOVERY
========================================= */

window.addEventListener(
    "online",
    function(){

    loadLiveStreams();

    }
);


/* =========================================
   PAGE SHOW
========================================= */

window.addEventListener(
    "pageshow",
    function(){

        loadProfileIcons();

        loadLiveStreams();

    }
);


/* =========================================
   CLEANUP
========================================= */

window.addEventListener(
    "pagehide",
    function(){

        if(refreshTimer){

            clearInterval(
                refreshTimer
            );

            refreshTimer =
                null;

        }

    }
);


console.log(
    "Canvas Home ready."
);

</script>

</body>

</html>
