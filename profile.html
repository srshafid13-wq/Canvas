<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Canvas Profile</title>

<style>

/* =========================================
   CANVAS PROFILE
========================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#fff;
    color:#4b3326;
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    padding-bottom:90px;
}

/* =========================================
   TOP NAV
========================================= */

.navbar{
    height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    background:#fff;
    border-bottom:1px solid #eee;
}

.logo{
    font-size:34px;
    font-weight:800;
    color:#6F4E37;
}

.back{
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#6F4E37;
    font-size:34px;
    text-decoration:none;
}

.header-space{
    width:40px;
}

/* =========================================
   PROFILE CONTAINER
========================================= */

.profile-container{
    width:100%;
    max-width:650px;
    margin:auto;
    padding:30px 22px 110px;
}

.profile-title{
    font-size:30px;
    font-weight:800;
    margin-bottom:8px;
}

.profile-subtitle{
    color:#777;
    font-size:16px;
    line-height:1.5;
    margin-bottom:30px;
}

/* =========================================
   AVATAR
========================================= */

.avatar-section{
    text-align:center;
    margin-bottom:30px;
}

.avatar{
    width:110px;
    height:110px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    overflow:hidden;
    background:#f1f1f1;
    border:3px solid #D4A017;
    color:#6F4E37;
    font-size:48px;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* =========================================
   PHOTO ACTIONS
========================================= */

.photo-actions{
    display:flex;
    justify-content:center;
    gap:18px;
    margin-top:12px;
}

.photo-button{
    color:#6F4E37;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

.delete-photo-button{
    border:0;
    background:none;
    color:#b44a3c;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    display:none;
}

#photoInput{
    display:none;
}

/* =========================================
   FORM
========================================= */

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    color:#4b3326;
    font-size:15px;
    font-weight:700;
}

.form-group input,
.form-group textarea{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    background:#fafafa;
    color:#333;
    font-size:16px;
    outline:none;
}

.form-group textarea{
    height:100px;
    resize:none;
}

.form-group input:focus,
.form-group textarea:focus{
    border-color:#D4A017;
    background:#fff;
}

.save-button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:12px;
    background:#6F4E37;
    color:#fff;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
}

.save-button:disabled{
    opacity:.65;
    cursor:not-allowed;
}

/* =========================================
   PROFILE VIEW
========================================= */

#profileView{
    display:none;
    text-align:center;
}

.profile-name{
    margin-top:18px;
    color:#4b3326;
    font-size:28px;
    font-weight:800;
}

.profile-username{
    margin-top:5px;
    color:#777;
    font-size:18px;
}

.profile-bio{
    max-width:400px;
    margin:18px auto;
    color:#555;
    font-size:17px;
    line-height:1.5;
}

/* =========================================
   STATS
========================================= */

.stats{
    display:flex;
    justify-content:center;
    gap:60px;
    margin:25px 0;
    padding-bottom:25px;
    border-bottom:1px solid #eee;
}

.stat strong{
    display:block;
    color:#4b3326;
    font-size:24px;
}

.stat span{
    display:block;
    margin-top:5px;
    color:#777;
    font-size:15px;
}

/* =========================================
   ACCOUNT
========================================= */

.account-section{
    margin-top:25px;
    text-align:left;
}

.account-title{
    margin-bottom:20px;
    font-size:28px;
}

.account-item{
    padding:16px 0;
    border-bottom:1px solid #eee;
}

.account-label{
    margin-bottom:6px;
    color:#777;
    font-size:14px;
}

.account-value{
    color:#333;
    font-size:17px;
    word-break:break-word;
}

/* =========================================
   ACCOUNT BUTTONS
========================================= */

.edit-button,
.password-button,
.logout-button{
    width:100%;
    padding:14px;
    margin-top:12px;
    border-radius:10px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

.edit-button{
    border:1px solid #6F4E37;
    background:#fff;
    color:#6F4E37;
}

.password-button{
    border:1px solid #D4A017;
    background:#fff;
    color:#6F4E37;
}

.logout-button{
    border:1px solid #ddd;
    background:#fff;
    color:#777;
}

/* =========================================
   PASSWORD
========================================= */

#passwordSection{
    display:none;
    margin-top:25px;
    padding-top:20px;
    border-top:1px solid #eee;
}

.password-title{
    margin-bottom:18px;
    font-size:20px;
}

/* =========================================
   BOTTOM NAV
========================================= */

.bottom-nav{
    position:fixed;
    left:0;
    bottom:0;
    width:100%;
    height:75px;
    display:flex;
    background:#fff;
    border-top:0;
    z-index:1000;
}

.bottom-nav a{
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    color:#8a6b58;
    font-size:23px;
    text-decoration:none;
}

.bottom-nav a span{
    font-size:11px;
    font-weight:700;
}

.bottom-nav a.active{
    color:#4b3326;
}

/* REMOVE MUSTARD SPOT / ACTIVE DECORATION */

.bottom-nav a::before,
.bottom-nav a::after,
.bottom-nav a.active::before,
.bottom-nav a.active::after{
    content:none !important;
    display:none !important;
}

#bottomProfileImage{
    width:23px;
    height:23px;
    object-fit:cover;
    border-radius:50%;
    border:1.5px solid #d4a62a;
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    .navbar{
        height:68px;
        padding:0 16px;
    }

    .logo{
        font-size:30px;
    }

    .profile-container{
        padding:30px 22px 110px;
    }

    .profile-title{
        font-size:28px;
    }

    .stats{
        gap:55px;
    }

    .bottom-nav{
        height:70px;
    }

}

</style>

</head>

<!-- =========================================
     PROFILE JAVASCRIPT
========================================= -->

<script>

/* =========================================
   CANVAS PROFILE SYSTEM
========================================= */

const API_BASE =
    "https://canvas-kh9p.onrender.com";


/* =========================================
   LOCAL STORAGE KEYS
========================================= */

const AUTH_KEY =
    "canvasAuthToken";

const PROFILE_KEY =
    "canvasProfile";

const PROFILE_IMAGE_KEYS = [
    "canvasProfilePicture",
    "profilePicture"
];


/* =========================================
   DEFAULT PROFILE PICTURE
========================================= */

const DEFAULT_PROFILE =
    "⬤";


/* =========================================
   STATE
========================================= */

let profileData = null;

let selectedProfilePicture = "";

let deletingProfilePicture = false;

let savingProfile = false;

let changingPassword = false;


/* =========================================
   DOM HELPERS
========================================= */

function $(id){

    return document.getElementById(id);

}


/* =========================================
   AUTH TOKEN
========================================= */

function getAuthToken(){

    return (
        localStorage.getItem(AUTH_KEY) ||
        localStorage.getItem("authToken") ||
        localStorage.getItem("token") ||
        ""
    );

}


/* =========================================
   AUTH HEADERS
========================================= */

function authHeaders(){

    const token =
        getAuthToken();

    const headers = {
        "Content-Type":"application/json"
    };

    if(token){

        headers.Authorization =
            "Bearer " + token;

    }

    return headers;

}


/* =========================================
   CHECK LOGIN
========================================= */

function requireLogin(){

    const token =
        getAuthToken();

    if(!token){

        window.location.href =
            "login.html";

        return false;

    }

    return true;

}


/* =========================================
   SAFE JSON
========================================= */

async function readResponse(response){

    try{

        return await response.json();

    }catch(error){

        return {};

    }

}


/* =========================================
   NORMALIZE PROFILE IMAGE
========================================= */

function getProfileImage(profile){

    if(!profile){

        return "";

    }

    return (
        profile.profile_picture ||
        profile.profilePicture ||
        profile.profileImage ||
        profile.profilePhoto ||
        profile.photo ||
        profile.image ||
        profile.avatar ||
        ""
    );

}


/* =========================================
   SET IMAGE ELEMENT
========================================= */

function setImageOrDefault(element, image){

    if(!element){

        return;

    }

    element.innerHTML = "";

    if(image){

        const img =
            document.createElement("img");

        img.src = image;

        img.alt = "Profile";

        img.onerror = function(){

            element.innerHTML =
                DEFAULT_PROFILE;

        };

        element.appendChild(img);

    }else{

        element.innerHTML =
            DEFAULT_PROFILE;

    }

}


/* =========================================
   APPLY PROFILE PICTURE
========================================= */

function applyProfilePicture(image){

    const avatarPreview =
        $("avatarPreview");

    const profileAvatar =
        $("profileAvatar");

    const bottomProfile =
        $("bottomProfile");

    const deleteButton =
        $("deletePhotoButton");


    setImageOrDefault(
        avatarPreview,
        image
    );

    setImageOrDefault(
        profileAvatar,
        image
    );


    if(bottomProfile){

        bottomProfile.innerHTML =
            "";

        if(image){

            const img =
                document.createElement("img");

            img.src = image;

            img.alt = "Profile";

            img.style.width =
                "100%";

            img.style.height =
                "100%";

            img.style.objectFit =
                "cover";

            img.style.borderRadius =
                "50%";

            img.onerror =
                function(){

                    bottomProfile.innerHTML =
                        DEFAULT_PROFILE;

                };

            bottomProfile.appendChild(img);

        }else{

            bottomProfile.innerHTML =
                DEFAULT_PROFILE;

        }

    }


    if(deleteButton){

        deleteButton.style.display =
            image
                ? "inline-block"
                : "none";

    }

}


/* =========================================
   SAVE PROFILE LOCALLY
========================================= */

function saveProfileLocally(profile){

    try{

        localStorage.setItem(
            PROFILE_KEY,
            JSON.stringify(profile)
        );

    }catch(error){

        console.warn(
            "Unable to save local profile:",
            error
        );

    }

}


/* =========================================
   READ LOCAL PROFILE
========================================= */

function getLocalProfile(){

    try{

        const saved =
            localStorage.getItem(
                PROFILE_KEY
            );

        if(!saved){

            return null;

        }

        return JSON.parse(saved);

    }catch(error){

        return null;

    }

}


/* =========================================
   SAVE PROFILE IMAGE LOCALLY
========================================= */

function saveProfileImageLocally(image){

    PROFILE_IMAGE_KEYS.forEach(
        key => {

            if(image){

                try{

                    localStorage.setItem(
                        key,
                        image
                    );

                }catch(error){

                    console.warn(
                        "Could not save profile image:",
                        error
                    );

                }

            }else{

                localStorage.removeItem(
                    key
                );

            }

        }
    );

}


/* =========================================
   READ LOCAL PROFILE IMAGE
========================================= */

function getLocalProfileImage(){

    for(
        const key of PROFILE_IMAGE_KEYS
    ){

        const image =
            localStorage.getItem(key);

        if(image){

            return image;

        }

    }

    const profile =
        getLocalProfile();

    return getProfileImage(
        profile
    );

}


/* =========================================
   LOAD LOCAL PROFILE FIRST
========================================= */

function loadLocalProfile(){

    const profile =
        getLocalProfile();

    const localImage =
        getLocalProfileImage();


    if(profile){

        profileData =
            profile;

        fillProfileForm(
            profile
        );

        updateProfileView(
            profile
        );

    }


    if(localImage){

        selectedProfilePicture =
            localImage;

        applyProfilePicture(
            localImage
        );

    }

}


/* =========================================
   FILL PROFILE FORM
========================================= */

function fillProfileForm(profile){

    if(!profile){

        return;

    }


    const name =
        profile.name ||
        profile.displayName ||
        "";

    const username =
        profile.username ||
        "";


    if($("displayName")){

        $("displayName").value =
            name;

    }


    if($("username")){

        $("username").value =
            username
                ? "@" + String(username)
                    .replace(/^@/,"")
                : "";

    }


    if($("bio")){

        $("bio").value =
            profile.bio ||
            "";

    }


    const image =
        getProfileImage(profile);

    if(image){

        selectedProfilePicture =
            image;

        applyProfilePicture(
            image
        );

    }

}


/* =========================================
   UPDATE PROFILE VIEW
========================================= */

function updateProfileView(profile){

    if(!profile){

        return;

    }


    const name =
        profile.name ||
        "Canvas Creator";


    const username =
        profile.username ||
        "";


    const bio =
        profile.bio ||
        "";


    if($("profileName")){

        $("profileName").textContent =
            name;

    }


    if($("profileUsername")){

        $("profileUsername").textContent =
            username
                ? "@" + String(username)
                    .replace(/^@/,"")
                : "@username";

    }


    if($("profileBio")){

        $("profileBio").textContent =
            bio ||
            "No bio yet.";

    }


    if($("accountEmail")){

        $("accountEmail").textContent =
            profile.email ||
            "Not available";

    }


    const image =
        getProfileImage(profile);


    if(image){

        applyProfilePicture(
            image
        );

    }

}


/* =========================================
   GET CURRENT USER
========================================= */

async function loadCurrentUser(){

    const token =
        getAuthToken();

    if(!token){

        return null;

    }


    try{

        const response =
            await fetch(
                API_BASE + "/api/me",
                {
                    method:"GET",
                    headers:authHeaders()
                }
            );


        const data =
            await readResponse(
                response
            );


        if(!response.ok){

            return null;

        }


        return data.user ||
            null;

    }catch(error){

        console.warn(
            "Current user request failed:",
            error
        );

        return null;

    }

}


/* =========================================
   LOAD PROFILE FROM SERVER
========================================= */

async function loadProfile(){

    if(!requireLogin()){

        return;

    }


    loadLocalProfile();


    try{

        const response =
            await fetch(
                API_BASE + "/api/profile",
                {
                    method:"GET",
                    headers:authHeaders()
                }
            );


        const data =
            await readResponse(
                response
            );


        if(
            response.status === 401
        ){

            handleExpiredLogin();

            return;

        }


        if(
            !response.ok ||
            !data.profile
        ){

            const currentUser =
                await loadCurrentUser();

            if(currentUser){

                const local =
                    getLocalProfile() || {};

                const combined = {

                    ...local,

                    ...currentUser

                };

                profileData =
                    combined;

                saveProfileLocally(
                    combined
                );

                fillProfileForm(
                    combined
                );

                updateProfileView(
                    combined
                );

            }

            showCreateProfile();

            return;

        }


        const profile =
            data.profile;


        profileData =
            profile;


        const image =
            getProfileImage(
                profile
            );


        if(image){

            selectedProfilePicture =
                image;

            saveProfileImageLocally(
                image
            );

        }else{

            selectedProfilePicture =
                "";

            saveProfileImageLocally(
                ""
            );

        }


        saveProfileLocally(
            profile
        );


        fillProfileForm(
            profile
        );

        updateProfileView(
            profile
        );


        showProfileView();

    }catch(error){

        console.warn(
            "Profile loading failed:",
            error
        );

        const local =
            getLocalProfile();

        if(local){

            fillProfileForm(
                local
            );

            updateProfileView(
                local
            );

            showProfileView();

        }else{

            showCreateProfile();

        }

    }

}


/* =========================================
   SHOW CREATE PROFILE
========================================= */

function showCreateProfile(){

    if($("createProfile")){

        $("createProfile").style.display =
            "block";

    }

    if($("profileView")){

        $("profileView").style.display =
            "none";

    }

}


/* =========================================
   SHOW PROFILE VIEW
========================================= */

function showProfileView(){

    if($("createProfile")){

        $("createProfile").style.display =
            "none";

    }

    if($("profileView")){

        $("profileView").style.display =
            "block";

    }

}
<script>

/* =========================================
   PROFILE PHOTO
========================================= */

const profilePhotoInput =
    $("profilePhotoInput");

if(profilePhotoInput){

    profilePhotoInput.addEventListener(
        "change",
        function(event){

            const file =
                event.target.files &&
                event.target.files[0];

            if(!file){
                return;
            }

            if(!file.type.startsWith("image/")){

                alert("Please choose an image file.");

                profilePhotoInput.value = "";

                return;
            }

            /*
             * Keep mobile uploads reasonable in size.
             * This also prevents huge camera photos from
             * exceeding the backend JSON limit.
             */

            const reader =
                new FileReader();

            reader.onload = function(e){

                const image =
                    new Image();

                image.onload = function(){

                    const maxSize = 1200;

                    let width =
                        image.width;

                    let height =
                        image.height;

                    if(
                        width > maxSize ||
                        height > maxSize
                    ){

                        if(width >= height){

                            height =
                                Math.round(
                                    height *
                                    maxSize /
                                    width
                                );

                            width =
                                maxSize;

                        }else{

                            width =
                                Math.round(
                                    width *
                                    maxSize /
                                    height
                                );

                            height =
                                maxSize;

                        }

                    }

                    const canvas =
                        document.createElement(
                            "canvas"
                        );

                    canvas.width =
                        width;

                    canvas.height =
                        height;

                    const ctx =
                        canvas.getContext(
                            "2d"
                        );

                    ctx.drawImage(
                        image,
                        0,
                        0,
                        width,
                        height
                    );

                    selectedProfilePicture =
                        canvas.toDataURL(
                            "image/jpeg",
                            0.90
                        );

                    saveLocalProfileImage(
                        selectedProfilePicture
                    );

                    applyProfilePicture(
                        selectedProfilePicture
                    );

                    /*
                     * The new picture is kept in the
                     * selected state until Save Profile.
                     */

                    if($("deletePhotoBtn")){

                        $("deletePhotoBtn").style.display =
                            "inline-flex";

                    }
                };

                image.onerror = function(){

                    alert(
                        "Unable to load this image."
                    );

                    profilePhotoInput.value = "";
                };

                image.src =
                    e.target.result;
            };

            reader.onerror = function(){

                alert(
                    "Unable to read this image."
                );

                profilePhotoInput.value = "";
            };

            reader.readAsDataURL(file);
        }
    );
}


/* =========================================
   DELETE PROFILE PHOTO
========================================= */

async function deleteProfilePhoto(){

    if(deletingProfilePicture){
        return;
    }

    const confirmed =
        confirm(
            "Delete your profile picture?"
        );

    if(!confirmed){
        return;
    }

    deletingProfilePicture = true;

    const deleteButton =
        $("deletePhotoBtn");

    if(deleteButton){

        deleteButton.disabled = true;

        deleteButton.textContent =
            "Deleting...";
    }

    try{

        const token =
            getAuthToken();

        /*
         * If there is only a locally selected image
         * that has not been saved yet, remove it locally.
         */

        const savedImage =
            readLocalProfileImage();

        const currentServerImage =
            getProfileImage(profileData);

        if(
            selectedProfilePicture &&
            selectedProfilePicture ===
                savedImage &&
            !currentServerImage
        ){

            selectedProfilePicture = "";

            saveLocalProfileImage("");

            applyProfilePicture("");

            if(profilePhotoInput){
                profilePhotoInput.value = "";
            }

            return;
        }

        const response =
            await fetch(
                API_BASE +
                "/api/profile/picture",
                {
                    method: "DELETE",
                    headers: authHeaders()
                }
            );

        const data =
            await readResponse(response);

        if(!response.ok){

            if(response.status === 401){

                alert(
                    "Your session has expired. Please log in again."
                );

                requireLogin();

                return;
            }

            throw new Error(
                data.message ||
                "Unable to delete profile picture."
            );
        }

        selectedProfilePicture = "";

        saveLocalProfileImage("");

        if(profileData){

            profileData.profile_picture = "";
            profileData.profilePicture = "";
            profileData.profile_picture_url = "";
            profileData.avatar = "";
            profileData.photo = "";
            profileData.image = "";
        }

        applyProfilePicture("");

        if(profilePhotoInput){

            profilePhotoInput.value = "";
        }

        alert(
            data.message ||
            "Profile picture deleted."
        );

    }catch(error){

        console.error(
            "Delete profile picture error:",
            error
        );

        alert(
            error.message ||
            "Unable to delete profile picture."
        );

    }finally{

        deletingProfilePicture = false;

        if(deleteButton){

            deleteButton.disabled = false;

            deleteButton.textContent =
                "Delete Photo";

            deleteButton.style.display =
                (
                    selectedProfilePicture ||
                    getProfileImage(profileData)
                )
                    ? "inline-flex"
                    : "none";
        }
    }
}


/* =========================================
   SAVE PROFILE
========================================= */

async function saveProfile(){

    if(savingProfile){
        return;
    }

    const nameInput =
        $("profileName");

    const usernameInput =
        $("profileUsername");

    const bioInput =
        $("profileBio");

    const name =
        nameInput
            ? nameInput.value.trim()
            : "";

    let username =
        usernameInput
            ? usernameInput.value.trim()
            : "";

    const bio =
        bioInput
            ? bioInput.value.trim()
            : "";

    /*
     * Users can type @username, but the database
     * stores the username without @.
     */

    username =
        username.replace(/^@+/, "");

    if(!name){

        alert(
            "Please enter your name."
        );

        if(nameInput){
            nameInput.focus();
        }

        return;
    }

    if(!username){

        alert(
            "Please enter a username."
        );

        if(usernameInput){
            usernameInput.focus();
        }

        return;
    }

    /*
     * Keep usernames clean and safe.
     */

    if(!/^[a-zA-Z0-9._-]+$/.test(username)){

        alert(
            "Username can only contain letters, numbers, dots, underscores and hyphens."
        );

        if(usernameInput){
            usernameInput.focus();
        }

        return;
    }

    savingProfile = true;

    const saveButton =
        $("saveProfileBtn");

    if(saveButton){

        saveButton.disabled = true;

        saveButton.textContent =
            "Saving...";
    }

    try{

        const token =
            getAuthToken();

        if(!token){

            alert(
                "Please log in first."
            );

            requireLogin();

            return;
        }

        /*
         * If the user selected a new picture,
         * send that picture to the backend.
         *
         * Otherwise keep the existing server picture.
         */

        let profilePicture =
            selectedProfilePicture;

        if(!profilePicture){

            profilePicture =
                getProfileImage(profileData) ||
                "";
        }

        const response =
            await fetch(
                API_BASE +
                "/api/profile",
                {
                    method: "PUT",
                    headers: {
                        ...authHeaders(),
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({

                        name:
                            name,

                        username:
                            username,

                        bio:
                            bio,

                        profile_picture:
                            profilePicture
                    })
                }
            );

        const data =
            await readResponse(response);

        if(!response.ok){

            if(response.status === 401){

                alert(
                    "Your session has expired. Please log in again."
                );

                requireLogin();

                return;
            }

            throw new Error(
                data.message ||
                "Unable to save profile."
            );
        }

        /*
         * Server normally returns the updated
         * user object.
         */

        const updatedProfile =
            data.user ||
            data.profile ||
            data.data ||
            {
                ...(profileData || {}),
                name:
                    name,
                username:
                    username,
                bio:
                    bio,
                profile_picture:
                    profilePicture
            };

        profileData =
            {
                ...(profileData || {}),
                ...updatedProfile,
                name:
                    updatedProfile.name ||
                    name,
                username:
                    updatedProfile.username ||
                    username,
                bio:
                    updatedProfile.bio ||
                    bio
            };

        if(profilePicture){

            profileData.profile_picture =
                profilePicture;

            saveLocalProfileImage(
                profilePicture
            );

        }else{

            profileData.profile_picture =
                "";
        }

        saveLocalProfile(
            profileData
        );

        applyProfilePicture(
            getProfileImage(profileData)
        );

        updateProfileView(
            profileData
        );

        fillProfileForm(
            profileData
        );

        showProfileView();

        alert(
            data.message ||
            "Profile saved successfully."
        );

    }catch(error){

        console.error(
            "Save profile error:",
            error
        );

        alert(
            error.message ||
            "Unable to save profile."
        );

    }finally{

        savingProfile = false;

        if(saveButton){

            saveButton.disabled = false;

            saveButton.textContent =
                "Save Profile";
        }
    }
}


/* =========================================
   EDIT PROFILE
========================================= */

function editProfile(){

    fillProfileForm(
        profileData
    );

    showCreateProfile();

    const heading =
        $("profileFormTitle");

    if(heading){

        heading.textContent =
            "Edit Profile";
    }

    const saveButton =
        $("saveProfileBtn");

    if(saveButton){

        saveButton.textContent =
            "Save Profile";
    }

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================================
   PASSWORD SECTION
========================================= */

function togglePasswordSection(){

    const section =
        $("passwordSection");

    if(!section){
        return;
    }

    const isHidden =
        section.style.display === "none" ||
        getComputedStyle(section).display ===
            "none";

    section.style.display =
        isHidden
            ? "block"
            : "none";

    if(isHidden){

        const currentPassword =
            $("currentPassword");

        if(currentPassword){

            setTimeout(
                function(){

                    currentPassword.focus();

                },
                100
            );
        }
    }
}


/* =========================================
   CHANGE PASSWORD
========================================= */

async function changePassword(){

    if(changingPassword){
        return;
    }

    const currentInput =
        $("currentPassword");

    const newInput =
        $("newPassword");

    const confirmInput =
        $("confirmPassword");

    const currentPassword =
        currentInput
            ? currentInput.value
            : "";

    const newPassword =
        newInput
            ? newInput.value
            : "";

    const confirmPassword =
        confirmInput
            ? confirmInput.value
            : "";

    if(!currentPassword){

        alert(
            "Enter your current password."
        );

        if(currentInput){
            currentInput.focus();
        }

        return;
    }

    if(!newPassword){

        alert(
            "Enter your new password."
        );

        if(newInput){
            newInput.focus();
        }

        return;
    }

    if(newPassword.length < 6){

        alert(
            "New password must be at least 6 characters."
        );

        if(newInput){
            newInput.focus();
        }

        return;
    }

    if(newPassword !== confirmPassword){

        alert(
            "New passwords do not match."
        );

        if(confirmInput){
            confirmInput.focus();
        }

        return;
    }

    changingPassword = true;

    const button =
        $("changePasswordBtn");

    if(button){

        button.disabled = true;

        button.textContent =
            "Changing...";
    }

    try{

        const response =
            await fetch(
                API_BASE +
                "/api/change-password",
                {
                    method: "PUT",
                    headers: {
                        ...authHeaders(),
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({

                        currentPassword:
                            currentPassword,

                        newPassword:
                            newPassword
                    })
                }
            );

        const data =
            await readResponse(response);

        if(!response.ok){

            if(response.status === 401){

                alert(
                    "Your session has expired. Please log in again."
                );

                requireLogin();

                return;
            }

            throw new Error(
                data.message ||
                "Unable to change password."
            );
        }

        if(currentInput){
            currentInput.value = "";
        }

        if(newInput){
            newInput.value = "";
        }

        if(confirmInput){
            confirmInput.value = "";
        }

        alert(
            data.message ||
            "Password changed successfully."
        );

        const section =
            $("passwordSection");

        if(section){

            section.style.display =
                "none";
        }

    }catch(error){

        console.error(
            "Change password error:",
            error
        );

        alert(
            error.message ||
            "Unable to change password."
        );

    }finally{

        changingPassword = false;

        if(button){

            button.disabled = false;

            button.textContent =
                "Change Password";
        }
    }
}

</script>
<script>

/* =========================================
   LOG OUT
========================================= */

async function logout(){

    const confirmed =
        confirm(
            "Are you sure you want to log out?"
        );

    if(!confirmed){
        return;
    }

    try{

        const token =
            getAuthToken();

        /*
         * Tell the backend about the logout.
         * Even if this request fails, we still
         * clear the local session.
         */

        if(token){

            try{

                await fetch(
                    API_BASE +
                    "/api/logout",
                    {
                        method: "POST",
                        headers: authHeaders()
                    }
                );

            }catch(error){

                console.warn(
                    "Logout request failed:",
                    error
                );
            }
        }

    }finally{

        /*
         * Remove authentication only.
         *
         * The profile image is also removed so the
         * next account/device cannot accidentally
         * display the previous user's picture.
         */

        localStorage.removeItem(
            AUTH_KEY
        );

        localStorage.removeItem(
            "authToken"
        );

        localStorage.removeItem(
            "token"
        );

        localStorage.removeItem(
            PROFILE_KEY
        );

        localStorage.removeItem(
            "canvasProfilePicture"
        );

        localStorage.removeItem(
            "profilePicture"
        );

        profileData = null;

        selectedProfilePicture = "";

        window.location.href =
            "login.html";
    }
}


/* =========================================
   BACK TO PROFILE VIEW
========================================= */

function cancelEdit(){

    fillProfileForm(
        profileData
    );

    showProfileView();

    const heading =
        $("profileFormTitle");

    if(heading){

        heading.textContent =
            "Your Profile";
    }
}


/* =========================================
   PROFILE PICTURE SYNC
========================================= */

function syncProfilePicture(){

    const image =
        readLocalProfileImage();

    if(image){

        applyProfilePicture(
            image
        );

    }else{

        applyProfilePicture(
            getProfileImage(profileData)
        );
    }
}


/* =========================================
   STORAGE SYNC
========================================= */

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key ===
            "canvasProfilePicture" ||
            event.key ===
            "profilePicture"
        ){

            syncProfilePicture();
        }

        if(
            event.key ===
            PROFILE_KEY
        ){

            loadLocalProfile();

            if(profileData){

                fillProfileForm(
                    profileData
                );

                updateProfileView(
                    profileData
                );
            }
        }
    }
);


/* =========================================
   BUTTON EVENT SETUP
========================================= */

function setupProfileEvents(){

    const saveButton =
        $("saveProfileBtn");

    if(saveButton){

        saveButton.addEventListener(
            "click",
            saveProfile
        );
    }


    const deleteButton =
        $("deletePhotoBtn");

    if(deleteButton){

        deleteButton.addEventListener(
            "click",
            deleteProfilePhoto
        );
    }


    const editButton =
        $("editProfileBtn");

    if(editButton){

        editButton.addEventListener(
            "click",
            editProfile
        );
    }


    const passwordButton =
        $("changePasswordOpenBtn");

    if(passwordButton){

        passwordButton.addEventListener(
            "click",
            togglePasswordSection
        );
    }


    const changePasswordButton =
        $("changePasswordBtn");

    if(changePasswordButton){

        changePasswordButton.addEventListener(
            "click",
            changePassword
        );
    }


    const logoutButton =
        $("logoutBtn");

    if(logoutButton){

        logoutButton.addEventListener(
            "click",
            logout
        );
    }


    const cancelButton =
        $("cancelEditBtn");

    if(cancelButton){

        cancelButton.addEventListener(
            "click",
            cancelEdit
        );
    }


    /*
     * Back arrow.
     */

    const backButton =
        $("profileBackBtn");

    if(backButton){

        backButton.addEventListener(
            "click",
            function(){

                if(
                    $("profileView") &&
                    $("profileView").style.display !==
                        "none"
                ){

                    window.history.back();

                }else{

                    cancelEdit();
                }
            }
        );
    }
}


/* =========================================
   PASSWORD ENTER KEY
========================================= */

function setupPasswordEnter(){

    [
        $("currentPassword"),
        $("newPassword"),
        $("confirmPassword")
    ].forEach(
        function(input){

            if(!input){
                return;
            }

            input.addEventListener(
                "keydown",
                function(event){

                    if(
                        event.key ===
                        "Enter"
                    ){

                        event.preventDefault();

                        changePassword();
                    }
                }
            );
        }
    );
}


/* =========================================
   USERNAME CLEANUP
========================================= */

const usernameInput =
    $("profileUsername");

if(usernameInput){

    usernameInput.addEventListener(
        "input",
        function(){

            this.value =
                this.value
                    .replace(/\s+/g, "")
                    .replace(/^@+/, "");
        }
    );
}


/* =========================================
   INITIAL LOAD
========================================= */

async function initializeProfile(){

    /*
     * Do not allow an unauthenticated user to
     * access the profile page.
     */

    if(!getAuthToken()){

        window.location.href =
            "login.html";

        return;
    }

    /*
     * Load cached information immediately so
     * the page feels instant.
     */

    loadLocalProfile();

    if(profileData){

        fillProfileForm(
            profileData
        );

        updateProfileView(
            profileData
        );
    }

    syncProfilePicture();

    setupProfileEvents();

    setupPasswordEnter();

    /*
     * Then fetch the real profile from the
     * backend so the account stays synchronized
     * across phones and browsers.
     */

    await loadProfile();

    syncProfilePicture();
}


/* =========================================
   START PROFILE
========================================= */

if(
    document.readyState ===
    "loading"
){

    document.addEventListener(
        "DOMContentLoaded",
        initializeProfile
    );

}else{

    initializeProfile();
}

</script>
