<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Canvas Profile</title>

<style>

/* =========================================
   CANVAS PROFILE PAGE
========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #ffffff;
    color: #4b3326;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    min-height: 100vh;

    padding-bottom: 90px;
}


/* =========================================
   HEADER
========================================= */

.navbar {
    width: 100%;
    height: 72px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 22px;

    background: #ffffff;

    border-bottom: 1px solid #eeeeee;
}

.logo {
    font-size: 34px;
    font-weight: 800;

    color: #6F4E37;
}

.back {
    width: 40px;
    height: 40px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #6F4E37;

    font-size: 34px;

    text-decoration: none;
}

.header-space {
    width: 40px;
}


/* =========================================
   PROFILE CONTAINER
========================================= */

.profile-container {
    width: 100%;
    max-width: 650px;

    margin: 0 auto;

    padding: 30px 22px 110px;
}


/* =========================================
   TITLES
========================================= */

.profile-title {
    font-size: 30px;

    font-weight: 800;

    color: #4b3326;

    margin-bottom: 8px;
}

.profile-subtitle {
    color: #777777;

    font-size: 16px;

    line-height: 1.5;

    margin-bottom: 30px;
}


/* =========================================
   AVATAR
========================================= */

.avatar-section {
    text-align: center;

    margin-bottom: 30px;
}

.avatar {
    width: 110px;
    height: 110px;

    margin: 0 auto;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    overflow: hidden;

    background: #f1f1f1;

    border: 3px solid #D4A017;

    color: #6F4E37;

    font-size: 48px;
}

.avatar img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
}


/* =========================================
   PHOTO BUTTONS
========================================= */

.photo-actions {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 18px;

    margin-top: 12px;
}

.photo-button {
    color: #6F4E37;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;
}

.delete-photo-button {
    border: none;

    background: none;

    color: #b44a3c;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;

    display: none;
}

.delete-photo-button:active,
.photo-button:active {
    transform: scale(0.97);
}

#photoInput {
    display: none;
}


/* =========================================
   FORM
========================================= */

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;

    margin-bottom: 8px;

    color: #4b3326;

    font-size: 15px;

    font-weight: 700;
}

.form-group input,
.form-group textarea {
    width: 100%;

    padding: 14px;

    border: 1px solid #dddddd;

    border-radius: 12px;

    background: #fafafa;

    color: #333333;

    font-size: 16px;

    outline: none;
}

.form-group input:focus,
.form-group textarea:focus {
    border-color: #D4A017;

    background: #ffffff;
}

.form-group textarea {
    height: 100px;

    resize: none;
}


/* =========================================
   SAVE BUTTON
========================================= */

.save-button {
    width: 100%;

    padding: 15px;

    border: none;

    border-radius: 12px;

    background: #6F4E37;

    color: #ffffff;

    font-size: 17px;

    font-weight: 700;

    cursor: pointer;
}

.save-button:active {
    transform: scale(0.98);
}


/* =========================================
   PROFILE VIEW
========================================= */

#profileView {
    display: none;

    text-align: center;
}

.profile-name {
    margin-top: 18px;

    color: #4b3326;

    font-size: 28px;

    font-weight: 800;
}

.profile-username {
    margin-top: 5px;

    color: #777777;

    font-size: 18px;
}

.profile-bio {
    max-width: 400px;

    margin: 18px auto;

    color: #555555;

    font-size: 17px;

    line-height: 1.5;
}


/* =========================================
   STATS
========================================= */

.stats {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 60px;

    margin: 25px 0;

    padding-bottom: 25px;

    border-bottom: 1px solid #eeeeee;
}

.stat strong {
    display: block;

    color: #4b3326;

    font-size: 24px;
}

.stat span {
    display: block;

    margin-top: 5px;

    color: #777777;

    font-size: 15px;
}


/* =========================================
   ACCOUNT
========================================= */

.account-section {
    margin-top: 25px;

    padding-top: 0;

    text-align: left;
}

.account-title {
    margin-bottom: 20px;

    color: #4b3326;

    font-size: 28px;

    font-weight: 800;
}

.account-item {
    padding: 16px 0;

    border-bottom: 1px solid #eeeeee;
}

.account-label {
    margin-bottom: 6px;

    color: #777777;

    font-size: 14px;
}

.account-value {
    color: #333333;

    font-size: 17px;

    word-break: break-word;
}


/* =========================================
   PROFILE BUTTONS
========================================= */

.edit-button,
.password-button,
.logout-button {
    width: 100%;

    padding: 14px;

    margin-top: 12px;

    border-radius: 10px;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;
}

.edit-button {
    border: 1px solid #6F4E37;

    background: #ffffff;

    color: #6F4E37;
}

.password-button {
    border: 1px solid #D4A017;

    background: #ffffff;

    color: #6F4E37;
}

.logout-button {
    border: 1px solid #dddddd;

    background: #ffffff;

    color: #777777;
}


/* =========================================
   CHANGE PASSWORD
========================================= */

#passwordSection {
    display: none;

    margin-top: 25px;

    padding-top: 20px;

    border-top: 1px solid #eeeeee;

    text-align: left;
}

.password-title {
    margin-bottom: 18px;

    color: #4b3326;

    font-size: 20px;

    font-weight: 800;
}


/* =========================================
   BOTTOM NAVIGATION
========================================= */

.bottom-nav {
    position: fixed;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 75px;

    display: flex;

    align-items: center;
    justify-content: space-around;

    background: #ffffff;

    border-top: 2px solid #d4a62a;

    z-index: 1000;
}

.bottom-nav a {
    width: 25%;
    height: 100%;

    display: flex;

    flex: 1;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 4px;

    color: #8a6b58;

    font-size: 23px;

    line-height: 1;

    text-decoration: none;
}

.bottom-nav a span {
    display: block;

    color: inherit;

    font-size: 11px;

    font-weight: 700;

    line-height: 1;
}

.bottom-nav a.active {
    color: #4b3326;
}


/* =========================================
   BOTTOM PROFILE PHOTO
========================================= */

#bottomProfileImage {
    width: 23px;
    height: 23px;

    display: block;

    object-fit: cover;

    border-radius: 50%;

    border: 1.5px solid #d4a62a;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

    .navbar {
        height: 68px;

        padding: 0 16px;
    }

    .logo {
        font-size: 30px;
    }

    .profile-container {
        padding: 30px 22px 110px;
    }

    .profile-title {
        font-size: 28px;
    }

    .profile-name {
        font-size: 28px;
    }

    .stats {
        gap: 55px;
    }

    .bottom-nav {
        height: 70px;
    }

    .bottom-nav a {
        font-size: 23px;
    }

    .bottom-nav a span {
        font-size: 10px;
    }

    #bottomProfileImage {
        width: 23px;
        height: 23px;
    }

    .photo-actions {
        gap: 14px;
    }

}

</style>

</head>

<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="navbar">

    <a
        href="stream.html"
        class="back"
    >
        ‹
    </a>

    <div class="logo">
        Canvas
    </div>

    <div class="header-space"></div>

</header>


<!-- =========================================
     MAIN PROFILE
========================================= -->

<main class="profile-container">


<!-- =========================================
     CREATE / EDIT PROFILE
========================================= -->

<section id="createProfile">

    <h1
        class="profile-title"
        id="formTitle"
    >
        Create your profile
    </h1>

    <p
        class="profile-subtitle"
        id="formSubtitle"
    >
        Set up your Canvas profile and let people know who you are.
    </p>


    <!-- =====================================
         PROFILE PHOTO
    ====================================== -->

    <div class="avatar-section">

        <div
            class="avatar"
            id="avatarPreview"
        >
            ⬤
        </div>


        <div class="photo-actions">

            <label
                class="photo-button"
                for="photoInput"
            >
                Choose profile picture
            </label>


            <button
                type="button"
                class="delete-photo-button"
                id="deletePhotoButton"
                onclick="deleteProfilePhoto()"
            >
                Delete picture
            </button>

        </div>


        <input
            type="file"
            id="photoInput"
            accept="image/*"
        >

    </div>


    <!-- =====================================
         DISPLAY NAME
    ====================================== -->

    <div class="form-group">

        <label for="displayName">
            Display name
        </label>

        <input
            type="text"
            id="displayName"
            placeholder="Your name"
            maxlength="30"
        >

    </div>


    <!-- =====================================
         USERNAME
    ====================================== -->

    <div class="form-group">

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            placeholder="@username"
            maxlength="20"
        >

    </div>


    <!-- =====================================
         BIO
    ====================================== -->

    <div class="form-group">

        <label for="bio">
            Bio
        </label>

        <textarea
            id="bio"
            placeholder="Tell people about yourself..."
            maxlength="150"
        ></textarea>

    </div>


    <button
        type="button"
        class="save-button"
        onclick="saveProfile()"
    >
        Save Profile
    </button>

</section>


<!-- =========================================
     PROFILE VIEW
========================================= -->

<section id="profileView">

    <div
        class="avatar"
        id="profileAvatar"
    >
        ⬤
    </div>


    <h1
        class="profile-name"
        id="profileName"
    >
        Canvas Creator
    </h1>


    <p
        class="profile-username"
        id="profileUsername"
    >
        @username
    </p>


    <p
        class="profile-bio"
        id="profileBio"
    >
        No bio yet.
    </p>


    <!-- =====================================
         STATS
    ====================================== -->

    <div class="stats">

        <div class="stat">

            <strong id="followersCount">
                0
            </strong>

            <span>
                Followers
            </span>

        </div>


        <div class="stat">

            <strong id="followingCount">
                0
            </strong>

            <span>
                Following
            </span>

        </div>

    </div>


    <!-- =====================================
         ACCOUNT
    ====================================== -->

    <section class="account-section">

        <h2 class="account-title">
            Account
        </h2>


        <div class="account-item">

            <div class="account-label">
                Email
            </div>

            <div
                class="account-value"
                id="accountEmail"
            >
                Not available
            </div>

        </div>


        <div class="account-item">

            <div class="account-label">
                Password
            </div>

            <div class="account-value">
                ••••••••
            </div>

        </div>


        <button
            type="button"
            class="edit-button"
            onclick="editProfile()"
        >
            Edit Profile
        </button>


        <button
            type="button"
            class="password-button"
            onclick="togglePasswordSection()"
        >
            Change Password
        </button>


        <button
            type="button"
            class="logout-button"
            onclick="logout()"
        >
            Log Out
        </button>


        <!-- =================================
             CHANGE PASSWORD
        ================================== -->

        <div id="passwordSection">

            <h2 class="password-title">
                Change Password
            </h2>


            <div class="form-group">

                <label for="currentPassword">
                    Current password
                </label>

                <input
                    type="password"
                    id="currentPassword"
                    placeholder="Current password"
                >

            </div>


            <div class="form-group">

                <label for="newPassword">
                    New password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="New password"
                    minlength="8"
                >

            </div>


            <div class="form-group">

                <label for="confirmNewPassword">
                    Confirm new password
                </label>

                <input
                    type="password"
                    id="confirmNewPassword"
                    placeholder="Confirm new password"
                    minlength="8"
                >

            </div>


            <button
                type="button"
                class="save-button"
                onclick="changePassword()"
            >
                Save New Password
            </button>

        </div>

    </section>

</section>

  </main>
  <!-- =========================================
     BOTTOM NAVIGATION
========================================= -->

<nav class="bottom-nav">

    <!-- HOME -->

    <a href="stream.html">

        ⌂

        <span>
            Home
        </span>

    </a>


    <!-- STREAM -->

    <a href="stream.html">

        ▣

        <span>
            Stream
        </span>

    </a>


    <!-- GO LIVE -->

    <a href="golive.html">

        ⊙

        <span>
            Go Live
        </span>

    </a>


    <!-- PROFILE -->

    <a
        href="profile.html"
        class="active"
    >

        <span id="bottomProfileIcon">
            ⬤
        </span>

        <span>
            Profile
        </span>

    </a>

</nav>


<!-- =========================================
     JAVASCRIPT
========================================= -->

<script>

/* =========================================
   PROFILE DATA
========================================= */

let selectedPhoto = "";


/* =========================================
   GET SAVED PROFILE
========================================= */

function getSavedProfile() {

    const savedProfile =
        localStorage.getItem("canvasProfile");

    if (!savedProfile) {
        return null;
    }

    try {

        return JSON.parse(savedProfile);

    }

    catch (error) {

        console.error(
            "Could not read Canvas profile.",
            error
        );

        return null;
    }
}


/* =========================================
   PAGE LOAD
========================================= */

window.addEventListener(
    "DOMContentLoaded",
    function () {

        const profile =
            getSavedProfile();

        if (profile) {

            showProfile(profile);

        }

        else {

            showCreateProfile();

        }

    }
);


/* =========================================
   SHOW CREATE PROFILE
========================================= */

function showCreateProfile() {

    document
        .getElementById("profileView")
        .style.display = "none";

    document
        .getElementById("createProfile")
        .style.display = "block";

    document
        .getElementById("formTitle")
        .textContent =
        "Create your profile";

    document
        .getElementById("formSubtitle")
        .textContent =
        "Set up your Canvas profile and let people know who you are.";

    selectedPhoto = "";

    updatePhotoControls();

}


/* =========================================
   PHOTO SELECT
========================================= */

document
    .getElementById("photoInput")
    .addEventListener(
        "change",
        function () {

            const file =
                this.files[0];

            if (!file) {
                return;
            }


            if (!file.type.startsWith("image/")) {

                alert(
                    "Please choose an image file."
                );

                this.value = "";

                return;
            }


            const reader =
                new FileReader();


            reader.onload =
                function (event) {

                    selectedPhoto =
                        event.target.result;


                    renderEditAvatar();

                    updatePhotoControls();

                };


            reader.readAsDataURL(file);

        }
    );


/* =========================================
   RENDER EDIT AVATAR
========================================= */

function renderEditAvatar() {

    const avatar =
        document.getElementById(
            "avatarPreview"
        );


    avatar.innerHTML = "";


    if (selectedPhoto) {

        const image =
            document.createElement("img");


        image.src =
            selectedPhoto;

        image.alt =
            "Profile picture";


        avatar.appendChild(
            image
        );

    }

    else {

        avatar.textContent =
            "⬤";

    }

}


/* =========================================
   UPDATE PHOTO CONTROLS
========================================= */

function updatePhotoControls() {

    const deleteButton =
        document.getElementById(
            "deletePhotoButton"
        );


    if (!deleteButton) {
        return;
    }


    if (selectedPhoto) {

        deleteButton.style.display =
            "inline-block";

    }

    else {

        deleteButton.style.display =
            "none";

    }

}


/* =========================================
   DELETE PROFILE PHOTO
========================================= */

function deleteProfilePhoto() {

    if (!selectedPhoto) {
        return;
    }


    const confirmed =
        confirm(
            "Delete your profile picture?"
        );


    if (!confirmed) {
        return;
    }


    /* Remove selected photo */

    selectedPhoto = "";


    /* Clear file input */

    const photoInput =
        document.getElementById(
            "photoInput"
        );


    if (photoInput) {
        photoInput.value = "";
    }


    /* Update avatar */

    renderEditAvatar();


    /* Hide delete button */

    updatePhotoControls();

}


/* =========================================
   SAVE PROFILE
========================================= */

function saveProfile() {

    const name =
        document
            .getElementById("displayName")
            .value
            .trim();


    const username =
        document
            .getElementById("username")
            .value
            .trim();


    const bio =
        document
            .getElementById("bio")
            .value
            .trim();


    if (name === "") {

        alert(
            "Please enter your display name."
        );

        return;
    }


    if (username === "") {

        alert(
            "Please choose a username."
        );

        return;
    }


    let finalUsername =
        username;


    if (!finalUsername.startsWith("@")) {

        finalUsername =
            "@" + finalUsername;

    }


    /* =====================================
       PROFILE PHOTO
    ===================================== */

    const profile = {

        name: name,

        username: finalUsername,

        bio: bio,

        photo: selectedPhoto || ""

    };


    /* =====================================
       SAVE PROFILE
    ===================================== */

    localStorage.setItem(
        "canvasProfile",
        JSON.stringify(profile)
    );


    /* =====================================
       SHOW PROFILE
    ===================================== */

    showProfile(profile);

}


/* =========================================
   SHOW PROFILE
========================================= */

function showProfile(profile) {

    if (!profile) {
        return;
    }


    document
        .getElementById("createProfile")
        .style.display = "none";


    document
        .getElementById("profileView")
        .style.display = "block";


    /* =====================================
       NAME
    ===================================== */

    document
        .getElementById("profileName")
        .textContent =
        profile.name ||
        "Canvas Creator";


    /* =====================================
       USERNAME
    ===================================== */

    document
        .getElementById("profileUsername")
        .textContent =
        profile.username ||
        "@username";


    /* =====================================
       BIO
    ===================================== */

    document
        .getElementById("profileBio")
        .textContent =
        profile.bio ||
        "No bio yet.";


    /* =====================================
       PROFILE PHOTO
    ===================================== */

    const avatar =
        document.getElementById(
            "profileAvatar"
        );


    avatar.innerHTML = "";


    if (profile.photo) {

        const image =
            document.createElement("img");


        image.src =
            profile.photo;

        image.alt =
            "Profile picture";


        avatar.appendChild(
            image
        );

    }

    else {

        avatar.textContent =
            "⬤";

    }


    /* =====================================
       ACCOUNT EMAIL
    ===================================== */

    const savedAccount =
        localStorage.getItem(
            "canvasAccount"
        );


    if (savedAccount) {

        try {

            const account =
                JSON.parse(savedAccount);


            document
                .getElementById("accountEmail")
                .textContent =
                account.email ||
                "Not available";

        }

        catch (error) {

            console.error(
                "Could not read account.",
                error
            );

        }

    }


    /* =====================================
       BOTTOM PROFILE ICON
    ===================================== */

    updateBottomProfileIcon(profile);

}


/* =========================================
   UPDATE BOTTOM PROFILE ICON
========================================= */

function updateBottomProfileIcon(profile) {

    const icon =
        document.getElementById(
            "bottomProfileIcon"
        );


    if (!icon) {
        return;
    }


    icon.innerHTML = "";


    if (profile && profile.photo) {

        const image =
            document.createElement("img");


        image.id =
            "bottomProfileImage";


        image.src =
            profile.photo;


        image.alt =
            "Profile";


        icon.appendChild(
            image
        );

    }

    else {

        icon.textContent =
            "⬤";

    }

}


/* =========================================
   EDIT PROFILE
========================================= */

function editProfile() {

    const profile =
        getSavedProfile();


    if (!profile) {
        return;
    }


    document
        .getElementById("profileView")
        .style.display = "none";


    document
        .getElementById("createProfile")
        .style.display = "block";


    document
        .getElementById("formTitle")
        .textContent =
        "Edit your profile";


    document
        .getElementById("formSubtitle")
        .textContent =
        "Update your Canvas profile information.";


    document
        .getElementById("displayName")
        .value =
        profile.name || "";


    document
        .getElementById("username")
        .value =
        profile.username || "";


    document
        .getElementById("bio")
        .value =
        profile.bio || "";


    /* =====================================
       KEEP CURRENT PHOTO
    ===================================== */

    selectedPhoto =
        profile.photo || "";


    renderEditAvatar();

    updatePhotoControls();

}
  /* =========================================
   CHANGE PASSWORD SECTION
========================================= */

function togglePasswordSection() {

    const section =
        document.getElementById(
            "passwordSection"
        );


    if (!section) {
        return;
    }


    if (
        section.style.display ===
        "block"
    ) {

        section.style.display =
            "none";

    }

    else {

        section.style.display =
            "block";

    }

}


/* =========================================
   CHANGE PASSWORD
========================================= */

function changePassword() {

    const currentPassword =
        document
            .getElementById(
                "currentPassword"
            )
            .value;


    const newPassword =
        document
            .getElementById(
                "newPassword"
            )
            .value;


    const confirmPassword =
        document
            .getElementById(
                "confirmNewPassword"
            )
            .value;


    const savedAccount =
        localStorage.getItem(
            "canvasAccount"
        );


    if (!savedAccount) {

        alert(
            "No Canvas account found."
        );

        return;
    }


    let account;


    try {

        account =
            JSON.parse(savedAccount);

    }

    catch (error) {

        alert(
            "Could not read Canvas account."
        );

        return;

    }


    if (
        currentPassword !==
        account.password
    ) {

        alert(
            "Current password is incorrect."
        );

        return;
    }


    if (
        newPassword.length < 8
    ) {

        alert(
            "New password must be at least 8 characters."
        );

        return;
    }


    if (
        newPassword !==
        confirmPassword
    ) {

        alert(
            "New passwords do not match."
        );

        return;
    }


    account.password =
        newPassword;


    localStorage.setItem(
        "canvasAccount",
        JSON.stringify(account)
    );


    alert(
        "Password changed successfully."
    );


    document
        .getElementById(
            "currentPassword"
        )
        .value = "";


    document
        .getElementById(
            "newPassword"
        )
        .value = "";


    document
        .getElementById(
            "confirmNewPassword"
        )
        .value = "";


    document
        .getElementById(
            "passwordSection"
        )
        .style.display = "none";

}


/* =========================================
   LOG OUT
========================================= */

function logout() {

    localStorage.removeItem(
        "canvasLoggedIn"
    );


    window.location.href =
        "login.html";

}

</script>
