<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Canvas Profile</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#fff;
color:#4b3326;
font-family:Arial,Helvetica,sans-serif;
min-height:100vh;
padding-bottom:90px;
}

.navbar{
height:72px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 22px;
border-bottom:1px solid #eee;
}

.logo{
font-size:34px;
font-weight:800;
color:#6F4E37;
}

.back{
width:40px;
height:40px;
display:flex;
align-items:center;
justify-content:center;
font-size:34px;
color:#6F4E37;
text-decoration:none;
}

.header-space{
width:40px;
}

.profile-container{
width:100%;
max-width:650px;
margin:auto;
padding:30px 22px 110px;
}

.profile-title{
font-size:30px;
font-weight:800;
margin-bottom:8px;
}

.profile-subtitle{
color:#777;
font-size:16px;
line-height:1.5;
margin-bottom:30px;
}


/* =========================================
   AVATAR
========================================= */

.avatar-section{
text-align:center;
margin-bottom:30px;
}

.avatar{
width:110px;
height:110px;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
overflow:hidden;
background:#f1f1f1;
border:3px solid #D4A017;
color:#6F4E37;
font-size:48px;
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}


/* =========================================
   PHOTO ACTIONS
   OLD PENCIL + BASKET
========================================= */

.photo-actions{
display:flex;
align-items:center;
justify-content:center;
gap:16px;
margin-top:10px;
}

.photo-button,
.delete-photo-button{
width:30px;
height:30px;
padding:0;
border:0;
background:none;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
opacity:.55;
transition:
opacity .15s ease,
transform .15s ease;
}

.photo-button:active,
.delete-photo-button:active{
transform:scale(.92);
}

.photo-button:hover,
.delete-photo-button:hover{
opacity:.8;
}

.photo-button svg,
.delete-photo-button svg{
width:20px;
height:20px;
display:block;
fill:none;
stroke:#6F4E37;
stroke-width:1.8;
stroke-linecap:round;
stroke-linejoin:round;
}

.delete-photo-button svg{
stroke:#8f3d32;
}

#photoInput{
display:none;
}


/* =========================================
   FORM
========================================= */

.form-group{
margin-bottom:20px;
}

.form-group label{
display:block;
margin-bottom:8px;
font-size:15px;
font-weight:700;
}

.form-group input,
.form-group textarea{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:12px;
background:#fafafa;
font-size:16px;
outline:none;
}

.form-group textarea{
height:100px;
resize:none;
}

.form-group input:focus,
.form-group textarea:focus{
border-color:#D4A017;
background:#fff;
}

.save-button{
width:100%;
padding:15px;
border:0;
border-radius:12px;
background:#6F4E37;
color:#fff;
font-size:17px;
font-weight:700;
cursor:pointer;
}

.save-button:disabled{
opacity:.6;
cursor:not-allowed;
}

#createProfile{
display:none;
}

#profileView{
display:none;
text-align:center;
}


/* =========================================
   PROFILE INFORMATION
========================================= */

.profile-name{
margin-top:18px;
font-size:28px;
font-weight:800;
}

.profile-username{
margin-top:5px;
color:#777;
font-size:18px;
}

.profile-bio{
max-width:400px;
margin:18px auto;
color:#555;
font-size:17px;
line-height:1.5;
}

.stats{
display:flex;
justify-content:center;
gap:60px;
margin:25px 0;
padding-bottom:25px;
border-bottom:1px solid #eee;
}

.stat strong{
display:block;
font-size:24px;
}

.stat span{
display:block;
margin-top:5px;
color:#777;
font-size:15px;
}


/* =========================================
   ACCOUNT
========================================= */

.account-section{
margin-top:25px;
text-align:left;
}

.account-title{
margin-bottom:20px;
font-size:28px;
font-weight:800;
}

.account-item{
padding:16px 0;
border-bottom:1px solid #eee;
}

.account-label{
margin-bottom:6px;
color:#777;
font-size:14px;
}

.account-value{
color:#333;
font-size:17px;
word-break:break-word;
}

.edit-button,
.password-button,
.logout-button{
width:100%;
padding:14px;
margin-top:12px;
border-radius:10px;
font-size:15px;
font-weight:700;
cursor:pointer;
}

.edit-button{
border:1px solid #6F4E37;
background:#fff;
color:#6F4E37;
}

.password-button{
border:1px solid #D4A017;
background:#fff;
color:#6F4E37;
}

.logout-button{
border:1px solid #ddd;
background:#fff;
color:#777;
}

#passwordSection{
display:none;
margin-top:25px;
padding-top:20px;
border-top:1px solid #eee;
}

.password-title{
margin-bottom:18px;
font-size:20px;
}


/* =========================================
   BOTTOM NAVIGATION
========================================= */

.bottom-nav{
position:fixed;
left:0;
bottom:0;
width:100%;
height:75px;
display:flex;
background:#fff;
border-top:2px solid #d4a62a;
z-index:1000;
}

.bottom-nav a{
flex:1;
height:100%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:4px;
color:#8a6b58;
font-size:23px;
text-decoration:none;
}

.bottom-nav a span{
font-size:11px;
font-weight:700;
}

.bottom-nav a.active{
color:#4b3326;
}


/* =========================================
   PROFILE ICON
========================================= */

#bottomProfileIcon{
width:23px;
height:23px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
border-radius:50%;
font-size:23px;
line-height:23px;
font-weight:400;
flex-shrink:0;
}

#bottomProfileIcon img{
width:23px;
height:23px;
object-fit:cover;
border-radius:50%;
display:block;
}

#bottomProfileImage{
width:23px;
height:23px;
object-fit:cover;
border-radius:50%;
border:1.5px solid #d4a62a;
display:block;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

.navbar{
height:68px;
padding:0 16px;
}

.logo{
font-size:30px;
}

.profile-container{
padding:30px 22px 110px;
}

.profile-title{
font-size:28px;
}

.stats{
gap:55px;
}

.bottom-nav{
height:70px;
}

}

</style>

</head>

  <script>

/* =========================================
   CANVAS PROFILE — BACKEND VERSION
========================================= */

const API =
    "https://canvas-kh9p.onrender.com";

let currentProfile = null;
let selectedPhoto = "";


/* =========================================
   AUTH TOKEN
========================================= */

function getAuthToken(){

    return String(
        localStorage.getItem("canvasAuthToken") || ""
    ).trim();

}


/* =========================================
   AUTH HEADERS
========================================= */

function authHeaders(){

    return {
        "Content-Type": "application/json",
        "Accept": "application/json",
        "Authorization":
            "Bearer " + getAuthToken()
    };

}


/* =========================================
   LOGIN CHECK
========================================= */

function requireLogin(){

    if(!getAuthToken()){

        window.location.href =
            "login.html";

        return false;
    }

    return true;
}


/* =========================================
   SHOW CREATE / EDIT
========================================= */

function showCreateProfile(){

    const create =
        document.getElementById("createProfile");

    const view =
        document.getElementById("profileView");

    if(create)
        create.style.display = "block";

    if(view)
        view.style.display = "none";
}


/* =========================================
   SHOW PROFILE
========================================= */

function showProfile(profile){

    currentProfile = profile;

    const create =
        document.getElementById("createProfile");

    const view =
        document.getElementById("profileView");

    if(create)
        create.style.display = "none";

    if(view)
        view.style.display = "block";


    document.getElementById(
        "profileName"
    ).textContent =
        profile.name || "Canvas Creator";


    let username =
        String(profile.username || "")
            .replace(/^@/, "");

    document.getElementById(
        "profileUsername"
    ).textContent =
        username
            ? "@" + username
            : "@username";


    document.getElementById(
        "profileBio"
    ).textContent =
        profile.bio || "No bio yet.";


    document.getElementById(
        "accountEmail"
    ).textContent =
        profile.email || "Not available";


    /* PROFILE PHOTO */

    const avatar =
        document.getElementById(
            "profileAvatar"
        );

    avatar.innerHTML = "";

    if(profile.photo){

        const img =
            document.createElement("img");

        img.src = profile.photo;
        img.alt = "Profile picture";

        avatar.appendChild(img);

    }else{

        avatar.textContent = "⬤";
    }


    updateBottomIcon(profile);
}

/* =========================================
   LOAD PROFILE — FAST VERSION
========================================= */

async function loadProfile(){

    if(!requireLogin())
        return;


    /*
     * SHOW LOCAL USER IMMEDIATELY
     * Do not wait for Render.
     */

    let localUser = null;

    try{

        const storedUser =
            localStorage.getItem(
                "canvasCurrentUser"
            );

        if(storedUser){

            localUser =
                JSON.parse(storedUser);

        }

    }catch(error){

        console.log(
            "Local user data unavailable."
        );

    }


    /*
     * If we already have local account data,
     * show the profile screen immediately.
     */

    if(localUser){

        const quickProfile = {

            id:
                localUser.id || "",

            name:
                localUser.name || "",

            username:
                localUser.username || "",

            email:
                localUser.email || "",

            bio:
                localUser.bio || "",

            photo:
                localUser.profile_picture ||
                localUser.photo ||
                ""

        };


        currentProfile =
            quickProfile;


        showProfile(
            quickProfile
        );

    }


    /*
     * BACKGROUND SYNC
     *
     * The profile is already visible.
     * Now contact Render without making
     * the user wait for it.
     */

    try{

        const token =
            getAuthToken();


        const profileResponse =
            await fetch(
                API + "/api/profile",
                {
                    method:"GET",

                    headers:{
                        "Accept":
                            "application/json",

                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        if(
            profileResponse.status === 401
        ){

            logout();
            return;

        }


        if(
            profileResponse.status === 404
        ){

            /*
             * Only show create profile
             * if we had no local profile.
             */

            if(!localUser){

                showCreateProfile();

            }

            return;

        }


        const profileData =
            await profileResponse.json();


        if(!profileResponse.ok){

            throw new Error(
                profileData.message ||
                "Unable to load profile."
            );

        }


        const p =
            profileData.profile;


        const profile = {

            id:
                p.id,

            name:
                p.name || "",

            username:
                p.username || "",

            email:
                p.email || "",

            bio:
                p.bio || "",

            photo:
                p.profile_picture || ""

        };


        /*
         * Update the screen with the
         * latest backend information.
         */

        showProfile(
            profile
        );


        /*
         * Keep local storage synchronized.
         */

        try{

            const existingUser =
                localUser || {};


            localStorage.setItem(
                "canvasCurrentUser",
                JSON.stringify({

                    ...existingUser,

                    id:
                        profile.id,

                    name:
                        profile.name,

                    username:
                        profile.username,

                    email:
                        profile.email,

                    bio:
                        profile.bio,

                    profile_picture:
                        profile.photo

                })
            );

        }catch(error){

            console.log(
                "Unable to update local profile cache."
            );

        }


    }catch(error){

        /*
         * IMPORTANT:
         *
         * Do NOT remove the already displayed
         * profile just because Render is slow.
         */

        console.error(
            "Background profile sync failed:",
            error
        );

    }

   }

    if(!requireLogin())
        return;

    const token =
        getAuthToken();

    try{

        /* GET USER */

        const meResponse =
            await fetch(
                API + "/api/me",
                {
                    method:"GET",
                    headers:{
                        "Accept":
                            "application/json",
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        if(meResponse.status === 401){

            logout();
            return;
        }


        const meData =
            await meResponse.json();


        if(!meResponse.ok){

            throw new Error(
                meData.message ||
                "Unable to load account."
            );
        }


        const user =
            meData.user;


        /* GET PROFILE */

        const profileResponse =
            await fetch(
                API + "/api/profile",
                {
                    method:"GET",
                    headers:{
                        "Accept":
                            "application/json",
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        if(profileResponse.status === 401){

            logout();
            return;
        }


        /* PROFILE DOES NOT EXIST */

        if(profileResponse.status === 404){

            showCreateProfile();

            document.getElementById(
                "displayName"
            ).value =
                user.name || "";


            document.getElementById(
                "username"
            ).value =
                user.username
                ? "@" + user.username.replace(/^@/,"")
                : "";


            return;
        }


        const profileData =
            await profileResponse.json();


        if(!profileResponse.ok){

            throw new Error(
                profileData.message ||
                "Unable to load profile."
            );
        }


        const p =
            profileData.profile;


        const profile = {

            id: p.id,

            name:
                p.name ||
                user.name ||
                "",

            username:
                p.username ||
                user.username ||
                "",

            email:
                p.email ||
                user.email ||
                "",

            bio:
                p.bio || "",

            photo:
                p.profile_picture || ""

        };


        showProfile(profile);

    }catch(error){

        console.error(
            "Profile loading failed:",
            error
        );

        alert(
            error.message ||
            "Unable to load your Canvas profile."
        );
    }
}


/* =========================================
   EDIT PROFILE
========================================= */

function editProfile(){

    if(!currentProfile){

        showCreateProfile();
        return;
    }


    document.getElementById(
        "profileView"
    ).style.display = "none";


    document.getElementById(
        "createProfile"
    ).style.display = "block";


    document.getElementById(
        "formTitle"
    ).textContent =
        "Edit your profile";


    document.getElementById(
        "formSubtitle"
    ).textContent =
        "Update your Canvas profile.";


    document.getElementById(
        "displayName"
    ).value =
        currentProfile.name || "";


    document.getElementById(
        "username"
    ).value =
        currentProfile.username || "";


    document.getElementById(
        "bio"
    ).value =
        currentProfile.bio || "";


    selectedPhoto =
        currentProfile.photo || "";


    showSelectedPhoto();
}


/* =========================================
   SHOW SELECTED PHOTO
========================================= */

function showSelectedPhoto(){

    const avatar =
        document.getElementById(
            "avatarPreview"
        );

    const deleteButton =
        document.getElementById(
            "deletePhotoButton"
        );


    avatar.innerHTML = "";


    if(selectedPhoto){

        const img =
            document.createElement("img");

        img.src = selectedPhoto;
        img.alt = "Profile picture";

        avatar.appendChild(img);

        if(deleteButton)
            deleteButton.style.display = "flex";

    }else{

        avatar.textContent = "⬤";

        if(deleteButton)
            deleteButton.style.display = "none";
    }
}


/* =========================================
   PHOTO SELECT
========================================= */

function handlePhotoSelection(event){

    const file =
        event.target.files &&
        event.target.files[0];

    if(!file)
        return;


    if(!file.type.startsWith("image/")){

        alert("Please choose an image.");

        event.target.value = "";

        return;
    }


    const reader =
        new FileReader();


    reader.onload = function(){

        selectedPhoto =
            reader.result;

        showSelectedPhoto();
    };


    reader.readAsDataURL(file);
}


/* =========================================
   OLD DELETE BUTTON
========================================= */

function deleteProfilePhoto(){

    selectedPhoto = "";

    const input =
        document.getElementById(
            "photoInput"
        );

    if(input)
        input.value = "";


    showSelectedPhoto();
}


/* =========================================
   SAVE PROFILE
========================================= */

async function saveProfile(){

    if(!requireLogin())
        return;


    const nameInput =
        document.getElementById(
            "displayName"
        );

    const usernameInput =
        document.getElementById(
            "username"
        );

    const bioInput =
        document.getElementById(
            "bio"
        );

    const saveButton =
        document.getElementById(
            "saveProfileButton"
        );


    const name =
        nameInput.value.trim();

    const username =
        usernameInput.value
            .trim()
            .replace(/^@+/,"");

    const bio =
        bioInput.value.trim();


    if(!name){

        alert(
            "Please enter your display name."
        );

        nameInput.focus();

        return;
    }


    if(!username){

        alert(
            "Please choose a username."
        );

        usernameInput.focus();

        return;
    }


    if(
        !/^[a-zA-Z0-9_.]+$/.test(username)
    ){

        alert(
            "Username can only contain letters, numbers, underscores and dots."
        );

        usernameInput.focus();

        return;
    }


    if(saveButton)
        saveButton.disabled = true;


    try{

        const response =
            await fetch(
                API + "/api/profile",
                {
                    method:"PUT",

                    headers:
                        authHeaders(),

                    body:
                        JSON.stringify({

                            name:
                                name,

                            username:
                                username,

                            bio:
                                bio,

                            profile_picture:
                                selectedPhoto || ""

                        })
                }
            );


        if(response.status === 401){

            logout();
            return;
        }


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Unable to save profile."
            );
        }


        const user =
            data.user;


        const profile = {

            id:
                user.id,

            name:
                user.name,

            username:
                user.username,

            email:
                user.email,

            bio:
                user.bio || "",

            photo:
                user.profile_picture || ""

        };


        currentProfile =
            profile;


        showProfile(profile);


        alert(
            "Profile updated successfully."
        );


    }catch(error){

        console.error(
            "Save profile failed:",
            error
        );

        alert(
            error.message ||
            "Unable to save profile."
        );

    }finally{

        if(saveButton)
            saveButton.disabled = false;
    }
}


/* =========================================
   BOTTOM PROFILE ICON
========================================= */

function updateBottomIcon(profile){

    const icon =
        document.getElementById(
            "bottomProfileIcon"
        );

    if(!icon)
        return;


    icon.innerHTML = "";


    if(
        profile &&
        profile.photo
    ){

        const img =
            document.createElement("img");

        img.id =
            "bottomProfileImage";

        img.src =
            profile.photo;

        img.alt =
            "Profile picture";

        icon.appendChild(img);

    }else{

        icon.textContent =
            "⬤";
    }
}


/* =========================================
   PASSWORD SECTION
========================================= */

function togglePasswordSection(){

    const box =
        document.getElementById(
            "passwordSection"
        );

    if(!box)
        return;


    if(box.style.display === "block"){

        box.style.display = "none";

    }else{

        box.style.display = "block";

        const current =
            document.getElementById(
                "currentPassword"
            );

        if(current)
            current.focus();
    }
}


/* =========================================
   CHANGE PASSWORD
   BACKEND VERSION
========================================= */

async function changePassword(){

    if(!requireLogin())
        return;


    const currentInput =
        document.getElementById(
            "currentPassword"
        );

    const newInput =
        document.getElementById(
            "newPassword"
        );

    const confirmInput =
        document.getElementById(
            "confirmNewPassword"
        );


    const current =
        currentInput.value;

    const newPassword =
        newInput.value;

    const confirm =
        confirmInput.value;


    if(!current || !newPassword){

        alert(
            "Please fill in all password fields."
        );

        return;
    }


    if(newPassword.length < 8){

        alert(
            "Password must be at least 8 characters."
        );

        return;
    }


    if(newPassword !== confirm){

        alert(
            "Passwords do not match."
        );

        return;
    }


    if(newPassword === current){

        alert(
            "New password must be different from your current password."
        );

        return;
    }


    try{

        const response =
            await fetch(
                API + "/api/change-password",
                {
                    method:"PUT",

                    headers:
                        authHeaders(),

                    body:
                        JSON.stringify({

                            currentPassword:
                                current,

                            newPassword:
                                newPassword

                        })
                }
            );


        if(response.status === 401){

            logout();
            return;
        }


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Unable to change password."
            );
        }


        currentInput.value = "";
        newInput.value = "";
        confirmInput.value = "";


        document.getElementById(
            "passwordSection"
        ).style.display = "none";


        alert(
            "Password changed successfully."
        );


    }catch(error){

        console.error(
            "Change password failed:",
            error
        );

        alert(
            error.message ||
            "Unable to change password."
        );
    }
}


/* =========================================
   LOGOUT
========================================= */

function logout(){

    localStorage.removeItem(
        "canvasAuthToken"
    );

    localStorage.removeItem(
        "canvasLoggedIn"
    );

    localStorage.removeItem(
        "canvasCurrentUser"
    );


    window.location.href =
        "login.html";
}


/* =========================================
   PHOTO INPUT
========================================= */

function setupPhotoInput(){

    const input =
        document.getElementById(
            "photoInput"
        );

    if(!input)
        return;


    input.addEventListener(
        "change",
        handlePhotoSelection
    );
}


/* =========================================
   INITIALIZE — FAST
========================================= */

function initializeProfilePage(){

    setupPhotoInput();


    const deleteButton =
        document.getElementById(
            "deletePhotoButton"
        );


    if(deleteButton)
        deleteButton.style.display = "none";


    /*
     * Do not block page rendering.
     *
     * loadProfile() immediately uses
     * localStorage and then syncs with
     * the backend in the background.
     */

    loadProfile();

}


if(
    document.readyState === "loading"
){

    document.addEventListener(
        "DOMContentLoaded",
        initializeProfilePage
    );

}else{

    initializeProfilePage();
}
