<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0">

<title>Canvas Profile</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#fff;
color:#4b3326;
font-family:Arial,Helvetica,sans-serif;
min-height:100vh;
padding-bottom:90px;
}


/* =========================================
   NAVBAR
========================================= */

.navbar{
height:72px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 22px;
border-bottom:1px solid #eee;
}

.logo{
font-size:34px;
font-weight:800;
color:#6F4E37;
}

.back{
width:40px;
height:40px;
display:flex;
align-items:center;
justify-content:center;
font-size:34px;
color:#6F4E37;
text-decoration:none;
}

.header-space{
width:40px;
}


/* =========================================
   CONTAINER
========================================= */

.profile-container{
width:100%;
max-width:650px;
margin:auto;
padding:30px 22px 110px;
}


/* =========================================
   CREATE / EDIT PROFILE
========================================= */

.profile-title{
font-size:30px;
font-weight:800;
margin-bottom:8px;
}

.profile-subtitle{
color:#777;
font-size:16px;
line-height:1.5;
margin-bottom:30px;
}


/* =========================================
   AVATAR
========================================= */

.avatar-section{
text-align:center;
margin-bottom:30px;
}

.avatar{
width:110px;
height:110px;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
overflow:hidden;
background:#f1f1f1;
border:3px solid #D4A017;
color:#6F4E37;
font-size:48px;
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}


/* =========================================
   PHOTO ACTIONS
========================================= */

.photo-actions{
display:flex;
align-items:center;
justify-content:center;
gap:16px;
margin-top:10px;
}

.photo-button,
.delete-photo-button{
width:30px;
height:30px;
padding:0;
border:0;
background:none;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
opacity:.55;
transition:opacity .15s ease,
transform .15s ease;
}

.photo-button:hover,
.delete-photo-button:hover{
opacity:.8;
}

.photo-button:active,
.delete-photo-button:active{
transform:scale(.92);
}

.photo-button svg,
.delete-photo-button svg{
width:20px;
height:20px;
display:block;
fill:none;
stroke:#6F4E37;
stroke-width:1.8;
stroke-linecap:round;
stroke-linejoin:round;
}

.delete-photo-button svg{
stroke:#8f3d32;
}

#photoInput{
display:none;
}


/* =========================================
   FORM
========================================= */

.form-group{
margin-bottom:20px;
}

.form-group label{
display:block;
margin-bottom:8px;
font-size:15px;
font-weight:700;
}

.form-group input,
.form-group textarea{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:12px;
background:#fafafa;
font-size:16px;
outline:none;
}

.form-group textarea{
height:100px;
resize:none;
}

.form-group input:focus,
.form-group textarea:focus{
border-color:#D4A017;
background:#fff;
}


/* =========================================
   SAVE BUTTON
========================================= */

.save-button{
width:100%;
padding:15px;
border:0;
border-radius:12px;
background:#6F4E37;
color:#fff;
font-size:17px;
font-weight:700;
cursor:pointer;
}

.save-button:disabled{
opacity:.6;
cursor:not-allowed;
}


/* =========================================
   VISIBILITY
========================================= */

#createProfile{
display:none;
}

#profileView{
display:none;
text-align:center;
}


/* =========================================
   PROFILE INFORMATION
========================================= */

.profile-name{
margin-top:18px;
font-size:28px;
font-weight:800;
}

.profile-username{
margin-top:5px;
color:#777;
font-size:18px;
}

.profile-bio{
max-width:400px;
margin:18px auto;
color:#555;
font-size:17px;
line-height:1.5;
}


/* =========================================
   STATS
========================================= */

.stats{
display:flex;
justify-content:center;
gap:60px;
margin:25px 0;
padding-bottom:25px;
border-bottom:1px solid #eee;
}

.stat strong{
display:block;
font-size:24px;
}

.stat span{
display:block;
margin-top:5px;
color:#777;
font-size:15px;
}


/* =========================================
   ACCOUNT
========================================= */

.account-section{
margin-top:25px;
text-align:left;
}

.account-title{
margin-bottom:20px;
font-size:28px;
font-weight:800;
}

.account-item{
padding:16px 0;
border-bottom:1px solid #eee;
}

.account-label{
margin-bottom:6px;
color:#777;
font-size:14px;
}

.account-value{
color:#333;
font-size:17px;
word-break:break-word;
}


/* =========================================
   ACCOUNT BUTTONS
========================================= */

.edit-button,
.password-button,
.logout-button{
width:100%;
padding:14px;
margin-top:12px;
border-radius:10px;
font-size:15px;
font-weight:700;
cursor:pointer;
}

.edit-button{
border:1px solid #6F4E37;
background:#fff;
color:#6F4E37;
}

.password-button{
border:1px solid #D4A017;
background:#fff;
color:#6F4E37;
}

.logout-button{
border:1px solid #ddd;
background:#fff;
color:#777;
}


/* =========================================
   PASSWORD SECTION
========================================= */

#passwordSection{
display:none;
margin-top:25px;
padding-top:20px;
border-top:1px solid #eee;
}

.password-title{
margin-bottom:18px;
font-size:20px;
}


/* =========================================
   BOTTOM NAV
========================================= */

.bottom-nav{
position:fixed;
left:0;
bottom:0;
width:100%;
height:75px;
display:flex;
background:#fff;
border-top:2px solid #d4a62a;
z-index:1000;
}

.bottom-nav a{
flex:1;
height:100%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:4px;
color:#8a6b58;
font-size:23px;
text-decoration:none;
}

.bottom-nav a span{
font-size:11px;
font-weight:700;
}

.bottom-nav a.active{
color:#4b3326;
}


/* =========================================
   PROFILE ICON
========================================= */

#bottomProfileIcon{
width:23px;
height:23px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
border-radius:50%;
font-size:23px;
line-height:23px;
font-weight:400;
flex-shrink:0;
}

#bottomProfileIcon img{
width:23px;
height:23px;
object-fit:cover;
border-radius:50%;
display:block;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

.navbar{
height:68px;
padding:0 16px;
}

.logo{
font-size:30px;
}

.profile-container{
padding:30px 22px 110px;
}

.profile-title{
font-size:28px;
}

.stats{
gap:55px;
}

.bottom-nav{
height:70px;
}

}

</style>

</head>

<body>


<!-- =========================================
     NAVBAR
========================================= -->

<header class="navbar">

<a
    href="stream.html"
    class="back">
    ‹
</a>

<div class="logo">
    Canvas
</div>

<div class="header-space"></div>

</header>


<!-- =========================================
     MAIN
========================================= -->

<main class="profile-container">


<!-- =========================================
     CREATE / EDIT PROFILE
========================================= -->

<section id="createProfile">

<h1
    class="profile-title"
    id="formTitle">

    Create your profile

</h1>

<p
    class="profile-subtitle"
    id="formSubtitle">

    Set up your Canvas profile and let people know who you are.

</p>


<!-- AVATAR -->

<div class="avatar-section">

<div
    class="avatar"
    id="avatarPreview">

    ⬤

</div>


<div class="photo-actions">


<label
    class="photo-button"
    for="photoInput"
    aria-label="Edit profile picture">

<svg
    viewBox="0 0 24 24"
    aria-hidden="true">

<path
    d="M4 20h4L19 9a2.2 2.2 0 0 0 0-3.1l-.9-.9a2.2 2.2 0 0 0-3.1 0L4 16v4z">
</path>

<path
    d="M13.5 6.5l4 4">
</path>

</svg>

</label>


<button
    type="button"
    class="delete-photo-button"
    id="deletePhotoButton"
    aria-label="Delete profile picture">

<svg
    viewBox="0 0 24 24"
    aria-hidden="true">

<path d="M5 7h14"></path>

<path d="M9 7V4h6v3"></path>

<path d="M7 7l1 13h8l1-13"></path>

<path d="M10 11v5"></path>

<path d="M14 11v5"></path>

</svg>

</button>


</div>


<input
    type="file"
    id="photoInput"
    accept="image/*">

</div>


<!-- DISPLAY NAME -->

<div class="form-group">

<label for="displayName">
    Display name
</label>

<input
    type="text"
    id="displayName"
    placeholder="Your name"
    maxlength="30">

</div>


<!-- USERNAME -->

<div class="form-group">

<label for="username">
    Username
</label>

<input
    type="text"
    id="username"
    placeholder="@username"
    maxlength="20">

</div>


<!-- BIO -->

<div class="form-group">

<label for="bio">
    Bio
</label>

<textarea
    id="bio"
    placeholder="Tell people about yourself..."
    maxlength="150"></textarea>

</div>


<button
    type="button"
    class="save-button"
    id="saveProfileButton">

    Save Profile

</button>

  </section>
  <!-- =========================================
     PART 2 — PROFILE VIEW + ACCOUNT
========================================= -->

<section id="profileView">

    <div class="avatar" id="profileAvatar">
        ⬤
    </div>

    <div class="photo-actions">

        <label
            class="photo-button"
            for="photoInput"
            aria-label="Edit profile picture">

            <svg viewBox="0 0 24 24">
                <path d="M4 20h4L19 9a2.2 2.2 0 0 0 0-3.1l-.9-.9a2.2 2.2 0 0 0-3.1 0L4 16v4z"></path>
                <path d="M13.5 6.5l4 4"></path>
            </svg>

        </label>

        <button
            type="button"
            class="delete-photo-button"
            id="deletePhotoButton"
            onclick="deleteProfilePhoto()"
            aria-label="Delete profile picture">

            <svg viewBox="0 0 24 24">
                <path d="M5 7h14"></path>
                <path d="M9 7V4h6v3"></path>
                <path d="M7 7l1 13h8l1-13"></path>
                <path d="M10 11v5"></path>
                <path d="M14 11v5"></path>
            </svg>

        </button>

    </div>

    <h1
        class="profile-name"
        id="profileName">
        Canvas Creator
    </h1>

    <p
        class="profile-username"
        id="profileUsername">
        @username
    </p>

    <p
        class="profile-bio"
        id="profileBio">
        No bio yet.
    </p>


    <!-- =====================================
         STATS
    ====================================== -->

    <div class="stats">

        <div class="stat">

            <strong id="followersCount">
                0
            </strong>

            <span>
                Followers
            </span>

        </div>


        <div class="stat">

            <strong id="followingCount">
                0
            </strong>

            <span>
                Following
            </span>

        </div>

    </div>


    <!-- =====================================
         ACCOUNT
    ====================================== -->

    <section class="account-section">

        <h2 class="account-title">
            Account
        </h2>


        <div class="account-item">

            <div class="account-label">
                Email
            </div>

            <div
                class="account-value"
                id="accountEmail">
                Not available
            </div>

        </div>


        <div class="account-item">

            <div class="account-label">
                Password
            </div>

            <div class="account-value">
                ••••••••
            </div>

        </div>


        <button
            type="button"
            class="edit-button"
            onclick="editProfile()">

            Edit Profile

        </button>


        <button
            type="button"
            class="password-button"
            onclick="togglePasswordSection()">

            Change Password

        </button>


        <button
            type="button"
            class="logout-button"
            onclick="logout()">

            Log Out

        </button>


        <!-- =================================
             CHANGE PASSWORD
        ================================== -->

        <div id="passwordSection">

            <h2 class="password-title">
                Change Password
            </h2>


            <div class="form-group">

                <label for="currentPassword">
                    Current password
                </label>

                <input
                    type="password"
                    id="currentPassword"
                    autocomplete="current-password">

            </div>


            <div class="form-group">

                <label for="newPassword">
                    New password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    autocomplete="new-password">

            </div>


            <div class="form-group">

                <label for="confirmNewPassword">
                    Confirm password
                </label>

                <input
                    type="password"
                    id="confirmNewPassword"
                    autocomplete="new-password">

            </div>


            <button
                type="button"
                class="save-button"
                onclick="changePassword()">

                Save New Password

            </button>

        </div>

    </section>

</section>


<!-- =========================================
     BOTTOM NAVIGATION
========================================= -->

<nav class="bottom-nav">

    <a href="stream.html">

        ⌂

        <span>
            Home
        </span>

    </a>


    <a href="stream.html">

        ▣

        <span>
            Stream
        </span>

    </a>


    <a href="golive.html">

        ⊙

        <span>
            Go Live
        </span>

    </a>


    <a
        href="profile.html"
        class="active">

        <span id="bottomProfileIcon">
            ⬤
        </span>

        <span>
            Profile
        </span>

    </a>

  </nav>
 <script>

const API =
    "https://canvas-kh9p.onrender.com";


/* =========================================
   ELEMENTS
========================================= */

const createProfile =
    document.getElementById("createProfile");

const profileView =
    document.getElementById("profileView");

const avatarPreview =
    document.getElementById("avatarPreview");

const profileAvatar =
    document.getElementById("profileAvatar");

const photoInput =
    document.getElementById("photoInput");

const displayName =
    document.getElementById("displayName");

const username =
    document.getElementById("username");

const bio =
    document.getElementById("bio");

const profileName =
    document.getElementById("profileName");

const profileUsername =
    document.getElementById("profileUsername");

const profileBio =
    document.getElementById("profileBio");

const accountEmail =
    document.getElementById("accountEmail");


/* =========================================
   AUTH TOKEN
========================================= */

function getToken(){

    return (
        localStorage.getItem(
            "canvasAuthToken"
        ) || ""
    ).trim();

}


/* =========================================
   AUTH HEADERS
========================================= */

function authHeaders(){

    const token =
        getToken();

    return {

        "Content-Type":
            "application/json",

        "Accept":
            "application/json",

        "Authorization":
            "Bearer " + token

    };

}


/* =========================================
   DEFAULT AVATAR
========================================= */

function showDefaultAvatar(){

    if(avatarPreview){

        avatarPreview.innerHTML =
            "⬤";

    }

    if(profileAvatar){

        profileAvatar.innerHTML =
            "⬤";

    }

    updateBottomProfileIcon("");

}


/* =========================================
   SHOW PHOTO
========================================= */

function showProfilePhoto(photo){

    if(!photo){

        showDefaultAvatar();

        return;

    }


    if(avatarPreview){

        avatarPreview.innerHTML = "";

        const img =
            document.createElement("img");

        img.src = photo;

        img.alt =
            "Profile picture";

        avatarPreview.appendChild(img);

    }


    if(profileAvatar){

        profileAvatar.innerHTML = "";

        const img =
            document.createElement("img");

        img.src = photo;

        img.alt =
            "Profile picture";

        profileAvatar.appendChild(img);

    }


    updateBottomProfileIcon(photo);

}


/* =========================================
   BOTTOM PROFILE ICON
========================================= */

function updateBottomProfileIcon(photo){

    const icon =
        document.getElementById(
            "bottomProfileIcon"
        );

    if(!icon) return;


    icon.innerHTML = "";


    if(photo){

        const img =
            document.createElement("img");

        img.src =
            photo;

        img.alt =
            "Profile";

        icon.appendChild(img);

    }else{

        icon.textContent =
            "⬤";

    }

}


/* =========================================
   LOAD PROFILE FROM BACKEND
========================================= */

async function loadProfile(){

    const token =
        getToken();


    if(!token){

        window.location.href =
            "login.html";

        return;

    }


    try{

        const response =
            await fetch(

                API + "/api/profile",

                {

                    method:
                        "GET",

                    headers:
                        authHeaders()

                }

            );


        let data = {};

        try{

            data =
                await response.json();

        }catch(error){

            data = {};

        }


        console.log(
            "Canvas profile:",
            response.status,
            data
        );


        if(
            response.status === 401
        ){

            localStorage.removeItem(
                "canvasAuthToken"
            );

            localStorage.removeItem(
                "canvasLoggedIn"
            );

            window.location.href =
                "login.html";

            return;

        }


        if(!response.ok){

            throw new Error(

                data.message ||
                "Unable to load profile."

            );

        }


        if(
            !data.success ||
            !data.profile
        ){

            throw new Error(
                "Canvas profile data is missing."
            );

        }


        const profile =
            data.profile;


        /* =====================================
           FILL FORM
        ===================================== */

        if(displayName){

            displayName.value =
                profile.name || "";

        }


        if(username){

            username.value =
                profile.username || "";

        }


        if(bio){

            bio.value =
                profile.bio || "";

        }


        /* =====================================
           PROFILE VIEW
        ===================================== */

        if(profileName){

            profileName.textContent =
                profile.name ||
                "Canvas Creator";

        }


        if(profileUsername){

            profileUsername.textContent =
                profile.username
                    ? "@" +
                      String(
                          profile.username
                      ).replace(/^@/, "")

                    : "@username";

        }


        if(profileBio){

            profileBio.textContent =
                profile.bio ||
                "No bio yet.";

        }


        if(accountEmail){

            accountEmail.textContent =
                profile.email ||
                "Not available";

        }


        /* =====================================
           PROFILE PICTURE
        ===================================== */

        if(
            profile.profile_picture
        ){

            showProfilePhoto(
                profile.profile_picture
            );

        }else{

            showDefaultAvatar();

        }


        /* =====================================
           SHOW PROFILE
        ===================================== */

        if(createProfile){

            createProfile.style.display =
                "none";

        }


        if(profileView){

            profileView.style.display =
                "block";

        }


    }catch(error){

        console.error(
            "Load profile error:",
            error
        );


        if(createProfile){

            createProfile.style.display =
                "block";

        }


        if(profileView){

            profileView.style.display =
                "none";

        }

    }

}


/* =========================================
   PHOTO SELECT
========================================= */

if(photoInput){

    photoInput.addEventListener(
        "change",
        async function(){

            const file =
                this.files[0];

            if(!file) return;


            if(
                !file.type.startsWith(
                    "image/"
                )
            ){

                alert(
                    "Please choose an image file."
                );

                this.value = "";

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                async function(event){

                    const photo =
                        event.target.result;


                    showProfilePhoto(
                        photo
                    );


                    /* =========================
                       SAVE TO BACKEND
                    ========================= */

                    try{

                        const response =
                            await fetch(

                                API +
                                "/api/profile",

                                {

                                    method:
                                        "PUT",

                                    headers:
                                        authHeaders(),

                                    body:
                                        JSON.stringify({

                                            profile_picture:
                                                photo

                                        })

                                }

                            );


                        const data =
                            await response.json();


                        if(
                            !response.ok
                        ){

                            throw new Error(

                                data.message ||
                                "Could not save profile picture."

                            );

                        }


                        console.log(
                            "Profile picture saved."
                        );


                    }catch(error){

                        console.error(
                            "Profile picture error:",
                            error
                        );

                        alert(
                            error.message
                        );

                    }

                };


            reader.readAsDataURL(file);

        }
    );

}


/* =========================================
   DELETE PROFILE PHOTO
========================================= */

async function deleteProfilePhoto(){

    try{

        const response =
            await fetch(

                API +
                "/api/profile/picture",

                {

                    method:
                        "DELETE",

                    headers:
                        authHeaders()

                }

            );


        const data =
            await response.json();


        if(
            !response.ok
        ){

            throw new Error(

                data.message ||
                "Could not delete profile picture."

            );

        }


        showDefaultAvatar();


        if(photoInput){

            photoInput.value =
                "";

        }


        alert(
            "Profile picture deleted."
        );


    }catch(error){

        console.error(
            "Delete photo error:",
            error
        );

        alert(
            error.message
        );

    }

}


/* =========================================
   SAVE PROFILE
========================================= */

async function saveProfile(){

    const name =
        displayName.value.trim();

    let user =
        username.value.trim();

    const bioText =
        bio.value.trim();


    if(!name){

        alert(
            "Please enter your display name."
        );

        displayName.focus();

        return;

    }


    if(!user){

        alert(
            "Please enter your username."
        );

        username.focus();

        return;

    }


    if(
        user.startsWith("@")
    ){

        user =
            user.substring(1);

    }


    try{

        const currentResponse =
            await fetch(

                API +
                "/api/profile",

                {

                    method:
                        "GET",

                    headers:
                        authHeaders()

                }

            );


        const currentData =
            await currentResponse.json();


        let currentPhoto =
            "";


        if(
            currentData.profile
        ){

            currentPhoto =
                currentData.profile
                    .profile_picture || "";

        }


        const response =
            await fetch(

                API +
                "/api/profile",

                {

                    method:
                        "PUT",

                    headers:
                        authHeaders(),

                    body:
                        JSON.stringify({

                            name:
                                name,

                            username:
                                user,

                            bio:
                                bioText,

                            profile_picture:
                                currentPhoto

                        })

                }

            );


        const data =
            await response.json();


        if(
            !response.ok
        ){

            throw new Error(

                data.message ||
                "Unable to save profile."

            );

        }


        await loadProfile();


        alert(
            "Profile saved successfully."
        );


    }catch(error){

        console.error(
            "Save profile error:",
            error
        );

        alert(
            error.message
        );

    }

}


/* =========================================
   EDIT PROFILE
========================================= */

function editProfile(){

    if(createProfile){

        createProfile.style.display =
            "block";

    }


    if(profileView){

        profileView.style.display =
            "none";

    }


    const title =
        document.getElementById(
            "formTitle"
        );

    const subtitle =
        document.getElementById(
            "formSubtitle"
        );


    if(title){

        title.textContent =
            "Edit your profile";

    }


    if(subtitle){

        subtitle.textContent =
            "Update your Canvas profile information.";

    }


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* =========================================
   CHANGE PASSWORD
========================================= */

async function changePassword(){

    const currentPassword =
        document.getElementById(
            "currentPassword"
        ).value;

    const newPassword =
        document.getElementById(
            "newPassword"
        ).value;

    const confirmPassword =
        document.getElementById(
            "confirmNewPassword"
        ).value;


    if(!currentPassword){

        alert(
            "Please enter your current password."
        );

        return;

    }


    if(!newPassword){

        alert(
            "Please enter a new password."
        );

        return;

    }


    if(
        newPassword.length < 8
    ){

        alert(
            "New password must be at least 8 characters."
        );

        return;

    }


    if(
        newPassword !==
        confirmPassword
    ){

        alert(
            "New passwords do not match."
        );

        return;

    }


    try{

        const response =
            await fetch(

                API +
                "/api/change-password",

                {

                    method:
                        "PUT",

                    headers:
                        authHeaders(),

                    body:
                        JSON.stringify({

                            currentPassword:
                                currentPassword,

                            newPassword:
                                newPassword

                        })

                }

            );


        const data =
            await response.json();


        if(
            !response.ok
        ){

            throw new Error(

                data.message ||
                "Unable to change password."

            );

        }


        document.getElementById(
            "currentPassword"
        ).value = "";

        document.getElementById(
            "newPassword"
        ).value = "";

        document.getElementById(
            "confirmNewPassword"
        ).value = "";


        document.getElementById(
            "passwordSection"
        ).style.display =
            "none";


        alert(
            "Password changed successfully."
        );


    }catch(error){

        console.error(
            "Change password error:",
            error
        );

        alert(
            error.message
        );

    }

}


/* =========================================
   PASSWORD SECTION
========================================= */

function togglePasswordSection(){

    const section =
        document.getElementById(
            "passwordSection"
        );


    if(
        section.style.display ===
        "block"
    ){

        section.style.display =
            "none";

    }else{

        section.style.display =
            "block";

        section.scrollIntoView({

            behavior:"smooth",

            block:"start"

        });

    }

}


/* =========================================
   LOG OUT
========================================= */

async function logout(){

    const confirmed =
        confirm(
            "Are you sure you want to log out?"
        );


    if(!confirmed){

        return;

    }


    try{

        const token =
            getToken();


        if(token){

            await fetch(

                API +
                "/api/logout",

                {

                    method:
                        "POST",

                    headers:
                        authHeaders()

                }

            );

        }

    }catch(error){

        console.error(
            "Logout request failed:",
            error
        );

    }


    localStorage.removeItem(
        "canvasAuthToken"
    );

    localStorage.removeItem(
        "canvasLoggedIn"
    );

    localStorage.removeItem(
        "canvasCurrentUser"
    );

    localStorage.removeItem(
        "canvasAccount"
    );


    window.location.href =
        "login.html";

}


/* =========================================
   INITIALIZE
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadProfile();

    }
);
