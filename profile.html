<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Canvas Profile</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box
}

body{
background:#fff;
color:#4b3326;
font-family:Arial,Helvetica,sans-serif;
min-height:100vh;
padding-bottom:90px
}

.navbar{
height:72px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 22px;
border-bottom:1px solid #eee
}

.logo{
font-size:34px;
font-weight:800;
color:#6F4E37
}

.back{
width:40px;
height:40px;
display:flex;
align-items:center;
justify-content:center;
font-size:34px;
color:#6F4E37;
text-decoration:none
}

.header-space{
width:40px
}

.profile-container{
width:100%;
max-width:650px;
margin:auto;
padding:30px 22px 110px
}

.profile-title{
font-size:30px;
font-weight:800;
margin-bottom:8px
}

.profile-subtitle{
color:#777;
font-size:16px;
line-height:1.5;
margin-bottom:30px
}


/* =========================================
   PROFILE AVATAR
========================================= */

.avatar-section{
text-align:center;
margin-bottom:30px
}

.avatar{
width:110px;
height:110px;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
overflow:hidden;
background:#f1f1f1;
border:3px solid #D4A017;
color:#6F4E37;
font-size:48px
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
display:block
}


/* =========================================
   EDIT PROFILE PHOTO ACTIONS
========================================= */

.photo-actions{
display:flex;
align-items:center;
justify-content:center;
gap:16px;
margin-top:10px
}

.photo-button,
.delete-photo-button{
width:30px;
height:30px;
padding:0;
border:0;
background:none;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
opacity:.55;
transition:
opacity .15s ease,
transform .15s ease
}

.photo-button:active,
.delete-photo-button:active{
transform:scale(.92)
}

.photo-button:hover,
.delete-photo-button:hover{
opacity:.8
}

.photo-button svg,
.delete-photo-button svg{
width:20px;
height:20px;
display:block;
fill:none;
stroke:#6F4E37;
stroke-width:1.8;
stroke-linecap:round;
stroke-linejoin:round
}

.delete-photo-button svg{
stroke:#8f3d32
}

#photoInput{
display:none
}


/* =========================================
   FORM
========================================= */

.form-group{
margin-bottom:20px
}

.form-group label{
display:block;
margin-bottom:8px;
font-size:15px;
font-weight:700
}

.form-group input,
.form-group textarea{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:12px;
background:#fafafa;
font-size:16px;
outline:none
}

.form-group textarea{
height:100px;
resize:none
}

.form-group input:focus,
.form-group textarea:focus{
border-color:#D4A017;
background:#fff
}

.save-button{
width:100%;
padding:15px;
border:0;
border-radius:12px;
background:#6F4E37;
color:#fff;
font-size:17px;
font-weight:700;
cursor:pointer
}

.save-button:disabled{
opacity:.6;
cursor:not-allowed
}

#createProfile{
display:none
}

#profileView{
display:none;
text-align:center
}


/* =========================================
   PROFILE INFORMATION
========================================= */

.profile-name{
margin-top:18px;
font-size:28px;
font-weight:800
}

.profile-username{
margin-top:5px;
color:#777;
font-size:18px
}

.profile-bio{
max-width:400px;
margin:18px auto;
color:#555;
font-size:17px;
line-height:1.5
}

.stats{
display:flex;
justify-content:center;
gap:60px;
margin:25px 0;
padding-bottom:25px;
border-bottom:1px solid #eee
}

.stat strong{
display:block;
font-size:24px
}

.stat span{
display:block;
margin-top:5px;
color:#777;
font-size:15px
}


/* =========================================
   ACCOUNT
========================================= */

.account-section{
margin-top:25px;
text-align:left
}

.account-title{
margin-bottom:20px;
font-size:28px;
font-weight:800
}

.account-item{
padding:16px 0;
border-bottom:1px solid #eee
}

.account-label{
margin-bottom:6px;
color:#777;
font-size:14px
}

.account-value{
color:#333;
font-size:17px;
word-break:break-word
}

.edit-button,
.password-button,
.logout-button{
width:100%;
padding:14px;
margin-top:12px;
border-radius:10px;
font-size:15px;
font-weight:700;
cursor:pointer
}

.edit-button{
border:1px solid #6F4E37;
background:#fff;
color:#6F4E37
}

.password-button{
border:1px solid #D4A017;
background:#fff;
color:#6F4E37
}

.logout-button{
border:1px solid #ddd;
background:#fff;
color:#777
}

#passwordSection{
display:none;
margin-top:25px;
padding-top:20px;
border-top:1px solid #eee
}

.password-title{
margin-bottom:18px;
font-size:20px
}


/* =========================================
   BOTTOM NAVIGATION
========================================= */

.bottom-nav{
position:fixed;
left:0;
bottom:0;
width:100%;
height:75px;
display:flex;
background:#fff;
border-top:2px solid #d4a62a;
z-index:1000
}

.bottom-nav a{
flex:1;
height:100%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:4px;
color:#8a6b58;
font-size:23px;
text-decoration:none
}

.bottom-nav a span{
font-size:11px;
font-weight:700
}

.bottom-nav a.active{
color:#4b3326
}


/* =========================================
   PROFILE ICON
========================================= */

#bottomProfileIcon{
width:23px;
height:23px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
border-radius:50%;
font-size:23px;
line-height:23px;
font-weight:400;
flex-shrink:0
}

#bottomProfileIcon img{
width:23px;
height:23px;
object-fit:cover;
border-radius:50%;
display:block
}

#bottomProfileImage{
width:23px;
height:23px;
object-fit:cover;
border-radius:50%;
border:1.5px solid #d4a62a;
display:block
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

.navbar{
height:68px;
padding:0 16px
}

.logo{
font-size:30px
}

.profile-container{
padding:30px 22px 110px
}

.profile-title{
font-size:28px
}

.stats{
gap:55px
}

.bottom-nav{
height:70px
}

}

</style>

</head>

<body>

href="stream.html"

<script>

/* =========================================
   CANVAS BACKEND
========================================= */

const API =
"https://canvas-kh9p.onrender.com";


/* =========================================
   PROFILE STATE
========================================= */

let selectedPhoto = "";

let currentProfile = null;


/* =========================================
   AUTH TOKEN
========================================= */

function getAuthToken(){

return localStorage.getItem(
"canvasAuthToken"
) || "";

}


/* =========================================
   CURRENT ACCOUNT
========================================= */

function getCurrentAccount(){

const saved =
localStorage.getItem(
"canvasCurrentUser"
);

if(!saved){

return {};

}

try{

return JSON.parse(saved);

}catch(error){

console.error(
"Current account data error:",
error
);

return {};

}

}


/* =========================================
   ACCOUNT EMAIL
========================================= */

function getAccountEmail(){

const account =
getCurrentAccount();

return String(
account.email || ""
).trim();

}


/* =========================================
   SHOW CREATE PROFILE
========================================= */

function showCreateProfile(){

document.getElementById(
"profileView"
).style.display =
"none";

document.getElementById(
"createProfile"
).style.display =
"block";


document.getElementById(
"formTitle"
).textContent =
"Create your profile";


document.getElementById(
"formSubtitle"
).textContent =
"Set up your Canvas profile and let people know who you are.";


document.getElementById(
"displayName"
).value =
"";


document.getElementById(
"username"
).value =
"";


document.getElementById(
"bio"
).value =
"";


selectedPhoto = "";


document.getElementById(
"avatarPreview"
).textContent =
"⬤";


document.getElementById(
"deletePhotoButton"
).style.display =
"none";

}


/* =========================================
   SHOW PROFILE
========================================= */

function showProfile(profile){

currentProfile =
profile;


document.getElementById(
"createProfile"
).style.display =
"none";

document.getElementById(
"profileView"
).style.display =
"block";


document.getElementById(
"profileName"
).textContent =
profile.name ||
"Canvas Creator";


document.getElementById(
"profileUsername"
).textContent =
profile.username ||
"@username";


document.getElementById(
"profileBio"
).textContent =
profile.bio ||
"No bio yet";


document.getElementById(
"accountEmail"
).textContent =
profile.email ||
getAccountEmail() ||
"Not available";


/* =========================================
   PROFILE PHOTO
========================================= */

const avatar =
document.getElementById(
"profileAvatar"
);

avatar.innerHTML = "";


if(profile.photo){

const img =
document.createElement("img");

img.src =
profile.photo;

img.alt =
"Profile picture";

avatar.appendChild(img);

}else{

avatar.textContent =
"⬤";

}


/* =========================================
   BOTTOM PROFILE ICON
========================================= */

updateBottomIcon(profile);

}


/* =========================================
   LOAD PROFILE FROM BACKEND
========================================= */

async function loadProfile(){

const token =
getAuthToken();


/* =========================================
   NO AUTH TOKEN
========================================= */

if(!token){

localStorage.removeItem(
"canvasProfile"
);

localStorage.removeItem(
"canvasCurrentUser"
);

localStorage.removeItem(
"canvasAccount"
);

window.location.href =
"login.html";

return;

}


/* =========================================
   LOAD CURRENT USER
========================================= */

try{

const meResponse =
await fetch(

API +
"/api/me",

{
method:"GET",
headers:{
"Authorization":
"Bearer " + token
},
cache:"no-store"
}

);


if(!meResponse.ok){

throw new Error(
"Authentication expired."
);

}


const meData =
await meResponse.json();


if(
!meData ||
!meData.user
){

throw new Error(
"Current user data is missing."
);

}


const user =
meData.user;


/* =========================================
   UPDATE CURRENT USER STORAGE
========================================= */

const account = {

id:
user.id || "",

email:
user.email || "",

username:
String(
user.username || ""
).replace(
/^@/,
""
),

displayName:
user.name || ""

};


localStorage.setItem(
"canvasCurrentUser",
JSON.stringify(account)
);


localStorage.setItem(
"canvasAccount",
JSON.stringify(account)
);


/* =========================================
   LOAD ACTUAL PROFILE
   IMPORTANT:
   BACKEND ENDPOINT IS /api/profile
========================================= */

const profileResponse =
await fetch(

API +
"/api/profile",

{
method:"GET",

headers:{
"Authorization":
"Bearer " + token
},

cache:"no-store"

}

);


if(
profileResponse.status === 404
){

showCreateProfile();

return;

}


if(!profileResponse.ok){

throw new Error(
"Unable to load Canvas profile."
);

}


const profileData =
await profileResponse.json();


if(
!profileData ||
!profileData.profile
){

throw new Error(
"Profile data is missing."
);

}


const p =
profileData.profile;


/* =========================================
   CREATE CLEAN PROFILE
========================================= */

const cleanUsername =
String(
p.username ||
user.username ||
""
).replace(
/^@/,
""
);


const profile = {

name:
p.name ||
user.name ||
"",

username:
"@" + cleanUsername,

email:
p.email ||
user.email ||
"",

bio:
p.bio ||
"",

photo:
p.profile_picture ||
""

};


/* =========================================
   SAVE PROFILE FOR THIS ACCOUNT
========================================= */

localStorage.setItem(
"canvasProfile",
JSON.stringify(profile)
);


showProfile(profile);


}catch(error){

console.error(
"Profile loading failed:",
error
);


/* =========================================
   INVALID TOKEN
========================================= */

if(
error.message ===
"Authentication expired."
){

localStorage.removeItem(
"canvasAuthToken"
);

localStorage.removeItem(
"canvasLoggedIn"
);

localStorage.removeItem(
"canvasCurrentUser"
);

localStorage.removeItem(
"canvasAccount"
);

localStorage.removeItem(
"canvasProfile"
);

window.location.href =
"login.html";

return;

}


/* =========================================
   SERVER ERROR
========================================= */

alert(
error.message ||
"Unable to load Canvas profile."
);

}

}


/* =========================================
   PAGE READY
========================================= */

window.addEventListener(
"DOMContentLoaded",
function(){

loadProfile();

});


/* =========================================
   PHOTO SELECT / EDIT
========================================= */

document.getElementById(
"photoInput"
).addEventListener(
"change",
function(){

const file =
this.files[0];

if(!file){

return;

}


if(
!file.type.startsWith(
"image/"
)
){

alert(
"Please choose an image."
);

this.value =
"";

return;

}


const reader =
new FileReader();


reader.onload =
function(event){

selectedPhoto =
event.target.result;


document.getElementById(
"avatarPreview"
).innerHTML =
`<img
src="${selectedPhoto}"
alt="Profile picture">`;


document.getElementById(
"deletePhotoButton"
).style.display =
"flex";

};


reader.readAsDataURL(file);

});


/* =========================================
   DELETE PROFILE PHOTO
   ONLY CHANGES EDIT PREVIEW
   UNTIL SAVE PROFILE
========================================= */

function deleteProfilePhoto(){

selectedPhoto = "";


const input =
document.getElementById(
"photoInput"
);

if(input){

input.value =
"";

}


const avatar =
document.getElementById(
"avatarPreview"
);

if(avatar){

avatar.textContent =
"⬤";

}


const deleteButton =
document.getElementById(
"deletePhotoButton"
);

if(deleteButton){

deleteButton.style.display =
"none";

}

}


/* =========================================
   EDIT PROFILE
========================================= */

function editProfile(){

if(!currentProfile){

return;

}


document.getElementById(
"profileView"
).style.display =
"none";


document.getElementById(
"createProfile"
).style.display =
"block";


document.getElementById(
"formTitle"
).textContent =
"Edit your profile";


document.getElementById(
"formSubtitle"
).textContent =
"Update your Canvas profile.";


document.getElementById(
"displayName"
).value =
currentProfile.name || "";


document.getElementById(
"username"
).value =
currentProfile.username || "";


document.getElementById(
"bio"
).value =
currentProfile.bio || "";


selectedPhoto =
currentProfile.photo || "";


/* =========================================
   CURRENT PHOTO
========================================= */

if(selectedPhoto){

document.getElementById(
"avatarPreview"
).innerHTML =
`<img
src="${selectedPhoto}"
alt="Profile picture">`;


document.getElementById(
"deletePhotoButton"
).style.display =
"flex";

}else{

document.getElementById(
"avatarPreview"
).textContent =
"⬤";


document.getElementById(
"deletePhotoButton"
).style.display =
"none";

}

}
  /* =========================================
   CHANGE PASSWORD
========================================= */

async function changePassword(){

const current =
document.getElementById(
"currentPassword"
).value;

const newPass =
document.getElementById(
"newPassword"
).value;

const confirm =
document.getElementById(
"confirmNewPassword"
).value;

const token =
getAuthToken();


if(!token){

alert(
"Your login session has expired. Please log in again."
);

window.location.href =
"login.html";

return;

}


if(!current){

alert(
"Please enter your current password."
);

return;

}


if(newPass.length < 8){

alert(
"Password must be at least 8 characters."
);

return;

}


if(newPass !== confirm){

alert(
"Passwords do not match."
);

return;

}


try{

const response =
await fetch(

API +
"/api/change-password",

{
method:"PUT",

headers:{

"Content-Type":
"application/json",

"Authorization":
"Bearer " + token

},

body:
JSON.stringify({

currentPassword:
current,

newPassword:
newPass

})

}

);


const data =
await response
.json()
.catch(
function(){
return {};
}
);


if(!response.ok){

throw new Error(

data.message ||
"Unable to change password."

);

}


alert(
"Password changed successfully."
);


document.getElementById(
"currentPassword"
).value =
"";

document.getElementById(
"newPassword"
).value =
"";

document.getElementById(
"confirmNewPassword"
).value =
"";


document.getElementById(
"passwordSection"
).style.display =
"none";


}catch(error){

console.error(
"Change password error:",
error
);

alert(
error.message ||
"Unable to change password."
);

}

}


/* =========================================
   LOG OUT
========================================= */

async function logout(){

const token =
getAuthToken();


/* =========================================
   TRY BACKEND LOGOUT
========================================= */

if(token){

try{

await fetch(

API +
"/api/logout",

{
method:"POST",

headers:{
"Authorization":
"Bearer " + token
}

}

);

}catch(error){

console.error(
"Backend logout error:",
error
);

}

}


/* =========================================
   CLEAR CURRENT ACCOUNT ONLY
========================================= */

localStorage.removeItem(
"canvasAuthToken"
);

localStorage.removeItem(
"canvasLoggedIn"
);

localStorage.removeItem(
"canvasCurrentUser"
);

localStorage.removeItem(
"canvasAccount"
);

localStorage.removeItem(
"canvasProfile"
);


/* =========================================
   RESET PAGE
========================================= */

currentProfile =
null;

selectedPhoto =
"";


window.location.href =
"login.html";

}


/* =========================================
   SAVE PROFILE
========================================= */

async function saveProfile(){

const displayName =
document.getElementById(
"displayName"
).value.trim();

const username =
document.getElementById(
"username"
).value.trim();

const bio =
document.getElementById(
"bio"
).value.trim();


const token =
getAuthToken();


if(!token){

alert(
"Your login session has expired. Please log in again."
);

window.location.href =
"login.html";

return;

}


if(displayName === ""){

alert(
"Please enter your display name."
);

return;

}


if(username === ""){

alert(
"Please choose a username."
);

return;

}


let finalUsername =
username;


if(finalUsername.startsWith("@")){

finalUsername =
finalUsername.substring(1);

}


finalUsername =
finalUsername.trim();


if(!finalUsername){

alert(
"Please choose a username."
);

return;

}


const saveButton =
document.getElementById(
"saveProfileButton"
);


saveButton.disabled =
true;

saveButton.textContent =
"Saving...";


try{

/* =====================================
   SAVE TO BACKEND
===================================== */

const response =
await fetch(

API +
"/api/profile",

{
method:"PUT",

headers:{

"Content-Type":
"application/json",

"Authorization":
"Bearer " + token

},

body:
JSON.stringify({

name:
displayName,

username:
finalUsername,

bio:
bio,

profile_picture:
selectedPhoto || ""

})

}

);


const data =
await response
.json()
.catch(
function(){
return {};
}
);


if(!response.ok){

throw new Error(

data.message ||
"Unable to save profile."

);

}


const savedUser =
data.user || {};


const profile = {

name:
savedUser.name ||
displayName,

username:
"@" +
String(
savedUser.username ||
finalUsername
).replace(
/^@/,
""),

email:
savedUser.email ||
getAccountEmail(),

bio:
savedUser.bio !== undefined
?
savedUser.bio
:
bio,

photo:
savedUser.profile_picture !== undefined
?
savedUser.profile_picture
:
selectedPhoto

};


/* =====================================
   UPDATE CURRENT ACCOUNT
===================================== */

const account =
getCurrentAccount();


const updatedAccount = {

id:
savedUser.id ||
account.id ||
"",

email:
savedUser.email ||
account.email ||
"",

username:
String(
savedUser.username ||
finalUsername
).replace(
/^@/,
""),

displayName:
savedUser.name ||
displayName

};


localStorage.setItem(
"canvasCurrentUser",
JSON.stringify(
updatedAccount
)
);


localStorage.setItem(
"canvasAccount",
JSON.stringify(
updatedAccount
)
);


/* =====================================
   SAVE PROFILE CACHE
===================================== */

localStorage.setItem(
"canvasProfile",
JSON.stringify(
profile
)
);


currentProfile =
profile;


showProfile(profile);


}catch(error){

console.error(
"Save profile error:",
error
);

alert(
error.message ||
"Unable to save Canvas profile."
);


}finally{

saveButton.disabled =
false;

saveButton.textContent =
"Save Profile";

}

}


/* =========================================
   DELETE PROFILE PICTURE FROM BACKEND
========================================= */

async function deleteSavedProfilePhoto(){

const token =
getAuthToken();


if(!token){

window.location.href =
"login.html";

return;

}


try{

const response =
await fetch(

API +
"/api/profile/picture",

{
method:"DELETE",

headers:{
"Authorization":
"Bearer " + token
}

}

);


const data =
await response
.json()
.catch(
function(){
return {};
}
);


if(!response.ok){

throw new Error(

data.message ||
"Unable to delete profile picture."

);

}


/* =====================================
   UPDATE LOCAL PROFILE
===================================== */

if(currentProfile){

currentProfile.photo =
"";


localStorage.setItem(
"canvasProfile",
JSON.stringify(
currentProfile
)
);


showProfile(
currentProfile
);

}


}catch(error){

console.error(
"Delete profile picture error:",
error
);

alert(
error.message ||
"Unable to delete profile picture."
);

}

}


/* =========================================
   UPDATE BOTTOM PROFILE ICON
========================================= */

function updateBottomIcon(profile){

const icon =
document.getElementById(
"bottomProfileIcon"
);

if(!icon){

return;

}


icon.innerHTML = "";


if(
profile &&
profile.photo
){

const img =
document.createElement("img");

img.id =
"bottomProfileImage";

img.src =
profile.photo;

img.alt =
"Profile";

icon.appendChild(img);

}else{

icon.textContent =
"⬤";

}

}


/* =========================================
   PROFILE PAGE CLEANUP
========================================= */

window.addEventListener(
"beforeunload",
function(){

const input =
document.getElementById(
"photoInput"
);

if(input){

input.value =
"";

}

});


</script>

</body>
