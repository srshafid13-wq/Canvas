<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Canvas Profile</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box
}

body{
background:#fff;
color:#4b3326;
font-family:Arial,Helvetica,sans-serif;
min-height:100vh;
padding-bottom:90px
}

.navbar{
height:72px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 22px;
border-bottom:1px solid #eee
}

.logo{
font-size:34px;
font-weight:800;
color:#6F4E37
}

.back{
width:40px;
height:40px;
display:flex;
align-items:center;
justify-content:center;
font-size:34px;
color:#6F4E37;
text-decoration:none
}

.header-space{
width:40px
}

.profile-container{
width:100%;
max-width:650px;
margin:auto;
padding:30px 22px 110px
}

.profile-title{
font-size:30px;
font-weight:800;
margin-bottom:8px
}

.profile-subtitle{
color:#777;
font-size:16px;
line-height:1.5;
margin-bottom:30px
}


/* =========================================
   PROFILE AVATAR
========================================= */

.avatar-section{
text-align:center;
margin-bottom:30px
}

.avatar{
width:110px;
height:110px;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
overflow:hidden;
background:#f1f1f1;
border:3px solid #D4A017;
color:#6F4E37;
font-size:48px
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
display:block
}


/* =========================================
   PHOTO ACTIONS
========================================= */

.photo-actions{
display:flex;
align-items:center;
justify-content:center;
gap:16px;
margin-top:10px
}

.photo-button,
.delete-photo-button{
width:30px;
height:30px;
padding:0;
border:0;
background:none;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
opacity:.55;
transition:
opacity .15s ease,
transform .15s ease
}

.photo-button:active,
.delete-photo-button:active{
transform:scale(.92)
}

.photo-button:hover,
.delete-photo-button:hover{
opacity:.8
}

.photo-button svg,
.delete-photo-button svg{
width:20px;
height:20px;
display:block;
fill:none;
stroke:#6F4E37;
stroke-width:1.8;
stroke-linecap:round;
stroke-linejoin:round
}

.delete-photo-button svg{
stroke:#8f3d32
}

#photoInput{
display:none
}


/* =========================================
   FORM
========================================= */

.form-group{
margin-bottom:20px
}

.form-group label{
display:block;
margin-bottom:8px;
font-size:15px;
font-weight:700
}

.form-group input,
.form-group textarea{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:12px;
background:#fafafa;
font-size:16px;
outline:none
}

.form-group textarea{
height:100px;
resize:none
}

.form-group input:focus,
.form-group textarea:focus{
border-color:#D4A017;
background:#fff
}

.save-button{
width:100%;
padding:15px;
border:0;
border-radius:12px;
background:#6F4E37;
color:#fff;
font-size:17px;
font-weight:700;
cursor:pointer
}

.save-button:disabled{
opacity:.6;
cursor:not-allowed
}

#createProfile{
display:none
}

#profileView{
display:none;
text-align:center
}


/* =========================================
   PROFILE INFORMATION
========================================= */

.profile-name{
margin-top:18px;
font-size:28px;
font-weight:800
}

.profile-username{
margin-top:5px;
color:#777;
font-size:18px
}

.profile-bio{
max-width:400px;
margin:18px auto;
color:#555;
font-size:17px;
line-height:1.5
}

.stats{
display:flex;
justify-content:center;
gap:60px;
margin:25px 0;
padding-bottom:25px;
border-bottom:1px solid #eee
}

.stat strong{
display:block;
font-size:24px
}

.stat span{
display:block;
margin-top:5px;
color:#777;
font-size:15px
}


/* =========================================
   ACCOUNT
========================================= */

.account-section{
margin-top:25px;
text-align:left
}

.account-title{
margin-bottom:20px;
font-size:28px;
font-weight:800
}

.account-item{
padding:16px 0;
border-bottom:1px solid #eee
}

.account-label{
margin-bottom:6px;
color:#777;
font-size:14px
}

.account-value{
color:#333;
font-size:17px;
word-break:break-word
}

.edit-button,
.password-button,
.logout-button{
width:100%;
padding:14px;
margin-top:12px;
border-radius:10px;
font-size:15px;
font-weight:700;
cursor:pointer
}

.edit-button{
border:1px solid #6F4E37;
background:#fff;
color:#6F4E37
}

.password-button{
border:1px solid #D4A017;
background:#fff;
color:#6F4E37
}

.logout-button{
border:1px solid #ddd;
background:#fff;
color:#777
}

#passwordSection{
display:none;
margin-top:25px;
padding-top:20px;
border-top:1px solid #eee
}

.password-title{
margin-bottom:18px;
font-size:20px
}


/* =========================================
   BOTTOM NAVIGATION
========================================= */

.bottom-nav{
position:fixed;
left:0;
bottom:0;
width:100%;
height:75px;
display:flex;
background:#fff;
border-top:2px solid #d4a62a;
z-index:1000
}

.bottom-nav a{
flex:1;
height:100%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:4px;
color:#8a6b58;
font-size:23px;
text-decoration:none
}

.bottom-nav a span{
font-size:11px;
font-weight:700
}

.bottom-nav a.active{
color:#4b3326
}


/* =========================================
   PROFILE ICON
========================================= */

#bottomProfileIcon{
width:23px;
height:23px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
border-radius:50%;
font-size:23px;
line-height:23px;
font-weight:400;
flex-shrink:0
}

#bottomProfileIcon img{
width:23px;
height:23px;
object-fit:cover;
border-radius:50%;
display:block
}

#bottomProfileImage{
width:23px;
height:23px;
object-fit:cover;
border-radius:50%;
border:1.5px solid #d4a62a;
display:block
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

.navbar{
height:68px;
padding:0 16px
}

.logo{
font-size:30px
}

.profile-container{
padding:30px 22px 110px
}

.profile-title{
font-size:28px
}

.stats{
gap:55px
}

.bottom-nav{
height:70px
}

}

</style>

</head>

<script>

/* =========================================
   CANVAS BACKEND
========================================= */

const API =
"https://canvas-kh9p.onrender.com";


/* =========================================
   TEMPORARY PHOTO
   This is only changed when Save Profile
   is pressed.
========================================= */

let selectedPhoto = "";


/* =========================================
   GET AUTH TOKEN
   Supports the token names used by Canvas.
========================================= */

function getAuthToken(){

const possibleKeys = [

"canvasToken",
"canvasAuthToken",
"authToken",
"token"

];

for(
const key of possibleKeys
){

const value =
localStorage.getItem(key);

if(
value &&
String(value).trim()
){

return String(value).trim();

}

}

return "";

}


/* =========================================
   GET SAVED ACCOUNT
========================================= */

function getAccount(){

const saved =
localStorage.getItem(
"canvasAccount"
);

if(!saved){

return {};

}

try{

return JSON.parse(saved);

}catch(error){

console.error(
"Account data error:",
error
);

return {};

}

}


/* =========================================
   GET ACCOUNT USERNAME
========================================= */

function getUsername(){

const account =
getAccount();

return String(
account.username ||
""
)
.trim()
.replace(/^@/,"");

}


/* =========================================
   GET DISPLAY NAME
========================================= */

function getDisplayName(){

const account =
getAccount();

return String(
account.displayName ||
account.name ||
""
)
.trim();

}


/* =========================================
   GET ACCOUNT EMAIL
========================================= */

function getAccountEmail(){

const account =
getAccount();

return String(
account.email ||
""
)
.trim();

}


/* =========================================
   AUTH HEADERS
========================================= */

function authHeaders(){

const token =
getAuthToken();

const headers = {

"Content-Type":
"application/json"

};

if(token){

headers.Authorization =
"Bearer " + token;

}

return headers;

}


/* =========================================
   SHOW CREATE PROFILE
========================================= */

function showCreateProfile(){

const view =
document.getElementById(
"profileView"
);

const create =
document.getElementById(
"createProfile"
);

if(view){

view.style.display =
"none";

}

if(create){

create.style.display =
"block";

}

}


/* =========================================
   SHOW PROFILE
========================================= */

function showProfile(profile){

const create =
document.getElementById(
"createProfile"
);

const view =
document.getElementById(
"profileView"
);

if(create){

create.style.display =
"none";

}

if(view){

view.style.display =
"block";

}


/* Name */

document.getElementById(
"profileName"
).textContent =
profile.name ||
"Canvas Creator";


/* Username */

let username =
String(
profile.username ||
""
)
.trim();

if(
username &&
!username.startsWith("@")
){

username =
"@" + username;

}

document.getElementById(
"profileUsername"
).textContent =
username ||
"@username";


/* Bio */

document.getElementById(
"profileBio"
).textContent =
profile.bio ||
"No bio yet";


/* Email */

document.getElementById(
"accountEmail"
).textContent =
profile.email ||
getAccountEmail() ||
"Not available";


/* Profile picture */

const avatar =
document.getElementById(
"profileAvatar"
);

if(avatar){

avatar.innerHTML = "";

if(profile.photo){

const img =
document.createElement("img");

img.src =
profile.photo;

img.alt =
"Profile picture";

avatar.appendChild(img);

}else{

avatar.textContent =
"⬤";

}

}


/* Bottom icon */

updateBottomIcon(profile);

}


/* =========================================
   UPDATE BOTTOM PROFILE ICON
========================================= */

function updateBottomIcon(profile){

const icon =
document.getElementById(
"bottomProfileIcon"
);

if(!icon){

return;

}

icon.innerHTML = "";

if(
profile &&
profile.photo
){

const img =
document.createElement("img");

img.id =
"bottomProfileImage";

img.src =
profile.photo;

img.alt =
"Profile";

icon.appendChild(img);

}else{

icon.textContent =
"⬤";

}

}


/* =========================================
   SAVE LOCAL PROFILE
   Used as a temporary/cache copy.
========================================= */

function saveLocalProfile(profile){

try{

localStorage.setItem(
"canvasProfile",
JSON.stringify(profile)
);

}catch(error){

console.error(
"Unable to save local profile:",
error
);

}

}


/* =========================================
   LOAD LOCAL PROFILE
========================================= */

function getLocalProfile(){

const saved =
localStorage.getItem(
"canvasProfile"
);

if(!saved){

return null;

}

try{

return JSON.parse(saved);

}catch(error){

console.error(
"Invalid local profile:",
error
);

return null;

}

}


/* =========================================
   LOAD MY PROFILE FROM BACKEND
========================================= */

async function loadMyProfile(){

const token =
getAuthToken();

if(!token){

console.log(
"No Canvas authentication token found."
);

return null;

}


const response =
await fetch(
API + "/api/profile",
{
method:"GET",
headers:authHeaders(),
cache:"no-store"
}
);


if(
response.status === 401
){

throw new Error(
"AUTH_REQUIRED"
);

}


if(!response.ok){

let message =
"Unable to load profile.";

try{

const errorData =
await response.json();

if(errorData.message){

message =
errorData.message;

}

}catch(error){

}

throw new Error(message);

}


const data =
await response.json();


if(
!data ||
!data.profile
){

throw new Error(
"Profile data is missing."
);

}


const p =
data.profile;


const profile = {

name:
p.name || "",

username:
p.username || "",

email:
p.email ||
getAccountEmail() ||
"",

bio:
p.bio || "",

photo:
p.profile_picture || ""

};


saveLocalProfile(profile);

return profile;

}


/* =========================================
   LOAD PROFILE
========================================= */

async function loadProfile(){

/*
 * First show cached profile immediately
 * if one exists.
 */

const localProfile =
getLocalProfile();

if(localProfile){

showProfile(localProfile);

}


/*
 * Then get the real profile from
 * PostgreSQL through the backend.
 */

try{

const profile =
await loadMyProfile();

if(profile){

showProfile(profile);

return;

}


/*
 * No token/profile.
 * If we have no cached profile,
 * show the editor.
 */

if(!localProfile){

showCreateProfile();

}

}catch(error){

console.error(
"Profile loading failed:",
error
);


/*
 * If authentication is missing,
 * don't destroy the cached profile.
 */

if(
error.message ===
"AUTH_REQUIRED"
){

if(!localProfile){

showCreateProfile();

}

return;

}


/*
 * If backend temporarily fails,
 * keep local profile if available.
 */

if(!localProfile){

showCreateProfile();

}

}

}


/* =========================================
   PAGE READY
========================================= */

window.addEventListener(
"DOMContentLoaded",
function(){

loadProfile();

})
  // =========================================
// PASSWORD SECTION
// =========================================

function togglePasswordSection(){

    const box =
        document.getElementById("passwordSection");

    if(!box){
        return;
    }

    box.style.display =
        box.style.display === "block"
            ? "none"
            : "block";

}


// =========================================
// CHANGE PASSWORD
// USES CANVAS BACKEND
// =========================================

async function changePassword(){

    const current =
        document.getElementById(
            "currentPassword"
        ).value.trim();

    const newPass =
        document.getElementById(
            "newPassword"
        ).value;

    const confirm =
        document.getElementById(
            "confirmNewPassword"
        ).value;


    if(!current || !newPass || !confirm){

        alert(
            "Please fill in all password fields."
        );

        return;

    }


    if(newPass.length < 8){

        alert(
            "Password must be at least 8 characters."
        );

        return;

    }


    if(newPass !== confirm){

        alert(
            "Passwords do not match."
        );

        return;

    }


    const token =
        localStorage.getItem(
            "canvasToken"
        );


    if(!token){

        alert(
            "You are not logged in. Please log in again."
        );

        window.location.href =
            "login.html";

        return;

    }


    try{

        const response =
            await fetch(
                API + "/api/change-password",
                {
                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token
                    },

                    body: JSON.stringify({

                        currentPassword:
                            current,

                        newPassword:
                            newPass

                    })
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            alert(
                data.message ||
                "Unable to change password."
            );

            return;

        }


        alert(
            "Password changed successfully."
        );


        document.getElementById(
            "currentPassword"
        ).value = "";


        document.getElementById(
            "newPassword"
        ).value = "";


        document.getElementById(
            "confirmNewPassword"
        ).value = "";


        document.getElementById(
            "passwordSection"
        ).style.display = "none";


    }catch(error){

        console.error(
            "Change password error:",
            error
        );

        alert(
            "Unable to connect to Canvas server."
        );

    }

}


// =========================================
// LOG OUT
// =========================================

function logout(){

    localStorage.removeItem(
        "canvasToken"
    );

    localStorage.removeItem(
        "canvasLoggedIn"
    );

    localStorage.removeItem(
        "canvasCurrentUser"
    );

    localStorage.removeItem(
        "canvasAccount"
    );

    localStorage.removeItem(
        "canvasProfile"
    );


    window.location.href =
        "login.html";

}


// =========================================
// SAVE PROFILE
// USES CANVAS BACKEND
// =========================================

async function saveProfile(){

    const displayName =
        document.getElementById(
            "displayName"
        ).value.trim();

    const username =
        document.getElementById(
            "username"
        ).value.trim();

    const bio =
        document.getElementById(
            "bio"
        ).value.trim();


    if(displayName === ""){

        alert(
            "Please enter your display name."
        );

        return;

    }


    if(username === ""){

        alert(
            "Please choose a username."
        );

        return;

    }


    let finalUsername =
        username.replace(/^@/, "").trim();


    if(finalUsername === ""){

        alert(
            "Please choose a username."
        );

        return;

    }


    if(
        !/^[a-zA-Z0-9_.]+$/.test(
            finalUsername
        )
    ){

        alert(
            "Username can only contain letters, numbers, underscores and dots."
        );

        return;

    }


    const token =
        localStorage.getItem(
            "canvasToken"
        );


    if(!token){

        alert(
            "You are not logged in. Please log in again."
        );

        window.location.href =
            "login.html";

        return;

    }


    const saveButton =
        document.getElementById(
            "saveProfileButton"
        );


    if(saveButton){

        saveButton.disabled =
            true;

        saveButton.textContent =
            "Saving...";

    }


    try{

        const response =
            await fetch(
                API + "/api/profile",
                {
                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token

                    },

                    body: JSON.stringify({

                        name:
                            displayName,

                        username:
                            finalUsername,

                        bio:
                            bio,

                        profile_picture:
                            selectedPhoto || ""

                    })

                }
            );


        const data =
            await response.json();


        if(!response.ok){

            alert(
                data.message ||
                "Unable to save profile."
            );

            return;

        }


        const serverUser =
            data.user || {};


        const profile = {

            name:
                serverUser.name ||
                displayName,

            username:
                "@" +
                (
                    serverUser.username ||
                    finalUsername
                ).replace(/^@/, ""),

            email:
                serverUser.email ||
                getAccountEmail(),

            bio:
                serverUser.bio !== undefined
                    ? serverUser.bio
                    : bio,

            photo:
                serverUser.profile_picture !== undefined
                    ? serverUser.profile_picture
                    : (selectedPhoto || "")

        };


        localStorage.setItem(
            "canvasProfile",
            JSON.stringify(profile)
        );


        // Keep local account information
        // synchronized without changing
        // the password.

        const savedAccount =
            localStorage.getItem(
                "canvasAccount"
            );


        if(savedAccount){

            try{

                const account =
                    JSON.parse(
                        savedAccount
                    );


                account.name =
                    profile.name;

                account.displayName =
                    profile.name;

                account.username =
                    profile.username.replace(
                        /^@/,
                        ""
                    );

                account.email =
                    profile.email;


                localStorage.setItem(
                    "canvasAccount",
                    JSON.stringify(account)
                );

            }catch(error){

                console.error(
                    "Account sync failed:",
                    error
                );

            }

        }


        selectedPhoto =
            profile.photo || "";


        showProfile(
            profile
        );


    }catch(error){

        console.error(
            "Save profile error:",
            error
        );

        alert(
            "Unable to connect to Canvas server."
        );

    }finally{

        if(saveButton){

            saveButton.disabled =
                false;

            saveButton.textContent =
                "Save Profile";

        }

    }

}


// =========================================
// UPDATE BOTTOM PROFILE ICON
// =========================================

function updateBottomIcon(profile){

    const icon =
        document.getElementById(
            "bottomProfileIcon"
        );


    if(!icon){

        return;

    }


    icon.innerHTML = "";


    if(
        profile &&
        profile.photo
    ){

        const img =
            document.createElement(
                "img"
            );


        img.id =
            "bottomProfileImage";


        img.src =
            profile.photo;


        img.alt =
            "Profile";


        icon.appendChild(
            img
        );

    }else{

        icon.textContent =
            "⬤";

    }

}


// =========================================
// PROFILE PAGE CLEANUP
// =========================================

window.addEventListener(
    "beforeunload",
    function(){

        const input =
            document.getElementById(
                "photoInput"
            );


        if(input){

            input.value =
                "";

        }

    }
);


</script>
