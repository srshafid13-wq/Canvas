<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Canvas Profile</title>

<style>

/* =========================================
   CANVAS PROFILE
========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}


body {
    background: #ffffff;
    color: #4b3024;
    min-height: 100vh;
    padding-bottom: 90px;
}


/* =========================================
   HEADER
========================================= */

.navbar {
    width: 100%;
    height: 70px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 20px;

    background: #ffffff;

    border-bottom: 1px solid #eeeeee;
}


.logo {
    font-size: 28px;
    font-weight: 800;

    color: #6F4E37;
}


.back {
    width: 40px;
    height: 40px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 30px;

    text-decoration: none;

    color: #6F4E37;
}


/* =========================================
   PROFILE CONTAINER
========================================= */

.profile-container {
    width: 100%;
    max-width: 600px;

    margin: 0 auto;

    padding: 30px 22px;
}


.profile-title {
    font-size: 30px;
    font-weight: 800;

    color: #4b3024;

    margin-bottom: 8px;
}


.profile-subtitle {
    color: #777777;

    font-size: 16px;

    line-height: 1.5;

    margin-bottom: 30px;
}


/* =========================================
   AVATAR
========================================= */

.avatar-section {
    text-align: center;

    margin-bottom: 30px;
}


.avatar {
    width: 110px;
    height: 110px;

    margin: 0 auto;

    border-radius: 50%;

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #f5eee9;

    border: 3px solid #D4A017;

    color: #6F4E37;

    font-size: 0;

    position: relative;
}


.avatar::before {
    content: "";

    width: 34px;
    height: 34px;

    position: absolute;

    top: 22px;

    border-radius: 50%;

    background: #6F4E37;
}


.avatar::after {
    content: "";

    width: 62px;
    height: 32px;

    position: absolute;

    bottom: 17px;

    border-radius: 40px 40px 25px 25px;

    background: #6F4E37;
}


.avatar img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    border-radius: 50%;

    position: relative;

    z-index: 2;
}


.photo-button {
    display: inline-block;

    margin-top: 12px;

    color: #6F4E37;

    font-weight: 700;

    cursor: pointer;
}


.photo-button:active {
    transform: scale(0.97);
}


#photoInput {
    display: none;
}


/* =========================================
   FORM
========================================= */

.form-group {
    margin-bottom: 20px;
}


.form-group label {
    display: block;

    margin-bottom: 8px;

    font-size: 15px;

    font-weight: 700;

    color: #4b3024;
}


.form-group input,
.form-group textarea {
    width: 100%;

    padding: 14px;

    border: 1px solid #dddddd;

    border-radius: 12px;

    background: #fafafa;

    color: #333333;

    font-size: 16px;

    outline: none;
}


.form-group input:focus,
.form-group textarea:focus {
    border-color: #D4A017;

    background: #ffffff;

    box-shadow:
        0 0 0 2px rgba(212, 160, 23, 0.08);
}


.form-group textarea {
    height: 100px;

    resize: none;
}


/* =========================================
   SAVE BUTTON
========================================= */

.save-button {
    width: 100%;

    padding: 15px;

    border: none;

    border-radius: 12px;

    background: #6F4E37;

    color: #ffffff;

    font-size: 17px;

    font-weight: 800;

    cursor: pointer;

    transition: 0.2s ease;
}


.save-button:hover {
    background: #5d4030;

    transform: translateY(-1px);
}


.save-button:active {
    transform: scale(0.98);
}


/* =========================================
   PROFILE VIEW
========================================= */

#profileView {
    display: none;

    text-align: center;
}


.profile-name {
    margin-top: 18px;

    font-size: 28px;

    font-weight: 800;

    color: #4b3024;
}


.profile-username {
    margin-top: 5px;

    color: #777777;
}


.profile-bio {
    max-width: 400px;

    margin: 18px auto;

    line-height: 1.5;

    color: #555555;
}


/* =========================================
   STATS
========================================= */

.stats {
    display: flex;

    justify-content: center;

    gap: 45px;

    margin: 25px 0;
}


.stat strong {
    display: block;

    font-size: 20px;

    color: #4b3024;
}


.stat span {
    font-size: 14px;

    color: #777777;
}


/* =========================================
   ACCOUNT
========================================= */

.account-section {
    margin-top: 30px;

    padding-top: 25px;

    border-top: 1px solid #eeeeee;

    text-align: left;
}


.account-title {
    font-size: 20px;

    font-weight: 800;

    margin-bottom: 18px;
}


.account-item {
    padding: 15px 0;

    border-bottom: 1px solid #eeeeee;
}


.account-label {
    margin-bottom: 5px;

    font-size: 13px;

    color: #777777;
}


.account-value {
    font-size: 16px;

    color: #333333;

    word-break: break-word;
}
  /* =========================================
   PROFILE BUTTONS
========================================= */

.edit-button,
.password-button,
.logout-button {
    width: 100%;

    padding: 13px;

    border-radius: 10px;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;

    margin-top: 12px;

    transition: 0.2s ease;
}


.edit-button {
    border: 1px solid #6F4E37;

    background: #ffffff;

    color: #6F4E37;
}


.edit-button:hover {
    background: #6F4E37;

    color: #ffffff;
}


.password-button {
    border: 1px solid #D4A017;

    background: #ffffff;

    color: #6F4E37;
}


.password-button:hover {
    background: #D4A017;

    color: #ffffff;
}


.logout-button {
    border: 1px solid #dddddd;

    background: #ffffff;

    color: #777777;
}


.logout-button:hover {
    border-color: #6F4E37;

    color: #6F4E37;
}


/* =========================================
   CHANGE PASSWORD
========================================= */

#passwordSection {
    display: none;

    margin-top: 25px;

    padding-top: 20px;

    border-top: 1px solid #eeeeee;

    text-align: left;
}


.password-title {
    font-size: 20px;

    font-weight: 800;

    margin-bottom: 18px;
}


/* =========================================
   BOTTOM NAVIGATION
========================================= */

.bottom-nav {
    position: fixed;

    left: 0;
    bottom: 0;

    width: 100%;

    height: 75px;

    display: flex;

    align-items: center;
    justify-content: space-around;

    background: #ffffff;

    border-top: 2px solid #D4A017;

    z-index: 1000;
}


.bottom-nav a {
    width: 25%;

    height: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 4px;

    color: #8a6b58;

    text-decoration: none;

    font-size: 25px;

    line-height: 1;

    text-align: center;

    transition: 0.2s ease;
}


.bottom-nav a span {
    display: block;

    font-size: 11px;

    font-weight: 700;

    color: #777777;

    margin-top: 2px;

    line-height: 1;
}


.bottom-nav a.active {
    color: #4b3024;
}


.bottom-nav a.active span {
    color: #4b3024;
}


.bottom-nav a:active {
    transform: scale(0.95);
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

    .navbar {
        height: 68px;

        padding: 0 16px;
    }


    .logo {
        font-size: 26px;
    }


    .profile-container {
        padding: 26px 16px 30px;
    }


    .profile-title {
        font-size: 27px;
    }


    .profile-subtitle {
        font-size: 15px;
    }


    .avatar {
        width: 105px;
        height: 105px;
    }


    .bottom-nav {
        height: 70px;
    }


    .bottom-nav a {
        font-size: 24px;
    }


    .bottom-nav a span {
        font-size: 10px;
    }

}

</style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="navbar">

    <a
        href="index.html"
        class="back">

        ‹

    </a>


    <div class="logo">

        Canvas

    </div>


    <div
        style="width:40px;">
    </div>

</header>



<main class="profile-container">


<!-- =========================================
     CREATE / EDIT PROFILE
========================================= -->

<div id="createProfile">

    <h1 class="profile-title">

        Create your profile

    </h1>


    <p class="profile-subtitle">

        Set up your Canvas profile and let people know who you are.

    </p>


    <div class="avatar-section">

        <div
            class="avatar"
            id="avatarPreview">

        </div>


        <label
            class="photo-button"
            for="photoInput">

            Choose profile picture

        </label>


        <input
            type="file"
            id="photoInput"
            accept="image/*">

    </div>


    <div class="form-group">

        <label for="displayName">

            Display name

        </label>


        <input
            type="text"
            id="displayName"
            placeholder="Your name"
            maxlength="30">

    </div>


    <div class="form-group">

        <label for="username">

            Username

        </label>


        <input
            type="text"
            id="username"
            placeholder="@username"
            maxlength="20">

    </div>


    <div class="form-group">

        <label for="bio">

            Bio

        </label>


        <textarea
            id="bio"
            placeholder="Tell people about yourself..."
            maxlength="150">
        </textarea>

    </div>


    <button
        class="save-button"
        onclick="saveProfile()">

        Create Profile

    </button>

</div>



<!-- =========================================
     PROFILE VIEW
========================================= -->

<div id="profileView">


    <div
        class="avatar"
        id="profileAvatar">

    </div>


    <h1
        class="profile-name"
        id="profileName">

    </h1>


    <p
        class="profile-username"
        id="profileUsername">

    </p>


    <p
        class="profile-bio"
        id="profileBio">

    </p>



    <!-- =====================================
         STATS
    ====================================== -->

    <div class="stats">

        <div class="stat">

            <strong>
                0
            </strong>

            <span>
                Followers
            </span>

        </div>


        <div class="stat">

            <strong>
                0
            </strong>

            <span>
                Following
            </span>

        </div>

    </div>



    <!-- =====================================
         ACCOUNT
    ====================================== -->

    <div class="account-section">

        <h2 class="account-title">

            Account

        </h2>


        <div class="account-item">

            <div class="account-label">

                Email

            </div>


            <div
                class="account-value"
                id="accountEmail">

                Not available

            </div>

        </div>


        <div class="account-item">

            <div class="account-label">

                Password

            </div>


            <div class="account-value">

                ••••••••

            </div>

        </div>


        <button
            class="edit-button"
            onclick="editProfile()">

            Edit Profile

        </button>


        <button
            class="password-button"
            onclick="togglePasswordSection()">

            Change Password

        </button>


        <button
            class="logout-button"
            onclick="logout()">

            Log Out

        </button>



        <!-- =================================
             CHANGE PASSWORD
        ================================== -->

        <div
            id="passwordSection">

            <h2 class="password-title">

                Change Password

            </h2>


            <div class="form-group">

                <label for="currentPassword">

                    Current password

                </label>


                <input
                    type="password"
                    id="currentPassword"
                    placeholder="Current password">

            </div>


            <div class="form-group">

                <label for="newPassword">

                    New password

                </label>


                <input
                    type="password"
                    id="newPassword"
                    placeholder="New password"
                    minlength="8">

            </div>


            <div class="form-group">

                <label for="confirmNewPassword">

                    Confirm new password

                </label>


                <input
                    type="password"
                    id="confirmNewPassword"
                    placeholder="Confirm new password"
                    minlength="8">

            </div>


            <button
                class="save-button"
                onclick="changePassword()">

                Save New Password

            </button>

        </div>

    </div>

</div>

</main>



<!-- =========================================
     BOTTOM NAVIGATION
========================================= -->

<nav class="bottom-nav">


    <a href="stream.html">

        ⌂

        <span>
            Home
        </span>

    </a>


    <a href="stream.html">

        ▣

        <span>
            Stream
        </span>

    </a>


    <a href="golive.html">

        ⊙

        <span>
            Go Live
        </span>

    </a>


    <a
        href="profile.html"
        class="active">

        ●

        <span>
            Profile
        </span>

    </a>


</nav>
<script>

/* =========================================
   CANVAS PROFILE SYSTEM
========================================= */

let selectedPhoto = "";


/* =========================================
   GET SAVED PROFILE
========================================= */

function getSavedProfile() {

    const savedProfile =
        localStorage.getItem("canvasProfile");

    if (!savedProfile) {
        return null;
    }

    try {

        return JSON.parse(savedProfile);

    } catch (error) {

        console.error(
            "Could not read Canvas profile.",
            error
        );

        return null;
    }
}


/* =========================================
   LOAD PROFILE
========================================= */

window.addEventListener(
    "DOMContentLoaded",
    function () {

        const profile =
            getSavedProfile();

        if (profile) {

            showProfile(profile);

        }

    }
);


/* =========================================
   PHOTO SELECT
========================================= */

document
    .getElementById("photoInput")
    .addEventListener(
        "change",
        function () {

            const file =
                this.files[0];

            if (!file) {
                return;
            }

            if (!file.type.startsWith("image/")) {

                alert(
                    "Please choose an image file."
                );

                this.value = "";

                return;
            }

            const reader =
                new FileReader();

            reader.onload =
                function (event) {

                    selectedPhoto =
                        event.target.result;

                    const avatarPreview =
                        document.getElementById(
                            "avatarPreview"
                        );

                    avatarPreview.innerHTML = "";

                    const image =
                        document.createElement("img");

                    image.src =
                        selectedPhoto;

                    image.alt =
                        "Profile picture";

                    avatarPreview.appendChild(
                        image
                    );

                };

            reader.readAsDataURL(file);

        }
    );


/* =========================================
   SAVE PROFILE
========================================= */

function saveProfile() {

    const name =
        document
            .getElementById("displayName")
            .value
            .trim();

    const username =
        document
            .getElementById("username")
            .value
            .trim();

    const bio =
        document
            .getElementById("bio")
            .value
            .trim();


    if (name === "") {

        alert(
            "Please enter your display name."
        );

        return;
    }


    if (username === "") {

        alert(
            "Please choose a username."
        );

        return;
    }


    let finalUsername =
        username;

    if (!finalUsername.startsWith("@")) {

        finalUsername =
            "@" + finalUsername;

    }


    const oldProfile =
        getSavedProfile();


    /*
       Keep the existing picture
       if the user does not select
       a new one while editing.
    */

    if (
        !selectedPhoto &&
        oldProfile &&
        oldProfile.photo
    ) {

        selectedPhoto =
            oldProfile.photo;

    }


    const profile = {

        name: name,

        username: finalUsername,

        bio: bio,

        photo: selectedPhoto || ""

    };


    /* SAVE PROFILE */

    localStorage.setItem(
        "canvasProfile",
        JSON.stringify(profile)
    );


    /* SHOW PROFILE */

    showProfile(profile);

}


/* =========================================
   SHOW PROFILE
========================================= */

function showProfile(profile) {

    if (!profile) {
        return;
    }


    document
        .getElementById("createProfile")
        .style.display = "none";


    document
        .getElementById("profileView")
        .style.display = "block";


    document
        .getElementById("profileName")
        .textContent =
        profile.name || "";


    document
        .getElementById("profileUsername")
        .textContent =
        profile.username || "";


    document
        .getElementById("profileBio")
        .textContent =
        profile.bio ||
        "No bio yet.";


    /* =====================================
       PROFILE PHOTO
    ===================================== */

    const profileAvatar =
        document.getElementById(
            "profileAvatar"
        );

    profileAvatar.innerHTML = "";


    if (profile.photo) {

        const image =
            document.createElement("img");

        image.src =
            profile.photo;

        image.alt =
            "Profile picture";

        profileAvatar.appendChild(
            image
        );

    } else {

        profileAvatar.textContent =
            "⬤";

    }


    /* =====================================
       ACCOUNT EMAIL
    ===================================== */

    const savedAccount =
        localStorage.getItem(
            "canvasAccount"
        );


    if (savedAccount) {

        try {

            const account =
                JSON.parse(savedAccount);

            document
                .getElementById("accountEmail")
                .textContent =
                account.email ||
                "Not available";

        }

        catch (error) {

            console.error(
                "Could not read account.",
                error
            );

        }

    }

}


/* =========================================
   EDIT PROFILE
========================================= */

function editProfile() {

    const profile =
        getSavedProfile();

    if (!profile) {
        return;
    }


    document
        .getElementById("createProfile")
        .style.display = "block";


    document
        .getElementById("profileView")
        .style.display = "none";


    document
        .getElementById("displayName")
        .value =
        profile.name || "";


    document
        .getElementById("username")
        .value =
        profile.username || "";


    document
        .getElementById("bio")
        .value =
        profile.bio || "";


    selectedPhoto =
        profile.photo || "";


    const avatarPreview =
        document.getElementById(
            "avatarPreview"
        );

    avatarPreview.innerHTML = "";


    if (profile.photo) {

        const image =
            document.createElement("img");

        image.src =
            profile.photo;

        image.alt =
            "Profile picture";

        avatarPreview.appendChild(
            image
        );

    } else {

        avatarPreview.textContent =
            "⬤";

    }

}


/* =========================================
   CHANGE PASSWORD
========================================= */

function togglePasswordSection() {

    const section =
        document.getElementById(
            "passwordSection"
        );


    if (!section) {
        return;
    }


    if (
        section.style.display ===
        "block"
    ) {

        section.style.display =
            "none";

    } else {

        section.style.display =
            "block";

    }

}


function changePassword() {

    const currentPassword =
        document
            .getElementById(
                "currentPassword"
            )
            .value;


    const newPassword =
        document
            .getElementById(
                "newPassword"
            )
            .value;


    const confirmPassword =
        document
            .getElementById(
                "confirmNewPassword"
            )
            .value;


    const savedAccount =
        localStorage.getItem(
            "canvasAccount"
        );


    if (!savedAccount) {

        alert(
            "No Canvas account found."
        );

        return;
    }


    let account;


    try {

        account =
            JSON.parse(savedAccount);

    }

    catch (error) {

        alert(
            "Could not read Canvas account."
        );

        return;
    }


    if (
        currentPassword !==
        account.password
    ) {

        alert(
            "Current password is incorrect."
        );

        return;
    }


    if (newPassword.length < 8) {

        alert(
            "New password must be at least 8 characters."
        );

        return;
    }


    if (
        newPassword !==
        confirmPassword
    ) {

        alert(
            "New passwords do not match."
        );

        return;
    }


    account.password =
        newPassword;


    localStorage.setItem(
        "canvasAccount",
        JSON.stringify(account)
    );


    alert(
        "Password changed successfully."
    );


    document
        .getElementById(
            "currentPassword"
        )
        .value = "";


    document
        .getElementById(
            "newPassword"
        )
        .value = "";


    document
        .getElementById(
            "confirmNewPassword"
        )
        .value = "";


    document
        .getElementById(
            "passwordSection"
        )
        .style.display = "none";

}


/* =========================================
   LOG OUT
========================================= */

function logout() {

    localStorage.removeItem(
        "canvasLoggedIn"
    );

    window.location.href =
        "login.html";

}

</script>

</body>
  </html>
