<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Canvas Profile</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box
}

body{
background:#fff;
color:#4b3326;
font-family:Arial,Helvetica,sans-serif;
min-height:100vh;
padding-bottom:90px
}

.navbar{
height:72px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 22px;
border-bottom:1px solid #eee
}

.logo{
font-size:34px;
font-weight:800;
color:#6F4E37
}

.back{
width:40px;
height:40px;
display:flex;
align-items:center;
justify-content:center;
font-size:34px;
color:#6F4E37;
text-decoration:none
}

.header-space{
width:40px
}

.profile-container{
width:100%;
max-width:650px;
margin:auto;
padding:30px 22px 110px
}

.profile-title{
font-size:30px;
font-weight:800;
margin-bottom:8px
}

.profile-subtitle{
color:#777;
font-size:16px;
line-height:1.5;
margin-bottom:30px
}

.avatar-section{
text-align:center;
margin-bottom:30px
}

.avatar{
width:110px;
height:110px;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
overflow:hidden;
background:#f1f1f1;
border:3px solid #D4A017;
color:#6F4E37;
font-size:48px
}

.avatar img{
width:100%;
height:100%;
object-fit:cover
}

.photo-actions{
display:flex;
justify-content:center;
gap:18px;
margin-top:12px
}

.photo-button{
color:#6F4E37;
font-size:15px;
font-weight:700;
cursor:pointer
}

.delete-photo-button{
border:0;
background:none;
color:#b44a3c;
font-size:15px;
font-weight:700;
cursor:pointer;
display:none
}

#photoInput{
display:none
}

.form-group{
margin-bottom:20px
}

.form-group label{
display:block;
margin-bottom:8px;
font-size:15px;
font-weight:700
}

.form-group input,
.form-group textarea{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:12px;
background:#fafafa;
font-size:16px;
outline:none
}

.form-group textarea{
height:100px;
resize:none
}

.form-group input:focus,
.form-group textarea:focus{
border-color:#D4A017;
background:#fff
}

.save-button{
width:100%;
padding:15px;
border:0;
border-radius:12px;
background:#6F4E37;
color:#fff;
font-size:17px;
font-weight:700;
cursor:pointer
}

.save-button:disabled{
opacity:.6;
cursor:not-allowed
}

#createProfile{
display:none
}

#profileView{
display:none;
text-align:center
}

.profile-name{
margin-top:18px;
font-size:28px;
font-weight:800
}

.profile-username{
margin-top:5px;
color:#777;
font-size:18px
}

.profile-bio{
max-width:400px;
margin:18px auto;
color:#555;
font-size:17px;
line-height:1.5
}

.stats{
display:flex;
justify-content:center;
gap:60px;
margin:25px 0;
padding-bottom:25px;
border-bottom:1px solid #eee
}

.stat strong{
display:block;
font-size:24px
}

.stat span{
display:block;
margin-top:5px;
color:#777;
font-size:15px
}

.account-section{
margin-top:25px;
text-align:left
}

.account-title{
margin-bottom:20px;
font-size:28px;
font-weight:800
}

.account-item{
padding:16px 0;
border-bottom:1px solid #eee
}

.account-label{
margin-bottom:6px;
color:#777;
font-size:14px
}

.account-value{
color:#333;
font-size:17px;
word-break:break-word
}

.edit-button,
.password-button,
.logout-button{
width:100%;
padding:14px;
margin-top:12px;
border-radius:10px;
font-size:15px;
font-weight:700;
cursor:pointer
}

.edit-button{
border:1px solid #6F4E37;
background:#fff;
color:#6F4E37
}

.password-button{
border:1px solid #D4A017;
background:#fff;
color:#6F4E37
}

.logout-button{
border:1px solid #ddd;
background:#fff;
color:#777
}

#passwordSection{
display:none;
margin-top:25px;
padding-top:20px;
border-top:1px solid #eee
}

.password-title{
margin-bottom:18px;
font-size:20px
}

.bottom-nav{
position:fixed;
left:0;
bottom:0;
width:100%;
height:75px;
display:flex;
background:#fff;
border-top:2px solid #d4a62a;
z-index:1000
}

.bottom-nav a{
flex:1;
height:100%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:4px;
color:#8a6b58;
font-size:23px;
text-decoration:none
}

.bottom-nav a span{
font-size:11px;
font-weight:700
}

.bottom-nav a.active{
color:#4b3326
}

#bottomProfileIcon{
width:25px;
height:25px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
border-radius:50%
}

#bottomProfileImage{
width:23px;
height:23px;
object-fit:cover;
border-radius:50%;
border:1.5px solid #d4a62a
}

@media(max-width:600px){

.navbar{
height:68px;
padding:0 16px
}

.logo{
font-size:30px
}

.profile-container{
padding:30px 22px 110px
}

.profile-title{
font-size:28px
}

.stats{
gap:55px
}

.bottom-nav{
height:70px
}

}

</style>

</head>

<body>

<header class="navbar">

<a
href="stream.html"
class="back">
‹
</a>

<div class="logo">
Canvas
</div>

<div class="header-space"></div>

</header>

<main class="profile-container">

<section id="createProfile">

<h1
class="profile-title"
id="formTitle">
Create your profile
</h1>

<p
class="profile-subtitle"
id="formSubtitle">
Set up your Canvas profile and let people know who you are.
</p>

<div class="avatar-section">

<div
class="avatar"
id="avatarPreview">
⬤
</div>

<div class="photo-actions">

<label
class="photo-button"
for="photoInput">
Choose profile picture
</label>

type="button"
class="delete-photo-button"
id="deletePhotoButton"
onclick="deleteProfilePhoto()">
Delete picture
</button>

</div>

<input
type="file"
id="photoInput"
accept="image/*">

</div>

<div class="form-group">

<label for="displayName">
Display name
</label>

<input
type="text"
id="displayName"
placeholder="Your name"
maxlength="30">

</div>

<div class="form-group">

Username

<input

Bio
</label>

id="bio"
placeholder="Tell people about yourself..."

<button
type="button"

onclick="saveProfile()">
Save Profile
</button>

</section>

<section id="profileView">

<div
class="avatar"
id="profileAvatar">

</div>

<h1
class="profile-name"
id="profileName">
Canvas Creator
</h1>

<p
class="profile-username"
id="profileUsername">
@username
</p>

<p
class="profile-bio"
id="profileBio">
No bio yet.
</p>

<div class="stats">

<div class="stat">

<strong id="followersCount">
0
</strong>

<span>
Followers
</span>

</div>

<div class="stat">

<strong id="followingCount">
0
</strong>

<span>
Following
</span>

</div>

</div>

<section class="account-section">

<h2 class="account-title">
Account
</h2>

<div class="account-item">

<div class="account-label">
Email
</div>

<div
class="account-value"
id="accountEmail">
Not available
</div>

</div>

<div class="account-item">

<div class="account-label">
Password
</div>

<div class="account-value">
••••••••
</div>

</div>

<button
class="edit-button"
onclick="editProfile()">
Edit Profile
</button>

<button
class="password-button"
onclick="togglePasswordSection()">
Change Password
</button>

<button
class="logout-button"
onclick="logout()">
Log Out
</button>

<div id="passwordSection">

<h2 class="password-title">
Change Password
</h2>

<div class="form-group">

<label>
Current password
</label>

<input
type="password"
id="currentPassword"
autocomplete="current-password">

</div>

<div class="form-group">

<label>
New password
</label>

<input
type="password"
id="newPassword"
autocomplete="new-password">

</div>

<div class="form-group">

<label>
Confirm password
</label>

<input
type="password"
id="confirmNewPassword"
autocomplete="new-password">

</div>

<button
class="save-button"
onclick="changePassword()">
Save New Password
</button>

</div>

</section>

</section>

</main>

<nav class="bottom-nav">

<!-- =========================================
     JAVASCRIPT
========================================= -->

<script>

const API =
"https://canvas-kh9p.onrender.com";

let selectedPhoto = "";


/* =========================================
   GET ACCOUNT
========================================= */

function getAccount(){

const saved =
localStorage.getItem(
"canvasAccount"
);

if(!saved){

return {};

}

try{

return JSON.parse(saved);

}catch(error){

console.error(
"Account data error:",
error
);

return {};

}

}


/* =========================================
   GET ACCOUNT EMAIL
   -----------------------------------------
   Checks the existing account object
   for the email in several possible
   locations.
========================================= */

function getAccountEmail(){

const account =
getAccount();

const email =
account.email ||
account.user?.email ||
account.account?.email ||
account.data?.email ||
"";

if(
typeof email !== "string"
){

return "";

}

return email.trim();

}


/* =========================================
   GET ACCOUNT USERNAME
========================================= */

function getUsername(){

const account =
getAccount();

return String(
account.username ||
account.user?.username ||
account.account?.username ||
""
).replace(
/^@/,
""
);


/* =========================================
   GET SAVED PROFILE
========================================= */

function getSavedProfile(){

const saved =
localStorage.getItem(
"canvasProfile"
);

if(!saved){

return {};

}

try{

return JSON.parse(saved);

}catch(error){

console.error(
"Profile data error:",
error
);

return {};

}

}


/* =========================================
   GET PROFILE EMAIL
   -----------------------------------------
   Uses profile email first, then the
   account email.
========================================= */

function getProfileEmail(profile){

const profileEmail =
profile &&
typeof profile.email === "string"
? profile.email.trim()
: "";

if(profileEmail){

return profileEmail;

}

return getAccountEmail();

}


/* =========================================
   SHOW CREATE PROFILE
========================================= */

function showCreateProfile(){

document.getElementById(
"profileView"
).style.display =
"none";

document.getElementById(
"createProfile"
).style.display =
"block";

}
  <!-- =========================================
     SHOW PROFILE
========================================= -->

function showProfile(profile){

document.getElementById(
"profileView"
).style.display =
"block";

document.getElementById(
"createProfile"
).style.display =
"none";


document.getElementById(
"profileName"
).textContent =
profile.name ||
"Canvas Creator";


document.getElementById(
"profileUsername"
).textContent =
profile.username ||
"@username";


document.getElementById(
"profileBio"
).textContent =
profile.bio ||
"No bio yet.";


/* -----------------------------------------
   EMAIL
----------------------------------------- */

const email =
getProfileEmail(profile);


document.getElementById(
"accountEmail"
).textContent =
email ||
"Not available";


/* -----------------------------------------
   AVATAR
----------------------------------------- */

const avatar =
document.getElementById(
"profileAvatar"
);

avatar.innerHTML = "";


if(profile.photo){

const img =
document.createElement("img");

img.src =
profile.photo;

img.alt =
"Profile picture";

avatar.appendChild(img);

}else{

avatar.textContent =
"⬤";

}


updateBottomIcon(profile);

}


/* =========================================
   LOAD PROFILE
========================================= */

async function loadProfile(){

const username =
getUsername();


const account =
getAccount();


const accountEmail =
getAccountEmail();


const saved =
localStorage.getItem(
"canvasProfile"
);


/* -----------------------------------------
   SHOW LOCAL PROFILE FIRST
----------------------------------------- */

if(saved){

try{

const localProfile =
JSON.parse(saved);


/*
 * If the old local profile does not have
 * an email, add the account email to it.
 */

if(
!localProfile.email &&
accountEmail
){

localProfile.email =
accountEmail;

localStorage.setItem(
"canvasProfile",
JSON.stringify(localProfile)
);

}


showProfile(
localProfile
);


}catch(error){

console.error(
"Local profile error:",
error
);

}

}


/* -----------------------------------------
   NO ACCOUNT USERNAME
----------------------------------------- */

if(!username){

if(!saved){

showCreateProfile();

}

return;

}


/* -----------------------------------------
   LOAD FROM SERVER
----------------------------------------- */

try{

const res =
await fetch(

API +
"/api/profile/" +
encodeURIComponent(username),

{
method:"GET",
cache:"no-store"
}

);


if(!res.ok){

throw new Error(
"Profile request failed"
);

}


const data =
await res.json();


if(
!data ||
!data.profile
){

throw new Error(
"Profile data missing"
);

}


const p =
data.profile;


const cleanUsername =
String(
p.username ||
username
).replace(
/^@/,
""
);


/* -----------------------------------------
   FIND EMAIL
   -----------------------------------------
   Priority:

   1. Server profile email
   2. Existing local account email
   3. Existing local profile email
----------------------------------------- */

const serverEmail =
typeof p.email === "string"
? p.email.trim()
: "";


const oldProfile =
saved
? getSavedProfile()
: {};


const profileEmail =
serverEmail ||
accountEmail ||
getProfileEmail(oldProfile) ||
"";


/* -----------------------------------------
   BUILD PROFILE
----------------------------------------- */

const profile = {

name:
p.name || "",

username:
"@" + cleanUsername,

email:
profileEmail,

bio:
p.bio || "",

photo:
p.profile_picture || ""

};


/* -----------------------------------------
   SAVE PROFILE LOCALLY
----------------------------------------- */

localStorage.setItem(
"canvasProfile",
JSON.stringify(profile)
);


/* -----------------------------------------
   SHOW PROFILE
----------------------------------------- */

showProfile(profile);


}catch(error){

console.error(
"Profile loading failed:",
error
);


/*
 * Keep local profile visible if the
 * server cannot be reached.
 */

if(!saved){

showCreateProfile();

}

}

}


/* =========================================
   PAGE READY
========================================= */

window.addEventListener(
"DOMContentLoaded",
function(){

loadProfile();

});


/* =========================================
   PHOTO SELECT
========================================= */

document.getElementById(
"photoInput"
).addEventListener(
"change",
function(){

const file =
this.files[0];

if(!file){

return;

}


/* -----------------------------------------
   CHECK IMAGE
----------------------------------------- */

if(
!file.type.startsWith(
"image/"
)
){

alert(
"Please choose an image."
);

this.value =
"";

return;

}


/* -----------------------------------------
   READ IMAGE
----------------------------------------- */

const reader =
new FileReader();


reader.onload =
function(event){

selectedPhoto =
event.target.result;


document.getElementById(
"avatarPreview"
).innerHTML =
`<img
src="${selectedPhoto}"
alt="Profile picture">`;


document.getElementById(
"deletePhotoButton"
).style.display =
"inline-block";

};


reader.readAsDataURL(file);

});


/* =========================================
   DELETE PROFILE PHOTO
========================================= */

function deleteProfilePhoto(){

selectedPhoto = "";


document.getElementById(
"photoInput"
).value =
"";


document.getElementById(
"avatarPreview"
).textContent =
"⬤";


document.getElementById(
"deletePhotoButton"
).style.display =
"none";

}


/* =========================================
   SAVE PROFILE
========================================= */

async function saveProfile(){

const name =
document.getElementById(
"displayName"
).value.trim();


let username =
document.getElementById(
"username"
).value.trim();


const bio =
document.getElementById(
"bio"
).value.trim();


if(
!name ||
!username
){

alert(
"Name and username are required."
);

return;

}


username =
username.replace(
/^@/,
""
);


if(!username){

alert(
"Please enter a username."
);

return;

}


const account =
getAccount();


const accountEmail =
getAccountEmail();


const button =
document.getElementById(
"saveProfileButton"
);


button.disabled =
true;

button.textContent =
"Saving...";


try{

const res =
await fetch(

API +
"/api/profile/" +
encodeURIComponent(username),

{

method:"PUT",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({

name:name,

bio:bio,

profile_picture:
selectedPhoto || ""

})

}

);


if(!res.ok){

const errorData =
await res.json().catch(
function(){
return {};
}
);

throw new Error(
errorData.message ||
"Profile save failed"
);

}


const data =
await res.json();


const serverProfile =
data.profile || {};


/* -----------------------------------------
   KEEP EXISTING PHOTO
----------------------------------------- */

const savedPhoto =
serverProfile.profile_picture !==
undefined
? serverProfile.profile_picture
: selectedPhoto;


/* -----------------------------------------
   KEEP EMAIL
----------------------------------------- */

const serverEmail =
typeof serverProfile.email === "string"
? serverProfile.email.trim()
: "";


const finalEmail =
serverEmail ||
accountEmail ||
getProfileEmail(
getSavedProfile()
) ||
"";


/* -----------------------------------------
   CREATE LOCAL PROFILE
----------------------------------------- */

const profile = {

name:name,

username:
"@" + username,

email:
finalEmail,

bio:bio,

photo:
savedPhoto || ""

};


/* -----------------------------------------
   SAVE LOCAL PROFILE
----------------------------------------- */

localStorage.setItem(
"canvasProfile",
JSON.stringify(profile)
);


/* -----------------------------------------
   SHOW PROFILE
----------------------------------------- */

showProfile(profile);


}catch(error){

console.error(
"Profile save error:",
error
);

alert(
"Could not save profile to Canvas server."
);

}finally{

button.disabled =
false;

button.textContent =
"Save Profile";

}

}


/* =========================================
   UPDATE BOTTOM PROFILE ICON
========================================= */

function updateBottomIcon(profile){

const icon =
document.getElementById(
"bottomProfileIcon"
);

if(!icon){

return;

}


icon.innerHTML = "";


if(profile.photo){

const img =
document.createElement("img");

img.id =
"bottomProfileImage";

img.src =
profile.photo;

img.alt =
"Profile picture";

icon.appendChild(img);

}else{

icon.textContent =
"⬤";

}

}


/* =========================================
   EDIT PROFILE
========================================= */

function editProfile(){

const saved =
localStorage.getItem(
"canvasProfile"
);


if(!saved){

showCreateProfile();

return;

}


try{

const p =
JSON.parse(saved);


document.getElementById(
"profileView"
).style.display =
"none";


document.getElementById(
"createProfile"
).style.display =
"block";


document.getElementById(
"formTitle"
).textContent =
"Edit your profile";


document.getElementById(
"formSubtitle"
).textContent =
"Update your Canvas profile.";


document.getElementById(
"displayName"
).value =
p.name || "";


document.getElementById(
"username"
).value =
p.username || "";


document.getElementById(
"bio"
).value =
p.bio || "";


selectedPhoto =
p.photo || "";


/* -----------------------------------------
   PROFILE PHOTO
----------------------------------------- */

if(selectedPhoto){

document.getElementById(
"avatarPreview"
).innerHTML =
`<img
src="${selectedPhoto}"
alt="Profile picture">`;


document.getElementById(
"deletePhotoButton"
).style.display =
"inline-block";

}else{

document.getElementById(
"avatarPreview"
).textContent =
"⬤";


document.getElementById(
"deletePhotoButton"
).style.display =
"none";

}

}catch(error){

console.error(
"Edit profile error:",
error
);

showCreateProfile();

}

  }
  <!-- =========================================
     PASSWORD SECTION
========================================= -->

function togglePasswordSection(){

const box =
document.getElementById(
"passwordSection"
);

box.style.display =
box.style.display === "block"
? "none"
: "block";

}


/* =========================================
   CHANGE PASSWORD
========================================= */

function changePassword(){

const current =
document.getElementById(
"currentPassword"
).value;

const newPass =
document.getElementById(
"newPassword"
).value;

const confirm =
document.getElementById(
"confirmNewPassword"
).value;


const saved =
localStorage.getItem(
"canvasAccount"
);


if(!saved){

alert(
"No account found."
);

return;

}


let account;

try{

account =
JSON.parse(saved);

}catch(error){

alert(
"Account data is invalid."
);

return;

}


/* -----------------------------------------
   CURRENT PASSWORD
----------------------------------------- */

if(
current !==
account.password
){

alert(
"Current password is incorrect."
);

return;

}


/* -----------------------------------------
   PASSWORD LENGTH
----------------------------------------- */

if(
newPass.length < 8
){

alert(
"Password must be at least 8 characters."
);

return;

}


/* -----------------------------------------
   CONFIRM PASSWORD
----------------------------------------- */

if(
newPass !==
confirm
){

alert(
"Passwords do not match."
);

return;

}


/* -----------------------------------------
   SAVE PASSWORD
----------------------------------------- */

account.password =
newPass;


localStorage.setItem(
"canvasAccount",
JSON.stringify(account)
);


alert(
"Password changed successfully."
);


/* -----------------------------------------
   CLEAR FIELDS
----------------------------------------- */

document.getElementById(
"currentPassword"
).value =
"";


document.getElementById(
"newPassword"
).value =
"";


document.getElementById(
"confirmNewPassword"
).value =
"";


document.getElementById(
"passwordSection"
).style.display =
"none";

}


/* =========================================
   LOG OUT
========================================= */

function logout(){

localStorage.removeItem(
"canvasLoggedIn"
);

window.location.href =
"login.html";

}


/* =========================================
   PROFILE PAGE CLEANUP
========================================= */

window.addEventListener(
"beforeunload",
function(){

const input =
document.getElementById(
"photoInput"
);

if(input){

input.value =
"";

}

});

</script>
