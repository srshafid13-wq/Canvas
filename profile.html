<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Canvas Profile</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#fff;
    color:#4b3326;
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    padding-bottom:90px;
}

.navbar{
    height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    background:#fff;
    border-bottom:1px solid #eee;
}

.logo{
    font-size:34px;
    font-weight:800;
    color:#6F4E37;
}

.back{
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#6F4E37;
    font-size:34px;
    text-decoration:none;
}

.header-space{
    width:40px;
}

.profile-container{
    width:100%;
    max-width:650px;
    margin:auto;
    padding:30px 22px 110px;
}

.profile-title{
    font-size:30px;
    font-weight:800;
    margin-bottom:8px;
}

.profile-subtitle{
    color:#777;
    font-size:16px;
    line-height:1.5;
    margin-bottom:30px;
}

.avatar-section{
    text-align:center;
    margin-bottom:30px;
}

.avatar{
    width:110px;
    height:110px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    overflow:hidden;
    background:#f1f1f1;
    border:3px solid #D4A017;
    color:#6F4E37;
    font-size:48px;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.default-avatar{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f1f1f1;
}

.default-avatar svg{
    width:58%;
    height:58%;
}

.photo-actions{
    display:flex;
    justify-content:center;
    gap:18px;
    margin-top:12px;
}

.photo-button{
    color:#6F4E37;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

.delete-photo-button{
    border:0;
    background:none;
    color:#b44a3c;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    display:none;
}

#photoInput{
    display:none;
}

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    color:#4b3326;
    font-size:15px;
    font-weight:700;
}

.form-group input,
.form-group textarea{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    background:#fafafa;
    color:#333;
    font-size:16px;
    outline:none;
}

.form-group textarea{
    height:100px;
    resize:none;
}

.form-group input:focus,
.form-group textarea:focus{
    border-color:#D4A017;
    background:#fff;
}

.save-button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:12px;
    background:#6F4E37;
    color:#fff;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
}

.save-button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#profileView{
    display:none;
    text-align:center;
}

.profile-name{
    margin-top:18px;
    color:#4b3326;
    font-size:28px;
    font-weight:800;
}

.profile-username{
    margin-top:5px;
    color:#777;
    font-size:18px;
}

.profile-bio{
    max-width:400px;
    margin:18px auto;
    color:#555;
    font-size:17px;
    line-height:1.5;
}

.stats{
    display:flex;
    justify-content:center;
    gap:60px;
    margin:25px 0;
    padding-bottom:25px;
    border-bottom:1px solid #eee;
}

.stat{
    min-width:90px;
}

.stat strong{
    display:block;
    color:#4b3326;
    font-size:24px;
}

.stat span{
    display:block;
    margin-top:5px;
    color:#777;
    font-size:15px;
}

.account-section{
    margin-top:25px;
    text-align:left;
}

.account-title{
    margin-bottom:20px;
    font-size:28px;
}

.account-item{
    padding:16px 0;
    border-bottom:1px solid #eee;
}

.account-label{
    margin-bottom:6px;
    color:#777;
    font-size:14px;
}

.account-value{
    color:#333;
    font-size:17px;
    word-break:break-word;
}

.edit-button,
.password-button,
.logout-button{
    width:100%;
    padding:14px;
    margin-top:12px;
    border-radius:10px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

.edit-button{
    border:1px solid #6F4E37;
    background:#fff;
    color:#6F4E37;
}

.password-button{
    border:1px solid #D4A017;
    background:#fff;
    color:#6F4E37;
}

.logout-button{
    border:1px solid #ddd;
    background:#fff;
    color:#777;
}

#passwordSection{
    display:none;
    margin-top:25px;
    padding-top:20px;
    border-top:1px solid #eee;
}

.password-title{
    margin-bottom:18px;
    font-size:20px;
}

.bottom-nav{
    position:fixed;
    left:0;
    bottom:0;
    width:100%;
    height:75px;
    display:flex;
    background:#fff;
    border-top:2px solid #d4a62a;
    z-index:1000;
}

.bottom-nav a{
    position:relative;
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    color:#8a6b58;
    font-size:23px;
    text-decoration:none;
}

.bottom-nav a span{
    font-size:11px;
    font-weight:700;
}

.bottom-nav a.active{
    color:#4b3326;
}

.bottom-nav a.active::before,
.bottom-nav a.active::after{
    content:none !important;
    display:none !important;
}

.explore-icon{
    width:23px;
    height:23px;
    display:block;
}

.bottom-profile-image{
    width:23px;
    height:23px;
    object-fit:cover;
    border-radius:50%;
    border:1.5px solid #d4a62a;
}

@media(max-width:600px){

    .navbar{
        height:68px;
        padding:0 16px;
    }

    .logo{
        font-size:30px;
    }

    .profile-container{
        padding:30px 22px 110px;
    }

    .profile-title{
        font-size:28px;
    }

    .stats{
        gap:55px;
    }

    .bottom-nav{
        height:70px;
    }

}

</style>

</head>

<body>

<header class="navbar">

<a
    href="stream.html"
    class="back"
    aria-label="Back"
>
    ‹
</a>

<div class="logo">
    Canvas
</div>

<div class="header-space"></div>

</header>

<main class="profile-container">

<section id="createProfile">

<h1
    class="profile-title"
    id="formTitle"
>
    Create your profile
</h1>

<p
    class="profile-subtitle"
    id="formSubtitle"
>
    Set up your Canvas profile and let people know who you are.
</p>

<div class="avatar-section">

<div
    class="avatar"
    id="avatarPreview"
>
</div>

<div class="photo-actions">

<label
    class="photo-button"
    for="photoInput"
>
    Choose profile picture
</label>

<button
    type="button"
    class="delete-photo-button"
    id="deletePhotoButton"
    onclick="deleteProfilePhoto()"
>
    Delete picture
</button>

</div>

<input
    type="file"
    id="photoInput"
    accept="image/*"
>

</div>

<div class="form-group">

<label for="displayName">
    Display name
</label>

<input
    type="text"
    id="displayName"
    placeholder="Your name"
    maxlength="30"
>

</div>

<div class="form-group">

<label for="username">
    Username
</label>

<input
    type="text"
    id="username"
    placeholder="@username"
    maxlength="100"
>

</div>

<div class="form-group">

<label for="bio">
    Bio
</label>

<textarea
    id="bio"
    placeholder="Tell people about yourself..."
    maxlength="150"
></textarea>

</div>

<button
    type="button"
    class="save-button"
    id="saveProfileButton"
    onclick="saveProfile()"
>
    Save Profile
</button>

</section>

<section id="profileView">

<div
    class="avatar"
    id="profileAvatar"
></div>

<h1
    class="profile-name"
    id="profileName"
>
    Canvas Creator
</h1>

<p
    class="profile-username"
    id="profileUsername"
>
    @username
</p>

<p
    class="profile-bio"
    id="profileBio"
>
    No bio yet.
  </p>
  <div class="stats">

<div class="stat">
    <strong id="followersCount">0</strong>
    <span>Followers</span>
</div>

<div class="stat">
    <strong id="followingCount">0</strong>
    <span>Following</span>
</div>

</div>

<section class="account-section">

<h2 class="account-title">
    Account
</h2>

<div class="account-item">

<div class="account-label">
    Email
</div>

<div
    class="account-value"
    id="accountEmail"
>
    Not available
</div>

</div>

<div class="account-item">

<div class="account-label">
    Password
</div>

<div class="account-value">
    ••••••••
</div>

</div>

<button
    class="edit-button"

>
    Edit Profile
</button>

<button

>
    Change Password
</button>

<button

>

</button>

<div id="passwordSection">

<h2 class="password-title">
    Change Password
</h2>

<div class="form-group">

<label for="currentPassword">

</label>

<input

>

</div>

<div class="form-group">

<label for="newPassword">
    New password
</label>

<input

>

</div>

<div class="form-group">

    Confirm password
</label>

<input
    type="password"

>

</section>

</section>

</main>

<nav class="bottom-nav">

<a href="stream.html">
    ⌂
    <span>Home</span>
</a>

<a href="explore.html">

    <svg
        class="explore-icon"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
    >

        <circle
            cx="11"
            cy="11"
            r="6.5"
            stroke="currentColor"
            stroke-width="2"
        ></circle>

        <path
            d="M16 16L21 21"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
        ></path>

    </svg>

    <span>Explore</span>

</a>

<a href="golive.html">
    ⊙
    <span>Go Live</span>
</a>

<a
    href="profile.html"
    class="active"
>

    <span id="bottomProfileIcon"></span>

    <span>Profile</span>

</a>

</nav>

<script>

const API =
    "https://canvas-kh9p.onrender.com";

let selectedPhoto = "";

let currentProfile = null;


/* =========================================
   DEFAULT PROFILE PICTURE
========================================= */

const DEFAULT_AVATAR = `
<div
    class="default-avatar"
    aria-label="Default profile picture"
>

<svg
    viewBox="0 0 100 100"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true"
>

<circle
    cx="50"
    cy="50"
    r="50"
    fill="#eadfd7"
></circle>

<circle
    cx="50"
    cy="38"
    r="17"
    fill="#8a6b58"
></circle>

<path
    d="M22 82C24 63 35 55 50 55C65 55 76 63 78 82"
    fill="#8a6b58"
></path>

</svg>

</div>
`;


/* =========================================
   AUTH
========================================= */

function getToken(){

    return (
        localStorage.getItem(
            "canvasAuthToken"
        ) ||

        localStorage.getItem(
            "canvasToken"
        ) ||

        localStorage.getItem(
            "authToken"
        ) ||

        ""
    );

}


function authHeaders(extra = {}){

    const token =
        getToken();

    const headers = {
        ...extra
    };

    if(token){

        headers.Authorization =
            "Bearer " + token;

    }

    return headers;

}


/* =========================================
   LOGIN CHECK
========================================= */

function requireLogin(){

    const token =
        getToken();

    if(!token){

        window.location.href =
            "login.html";

        return false;

    }

    return true;

}


/* =========================================
   LOCAL ACCOUNT
========================================= */

function getAccount(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "canvasAccount"
            ) || "{}"
        );

    }catch{

        return {};

    }

}


function getSavedProfile(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "canvasProfile"
            ) || "{}"
        );

    }catch{

        return {};

    }

}


function getUsername(){

    const account =
        getAccount();

    const saved =
        getSavedProfile();

    return String(
        account.username ||
        saved.username ||
        ""
    ).replace(
        /^@/,
        ""
    );

}


/* =========================================
   AVATAR HELPERS
========================================= */

function getPhoto(profile){

    if(!profile){

        return "";

    }

    return (
        profile.photo ||
        profile.profile_picture ||
        profile.profileImage ||
        profile.profilePhoto ||
        profile.image ||
        ""
    );

}


function setAvatar(
    element,
    photo
){

    if(!element){

        return;

    }

    if(photo){

        element.innerHTML = `
            <img
                src="${photo}"
                alt="Profile picture"
            >
        `;

    }else{

        element.innerHTML =
            DEFAULT_AVATAR;

    }

}


function updateBottomIcon(profile){

    const icon =
        document.getElementById(
            "bottomProfileIcon"
        );

    if(!icon){

        return;

    }

    const photo =
        getPhoto(profile);

    if(photo){

        icon.innerHTML = `
            <img
                class="bottom-profile-image"
                src="${photo}"
                alt="Profile"
            >
        `;

        return;

    }

    icon.innerHTML =
        DEFAULT_AVATAR;

    const avatar =
        icon.querySelector(
            ".default-avatar"
        );

    if(avatar){

        avatar.style.width =
            "23px";

        avatar.style.height =
            "23px";

    }

    const svg =
        icon.querySelector(
            "svg"
        );

    if(svg){

        svg.style.width =
            "17px";

        svg.style.height =
            "17px";

    }

}


/* =========================================
   NORMALIZE PROFILE
========================================= */

function normalizeProfile(data){

    const p =
        data?.profile ||
        data?.user ||
        data ||
        {};

    const saved =
        getSavedProfile();

    return {

        id:
            p.id ||
            saved.id ||
            null,

        name:
            p.name ||
            p.displayName ||
            saved.name ||
            "",

        username:
            p.username ||
            saved.username ||
            getUsername(),

        email:
            p.email ||
            saved.email ||
            getAccount().email ||
            "",

        bio:
            p.bio ||
            saved.bio ||
            "",

        photo:
            p.profile_picture ||
            p.profileImage ||
            p.profilePhoto ||
            p.photo ||
            saved.photo ||
            "",

        followers_count:
            p.followers_count ??
            p.followersCount ??
            saved.followers_count ??
            0,

        following_count:
            p.following_count ??
            p.followingCount ??
            saved.following_count ??
            0

    };

}


/* =========================================
   SAVE LOCAL PROFILE
========================================= */

function saveLocalProfile(profile){

    localStorage.setItem(
        "canvasProfile",
        JSON.stringify(profile)
    );

    currentProfile =
        profile;

}


/* =========================================
   SHOW CREATE PROFILE
========================================= */

function showCreateProfile(){

    if(!requireLogin()){

        return;

    }

    document.getElementById(
        "profileView"
    ).style.display =
        "none";

    document.getElementById(
        "createProfile"
    ).style.display =
        "block";

    document.getElementById(
        "formTitle"
    ).textContent =
        "Create your profile";

    document.getElementById(
        "formSubtitle"
    ).textContent =
        "Set up your Canvas profile and let people know who you are.";

    setAvatar(
        document.getElementById(
            "avatarPreview"
        ),
        selectedPhoto
    );

}


/* =========================================
   SHOW PROFILE
========================================= */

function showProfile(profile){

    if(!requireLogin()){

        return;

    }

    currentProfile =
        profile;

    document.getElementById(
        "createProfile"
    ).style.display =
        "none";

    document.getElementById(
        "profileView"
    ).style.display =
        "block";

    document.getElementById(
        "profileName"
    ).textContent =
        profile.name ||
        "Canvas Creator";

    document.getElementById(
        "profileUsername"
    ).textContent =
        "@" +
        String(
            profile.username ||
            "username"
        ).replace(
            /^@/,
            ""
        );

    document.getElementById(
        "profileBio"
    ).textContent =
        profile.bio ||
        "No bio yet.";

    document.getElementById(
        "accountEmail"
    ).textContent =
        profile.email ||
        getAccount().email ||
        "Not available";

    setAvatar(
        document.getElementById(
            "profileAvatar"
        ),
        getPhoto(profile)
    );

    updateBottomIcon(
        profile
    );

    loadFollowCountsFromProfile(
        profile
    );

}
 /* =========================================
   LOAD PROFILE FROM BACKEND
========================================= */

async function loadProfile(){

    /*
       Profile requires a real login token.
       Never show cached profile data to a
       logged-out user.
    */

    const token =
        getToken();

    if(!token){

        window.location.href =
            "login.html";

        return;

    }

    try{

        const res =
            await fetch(
                API + "/api/profile",
                {
                    method:"GET",
                    headers:authHeaders()
                }
            );

        if(res.status === 401){

            logoutLocal();

            return;

        }

        /*
           A logged-in account can exist
           without a completed profile.
        */

        if(res.status === 404){

            const account =
                getAccount();

            document.getElementById(
                "displayName"
            ).value =
                account.displayName ||
                account.name ||
                "";

            document.getElementById(
                "username"
            ).value =
                account.username ||
                "";

            document.getElementById(
                "bio"
            ).value =
                "";

            selectedPhoto = "";

            setAvatar(
                document.getElementById(
                    "avatarPreview"
                ),
                ""
            );

            showCreateProfile();

            return;

        }

        const data =
            await res.json();

        if(
            !res.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Unable to load profile."
            );

        }

        const profile =
            normalizeProfile(data);

        saveLocalProfile(
            profile
        );

        showProfile(
            profile
        );

    }catch(error){

        console.error(
            "Canvas profile load failed:",
            error
        );

        /*
           Do NOT let an old cached profile
           replace the authenticated profile.
        */

        const saved =
            getSavedProfile();

        if(saved.username){

            showProfile(
                saved
            );

        }else{

            const account =
                getAccount();

            document.getElementById(
                "displayName"
            ).value =
                account.displayName ||
                account.name ||
                "";

            document.getElementById(
                "username"
            ).value =
                account.username ||
                "";

            showCreateProfile();

        }

    }

}


/* =========================================
   PHOTO INPUT
========================================= */

function setupPhotoInput(){

    const input =
        document.getElementById(
            "photoInput"
        );

    if(!input){

        return;

    }

    input.addEventListener(
        "change",
        function(){

            const file =
                this.files &&
                this.files[0];

            if(!file){

                return;

            }

            if(
                !file.type.startsWith(
                    "image/"
                )
            ){

                alert(
                    "Please choose an image file."
                );

                this.value = "";

                return;

            }

            const reader =
                new FileReader();

            reader.onload =
                function(event){

                    selectedPhoto =
                        event.target.result;

                    setAvatar(
                        document.getElementById(
                            "avatarPreview"
                        ),
                        selectedPhoto
                    );

                    document.getElementById(
                        "deletePhotoButton"
                    ).style.display =
                        "inline-block";

                };

            reader.readAsDataURL(
                file
            );

        }
    );

}


/* =========================================
   DELETE PROFILE PICTURE
========================================= */

async function deleteProfilePhoto(){

    if(!requireLogin()){

        return;

    }

    selectedPhoto = "";

    const input =
        document.getElementById(
            "photoInput"
        );

    if(input){

        input.value = "";

    }

    setAvatar(
        document.getElementById(
            "avatarPreview"
        ),
        ""
    );

    document.getElementById(
        "deletePhotoButton"
    ).style.display =
        "none";

    const token =
        getToken();

    if(!token){

        return;

    }

    try{

        const res =
            await fetch(
                API + "/api/profile/picture",
                {
                    method:"DELETE",
                    headers:authHeaders()
                }
            );

        if(res.status === 401){

            logoutLocal();

            return;

        }

        if(!res.ok){

            const data =
                await res.json()
                .catch(() => ({}));

            throw new Error(
                data.message ||
                "Unable to delete profile picture."
            );

        }

        if(currentProfile){

            currentProfile.photo =
                "";

            saveLocalProfile(
                currentProfile
            );

        }

        updateBottomIcon(
            currentProfile || {}
        );

        setAvatar(
            document.getElementById(
                "profileAvatar"
            ),
            ""
        );

    }catch(error){

        console.error(
            "Delete profile picture failed:",
            error
        );

        alert(
            error.message ||
            "Unable to delete profile picture."
        );

    }

}


/* =========================================
   SAVE PROFILE
========================================= */

async function saveProfile(){

    /*
       HARD LOGIN CHECK
       Profile cannot be created or saved
       without the authenticated account.
    */

    if(!requireLogin()){

        return;

    }

    const name =
        document.getElementById(
            "displayName"
        ).value.trim();

    let username =
        document.getElementById(
            "username"
        ).value.trim();

    const bio =
        document.getElementById(
            "bio"
        ).value.trim();

    if(!name || !username){

        alert(
            "Name and username are required."
        );

        return;

    }

    username =
        username.replace(
            /^@/,
            ""
        );

    if(
        !/^[a-zA-Z0-9_.]+$/.test(
            username
        )
    ){

        alert(
            "Username can only contain letters, numbers, underscores and dots."
        );

        return;

    }

    const button =
        document.getElementById(
            "saveProfileButton"
        );

    if(button){

        button.disabled =
            true;

        button.textContent =
            "Saving...";

    }

    const profileData = {

        name:
            name,

        username:
            username,

        bio:
            bio,

        profile_picture:
            selectedPhoto || ""

    };

    try{

        const token =
            getToken();

        /*
           The login token MUST exist.
        */

        if(!token){

            window.location.href =
                "login.html";

            return;

        }

        const res =
            await fetch(
                API + "/api/profile",
                {
                    method:"PUT",

                    headers:authHeaders({
                        "Content-Type":
                            "application/json"
                    }),

                    body:
                        JSON.stringify(
                            profileData
                        )
                }
            );

        if(res.status === 401){

            logoutLocal();

            return;

        }

        const data =
            await res.json()
            .catch(() => ({}));

        if(
            !res.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Unable to save profile."
            );

        }

        let profile =
            normalizeProfile(
                data
            );

        /*
           Preserve the selected picture
           if the backend response does not
           include it.
        */

        if(
            !getPhoto(profile) &&
            selectedPhoto
        ){

            profile.photo =
                selectedPhoto;

        }

        saveLocalProfile(
            profile
        );

        showProfile(
            profile
        );

        alert(
            "Profile saved successfully."
        );

    }catch(error){

        console.error(
            "Save profile failed:",
            error
        );

        alert(
            error.message ||
            "Unable to save profile."
        );

    }finally{

        if(button){

            button.disabled =
                false;

            button.textContent =
                "Save Profile";

        }

    }

}


/* =========================================
   EDIT PROFILE
========================================= */

function editProfile(){

    if(!requireLogin()){

        return;

    }

    const profile =
        currentProfile ||
        getSavedProfile();

    if(!profile){

        showCreateProfile();

        return;

    }

    document.getElementById(
        "profileView"
    ).style.display =
        "none";

    document.getElementById(
        "createProfile"
    ).style.display =
        "block";

    document.getElementById(
        "formTitle"
    ).textContent =
        "Edit your profile";

    document.getElementById(
        "formSubtitle"
    ).textContent =
        "Update your Canvas profile information.";

    document.getElementById(
        "displayName"
    ).value =
        profile.name || "";

    document.getElementById(
        "username"
    ).value =
        profile.username || "";

    document.getElementById(
        "bio"
    ).value =
        profile.bio || "";

    selectedPhoto =
        getPhoto(profile);

    setAvatar(
        document.getElementById(
            "avatarPreview"
        ),
        selectedPhoto
    );

    document.getElementById(
        "deletePhotoButton"
    ).style.display =
        selectedPhoto
            ? "inline-block"
            : "none";

}


/* =========================================
   PASSWORD SECTION
========================================= */

function togglePasswordSection(){

    if(!requireLogin()){

        return;

    }

    const box =
        document.getElementById(
            "passwordSection"
        );

    if(!box){

        return;

    }

    box.style.display =
        box.style.display === "block"
            ? "none"
            : "block";

}


/* =========================================
   CHANGE PASSWORD
========================================= */

async function changePassword(){

    if(!requireLogin()){

        return;

    }

    const current =
        document.getElementById(
            "currentPassword"
        ).value;

    const newPass =
        document.getElementById(
            "newPassword"
        ).value;

    const confirm =
        document.getElementById(
            "confirmNewPassword"
        ).value;

    if(!current || !newPass){

        alert(
            "Current and new passwords are required."
        );

        return;

    }

    if(newPass.length < 8){

        alert(
            "Password must be at least 8 characters."
        );

        return;

    }

    if(newPass !== confirm){

        alert(
            "Passwords do not match."
        );

        return;

    }

    const token =
        getToken();

    if(!token){

        window.location.href =
            "login.html";

        return;

    }

    const button =
        document.getElementById(
            "changePasswordButton"
        );

    if(button){

        button.disabled =
            true;

        button.textContent =
            "Changing...";

    }

    try{

        const res =
            await fetch(
                API + "/api/change-password",
                {
                    method:"PUT",

                    headers:authHeaders({
                        "Content-Type":
                            "application/json"
                    }),

                    body:
                        JSON.stringify({
                            currentPassword:
                                current,

                            newPassword:
                                newPass
                        })
                }
            );

        const data =
            await res.json()
            .catch(() => ({}));

        if(res.status === 401){

            if(
                data.message ===
                "Current password is incorrect."
            ){

                throw new Error(
                    data.message
                );

            }

            logoutLocal();

            return;

        }

        if(
            !res.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Unable to change password."
            );

        }

        document.getElementById(
            "currentPassword"
        ).value = "";

        document.getElementById(
            "newPassword"
        ).value = "";

        document.getElementById(
            "confirmNewPassword"
        ).value = "";

        document.getElementById(
            "passwordSection"
        ).style.display =
            "none";

        alert(
            "Password changed successfully."
        );

    }catch(error){

        console.error(
            "Change password failed:",
            error
        );

        alert(
            error.message ||
            "Unable to change password."
        );

    }finally{

        if(button){

            button.disabled =
                false;

            button.textContent =
                "Save New Password";

        }

    }

  }
   /* =========================================
    LOGOUT
 ========================================= */

 async function logout(){

     const token =
         getToken();

     try{

         if(token){

             await fetch(
                 API + "/api/logout",
                 {
                     method:"POST",
                     headers:authHeaders()
                 }
             );

         }

     }catch(error){

         console.error(
             "Canvas logout failed:",
             error
         );

     }finally{

         logoutLocal();

     }

 }


 /* =========================================
    LOCAL LOGOUT
 ========================================= */

 function logoutLocal(){

     localStorage.removeItem(
         "canvasAuthToken"
     );

     localStorage.removeItem(
         "canvasToken"
     );

     localStorage.removeItem(
         "authToken"
     );

     localStorage.removeItem(
         "canvasLoggedIn"
     );

     localStorage.removeItem(
         "canvasAccount"
     );

     localStorage.removeItem(
         "canvasProfile"
     );

     window.location.href =
         "login.html";

 }


 /* =========================================
    FOLLOWER / FOLLOWING
 ========================================= */

 function setFollowCounts(
     followers,
     following
 ){

     const followersElement =
         document.getElementById(
             "followersCount"
         );

     const followingElement =
         document.getElementById(
             "followingCount"
         );

     if(followersElement){

         followersElement.textContent =
             Number(followers) || 0;

     }

     if(followingElement){

         followingElement.textContent =
             Number(following) || 0;

     }

 }


 function loadFollowCountsFromProfile(
     profile
 ){

     if(!profile){

         setFollowCounts(
             0,
             0
         );

         return;

     }

     setFollowCounts(

         profile.followers_count ??
         profile.followersCount ??
         profile.followers ??
         0,

         profile.following_count ??
         profile.followingCount ??
         profile.following ??
         0

     );

 }


 /* =========================================
    INITIALIZE PROFILE PAGE
 ========================================= */

 function initializeProfilePage(){

     /*
        IMPORTANT:
        Do the login check BEFORE showing
        cached profile information.

        This prevents a logged-out user
        from opening the Create Profile
        screen and trying to save without
        authentication.
     */

     if(!requireLogin()){

         return;

     }


     selectedPhoto = "";


     setAvatar(
         document.getElementById(
             "avatarPreview"
         ),
         ""
     );


     setAvatar(
         document.getElementById(
             "profileAvatar"
         ),
         ""
     );


     updateBottomIcon(
         {}
     );


     setupPhotoInput();


     /*
        Do not automatically display
        canvasProfile here.

        loadProfile() will first verify
        the authenticated account with
        the backend.
     */

     loadProfile();

 }


 /* =========================================
    PREVENT PROFILE PAGE FROM BEING USED
    AFTER LOGOUT / BACK BUTTON
 ========================================= */

 window.addEventListener(
     "pageshow",
     function(){

         if(!getToken()){

             window.location.replace(
                 "login.html"
             );

         }

     }
 );


 /* =========================================
    START
 ========================================= */

 document.addEventListener(
     "DOMContentLoaded",
     initializeProfilePage
 );

</script>
