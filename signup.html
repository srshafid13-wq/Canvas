<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Canvas - Sign Up</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#ffffff;
color:#4b3024;
min-height:100vh;
}

.container{
width:100%;
max-width:450px;
margin:auto;
padding:35px 25px;
}

.logo{
text-align:center;
font-size:42px;
font-weight:bold;
color:#6F4E37;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#777;
margin-bottom:30px;
}

.form-group{
margin-bottom:18px;
}

label{
display:block;
font-weight:bold;
margin-bottom:7px;
}

input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
outline:none;
background:#fafafa;
}

input:focus{
border-color:#D4A017;
background:#fff;
}

.password-box{
position:relative;
}

.password-box input{
padding-right:50px;
}

.show-password{
position:absolute;
right:12px;
top:50%;
transform:translateY(-50%);
border:none;
background:none;
font-size:18px;
cursor:pointer;
padding:5px;
}

.button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#6F4E37;
color:white;
font-size:17px;
font-weight:bold;
margin-top:8px;
cursor:pointer;
}

.button:disabled{
opacity:.65;
cursor:not-allowed;
}

.login{
text-align:center;
margin-top:22px;
color:#777;
}

.login a{
color:#6F4E37;
font-weight:bold;
text-decoration:none;
}

.message{
text-align:center;
margin-top:15px;
font-size:14px;
color:#b00020;
min-height:20px;
line-height:1.5;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
Canvas
</div>

<p class="subtitle">
Create your Canvas account
</p>


<form
    id="signupForm"
    novalidate>


<div class="form-group">

<label for="email">
Email
</label>

<input
    type="email"
    id="email"
    placeholder="you@example.com"
    autocomplete="email"
    required>

</div>


<div class="form-group">

<label for="username">
Username
</label>

<input
    type="text"
    id="username"
    placeholder="@username"
    maxlength="20"
    autocomplete="username"
    required>

</div>


<div class="form-group">

<label for="displayName">
Display name
</label>

<input
    type="text"
    id="displayName"
    placeholder="Your name"
    maxlength="30"
    autocomplete="name"
    required>

</div>


<div class="form-group">

<label for="password">
Password
</label>

<div class="password-box">

<input
    type="password"
    id="password"
    placeholder="Create a password"
    minlength="8"
    autocomplete="new-password"
    required>

<button
    type="button"
    class="show-password"
    id="showPasswordButton"
    aria-label="Show password">

    👁️

</button>

</div>

</div>


<div class="form-group">

<label for="confirmPassword">
Confirm password
</label>

<div class="password-box">

<input
    type="password"
    id="confirmPassword"
    placeholder="Enter your password again"
    minlength="8"
    autocomplete="new-password"
    required>

<button
    type="button"
    class="show-password"
    id="showConfirmPasswordButton"
    aria-label="Show password">

    👁️

</button>

</div>

</div>


<button
    class="button"
    id="signupButton"
    type="submit">

    Create Account

</button>

</form>


<p
    class="message"
    id="message">
</p>


<p class="login">

Already have a Canvas account?

<a href="login.html">
Log in
</a>

</p>

</div>


<script>

/* =========================================
   CANVAS BACKEND
========================================= */

const API =
    "https://canvas-kh9p.onrender.com";


/* =========================================
   ELEMENTS
========================================= */

const signupForm =
    document.getElementById(
        "signupForm"
    );

const emailInput =
    document.getElementById(
        "email"
    );

const usernameInput =
    document.getElementById(
        "username"
    );

const displayNameInput =
    document.getElementById(
        "displayName"
    );

const passwordInput =
    document.getElementById(
        "password"
    );

const confirmPasswordInput =
    document.getElementById(
        "confirmPassword"
    );

const signupButton =
    document.getElementById(
        "signupButton"
    );

const message =
    document.getElementById(
        "message"
    );

const showPasswordButton =
    document.getElementById(
        "showPasswordButton"
    );

const showConfirmPasswordButton =
    document.getElementById(
        "showConfirmPasswordButton"
    );


/* =========================================
   PASSWORD TOGGLE
========================================= */

function toggleInputPassword(
    input,
    button
){

    if(input.type === "password"){

        input.type =
            "text";

        button.setAttribute(
            "aria-label",
            "Hide password"
        );

    }else{

        input.type =
            "password";

        button.setAttribute(
            "aria-label",
            "Show password"
        );

    }

}


showPasswordButton.addEventListener(
    "click",
    function(){

        toggleInputPassword(
            passwordInput,
            showPasswordButton
        );

    }
);


showConfirmPasswordButton.addEventListener(
    "click",
    function(){

        toggleInputPassword(
            confirmPasswordInput,
            showConfirmPasswordButton
        );

    }
);


/* =========================================
   SIGNUP
========================================= */

signupForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();
        event.stopPropagation();


        const email =
            emailInput.value
                .trim()
                .toLowerCase();

        let username =
            usernameInput.value
                .trim();

        const displayName =
            displayNameInput.value
                .trim();

        const password =
            passwordInput.value;

        const confirmPassword =
            confirmPasswordInput.value;


        message.textContent = "";
        message.style.color =
            "#b00020";


        /* =====================================
           VALIDATION
        ===================================== */

        if(!email){

            message.textContent =
                "Please enter your email.";

            emailInput.focus();

            return;

        }


        if(!username){

            message.textContent =
                "Please choose a username.";

            usernameInput.focus();

            return;

        }


        if(!displayName){

            message.textContent =
                "Please enter your display name.";

            displayNameInput.focus();

            return;

        }


        if(password.length < 8){

            message.textContent =
                "Password must be at least 8 characters.";

            passwordInput.focus();

            return;

        }


        if(password !== confirmPassword){

            message.textContent =
                "Passwords do not match.";

            confirmPasswordInput.focus();

            return;

        }


        /* =====================================
           CLEAN USERNAME
        ===================================== */

        username =
            username
                .replace(/^@/,"")
                .trim()
                .toLowerCase();


        if(!username){

            message.textContent =
                "Please choose a username.";

            usernameInput.focus();

            return;

        }


        if(
            !/^[a-zA-Z0-9_.]+$/.test(
                username
            )
        ){

            message.textContent =
                "Username can only contain letters, numbers, underscores and dots.";

            usernameInput.focus();

            return;

        }


        /* =====================================
           BUTTON
        ===================================== */

        signupButton.disabled =
            true;

        signupButton.textContent =
            "Creating Account...";


        try{

            /* =================================
               CREATE ACCOUNT
            ================================= */

            const response =
                await fetch(
                    API + "/api/signup",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                name:
                                    displayName,

                                username:
                                    username,

                                email:
                                    email,

                                password:
                                    password

                            })
                    }
                );


            let data = {};

            try{

                data =
                    await response.json();

            }catch(error){

                data = {};

            }


            console.log(
                "Canvas signup:",
                response.status,
                data
            );


            if(!response.ok){

                throw new Error(
                    data.message ||
                    data.error ||
                    "Unable to create Canvas account."
                );

            }


            /*
             * SERVER RETURNS:
             * token
             * user
             */

            const token =
                String(
                    data.token || ""
                ).trim();


            if(!token){

                throw new Error(
                    "Account was created, but no authentication token was received."
                );

            }


            const user =
                data.user || {};


            const cleanUsername =
                String(
                    user.username ||
                    username
                )
                .replace(/^@/,"")
                .trim()
                .toLowerCase();


            const account = {

                id:
                    user.id || "",

                email:
                    user.email ||
                    email,

                username:
                    cleanUsername,

                displayName:
                    user.name ||
                    displayName

            };


            /* =================================
               SAVE AUTH TOKEN
            ================================= */

            localStorage.setItem(
                "canvasAuthToken",
                token
            );


            localStorage.setItem(
                "canvasLoggedIn",
                "true"
            );


            localStorage.setItem(
                "canvasCurrentUser",
                JSON.stringify(account)
            );


            localStorage.setItem(
                "canvasAccount",
                JSON.stringify(account)
            );


            /* =================================
               INITIAL LOCAL PROFILE
            ================================= */

            const profile = {

                name:
                    account.displayName,

                username:
                    "@" +
                    account.username,

                email:
                    account.email,

                bio:"",
                photo:""

            };


            localStorage.setItem(
                "canvasProfile",
                JSON.stringify(profile)
            );


            /* =================================
               SUCCESS
            ================================= */

            message.style.color =
                "#4b3326";

            message.textContent =
                "Account created successfully!";

            signupButton.textContent =
                "Account Created";


            setTimeout(
                function(){

                    window.location.href =
                        "profile.html";

                },
                400
            );


        }catch(error){

            console.error(
                "Canvas signup error:",
                error
            );


            message.style.color =
                "#b00020";

            message.textContent =
                error.message ||
                "Could not create Canvas account.";


            signupButton.disabled =
                false;

            signupButton.textContent =
                "Create Account";

        }

    }
);

</script>

</body>

  </html>
