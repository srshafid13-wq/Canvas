<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Canvas - Sign Up</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#ffffff;
color:#4b3024;
min-height:100vh;
}

.container{
width:100%;
max-width:450px;
margin:auto;
padding:35px 25px;
}

.logo{
text-align:center;
font-size:42px;
font-weight:bold;
color:#6F4E37;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#777;
margin-bottom:30px;
}

.form-group{
margin-bottom:18px;
}

label{
display:block;
font-weight:bold;
margin-bottom:7px;
}

input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
outline:none;
background:#fafafa;
}

input:focus{
border-color:#D4A017;
background:#fff;
}

.password-box{
position:relative;
}

.password-box input{
padding-right:50px;
}

.show-password{
position:absolute;
right:12px;
top:50%;
transform:translateY(-50%);
border:none;
background:none;
font-size:18px;
cursor:pointer;
padding:5px;
}

.button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#6F4E37;
color:white;
font-size:17px;
font-weight:bold;
margin-top:8px;
cursor:pointer;
}

.button:disabled{
opacity:.65;
cursor:not-allowed;
}

.login{
text-align:center;
margin-top:22px;
color:#777;
}

.login a{
color:#6F4E37;
font-weight:bold;
text-decoration:none;
}

.message{
text-align:center;
margin-top:15px;
font-size:14px;
color:#b00020;
min-height:20px;
line-height:1.5;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
Canvas
</div>

<p class="subtitle">
Create your Canvas account
</p>


<form id="signupForm">


<!-- EMAIL -->

<div class="form-group">

<label for="email">
Email
</label>

<input
    type="email"
    id="email"
    placeholder="you@example.com"
    autocomplete="email"
    required
>

</div>


<!-- USERNAME -->

<div class="form-group">

<label for="username">
Username
</label>

<input
    type="text"
    id="username"
    placeholder="@username"
    maxlength="20"
    autocomplete="username"
    required
>

</div>


<!-- DISPLAY NAME -->

<div class="form-group">

<label for="displayName">
Display name
</label>

<input
    type="text"
    id="displayName"
    placeholder="Your name"
    maxlength="30"
    autocomplete="name"
    required
>

</div>


<!-- PASSWORD -->

<div class="form-group">

<label for="password">
Password
</label>

<div class="password-box">

<input
    type="password"
    id="password"
    placeholder="Create a password"
    minlength="8"
    autocomplete="new-password"
    required
>

<button
    type="button"
    class="show-password"
    onclick="togglePassword('password')"
    aria-label="Show password">

    👁️

</button>

</div>

</div>


<!-- CONFIRM PASSWORD -->

<div class="form-group">

<label for="confirmPassword">
Confirm password
</label>

<div class="password-box">

<input
    type="password"
    id="confirmPassword"
    placeholder="Enter your password again"
    minlength="8"
    autocomplete="new-password"
    required
>

<button
    type="button"
    class="show-password"
    onclick="togglePassword('confirmPassword')"
    aria-label="Show password">

    👁️

</button>

</div>

</div>


<!-- CREATE ACCOUNT -->

<button
    class="button"
    id="signupButton"
    type="submit">

    Create Account

</button>

</form>


<p
    class="message"
    id="message">
</p>


<p class="login">

Already have a Canvas account?

<a href="login.html">
Log in
</a>

</p>

</div>


<script>

/* =========================================
   CANVAS BACKEND
========================================= */

const API =
    "https://canvas-kh9p.onrender.com";


/* =========================================
   SHOW / HIDE PASSWORD
========================================= */

function togglePassword(id){

    const input =
        document.getElementById(id);


    if(input.type === "password"){

        input.type =
            "text";

    }else{

        input.type =
            "password";

    }

}


/* =========================================
   SIGNUP FORM
========================================= */

document
.getElementById("signupForm")
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();
        event.stopPropagation();


        /* =====================================
           ELEMENTS
        ===================================== */

        const emailInput =
            document.getElementById(
                "email"
            );

        const usernameInput =
            document.getElementById(
                "username"
            );

        const displayNameInput =
            document.getElementById(
                "displayName"
            );

        const passwordInput =
            document.getElementById(
                "password"
            );

        const confirmPasswordInput =
            document.getElementById(
                "confirmPassword"
            );

        const button =
            document.getElementById(
                "signupButton"
            );

        const message =
            document.getElementById(
                "message"
            );


        /* =====================================
           VALUES
        ===================================== */

        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        let username =
            usernameInput.value
                .trim();


        const displayName =
            displayNameInput.value
                .trim();


        const password =
            passwordInput.value;


        const confirmPassword =
            confirmPasswordInput.value;


        message.textContent =
            "";

        message.style.color =
            "#b00020";


        /* =====================================
           VALIDATION
        ===================================== */

        if(!email){

            message.textContent =
                "Please enter your email.";

            emailInput.focus();

            return;

        }


        /* =====================================
           EMAIL VALIDATION
        ===================================== */

        if(
            !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
                .test(email)
        ){

            message.textContent =
                "Please enter a valid email address.";

            emailInput.focus();

            return;

        }


        /* =====================================
           USERNAME
        ===================================== */

        if(!username){

            message.textContent =
                "Please choose a username.";

            usernameInput.focus();

            return;

        }


        /*
         * Canvas usernames support:
         *
         * letters
         * numbers
         * underscore
         * dot
         *
         * Hyphens are NOT accepted by
         * the current server.
         */

        username =
            username
                .replace(/^@/, "")
                .trim()
                .toLowerCase();


        if(!username){

            message.textContent =
                "Please choose a username.";

            usernameInput.focus();

            return;

        }


        if(
            !/^[a-zA-Z0-9_.]+$/.test(
                username
            )
        ){

            message.textContent =
                "Username can only contain letters, numbers, underscores and dots.";

            usernameInput.focus();

            return;

        }


        /* =====================================
           DISPLAY NAME
        ===================================== */

        if(!displayName){

            message.textContent =
                "Please enter your display name.";

            displayNameInput.focus();

            return;

        }


        /* =====================================
           PASSWORD
        ===================================== */

        if(password.length < 8){

            message.textContent =
                "Password must be at least 8 characters.";

            passwordInput.focus();

            return;

        }


        /* =====================================
           CONFIRM PASSWORD
        ===================================== */

        if(password !== confirmPassword){

            message.textContent =
                "Passwords do not match.";

            confirmPasswordInput.focus();

            return;

        }


        /* =====================================
           BUTTON
        ===================================== */

        button.disabled =
            true;

        button.textContent =
            "Creating Account...";


        try{

            /* =================================
               CREATE ACCOUNT
            ================================= */

            const response =
                await fetch(

                    API +
                    "/api/signup",

                    {

                        method:"POST",

                        headers:{

                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"

                        },

                        body:
                        JSON.stringify({

                            name:
                                displayName,

                            username:
                                username,

                            email:
                                email,

                            password:
                                password

                        })

                    }

                );


            /* =================================
               SERVER RESPONSE
            ================================= */

            let data = {};

            try{

                data =
                    await response.json();

            }catch(error){

                data = {};

            }


            console.log(
                "Canvas signup:",
                response.status,
                data
            );


            /* =================================
               SIGNUP FAILED
            ================================= */

            if(
                !response.ok ||
                data.success === false
            ){

                throw new Error(

                    data.message ||
                    data.error ||
                    "Unable to create Canvas account."

                );

            }


            /* =================================
               ACCOUNT CREATED
               
               IMPORTANT:
               
               DO NOT USE THE TOKEN RETURNED
               BY SIGNUP.
               
               The user must explicitly log
               in through login.html first.
            ================================= */

            localStorage.removeItem(
                "canvasAuthToken"
            );

            localStorage.removeItem(
                "canvasLoggedIn"
            );

            localStorage.removeItem(
                "canvasCurrentUser"
            );

            localStorage.removeItem(
                "canvasAccount"
            );

            localStorage.removeItem(
                "canvasProfile"
            );

            localStorage.removeItem(
                "canvasProfilePicture"
            );

            localStorage.removeItem(
                "profilePicture"
            );


            /* =================================
               SUCCESS MESSAGE
            ================================= */

            message.style.color =
                "#4b3326";

            message.textContent =
                "Account created successfully! Please log in.";


            button.textContent =
                "Account Created";


            /* =================================
               GO TO LOGIN
            ================================= */

            setTimeout(
                function(){

                    window.location.href =
                        "login.html";

                },
                700
            );


        }catch(error){

            console.error(
                "Canvas signup error:",
                error
            );


            message.style.color =
                "#b00020";

            message.textContent =
                error.message ||
                "Could not create Canvas account.";


            button.disabled =
                false;

            button.textContent =
                "Create Account";

        }

    }
);

</script>

</body>

  </html>
