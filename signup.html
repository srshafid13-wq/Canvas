<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Canvas - Sign Up</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#ffffff;
color:#4b3024;
min-height:100vh;
}

.container{
width:100%;
max-width:450px;
margin:auto;
padding:35px 25px;
}

.logo{
text-align:center;
font-size:42px;
font-weight:bold;
color:#6F4E37;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#777;
margin-bottom:30px;
}

.form-group{
margin-bottom:18px;
}

label{
display:block;
font-weight:bold;
margin-bottom:7px;
}

input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
outline:none;
background:#fafafa;
}

input:focus{
border-color:#D4A017;
background:#fff;
}

.password-box{
position:relative;
}

.password-box input{
padding-right:50px;
}

.show-password{
position:absolute;
right:12px;
top:50%;
transform:translateY(-50%);
border:none;
background:none;
font-size:18px;
cursor:pointer;
}

.button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#6F4E37;
color:white;
font-size:17px;
font-weight:bold;
margin-top:8px;
cursor:pointer;
}

.button:disabled{
opacity:.65;
cursor:not-allowed;
}

.login{
text-align:center;
margin-top:22px;
color:#777;
}

.login a{
color:#6F4E37;
font-weight:bold;
text-decoration:none;
}

.message{
text-align:center;
margin-top:15px;
font-size:14px;
color:#b00020;
min-height:20px;
line-height:1.5;
}

.note{
margin-top:20px;
font-size:12px;
color:#999;
text-align:center;
line-height:1.5;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
Canvas
</div>

<p class="subtitle">
Create your Canvas account
</p>

<form id="signupForm">

<!-- =========================================
     EMAIL
========================================= -->

<div class="form-group">

<label for="email">
Email
</label>

<input
    type="email"
    id="email"
    placeholder="you@example.com"
    autocomplete="email"
    required
>

</div>


<!-- =========================================
     USERNAME
========================================= -->

<div class="form-group">

<label for="username">
Username
</label>

<input
    type="text"
    id="username"
    placeholder="@username"
    maxlength="20"
    autocomplete="username"
    required
>

</div>


<!-- =========================================
     DISPLAY NAME
========================================= -->

<div class="form-group">

<label for="displayName">
Display name
</label>

<input
    type="text"
    id="displayName"
    placeholder="Your name"
    maxlength="30"
    autocomplete="name"
    required
>

</div>


<!-- =========================================
     PASSWORD
========================================= -->

<div class="form-group">

<label for="password">
Password
</label>

<div class="password-box">

<input
    type="password"
    id="password"
    placeholder="Create a password"
    minlength="8"
    autocomplete="new-password"
    required
>

<button
    type="button"
    class="show-password"
    onclick="togglePassword('password')"
    aria-label="Show password">

    👁️

</button>

</div>

</div>


<!-- =========================================
     CONFIRM PASSWORD
========================================= -->

<div class="form-group">

<label for="confirmPassword">
Confirm password
</label>

<div class="password-box">

<input
    type="password"
    id="confirmPassword"
    placeholder="Enter your password again"
    minlength="8"
    autocomplete="new-password"
    required
>

<button
    type="button"
    class="show-password"
    onclick="togglePassword('confirmPassword')"
    aria-label="Show password">

    👁️

</button>

</div>

</div>


<!-- =========================================
     CREATE ACCOUNT
========================================= -->

<button
    class="button"
    id="signupButton"
    type="submit">

    Create Account

</button>

</form>


<p
    class="message"
    id="message">
</p>


<p class="login">

Already have a Canvas account?

<a href="login.html">
Log in
</a>

</p>


<p class="note">

You'll receive a verification code by email
before your Canvas account is created.

</p>

<script>

/* =========================================
   CANVAS BACKEND
========================================= */

const API =
    "https://canvas-kh9p.onrender.com";


/* =========================================
   SHOW / HIDE PASSWORD
========================================= */

function togglePassword(id){

    const input =
        document.getElementById(id);


    if(input.type === "password"){

        input.type = "text";

    }else{

        input.type = "password";

    }

}


/* =========================================
   SIGNUP FORM
========================================= */

document
.getElementById("signupForm")
.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        /* =====================================
           GET FORM VALUES
        ===================================== */

        const email =
            document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();


        let username =
            document
            .getElementById("username")
            .value
            .trim();


        const displayName =
            document
            .getElementById("displayName")
            .value
            .trim();


        const password =
            document
            .getElementById("password")
            .value;


        const confirmPassword =
            document
            .getElementById("confirmPassword")
            .value;


        const message =
            document
            .getElementById("message");


        const button =
            document
            .getElementById("signupButton");


        message.textContent = "";

        message.style.color =
            "#b00020";


        /* =====================================
           BASIC VALIDATION
        ===================================== */

        if(!email){

            message.textContent =
                "Please enter your email.";

            return;

        }


        if(!username){

            message.textContent =
                "Please choose a username.";

            return;

        }


        if(!displayName){

            message.textContent =
                "Please enter your display name.";

            return;

        }


        if(password.length < 8){

            message.textContent =
                "Password must be at least 8 characters.";

            return;

        }


        if(password !== confirmPassword){

            message.textContent =
                "Passwords do not match.";

            return;

        }


        /* =====================================
           CLEAN USERNAME
        ===================================== */

        username =
            username
            .replace(/^@/, "")
            .trim();


        if(!username){

            message.textContent =
                "Please choose a username.";

            return;

        }


        /* =====================================
           USERNAME VALIDATION
        ===================================== */

        if(
            !/^[a-zA-Z0-9_.]+$/.test(username)
        ){

            message.textContent =
                "Username can only contain letters, numbers, underscores and dots.";

            return;

        }


        /* =====================================
           BUTTON STATE
        ===================================== */

        button.disabled = true;

        button.textContent =
            "Sending Code...";


        /* =====================================
           SAVE PENDING SIGNUP
        ===================================== */

        const pendingSignup = {

            name:
                displayName,

            username:
                username,

            email:
                email,

            password:
                password

        };


        localStorage.setItem(
            "canvasPendingSignup",
            JSON.stringify(pendingSignup)
        );


        try{

            /* =================================
               SEND COMPLETE SIGNUP DATA
               TO BACKEND
            ================================= */

            const response =
                await fetch(

                    API +
                    "/api/signup/send-code",

                    {

                        method:"POST",

                        headers:{

                            "Content-Type":
                                "application/json"

                        },

                        body:
                        JSON.stringify({

                            name:
                                displayName,

                            username:
                                username,

                            email:
                                email,

                            password:
                                password

                        })

                    }

                );


            /* =================================
               READ SERVER RESPONSE
            ================================= */

            const data =
                await response
                .json()
                .catch(
                    function(){

                        return {};

                    }
                );


            /* =================================
               SERVER ERROR
            ================================= */

            if(!response.ok){

                throw new Error(
                    data.message ||
                    "Unable to send verification code."
                );

            }


            /* =================================
               SAVE EMAIL FOR VERIFY PAGE
            ================================= */

            localStorage.setItem(
                "canvasVerificationEmail",
                email
            );


            /* =================================
               CONTINUE TO VERIFICATION PAGE
            ================================= */

            window.location.href =
                "verify.html";


        }catch(error){

            console.error(
                "Canvas signup verification error:",
                error
            );


            /* =================================
               REMOVE PENDING DATA
            ================================= */

            localStorage.removeItem(
                "canvasPendingSignup"
            );


            localStorage.removeItem(
                "canvasVerificationEmail"
            );


            /* =================================
               SHOW ERROR
            ================================= */

            message.style.color =
                "#b00020";

            message.textContent =
                error.message ||
                "Could not send verification code.";


            /* =================================
               RESTORE BUTTON
            ================================= */

            button.disabled =
                false;

            button.textContent =
                "Create Account";

        }

    }
);


/* =========================================
   PREVENT ACCIDENTAL OLD ACCOUNT DATA
========================================= */

window.addEventListener(
    "pageshow",
    function(){

        /*
         * Signup page does not automatically
         * log the user in.
         */

    }
);

</script>

</div>

</body>

  </html>
