<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Canvas - Explore</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================================
   CANVAS EXPLORE
========================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#ffffff;
    color:#4b3326;
    font-family:Arial,Helvetica,sans-serif;
    padding-bottom:82px;
}


/* =========================================
   TOP NAVIGATION
========================================= */

.navbar{
    width:100%;
    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 20px;

    background:#ffffff;

    border-bottom:2px solid #d4a62a;

    position:sticky;
    top:0;

    z-index:1500;
}

.logo{
    font-size:32px;
    font-weight:800;
    color:#4b3326;
}


/* =========================================
   DEFAULT AVATAR
========================================= */

.default-avatar{
    width:100%;
    height:100%;

    display:block;
}


/* =========================================
   TOP PROFILE
========================================= */

#topProfileIcon{
    width:40px;
    height:40px;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    border-radius:50%;
    border:2px solid #d4a62a;

    background:#f3f3f3;

    color:#4b3326;

    text-decoration:none;
}

#topProfileIcon img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;
}


/* =========================================
   MAIN
========================================= */

.explore-container{
    width:100%;
    max-width:900px;

    margin:0 auto;

    padding:24px 18px 30px;
}


/* =========================================
   EXPLORE HEADER
========================================= */

.explore-header{
    text-align:center;

    margin-bottom:20px;
}

.explore-header h1{
    margin:0 0 7px;

    color:#4b3326;

    font-size:34px;
    font-weight:800;
}

.explore-header p{
    margin:0;

    color:#6a574c;

    font-size:15px;
    line-height:1.5;
}


/* =========================================
   SEARCH
========================================= */

.explore-search{
    width:100%;

    margin-bottom:22px;
}

.explore-search-row{
    width:100%;

    display:flex;
    align-items:center;

    gap:8px;
}

#exploreSearchInput{
    flex:1;
    min-width:0;

    height:52px;

    padding:0 15px;

    border:2px solid #d8c7bb;
    border-radius:14px;

    outline:none;

    background:#ffffff;
    color:#4b3326;

    font-size:15px;
}

#exploreSearchInput:focus{
    border-color:#d4a62a;

    box-shadow:
        0 0 0 3px
        rgba(212,166,42,.10);
}

#exploreSearchButton{
    width:52px;
    height:52px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border:0;
    border-radius:14px;

    background:#4b3326;
    color:#ffffff;

    cursor:pointer;
}

#exploreSearchButton:active{
    transform:scale(.95);
}


/* =========================================
   CATEGORIES
========================================= */

.category-section{
    width:100%;

    margin-bottom:24px;
}

.section-title{
    margin-bottom:10px;

    color:#4b3326;

    font-size:17px;
    font-weight:800;
}

.category-list{
    width:100%;

    display:flex;

    gap:8px;

    overflow-x:auto;

    padding-bottom:4px;

    scrollbar-width:none;
}

.category-list::-webkit-scrollbar{
    display:none;
}

.category-btn{
    flex-shrink:0;

    min-height:38px;

    padding:8px 14px;

    border:1.5px solid #d8c7bb;
    border-radius:20px;

    background:#ffffff;
    color:#4b3326;

    font-size:12px;
    font-weight:700;

    cursor:pointer;
}

.category-btn.active{
    background:#4b3326;
    color:#ffffff;
    border-color:#4b3326;
}

.category-btn:active{
    transform:scale(.96);
}


/* =========================================
   LIVE HEADER
========================================= */

.section-heading{
    width:100%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:14px;
}

.section-heading h2{
    margin:0;

    color:#4b3326;

    font-size:22px;
    font-weight:800;
}

#liveCount{
    color:#6a574c;

    font-size:13px;
    font-weight:700;
}


/* =========================================
   REFRESH
========================================= */

.refresh-btn{
    width:40px;
    height:40px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid #d8c7bb;
    border-radius:12px;

    background:#ffffff;
    color:#4b3326;

    font-size:23px;
    font-weight:600;

    cursor:pointer;

    outline:none;

    -webkit-tap-highlight-color:transparent;
}

.refresh-btn:disabled{
    opacity:.65;
}

.refresh-btn:active{
    transform:scale(.94);
}

.refresh-btn.spinning{
    animation:canvasSpin .7s linear infinite;
}

@keyframes canvasSpin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}


/* =========================================
   STATUS
========================================= */

.explore-status{
    min-height:20px;

    margin-bottom:14px;

    color:#6a574c;

    font-size:13px;
    font-weight:600;
}


/* =========================================
   STREAM GRID
========================================= */

.stream-grid{
    width:100%;

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:16px;
}


/* =========================================
   STREAM CARD
========================================= */

.stream-card{
    width:100%;

    overflow:hidden;

    background:#ffffff;

    border:1px solid #eadfd8;
    border-radius:18px;

    box-shadow:
        0 5px 18px
        rgba(75,51,38,.07);

    cursor:pointer;
}

.stream-thumbnail{
    width:100%;

    aspect-ratio:16 / 9;

    position:relative;

    overflow:hidden;

    background:#251b17;
}

.stream-thumbnail-image{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;
}

.stream-thumbnail-image.no-image{
    opacity:0;
}


/* =========================================
   LIVE BADGE
========================================= */

.live-badge{
    position:absolute;

    top:9px;
    left:9px;

    padding:5px 8px;

    border-radius:7px;

    background:#a33a2b;
    color:#ffffff;

    font-size:11px;
    font-weight:800;
}


/* =========================================
   STREAM BODY
========================================= */

.stream-card-body{
    padding:13px;
}

.stream-card-title{
    margin:0 0 11px;

    color:#4b3326;

    font-size:16px;
    font-weight:800;

    line-height:1.3;

    display:-webkit-box;

    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;

    overflow:hidden;
}


/* =========================================
   CREATOR
========================================= */

.stream-creator{
    display:flex;
    align-items:center;

    gap:9px;

    margin-bottom:10px;
}

.creator-avatar{
    width:34px;
    height:34px;

    min-width:34px;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    border-radius:50%;

    border:1.5px solid #d4a62a;

    background:#f3f3f3;

    color:#4b3326;

    font-size:16px;
}

.creator-avatar img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    border-radius:50%;
}

.creator-info{
    min-width:0;

    display:flex;
    flex-direction:column;

    gap:2px;
}

.creator-name{
    overflow:hidden;

    color:#4b3326;

    font-size:13px;
    font-weight:800;

    text-overflow:ellipsis;
    white-space:nowrap;
}

.creator-category{
    color:#806d61;

    font-size:11px;
    font-weight:600;
}


/* =========================================
   DESCRIPTION
========================================= */

.stream-card-description{
    margin:0 0 12px;

    color:#6a574c;

    font-size:12px;
    line-height:1.4;
}


/* =========================================
   WATCH BUTTON
========================================= */

.watch-button{
    width:100%;

    min-height:42px;

    border:0;
    border-radius:11px;

    background:#4b3326;
    color:#ffffff;

    font-size:13px;
    font-weight:800;

    cursor:pointer;
}

.watch-button:active{
    transform:scale(.98);
}


/* =========================================
   EMPTY / LOADING
========================================= */

.explore-message{
    width:100%;

    padding:32px 15px;

    text-align:center;

    color:#6a574c;

    font-size:14px;

    line-height:1.5;
}

.explore-message h3{
    margin:8px 0 5px;

    color:#4b3326;

    font-size:18px;
}

.empty-icon{
    margin-bottom:8px;

    color:#d4a62a;

    font-size:34px;
}

.hidden{
    display:none !important;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    .navbar{
        height:66px;

        padding:0 15px;
    }

    .logo{
        font-size:29px;
    }

    #topProfileIcon{
        width:40px;
        height:40px;
    }

    .explore-container{
        padding:
            20px 14px 28px;
    }

    .explore-header{
        margin-bottom:18px;
    }

    .explore-header h1{
        font-size:30px;
    }

    #exploreSearchInput{
        height:50px;

        font-size:14px;
    }

    #exploreSearchButton{
        width:50px;
        height:50px;
    }

    .stream-grid{
        grid-template-columns:1fr;

        gap:14px;
    }

}


/* =========================================
   SMALL DEVICES
========================================= */

@media(max-width:360px){

    .explore-container{
        padding-left:12px;
        padding-right:12px;
    }

    .explore-header h1{
        font-size:28px;
    }

    .stream-card-body{
        padding:12px;
    }

}

</style>

</head>

<body>


<!-- =========================================
     TOP NAVIGATION
========================================= -->

<header class="navbar">

    <div class="logo">
        Canvas
    </div>

    <a
        href="profile.html"
        id="topProfileIcon"
        aria-label="Profile"
    >

        <svg
            class="default-avatar"
            viewBox="0 0 100 100"
            fill="none"
            aria-hidden="true"
        >

            <circle
                cx="50"
                cy="34"
                r="18"
                fill="currentColor"
            />

            <path
                d="M18 86C20 65 32 55 50 55C68 55 80 65 82 86"
                fill="currentColor"
            />

        </svg>

    </a>

</header>


<!-- =========================================
     EXPLORE
========================================= -->

<main class="explore-container">

    <section class="explore-header">

        <h1>
            Explore
        </h1>

        <p>
            Discover live streams and creators
        </p>

    </section>


    <!-- SEARCH -->

    <section class="explore-search">

        <div class="explore-search-row">

            <input
                type="search"
                id="exploreSearchInput"
                placeholder="Search streams or creators..."
                autocomplete="off"
            >
             <button
                type="button"
                id="exploreSearchButton"
                aria-label="Search"
            >

                <svg
                    width="22"
                    height="22"
                    viewBox="0 0 24 24"
                    fill="none"
                    aria-hidden="true"
                >

                    <circle
                        cx="11"
                        cy="11"
                        r="7"
                        stroke="currentColor"
                        stroke-width="2.5"
                    />

                    <path
                        d="M16.5 16.5L21 21"
                        stroke="currentColor"
                        stroke-width="2.5"
                        stroke-linecap="round"
                    />

                </svg>

            </button>

        </div>

    </section>


    <!-- CATEGORIES -->

    <section class="category-section">

        <div class="section-title">
            Categories
        </div>

        <div
            class="category-list"
            id="categoryList"
        >

            <button
                type="button"
                class="category-btn active"
                data-category="All"
            >
                All
            </button>

            <button
                type="button"
                class="category-btn"
                data-category="Gaming"
            >
                Gaming
            </button>

            <button
                type="button"
                class="category-btn"
                data-category="Entertainment"
            >
                Entertainment
            </button>

            <button
                type="button"
                class="category-btn"
                data-category="Music"
            >
                Music
            </button>

            <button
                type="button"
                class="category-btn"
                data-category="Education"
            >
                Education
            </button>

            <button
                type="button"
                class="category-btn"
                data-category="Sports"
            >
                Sports
            </button>

            <button
                type="button"
                class="category-btn"
                data-category="Technology"
            >
                Technology
            </button>

            <button
                type="button"
                class="category-btn"
                data-category="Other"
            >
                Other
            </button>

        </div>

    </section>


    <!-- LIVE -->

    <section class="live-section">

        <div class="section-heading">

            <h2>
                Live Now
            </h2>

            <div
                style="
                    display:flex;
                    align-items:center;
                    gap:9px;
                "
            >

                <span id="liveCount">
                    0 live
                </span>

                <button
                    type="button"
                    id="refreshButton"
                    class="refresh-btn"
                    aria-label="Refresh"
                >
                    ↻
                </button>

            </div>

        </div>


        <div
            id="exploreStatus"
            class="explore-status"
        >
            Loading live streams...
        </div>


        <div
            id="streamGrid"
            class="stream-grid"
        ></div>


        <div
            id="emptyMessage"
            class="explore-message hidden"
        >

            <div class="empty-icon">
                🔎
            </div>

            <h3>
                No live streams found
            </h3>

            <p>
                Try another search or category.
            </p>

        </div>

    </section>

</main>
    <template id="streamCardTemplate">

        <article class="stream-card">

            <div class="thumbnail-wrap">
                <img
                    class="stream-thumbnail"
                    src=""
                    alt="Stream thumbnail"
                >

                <div class="live-badge">
                    LIVE
                </div>

                <div class="viewer-count">
                    <span class="viewer-icon">👁</span>
                    <span class="viewer-number">0</span>
                </div>
            </div>

            <div class="stream-info">

                <div class="creator-row">

                    <div class="creator-avatar">
                        <svg
                            class="default-avatar"
                            viewBox="0 0 64 64"
                            xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true"
                        >
                            <circle
                                cx="32"
                                cy="32"
                                r="32"
                                fill="#eeeeee"
                            />
                            <circle
                                cx="32"
                                cy="24"
                                r="10"
                                fill="#999999"
                            />
                            <path
                                d="M14 54c1.8-11 8.8-17 18-17s16.2 6 18 17"
                                fill="#999999"
                            />
                        </svg>
                    </div>

                    <div class="creator-details">

                        <div class="stream-title">
                            Stream Title
                        </div>

                        <div class="creator-name">
                            Canvas Creator
                        </div>

                    </div>

                </div>

                <div class="stream-category">
                    Entertainment
                </div>

            </div>

        </article>

    </template>


    <script>

    const EXPLORE_API =
        "https://canvas-kh9p.onrender.com";


    /* =========================================
       AUTH
    ========================================= */

    function getToken(){

        return (
            localStorage.getItem("canvasAuthToken") ||
            localStorage.getItem("canvasToken") ||
            localStorage.getItem("authToken") ||
            ""
        );

    }


    function authHeaders(){

        const token = getToken();

        const headers = {
            "Accept":"application/json"
        };

        if(token){

            headers.Authorization =
                "Bearer " + token;

        }

        return headers;

    }


    /* =========================================
       ELEMENTS
    ========================================= */

    const searchInput =
        document.getElementById(
            "exploreSearchInput"
        );

    const searchButton =
        document.getElementById(
            "exploreSearchButton"
        );

    const refreshButton =
        document.getElementById(
            "refreshButton"
        );

    const streamGrid =
        document.getElementById(
            "streamGrid"
        );

    const exploreStatus =
        document.getElementById(
            "exploreStatus"
        );

    const liveCount =
        document.getElementById(
            "liveCount"
        );

    const emptyMessage =
        document.getElementById(
            "emptyMessage"
        );


    let exploreStreams = [];

    let selectedCategory = "All";

    let searchTerm = "";


    /* =========================================
       DEFAULT AVATAR
    ========================================= */

    function createDefaultAvatar(){

        const wrapper =
            document.createElement("span");

        wrapper.className =
            "default-avatar";

        wrapper.innerHTML = `
            <svg
                viewBox="0 0 64 64"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
            >
                <circle
                    cx="32"
                    cy="32"
                    r="32"
                    fill="#eeeeee"
                />
                <circle
                    cx="32"
                    cy="24"
                    r="10"
                    fill="#999999"
                />
                <path
                    d="M14 54c1.8-11 8.8-17 18-17s16.2 6 18 17"
                    fill="#999999"
                />
            </svg>
        `;

        return wrapper;

    }


    function getCanvasProfile(){

        try{

            return JSON.parse(
                localStorage.getItem(
                    "canvasProfile"
                ) || "{}"
            );

        }catch(error){

            return {};

        }

    }


    function applyProfilePhoto(
        element,
        photo
    ){

        if(!element) return;


        const oldImage =
            element.querySelector("img");


        if(photo){

            if(oldImage){

                oldImage.src = photo;

                return;

            }


            const image =
                document.createElement("img");

            image.src = photo;

            image.alt = "Profile";


            image.onerror = function(){

                image.remove();

                if(
                    !element.querySelector(
                        ".default-avatar"
                    )
                ){

                    element.prepend(
                        createDefaultAvatar()
                    );

                }

            };


            const defaultAvatar =
                element.querySelector(
                    ".default-avatar"
                );


            if(defaultAvatar){

                defaultAvatar.replaceWith(
                    image
                );

            }else{

                element.prepend(
                    image
                );

            }

        }else{

            if(oldImage){

                oldImage.remove();

            }


            if(
                !element.querySelector(
                    ".default-avatar"
                )
            ){

                element.prepend(
                    createDefaultAvatar()
                );

            }

        }

    }


    /* =========================================
       STREAM NORMALIZER
    ========================================= */

    function normalizeStream(stream){

        if(!stream){

            return null;

        }


        return {

            id:
                stream.id ||
                stream.stream_id ||
                stream.streamId ||
                "",

            title:
                stream.title ||
                stream.name ||
                "Untitled Stream",

            category:
                stream.category ||
                "Other",

            description:
                stream.description ||
                "",

            username:
                stream.username ||
                stream.user_username ||
                "",

            name:
                stream.name ||
                stream.user_name ||
                stream.creator_name ||
                "Canvas Creator",

            thumbnail:
                stream.thumbnail ||
                stream.thumbnail_url ||
                stream.thumbnailUrl ||
                "",

            profileImage:
                stream.profile_picture ||
                stream.profileImage ||
                stream.profilePhoto ||
                stream.avatar ||
                stream.photo ||
                stream.image ||
                "",

            viewers:
                Number(
                    stream.viewers ||
                    stream.viewer_count ||
                    stream.viewerCount ||
                    0
                )

        };

    }


    /* =========================================
       THUMBNAIL
    ========================================= */

    function applyThumbnail(
        image,
        thumbnail
    ){

        if(!image) return;


        if(thumbnail){

            image.src = thumbnail;

            image.onerror = function(){

                image.onerror = null;

                image.src =
                    "data:image/svg+xml;charset=UTF-8," +
                    encodeURIComponent(`
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="800"
                            height="450"
                            viewBox="0 0 800 450"
                        >
                            <rect
                                width="800"
                                height="450"
                                fill="#eeeeee"
                            />
                            <text
                                x="400"
                                y="225"
                                text-anchor="middle"
                                dominant-baseline="middle"
                                fill="#999"
                                font-size="28"
                                font-family="Arial"
                            >
                                Canvas Live
                            </text>
                        </svg>
                    `);

            };

        }else{

            image.src =
                "data:image/svg+xml;charset=UTF-8," +
                encodeURIComponent(`
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="800"
                        height="450"
                        viewBox="0 0 800 450"
                    >
                        <rect
                            width="800"
                            height="450"
                            fill="#eeeeee"
                        />
                        <text
                            x="400"
                            y="225"
                            text-anchor="middle"
                            dominant-baseline="middle"
                            fill="#999"
                            font-size="28"
                            font-family="Arial"
                        >
                            Canvas Live
                        </text>
                    </svg>
                `);

        }

    }


    /* =========================================
       CREATOR AVATAR
    ========================================= */

    function setCreatorAvatar(
        container,
        photo
    ){

        if(!container) return;


        container.innerHTML = "";


        if(photo){

            const image =
                document.createElement("img");

            image.src = photo;

            image.alt = "Creator";


            image.onerror = function(){

                container.innerHTML = "";

                container.appendChild(
                    createDefaultAvatar()
                );

            };


            container.appendChild(
                image
            );

        }else{

            container.appendChild(
                createDefaultAvatar()
            );

        }

    }


    /* =========================================
       CREATE STREAM CARD
    ========================================= */

    function createStreamCard(stream){

        const card =
            document
                .getElementById(
                    "streamCardTemplate"
                )
                .content
                .firstElementChild
                .cloneNode(true);


        const thumbnail =
            card.querySelector(
                ".stream-thumbnail"
            );


        const title =
            card.querySelector(
                ".stream-title"
            );


        const creatorName =
            card.querySelector(
                ".creator-name"
            );


        const category =
            card.querySelector(
                ".stream-category"
            );


        const avatar =
            card.querySelector(
                ".creator-avatar"
            );


        const viewerNumber =
            card.querySelector(
                ".viewer-number"
            );


        applyThumbnail(
            thumbnail,
            stream.thumbnail
        );


        title.textContent =
            stream.title;


        creatorName.textContent =
            stream.username
                ? "@" + stream.username
                : stream.name;


        category.textContent =
            stream.category;


        viewerNumber.textContent =
            stream.viewers;


        setCreatorAvatar(
            avatar,
            stream.profileImage
        );


        card.addEventListener(
            "click",
            function(){

                openStream(stream);

            }
        );


        return card;

    }


    /* =========================================
       OPEN STREAM
    ========================================= */

    function openStream(stream){

        if(!stream.id){

            return;

        }


        localStorage.setItem(
            "canvasViewingStream",
            JSON.stringify(stream)
        );


        localStorage.setItem(
            "canvasCurrentStreamId",
            String(stream.id)
        );


        window.location.href =
            "watch.html?stream=" +
            encodeURIComponent(
                stream.id
            );

    }
    /* =========================================
       FILTER
    ========================================= */

    function getFilteredStreams(){

        return exploreStreams.filter(
            function(stream){

                const categoryMatch =
                    selectedCategory === "All" ||
                    String(
                        stream.category
                    ).toLowerCase() ===
                    selectedCategory.toLowerCase();


                const text =
                    (
                        stream.title +
                        " " +
                        stream.name +
                        " " +
                        stream.username +
                        " " +
                        stream.category +
                        " " +
                        stream.description
                    ).toLowerCase();


                const searchMatch =
                    !searchTerm ||
                    text.includes(
                        searchTerm
                    );


                return (
                    categoryMatch &&
                    searchMatch
                );

            }
        );

    }


    /* =========================================
       RENDER
    ========================================= */

    function renderStreams(){

        const filtered =
            getFilteredStreams();


        streamGrid.innerHTML = "";


        liveCount.textContent =
            filtered.length;


        if(!filtered.length){

            emptyMessage.style.display =
                "block";

            return;

        }


        emptyMessage.style.display =
            "none";


        filtered.forEach(
            function(stream){

                streamGrid.appendChild(
                    createStreamCard(stream)
                );

            }
        );

    }


    /* =========================================
       LOAD LIVE STREAMS
    ========================================= */

    async function loadLiveStreams(){

        refreshButton.disabled = true;

        exploreStatus.textContent =
            "Loading live streams...";


        try{

            const response =
                await fetch(
                    EXPLORE_API +
                    "/api/streams/live",
                    {
                        method:"GET",
                        headers:authHeaders(),
                        cache:"no-store"
                    }
                );


            if(!response.ok){

                throw new Error(
                    "Failed to load live streams"
                );

            }


            const data =
                await response.json();


            const streams =
                Array.isArray(data)
                    ? data
                    : (
                        data.streams ||
                        data.liveStreams ||
                        []
                    );


            exploreStreams =
                streams
                    .map(normalizeStream)
                    .filter(
                        stream =>
                            stream &&
                            stream.id
                    );


            exploreStatus.textContent =
                exploreStreams.length
                    ? "Live streams"
                    : "No one is live right now.";


            renderStreams();

        }catch(error){

            console.error(
                "Explore stream error:",
                error
            );


            exploreStatus.textContent =
                "Unable to load live streams.";


            exploreStreams = [];

            renderStreams();

        }finally{

            refreshButton.disabled =
                false;

        }

    }
        /* =========================================
       SEARCH
    ========================================= */

    function performSearch(){

        searchTerm =
            (searchInput.value || "")
            .trim()
            .toLowerCase();

        renderStreams();

    }


    searchButton.addEventListener(
        "click",
        performSearch
    );


    searchInput.addEventListener(
        "input",
        function(){

            searchTerm =
                (searchInput.value || "")
                .trim()
                .toLowerCase();

            renderStreams();

        }
    );


    searchInput.addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                event.preventDefault();

                performSearch();

            }

        }
    );


    /* =========================================
       CATEGORY BUTTONS
    ========================================= */

    document
        .querySelectorAll(
            ".category-btn"
        )
        .forEach(
            function(button){

                button.addEventListener(
                    "click",
                    function(){

                        document
                            .querySelectorAll(
                                ".category-btn"
                            )
                            .forEach(
                                function(item){

                                    item.classList.remove(
                                        "active"
                                    );

                                }
                            );


                        button.classList.add(
                            "active"
                        );


                        selectedCategory =
                            button.dataset.category ||
                            button.textContent.trim();


                        renderStreams();

                    }
                );

            }
        );


    /* =========================================
       REFRESH
    ========================================= */

    refreshButton.addEventListener(
        "click",
        function(){

            loadLiveStreams();

        }
    );


    /* =========================================
       PROFILE
    ========================================= */

    async function loadExploreProfile(){

        const topProfile =
            document.getElementById(
                "topProfileIcon"
            );

        const bottomProfile =
            document.getElementById(
                "bottomProfileIcon"
            );


        let profile = {};


        try{

            const response =
                await fetch(
                    EXPLORE_API +
                    "/api/profile",
                    {
                        method:"GET",
                        headers:authHeaders(),
                        cache:"no-store"
                    }
                );


            if(response.ok){

                const data =
                    await response.json();


                profile =
                    data.profile ||
                    data.user ||
                    data;


                localStorage.setItem(
                    "canvasProfile",
                    JSON.stringify(profile)
                );

            }else{

                profile =
                    getCanvasProfile();

            }

        }catch(error){

            profile =
                getCanvasProfile();

        }


        const photo =
            profile.profile_picture ||
            profile.profileImage ||
            profile.profilePhoto ||
            profile.photo ||
            profile.image ||
            profile.avatar ||
            "";


        applyProfilePhoto(
            topProfile,
            photo
        );


        applyProfilePhoto(
            bottomProfile,
            photo
        );

    }


    /* =========================================
       INITIAL LOAD
    ========================================= */

    loadExploreProfile();

    loadLiveStreams();


    window.addEventListener(
        "storage",
        function(event){

            if(
                event.key ===
                "canvasProfile"
            ){

                loadExploreProfile();

            }

        }
    );

    </script>
