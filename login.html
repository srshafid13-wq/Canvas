<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Canvas - Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#ffffff;
color:#4b3024;
min-height:100vh;
}

.container{
width:100%;
max-width:450px;
margin:auto;
padding:45px 25px;
}

.logo{
text-align:center;
font-size:42px;
font-weight:bold;
color:#6F4E37;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#777;
margin-bottom:35px;
}

.form-group{
margin-bottom:20px;
}

label{
display:block;
font-weight:bold;
margin-bottom:8px;
}

input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
outline:none;
background:#fafafa;
}

input:focus{
border-color:#D4A017;
background:#fff;
}

.password-box{
position:relative;
}

.password-box input{
padding-right:50px;
}

.show-password{
position:absolute;
right:12px;
top:50%;
transform:translateY(-50%);
border:none;
background:none;
font-size:18px;
cursor:pointer;
}

.login-button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#6F4E37;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
margin-top:5px;
}

.forgot{
display:block;
text-align:right;
margin-top:12px;
color:#6F4E37;
font-size:14px;
text-decoration:none;
}

.signup{
text-align:center;
margin-top:25px;
color:#777;
}

.signup a{
color:#6F4E37;
font-weight:bold;
text-decoration:none;
}

.message{
text-align:center;
margin-top:15px;
font-size:14px;
color:#b00020;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
Canvas
</div>

<p class="subtitle">
Welcome back to Canvas
</p>


<form id="loginForm">


<!-- EMAIL -->

<div class="form-group">

<label>
Email
</label>

<input
type="email"
id="email"
placeholder="you@example.com"
required
>

</div>


<!-- PASSWORD -->

<div class="form-group">

<label>
Password
</label>

<div class="password-box">

<input
type="password"
id="password"
placeholder="Your password"
required
>

<button
type="button"
class="show-password"
onclick="togglePassword()"
>
👁️
</button>

</div>

</div>


<button
type="submit"
class="login-button"
>
Log In
</button>


<a href="#" class="forgot">
Forgot password?
</a>


</form>


<p
class="message"
id="message"
></p>


<p class="signup">

Don't have a Canvas account?

<a href="signup.html">
Create account
</a>

</p>

</div>


<script>

/* SHOW / HIDE PASSWORD */

function togglePassword(){

const password =
document.getElementById("password");

if(password.type === "password"){

password.type = "text";

}else{

password.type = "password";

}

}


/* LOGIN */

document
.getElementById("loginForm")
.addEventListener("submit",function(e){

e.preventDefault();


const email =
document
.getElementById("email")
.value
.trim();


const password =
document
.getElementById("password")
.value;


const message =
document
.getElementById("message");


/* GET SAVED ACCOUNT */

const savedAccount =
localStorage.getItem("canvasAccount");


if(!savedAccount){

message.textContent =
"No Canvas account found. Please create an account first.";

return;

}


const account =
JSON.parse(savedAccount);


/* CHECK EMAIL */

if(email !== account.email){

message.textContent =
"Email or password is incorrect.";

return;

}


/* CHECK PASSWORD */

if(password !== account.password){

message.textContent =
"Email or password is incorrect.";

return;

}


/* LOGIN SUCCESS */

localStorage.setItem(
"canvasLoggedIn",
"true"
);


/* SAVE CURRENT USER */

localStorage.setItem(
"canvasCurrentUser",
JSON.stringify(account)
);


/* GO TO PROFILE */

window.location.href =
"profile.html";

});

</script>

</body>

</html>
