<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Canvas - Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#ffffff;
color:#4b3024;
min-height:100vh;
}

.container{
width:100%;
max-width:450px;
margin:auto;
padding:25px;
}


/* =========================================
   BACK BUTTON
========================================= */

.back-button{
display:inline-flex;
align-items:center;
gap:6px;
color:#6F4E37;
text-decoration:none;
font-size:16px;
font-weight:bold;
margin-bottom:35px;
}

.back-arrow{
font-size:28px;
line-height:16px;
}


/* =========================================
   LOGO
========================================= */

.logo{
text-align:center;
font-size:42px;
font-weight:bold;
color:#6F4E37;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#777;
margin-bottom:35px;
}


/* =========================================
   FORM
========================================= */

.form-group{
margin-bottom:20px;
}

label{
display:block;
font-weight:bold;
margin-bottom:8px;
}

input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
outline:none;
background:#fafafa;
}

input:focus{
border-color:#D4A017;
background:#fff;
}


/* =========================================
   PASSWORD
========================================= */

.password-box{
position:relative;
}

.password-box input{
padding-right:50px;
}

.show-password{
position:absolute;
right:12px;
top:50%;
transform:translateY(-50%);
width:30px;
height:30px;
border:none;
background:transparent;
font-size:18px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
padding:0;
}


/* =========================================
   LOGIN BUTTON
========================================= */

.login-button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#6F4E37;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
margin-top:5px;
}

.login-button:disabled{
opacity:.6;
cursor:not-allowed;
}


/* =========================================
   FORGOT PASSWORD
========================================= */

.forgot{
display:block;
text-align:right;
margin-top:12px;
color:#6F4E37;
font-size:14px;
text-decoration:none;
}


/* =========================================
   SIGNUP
========================================= */

.signup{
text-align:center;
margin-top:25px;
color:#777;
}

.signup a{
color:#6F4E37;
font-weight:bold;
text-decoration:none;
}


/* =========================================
   MESSAGE
========================================= */

.message{
text-align:center;
margin-top:15px;
font-size:14px;
color:#b00020;
line-height:1.5;
min-height:22px;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

.container{
padding:22px;
}

.back-button{
margin-bottom:30px;
}

.logo{
font-size:40px;
}

}

</style>

</head>

<body>

<div class="container">


<!-- =========================================
     BACK
========================================= -->

<a
    href="stream.html"
    class="back-button">

    <span class="back-arrow">
        ‹
    </span>

    <span>
        Back
    </span>

</a>


<!-- =========================================
     LOGO
========================================= -->

<div class="logo">
    Canvas
</div>

<p class="subtitle">
    Welcome back to Canvas
</p>


<!-- =========================================
     LOGIN FORM
========================================= -->

<form
    id="loginForm"
    novalidate>


<!-- EMAIL -->

<div class="form-group">

<label for="email">
    Email
</label>

<input
    type="email"
    id="email"
    placeholder="you@example.com"
    autocomplete="email"
    required>

</div>


<!-- PASSWORD -->

<div class="form-group">

<label for="password">
    Password
</label>

<div class="password-box">

<input
    type="password"
    id="password"
    placeholder="Your password"
    autocomplete="current-password"
    required>

<button
    type="button"
    class="show-password"
    id="showPasswordButton"
    aria-label="Show password">

    👁️

</button>

</div>

</div>


<!-- LOGIN -->

<button
    type="submit"
    class="login-button"
    id="loginButton">

    Log In

</button>


<!-- FORGOT -->

<a
    href="#"
    class="forgot"
    id="forgotPassword">

    Forgot password?

</a>

</form>


<!-- MESSAGE -->

<p
    class="message"
    id="message">
</p>


<!-- SIGNUP -->

<p class="signup">

    Don't have a Canvas account?

    <a href="signup.html">
        Create account
    </a>

</p>


</div>


<script>

/* =========================================
   CANVAS BACKEND
========================================= */

const API =
    "https://canvas-kh9p.onrender.com";


/* =========================================
   ELEMENTS
========================================= */

const loginForm =
    document.getElementById(
        "loginForm"
    );

const emailInput =
    document.getElementById(
        "email"
    );

const passwordInput =
    document.getElementById(
        "password"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const message =
    document.getElementById(
        "message"
    );

const showPasswordButton =
    document.getElementById(
        "showPasswordButton"
    );

const forgotPassword =
    document.getElementById(
        "forgotPassword"
    );


/* =========================================
   SHOW / HIDE PASSWORD
   👁️ ALWAYS STAYS
========================================= */

showPasswordButton.addEventListener(
    "click",
    function(){

        if(
            passwordInput.type ===
            "password"
        ){

            passwordInput.type =
                "text";

            showPasswordButton.textContent =
                "👁️";

            showPasswordButton.setAttribute(
                "aria-label",
                "Hide password"
            );

        }else{

            passwordInput.type =
                "password";

            showPasswordButton.textContent =
                "👁️";

            showPasswordButton.setAttribute(
                "aria-label",
                "Show password"
            );

        }

    }
);


/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();
        event.stopPropagation();


        /* =====================================
           VALUES
        ===================================== */

        const email =
            emailInput.value
                .trim()
                .toLowerCase();

        const password =
            passwordInput.value;


        /* =====================================
           CLEAR MESSAGE
        ===================================== */

        message.textContent = "";

        message.style.color =
            "#b00020";


        /* =====================================
           VALIDATION
        ===================================== */

        if(!email){

            message.textContent =
                "Please enter your email.";

            emailInput.focus();

            return;

        }


        if(!password){

            message.textContent =
                "Please enter your password.";

            passwordInput.focus();

            return;

        }


        /* =====================================
           BUTTON
        ===================================== */

        loginButton.disabled =
            true;

        loginButton.textContent =
            "Logging in...";


        try{

            /* =================================
               SEND LOGIN
            ================================= */

            const response =
                await fetch(

                    API +
                    "/api/login",

                    {

                        method:"POST",

                        headers:{

                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"

                        },

                        body:
                        JSON.stringify({

                            email:
                                email,

                            password:
                                password

                        })

                    }

                );


            /* =================================
               RESPONSE
            ================================= */

            let data = {};

            try{

                data =
                    await response.json();

            }catch(error){

                data = {};

            }


            console.log(
                "Canvas login:",
                response.status,
                data
            );


            /* =================================
               SERVER REJECTED LOGIN
            ================================= */

            if(!response.ok){

                throw new Error(

                    data.message ||
                    data.error ||
                    "Email or password is incorrect."

                );

            }


            /* =================================
               TOKEN
            ================================= */

            const token =
                String(
                    data.token ||
                    data.accessToken ||
                    data.authToken ||
                    ""
                ).trim();


            if(!token){

                throw new Error(
                    "Login succeeded, but Canvas did not receive an authentication token."
                );

            }


            /* =================================
               USER
            ================================= */

            const user =
                data.user || {};


            /* =================================
               ACCOUNT
            ================================= */

            const cleanUsername =
                String(
                    user.username ||
                    ""
                )
                .replace(
                    /^@/,
                    ""
                )
                .trim()
                .toLowerCase();


            const account = {

                id:
                    user.id ||
                    "",

                email:
                    user.email ||
                    email,

                username:
                    cleanUsername,

                displayName:
                    user.name ||
                    user.displayName ||
                    ""

            };


            /* =================================
               SAVE AUTH TOKEN
========================================= */

            localStorage.setItem(
                "canvasAuthToken",
                token
            );


            /* =================================
               SAVE LOGIN STATE
========================================= */

            localStorage.setItem(
                "canvasLoggedIn",
                "true"
            );


            /* =================================
               SAVE CURRENT USER
========================================= */

            localStorage.setItem(
                "canvasCurrentUser",
                JSON.stringify(account)
            );


            /* =================================
               SAVE CANVAS ACCOUNT
========================================= */

            localStorage.setItem(
                "canvasAccount",
                JSON.stringify({

                    id:
                        account.id,

                    email:
                        account.email,

                    username:
                        account.username,

                    displayName:
                        account.displayName

                })
            );


            /* =================================
               SUCCESS
========================================= */

            message.style.color =
                "#4b3326";

            message.textContent =
                "Login successful!";


            loginButton.textContent =
                "Logged In";


            /* =================================
               PROFILE
========================================= */

            setTimeout(
                function(){

                    window.location.href =
                        "profile.html";

                },
                300
            );


        }catch(error){

            console.error(
                "Canvas login error:",
                error
            );


            message.style.color =
                "#b00020";

            message.textContent =
                error.message ||
                "Could not log in to Canvas.";


            loginButton.disabled =
                false;

            loginButton.textContent =
                "Log In";

        }

    }
);


/* =========================================
   FORGOT PASSWORD
========================================= */

forgotPassword.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        alert(
            "Forgot password is not available yet."
        );

    }
);

</script>

</body>

  </html>
