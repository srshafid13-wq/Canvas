<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Canvas - Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#ffffff;
color:#4b3024;
min-height:100vh;
}

.container{
width:100%;
max-width:450px;
margin:auto;
padding:25px;
}

.back-button{
display:inline-flex;
align-items:center;
gap:6px;
color:#6F4E37;
text-decoration:none;
font-size:16px;
font-weight:bold;
margin-bottom:35px;
}

.back-arrow{
font-size:28px;
line-height:16px;
}

.logo{
text-align:center;
font-size:42px;
font-weight:bold;
color:#6F4E37;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#777;
margin-bottom:35px;
}

.form-group{
margin-bottom:20px;
}

label{
display:block;
font-weight:bold;
margin-bottom:8px;
}

input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
outline:none;
background:#fafafa;
}

input:focus{
border-color:#D4A017;
background:#fff;
}

.password-box{
position:relative;
}

.password-box input{
padding-right:50px;
}

.show-password{
position:absolute;
right:12px;
top:50%;
transform:translateY(-50%);
width:30px;
height:30px;
border:none;
background:transparent;
font-size:18px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
padding:0;
}

.login-button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#6F4E37;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
margin-top:5px;
}

.login-button:disabled{
opacity:.6;
cursor:not-allowed;
}

.forgot{
display:block;
text-align:right;
margin-top:12px;
color:#6F4E37;
font-size:14px;
text-decoration:none;
}

.signup{
text-align:center;
margin-top:25px;
color:#777;
}

.signup a{
color:#6F4E37;
font-weight:bold;
text-decoration:none;
}

.message{
text-align:center;
margin-top:15px;
font-size:14px;
color:#b00020;
line-height:1.5;
min-height:22px;
}

@media(max-width:600px){

.container{
padding:22px;
}

.back-button{
margin-bottom:30px;
}

.logo{
font-size:40px;
}

}

</style>

</head>

<body>

<div class="container">


<a
    href="stream.html"
    class="back-button">

    <span class="back-arrow">
        ‹
    </span>

    <span>
        Back
    </span>

</a>


<div class="logo">
    Canvas
</div>

<p class="subtitle">
    Welcome back to Canvas
</p>


<form
    id="loginForm"
    novalidate>


<div class="form-group">

<label for="email">
    Email
</label>

<input
    type="email"
    id="email"
    placeholder="you@example.com"
    autocomplete="email"
    required>

</div>


<div class="form-group">

<label for="password">
    Password
</label>

<div class="password-box">

<input
    type="password"
    id="password"
    placeholder="Your password"
    autocomplete="current-password"
    required>

<button
    type="button"
    class="show-password"
    id="showPasswordButton"
    aria-label="Show password">

    👁️

</button>

</div>

</div>


<button
    type="submit"
    class="login-button"
    id="loginButton">

    Log In

</button>


<a
    href="#"
    class="forgot"
    id="forgotPassword">

    Forgot password?

</a>

</form>


<p
    class="message"
    id="message">
</p>


<p class="signup">

    Don't have a Canvas account?

    <a href="signup.html">
        Create account
    </a>

</p>


</div>


<script>

/* =========================================
   CANVAS BACKEND
========================================= */

const API =
    "https://canvas-kh9p.onrender.com";


/* =========================================
   ELEMENTS
========================================= */

const loginForm =
    document.getElementById(
        "loginForm"
    );

const emailInput =
    document.getElementById(
        "email"
    );

const passwordInput =
    document.getElementById(
        "password"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const message =
    document.getElementById(
        "message"
    );

const showPasswordButton =
    document.getElementById(
        "showPasswordButton"
    );

const forgotPassword =
    document.getElementById(
        "forgotPassword"
    );


/* =========================================
   SHOW / HIDE PASSWORD
========================================= */

showPasswordButton.addEventListener(
    "click",
    function(){

        if(
            passwordInput.type === "password"
        ){

            passwordInput.type =
                "text";

            showPasswordButton.setAttribute(
                "aria-label",
                "Hide password"
            );

        }else{

            passwordInput.type =
                "password";

            showPasswordButton.setAttribute(
                "aria-label",
                "Show password"
            );

        }

    }
);


/* =========================================
   GET AUTHENTICATION TOKEN
========================================= */

function getAuthToken(){

    return String(
        localStorage.getItem(
            "canvasAuthToken"
        ) || ""
    ).trim();

}


/* =========================================
   VERIFY LOGIN WITH SERVER
========================================= */

async function verifyLogin(token){

    const response =
        await fetch(
            API + "/api/me",
            {
                method:"GET",

                headers:{
                    "Accept":
                        "application/json",

                    "Authorization":
                        "Bearer " + token
                }
            }
        );


    let data = {};

    try{

        data =
            await response.json();

    }catch(error){

        data = {};

    }


    if(
        !response.ok ||
        !data.success ||
        !data.user
    ){

        throw new Error(
            data.message ||
            "Canvas could not verify your login."
        );

    }


    return data.user;

}


/* =========================================
   SAVE AUTHENTICATED USER
========================================= */

function saveAuthenticatedUser(user){

    const cleanUsername =
        String(
            user.username || ""
        )
        .replace(/^@/,"")
        .trim()
        .toLowerCase();


    const account = {

        id:
            user.id || "",

        email:
            user.email || "",

        username:
            cleanUsername,

        displayName:
            user.name || ""

    };


    /* ================================
       AUTH TOKEN
    ================================= */

    const token =
        getAuthToken();


    if(!token){

        throw new Error(
            "Canvas authentication token is missing."
        );

    }


    localStorage.setItem(
        "canvasAuthToken",
        token
    );


    /* ================================
       LOGIN STATE
    ================================= */

    localStorage.setItem(
        "canvasLoggedIn",
        "true"
    );


    /* ================================
       CURRENT USER
    ================================= */

    localStorage.setItem(
        "canvasCurrentUser",
        JSON.stringify(account)
    );


    /* ================================
       ACCOUNT
    ================================= */

    localStorage.setItem(
        "canvasAccount",
        JSON.stringify(account)
    );


    return account;

}


/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();
        event.stopPropagation();


        const email =
            emailInput.value
                .trim()
                .toLowerCase();

        const password =
            passwordInput.value;


        message.textContent = "";

        message.style.color =
            "#b00020";


        /* =====================================
           VALIDATION
        ===================================== */

        if(!email){

            message.textContent =
                "Please enter your email.";

            emailInput.focus();

            return;

        }


        if(!password){

            message.textContent =
                "Please enter your password.";

            passwordInput.focus();

            return;

        }


        /* =====================================
           BUTTON
        ===================================== */

        loginButton.disabled =
            true;

        loginButton.textContent =
            "Logging in...";


        try{

            /* =================================
               SERVER LOGIN
            ================================= */

            const response =
                await fetch(

                    API + "/api/login",

                    {

                        method:"POST",

                        headers:{

                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"

                        },

                        body:
                        JSON.stringify({

                            email:
                                email,

                            password:
                                password

                        })

                    }

                );


            /* =================================
               READ RESPONSE
            ================================= */

            let data = {};

            try{

                data =
                    await response.json();

            }catch(error){

                data = {};

            }


            console.log(
                "Canvas login:",
                response.status,
                data
            );


            /* =================================
               LOGIN FAILED
            ================================= */

            if(
                !response.ok ||
                !data.success
            ){

                throw new Error(

                    data.message ||
                    data.error ||
                    "Email or password is incorrect."

                );

            }


            /* =================================
               TOKEN
            ================================= */

            const token =
                String(
                    data.token || ""
                ).trim();


            if(!token){

                throw new Error(
                    "Login succeeded, but Canvas did not receive an authentication token."
                );

            }


            /* =================================
               SAVE TOKEN FIRST
            ================================= */

            localStorage.setItem(
                "canvasAuthToken",
                token
            );


            /* =================================
               VERIFY TOKEN
               
               IMPORTANT:
               We do NOT send the user
               to Profile until the server
               confirms the token.
            ================================= */

            const verifiedUser =
                await verifyLogin(token);


            /* =================================
               SAVE AUTHENTICATED USER
            ================================= */

            saveAuthenticatedUser(
                verifiedUser
            );


            /* =================================
               REMOVE STALE LOCAL PROFILE
               
               Profile will now load the
               real profile from the server.
               
               This prevents an old profile
               from another account/device
               from being shown.
            ================================= */

            localStorage.removeItem(
                "canvasProfile"
            );


            /* =================================
               SUCCESS
            ================================= */

            message.style.color =
                "#4b3326";

            message.textContent =
                "Login successful!";


            loginButton.textContent =
                "Logged In";


            /* =================================
               GO TO PROFILE
            ================================= */

            setTimeout(
                function(){

                    window.location.href =
                        "profile.html";

                },
                400
            );


        }catch(error){

            console.error(
                "Canvas login error:",
                error
            );


            /*
             * If authentication failed after
             * receiving a token, remove it.
             */

            localStorage.removeItem(
                "canvasAuthToken"
            );

            localStorage.removeItem(
                "canvasLoggedIn"
            );

            localStorage.removeItem(
                "canvasCurrentUser"
            );

            localStorage.removeItem(
                "canvasAccount"
            );


            message.style.color =
                "#b00020";

            message.textContent =
                error.message ||
                "Could not log in to Canvas.";


            loginButton.disabled =
                false;

            loginButton.textContent =
                "Log In";

        }

    }
);


/* =========================================
   FORGOT PASSWORD
========================================= */

forgotPassword.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        alert(
            "Forgot password is not available yet."
        );

    }
);

</script>

</body>

  </html>
