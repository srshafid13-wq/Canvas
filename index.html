<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvas</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#ffffff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.container{
text-align:center;
}

.logo{
font-size:55px;
font-weight:bold;
color:#6F4E37;
letter-spacing:3px;
margin-bottom:40px;
text-shadow:none;
animation:fadeIn 1s ease;
}


.loader{
width:240px;
height:3px;
background:#ececec;
border-radius:50px;
position:relative;
overflow:hidden;
margin:auto;
}


.left{
position:absolute;
width:28%;
height:100%;
background:#D4A017;
left:-28%;
animation:leftMove 2.2s linear infinite;
}

.right{
position:absolute;
width:28%;
height:100%;
background:#D4A017;
right:-28%;
animation:rightMove 2.2s linear infinite;
}

.glow{
position:absolute;
left:50%;
top:50%;
width:8px;
height:8px;
background:#D4A017;
border-radius:50%;
transform:translate(-50%,-50%);
box-shadow:0 0 12px #D4A017;
opacity:0;
animation:flash 2.2s linear infinite;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@keyframes leftMove{
0%{
left:-40%;
}
45%{
left:30%;
}
50%{
left:30%;
}
100%{
left:100%;
}
}

@keyframes rightMove{
0%{
right:-40%;
}
45%{
right:30%;
}
50%{
right:30%;
}
100%{
right:100%;
}
}

@keyframes flash{
0%,42%,58%,100%{
opacity:0;
transform:translate(-50%,-50%) scale(.5);
}
50%{
opacity:1;
transform:translate(-50%,-50%) scale(1.8);
}
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
Canvas
</div>

<div class="loader">

<div class="left"></div>

<div class="right"></div>

<div class="glow"></div>

</div>

</div>

<script>

setTimeout(function(){

document.body.style.opacity="0";

setTimeout(function(){

  window.location.href = "stream.html";
  
},500);

},2500);

</script>

</body>
