<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Canvas - Go Live</title>

<style>

/* =================================
   CANVAS GO LIVE
   PART 1
================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#FAF9F6;
    color:#4B3326;
    padding-bottom:82px;
}

/* =================================
   TOP BAR
================================= */

.top-nav{
    width:100%;
    height:62px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    background:#FAF9F6;
    border-bottom:1px solid rgba(75,51,38,.10);
    position:sticky;
    top:0;
    z-index:50;
}

.logo{
    font-size:23px;
    font-weight:800;
    color:#4B3326;
    letter-spacing:-.5px;
}

.top-actions{
    display:flex;
    align-items:center;
}

/* =================================
   PROFILE
================================= */

.profile-icon{
    width:40px;
    height:40px;
    min-width:40px;
    border-radius:50%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#4B3326;
    color:#FAF9F6;
    text-decoration:none;
    font-size:17px;
    font-weight:bold;
}

.profile-icon img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* =================================
   MAIN
================================= */

.main{
    width:100%;
    max-width:760px;
    margin:auto;
    padding:18px 14px 25px;
}

.page-title{
    font-size:26px;
    font-weight:800;
    margin-bottom:5px;
}

.page-subtitle{
    font-size:14px;
    color:#806B5D;
    margin-bottom:17px;
}

/* =================================
   CAMERA CARD
================================= */

.camera-card{
    width:100%;
    background:#F3E8D3;
    border:2px solid #DCC8AA;
    border-radius:18px;
    overflow:hidden;
}

.camera-box{
    width:100%;
    height:350px;
    background:#241B16;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
}

/*
   ONLY CAMERA PREVIEW FIX
   The camera-box height above is
   unchanged.
*/

#cameraPreview{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center center;
    display:none;
    background:#111;
}

.camera-message{
    text-align:center;
    padding:20px;
    color:#E8DCCB;
}

.camera-message-icon{
    font-size:40px;
    margin-bottom:9px;
}

.camera-message-title{
    font-size:17px;
    font-weight:700;
    margin-bottom:5px;
}

.camera-message-text{
    font-size:13px;
    color:#BBAA98;
    line-height:1.4;
}

/* =================================
   MEDIA CONTROLS
================================= */

.camera-controls{
    display:flex;
    gap:8px;
    padding:11px;
    background:#F3E8D3;
}

.media-button{
    flex:1;
    min-height:44px;
    border:1px solid rgba(75,51,38,.12);
    border-radius:11px;
    background:#FFF;
    color:#4B3326;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.media-button:active{
    transform:scale(.97);
}

.media-button.active{
    background:#4B3326;
    color:#FFF;
}

/* =================================
   MESSAGES
================================= */

.permission-message{
    margin-top:9px;
    text-align:center;
    font-size:12px;
    color:#9A7658;
}

.webrtc-status{
    margin-top:4px;
    text-align:center;
    font-size:12px;
    color:#806B5D;
}

/* =================================
   STREAM CARD
================================= */

.stream-card{
    margin-top:18px;
    padding:17px;
    background:#FFF;
    border:1px solid rgba(75,51,38,.10);
    border-radius:18px;
    box-shadow:0 5px 20px rgba(75,51,38,.06);
}

.form-group{
    margin-bottom:15px;
}

.form-label{
    display:block;
    margin-bottom:7px;
    font-size:13px;
    font-weight:700;
}

.form-input,
.form-select,
.form-textarea{
    width:100%;
    border:1px solid #DCCFC2;
    border-radius:11px;
    padding:12px 13px;
    background:#FAF9F6;
    color:#4B3326;
    outline:none;
    font-family:inherit;
    font-size:14px;
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus{
    border-color:#9A7658;
    box-shadow:0 0 0 3px rgba(154,118,88,.10);
}

.form-textarea{
    min-height:95px;
    resize:vertical;
}

/* =================================
   THUMBNAIL
================================= */

.thumbnail-upload{
    width:100%;
    min-height:125px;
    border:2px dashed #D5C2A8;
    border-radius:14px;
    background:#FBF6EE;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    cursor:pointer;
    overflow:hidden;
}

.thumbnail-upload-title{
    font-size:15px;
    font-weight:800;
}

.thumbnail-upload-text{
    margin-top:5px;
    font-size:12px;
    color:#8A7768;
}

#thumbnailInput{
    display:none;
}

#thumbnailPreview{
    width:100%;
    display:none;
    cursor:pointer;
}

#thumbnailImage{
    width:100%;
    max-height:220px;
    object-fit:cover;
    display:block;
}
 /* =================================
   STREAM BUTTONS
================================= */

.stream-actions{
    margin-top:18px;
}

.stream-button{
    width:100%;
    min-height:48px;
    border:0;
    border-radius:13px;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
}

.start-button{
    background:#4B3326;
    color:#FFF;
}

.end-button{
    background:#8E3025;
    color:#FFF;
    margin-top:9px;
}

.stream-button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.hidden{
    display:none!important;
}

.status-box{
    min-height:20px;
    margin-top:12px;
    text-align:center;
    font-size:13px;
    color:#806B5D;
}

/* =================================
   BOTTOM NAV
================================= */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:72px;
    background:#FFF;
    border-top:1px solid rgba(75,51,38,.10);
    display:flex;
    align-items:center;
    justify-content:space-around;
    z-index:100;
}

.bottom-nav a{
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    text-decoration:none;
    color:#806B5D;
    font-size:11px;
    font-weight:700;
}

.bottom-nav a.active{
    color:#4B3326;
}

.bottom-nav-icon{
    width:25px;
    height:25px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    line-height:1;
}

/* =================================
   EXPLORE ICON
================================= */

.explore-icon{
    width:22px;
    height:22px;
}

.explore-icon circle,
.explore-icon path{
    stroke:currentColor;
}

/* =================================
   PROFILE BOTTOM
================================= */

.bottom-profile{
    width:25px;
    height:25px;
    border-radius:50%;
    overflow:hidden;
    background:#4B3326;
    color:#FFF;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
}

.bottom-profile img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* =================================
   MOBILE
================================= */

@media(max-width:480px){

    .top-nav{
        height:60px;
        padding:0 13px;
    }

    .logo{
        font-size:22px;
    }

    .main{
        padding:15px 12px 22px;
    }

    .page-title{
        font-size:23px;
    }

    /* SAME ORIGINAL HEIGHT */

    .camera-box{
        height:300px;
    }

    .camera-controls{
        gap:6px;
    }

    .media-button{
        font-size:11px;
    }

    .stream-card{
        padding:14px;
    }

}

</style>

</head>

<!-- =================================
     JAVASCRIPT
     PART 3 STARTS HERE
================================= -->

<script>

/* =================================
   CANVAS GO LIVE
   PART 3
   CONFIG + DOM + PROFILE
================================= */

const API_BASE =
    "https://canvas-kh9p.onrender.com";

const SOCKET_URL =
    API_BASE;


/* =================================
   MEDIA STATE
================================= */

let canvasStream = null;

let cameraEnabled = false;

let microphoneEnabled = false;

let currentFacingMode = "user";

let isStreaming = false;


/* =================================
   STREAM STATE
================================= */

let currentStreamId = null;

let broadcasterRoom = null;

let socket = null;

let streamHeartbeat = null;


/* =================================
   WEBRTC
================================= */

const peerConnections = {};


/* =================================
   THUMBNAIL
================================= */

let selectedThumbnail = "";


/* =================================
   DOM ELEMENTS
================================= */

const cameraPreview =
    document.getElementById(
        "cameraPreview"
    );

const cameraMessage =
    document.getElementById(
        "cameraMessage"
    );

const permissionMessage =
    document.getElementById(
        "permissionMessage"
    );

const webrtcStatus =
    document.getElementById(
        "webrtcStatus"
    );

const streamStatus =
    document.getElementById(
        "streamStatus"
    );

const streamTitle =
    document.getElementById(
        "streamTitle"
    );

const category =
    document.getElementById(
        "category"
    );

const description =
    document.getElementById(
        "description"
    );

const thumbnailInput =
    document.getElementById(
        "thumbnailInput"
    );

const thumbnailPreview =
    document.getElementById(
        "thumbnailPreview"
    );

const thumbnailImage =
    document.getElementById(
        "thumbnailImage"
    );

const choosePhotoButton =
    document.getElementById(
        "choosePhotoButton"
    );

const cameraButton =
    document.getElementById(
        "cameraButton"
    );

const micButton =
    document.getElementById(
        "micButton"
    );

const switchCameraButton =
    document.getElementById(
        "switchCameraButton"
    );

const startStreamingButton =
    document.getElementById(
        "startStreamingButton"
    );

const stopStreamingButton =
    document.getElementById(
        "stopStreamingButton"
    );
  /* =================================
   AUTH
================================= */

function getAuthToken(){

    return (
        localStorage.getItem(
            "canvasAuthToken"
        ) ||

        localStorage.getItem(
            "authToken"
        ) ||

        localStorage.getItem(
            "token"
        ) ||

        ""
    );

}


function authHeaders(){

    const token =
        getAuthToken();

    const headers = {
        "Content-Type":
            "application/json"
    };

    if(token){

        headers.Authorization =
            "Bearer " + token;

    }

    return headers;

}


/* =================================
   STATUS
================================= */

function setStatus(
    message,
    error
){

    if(!streamStatus){
        return;
    }

    streamStatus.textContent =
        message || "";

    streamStatus.style.color =
        error
            ? "#9A3026"
            : "#806B5D";

}


function setPermissionMessage(
    message
){

    if(permissionMessage){

        permissionMessage.textContent =
            message || "";

    }

}


function setWebRTCStatus(
    message
){

    if(webrtcStatus){

        webrtcStatus.textContent =
            message || "";

    }

}


/* =================================
   PROFILE IMAGE
================================= */

function updateGoLiveProfile(){

    let image =
        localStorage.getItem(
            "canvasProfilePicture"
        );

    if(!image){

        image =
            localStorage.getItem(
                "profilePicture"
            );

    }

    if(!image){

        try{

            const profile =
                JSON.parse(
                    localStorage.getItem(
                        "canvasProfile"
                    ) || "null"
                );

            if(profile){

                image =
                    profile.profile_picture ||
                    profile.profilePicture ||
                    profile.photo ||
                    "";

            }

        }catch(error){

            console.warn(
                "Profile read error:",
                error
            );

        }

    }


    const top =
        document.getElementById(
            "topProfileIcon"
        );

    const bottom =
        document.getElementById(
            "bottomProfileIcon"
        );


    if(!image){

        return;

    }


    if(top){

        top.innerHTML = "";

        const img =
            document.createElement(
                "img"
            );

        img.src = image;

        img.alt = "Profile";

        top.appendChild(img);

    }


    if(bottom){

        bottom.innerHTML = "";

        const img =
            document.createElement(
                "img"
            );

        img.src = image;

        img.alt = "Profile";

        bottom.appendChild(img);

    }

}


/* =================================
   LOAD PROFILE
================================= */

async function loadGoLiveProfile(){

    updateGoLiveProfile();

    const token =
        getAuthToken();

    if(!token){

        return;

    }

    try{

        const response =
            await fetch(
                API_BASE + "/api/me",
                {
                    method:"GET",
                    headers:authHeaders()
                }
            );

        if(!response.ok){

            return;

        }

        const data =
            await response.json();

        const user =
            data.user ||
            data.data ||
            data;

        if(user){

            localStorage.setItem(
                "canvasCurrentUser",
                JSON.stringify(user)
            );

        }

        updateGoLiveProfile();

    }catch(error){

        console.warn(
            "Profile loading failed:",
            error.message
        );

    }

}


/* =================================
   INITIALIZE
================================= */

updateGoLiveProfile();

loadGoLiveProfile();

setStatus("");

setPermissionMessage("");

setWebRTCStatus("");


/* =================================
   THUMBNAIL SELECTION
================================= */

if(
    choosePhotoButton &&
    thumbnailInput
){

    choosePhotoButton.addEventListener(
        "click",
        function(){

            thumbnailInput.click();

        }
    );

}


if(thumbnailInput){

    thumbnailInput.addEventListener(
        "change",
        function(){

            const file =
                thumbnailInput.files &&
                thumbnailInput.files[0];

            if(!file){

                return;

            }


            if(
                !file.type.startsWith(
                    "image/"
                )
            ){

                setStatus(
                    "Please select an image file.",
                    true
                );

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                function(event){

                    selectedThumbnail =
                        event.target.result;


                    if(thumbnailImage){

                        thumbnailImage.src =
                            selectedThumbnail;

                    }


                    if(thumbnailPreview){

                        thumbnailPreview.style.display =
                            "block";

                    }


                    setStatus(
                        "Thumbnail selected."
                    );

                };


            reader.onerror =
                function(){

                    setStatus(
                        "Could not load thumbnail.",
                        true
                    );

                };


            reader.readAsDataURL(file);

        }
    );

  }
  /* =================================
   CAMERA BUTTON
================================= */

async function toggleCamera(){

    if(!canvasStream){

        await startCameraAndMicrophone(
            true,
            microphoneEnabled
        );

        return;

    }


    const videoTracks =
        canvasStream.getVideoTracks();


    if(videoTracks.length === 0){

        await startCameraAndMicrophone(
            true,
            microphoneEnabled
        );

        return;

    }


    cameraEnabled =
        !cameraEnabled;


    videoTracks.forEach(
        function(track){

            track.enabled =
                cameraEnabled;

        }
    );


    updateCameraButton();

    updatePreview();

}


/* =================================
   MICROPHONE BUTTON
================================= */

async function toggleMicrophone(){

    if(!canvasStream){

        await startCameraAndMicrophone(
            cameraEnabled,
            true
        );

        return;

    }


    const audioTracks =
        canvasStream.getAudioTracks();


    if(audioTracks.length === 0){

        await startCameraAndMicrophone(
            cameraEnabled,
            true
        );

        return;

    }


    microphoneEnabled =
        !microphoneEnabled;


    audioTracks.forEach(
        function(track){

            track.enabled =
                microphoneEnabled;

        }
    );


    updateMicButton();

}


/* =================================
   CAMERA BUTTON UI
================================= */

function updateCameraButton(){

    if(!cameraButton){

        return;

    }


    if(cameraEnabled){

        cameraButton.textContent =
            "📷 Camera On";

        cameraButton.classList.add(
            "enabled"
        );

    }else{

        cameraButton.textContent =
            "📷 Camera Off";

        cameraButton.classList.remove(
            "enabled"
        );

    }

}


/* =================================
   MICROPHONE BUTTON UI
================================= */

function updateMicButton(){

    if(!micButton){

        return;

    }


    if(microphoneEnabled){

        micButton.textContent =
            "🎙️ Microphone On";

        micButton.classList.add(
            "enabled"
        );

    }else{

        micButton.textContent =
            "🎙️ Microphone Off";

        micButton.classList.remove(
            "enabled"
        );

    }

}


/* =================================
   CAMERA PREVIEW
================================= */

function updatePreview(){

    if(!cameraPreview){

        return;

    }


    if(!canvasStream){

        cameraPreview.srcObject =
            null;

        cameraPreview.style.display =
            "none";

        if(cameraMessage){

            cameraMessage.textContent =
                "Camera is off";

        }

        return;

    }


    const videoTracks =
        canvasStream.getVideoTracks();


    if(
        cameraEnabled &&
        videoTracks.length > 0
    ){

        cameraPreview.srcObject =
            canvasStream;

        cameraPreview.style.display =
            "block";


        /*
         * Keep the original camera
         * box size. Do not resize it.
         */

        if(cameraMessage){

            cameraMessage.textContent =
                "";

        }

    }else{

        cameraPreview.srcObject =
            null;

        cameraPreview.style.display =
            "none";

        if(cameraMessage){

            cameraMessage.textContent =
                "Camera is off";

        }

    }

}


/* =================================
   START CAMERA + MICROPHONE
================================= */

async function startCameraAndMicrophone(
    wantCamera,
    wantMicrophone
){

    try{

        setPermissionMessage(
            "Requesting camera and microphone permission..."
        );


        const stream =
            await navigator.mediaDevices.getUserMedia(
                {
                    video:
                        wantCamera
                            ? {
                                facingMode:{
                                    ideal:
                                        currentFacingMode
                                },
                                width:{
                                    ideal:1280
                                },
                                height:{
                                    ideal:720
                                },
                                frameRate:{
                                    ideal:30
                                }
                            }
                            : false,

                    audio:
                        wantMicrophone
                            ? {
                                echoCancellation:true,
                                noiseSuppression:true,
                                autoGainControl:true
                            }
                            : false
                }
            );


        if(canvasStream){

            canvasStream
                .getTracks()
                .forEach(
                    function(track){

                        track.stop();

                    }
                );

        }


        canvasStream =
            stream;


        cameraEnabled =
            stream.getVideoTracks().length > 0 &&
            wantCamera;


        microphoneEnabled =
            stream.getAudioTracks().length > 0 &&
            wantMicrophone;


        updateCameraButton();

        updateMicButton();

        updatePreview();


        setPermissionMessage(
            "Camera and microphone ready."
        );


        setWebRTCStatus("");


    }catch(error){

        console.error(
            "Media permission error:",
            error
        );


        cameraEnabled =
            false;

        microphoneEnabled =
            false;


        updateCameraButton();

        updateMicButton();


        if(
            error.name ===
            "NotAllowedError"
        ){

            setPermissionMessage(
                "Camera or microphone permission was denied."
            );

        }else if(
            error.name ===
            "NotFoundError"
        ){

            setPermissionMessage(
                "Camera or microphone was not found."
            );

        }else{

            setPermissionMessage(
                "Could not access camera or microphone."
            );

        }


        setStatus(
            "Media access failed.",
            true
        );

    }

}


/* =================================
   INITIAL MEDIA UI
================================= */

updateCameraButton();

updateMicButton();

updatePreview();
  /* =================================
   CAMERA SWITCH
   FIXED VERSION
================================= */

async function switchCamera(){

    /*
     * Camera must already be running.
     */
    if(!canvasStream){

        await startCameraAndMicrophone(
            true,
            microphoneEnabled
        );

        return;

    }


    /*
     * Camera must be enabled.
     */
    if(!cameraEnabled){

        await startCameraAndMicrophone(
            true,
            microphoneEnabled
        );

        return;

    }


    const oldVideoTracks =
        canvasStream.getVideoTracks();


    if(oldVideoTracks.length === 0){

        return;

    }


    const oldTrack =
        oldVideoTracks[0];


    /*
     * Decide which camera to use.
     */
    const nextFacingMode =
        currentFacingMode === "user"
            ? "environment"
            : "user";


    setPermissionMessage(
        "Switching camera..."
    );


    try{

        /*
         * Do NOT use facingMode: exact.
         *
         * Some phones/browser combinations
         * reject exact constraints even when
         * the camera exists.
         */
        const newStream =
            await navigator.mediaDevices.getUserMedia(
                {
                    video:{
                        facingMode:{
                            ideal:
                                nextFacingMode
                        },
                        width:{
                            ideal:1280
                        },
                        height:{
                            ideal:720
                        },
                        frameRate:{
                            ideal:30
                        }
                    },

                    audio:false
                }
            );


        const newVideoTracks =
            newStream.getVideoTracks();


        if(
            !newVideoTracks ||
            newVideoTracks.length === 0
        ){

            newStream
                .getTracks()
                .forEach(
                    function(track){

                        track.stop();

                    }
                );

            throw new Error(
                "No video track returned."
            );

        }


        const newVideoTrack =
            newVideoTracks[0];


        /*
         * Replace only the video track.
         *
         * Keep the existing microphone
         * track untouched.
         */
        canvasStream.removeTrack(
            oldTrack
        );

        oldTrack.stop();


        canvasStream.addTrack(
            newVideoTrack
        );


        /*
         * Only change facing mode after the
         * new camera successfully opened.
         */
        currentFacingMode =
            nextFacingMode;


        cameraEnabled =
            true;


        /*
         * Force the video element to use the
         * updated MediaStream.
         *
         * This fixes phones where the preview
         * stays on the old camera.
         */
        cameraPreview.srcObject =
            null;


        cameraPreview.srcObject =
            canvasStream;


        cameraPreview.muted =
            true;

        cameraPreview.autoplay =
            true;

        cameraPreview.playsInline =
            true;


        cameraPreview.style.display =
            "block";


        /*
         * Keep the original camera box.
         * No height or width is changed here.
         */
        updateCameraButton();

        updatePreview();


        /*
         * Some mobile browsers need play()
         * after changing the source.
         */
        try{

            await cameraPreview.play();

        }catch(playError){

            console.warn(
                "Preview play warning:",
                playError
            );

        }


        setPermissionMessage(
            currentFacingMode === "environment"
                ? "Back camera active."
                : "Front camera active."
        );


        setStatus("");


    }catch(error){

        console.warn(
            "Camera switch failed:",
            error
        );


        /*
         * Keep the current camera if the
         * requested camera could not open.
         */
        currentFacingMode =
            currentFacingMode;


        setPermissionMessage(
            "Could not switch camera."
        );


        setStatus(
            "Could not switch camera on this device.",
            true
        );

    }

}

}


/* =================================
   STREAM TITLE VALIDATION
================================= */

function validateStreamDetails(){

    const title =
        streamTitle
            ? streamTitle.value.trim()
            : "";


    if(!title){

        setStatus(
            "Please enter a stream title.",
            true
        );


        if(streamTitle){

            streamTitle.focus();

        }


        return false;

    }


    if(title.length > 100){

        setStatus(
            "Stream title must be 100 characters or less.",
            true
        );


        if(streamTitle){

            streamTitle.focus();

        }


        return false;

    }


    return true;

}


/* =================================
   STREAM DATA
================================= */

function getStreamData(){

    return {

        title:
            streamTitle
                ? streamTitle.value.trim()
                : "",

        category:
            category
                ? category.value
                : "",

        description:
            description
                ? description.value.trim()
                : "",

        thumbnail:
            selectedThumbnail || "",

        createdAt:
            Date.now()

    };

}


/* =================================
   STREAM ID
================================= */

function createStreamId(){

    return (
        "canvas_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2,9)
    );

}


/* =================================
   SOCKET CONNECTION
================================= */

function connectSocket(){

    if(socket){

        return socket;

    }


    if(typeof io !== "function"){

        console.warn(
            "Socket.IO is not available."
        );

        return null;

    }


    try{

        socket =
            io(
                SOCKET_URL,
                {
                    transports:[
                        "websocket",
                        "polling"
                    ]
                }
            );


        socket.on(
            "connect",
            function(){

                console.log(
                    "Canvas socket connected:",
                    socket.id
                );


                if(broadcasterRoom){

                    socket.emit(
                        "join-stream",
                        {
                            streamId:
                                broadcasterRoom
                        }
                    );

                }

            }
        );


        socket.on(
            "connect_error",
            function(error){

                console.warn(
                    "Socket connection error:",
                    error.message
                );

            }
        );


        socket.on(
            "disconnect",
            function(){

                console.log(
                    "Canvas socket disconnected."
                );

            }
        );


        return socket;

    }catch(error){

        console.warn(
            "Socket initialization failed:",
            error
        );

        socket =
            null;

        return null;

    }

}


/* =================================
   START SOCKET ROOM
================================= */

function joinBroadcasterRoom(){

    const activeSocket =
        connectSocket();


    if(
        !activeSocket ||
        !currentStreamId
    ){

        return;

    }


    broadcasterRoom =
        currentStreamId;


    if(activeSocket.connected){

        activeSocket.emit(
            "join-stream",
            {
                streamId:
                    broadcasterRoom
            }
        );

    }

}


/* =================================
   HEARTBEAT
================================= */

function startStreamHeartbeat(){

    stopStreamHeartbeat();


    streamHeartbeat =
        setInterval(
            function(){

                if(
                    !isStreaming ||
                    !currentStreamId
                ){

                    return;

                }


                if(socket){

                    socket.emit(
                        "stream-heartbeat",
                        {
                            streamId:
                                currentStreamId
                        }
                    );

                }

            },
            15000
        );

}


function stopStreamHeartbeat(){

    if(streamHeartbeat){

        clearInterval(
            streamHeartbeat
        );

        streamHeartbeat =
            null;

    }

  }
  /* =================================
   CREATE LIVE STREAM
================================= */

async function createLiveStream(){

    if(isStreaming){

        return;

    }


    if(!validateStreamDetails()){

        return;

    }


    if(!canvasStream){

        setStatus(
            "Please turn on your camera or microphone first.",
            true
        );

        return;

    }


    const hasVideo =
        canvasStream.getVideoTracks().length > 0;

    const hasAudio =
        canvasStream.getAudioTracks().length > 0;


    if(!hasVideo && !hasAudio){

        setStatus(
            "Please enable your camera or microphone.",
            true
        );

        return;

    }


    const token =
        getAuthToken();


    if(!token){

        setStatus(
            "Please log in before starting a stream.",
            true
        );

        return;

    }


    const streamData =
        getStreamData();


    currentStreamId =
        createStreamId();


    streamData.id =
        currentStreamId;

    streamData.streamId =
        currentStreamId;

    streamData.isLive =
        true;

    streamData.streamer =
        localStorage.getItem(
            "canvasUsername"
        ) || "";

    streamData.profilePicture =
        localStorage.getItem(
            "canvasProfilePicture"
        ) || "";


    /* =================================
       LOCAL LIVE STREAM
    ================================= */

    try{

        localStorage.setItem(
            "canvasActiveStream",
            JSON.stringify(
                streamData
            )
        );

        localStorage.setItem(
            "canvasLiveStream",
            JSON.stringify(
                streamData
            )
        );

    }catch(error){

        console.warn(
            "Could not save live stream:",
            error
        );

    }


    /* =================================
       SOCKET
    ================================= */

    connectSocket();

    joinBroadcasterRoom();


    /* =================================
       SERVER STREAM REGISTRATION
    ================================= */

    try{

        const response =
            await fetch(
                API_BASE + "/api/streams",
                {
                    method:"POST",
                    headers:authHeaders(),
                    body:JSON.stringify(
                        streamData
                    )
                }
            );


        if(response.ok){

            const serverData =
                await response.json()
                    .catch(
                        function(){

                            return null;

                        }
                    );


            if(serverData){

                currentStreamId =
                    serverData.streamId ||
                    serverData.id ||
                    currentStreamId;

            }

        }else{

            console.warn(
                "Stream API returned:",
                response.status
            );

        }

    }catch(error){

        console.warn(
            "Stream registration failed:",
            error.message
        );

    }


    isStreaming =
        true;


    startStreamingButton.classList.add(
        "hidden"
    );

    stopStreamingButton.classList.remove(
        "hidden"
    );


    setStatus(
        "🔴 You are now live."
    );

    setWebRTCStatus(
        "Live stream started."
    );


    startStreamHeartbeat();


    if(socket){

        socket.emit(
            "stream-started",
            {
                streamId:
                    currentStreamId,

                title:
                    streamData.title,

                category:
                    streamData.category,

                description:
                    streamData.description,

                thumbnail:
                    streamData.thumbnail
            }
        );

    }

}


/* =================================
   START BUTTON
================================= */

if(startStreamingButton){

    startStreamingButton.addEventListener(
        "click",
        function(){

            createLiveStream();

        }
    );

}


/* =================================
   END LIVE STREAM
================================= */

async function endLiveStream(){

    if(!isStreaming){

        return;

    }


    const endedStreamId =
        currentStreamId;


    isStreaming =
        false;


    stopStreamHeartbeat();


    if(socket){

        socket.emit(
            "stream-ended",
            {
                streamId:
                    endedStreamId
            }
        );

    }


    const token =
        getAuthToken();


    if(token && endedStreamId){

        try{

            await fetch(
                API_BASE +
                "/api/streams/" +
                encodeURIComponent(
                    endedStreamId
                ),
                {
                    method:"DELETE",
                    headers:authHeaders()
                }
            );

        }catch(error){

            console.warn(
                "Could not end server stream:",
                error.message
            );

        }

    }


    /* =================================
       CLEAR LOCAL LIVE STREAM
    ================================= */

    try{

        const active =
            JSON.parse(
                localStorage.getItem(
                    "canvasActiveStream"
                ) || "null"
            );


        if(
            active &&
            (
                active.id === endedStreamId ||
                active.streamId === endedStreamId
            )
        ){

            localStorage.removeItem(
                "canvasActiveStream"
            );

        }


        const live =
            JSON.parse(
                localStorage.getItem(
                    "canvasLiveStream"
                ) || "null"
            );


        if(
            live &&
            (
                live.id === endedStreamId ||
                live.streamId === endedStreamId
            )
        ){

            localStorage.removeItem(
                "canvasLiveStream"
            );

        }

    }catch(error){

        localStorage.removeItem(
            "canvasActiveStream"
        );

        localStorage.removeItem(
            "canvasLiveStream"
        );

    }


    currentStreamId =
        null;

    broadcasterRoom =
        null;


    startStreamingButton.classList.remove(
        "hidden"
    );

    stopStreamingButton.classList.add(
        "hidden"
    );


    setStatus(
        "Stream ended."
    );

    setWebRTCStatus(
        ""
    );

}


/* =================================
   END BUTTON
================================= */

if(stopStreamingButton){

    stopStreamingButton.addEventListener(
        "click",
        function(){

            endLiveStream();

        }
    );

}


/* =================================
   STOP MEDIA
================================= */

function stopMedia(){

    if(!canvasStream){

        return;

    }


    canvasStream
        .getTracks()
        .forEach(
            function(track){

                track.stop();

            }
        );


    canvasStream =
        null;

    cameraEnabled =
        false;

    microphoneEnabled =
        false;


    if(cameraPreview){

        cameraPreview.srcObject =
            null;

        cameraPreview.style.display =
            "none";

    }


    updateCameraButton();

    updateMicButton();

}


/* =================================
   CLOSE PEER CONNECTIONS
================================= */

function closePeerConnections(){

    Object.keys(
        peerConnections
    ).forEach(
        function(peerId){

            try{

                peerConnections[peerId]
                    .close();

            }catch(error){

                console.warn(
                    "Peer close error:",
                    error
                );

            }


            delete peerConnections[
                peerId
            ];

        }
    );

}


/* =================================
   DISCONNECT SOCKET
================================= */

function disconnectSocket(){

    if(!socket){

        return;

    }


    try{

        socket.disconnect();

    }catch(error){

        console.warn(
            "Socket disconnect error:",
            error
        );

    }


    socket =
        null;

}


/* =================================
   PAGE CLEANUP
================================= */

function cleanupGoLive(){

    stopStreamHeartbeat();

    closePeerConnections();

    stopMedia();


    if(socket){

        try{

            socket.emit(
                "broadcaster-left",
                {
                    streamId:
                        currentStreamId
                }
            );

        }catch(error){

            console.warn(
                "Broadcaster cleanup error:",
                error
            );

        }

    }

}
