<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Canvas - Go Live</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================================
   GO LIVE PAGE - CANVAS THEME
========================================= */

.container {
    padding-bottom: 110px;
}


/* =========================================
   PAGE TITLE
========================================= */

.page-title {
    width: 100%;
    max-width: 760px;
    margin: 0 auto 28px;
}

.page-title h1 {
    color: #4b3326;
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 8px;
}

.page-title p {
    color: #8a6b58;
    font-size: 15px;
    margin-bottom: 5px;
}

#creatorName {
    color: #4b3326;
    font-weight: 700;
}


/* =========================================
   CAMERA SECTION
========================================= */

.camera-section {
    width: 100%;
    max-width: 760px;
    margin: 0 auto 30px;
}


.camera-box {
    width: 100%;
    height: 360px;

    background: #251b17;

    border-radius: 0 0 30px 30px;

    overflow: hidden;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    box-shadow:
        0 4px 14px rgba(75, 51, 38, 0.10);
}


#cameraPreview {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: none;

    border-radius: 0 0 30px 30px;
}


#cameraMessage {
    color: #ffffff;

    font-size: 18px;
    font-weight: 700;

    text-align: center;
}


/* =========================================
   CAMERA CONTROLS
========================================= */

.camera-controls {
    width: 100%;

    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 16px;

    margin-top: 24px;
}


.camera-controls button {
    width: 100%;

    min-height: 62px;

    padding: 14px 12px;

    border: 1px solid rgba(75, 51, 38, 0.16);

    border-radius: 18px;

    background: rgba(255, 255, 255, 0.72);

    color: #4b3326;

    font-size: 16px;
    font-weight: 800;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    box-shadow:
        0 5px 15px rgba(75, 51, 38, 0.08);

    transition: 0.2s ease;
}


.camera-controls button:hover {
    border-color: #d4a62a;

    transform: translateY(-1px);
}


.camera-controls button:active {
    transform: scale(0.97);
}


.camera-controls button.active {
    background: #d4a62a;

    color: #ffffff;

    border-color: #d4a62a;
}


/* =========================================
   MODERN CAMERA + MICROPHONE ICONS
========================================= */

.control-icon {
    width: 26px;
    height: 26px;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    flex-shrink: 0;
}


.control-icon svg {
    width: 26px;
    height: 26px;

    display: block;
}


/* =========================================
   PERMISSION MESSAGE
========================================= */

#permissionMessage {
    text-align: center;

    margin-top: 12px;

    min-height: 20px;

    font-size: 14px;

    color: #8a6b58;
}


/* =========================================
   STREAM FORM
========================================= */

.stream-form {
    width: 100%;
    max-width: 760px;

    margin: 0 auto;
}


.stream-form label {
    display: block;

    margin: 22px 0 9px;

    font-size: 17px;
    font-weight: 800;

    color: #4b3326;
}


.stream-form input[type="text"],
.stream-form select,
.stream-form textarea,
.stream-form input[type="file"] {

    width: 100%;

    padding: 16px 15px;

    border: 2px solid #d8c7bb;
    border-radius: 16px;

    background: #ffffff;

    color: #4b3326;

    font-size: 17px;

    outline: none;

    font-family: Arial, Helvetica, sans-serif;
}


.stream-form input[type="text"]:focus,
.stream-form select:focus,
.stream-form textarea:focus {

    border-color: #d4a62a;

    box-shadow:
        0 0 0 2px rgba(212, 166, 42, 0.08);
}


.stream-form textarea {

    resize: vertical;

    min-height: 150px;
}


.stream-form input[type="file"] {

    padding: 11px;

    cursor: pointer;
}


/* =========================================
   START STREAMING BUTTON
========================================= */

.start-btn {

    width: 100%;

    margin-top: 28px;

    padding: 18px;

    border: none;

    border-radius: 16px;

    background: #4b3326;

    color: #ffffff;

    font-size: 19px;
    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 5px 15px rgba(75, 51, 38, 0.18);

    transition: 0.2s ease;
}


.start-btn:hover {

    background: #5d4030;

    transform: translateY(-1px);
}


.start-btn:active {

    transform: scale(0.98);
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

    .page-title h1 {
        font-size: 25px;
    }


    .camera-box {
        height: 260px;

        border-radius: 0 0 26px 26px;
    }


    .camera-controls {
        gap: 12px;
    }


    .camera-controls button {
        min-height: 58px;

        padding: 14px 8px;

        font-size: 15px;
    }


    .control-icon,
    .control-icon svg {
        width: 24px;
        height: 24px;
    }


    .stream-form label {
        font-size: 16px;
    }


    .stream-form input[type="text"],
    .stream-form select,
    .stream-form textarea,
    .stream-form input[type="file"] {

        font-size: 16px;
    }

}


/* =========================================
   KEEP BOTTOM NAVIGATION WORKING
========================================= */

.bottom-nav {
    z-index: 1000;
}

</style>

</head>

   CREATOR PROFILE
========================================= */

let creatorProfile = null;

window.onload = function () {

    const savedProfile =
        localStorage.getItem("canvasProfile");


    if (savedProfile) {

            creatorProfile =
                JSON.parse(savedProfile);


            document
                .getElementById("creatorName")
                .textContent =
                "Streaming as " +
                (creatorProfile.name || "") +
                " " +
                (creatorProfile.username || "");

        }

        catch (error) {

            document
                .getElementById("creatorName")
                .textContent =
                "Canvas Creator";

        }

    }

    else {

        document
            .getElementById("creatorName")
            .textContent =
            "Please create your Canvas profile first.";
