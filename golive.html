<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Canvas - Go Live</title>

<link
    rel="stylesheet"
    href="style.css"
>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>

/* =========================================
   CANVAS GO LIVE - CLEAN UI
========================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#ffffff;
    color:#4b3326;
    font-family:Arial,Helvetica,sans-serif;
    padding-bottom:82px;
}


/* =========================================
   TOP NAVIGATION
========================================= */

.navbar{
    width:100%;
    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 20px;

    background:#ffffff;

    border-bottom:2px solid #d4a62a;

    position:sticky;
    top:0;

    z-index:1500;
}

.logo{
    font-size:32px;
    font-weight:800;
    color:#4b3326;
}

.top-icons{
    display:flex;
    align-items:center;
    gap:10px;
}


/* =========================================
   TOP PROFILE
========================================= */

#topProfileIcon{
    width:40px;
    height:40px;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    border-radius:50%;
    border:2px solid #d4a62a;

    background:#f3f3f3;

    color:#4b3326;

    font-size:20px;

    text-decoration:none;
}

#topProfileIcon img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}


/* =========================================
   SEARCH
========================================= */

.search-button{
    width:40px;
    height:40px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid rgba(75,51,38,.18);
    border-radius:13px;

    background:#ffffff;

    color:#4b3326;

    cursor:pointer;

    box-shadow:
        0 3px 10px rgba(75,51,38,.07);

    transition:.2s ease;
}

.search-button:hover{
    border-color:#d4a62a;
}

.search-button:active{
    transform:scale(.94);
}


/* =========================================
   SEARCH PANEL
========================================= */

.search-panel{
    display:none;

    position:fixed;

    top:82px;
    left:50%;

    transform:translateX(-50%);

    width:calc(100% - 28px);
    max-width:600px;

    padding:16px;

    background:#ffffff;

    border:1px solid rgba(75,51,38,.15);
    border-radius:18px;

    box-shadow:
        0 15px 40px rgba(75,51,38,.15);

    z-index:2000;
}

.search-panel.active{
    display:block;
}

.search-row{
    width:100%;

    display:flex;
    gap:9px;
}

.search-input{
    flex:1;
    min-width:0;

    padding:13px 14px;

    border:2px solid #d8c7bb;
    border-radius:13px;

    outline:none;

    background:#ffffff;

    color:#4b3326;

    font-size:16px;
}

.search-input:focus{
    border-color:#d4a62a;
}

.search-submit{
    width:48px;
    min-width:48px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:0;
    border-radius:13px;

    background:#4b3326;
    color:#ffffff;

    cursor:pointer;
}

.search-result{
    margin-top:12px;

    color:#6a574c;

    font-size:14px;
    line-height:1.5;
}


/* =========================================
   MAIN
========================================= */

.container{
    width:100%;
    max-width:820px;

    margin:0 auto;

    padding:24px 18px 30px;
}


/* =========================================
   PAGE HEADER
========================================= */

.page-title{
    text-align:center;

    margin-bottom:22px;
}

.page-title h1{
    margin:0 0 6px;

    font-size:34px;
    line-height:1.15;

    font-weight:800;

    color:#4b3326;
}

.page-title p{
    margin:0;

    color:#6a574c;

    font-size:15px;
    line-height:1.5;
}

#creatorName{
    margin-top:4px;

    color:#4b3326;

    font-size:14px;
    font-weight:700;
}


/* =========================================
   MAIN CAMERA CARD
========================================= */

.camera-section{
    width:100%;

    margin:0 auto 18px;
}

.camera-box{
    width:100%;
    height:400px;

    background:#251b17;

    border-radius:22px;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 8px 25px rgba(75,51,38,.12);

    position:relative;
}

#cameraPreview{
    width:100%;
    height:100%;

    object-fit:cover;

    display:none;

    border-radius:22px;

    background:#000000;
}

#cameraMessage{
    color:#ffffff;

    font-size:18px;
    font-weight:700;

    text-align:center;

    padding:20px;
}


/* =========================================
   CAMERA CONTROLS
========================================= */

.camera-controls{
    width:100%;

    display:grid;

    grid-template-columns:
        1fr 1fr 1fr;

    gap:10px;

    margin:0 auto 14px;
}

.camera-controls button{
    width:100%;

    min-height:54px;

    padding:12px 8px;

    border:2px solid #d8c7bb;

    border-radius:14px;

    background:#ffffff;

    color:#4b3326;

    font-size:14px;

    font-weight:700;

    cursor:pointer;

    transition:.2s ease;
}

.camera-controls button.active{
    background:#4b3326;

    color:#ffffff;

    border-color:#4b3326;
}

.camera-controls button:active{
    transform:scale(.98);
}


/* =========================================
   PERMISSION MESSAGE
========================================= */

#permissionMessage{
    min-height:18px;

    margin:0 0 14px;

    color:#a33a2b;

    text-align:center;

    font-size:13px;

    line-height:1.4;
}


/* =========================================
   STREAM CARD
========================================= */

.stream-form{
    width:100%;

    padding:20px;

    background:#ffffff;

    border:1px solid #eadfd8;

    border-radius:20px;

    box-shadow:
        0 5px 20px rgba(75,51,38,.07);
}

.stream-form label{
    display:block;

    margin:0 0 7px;

    color:#4b3326;

    font-size:15px;

    font-weight:800;
}

.stream-form input,
.stream-form select,
.stream-form textarea{
    width:100%;

    display:block;

    margin:0 0 16px;

    padding:13px 14px;

    border:2px solid #d8c7bb;

    border-radius:13px;

    background:#ffffff;

    color:#4b3326;

    font-family:Arial,Helvetica,sans-serif;

    font-size:15px;

    outline:none;

    transition:.2s ease;
}

.stream-form input:focus,
.stream-form select:focus,
.stream-form textarea:focus{
    border-color:#d4a62a;

    box-shadow:
        0 0 0 3px rgba(212,166,42,.10);
}

.stream-form textarea{
    min-height:105px;

    resize:vertical;
}


/* =========================================
   THUMBNAIL
========================================= */

.thumbnail-upload{
    width:100%;

    margin-bottom:10px;
}

.choose-photo-btn{
    width:100%;

    min-height:56px;

    padding:13px 15px;

    border:2px solid #d8c7bb;

    border-radius:14px;

    background:#ffffff;

    color:#4b3326;

    font-size:15px;

    font-weight:800;

    text-align:center;

    cursor:pointer;

    transition:.2s ease;
}

.choose-photo-btn:hover{
    border-color:#d4a62a;

    background:#fffdf7;
}

.choose-photo-btn:active{
    transform:scale(.98);
}

#thumbnailInput{
    display:none !important;
}

.thumbnail-preview{
    width:100%;

    margin:10px 0 16px;

    overflow:hidden;

    border:2px solid #d8c7bb;

    border-radius:14px;

    background:#251b17;
}

.thumbnail-preview img{
    width:100%;

    display:block;

    aspect-ratio:16 / 9;

    object-fit:cover;
}


/* =========================================
   STATUS
========================================= */

.stream-status{
    min-height:22px;

    margin:4px 0 8px;

    color:#4b3326;

    text-align:center;

    font-size:14px;

    font-weight:700;

    line-height:1.4;
}

.webrtc-status{
    min-height:18px;

    margin:0 0 12px;

    color:#6a574c;

    text-align:center;

    font-size:12px;

    font-weight:600;
}


/* =========================================
   STREAM BUTTONS
========================================= */

.start-btn,
.stop-btn{
    width:100%;

    min-height:56px;

    padding:13px 16px;

    border:0;

    border-radius:14px;

    font-size:16px;

    font-weight:800;

    cursor:pointer;

    transition:.2s ease;
}

.start-btn{
    background:#4b3326;

    color:#ffffff;
}

.stop-btn{
    margin-top:9px;

    background:#a33a2b;

    color:#ffffff;
}

.start-btn:active,
.stop-btn:active{
    transform:scale(.98);
}

.hidden{
    display:none !important;
}


/* =========================================
   BOTTOM NAV
========================================= */

.bottom-nav{
    position:fixed;

    left:0;

    bottom:0;

    width:100%;

    height:70px;

    display:flex;

    align-items:center;

    justify-content:space-around;

    padding:5px 7px;

    background:#ffffff;

    border-top:2px solid #d4a62a;

    box-shadow:
        0 -5px 20px rgba(75,51,38,.08);

    z-index:1500;
}

.bottom-nav a{
    flex:1;

    min-width:0;

    height:58px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:2px;

    border-radius:12px;

    color:#4b3326;

    text-decoration:none;

    font-size:23px;
}

.bottom-nav a span{
    font-size:10px;

    font-weight:700;
}

.bottom-nav a.active{
    color:#d4a62a;
}

#bottomProfileIcon img{
    width:25px;

    height:25px;

    object-fit:cover;

    display:block;

    border-radius:50%;

    border:1.5px solid #d4a62a;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    .navbar{
        height:66px;

        padding:0 15px;
    }

    .logo{
        font-size:29px;
    }

    .container{
        padding:
            20px 14px 25px;
    }

    .page-title{
        margin-bottom:18px;
    }

    .page-title h1{
        font-size:30px;
    }

    .camera-box{
        height:360px;

        min-height:360px;

        border-radius:17px;
    }

    .camera-controls{
        gap:7px;
    }

    .camera-controls button{
        min-height:52px;

        font-size:13px;

        padding:10px 5px;
    }

    .stream-form{
        padding:16px;

        border-radius:17px;
    }

}


/* =========================================
   VERY SMALL DEVICES
========================================= */

@media(max-width:360px){

    .logo{
        font-size:26px;
    }

    .search-button,
    #topProfileIcon{
        width:37px;

        height:37px;
    }

    .camera-box{
        height:330px;

        min-height:330px;
    }

    .camera-controls button{
        font-size:12px;
    }

}

</style>

</head>

<body>


<!-- =========================================
     TOP NAVIGATION
========================================= -->

<header class="navbar">

    </div>

<!-- =========================================

<div

<script>

/* =========================================
   PART 1 ENDS HERE
========================================= */
/* =========================================
   CANVAS BACKEND
========================================= */

const CANVAS_API =
    "https://canvas-kh9p.onrender.com";


/* =========================================
   SOCKET.IO
========================================= */

let socket = null;

let socketConnected = false;


/* =========================================
   AUTH
========================================= */

function getAuthToken(){

    return localStorage.getItem(
        "canvasAuthToken"
    ) || "";

}


/* =========================================
   PROFILE
========================================= */

let savedProfile = {};


function loadSavedProfile(){

    try{

        const data =
            localStorage.getItem(
                "canvasProfile"
            );

        savedProfile =
            data
                ? JSON.parse(data) || {}
                : {};

    }catch(error){

        console.error(
            "Profile load failed:",
            error
        );

        savedProfile = {};

    }

}


function getProfilePhoto(){

    return (
        savedProfile.photo ||
        savedProfile.profileImage ||
        savedProfile.profilePhoto ||
        savedProfile.image ||
        savedProfile.profile_picture ||
        ""
    );

}


function updateCreatorName(){

    const element =
        document.getElementById(
            "creatorName"
        );

    if(!element){
        return;
    }

    const name =
        savedProfile.name ||
        savedProfile.username ||
        "";

    element.textContent =
        name
            ? "Streaming as " + name
            : "";

}


function updateProfileIcons(){

    const photo =
        getProfilePhoto();


    const top =
        document.getElementById(
            "topProfileIcon"
        );


    if(top){

        top.innerHTML =
            photo
                ? '<img src="' +
                  escapeHtml(photo) +
                  '" alt="Profile">'
                : "⬤";

    }


    const bottom =
        document.getElementById(
            "bottomProfileIcon"
        );


    if(bottom){

        bottom.innerHTML =
            photo
                ? '<img src="' +
                  escapeHtml(photo) +
                  '" alt="Profile">' +
                  '<span>Profile</span>'
                : '⬤<span>Profile</span>';

    }

}


/* =========================================
   HTML ESCAPE
========================================= */

function escapeHtml(value){

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        String(value || "");

    return div.innerHTML;

}


/* =========================================
   THUMBNAIL
========================================= */

const choosePhotoButton =
    document.getElementById(
        "choosePhotoButton"
    );


const thumbnailInput =
    document.getElementById(
        "thumbnailInput"
    );


const thumbnailPreview =
    document.getElementById(
        "thumbnailPreview"
    );


const thumbnailImage =
    document.getElementById(
        "thumbnailImage"
    );


if(choosePhotoButton){

    choosePhotoButton.addEventListener(
        "click",
        function(){

            if(thumbnailInput){

                thumbnailInput.click();

            }

        }
    );

}


if(thumbnailInput){

    thumbnailInput.addEventListener(
        "change",
        function(){

            const file =
                thumbnailInput.files &&
                thumbnailInput.files[0];


            if(!file){

                thumbnailPreview.style.display =
                    "none";

                thumbnailImage.src =
                    "";

                return;

            }


            if(
                !file.type ||
                !file.type.startsWith(
                    "image/"
                )
            ){

                thumbnailInput.value = "";

                thumbnailPreview.style.display =
                    "none";

                thumbnailImage.src =
                    "";

                streamStatus.textContent =
                    "Please choose an image file.";

                return;

            }


            if(file.size > 8 * 1024 * 1024){

                thumbnailInput.value = "";

                thumbnailPreview.style.display =
                    "none";

                thumbnailImage.src =
                    "";

                streamStatus.textContent =
                    "Thumbnail must be smaller than 8 MB.";

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                function(event){

                    thumbnailImage.src =
                        event.target.result;

                    thumbnailPreview.style.display =
                        "block";

                    choosePhotoButton.textContent =
                        "📷 Change photo";

                };


            reader.onerror =
                function(){

                    thumbnailInput.value = "";

                    thumbnailPreview.style.display =
                        "none";

                    thumbnailImage.src =
                        "";

                };


            reader.readAsDataURL(file);

        }
    );

}


/* =========================================
   SEARCH ELEMENTS
========================================= */

const searchButton =
    document.getElementById(
        "searchButton"
    );


const searchPanel =
    document.getElementById(
        "searchPanel"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const searchSubmit =
    document.getElementById(
        "searchSubmit"
    );


const searchResult =
    document.getElementById(
        "searchResult"
    );


/* =========================================
   OPEN SEARCH
========================================= */

if(searchButton){

    searchButton.addEventListener(
        "click",
        function(event){

            event.preventDefault();

            event.stopPropagation();


            if(!searchPanel){
                return;
            }


            searchPanel.classList.toggle(
                "active"
            );


            if(
                searchPanel.classList.contains(
                    "active"
                )
            ){

                setTimeout(
                    function(){

                        if(searchInput){

                            searchInput.focus();

                        }

                    },
                    80
                );

            }

        }
    );

}


/* =========================================
   SEARCH
========================================= */

async function performSearch(){

    if(
        !searchInput ||
        !searchResult
    ){

        return;

    }


    const term =
        searchInput.value.trim();


    if(!term){

        searchResult.textContent =
            "Please enter something to search.";

        return;

    }


    searchResult.textContent =
        "Searching Canvas...";


    try{

        const response =
            await fetch(
                CANVAS_API +
                "/api/streams/live"
            );


        let data = {};


        try{

            data =
                await response.json();

        }catch(error){

            data = {};

        }


        if(!response.ok){

            throw new Error(
                data.message ||
                data.error ||
                "Search failed."
            );

        }


        const streams =
            Array.isArray(data.streams)
                ? data.streams
                : [];


        const searchText =
            term.toLowerCase();


        const found =
            streams.filter(
                function(stream){

                    const text =
                        [
                            stream.title,
                            stream.name,
                            stream.username,
                            stream.category,
                            stream.description
                        ]
                        .map(
                            function(value){

                                return String(
                                    value || ""
                                );

                            }
                        )
                        .join(" ")
                        .toLowerCase();


                    return text.includes(
                        searchText
                    );

                }
            );


        if(found.length){

            const stream =
                found[0];


            const title =
                escapeHtml(
                    stream.title ||
                    "Untitled stream"
                );


            const creator =
                escapeHtml(
                    stream.name ||
                    stream.username ||
                    "Canvas Creator"
                );


            searchResult.innerHTML =
                "<strong>🔴 Live stream found</strong><br>" +
                title +
                "<br>by " +
                creator;

        }else{

            searchResult.textContent =
                'No live results found for "' +
                term +
                '".';

        }


    }catch(error){

        console.error(
            "Canvas search failed:",
            error
        );


        searchResult.textContent =
            "Unable to search Canvas right now.";

    }

}

/* =========================================
   SOCKET CONNECTION
========================================= */

function connectSocket(){

    if(
        socket &&
        (
            socket.connected ||
            socket.connecting
        )
    ){

        return;

    }


    socket =
        io(
            CANVAS_API,
            {

                transports:[
                    "websocket",
                    "polling"
                ],

                reconnection:true,

                reconnectionAttempts:5,

                timeout:10000

            }
        );
       socket.on(
        "connect",
        function(){

            socketConnected = true;


            console.log(
                "Canvas Socket.IO connected:",
                socket.id
            );


            if(webrtcStatus){

                webrtcStatus.textContent =
                    "Canvas connection ready.";

            }

        }
    );


    socket.on(
        "disconnect",
        function(){

            socketConnected = false;


            console.log(
                "Canvas Socket.IO disconnected."
            );


            if(isStreaming){

                webrtcStatus.textContent =
                    "Canvas connection interrupted.";

            }

        }
    );


    socket.on(
        "connect_error",
        function(error){

            socketConnected = false;


            console.error(
                "Canvas Socket.IO error:",
                error
            );


            if(isStreaming){

                webrtcStatus.textContent =
                    "Unable to connect to Canvas streaming server.";

            }

        }
    );


    /* =====================================
       EXISTING PEERS
    ===================================== */

    socket.on(
        "existing-peers",
        async function(peers){

            if(!isStreaming){
                return;
            }


            if(!Array.isArray(peers)){
                return;
            }


            for(
                const peerId of peers
            ){

                try{

                    await createOfferForPeer(
                        peerId
                    );

                }catch(error){

                    console.error(
                        "Offer creation failed:",
                        error
                    );

                }

            }

        }
    );


    /* =====================================
       PEER JOINED
    ===================================== */

    socket.on(
        "peer-joined",
        function(data){

            if(
                !data ||
                !isStreaming ||
                !data.socketId
            ){

                return;

            }


            if(
                data.role === "viewer" ||
                data.role === undefined
            ){

                createOfferForPeer(
                    data.socketId
                );

            }

        }
    );


    /* =====================================
       WEBRTC OFFER
    ===================================== */

    socket.on(
        "webrtc-offer",
        async function(data){

            if(
                !data ||
                !data.sender ||
                !data.offer
            ){

                return;

            }


            const sender =
                data.sender;


            try{

                const pc =
                    await getPeerConnection(
                        sender
                    );


                await pc.setRemoteDescription(
                    new RTCSessionDescription(
                        data.offer
                    )
                );


                const answer =
                    await pc.createAnswer();


                await pc.setLocalDescription(
                    answer
                );


                socket.emit(
                    "webrtc-answer",
                    {

                        target:
                            sender,

                        answer:
                            pc.localDescription

                    }
                );


                await flushPendingIce(
                    sender
                );


            }catch(error){

                console.error(
                    "WebRTC offer failed:",
                    error
                );

            }

        }
    );


    /* =====================================
       WEBRTC ANSWER
    ===================================== */

    socket.on(
        "webrtc-answer",
        async function(data){

            if(
                !data ||
                !data.sender ||
                !data.answer
            ){

                return;

            }


            const pc =
                peerConnections[
                    data.sender
                ];


            if(!pc){
                return;
            }


            try{

                await pc.setRemoteDescription(
                    new RTCSessionDescription(
                        data.answer
                    )
                );


                await flushPendingIce(
                    data.sender
                );


            }catch(error){

                console.error(
                    "WebRTC answer failed:",
                    error
                );

            }

        }
    );


    /* =====================================
       WEBRTC ICE
    ===================================== */

    socket.on(
        "webrtc-ice",
        async function(data){

            if(
                !data ||
                !data.sender ||
                !data.candidate
            ){

                return;

            }


            const sender =
                data.sender;


            const candidate =
                data.candidate;


            const pc =
                peerConnections[
                    sender
                ];


            if(
                !pc ||
                !pc.remoteDescription
            ){

                if(
                    !pendingIceCandidates[
                        sender
                    ]
                ){

                    pendingIceCandidates[
                        sender
                    ] = [];

                }


                pendingIceCandidates[
                    sender
                ].push(
                    candidate
                );

                return;

            }


            try{

                await pc.addIceCandidate(
                    new RTCIceCandidate(
                        candidate
                    )
                );

            }catch(error){

                console.error(
                    "ICE candidate failed:",
                    error
                );

            }

        }
    );


    /* =====================================
       PEER LEFT
    ===================================== */

    socket.on(
        "peer-left",
        function(data){

            if(
                !data ||
                !data.socketId
            ){

                return;

            }


            closePeerConnection(
                data.socketId
            );

        }
    );

}

/* =========================================
   CAMERA CONSTRAINTS
========================================= */

function getCameraConstraints(
    facingMode
){

    return {

        facingMode:{
            ideal:facingMode
        },

        width:{
            ideal:1920,
            min:640
        },

        height:{
            ideal:1080,
            min:360
        },

        frameRate:{
            ideal:30,
            min:24,
            max:30
        }

    };

}


/* =========================================
   AUDIO CONSTRAINTS
========================================= */

function getAudioConstraints(){

    return {

        echoCancellation:true,

        noiseSuppression:true,

        autoGainControl:true,

        channelCount:{
            ideal:2
        },

        sampleRate:{
            ideal:48000
        }

    };

}


/* =========================================
   GET PEER CONNECTION
========================================= */

async function getPeerConnection(
    peerId
){

    if(
        peerConnections[
            peerId
        ]
    ){

        return peerConnections[
            peerId
        ];

    }


    const pc =
        new RTCPeerConnection(
            rtcConfiguration
        );


    peerConnections[
        peerId
    ] = pc;


    pendingIceCandidates[
        peerId
    ] =
        pendingIceCandidates[
            peerId
        ] || [];


    /* =====================================
       ADD CURRENT MEDIA
    ===================================== */

    if(canvasStream){

        canvasStream
            .getTracks()
            .forEach(
                function(track){

                    try{

                        pc.addTrack(
                            track,
                            canvasStream
                        );

                    }catch(error){

                        console.error(
                            "Could not add media track:",
                            error
                        );

                    }

                }
            );

    }


    /* =====================================
       ICE
    ===================================== */

    pc.onicecandidate =
        function(event){

            if(
                event.candidate &&
                socket &&
                socket.connected
            ){

                socket.emit(
                    "webrtc-ice",
                    {

                        target:
                            peerId,

                        candidate:
                            event.candidate

                    }
                );

            }

        };


    /* =====================================
       CONNECTION STATE
    ===================================== */

    pc.onconnectionstatechange =
        function(){

            console.log(
                "Canvas WebRTC:",
                peerId,
                pc.connectionState
            );


            if(
                pc.connectionState ===
                "connected"
            ){

                if(webrtcStatus){

                    webrtcStatus.textContent =
                        "🔴 Streaming connection active.";

                }

            }


            if(
                pc.connectionState ===
                "failed"
            ){

                closePeerConnection(
                    peerId
                );

            }

        };


    return pc;

}


/* =========================================
   CREATE OFFER
========================================= */

async function createOfferForPeer(
    peerId
){

    if(
        !socket ||
        !socket.connected ||
        !peerId ||
        !canvasStream
    ){

        return;

    }


    try{

        const pc =
            await getPeerConnection(
                peerId
            );


        if(
            pc.signalingState !==
            "stable"
        ){

            return;

        }


        const offer =
            await pc.createOffer();


        await pc.setLocalDescription(
            offer
        );


        socket.emit(
            "webrtc-offer",
            {

                target:
                    peerId,

                offer:
                    pc.localDescription

            }
        );


    }catch(error){

        console.error(
            "Canvas offer failed:",
            error
        );

    }

}


/* =========================================
   FLUSH PENDING ICE
========================================= */

async function flushPendingIce(
    peerId
){

    const pc =
        peerConnections[
            peerId
        ];


    if(
        !pc ||
        !pc.remoteDescription
    ){

        return;

    }


    const candidates =
        pendingIceCandidates[
            peerId
        ] || [];


    if(!candidates.length){

        return;

    }


    pendingIceCandidates[
        peerId
    ] = [];


    for(
        const candidate of candidates
    ){

        try{

            await pc.addIceCandidate(
                new RTCIceCandidate(
                    candidate
                )
            );

        }catch(error){

            console.error(
                "Pending ICE failed:",
                error
            );

        }

    }

}


/* =========================================
   CLOSE PEER
========================================= */

function closePeerConnection(
    peerId
){

    const pc =
        peerConnections[
            peerId
        ];


    if(pc){

        try{

            pc.close();

        }catch(error){

            console.error(
                "Peer close error:",
                error
            );

        }

    }


    delete peerConnections[
        peerId
    ];


    delete pendingIceCandidates[
        peerId
    ];

}


/* =========================================
   CLOSE ALL PEERS
========================================= */

function closeAllPeerConnections(){

    Object.keys(
        peerConnections
    ).forEach(
        function(peerId){

            closePeerConnection(
                peerId
            );

        }
    );


    peerConnections = {};

    pendingIceCandidates = {};

}


/* =========================================
   STOP CURRENT MEDIA
========================================= */

function stopCurrentMediaTracks(){

    if(!canvasStream){

        return;

    }


    canvasStream
        .getTracks()
        .forEach(
            function(track){

                try{

                    track.stop();

                }catch(error){

                    console.error(
                        "Track stop error:",
                        error
                    );

                }

            }
        );

}


/* =========================================
   APPLY CAMERA TRACK TO PEERS
========================================= */

async function replaceVideoTrackForPeers(
    newVideoTrack
){

    const peerIds =
        Object.keys(
            peerConnections
        );
  for(
        const peerId of peerIds
    ){

        const pc =
            peerConnections[
                peerId
            ];


        if(!pc){

            continue;

        }


        const sender =
            pc.getSenders()
            .find(
                function(item){

                    return (
                        item.track &&
                        item.track.kind ===
                        "video"
                    );

                }
            );


        if(sender){

            try{

                await sender.replaceTrack(
                    newVideoTrack
                );

            }catch(error){

                console.error(
                    "Video track replacement failed:",
                    error
                );

            }

        }

    }

}

/* =========================================
   START CAMERA + MICROPHONE
========================================= */

async function startCameraAndMicrophone(
    enableCamera = true,
    enableMicrophone = true
){

    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        permissionMessage.textContent =
            "Camera and microphone are not supported on this device.";

        return false;

    }


    try{

        /*
         * Request high-quality video.
         *
         * 1920x1080 is the preferred target.
         * The browser will automatically fall
         * back when the device cannot provide it.
         */

        const stream =
            await navigator.mediaDevices
            .getUserMedia({

                video:
                    getCameraConstraints(
                        currentFacingMode
                    ),

                audio:
                    getAudioConstraints()

            });


        /*
         * Remove previous tracks.
         */

        if(canvasStream){

            stopCurrentMediaTracks();

        }


        canvasStream =
            stream;


        cameraEnabled =
            enableCamera;

        microphoneEnabled =
            enableMicrophone;


        /*
         * Apply camera state.
         */

        canvasStream
            .getVideoTracks()
            .forEach(
                function(track){

                    track.enabled =
                        cameraEnabled;

                }
            );


        /*
         * Apply microphone state.
         */

        canvasStream
            .getAudioTracks()
            .forEach(
                function(track){

                    track.enabled =
                        microphoneEnabled;

                }
            );


        /*
         * Preview.
         */

        await updateCameraPreview();


        /*
         * Print actual camera settings.
         * This helps us see what the device
         * actually gave Canvas.
         */

        const videoTrack =
            canvasStream
            .getVideoTracks()[0];


        if(videoTrack){

            try{

                const settings =
                    videoTrack.getSettings();

                console.log(
                    "Canvas camera settings:",
                    settings
                );

            }catch(error){

                console.log(
                    "Could not read camera settings."
                );

            }

        }


        permissionMessage.textContent =
            "";


        updateCameraButton();

        updateMicButton();

        updateSwitchCameraButton();


        return true;


    }catch(error){

        console.error(
            "Canvas media error:",
            error
        );


        if(canvasStream){

            stopCurrentMediaTracks();

        }


        canvasStream = null;

        cameraEnabled = false;

        microphoneEnabled = false;


        if(
            error.name ===
            "NotAllowedError"
        ){

            permissionMessage.textContent =
                "Please allow camera and microphone permission.";

        }else if(
            error.name ===
            "NotFoundError"
        ){

            permissionMessage.textContent =
                "Camera or microphone was not found.";

        }else if(
            error.name ===
            "NotReadableError"
        ){

            permissionMessage.textContent =
                "Camera or microphone is already being used.";

        }else if(
            error.name ===
            "OverconstrainedError"
        ){

            permissionMessage.textContent =
                "This device cannot provide the requested camera quality.";

        }else{

            permissionMessage.textContent =
                "Could not access camera and microphone.";

        }


        updateCameraButton();

        updateMicButton();

        updateSwitchCameraButton();


        return false;

    }

}

/* =========================================
   SWITCH FRONT / BACK CAMERA
========================================= */

if(switchCameraButton){

    switchCameraButton.addEventListener(
        "click",
        async function(){

            if(
                !navigator.mediaDevices ||
                !navigator.mediaDevices.getUserMedia
            ){

                permissionMessage.textContent =
                    "Camera switching is not supported on this device.";

                return;

            }


            /*
             * If no stream exists,
             * start the selected camera.
             */

            if(!canvasStream){

                currentFacingMode =
                    currentFacingMode === "user"
                        ? "environment"
                        : "user";


                await startCameraAndMicrophone(
                    true,
                    false
                );

                return;

            }


            const oldCameraState =
                cameraEnabled;


            const oldMicState =
                microphoneEnabled;


            permissionMessage.textContent =
                "Switching camera...";


            try{

                /*
                 * Request the opposite camera.
                 */

                const newStream =
                    await navigator.mediaDevices
                    .getUserMedia({

                        video:
                            getCameraConstraints(
                                currentFacingMode ===
                                "user"
                                    ? "environment"
                                    : "user"
                            ),

                        audio:false

                    });


                const newVideoTrack =
                    newStream
                    .getVideoTracks()[0];


                if(!newVideoTrack){

                    throw new Error(
                        "No camera track was returned."
                    );

                }


                /*
                 * Keep the old audio track.
                 */

                const audioTracks =
                    canvasStream
                    .getAudioTracks();


                const oldVideoTracks =
                    canvasStream
                    .getVideoTracks();


                /*
                 * Remove old video tracks.
                 */

                oldVideoTracks.forEach(
                    function(track){

                        try{

                            track.stop();

                        }catch(error){}

                        try{

                            canvasStream.removeTrack(
                                track
                            );

                        }catch(error){}

                    }
                );


                /*
                 * Add new camera.
                 */

                canvasStream.addTrack(
                    newVideoTrack
                );


                /*
                 * Restore camera state.
                 */

                newVideoTrack.enabled =
                    oldCameraState;


                /*
                 * Replace the video track
                 * being sent to every viewer.
                 */

                if(isStreaming){

                    await replaceVideoTrackForPeers(
                        newVideoTrack
                    );

                }


                /*
                 * Update facing mode.
                 */

                currentFacingMode =
                    currentFacingMode === "user"
                        ? "environment"
                        : "user";


                /*
                 * Update preview.
                 */

                await updateCameraPreview();


                permissionMessage.textContent =
                    "";


                updateCameraButton();

                updateMicButton();

                updateSwitchCameraButton();


                console.log(
                    "Canvas camera switched:",
                    currentFacingMode
                );


            }catch(error){

                console.error(
                    "Camera switch failed:",
                    error
                );


                permissionMessage.textContent =
                    "Could not switch camera on this device.";

                cameraEnabled =
                    oldCameraState;

                microphoneEnabled =
                    oldMicState;

            }

        }
    );

}

            backendStream.title
                ? backendStream.title
                : streamTitleInput.value.trim(),

        category:
            backendStream &&
            backendStream.category
                ? backendStream.category
                : categoryInput.value,

        description:
            backendStream &&
            backendStream.description
                ? backendStream.description
                : descriptionInput.value.trim(),

        creator:
            creator,

        name:
            savedProfile.name || "",

        username:
            savedProfile.username || "",

        thumbnail:
            thumbnailImage &&
            thumbnailImage.src
                ? thumbnailImage.src
                : "",

        startedAt:
            new Date().toISOString(),

        isLive:true

    };


    localStorage.setItem(
        "canvasActiveStream",
        JSON.stringify(
            streamData
        )
    );


    localStorage.setItem(
        "canvasLiveStream",
        JSON.stringify(
            streamData
        )
    );


    return streamData;

}


/* =========================================
   CLEAR ACTIVE STREAM
========================================= */

function clearActiveStream(){

    localStorage.removeItem(
        "canvasActiveStream"
    );

    localStorage.removeItem(
        "canvasLiveStream"
    );
  localStorage.removeItem(
        "canvasCurrentStreamId"
    );

}


/* =========================================
   CURRENT STREAM ID
========================================= */

function getCurrentStreamId(){

    return (
        currentStreamId ||
        localStorage.getItem(
            "canvasCurrentStreamId"
        ) ||
        ""
    );

}


/* =========================================
   CREATE BACKEND STREAM
========================================= */

async function createBackendStream(){

    const token =
        getAuthToken();


    if(!token){

        throw new Error(
            "Please log in to Canvas before streaming."
        );

    }


    const title =
        streamTitleInput.value.trim();


    const category =
        categoryInput.value;


    const description =
        descriptionInput.value.trim();


    const response =
        await fetch(
            CANVAS_API +
            "/api/streams",
            {

                method:"POST",

                headers:{

                    "Content-Type":
                        "application/json",

                    "Authorization":
                        "Bearer " +
                        token

                },

                body:
                    JSON.stringify({

                        title:title,

                        category:category,

                        description:description

                    })

            }
        );


    let data = {};


    try{

        data =
            await response.json();

    }catch(error){

        data = {};

    }


    if(!response.ok){

        throw new Error(
            data.message ||
            data.error ||
            "Unable to create Canvas stream."
        );

    }


    if(
        !data.stream ||
        !data.stream.id
    ){

        throw new Error(
            "Canvas server did not return a stream."
        );

    }


    return data.stream;

}


/* =========================================
   START STREAMING
========================================= */

async function startStreaming(){

    if(isStreaming){

        return;

    }


    const token =
        getAuthToken();


    if(!token){

        streamStatus.textContent =
            "Please log in to Canvas before streaming.";

        return;

    }


    const title =
        streamTitleInput.value.trim();


    const description =
        descriptionInput.value.trim();


    if(!title){

        streamStatus.textContent =
            "Please enter a stream title.";

        streamTitleInput.focus();

        return;

    }


    if(title.length > 100){

        streamStatus.textContent =
            "Stream title is too long.";

        return;

    }


    if(description.length > 500){

        streamStatus.textContent =
            "Description is too long.";

        return;

    }


    /*
     * Start high-quality media.
     */

    streamStatus.textContent =
        "Requesting camera and microphone...";


    const mediaStarted =
        await startCameraAndMicrophone(
            true,
            true
        );


    if(!mediaStarted){

        return;

    }


    /*
     * Connect Socket.IO.
     */

    streamStatus.textContent =
        "Connecting to Canvas...";


    connectSocket();


    if(
        socket &&
        !socket.connected
    ){

        await new Promise(
            function(resolve){

                let finished = false;


                const finish =
                    function(){

                        if(finished){
                            return;
                        }

                        finished = true;

                        resolve();

                    };


                socket.once(
                    "connect",
                    finish
                );


                setTimeout(
                    finish,
                    5000
                );

            }
        );

    }


    try{

        streamStatus.textContent =
            "Starting Canvas stream...";


        /*
         * Create real backend stream.
         */

        const backendStream =
            await createBackendStream();


        currentBackendStream =
            backendStream;


        currentStreamId =
            String(
                backendStream.id
            );


        localStorage.setItem(
            "canvasCurrentStreamId",
            currentStreamId
        );


        saveActiveStream(
            backendStream
        );


        isStreaming = true;


        /*
         * Update buttons.
         */

        startStreamingButton.classList.add(
            "hidden"
        );


        stopStreamingButton.classList.remove(
            "hidden"
        );


        streamStatus.textContent =
            "🔴 You are now live on Canvas.";


        if(webrtcStatus){

            if(socketConnected){

                webrtcStatus.textContent =
                    "Canvas connection ready.";

            }else{

                webrtcStatus.textContent =
                    "Live stream started.";

            }

        }


        /*
         * Tell Socket.IO this is
         * the broadcaster.
         */

        if(
            socket &&
            socket.connected
        ){

            socket.emit(
                "join-stream",
                {

                    streamId:
                        currentStreamId,

                    role:
                        "broadcaster"

                }
            );

        }


        console.log(
            "Canvas stream started:",
            backendStream
        );


    }catch(error){

        console.error(
            "Canvas start stream error:",
            error
        );


        stopCurrentMediaTracks();


        canvasStream = null;

        cameraEnabled = false;

        microphoneEnabled = false;

        isStreaming = false;

        currentBackendStream = null;

        currentStreamId = null;


        updateCameraButton();

        updateMicButton();


        if(cameraPreview){

            cameraPreview.pause();

            cameraPreview.srcObject =
                null;

            cameraPreview.style.display =
                "none";

        }


        if(cameraMessage){

            cameraMessage.style.display =
                "block";

        }


        streamStatus.textContent =
            error.message ||
            "Unable to start Canvas stream.";

    }

}


/* =========================================
   START BUTTON
========================================= */

if(startStreamingButton){

    startStreamingButton.addEventListener(
        "click",
        function(event){

            event.preventDefault();

            startStreaming();

        }
    );

}


/* =========================================
   STOP STREAMING
========================================= */

async function stopStreaming(){

    if(!isStreaming){

        return;

    }


    const token =
        getAuthToken();


    const streamId =
        getCurrentStreamId();


    streamStatus.textContent =
        "Ending Canvas stream...";


    /*
     * Tell Socket.IO first.
     */

    if(
        socket &&
        socket.connected
    ){

        try{

            socket.emit(
                "leave-stream",
                {

                    streamId:
                        streamId,

                    role:
                        "broadcaster"

                }
            );

        }catch(error){

            console.error(
                "Socket leave error:",
                error
            );

        }

    }


    /*
     * End stream in backend.
     */

    if(
        token &&
        streamId
    ){

        try{

            const response =
                await fetch(

                    CANVAS_API +
                    "/api/streams/" +
                    encodeURIComponent(
                        streamId
                    ) +
                    "/end",

                    {

                        method:"PUT",

                        headers:{

                            "Authorization":
                                "Bearer " +
                                token

                        }

                    }

                );


            let data = {};


            try{

                data =
                    await response.json();

            }catch(error){

                data = {};

            }


            if(!response.ok){

                console.error(
                    "Backend end stream error:",
                    data.message ||
                    "Unknown error"
                );

            }

        }catch(error){

            console.error(
                "End stream request failed:",
                error
            );

        }

    }


    /*
     * Stop all media.
     */

    stopCurrentMediaTracks();


    canvasStream = null;


    /*
     * Reset preview.
     */

    if(cameraPreview){

        cameraPreview.pause();

        cameraPreview.srcObject =
            null;

        cameraPreview.style.display =
            "none";

    }


    if(cameraMessage){

        cameraMessage.style.display =
            "block";

    }


    /*
     * Close WebRTC peers.
     */

    closeAllPeerConnections();


    /*
     * Reset state.
     */

    isStreaming = false;

    cameraEnabled = false;

    microphoneEnabled = false;

    currentBackendStream = null;

    currentStreamId = null;


    /*
     * Remove live stream.
     */

    clearActiveStream();


    /*
     * Restore buttons.
     */

    if(startStreamingButton){

        startStreamingButton.classList.remove(
            "hidden"
        );

    }


    if(stopStreamingButton){

        stopStreamingButton.classList.add(
            "hidden"
        );

    }


    updateCameraButton();

    updateMicButton();


    streamStatus.textContent =
        "Streaming ended.";

    if(webrtcStatus){

        webrtcStatus.textContent =
            "";

    }

}


/* =========================================
   STOP BUTTON
========================================= */

if(stopStreamingButton){

    stopStreamingButton.addEventListener(
        "click",
        function(event){

            event.preventDefault();

            stopStreaming();

        }
    );

}


/* =========================================
   PAGE EXIT CLEANUP
========================================= */

window.addEventListener(
    "beforeunload",
    function(){

        if(
            isStreaming &&
            socket &&
            socket.connected
        ){

            try{

                socket.emit(
                    "leave-stream",
                    {

                        streamId:
                            getCurrentStreamId(),

                        role:
                            "broadcaster"

                    }
                );

            }catch(error){}

        }

    }
);

/* =========================================
   OPTIONAL DEVICE CAMERA CHECK
========================================= */

async function checkCameraDevices(){

    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.enumerateDevices
    ){

        return;

    }


    try{

        const devices =
            await navigator.mediaDevices
            .enumerateDevices();


        const cameras =
            devices.filter(
                function(device){

                    return (
                        device.kind ===
                        "videoinput"
                    );

                }
            );


        console.log(
            "Canvas cameras detected:",
            cameras.length
        );


        /*
         * If there is only one camera,
         * the switch button still remains
         * safe. The browser will simply tell
         * us if switching isn't available.
         */

        if(
            cameras.length <= 1 &&
            switchCameraButton
        ){

            switchCameraButton.title =
                "Only one camera detected";

        }

    }catch(error){

        console.log(
            "Camera device check failed:",
            error
        );

    }

}


/* =========================================
   CHECK DEVICES AFTER PAGE LOAD
========================================= */

window.addEventListener(
    "DOMContentLoaded",
    function(){

        checkCameraDevices();

    }
);


/* =========================================
   VISIBILITY RECOVERY
========================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            !document.hidden &&
            cameraPreview &&
            canvasStream &&
            cameraEnabled
        ){

            cameraPreview.play()
            .catch(
                function(){}
            );

        }

    }
);


/* =========================================
   FINAL CLEANUP
========================================= */

window.addEventListener(
    "pagehide",
    function(){

        if(!isStreaming){

            stopCurrentMediaTracks();

        }

    }
);
