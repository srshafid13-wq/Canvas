<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Canvas - Go Live</title>


<style>

/* =========================================
   CANVAS - GO LIVE
   PART 1
========================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


html,
body{
    width:100%;
    min-height:100%;
}


body{

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#FAF9F6;

    color:#4B3326;

    padding-bottom:82px;

}


/* =========================================
   TOP NAVIGATION
========================================= */

.top-nav{

    width:100%;

    height:64px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        0 16px;

    background:#FAF9F6;

    border-bottom:
        1px solid
        rgba(75,51,38,.10);

    position:
        sticky;

    top:0;

    z-index:50;

}


.logo{

    font-size:24px;

    font-weight:800;

    letter-spacing:-.5px;

    color:#4B3326;

}


.top-actions{

    display:flex;

    align-items:center;

    gap:12px;

}


/* =========================================
   PROFILE ICON
========================================= */

.profile-icon{

    width:40px;

    height:40px;

    min-width:40px;

    border-radius:50%;

    overflow:hidden;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#4B3326;

    color:#FAF9F6;

    text-decoration:none;

    font-size:18px;

    font-weight:bold;

}


.profile-icon img{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;

}


/* =========================================
   MAIN PAGE
========================================= */

.main{

    width:100%;

    max-width:760px;

    margin:0 auto;

    padding:
        18px 15px
        25px;

}


/* =========================================
   PAGE TITLE
========================================= */

.page-title{

    font-size:26px;

    font-weight:800;

    margin-bottom:5px;

    color:#4B3326;

}


.page-subtitle{

    font-size:14px;

    color:#806B5D;

    margin-bottom:18px;

}


/* =========================================
   CAMERA AREA
========================================= */

.camera-card{

    width:100%;

    background:#F3E8D3;

    border:
        2px solid
        #DCC8AA;

    border-radius:18px;

    overflow:hidden;

    position:relative;

}


.camera-box{

    width:100%;

    height:360px;

    background:#241B16;

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

}


#cameraPreview{

    width:100%;

    height:100%;

    object-fit:cover;

    display:none;

    background:#111;

}


.camera-message{

    text-align:center;

    padding:20px;

    color:#E8DCCB;

}


.camera-message-icon{

    font-size:42px;

    margin-bottom:8px;

}


.camera-message-title{

    font-size:17px;

    font-weight:700;

    margin-bottom:5px;

}


.camera-message-text{

    font-size:13px;

    color:#BBAA98;

}


/* =========================================
   CAMERA CONTROLS
========================================= */

.camera-controls{

    display:flex;

    gap:10px;

    padding:12px;

    background:#F3E8D3;

}


.media-button{

    flex:1;

    min-height:44px;

    border:0;

    border-radius:12px;

    background:#FFFFFF;

    color:#4B3326;

    font-size:13px;

    font-weight:700;

    cursor:pointer;

    border:
        1px solid
        rgba(75,51,38,.12);

    transition:
        .2s ease;

}


.media-button:active{

    transform:scale(.97);

}


.media-button.active{

    background:#4B3326;

    color:#FFFFFF;

}


/* =========================================
   STREAM CARD
========================================= */

.stream-card{

    margin-top:18px;

    padding:18px;

    background:#FFFFFF;

    border-radius:18px;

    border:
        1px solid
        rgba(75,51,38,.10);

    box-shadow:
        0 5px 20px
        rgba(75,51,38,.06);

}


/* =========================================
   FORM GROUP
========================================= */

.form-group{

    margin-bottom:15px;

}


.form-label{

    display:block;

    margin-bottom:7px;

    font-size:13px;

    font-weight:700;

    color:#4B3326;

}


.form-input,
.form-select,
.form-textarea{

    width:100%;

    border:
        1px solid
        #DCCFC2;

    border-radius:11px;

    padding:
        12px 13px;

    background:#FAF9F6;

    color:#4B3326;

    outline:none;

    font-family:inherit;

    font-size:14px;

}


.form-input:focus,
.form-select:focus,
.form-textarea:focus{

    border-color:#9A7658;

    box-shadow:
        0 0 0 3px
        rgba(154,118,88,.10);

}


.form-textarea{

    min-height:95px;

    resize:vertical;

}


/* =========================================
   THUMBNAIL
========================================= */

.thumbnail-section{

    margin-top:4px;

}


.thumbnail-upload{

    width:100%;

    min-height:130px;

    border:
        2px dashed
        #D5C2A8;

    border-radius:14px;

    background:#FBF6EE;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    cursor:pointer;

    overflow:hidden;

}


.thumbnail-upload-content{

    padding:20px;

}


.thumbnail-upload-title{

    font-size:15px;

    font-weight:800;

    color:#4B3326;

}


.thumbnail-upload-text{

    font-size:12px;

    margin-top:5px;

    color:#8A7768;

}


#thumbnailInput{

    display:none;

}


#thumbnailPreview{

    width:100%;

    display:none;

}


#thumbnailImage{

    width:100%;

    max-height:220px;

    object-fit:cover;

    display:block;

}


/* =========================================
   STREAM BUTTONS
========================================= */

.stream-actions{

    margin-top:18px;

    display:flex;

    gap:10px;

}


.stream-button{

    width:100%;

    min-height:48px;

    border:0;

    border-radius:13px;

    font-size:15px;

    font-weight:800;

    cursor:pointer;

}


.start-button{

    background:#4B3326;

    color:#FFFFFF;

}


.end-button{

    background:#8E3025;

    color:#FFFFFF;

}


.stream-button:disabled{

    opacity:.55;

    cursor:not-allowed;

}


.hidden{

    display:none !important;

}


/* =========================================
   STATUS
========================================= */

.status-box{

    margin-top:13px;

    min-height:20px;

    text-align:center;

    font-size:13px;

    color:#806B5D;

}


.permission-message{

    margin-top:8px;

    font-size:12px;

    line-height:1.4;

    color:#9A7658;

    text-align:center;

}


.webrtc-status{

    margin-top:4px;

    text-align:center;

    font-size:12px;

    color:#8A7768;

}


/* =========================================
   BOTTOM NAVIGATION
========================================= */

.bottom-nav{

    position:fixed;

    left:0;

    right:0;

    bottom:0;

    height:72px;

    background:#FFFFFF;

    border-top:
        1px solid
        rgba(75,51,38,.10);

    display:flex;

    align-items:center;

    justify-content:
        space-around;

    z-index:100;

}


.bottom-nav a{

    flex:1;

    height:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:4px;

    text-decoration:none;

    color:#806B5D;

    font-size:11px;

    font-weight:700;

}


.bottom-nav a span{

    display:block;

}


.bottom-nav a.active{

    color:#4B3326;

}


.bottom-nav-icon{

    font-size:22px;

    line-height:1;

}


.bottom-profile{

    width:25px;

    height:25px;

    border-radius:50%;

    overflow:hidden;

    background:#4B3326;

    color:#FFFFFF;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:12px;

}


.bottom-profile img{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;

}


/* =========================================
   MOBILE
========================================= */

@media(max-width:480px){

    .top-nav{

        height:60px;

        padding:
            0 13px;

    }

        font-size:22px;

    }

        padding:
            15px 12px

    }


    .camera-box{

        height:300px;

    }


    .camera-controls{

        gap:7px;

    }


    .media-button{

        font-size:12px;

        padding:
            0 5px;

    }


    .stream-card{

        padding:14px;

    }


    .page-title{

        font-size:23px;

    }

}


</style>

<script>
 /* =========================================
   CANVAS GO LIVE
   PART 2 — CONFIG + ELEMENTS + AUTH
========================================= */


/* =========================================
   BACKEND CONFIGURATION
========================================= */

const API_BASE =
    "https://canvas-kh9p.onrender.com";


const SOCKET_URL =
    API_BASE;


/* =========================================
   MEDIA STATE
========================================= */

let canvasStream =
    null;


let cameraEnabled =
    false;


let microphoneEnabled =
    false;


let currentFacingMode =
    "user";


let isStreaming =
    false;


/* =========================================
   STREAM STATE
========================================= */

let currentStreamId =
    null;


let broadcasterRoom =
    null;


let socket =
    null;


let streamHeartbeat =
    null;


/* =========================================
   WEBRTC STATE
========================================= */

const peerConnections =
    {};


/* =========================================
   THUMBNAIL STATE
========================================= */

let selectedThumbnail =
    "";


/* =========================================
   DOM ELEMENTS
========================================= */

const cameraPreview =
    document.getElementById(
        "cameraPreview"
    );


const cameraMessage =
    document.getElementById(
        "cameraMessage"
    );


const permissionMessage =
    document.getElementById(
        "permissionMessage"
    );


const webrtcStatus =
    document.getElementById(
        "webrtcStatus"
    );


const streamStatus =
    document.getElementById(
        "streamStatus"
    );


const streamTitle =
    document.getElementById(
        "streamTitle"
    );


const category =
    document.getElementById(
        "category"
    );


const description =
    document.getElementById(
        "description"
    );


const thumbnailInput =
    document.getElementById(
        "thumbnailInput"
    );


const thumbnailPreview =
    document.getElementById(
        "thumbnailPreview"
    );


const thumbnailImage =
    document.getElementById(
        "thumbnailImage"
    );


const choosePhotoButton =
    document.getElementById(
        "choosePhotoButton"
    );


const cameraButton =
    document.getElementById(
        "cameraButton"
    );


const micButton =
    document.getElementById(
        "micButton"
    );


const switchCameraButton =
    document.getElementById(
        "switchCameraButton"
    );


const startStreamingButton =
    document.getElementById(
        "startStreamingButton"
    );


const stopStreamingButton =
    document.getElementById(
        "stopStreamingButton"
    );


/* =========================================
   AUTH TOKEN
========================================= */

function getAuthToken(){

    return (
        localStorage.getItem(
            "canvasAuthToken"
        ) ||

        localStorage.getItem(
            "authToken"
        ) ||

        localStorage.getItem(
            "token"
        ) ||

        ""
    );

}


/* =========================================
   AUTH HEADERS
========================================= */

function authHeaders(){

    const token =
        getAuthToken();


    const headers = {

        "Content-Type":
            "application/json"

    };


    if(token){

        headers.Authorization =
            "Bearer " + token;

    }


    return headers;

}


/* =========================================
   STATUS MESSAGE
========================================= */

function setStatus(
    message,
    isError = false
){

    if(!streamStatus){

        return;

    }


    streamStatus.textContent =
        message || "";


    streamStatus.style.color =
        isError
            ? "#9A3026"
            : "#806B5D";

}


/* =========================================
   WEBRTC STATUS
========================================= */

function setWebRTCStatus(
    message
){

    if(!webrtcStatus){

        return;

    }


    webrtcStatus.textContent =
        message || "";

}


/* =========================================
   PERMISSION STATUS
========================================= */

function setPermissionMessage(
    message
){

    if(!permissionMessage){

        return;

    }


    permissionMessage.textContent =
        message || "";

}


/* =========================================
   PROFILE IMAGE
========================================= */

function updateGoLiveProfile(){

    let profileImage =
        localStorage.getItem(
            "canvasProfilePicture"
        );


    /*
     * Support the older profile storage
     * used by Canvas.
     */

    if(!profileImage){

        profileImage =
            localStorage.getItem(
                "profilePicture"
            );

    }


    if(!profileImage){

        try{

            const savedProfile =
                JSON.parse(
                    localStorage.getItem(
                        "canvasProfile"
                    ) || "null"
                );


            if(savedProfile){

                profileImage =
                    savedProfile.profile_picture ||
                    savedProfile.profilePicture ||
                    savedProfile.photo ||
                    "";

            }

        }catch(error){

            console.warn(
                "Profile data read error:",
                error
            );

        }

    }


    const topIcon =
        document.getElementById(
            "topProfileIcon"
        );


    const bottomIcon =
        document.getElementById(
            "bottomProfileIcon"
        );


    if(profileImage){

        if(topIcon){

            topIcon.innerHTML =
                "";


            const image =
                document.createElement(
                    "img"
                );


            image.src =
                profileImage;


            image.alt =
                "Profile";


            topIcon.appendChild(
                image
            );

        }


        if(bottomIcon){

            bottomIcon.innerHTML =
                "";


            const image =
                document.createElement(
                    "img"
                );


            image.src =
                profileImage;


            image.alt =
                "Profile";


            bottomIcon.appendChild(
                image
            );

        }

    }

}


/* =========================================
   LOAD PROFILE FROM SERVER
========================================= */

async function loadGoLiveProfile(){

    const token =
        getAuthToken();


    if(!token){

        updateGoLiveProfile();

        return;

    }


    try{

        const response =
            await fetch(
                API_BASE +
                "/api/me",
                {

                    method:"GET",

                    headers:
                        authHeaders()

                }
            );


        if(!response.ok){

            updateGoLiveProfile();

            return;

        }


        const data =
            await response.json();


        const user =
            data.user ||
            data.data ||
            data;


        if(user){

            localStorage.setItem(
                "canvasCurrentUser",
                JSON.stringify(user)
            );

        }


        updateGoLiveProfile();


    }catch(error){

        console.warn(
            "Profile loading failed:",
            error.message
        );


        updateGoLiveProfile();

    }

}


/* =========================================
   AUTH CHECK
========================================= */

function requireCanvasLogin(){

    const token =
        getAuthToken();


    if(!token){

        setStatus(
            "Please log in before going live.",
            true
        );


        setPermissionMessage(
            "You need a Canvas account to start a live stream."
        );


        return false;

    }


    return true;

}


/* =========================================
   PAGE INITIALIZATION
========================================= */

updateGoLiveProfile();


loadGoLiveProfile();


/* =========================================
   CAMERA BUTTON TEXT
========================================= */

function updateCameraButton(){

    if(!cameraButton){

        return;

    }


    if(cameraEnabled){

        cameraButton.textContent =
            "Camera On";


        cameraButton.classList.add(
            "active"
        );

    }else{

        cameraButton.textContent =
            "Camera Off";


        cameraButton.classList.remove(
            "active"
        );

    }

}


/* =========================================
   MICROPHONE BUTTON TEXT
========================================= */

function updateMicButton(){

    if(!micButton){

        return;

    }


    if(microphoneEnabled){

        micButton.textContent =
            "Microphone On";


        micButton.classList.add(
            "active"
        );

    }else{

        micButton.textContent =
            "Microphone Off";


        micButton.classList.remove(
            "active"
        );

    }

}


/* =========================================
   INITIAL BUTTON STATE
========================================= */

updateCameraButton();

updateMicButton();

setStatus("");

setWebRTCStatus("");

setPermissionMessage("");
 /* =========================================
   CANVAS GO LIVE
   PART 3 — CAMERA + MICROPHONE
========================================= */


/* =========================================
   CAMERA CONSTRAINTS
========================================= */

function getVideoConstraints(){

    return {

        width:{
            min:640,
            ideal:1920,
            max:1920
        },

        height:{
            min:360,
            ideal:1080,
            max:1080
        },

        aspectRatio:{
            ideal:16 / 9
        },

        frameRate:{
            ideal:30,
            max:30
        },

        facingMode:{
            ideal:
                currentFacingMode
        }

    };

}


/* =========================================
   AUDIO CONSTRAINTS
========================================= */

function getAudioConstraints(){

    return {

        echoCancellation:{
            ideal:true
        },

        noiseSuppression:{
            ideal:true
        },

        autoGainControl:{
            ideal:true
        },

        channelCount:{
            ideal:2
        },

        sampleRate:{
            ideal:48000
        },

        sampleSize:{
            ideal:16
        }

    };

}


/* =========================================
   START CAMERA + MICROPHONE
========================================= */

async function startCameraAndMicrophone(){

    if(!navigator.mediaDevices ||
       !navigator.mediaDevices.getUserMedia){

        setPermissionMessage(
            "Camera and microphone are not supported by this browser."
        );

        return false;

    }


    try{

        setPermissionMessage(
            "Requesting camera and microphone access..."
        );


        const constraints = {

            video:
                getVideoConstraints(),

            audio:
                getAudioConstraints()

        };


        const stream =
            await navigator.mediaDevices
                .getUserMedia(
                    constraints
                );


        canvasStream =
            stream;


        /* =====================================
           VIDEO PREVIEW
        ====================================== */

        cameraPreview.srcObject =
            canvasStream;


        cameraPreview.muted =
            true;


        cameraPreview.autoplay =
            true;


        cameraPreview.playsInline =
            true;


        cameraPreview.style.display =
            "block";


        if(cameraMessage){

            cameraMessage.style.display =
                "none";

        }


        try{

            await cameraPreview.play();

        }catch(error){

            console.warn(
                "Camera preview play:",
                error.message
            );

        }


        /* =====================================
           TRACKS
        ====================================== */

        const videoTrack =
            canvasStream
                .getVideoTracks()[0];


        const audioTrack =
            canvasStream
                .getAudioTracks()[0];


        cameraEnabled =
            !!videoTrack;


        microphoneEnabled =
            !!audioTrack;


        if(videoTrack){

            videoTrack.enabled =
                true;

        }


        if(audioTrack){

            audioTrack.enabled =
                true;

        }


        /* =====================================
           CAMERA QUALITY OPTIMIZATION
        ====================================== */

        if(videoTrack){

            try{

                const capabilities =
                    videoTrack
                        .getCapabilities();


                const optimized = {};


                if(
                    capabilities.width
                ){

                    optimized.width = {

                        ideal:
                            Math.min(
                                1920,
                                capabilities
                                    .width.max
                            )

                    };

                }


                if(
                    capabilities.height
                ){

                    optimized.height = {

                        ideal:
                            Math.min(
                                1080,
                                capabilities
                                    .height.max
                            )

                    };

                }


                if(
                    capabilities.frameRate
                ){

                    optimized.frameRate = {

                        ideal:
                            Math.min(
                                30,
                                capabilities
                                    .frameRate.max
                            )

                    };

                }


                if(
                    Object.keys(
                        optimized
                    ).length
                ){

                    await videoTrack
                        .applyConstraints(
                            optimized
                        );

                }

            }catch(error){

                console.warn(
                    "Camera optimization skipped:",
                    error.message
                );

            }

        }


        /* =====================================
           MICROPHONE OPTIMIZATION
        ====================================== */

        if(audioTrack){

            try{

                const capabilities =
                    audioTrack
                        .getCapabilities();


                const audioOptimized = {};


                if(
                    "echoCancellation"
                    in capabilities
                ){

                    audioOptimized
                        .echoCancellation =
                            true;

                }


                if(
                    "noiseSuppression"
                    in capabilities
                ){

                    audioOptimized
                        .noiseSuppression =
                            true;

                }


                if(
                    "autoGainControl"
                    in capabilities
                ){

                    audioOptimized
                        .autoGainControl =
                            true;

                }


                if(
                    Object.keys(
                        audioOptimized
                    ).length
                ){

                    await audioTrack
                        .applyConstraints(
                            audioOptimized
                        );

                }

            }catch(error){

                console.warn(
                    "Microphone optimization skipped:",
                    error.message
                );

            }

        }


        updateCameraButton();

        updateMicButton();


        setPermissionMessage(
            "Camera and microphone are ready."
        );


        setWebRTCStatus(
            "Media ready."
        );


        /* =====================================
           SHOW REAL DEVICE SETTINGS
        ====================================== */

        console.log(
            "Canvas camera settings:",
            videoTrack
                ? videoTrack.getSettings()
                : null
        );


        console.log(
            "Canvas microphone settings:",
            audioTrack
                ? audioTrack.getSettings()
                : null
        );


        return true;


    }catch(error){

        console.error(
            "Canvas media error:",
            error
        );


        cameraEnabled =
            false;


        microphoneEnabled =
            false;


        updateCameraButton();

        updateMicButton();


        if(
            error.name ===
            "NotAllowedError"
        ){

            setPermissionMessage(
                "Camera or microphone permission was denied."
            );

        }else if(
            error.name ===
            "NotFoundError"
        ){

            setPermissionMessage(
                "Camera or microphone was not found."
            );

        }else if(
            error.name ===
            "NotReadableError"
        ){

            setPermissionMessage(
                "Camera or microphone is already being used."
            );

        }else{

            setPermissionMessage(
                "Unable to start camera and microphone."
            );

        }


        return false;

    }

}

   CAMERA ON / OFF
========================================= */

async function toggleCamera(){

    if(!canvasStream){

        const started =
            await startCameraAndMicrophone();


        if(!started){

            return;

        }

    }


    const videoTracks =
        canvasStream
            .getVideoTracks();


    if(!videoTracks.length){

        return;

    }


    cameraEnabled =
        !cameraEnabled;


    videoTracks.forEach(
        function(track){

            track.enabled =
                cameraEnabled;

        }
    );


    updateCameraButton();

}

   MICROPHONE ON / OFF
========================================= */

async function toggleMicrophone(){

    if(!canvasStream){

        const started =
            await startCameraAndMicrophone();


        if(!started){

            return;

        }

    }


    const audioTracks =
        canvasStream
            .getAudioTracks();


    if(!audioTracks.length){

    microphoneEnabled =
        !microphoneEnabled;


    audioTracks.forEach(
        function(track){

            track.enabled =
                microphoneEnabled;

        }
    );


    updateMicButton();

}


/* =========================================
   SWITCH FRONT / BACK CAMERA
========================================= */

async function switchCamera(){

    if(!canvasStream){

        const started =
            await startCameraAndMicrophone();


        if(!started){

            return;

        }

    }


    const oldVideoTracks =
        canvasStream
            .getVideoTracks();


    const oldVideoTrack =
        oldVideoTracks[0];


    if(!oldVideoTrack){

        return;

    }


    currentFacingMode =
        currentFacingMode === "user"
            ? "environment"
            : "user";


    try{

        const newStream =
            await navigator.mediaDevices
                .getUserMedia({

                    video:
                        getVideoConstraints(),

                    audio:false

                });


        const newVideoTrack =
            newStream
                .getVideoTracks()[0];


        if(!newVideoTrack){

            throw new Error(
                "No camera track returned."
            );

        }


        /*
         * Replace the old camera track
         * while keeping the microphone.
         */

        const audioTracks =
            canvasStream
                .getAudioTracks();


        oldVideoTracks.forEach(
            function(track){

                track.stop();

            }
        );


        canvasStream =
            new MediaStream();


        canvasStream.addTrack(
            newVideoTrack
        );


        audioTracks.forEach(
            function(track){

                canvasStream.addTrack(
                    track
                );

            }
        );


        cameraPreview.srcObject =
            canvasStream;


        cameraPreview.muted =
            true;


        cameraPreview.play()
            .catch(
                function(error){

                    console.warn(
                        "Camera switch preview:",
                        error.message
                    );

                }
            );


        cameraEnabled =
            true;


        updateCameraButton();


        setPermissionMessage(
            "Camera switched."
        );


        console.log(
            "Canvas switched to:",
            currentFacingMode
        );


    }catch(error){

        /*
         * If the requested camera does not
         * exist, restore the previous direction.
         */

        currentFacingMode =
            currentFacingMode === "user"
                ? "environment"
                : "user";


        console.error(
            "Camera switch failed:",
            error
        );


        setPermissionMessage(
            "Unable to switch camera."
        );

    }

}

            }

            ================================= */

            if(
                !file.type ||

                    "image/"
                )
            ){

                    true
                );


                thumbnailInput.value =
                    "";

            /* ================================

            ================================= */

                8 * 1024 * 1024;


            if(file.size > maxSize){

                setStatus(
                    "Thumbnail must be smaller than 8 MB.",
                    true
                );


                thumbnailInput.value =
                    "";


                return;

            }


            /* ================================
               READ IMAGE
            ================================= */

            const reader =
                new FileReader();


            reader.onload =
                function(){

                    selectedThumbnail =
                        reader.result;


                    if(thumbnailImage){

                        thumbnailImage.src =
                            selectedThumbnail;

                    }


                    if(thumbnailPreview){

                        thumbnailPreview.style.display =

                    }


                    if(choosePhotoButton){

                            "none";

                    }


                    setStatus(

                    );

                };


            reader.onerror =
                function(){

                    setStatus(
                        "Unable to read thumbnail.",
                        true
                    );

                };


            reader.readAsDataURL(
                file
            );

        }

/* =========================================
   CREATE STREAM ON CANVAS SERVER
========================================= */

async function createCanvasStream(){

    if(!requireCanvasLogin()){

        return false;

    }


    const payload =
        buildStreamPayload();


    if(!payload){

        return false;

    }


    try{

        setStatus(
            "Creating your live stream..."
        );


        const response =
            await fetch(
                API_BASE +
                "/api/streams",
                {

                    method:"POST",

                    headers:
                        authHeaders(),

                    body:
                        JSON.stringify(
                            payload
                        )

                }
            );


        let data =
            null;


        try{

            data =
                await response.json();

        }catch(error){

            data =
                null;

        }


        if(!response.ok){

            const message =
                data &&
                (
                    data.message ||
                    data.error
                );


            throw new Error(
                message ||
                "Unable to create stream."
            );

        }


        const stream =
            data &&
            (
                data.stream ||
                data.data ||
                data
            );


        if(!stream){

            throw new Error(
                "Server returned an invalid stream."
            );

        }


        currentStreamId =
            stream.id ||
            stream.stream_id ||
            stream.streamId ||
            null;


        if(!currentStreamId){

            throw new Error(
                "Stream ID was not returned by server."
            );

        }


        /*
         * Save the stream locally so Explore
         * and recovery logic can identify the
         * active Canvas stream.
         */

        try{

            localStorage.setItem(
                "canvasActiveStream",
                JSON.stringify({

                    id:
                        currentStreamId,

                    title:
                        payload.title,

                    category:
                        payload.category,

                    description:
                        payload.description,

                    thumbnail:
                        payload.thumbnail

                })
            );

        }catch(error){

            console.warn(
                "Active stream storage:",
                error.message
            );

        }


        return true;


    }catch(error){

        console.error(
            "Canvas stream creation:",
            error
        );


        setStatus(
            error.message ||
            "Unable to create stream.",
            true
        );


        return false;

    }

}


/* =========================================
   CONNECT SOCKET.IO
========================================= */

function connectCanvasSocket(){

    return new Promise(
        function(resolve){

            if(socket){

                if(socket.connected){

                    resolve(true);

                    return;

                }


                try{

                    socket.disconnect();

                }catch(error){

                    console.warn(
                        "Old socket cleanup:",
                        error.message
                    );

                }

            }


            setWebRTCStatus(
                "Connecting to live server..."
            );


            socket =
                io(
                    SOCKET_URL,
                    {

                        transports:[
                            "websocket",
                            "polling"
                        ],

                        reconnection:true,

                        reconnectionAttempts:
                            Infinity,

                        reconnectionDelay:
                            1000,

                        timeout:
                            10000

                    }
                );


            let settled =
                false;


            function finish(
                value
            ){

                if(settled){

                    return;

                }


                settled =
                    true;


                resolve(
                    value
                );

            }


            socket.on(
                "connect",
                function(){

                    console.log(
                        "Canvas Socket connected:",
                        socket.id
                    );


                    setWebRTCStatus(
                        "Connected to live server."
                    );


                    finish(true);

                }
            );


            socket.on(
                "connect_error",
                function(error){

                    console.error(
                        "Canvas Socket error:",
                        error
                    );


                    setWebRTCStatus(
                        "Unable to connect to live server."
                    );


                    finish(false);

                }
            );


            socket.on(
                "disconnect",
                function(reason){

                    console.warn(
                        "Canvas Socket disconnected:",
                        reason
                    );


                    if(isStreaming){

                        setWebRTCStatus(
                            "Live connection interrupted. Reconnecting..."
                        );

                    }

                }
            );


            socket.on(
                "reconnect",
                function(){

                    console.log(
                        "Canvas Socket reconnected."
                    );


                    if(
                        isStreaming &&
                        currentStreamId
                    ){

                        joinBroadcasterRoom();

                    }

                }
            );


            socket.on(
                "reconnect_attempt",
                function(){

                    if(isStreaming){

                        setWebRTCStatus(
                            "Reconnecting to live server..."
                        );

                    }

                }
            );


            /*
             * Give Socket.IO a short period to
             * establish the connection before
             * reporting failure.
             */

            setTimeout(
                function(){

                    if(!settled){

                        finish(
                            socket &&
                            socket.connected
                        );

                    }

                },
                12000
            );

        }
    );

}


/* =========================================
   JOIN BROADCASTER ROOM
========================================= */

function joinBroadcasterRoom(){

    if(
        !socket ||
        !socket.connected
    ){

        return false;

    }


    if(!currentStreamId){

        return false;

    }


    broadcasterRoom =
        "canvas-stream-" +
        String(
            currentStreamId
        );


    const payload = {

        streamId:
            currentStreamId,

        room:
            broadcasterRoom

    };


    /*
     * Different Canvas server versions can
     * use different event names. The primary
     * event is emitted first.
     */

    socket.emit(
        "broadcaster-join",
        payload
    );


    socket.emit(
        "join-broadcaster",
        payload
    );


    socket.emit(
        "join-stream",
        payload
    );


    console.log(
        "Canvas broadcaster room:",
        broadcasterRoom
    );


    setWebRTCStatus(
        "Waiting for viewers..."
    );


    return true;

}


/* =========================================
   BROADCASTER READY EVENTS
========================================= */

function announceBroadcasterReady(){

    if(
        !socket ||
        !socket.connected
    ){

        return;

    }


    if(!currentStreamId){

        return;

    }


    const payload = {

        streamId:
            currentStreamId,

        room:
            broadcasterRoom

    };


    socket.emit(
        "broadcaster-ready",
        payload
    );


    socket.emit(
        "stream-ready",
        payload
    );


    socket.emit(
        "webrtc-ready",
        payload
    );

}


/* =========================================
   START SOCKET + ROOM
========================================= */

async function prepareCanvasLiveConnection(){

    const connected =
        await connectCanvasSocket();


    if(!connected){

        return false;

    }


    const joined =
        joinBroadcasterRoom();


    if(!joined){

        return false;

    }


    announceBroadcasterReady();


    return true;

}


/* =========================================
   STREAM HEARTBEAT
========================================= */

function startStreamHeartbeat(){

    stopStreamHeartbeat();


    streamHeartbeat =
        setInterval(
            async function(){

                if(
                    !isStreaming ||
                    !currentStreamId
                ){

                    return;

                }


                try{

                    await fetch(
                        API_BASE +
                        "/api/streams/" +
                        encodeURIComponent(
                            currentStreamId
                        ) +
                        "/heartbeat",
                        {

                            method:"POST",

                            headers:
                                authHeaders()

                        }
                    );

                }catch(error){

                    console.warn(
                        "Stream heartbeat:",
                        error.message
                    );

                }

            },
            15000
        );

}


/* =========================================
   STOP HEARTBEAT
========================================= */

function stopStreamHeartbeat(){

    if(streamHeartbeat){

        clearInterval(
            streamHeartbeat
        );

    }


    streamHeartbeat =
        null;

}


/* =========================================
   STREAM ONLINE STATE
========================================= */

async function markCanvasStreamLive(){

    if(!currentStreamId){

        return false;

    }


    try{

        const response =
            await fetch(
                API_BASE +
                "/api/streams/" +
                encodeURIComponent(
                    currentStreamId
                ) +
                "/start",
                {

                    method:"POST",

                    headers:
                        authHeaders()

                }
            );


        if(
            response.ok
        ){

            return true;

        }


        /*
         * Some server versions mark the
         * stream live during POST /api/streams.
         * In that case we don't block Go Live.
         */

        console.warn(
            "Stream start endpoint returned:",
            response.status
        );


        return true;


    }catch(error){

        console.warn(
            "Stream live update:",
            error.message
        );


        return true;

    }

  }
  /* =========================================
   CANVAS GO LIVE
   PART 6 — WEBRTC + START STREAM
========================================= */


/* =========================================
   WEBRTC CONFIGURATION
========================================= */

const rtcConfiguration = {

    iceServers: [

        {
            urls:
                "stun:stun.l.google.com:19302"
        },

        {
            urls:
                "stun:stun1.l.google.com:19302"
        }

    ]

};


/* =========================================
   CREATE PEER CONNECTION
========================================= */

function createBroadcasterPeer(
    viewerId
){

    if(!viewerId){

        return null;

    }


    /*
     * Close an old connection for the
     * same viewer before creating another.
     */

    if(
        peerConnections[viewerId]
    ){

        try{

            peerConnections[
                viewerId
            ].close();

        }catch(error){

            console.warn(
                "Old peer cleanup:",
                error.message
            );

        }

    }


    const peer =
        new RTCPeerConnection(
            rtcConfiguration
        );


    peerConnections[
        viewerId
    ] =
        peer;


    /* =====================================
       ADD CAMERA + MICROPHONE
    ====================================== */

    if(canvasStream){

        canvasStream
            .getTracks()
            .forEach(
                function(track){

                    try{

                        peer.addTrack(
                            track,
                            canvasStream
                        );

                    }catch(error){

                        console.error(
                            "Track add error:",
                            error
                        );

                    }

                }
            );

    }


    /* =====================================
       ICE CANDIDATES
    ====================================== */

    peer.onicecandidate =
        function(event){

            if(
                !event.candidate ||
                !socket
            ){

                return;

            }


            socket.emit(
                "ice-candidate",
                {

                    streamId:
                        currentStreamId,

                    viewerId:
                        viewerId,

                    candidate:
                        event.candidate

                }
            );


            socket.emit(
                "broadcaster-ice-candidate",
                {

                    streamId:
                        currentStreamId,

                    viewerId:
                        viewerId,

                    candidate:
                        event.candidate

                }
            );

        };


    /* =====================================
       CONNECTION STATE
    ====================================== */

    peer.onconnectionstatechange =
        function(){

            console.log(
                "Viewer",
                viewerId,
                "connection:",
                peer.connectionState
            );


            if(
                peer.connectionState ===
                "failed" ||
                peer.connectionState ===
                "closed"
            ){

                removeBroadcasterPeer(
                    viewerId
                );

            }


            if(
                peer.connectionState ===
                "connected"
            ){

                setWebRTCStatus(
                    "Viewer connected."
                );

            }

        };


    peer.oniceconnectionstatechange =
        function(){

            if(
                peer.iceConnectionState ===
                "failed"
            ){

                console.warn(
                    "ICE connection failed:",
                    viewerId
                );

            }

        };


    return peer;

}


/* =========================================
   REMOVE VIEWER PEER
========================================= */

function removeBroadcasterPeer(
    viewerId
){

    if(
        !peerConnections[
            viewerId
        ]
    ){

        return;

    }


    try{

        peerConnections[
            viewerId
        ].close();

    }catch(error){

        console.warn(
            "Peer close:",
            error.message
        );

    }


    delete peerConnections[
        viewerId
    ];

}


/* =========================================
   SEND OFFER TO VIEWER
========================================= */

async function sendOfferToViewer(
    viewerId
){

    if(
        !socket ||
        !socket.connected ||
        !isStreaming
    ){

        return;

    }


    const peer =
        createBroadcasterPeer(
            viewerId
        );


    if(!peer){

        return;

    }


    try{

        const offer =
            await peer.createOffer({

                offerToReceiveAudio:
                    false,

                offerToReceiveVideo:
                    false

            });


        await peer.setLocalDescription(
            offer
        );


        const payload = {

            streamId:
                currentStreamId,

            viewerId:
                viewerId,

            offer:
                peer.localDescription

        };


        socket.emit(
            "offer",
            payload
        );


        socket.emit(
            "broadcaster-offer",
            payload
        );


    }catch(error){

        console.error(
            "Offer creation failed:",
            error
        );


        removeBroadcasterPeer(
            viewerId
        );

    }

}


/* =========================================
   VIEWER REQUESTS STREAM
========================================= */

function handleViewerJoined(
    data
){

    if(!data){

        return;

    }


    const viewerId =
        data.viewerId ||
        data.viewerID ||
        data.socketId ||
        data.id;


    if(!viewerId){

        return;

    }


    console.log(
        "Canvas viewer joined:",
        viewerId
    );


    sendOfferToViewer(
        viewerId
    );

}


/* =========================================
   RECEIVE ANSWER
========================================= */

async function handleViewerAnswer(
    data
){

    if(!data){

        return;

    }


    const viewerId =
        data.viewerId ||
        data.viewerID ||
        data.socketId ||
        data.id;


    const answer =
        data.answer ||
        data.description;


    if(
        !viewerId ||
        !answer
    ){

        return;

    }


    const peer =
        peerConnections[
            viewerId
        ];


    if(!peer){

        console.warn(
            "No peer for answer:",
            viewerId
        );


        return;

    }


    try{

        await peer.setRemoteDescription(
            new RTCSessionDescription(
                answer
            )
        );


        console.log(
            "Viewer answer accepted:",
            viewerId
        );


    }catch(error){

        console.error(
            "Answer error:",
            error
        );

    }

}


/* =========================================
   RECEIVE VIEWER ICE
========================================= */

async function handleViewerIce(
    data
){

    if(!data){

        return;

    }


    const viewerId =
        data.viewerId ||
        data.viewerID ||
        data.socketId ||
        data.id;


    const candidate =
        data.candidate;


    if(
        !viewerId ||
        !candidate
    ){

        return;

    }


    const peer =
        peerConnections[
            viewerId
        ];


    if(!peer){

        return;

    }


    try{

        await peer.addIceCandidate(
            new RTCIceCandidate(
                candidate
            )
        );

    }catch(error){

        console.warn(
            "Viewer ICE error:",
            error.message
        );

    }

}


/* =========================================
   SOCKET WEBRTC EVENTS
========================================= */

function registerWebRTCEvents(){

    if(!socket){

        return;

    }


    socket.on(
        "viewer-joined",
        handleViewerJoined
    );


    socket.on(
        "viewer-join",
        handleViewerJoined
    );


    socket.on(
        "new-viewer",
        handleViewerJoined
    );


    socket.on(
        "viewer-connected",
        handleViewerJoined
    );


    socket.on(
        "answer",
        handleViewerAnswer
    );


    socket.on(
        "viewer-answer",
        handleViewerAnswer
    );


    socket.on(
        "ice-candidate",
        function(data){

            /*
             * Only process candidates that
             * belong to a viewer.
             */

            if(
                data &&
                (
                    data.viewerId ||
                    data.viewerID
                )
            ){

                handleViewerIce(
                    data
                );

            }

        }
    );


    socket.on(
        "viewer-ice-candidate",
        handleViewerIce
    );


    socket.on(
        "viewer-left",
        function(data){

            if(!data){

                return;

            }


            const viewerId =
                data.viewerId ||
                data.viewerID ||
                data.socketId ||
                data.id;


            if(viewerId){

                removeBroadcasterPeer(
                    viewerId
                );

            }

        }
    );

}


/* =========================================
   START STREAMING
========================================= */

async function startCanvasStreaming(){

    if(isStreaming){

        return;

    }


    if(!requireCanvasLogin()){

        return;

    }


    const title =
        getStreamTitle();


    if(!title){

        setStatus(
            "Please enter a stream title.",
            true
        );


        return;

    }


    setStartingState();


    try{

        /* =================================
           START MEDIA
        ================================= */

        if(!canvasStream){

            const mediaReady =
                await startCameraAndMicrophone();


            if(!mediaReady){

                throw new Error(
                    "Camera and microphone could not be started."
                );

            }

        }


        /* =================================
           CREATE DATABASE STREAM
        ================================= */

        const created =
            await createCanvasStream();


        if(!created){

            throw new Error(
                "Unable to create stream."
            );

        }


        /* =================================
           CONNECT SOCKET
        ================================= */

        const socketReady =
            await prepareCanvasLiveConnection();


        if(!socketReady){

            throw new Error(
                "Unable to connect to live server."
            );

        }


        /* =================================
           REGISTER WEBRTC EVENTS
        ================================= */

        registerWebRTCEvents();


        /* =================================
           MARK STREAM LIVE
        ================================= */

        await markCanvasStreamLive();


        /* =================================
           UPDATE STATE
        ================================= */

        isStreaming =
            true;


        setStreamingState();

        disableStreamForm();


        startStreamHeartbeat();


        announceBroadcasterReady();


        setStatus(
            "🔴 You are live!"
        );


        setWebRTCStatus(
            "Live • Waiting for viewers..."
        );


        console.log(
            "Canvas stream started:",
            currentStreamId
        );


    }catch(error){

        console.error(
            "Canvas Start Streaming:",
            error
        );


        isStreaming =
            false;


        setNotStreamingState();

        enableStreamForm();


        stopStreamHeartbeat();


        setStatus(
            error.message ||
            "Unable to start streaming.",
            true
        );


        /*
         * If stream creation succeeded but
         * connection failed, clean it up.
         */

        if(currentStreamId){

            try{

                await endCanvasStreamOnServer();

            }catch(cleanupError){

                console.warn(
                    "Start failure cleanup:",
                    cleanupError.message
                );

            }

        }

    }

}


/* =========================================
   START BUTTON EVENT
========================================= */

if(startStreamingButton){

    startStreamingButton.addEventListener(
        "click",
        function(){

            startCanvasStreaming();

        }
    );

  }
 /* =========================================
   CANVAS GO LIVE
   PART 7 — END STREAM + CLEANUP + END
========================================= */


/* =========================================
   END STREAM ON SERVER
========================================= */

async function endCanvasStreamOnServer(){

    if(!currentStreamId){

        return true;

    }


    const streamId =
        currentStreamId;


    try{

        const response =
            await fetch(
                API_BASE +
                "/api/streams/" +
                encodeURIComponent(
                    streamId
                ) +
                "/end",
                {

                    method:"POST",

                    headers:
                        authHeaders()

                }
            );


        if(!response.ok){

            console.warn(
                "End stream response:",
                response.status
            );

        }


    }catch(error){

        console.error(
            "End stream request failed:",
            error
        );

    }


    return true;

}


/* =========================================
   CLOSE ALL WEBRTC CONNECTIONS
========================================= */

function closeAllPeerConnections(){

    Object.keys(
        peerConnections
    ).forEach(
        function(viewerId){

            try{

                peerConnections[
                    viewerId
                ].close();

            }catch(error){

                console.warn(
                    "Peer cleanup:",
                    error.message
                );

            }

            delete peerConnections[
                viewerId
            ];

        }
    );

}


/* =========================================
   DISCONNECT SOCKET
========================================= */

function disconnectCanvasSocket(){

    if(!socket){

        return;

    }


    try{

        socket.emit(
            "broadcaster-left",
            {

                streamId:
                    currentStreamId,

                room:
                    broadcasterRoom

            }
        );

    }catch(error){

        console.warn(
            "Broadcaster leave:",
            error.message
        );

    }


    try{

        socket.emit(
            "leave-stream",
            {

                streamId:
                    currentStreamId,

                room:
                    broadcasterRoom

            }
        );

    }catch(error){

        console.warn(
            "Leave stream:",
            error.message
        );

    }


    try{

        socket.disconnect();

    }catch(error){

        console.warn(
            "Socket disconnect:",
            error.message
        );

    }


    socket =
        null;


    broadcasterRoom =
        null;

}


/* =========================================
   END CANVAS STREAM
========================================= */

async function endCanvasStreaming(){

    if(
        !isStreaming &&
        !currentStreamId
    ){

        return;

    }


    if(stopStreamingButton){

        stopStreamingButton.disabled =
            true;

        stopStreamingButton.textContent =
            "⏳ Ending...";

    }


    setStatus(
        "Ending your stream..."
    );


    const streamId =
        currentStreamId;


    try{

        isStreaming =
            false;


        stopStreamHeartbeat();


        /* ================================
           TELL SERVER
        ================================= */

        if(streamId){

            await endCanvasStreamOnServer();

        }


        /* ================================
           CLOSE VIEWERS
        ================================= */

        closeAllPeerConnections();


        /* ================================
           SOCKET
        ================================= */

        disconnectCanvasSocket();


        /* ================================
           CAMERA + MIC
        ================================= */

        stopCameraAndMicrophone();


        /* ================================
           CLEAR ACTIVE STREAM
        ================================= */

        try{

            const saved =
                localStorage.getItem(
                    "canvasActiveStream"
                );


            if(saved){

                const active =
                    JSON.parse(
                        saved
                    );


                if(
                    !streamId ||
                    String(
                        active.id
                    ) === String(
                        streamId
                    )
                ){

                    localStorage.removeItem(
                        "canvasActiveStream"
                    );

                }

            }

        }catch(error){

            localStorage.removeItem(
                "canvasActiveStream"
            );

        }


        /* ================================
           RESET STATE
        ================================= */

        currentStreamId =
            null;


        broadcasterRoom =
            null;


        setNotStreamingState();

        enableStreamForm();


        setWebRTCStatus(
            ""
        );


        setPermissionMessage(
            ""
        );


        setStatus(
            "Stream ended successfully."
        );


        /*
         * Give the user a moment to see the
         * confirmation before clearing the
         * form.
         */

        setTimeout(
            function(){

                if(!isStreaming){

                    clearStreamForm();

                }

            },
            1200
        );


    }catch(error){

        console.error(
            "Canvas end stream:",
            error
        );


        setNotStreamingState();

        enableStreamForm();


        setStatus(
            "Stream ended.",
            false
        );

    }

}


/* =========================================
   END STREAM BUTTON
========================================= */

if(stopStreamingButton){

    stopStreamingButton.addEventListener(
        "click",
        function(){

            if(
                !isStreaming &&
                !currentStreamId
            ){

                return;

            }


            endCanvasStreaming();

        }
    );

}


/* =========================================
   BEFORE PAGE CLOSE
========================================= */

window.addEventListener(
    "beforeunload",
    function(){

        /*
         * Stop local media immediately.
         */

        stopStreamHeartbeat();


        closeAllPeerConnections();


        if(canvasStream){

            canvasStream
                .getTracks()
                .forEach(
                    function(track){

                        track.stop();

                    }
                );

        }


        /*
         * Tell Socket.IO that the
         * broadcaster disappeared.
         */

        if(
            socket &&
            socket.connected
        ){

            try{

                socket.emit(
                    "broadcaster-left",
                    {

                        streamId:
                            currentStreamId,

                        room:
                            broadcasterRoom

                    }
                );

            }catch(error){

                console.warn(
                    "Unload socket:",
                    error.message
                );

            }

        }

    }
);


/* =========================================
   PAGE VISIBILITY
========================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.visibilityState ===
            "visible"
        ){

            if(
                isStreaming &&
                socket &&
                !socket.connected
            ){

                socket.connect();

            }

        }

    }
);


/* =========================================
   HANDLE CAMERA DEVICE CHANGES
========================================= */

if(
    navigator.mediaDevices &&
    navigator.mediaDevices.addEventListener
){

    navigator.mediaDevices.addEventListener(
        "devicechange",
        async function(){

            if(!canvasStream){

                return;

            }


            try{

                const devices =
                    await navigator.mediaDevices
                        .enumerateDevices();


                const cameras =
                    devices.filter(
                        function(device){

                            return (
                                device.kind ===
                                "videoinput"
                            );

                        }
                    );


                const microphones =
                    devices.filter(
                        function(device){

                            return (
                                device.kind ===
                                "audioinput"
                            );

                        }
                    );


                console.log(
                    "Canvas cameras:",
                    cameras.length
                );


                console.log(
                    "Canvas microphones:",
                    microphones.length
                );


            }catch(error){

                console.warn(
                    "Device check:",
                    error.message
                );

            }

        }
    );

}


/* =========================================
   INITIAL PAGE STATE
========================================= */

setNotStreamingState();

updateCameraButton();

updateMicButton();


/* =========================================
   FINAL CONSOLE MESSAGE
========================================= */

console.log(
    "Canvas Go Live initialized."
);
