<html lang="en">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%}
body{
 background:#fff;color:#4b3326;
 font-family:Arial,Helvetica,sans-serif;
 padding-bottom:82px
}
.navbar{
 width:100%;height:70px;display:flex;
 align-items:center;justify-content:space-between;
 padding:0 20px;background:#fff;
 border-bottom:2px solid #d4a62a;

}
.logo{font-size:32px;font-weight:800;color:#4b3326}
.top-icons{display:flex;align-items:center;gap:10px}

#topProfileIcon{
 width:40px;height:40px;display:flex;
 align-items:center;justify-content:center;
 overflow:hidden;border-radius:50%;
 border:2px solid #d4a62a;background:#f3f3f3;
 color:#4b3326;font-size:20px;text-decoration:none
}
#topProfileIcon img{
 width:100%;height:100%;object-fit:cover;display:block
}

.search-button{
 width:40px;height:40px;display:flex;
 align-items:center;justify-content:center;
 border:1px solid rgba(75,51,38,.18);
 border-radius:13px;background:#fff;color:#4b3326;
 cursor:pointer;box-shadow:0 3px 10px rgba(75,51,38,.07);
 transition:.2s ease
}
.search-button:hover{border-color:#d4a62a}
.search-button:active{transform:scale(.94)}

.search-panel{
 display:none;position:fixed;top:82px;left:50%;
 transform:translateX(-50%);width:calc(100% - 28px);
 max-width:600px;padding:16px;background:#fff;
 border:1px solid rgba(75,51,38,.15);border-radius:18px;
 box-shadow:0 15px 40px rgba(75,51,38,.15);z-index:2000
}
.search-panel.active{display:block}
.search-row{width:100%;display:flex;gap:9px}
.search-input{
 flex:1;min-width:0;padding:13px 14px;
 border:2px solid #d8c7bb;border-radius:13px;
 outline:none;background:#fff;color:#4b3326;font-size:16px
}
.search-input:focus{border-color:#d4a62a}
.search-submit{
 width:48px;min-width:48px;display:flex;
 align-items:center;justify-content:center;border:0;
 border-radius:13px;background:#4b3326;color:#fff;cursor:pointer
}
.search-result{
 margin-top:12px;color:#6a574c;font-size:14px;line-height:1.5
}

.container{
 width:100%;max-width:820px;margin:0 auto;
 padding:24px 18px 30px
}
.page-title{text-align:center;margin-bottom:22px}
.page-title h1{
 margin:0 0 6px;font-size:34px;line-height:1.15;
 font-weight:800;color:#4b3326
}
.page-title p{
 margin:0;color:#6a574c;font-size:15px;line-height:1.5
}
#creatorName{
 margin-top:4px;color:#4b3326;font-size:14px;font-weight:700
}

.camera-section{width:100%;margin:0 auto 18px}
.camera-box{
 width:100%;height:400px;background:#251b17;
 border-radius:22px;overflow:hidden;display:flex;
 align-items:center;justify-content:center;
 box-shadow:0 8px 25px rgba(75,51,38,.12);
 position:relative
}
#cameraPreview{
 width:100%;height:100%;object-fit:cover;
 display:none;border-radius:22px;background:#000
}
#cameraMessage{
 color:#fff;font-size:18px;font-weight:700;
 text-align:center;padding:20px
}

.camera-controls{
 width:100%;display:grid;
 grid-template-columns:1fr 1fr 1fr;
 gap:10px;margin:0 auto 14px
}
.camera-controls button{
 width:100%;min-height:54px;padding:12px 8px;
 border:2px solid #d8c7bb;border-radius:14px;
 background:#fff;color:#4b3326;font-size:14px;
 font-weight:700;cursor:pointer;transition:.2s ease
}
.camera-controls button.active{
 background:#4b3326;color:#fff;border-color:#4b3326
}
.camera-controls button:active{transform:scale(.98)}

#permissionMessage{
 min-height:18px;margin:0 0 14px;color:#a33a2b;
 text-align:center;font-size:13px;line-height:1.4
}

.stream-form{
 width:100%;padding:20px;background:#fff;
 border:1px solid #eadfd8;border-radius:20px;
 box-shadow:0 5px 20px rgba(75,51,38,.07)
}
.stream-form label{
 display:block;margin:0 0 7px;color:#4b3326;

}
.stream-form input,.stream-form select,.stream-form textarea{
 width:100%;display:block;margin:0 0 16px;
 padding:13px 14px;border:2px solid #d8c7bb;
 border-radius:13px;background:#fff;color:#4b3326;
 font-family:Arial,Helvetica,sans-serif;font-size:15px;

}
.stream-form input:focus,.stream-form select:focus,
.stream-form textarea:focus{
 border-color:#d4a62a;
 box-shadow:0 0 0 3px rgba(212,166,42,.10)
}
.stream-form textarea{min-height:105px;resize:vertical}

.thumbnail-upload{width:100%;margin-bottom:10px}
.choose-photo-btn{
 width:100%;min-height:56px;padding:13px 15px;
 border:2px solid #d8c7bb;border-radius:14px;
 background:#fff;color:#4b3326;font-size:15px;
 font-weight:800;text-align:center;cursor:pointer;transition:.2s ease
}
.choose-photo-btn:hover{
 border-color:#d4a62a;background:#fffdf7
}
.choose-photo-btn:active{transform:scale(.98)}
#thumbnailInput{display:none!important}
.thumbnail-preview{
 width:100%;margin:10px 0 16px;overflow:hidden;
 border:2px solid #d8c7bb;border-radius:14px;background:#251b17
}
.thumbnail-preview img{
 width:100%;display:block;aspect-ratio:16/9;object-fit:cover
}

.stream-status{
 min-height:22px;margin:4px 0 8px;color:#4b3326;
 text-align:center;font-size:14px;font-weight:700;line-height:1.4
}
.webrtc-status{
 min-height:18px;margin:0 0 12px;color:#6a574c;
 text-align:center;font-size:12px;font-weight:600
}
.start-btn,.stop-btn{
 width:100%;min-height:56px;padding:13px 16px;
 border:0;border-radius:14px;font-size:16px;
 font-weight:800;cursor:pointer;transition:.2s ease
}
.start-btn{background:#4b3326;color:#fff}
.stop-btn{margin-top:9px;background:#a33a2b;color:#fff}
.start-btn:active,.stop-btn:active{transform:scale(.98)}
.hidden{display:none!important}
  .bottom-nav{
 position:fixed;left:0;bottom:0;width:100%;height:70px;
 display:flex;align-items:center;justify-content:space-around;
 padding:5px 7px;background:#fff;
 border-top:2px solid #d4a62a;
 box-shadow:0 -5px 20px rgba(75,51,38,.08);
 z-index:1500
}
.bottom-nav a{
 flex:1;min-width:0;height:58px;display:flex;
 flex-direction:column;align-items:center;justify-content:center;
 gap:2px;border-radius:12px;color:#4b3326;
 text-decoration:none;font-size:23px
}
.bottom-nav a span{font-size:10px;font-weight:700}
.bottom-nav a.active{color:#d4a62a}
#bottomProfileIcon img{
 width:25px;height:25px;object-fit:cover;
 display:block;border-radius:50%;border:1.5px solid #d4a62a
}

@media(max-width:600px){
 .navbar{height:66px;padding:0 15px}
 .logo{font-size:29px}
 .container{padding:20px 14px 25px}
 .page-title{margin-bottom:18px}
 .page-title h1{font-size:30px}
 .camera-box{
  height:360px;min-height:360px;border-radius:17px
 }
 .camera-controls{gap:7px}
 .camera-controls button{
  min-height:52px;font-size:13px;padding:10px 5px
 }
 .stream-form{padding:16px;border-radius:17px}
}
@media(max-width:360px){
 .logo{font-size:26px}
 .search-button,#topProfileIcon{width:37px;height:37px}
 .camera-box{height:330px;min-height:330px}
 .camera-controls button{font-size:12px}
}

<script>
const CANVAS_API="https://canvas-kh9p.onrender.com";

let socket=null;
let socketConnected=false;

function getAuthToken(){
 return localStorage.getItem("canvasAuthToken")||"";
}

let savedProfile={};

function loadSavedProfile(){
 try{
  const data=localStorage.getItem("canvasProfile");
  savedProfile=data?JSON.parse(data)||{}:{};
 }catch(error){
  console.error("Profile load failed:",error);
  savedProfile={};
 }
}

function getProfilePhoto(){
 return savedProfile.photo||
 savedProfile.profileImage||
 savedProfile.profilePhoto||
 savedProfile.image||
 savedProfile.profile_picture||"";
}

function escapeHtml(value){
 const div=document.createElement("div");
 div.textContent=String(value||"");
 return div.innerHTML;
}

function updateCreatorName(){
 const element=document.getElementById("creatorName");
 if(!element)return;
 const name=savedProfile.name||savedProfile.username||"";
 element.textContent=name?"Streaming as "+name:"";
}

function updateProfileIcons(){
 const photo=getProfilePhoto();
 const top=document.getElementById("topProfileIcon");
 const bottom=document.getElementById("bottomProfileIcon");

 if(top){
  top.innerHTML=photo?
   '<img src="'+escapeHtml(photo)+'" alt="Profile">':"⬤";
 }

 if(bottom){
  bottom.innerHTML=photo?
   '<img src="'+escapeHtml(photo)+'" alt="Profile"><span>Profile</span>':
   '⬤<span>Profile</span>';
 }
  }
 const choosePhotoButton=document.getElementById("choosePhotoButton");
const thumbnailInput=document.getElementById("thumbnailInput");
const thumbnailPreview=document.getElementById("thumbnailPreview");
const thumbnailImage=document.getElementById("thumbnailImage");

if(choosePhotoButton){
 choosePhotoButton.addEventListener("click",function(){
  if(thumbnailInput)thumbnailInput.click();
 });
}

if(thumbnailInput){
 thumbnailInput.addEventListener("change",function(){

  const file=thumbnailInput.files&&thumbnailInput.files[0];

  if(!file){
   thumbnailPreview.style.display="none";
   thumbnailImage.src="";
   return;
  }

  if(!file.type||!file.type.startsWith("image/")){
   thumbnailInput.value="";
   thumbnailPreview.style.display="none";
   thumbnailImage.src="";
   streamStatus.textContent="Please choose an image file.";
   return;
  }

  if(file.size>8*1024*1024){
   thumbnailInput.value="";
   thumbnailPreview.style.display="none";
   thumbnailImage.src="";
   streamStatus.textContent="Thumbnail must be smaller than 8 MB.";
   return;
  }

  const reader=new FileReader();

  reader.onload=function(event){
   thumbnailImage.src=event.target.result;
   thumbnailPreview.style.display="block";
   choosePhotoButton.textContent="📷 Change photo";
  };

  reader.onerror=function(){
   thumbnailInput.value="";
   thumbnailPreview.style.display="none";
   thumbnailImage.src="";
  };

  reader.readAsDataURL(file);
 });
}

const searchButton=document.getElementById("searchButton");
const searchPanel=document.getElementById("searchPanel");
const searchInput=document.getElementById("searchInput");
const searchSubmit=document.getElementById("searchSubmit");
const searchResult=document.getElementById("searchResult");

if(searchButton){
 searchButton.addEventListener("click",function(event){
  event.preventDefault();
  event.stopPropagation();

  if(!searchPanel)return;

  searchPanel.classList.toggle("active");

  if(searchPanel.classList.contains("active")){
   setTimeout(function(){
    if(searchInput)searchInput.focus();
   },80);
  }
 });
}

async function performSearch(){

 if(!searchInput||!searchResult)return;

 const term=searchInput.value.trim();

 if(!term){
  searchResult.textContent="Please enter something to search.";
  return;
 }

 searchResult.textContent="Searching Canvas...";

 try{

  const response=await fetch(
   CANVAS_API+"/api/streams/live"
  );

  let data={};

  try{
   data=await response.json();
  }catch(error){
   data={};
  }

  if(!response.ok){
   throw new Error(
    data.message||data.error||"Search failed."
   );
  }

  const streams=Array.isArray(data.streams)?data.streams:[];
  const searchText=term.toLowerCase();

  const found=streams.filter(function(stream){

   const text=[
    stream.title,
    stream.name,
    stream.username,
    stream.category,
    stream.description
   ].map(function(value){
    return String(value||"");
   }).join(" ").toLowerCase();

   return text.includes(searchText);
  });

  if(found.length){

   const stream=found[0];

   const title=escapeHtml(
    stream.title||"Untitled stream"
   );

   const creator=escapeHtml(
    stream.name||
    stream.username||
    "Canvas Creator"
   );

   searchResult.innerHTML=
    "<strong>🔴 Live stream found</strong><br>"+
    title+"<br>by "+creator;

  }else{

   searchResult.textContent=
    'No live results found for "'+term+'".';

  }

 }catch(error){

  console.error("Canvas search failed:",error);

  searchResult.textContent=
   "Unable to search Canvas right now.";

 }
}

if(searchSubmit){
 searchSubmit.addEventListener("click",function(event){
  event.preventDefault();
  performSearch();
 });
}

if(searchInput){
 searchInput.addEventListener("keydown",function(event){
  if(event.key==="Enter"){
   event.preventDefault();
   performSearch();
  }
 });
}

document.addEventListener("click",function(event){

 if(
  searchPanel&&
  searchButton&&
  searchPanel.classList.contains("active")&&
  !searchPanel.contains(event.target)&&
  !searchButton.contains(event.target)
 ){
  searchPanel.classList.remove("active");
 }
});


function connectSocket(){

 if(socket&&(socket.connected||socket.connecting))return;

 socket=io(CANVAS_API,{
  transports:["websocket","polling"],
  reconnection:true,
  reconnectionAttempts:5,
  timeout:10000
 });

 socket.on("connect",function(){

  socketConnected=true;

  console.log(
   "Canvas Socket.IO connected:",
   socket.id
  );

  if(webrtcStatus){
   webrtcStatus.textContent="Canvas connection ready.";
  }

 });

 socket.on("disconnect",function(){

  socketConnected=false;

  console.log(
   "Canvas Socket.IO disconnected."
  );

  if(isStreaming){
   webrtcStatus.textContent=
    "Canvas connection interrupted.";
  }

 });

 socket.on("connect_error",function(error){

  socketConnected=false;

  console.error(
   "Canvas Socket.IO error:",
   error
  );

  if(isStreaming){
   webrtcStatus.textContent=
    "Unable to connect to Canvas streaming server.";
  }

 });
 socket.on("existing-peers",async function(peers){

  if(!isStreaming||!Array.isArray(peers))return;

  for(const peerId of peers){
   try{
    await createOfferForPeer(peerId);
   }catch(error){
    console.error("Offer creation failed:",error);
   }
  }
 });

 socket.on("peer-joined",function(data){

  if(
   !data||
   !isStreaming||
   !data.socketId
  )return;

  if(
   data.role==="viewer"||
   data.role===undefined
  ){
   createOfferForPeer(data.socketId);
  }
 });

 socket.on("webrtc-offer",async function(data){

  if(!data||!data.sender||!data.offer)return;

  const sender=data.sender;

  try{

   const pc=await getPeerConnection(sender);

   await pc.setRemoteDescription(
    new RTCSessionDescription(data.offer)
   );

   const answer=await pc.createAnswer();

   await pc.setLocalDescription(answer);

   socket.emit("webrtc-answer",{
    target:sender,
    answer:pc.localDescription
   });

   await flushPendingIce(sender);

  }catch(error){

   console.error(
    "WebRTC offer failed:",
    error
   );

  }
 });

 socket.on("webrtc-answer",async function(data){

  if(!data||!data.sender||!data.answer)return;

  const pc=peerConnections[data.sender];

  if(!pc)return;

  try{

   await pc.setRemoteDescription(
    new RTCSessionDescription(data.answer)
   );

   await flushPendingIce(data.sender);

  }catch(error){

   console.error(
    "WebRTC answer failed:",
    error
   );

  }
 });

 socket.on("webrtc-ice",async function(data){

  if(!data||!data.sender||!data.candidate)return;

  const sender=data.sender;
  const candidate=data.candidate;
  const pc=peerConnections[sender];

  if(!pc||!pc.remoteDescription){

   if(!pendingIceCandidates[sender]){
    pendingIceCandidates[sender]=[];
   }

   pendingIceCandidates[sender].push(candidate);
   return;
  }

  try{

   await pc.addIceCandidate(
    new RTCIceCandidate(candidate)
   );

  }catch(error){

   console.error(
    "ICE candidate failed:",
    error
   );

  }
 });

 socket.on("peer-left",function(data){

  if(!data||!data.socketId)return;

  closePeerConnection(data.socketId);

 });
}


/* =========================================
   MEDIA STATE
========================================= */

let canvasStream=null;
let isStreaming=false;
let cameraEnabled=false;
let microphoneEnabled=false;
let currentFacingMode="user";
let currentCameraDeviceId="";
let currentStreamId=null;
let currentBackendStream=null;
let peerConnections={};
let pendingIceCandidates={};


/* =========================================
   DOM ELEMENTS
========================================= */

const cameraPreview=
 document.getElementById("cameraPreview");

const cameraMessage=
 document.getElementById("cameraMessage");

const permissionMessage=
 document.getElementById("permissionMessage");

const cameraButton=
 document.getElementById("cameraButton");

const switchCameraButton=
 document.getElementById("switchCameraButton");

const micButton=
 document.getElementById("micButton");

const webrtcStatus=
 document.getElementById("webrtcStatus");


/* =========================================
   WEBRTC
========================================= */

const rtcConfiguration={
 iceServers:[
  {urls:"stun:stun.l.google.com:19302"},
  {urls:"stun:stun1.l.google.com:19302"}
 ]
};


function getCameraConstraints(facingMode,deviceId){

 const video={
  width:{ideal:1920,min:640},
  height:{ideal:1080,min:360},
  frameRate:{ideal:30,min:24,max:30}
 };

 if(deviceId){

  video.deviceId={exact:deviceId};

 }else{

  video.facingMode={ideal:facingMode};

 }

 return video;
}


function getAudioConstraints(){

 return{
  echoCancellation:true,
  noiseSuppression:true,
  autoGainControl:true,
  channelCount:{ideal:2},
  sampleRate:{ideal:48000}
 };
                               }
async function getPeerConnection(peerId){

 if(peerConnections[peerId]){
  return peerConnections[peerId];
 }

 const pc=new RTCPeerConnection(rtcConfiguration);

 peerConnections[peerId]=pc;

 pendingIceCandidates[peerId]=
  pendingIceCandidates[peerId]||[];

 if(canvasStream){

  canvasStream.getTracks().forEach(function(track){

   try{
    pc.addTrack(track,canvasStream);
   }catch(error){
    console.error(
     "Could not add media track:",
     error
    );
   }

  });

 }

 pc.onicecandidate=function(event){

  if(
   event.candidate&&
   socket&&
   socket.connected
  ){

   socket.emit("webrtc-ice",{
    target:peerId,
    candidate:event.candidate
   });

  }
 };

 pc.onconnectionstatechange=function(){

  console.log(
   "Canvas WebRTC:",
   peerId,
   pc.connectionState
  );

  if(pc.connectionState==="connected"){

   if(webrtcStatus){
    webrtcStatus.textContent=
     "🔴 Streaming connection active.";
   }

  }

  if(pc.connectionState==="failed"){
   closePeerConnection(peerId);
  }

 };

 return pc;
}


async function createOfferForPeer(peerId){

 if(
  !socket||
  !socket.connected||
  !peerId||
  !canvasStream
 )return;

 try{

  const pc=await getPeerConnection(peerId);

  if(pc.signalingState!=="stable")return;

  const offer=await pc.createOffer();

  await pc.setLocalDescription(offer);

  socket.emit("webrtc-offer",{
   target:peerId,
   offer:pc.localDescription
  });

 }catch(error){

  console.error(
   "Canvas offer failed:",
   error
  );

 }
}


async function flushPendingIce(peerId){

 const pc=peerConnections[peerId];

 if(!pc||!pc.remoteDescription)return;

 const candidates=
  pendingIceCandidates[peerId]||[];

 if(!candidates.length)return;

 pendingIceCandidates[peerId]=[];

 for(const candidate of candidates){

  try{

   await pc.addIceCandidate(
    new RTCIceCandidate(candidate)
   );

  }catch(error){

   console.error(
    "Pending ICE failed:",
    error
   );

  }

 }
}


function closePeerConnection(peerId){

 const pc=peerConnections[peerId];

 if(pc){

  try{
   pc.close();
  }catch(error){
   console.error(
    "Peer close error:",
    error
   );
  }

 }

 delete peerConnections[peerId];
 delete pendingIceCandidates[peerId];
}


function closeAllPeerConnections(){

 Object.keys(peerConnections).forEach(function(peerId){
  closePeerConnection(peerId);
 });

 peerConnections={};
 pendingIceCandidates={};
}


function stopCurrentMediaTracks(){

 if(!canvasStream)return;

 canvasStream.getTracks().forEach(function(track){

  try{
   track.stop();
  }catch(error){
   console.error(
    "Track stop error:",
    error
   );
  }

 });
}


async function replaceVideoTrackForPeers(newVideoTrack){

 const peerIds=Object.keys(peerConnections);

 for(const peerId of peerIds){

  const pc=peerConnections[peerId];

  if(!pc)continue;

  const sender=pc.getSenders().find(function(item){

   return(
    item.track&&
    item.track.kind==="video"
   );

  });

  if(sender){

   try{

    await sender.replaceTrack(newVideoTrack);

   }catch(error){

    console.error(
     "Video track replacement failed:",
     error
    );

   }

  }

 }
}


async function updateCameraPreview(){

 if(!cameraPreview)return;

 }else{

/* =========================================
   DEVICE CAMERA FINDER
========================================= */

async function getVideoDevices(){

 if(
  !navigator.mediaDevices||
  !navigator.mediaDevices.enumerateDevices
 ){
  return[];
 }

 try{

  const devices=
   await navigator.mediaDevices.enumerateDevices();

  return devices.filter(function(device){
   return device.kind==="videoinput";
  });

 }catch(error){

  console.error(
   "Camera enumeration failed:",
   error
  );

  return[];
 }
}


async function findOtherCamera(){

 const devices=await getVideoDevices();

 if(devices.length<2){
  return null;
 }

 let currentIndex=-1;

 if(currentCameraDeviceId){

  currentIndex=devices.findIndex(function(device){
   return device.deviceId===currentCameraDeviceId;
  });

 }

 if(currentIndex<0){

  return devices[0];

 }

 return devices[
  (currentIndex+1)%devices.length
 ];
     }
  /* =========================================
   START CAMERA + MICROPHONE
========================================= */

async function startCameraAndMicrophone(
 enableCamera=true,
 enableMicrophone=true
){

 if(
  !navigator.mediaDevices||
  !navigator.mediaDevices.getUserMedia
 ){

  permissionMessage.textContent=
   "Camera and microphone are not supported on this device.";

  return false;
 }

 try{

  const stream=
   await navigator.mediaDevices.getUserMedia({

    video:getCameraConstraints(
     currentFacingMode,
     ""
    ),

    audio:getAudioConstraints()

   });

  if(canvasStream){
   stopCurrentMediaTracks();
  }

  canvasStream=stream;

  cameraEnabled=enableCamera;
  microphoneEnabled=enableMicrophone;

  const videoTrack=
   canvasStream.getVideoTracks()[0];

  if(videoTrack){

   videoTrack.enabled=cameraEnabled;

   try{

    const settings=videoTrack.getSettings();

    currentCameraDeviceId=
     settings.deviceId||"";

    currentFacingMode=
     settings.facingMode||
     currentFacingMode;

    console.log(
     "Canvas camera settings:",
     settings
    );

   }catch(error){

    console.log(
     "Could not read camera settings."
    );

   }

  }

  canvasStream.getAudioTracks().forEach(function(track){
   track.enabled=microphoneEnabled;
  });

  await updateCameraPreview();

  permissionMessage.textContent="";

  updateCameraButton();
  updateMicButton();
  updateSwitchCameraButton();

  return true;

 }catch(error){

  console.error(
   "Canvas media error:",
   error
  );

  if(canvasStream){
   stopCurrentMediaTracks();
  }

  canvasStream=null;
  cameraEnabled=false;
  microphoneEnabled=false;
  currentCameraDeviceId="";

  if(error.name==="NotAllowedError"){

   permissionMessage.textContent=
    "Please allow camera and microphone permission.";

  }else if(error.name==="NotFoundError"){

   permissionMessage.textContent=
    "Camera or microphone was not found.";

  }else if(error.name==="NotReadableError"){

   permissionMessage.textContent=
    "Camera or microphone is already being used.";

  }else if(error.name==="OverconstrainedError"){

   permissionMessage.textContent=
    "This device cannot provide the requested camera quality.";

  }else{

   permissionMessage.textContent=
    "Could not access camera and microphone.";

  }

  updateCameraButton();
  updateMicButton();
  updateSwitchCameraButton();

  return false;
 }


}

/* =========================================
   FIXED SWITCH CAMERA
========================================= */

if(switchCameraButton){

 switchCameraButton.addEventListener(
  "click",
  async function(){

   if(
    !navigator.mediaDevices||
    !navigator.mediaDevices.getUserMedia
   ){

    permissionMessage.textContent=
     "Camera switching is not supported on this device.";

    return;
   }

   /*
    * If camera has not started yet,
    * start the front camera first.
    */

   if(!canvasStream){

    currentFacingMode="user";

    await startCameraAndMicrophone(
     true,
     false
    );

    return;
   }

   const oldCameraState=cameraEnabled;
   const oldMicState=microphoneEnabled;

   permissionMessage.textContent=
    "Switching camera...";

   try{

    /*
     * Find the actual other camera.
     */

    let otherCamera=
     await findOtherCamera();

    let newStream=null;

    /*
     * Preferred method:
     * use the exact deviceId.
     */

    if(otherCamera&&otherCamera.deviceId){

     try{

      newStream=
       await navigator.mediaDevices.getUserMedia({

        video:getCameraConstraints(
         currentFacingMode,
         otherCamera.deviceId
        ),

        audio:false

       });

     }catch(deviceError){

      console.log(
       "Device ID switch failed, using facingMode fallback."
      );

     }

    }

    /*
     * Fallback method.
     */

    if(!newStream){

     const nextFacing=
      currentFacingMode==="user"
       ?"environment"
       :"user";

     newStream=
      await navigator.mediaDevices.getUserMedia({

       video:getCameraConstraints(
        nextFacing,
        ""
       ),

       audio:false

      });

    }

    const newVideoTrack=
     newStream.getVideoTracks()[0];

    if(!newVideoTrack){

     throw new Error(
      "No camera track was returned."
     );

    }

    const oldVideoTracks=
     canvasStream.getVideoTracks();

    oldVideoTracks.forEach(function(track){

     try{
      track.stop();
     }catch(error){}

     try{
      canvasStream.removeTrack(track);
     }catch(error){}

    });

    canvasStream.addTrack(newVideoTrack);

    newVideoTrack.enabled=oldCameraState;

    /*
     * Read the actual camera that
     * the browser gave us.
     */

    try{

     const settings=
      newVideoTrack.getSettings();

     currentCameraDeviceId=
      settings.deviceId||
      (otherCamera?otherCamera.deviceId:"")||
      "";

     if(settings.facingMode){
      currentFacingMode=
       settings.facingMode;
     }else{
      currentFacingMode=
       currentFacingMode==="user"
        ?"environment"
        :"user";
     }

     console.log(
      "Canvas switched camera settings:",
      settings
     );

    }catch(error){

     currentFacingMode=
      currentFacingMode==="user"
       ?"environment"
       :"user";

  }
      /*
     * Keep microphone exactly as it was.
     */

    canvasStream.getAudioTracks().forEach(
     function(track){
      track.enabled=oldMicState;
     }
    );

    /*
     * Replace video for every
     * currently connected viewer.
     */

    if(isStreaming){

     await replaceVideoTrackForPeers(
      newVideoTrack
     );

    }

    await updateCameraPreview();

    permissionMessage.textContent="";

    updateCameraButton();
    updateMicButton();
    updateSwitchCameraButton();

    console.log(
     "Canvas camera switched successfully."
    );

   }catch(error){

    console.error(
     "Camera switch failed:",
     error
    );

    cameraEnabled=oldCameraState;
    microphoneEnabled=oldMicState;

    permissionMessage.textContent=
     "Could not switch camera on this device.";

    updateCameraButton();
    updateMicButton();
    updateSwitchCameraButton();

   }

  }
 );
}


/* =========================================
   STREAM FORM
========================================= */

const streamTitleInput=
 document.getElementById("streamTitle");

const categoryInput=
 document.getElementById("category");

const descriptionInput=
 document.getElementById("description");

const startStreamingButton=
 document.getElementById("startStreamingButton");

const stopStreamingButton=
 document.getElementById("stopStreamingButton");

const streamStatus=
 document.getElementById("streamStatus");

currentBackendStream=null;


function saveActiveStream(backendStream){

 const creator=
  savedProfile.name||
  savedProfile.username||
  "Canvas Creator";

 const streamData={

  id:
   backendStream&&backendStream.id
    ?backendStream.id:"",

  title:
   backendStream&&backendStream.title
    ?backendStream.title
    :streamTitleInput.value.trim(),

  category:
   backendStream&&backendStream.category
    ?backendStream.category
    :categoryInput.value,

  description:
   backendStream&&backendStream.description
    ?backendStream.description
    :descriptionInput.value.trim(),

  creator:creator,

  name:savedProfile.name||"",
  username:savedProfile.username||"",

  thumbnail:
   thumbnailImage&&thumbnailImage.src
    ?thumbnailImage.src:"",

  startedAt:new Date().toISOString(),
  isLive:true
 };

 localStorage.setItem(
  "canvasActiveStream",
  JSON.stringify(streamData)
 );

 localStorage.setItem(
  "canvasLiveStream",
  JSON.stringify(streamData)
 );

 return streamData;
}


function clearActiveStream(){

 localStorage.removeItem("canvasActiveStream");
 localStorage.removeItem("canvasLiveStream");
 localStorage.removeItem("canvasCurrentStreamId");

}


function getCurrentStreamId(){

 return(
  currentStreamId||
  localStorage.getItem("canvasCurrentStreamId")||
  ""
 );
}


async function createBackendStream(){

 const token=getAuthToken();

 if(!token){
  throw new Error(
   "Please log in to Canvas before streaming."
  );
 }

 const response=await fetch(
  CANVAS_API+"/api/streams",
  {
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "Authorization":"Bearer "+token
   },
   body:JSON.stringify({
    title:streamTitleInput.value.trim(),
    category:categoryInput.value,
    description:descriptionInput.value.trim()
   })
  }
 );

 let data={};

 try{
  data=await response.json();
 }catch(error){
  data={};
 }

 if(!response.ok){

  throw new Error(
   data.message||
   data.error||
   "Unable to create Canvas stream."
  );

 }

 if(!data.stream||!data.stream.id){

  throw new Error(
   "Canvas server did not return a stream."
  );

 }

 return data.stream;
}


async function startStreaming(){

 if(isStreaming)return;

 const token=getAuthToken();

 if(!token){

  streamStatus.textContent=
   "Please log in to Canvas before streaming.";

  return;
 }

 const title=streamTitleInput.value.trim();
 const description=descriptionInput.value.trim();

 if(!title){

  streamStatus.textContent=
   "Please enter a stream title.";

  streamTitleInput.focus();

  return;
 }

 if(title.length>100){

  streamStatus.textContent=
   "Stream title is too long.";

  return;
 }

 if(description.length>500){

  streamStatus.textContent=
   "Description is too long.";

  return;
 }

 streamStatus.textContent=
  "Requesting camera and microphone...";

 const mediaStarted=
  await startCameraAndMicrophone(true,true);

 if(!mediaStarted)return;

 streamStatus.textContent=
  "Connecting to Canvas...";

 connectSocket();

 if(socket&&!socket.connected){

  await new Promise(function(resolve){

   let finished=false;

   const finish=function(){

    if(finished)return;

    finished=true;
    resolve();

   };

   socket.once("connect",finish);

   setTimeout(finish,5000);

  });

 }

 try{

  streamStatus.textContent=
   "Starting Canvas stream...";

  const backendStream=
   await createBackendStream();

  currentBackendStream=backendStream;

  currentStreamId=
   String(backendStream.id);

  localStorage.setItem(
   "canvasCurrentStreamId",
   currentStreamId
  );

  saveActiveStream(backendStream);

  isStreaming=true;

  startStreamingButton.classList.add("hidden");
  stopStreamingButton.classList.remove("hidden");

  streamStatus.textContent=
   "🔴 You are now live on Canvas.";

  if(webrtcStatus){

   webrtcStatus.textContent=
    socketConnected
     ?"Canvas connection ready."
     :"Live stream started.";

  }

  if(socket&&socket.connected){

   socket.emit("join-stream",{
    streamId:currentStreamId,
    role:"broadcaster"
   });

  }

  console.log(
   "Canvas stream started:",
   backendStream
  );

 }catch(error){

  console.error(
   "Canvas start stream error:",
   error
  );

  stopCurrentMediaTracks();

  canvasStream=null;
  cameraEnabled=false;
  microphoneEnabled=false;
  isStreaming=false;
  currentBackendStream=null;
  currentStreamId=null;
  currentCameraDeviceId="";

  updateCameraButton();
  updateMicButton();

  if(cameraPreview){

   cameraPreview.pause();
   cameraPreview.srcObject=null;
   cameraPreview.style.display="none";

  }

  if(cameraMessage){
   cameraMessage.style.display="block";
  }

  streamStatus.textContent=
   error.message||
   "Unable to start Canvas stream.";

 }
}


if(startStreamingButton){

 startStreamingButton.addEventListener(
  "click",
  function(event){

   event.preventDefault();
   startStreaming();

  }
 );
}


async function stopStreaming(){

 if(!isStreaming)return;

 const token=getAuthToken();
 const streamId=getCurrentStreamId();

 streamStatus.textContent=
  "Ending Canvas stream...";

 if(socket&&socket.connected){

  try{

   socket.emit("leave-stream",{
    streamId:streamId,
    role:"broadcaster"
   });

  }catch(error){

   console.error(
    "Socket leave error:",
    error
   );

  }

 }

 if(token&&streamId){

  try{

   const response=await fetch(
    CANVAS_API+
    "/api/streams/"+
    encodeURIComponent(streamId)+
    "/end",
    {
     method:"PUT",
     headers:{
      "Authorization":"Bearer "+token
     }
    }
   );

   if(!response.ok){

    let data={};

    try{
     data=await response.json();
    }catch(error){}

    console.error(
     "Backend end stream error:",
     data.message||"Unknown error"
    );

   }

  }catch(error){

   console.error(
    "End stream request failed:",
    error
   );

  }

 }

 stopCurrentMediaTracks();

 canvasStream=null;

 if(cameraPreview){

  cameraPreview.pause();
  cameraPreview.srcObject=null;
  cameraPreview.style.display="none";

 }

 if(cameraMessage){
  cameraMessage.style.display="block";
 }

 closeAllPeerConnections();

 isStreaming=false;
 cameraEnabled=false;
 microphoneEnabled=false;
 currentBackendStream=null;
 currentStreamId=null;
 currentCameraDeviceId="";

 clearActiveStream();

 if(startStreamingButton){
  startStreamingButton.classList.remove("hidden");
 }

 if(stopStreamingButton){
  stopStreamingButton.classList.add("hidden");
 }

 updateCameraButton();
 updateMicButton();
 updateSwitchCameraButton();

 streamStatus.textContent="Streaming ended.";

 if(webrtcStatus){
  webrtcStatus.textContent="";
 }

}


if(stopStreamingButton){

 stopStreamingButton.addEventListener(
  "click",
  function(event){

   event.preventDefault();
   stopStreaming();

  }
 );
  }
  window.addEventListener(
 "beforeunload",
 function(){

  if(
   isStreaming&&
   socket&&
   socket.connected
  ){

   try{

    socket.emit("leave-stream",{
     streamId:getCurrentStreamId(),
     role:"broadcaster"
    });

   }catch(error){}

  }

 }
);

 loadSavedProfile();

 updateCreatorName();

 updateProfileIcons();

 updateCameraButton();

 updateMicButton();

 updateSwitchCameraButton();

 if(cameraPreview){
  cameraPreview.style.display="none";
 }

 if(cameraMessage){

  if(event.key==="canvasProfile"){

   updateProfileIcons();

  }

 }
);


async function checkCameraDevices(){

 if(
  !navigator.mediaDevices||
  !navigator.mediaDevices.enumerateDevices
 ){
  return;
 }

 try{

  const devices=
   await getVideoDevices();

  console.log(
   "Canvas cameras detected:",
   devices.length
  );

  if(
   devices.length<=1&&
   switchCameraButton
  ){

   switchCameraButton.title=
    "Only one camera detected";

  }else if(switchCameraButton){

    "Switch camera";

  }

 }catch(error){

  console.log(

  );

 }
}


window.addEventListener(
 "DOMContentLoaded",
 function(){

  initializeGoLivePage();
  checkCameraDevices();

 }
);


document.addEventListener(
 "visibilitychange",
 function(){

  if(
   !document.hidden&&
   cameraPreview&&
   canvasStream&&
   cameraEnabled
  ){

   cameraPreview.play().catch(
    function(){}
   );

  }

 }
);


window.addEventListener(
 "pagehide",
 function(){

  if(!isStreaming){
   stopCurrentMediaTracks();
  }

 }
);
