<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Canvas - Go Live</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================
   GO LIVE PAGE
========================= */

body{
    margin:0;
    padding-bottom:90px;
    background:#FAF9F6;
    color:#4A3728;
}

/* HEADER */

.navbar{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    background:#ffffff;
    border-bottom:2px solid #D4A017;
    box-sizing:border-box;
}

.nav-icons{
    display:flex;
    align-items:center;
    gap:15px;
}

.nav-icons span,
.nav-icons a{
    font-size:24px;
    text-decoration:none;
    color:#6F4E37;
}


/* MAIN */

.container{
    width:100%;
    max-width:900px;
    margin:0 auto;
    padding:25px 15px 110px;
    box-sizing:border-box;
}


/* PAGE TITLE */

.page-title{
    text-align:center;
    margin:10px 0 30px;
}

.page-title h1{
    color:#6F4E37;
    font-size:32px;
    margin:0 0 8px;
}

.page-title p{
    color:#7B6249;
    margin:6px 0;
}


/* =========================
   CAMERA
========================= */

.camera-section{
    width:100%;
    margin-bottom:30px;
}


/* CAMERA BOX */

.camera-box{
    width:100%;
    height:400px;
    background:#F3E8D3;
    border:2px solid #D4A017;
    border-radius:20px;
    position:relative;
    overflow:hidden;
    box-sizing:border-box;
}


/* CAMERA VIDEO */

#cameraPreview{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    border-radius:0;
}


/* CAMERA MESSAGE */

#cameraMessage{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:#6F4E37;
    font-size:22px;
    font-weight:bold;
    text-align:center;
    white-space:nowrap;
}


/* CAMERA CONTROLS */

.camera-controls{
    display:flex;
    gap:12px;
    margin-top:15px;
}

.camera-controls button{
    flex:1;
    margin:0;
    padding:14px;
    background:#D4A017;
    color:white;
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}


/* PERMISSION MESSAGE */

#permissionMessage{
    min-height:22px;
    margin-top:12px;
    text-align:center;
    color:#b00020;
    font-size:14px;
}


/* =========================
   STREAM FORM
========================= */

.stream-form{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.stream-form label{
    display:block;
    margin-top:8px;
    color:#6F4E37;
    font-weight:bold;
}

.stream-form input,
.stream-form select,
.stream-form textarea{
    width:100%;
    padding:14px;
    border:2px solid #D4A017;
    border-radius:12px;
    background:#ffffff;
    color:#4A3728;
    font-size:16px;
    outline:none;
    box-sizing:border-box;
}

.stream-form textarea{
    resize:none;
}

.start-btn{
    width:100%;
    margin-top:18px;
    padding:16px;
    background:#D4A017;
    color:white;
    border:none;
    border-radius:14px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;
    left:0;
    bottom:0;
    width:100%;
    height:75px;
    background:#ffffff;
    border-top:2px solid #eeeeee;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:9999;
    box-sizing:border-box;
}

.bottom-nav a{
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-decoration:none;
    color:#4A3728;
    font-size:25px;
    line-height:1;
}

.bottom-nav span{
    display:block;
    margin-top:5px;
    font-size:11px;
    color:#777;
}

.bottom-nav a:hover,
.bottom-nav a:active{
    color:#D4A017;
}


/* MOBILE */

@media(max-width:600px){

    .camera-box{
        height:300px;
    }

    .camera-controls{
        flex-direction:column;
    }

    .page-title h1{
        font-size:28px;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="navbar">

<div class="logo">
Canvas
</div>

<div class="nav-icons">

<span>🔍</span>

<a href="profile.html">
👤
</a>

</div>

</header>



<!-- =========================
     MAIN
========================= -->

<main class="container">


<!-- PAGE TITLE -->

<section class="page-title">

<h1>
🎥 Go Live
</h1>

<p>
Start streaming to your audience in seconds.
</p>

<p id="creatorName"></p>

</section>



<!-- =========================
     CAMERA
========================= -->

<section class="camera-section">

<div class="camera-box">


<video
id="cameraPreview"
autoplay
muted
playsinline>
</video>


<div id="cameraMessage">
Camera Preview
</div>


</div>


<!-- CAMERA CONTROLS -->

<div class="camera-controls">

<button id="cameraButton">
📷 Camera
</button>


<button id="micButton">
🎙️ Microphone
</button>

</div>


<p id="permissionMessage"></p>

</section>



<!-- =========================
     STREAM FORM
========================= -->

<section class="stream-form">


<label for="streamTitle">
Stream Title
</label>

<input
type="text"
id="streamTitle"
placeholder="Enter stream title"
>


<label for="category">
Category
</label>

<select id="category">

<option>Gaming</option>

<option>Music</option>

<option>Sports</option>

<option>Education</option>

<option>Technology</option>

</select>


<label for="description">
Description
</label>

<textarea
id="description"
rows="4"
placeholder="Tell viewers about your stream..."
></textarea>


<label for="thumbnail">
Thumbnail
</label>

<input
type="file"
id="thumbnail"
accept="image/*"
>


<button
id="startStreaming"
class="start-btn"
>

🔴 Start Streaming

</button>

</section>

</main>



<!-- =========================
     BOTTOM NAV
========================= -->

<nav class="bottom-nav">


<a href="stream.html">

🏠

<span>
Home
</span>

</a>


<a href="stream.html">

📺

<span>
Stream
</span>

</a>


<a href="golive.html">

➕

<span>
Go Live
</span>

</a>


<a href="profile.html">

👤

<span>
Profile
</span>

</a>


</nav>



<script>


/* =========================
   CREATOR PROFILE
========================= */

let creatorProfile = null;


window.onload = function(){

const savedProfile =
localStorage.getItem("canvasProfile");


if(savedProfile){

try{

creatorProfile =
JSON.parse(savedProfile);

document
.getElementById("creatorName")
.textContent =
"Streaming as " +
creatorProfile.name +
" " +
creatorProfile.username;

}catch(error){

console.log(
"Profile error:",
error
);

}

}else{

document
.getElementById("creatorName")
.textContent =
"Please create your Canvas profile first.";

}

};



/* =========================
   CAMERA
========================= */

const cameraButton =
document.getElementById("cameraButton");

const cameraPreview =
document.getElementById("cameraPreview");

const cameraMessage =
document.getElementById("cameraMessage");

const permissionMessage =
document.getElementById("permissionMessage");

let cameraStream = null;


cameraButton.onclick = async function(){

try{

/* CHECK SUPPORT */

if(
!navigator.mediaDevices ||
!navigator.mediaDevices.getUserMedia
){

permissionMessage.textContent =
"Camera is not supported by this browser.";

return;

}


/* REQUEST CAMERA */

cameraStream =
await navigator.mediaDevices.getUserMedia({

video:{
facingMode:"user"
},

audio:false

});


/* SHOW CAMERA */

cameraPreview.srcObject =
cameraStream;

cameraPreview.style.display =
"block";

cameraMessage.style.display =
"none";

permissionMessage.textContent =
"";

cameraButton.textContent =
"📷 Camera On";


}catch(error){

console.log(
"Camera error:",
error
);


if(error.name === "NotAllowedError"){

permissionMessage.textContent =
"Camera permission was denied. Allow camera access in Chrome.";

}

else if(error.name === "NotFoundError"){

permissionMessage.textContent =
"No camera was found on this device.";

}

else if(error.name === "NotReadableError"){

permissionMessage.textContent =
"Camera is already being used by another app.";

}

else{

permissionMessage.textContent =
"Camera error: " +
error.name;

}

}

};



/* =========================
   MICROPHONE
========================= */

const micButton =
document.getElementById("micButton");

let microphoneEnabled = false;


micButton.onclick = async function(){

try{

if(!navigator.mediaDevices ||
!navigator.mediaDevices.getUserMedia){

permissionMessage.textContent =
"Microphone is not supported by this browser.";

return;

}


if(!cameraStream){

cameraStream =
await navigator.mediaDevices.getUserMedia({

audio:true

});

}else{

const audioStream =
await navigator.mediaDevices.getUserMedia({

audio:true

});


audioStream
.getAudioTracks()
.forEach(function(track){

cameraStream.addTrack(track);

});

}


microphoneEnabled = true;

micButton.textContent =
"🎙️ Microphone On";


}catch(error){

console.log(
"Microphone error:",
error
);

permissionMessage.textContent =
"Microphone permission was denied. Allow microphone access in Chrome.";

}

};



/* =========================
   START STREAMING
========================= */

document
.getElementById("startStreaming")
.onclick = function(){


/* CHECK PROFILE */

if(!creatorProfile){

alert(
"Please create your Canvas profile first."
);

window.location.href =
"profile.html";

return;

}


/* TITLE */

const title =
document
.getElementById("streamTitle")
.value
.trim();


/* CATEGORY */

const category =
document
.getElementById("category")
.value;


/* DESCRIPTION */

const description =
document
.getElementById("description")
.value
.trim();


/* CHECK TITLE */

if(title === ""){

alert(
"Please enter a stream title."
);

return;

}


/* STREAM DATA */

const streamData = {

creatorName:
creatorProfile.name,

creatorUsername:
creatorProfile.username,

title:
title,

category:
category,

description:
description,

isLive:
true,

startedAt:
Date.now()

};


/* SAVE LIVE STREAM */

localStorage.setItem(
"canvasLiveStream",
JSON.stringify(streamData)
);


/* MESSAGE */

alert(
"🔴 You are now live!"
);


/* OPEN WATCH PAGE */

window.location.href =
"watch.html";

};


</script>


</body>

  </html>
