<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Canvas - Go Live</title><link rel="stylesheet" href="style.css"></head><body><header class="navbar"><div class="logo">

🎥 Go Live
</h1><p>
Start streaming to your audience in seconds.
</p><p id="creatorName">
</p></section><!-- CAMERA --><section class="camera-section"><div class="camera-box"><video
id="cameraPreview"
autoplay
muted
playsinline>
</video>

<div id="cameraMessage">
Camera Preview
</div></div><div class="camera-controls"><button id="cameraButton">
📷 Camera
</button><button id="micButton">
🎙️ Microphone
</button></div><p id="permissionMessage">
</p></section><!-- STREAM FORM --><section class="stream-form"><label for="streamTitle">
Stream Title
</label><input
type="text"
id="streamTitle"
placeholder="Enter stream title"

<label for="category">
Category
</label><select id="category"><option>

</option><option>

</option><option>

</option><option>

</option></select><label for="description">
Description
</label><textarea

rows="4"

></textarea><label for="thumbnail">

</label><input

Stream
</span></a><a href="golive.html">➕

Go Live
</span></a><a href="profile.html">👤

<span>
Profile
</span></a></nav><script>

/* CREATOR PROFILE */

let creatorProfile = null;


/* LOAD CREATOR */

window.onload = function(){

const savedProfile =
localStorage.getItem("canvasProfile");


if(savedProfile){

creatorProfile =
JSON.parse(savedProfile);


document
.getElementById("creatorName")
textContent =
"Streaming as " +
creatorProfile.name +
" " +
creatorProfile.username;

}else{

document
.getElementById("creatorName")
textContent =
"Please create your Canvas profile first.";

}

};



/* CAMERA */

const cameraButton =
document.getElementById("cameraButton");

const cameraPreview =
document.getElementById("cameraPreview");

const cameraMessage =
document.getElementById("cameraMessage");

let cameraStream = null;


cameraButton.onclick = async function(){

try{

cameraStream =
await navigator.mediaDevices.getUserMedia({

video:true

});


cameraPreview.srcObject =
cameraStream;


cameraMessage.style.display =
"none";


cameraButton.textContent =
"📷 Camera On";


}catch(error){

document
.getElementById("permissionMessage")
textContent =
"Camera permission was denied.";

}

};



/* MICROPHONE */

const micButton =
document.getElementById("micButton");

let microphoneEnabled = false;


micButton.onclick = async function(){

try{

if(!cameraStream){

cameraStream =
await navigator.mediaDevices.getUserMedia({

audio:true

});

}else{

const audioStream =
await navigator.mediaDevices.getUserMedia({

audio:true

});


audioStream
.getAudioTracks()
.forEach(track => {

cameraStream.addTrack(track);

});

}


microphoneEnabled = true;

micButton.textContent =
"🎙️ Microphone On";


}catch(error){

document
.getElementById("permissionMessage")
.textContent =
"Microphone permission was denied.";

}

};



/* START STREAMING */

document
.getElementById("startStreaming")
.onclick = function(){


if(!creatorProfile){

alert(
"Please create your Canvas profile first."
);

window.location.href =
"profile.html";

return;

}


const title =
document
.getElementById("streamTitle")
.value
.trim();


const category =
document
.getElementById("category")
.value;


const description =
document
.getElementById("description")
.value
.trim();


if(title === ""){

alert(
"Please enter a stream title."
);

return;

}



/* STREAM DATA */

const streamData = {

creatorName:
creatorProfile.name,

creatorUsername:
creatorProfile.username,

title:title,

category:category,

description:description,

isLive:true,

startedAt:
Date.now()

};


localStorage.setItem(

"canvasLiveStream",

JSON.stringify(streamData)

);


alert(
"🔴 You are now live!"
);


/* OPEN WATCH PAGE */

window.location.href =
"watch.html";

};

</script></body></html>
