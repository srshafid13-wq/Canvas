<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Canvas - Go Live</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================================
   GO LIVE PAGE
========================================= */

.container {
    padding-bottom: 110px;
}


/* =========================================
   PAGE TITLE
========================================= */

.page-title {
    width: 100%;
    max-width: 760px;
    margin: 0 auto 28px;
}

.page-title h1 {
    color: #4b3326;
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 8px;
}

.page-title p {
    color: #8a6b58;
    font-size: 15px;
    margin-bottom: 5px;
}

#creatorName {
    color: #4b3326;
    font-weight: 700;
}


/* =========================================
   CAMERA
========================================= */

.camera-section {
    width: 100%;
    max-width: 760px;
    margin: 0 auto 30px;
}

.camera-box {
    width: 100%;
    height: 360px;

    background: #251b17;

    border-radius: 0 0 30px 30px;

    overflow: hidden;
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    box-shadow:
        0 4px 14px rgba(75, 51, 38, 0.10);
}

#cameraPreview {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: none;

    border-radius: 0 0 30px 30px;
}

#cameraMessage {
    color: #ffffff;

    font-size: 18px;
    font-weight: 700;

    text-align: center;
}


/* =========================================
   CAMERA CONTROLS
========================================= */

.camera-controls {
    width: 100%;

    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 16px;

    margin-top: 24px;
}

.camera-controls button {
    width: 100%;

    min-height: 62px;

    padding: 14px 12px;

    border: 1px solid rgba(75, 51, 38, 0.16);

    border-radius: 18px;

    background: rgba(255, 255, 255, 0.72);

    color: #4b3326;

    font-size: 16px;
    font-weight: 800;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 10px;

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    box-shadow:
        0 5px 15px rgba(75, 51, 38, 0.08);

    transition: 0.2s ease;
}

.camera-controls button:hover {
    border-color: #d4a62a;
    transform: translateY(-1px);
}

.camera-controls button:active {
    transform: scale(0.97);
}

.camera-controls button.active {
    background: #d4a62a;
    color: #ffffff;
    border-color: #d4a62a;
}


/* =========================================
   CAMERA + MICROPHONE ICONS
========================================= */

.control-icon {
    width: 26px;
    height: 26px;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    flex-shrink: 0;
}

.control-icon svg {
    width: 26px;
    height: 26px;

    display: block;
}


/* =========================================
   PERMISSION MESSAGE
========================================= */

#permissionMessage {
    text-align: center;

    margin-top: 12px;

    min-height: 20px;

    font-size: 14px;

    color: #8a6b58;
}


/* =========================================
   STREAM FORM
========================================= */

.stream-form {
    width: 100%;
    max-width: 760px;

    margin: 0 auto;
}

.stream-form label.form-label {
    display: block;

    margin: 22px 0 9px;

    font-size: 17px;
    font-weight: 800;

    color: #4b3326;
}

.stream-form input[type="text"],
.stream-form select,
.stream-form textarea {
    width: 100%;

    padding: 16px 15px;

    border: 2px solid #d8c7bb;

    border-radius: 16px;

    background: #ffffff;

    color: #4b3326;

    font-size: 17px;

    outline: none;

    font-family: Arial, Helvetica, sans-serif;
}

.stream-form input[type="text"]:focus,
.stream-form select:focus,
.stream-form textarea:focus {
    border-color: #d4a62a;

    box-shadow:
        0 0 0 2px rgba(212, 166, 42, 0.08);
}

.stream-form textarea {
    resize: vertical;

    min-height: 150px;
}


/* =========================================
   THUMBNAIL UPLOAD
========================================= */

.photo-upload {
    width: 100%;

    min-height: 58px;

    padding: 15px;

    border: 1px solid rgba(75, 51, 38, 0.16);

    border-radius: 16px;

    background: rgba(255, 255, 255, 0.72);

    color: #4b3326;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 16px;
    font-weight: 800;

    cursor: pointer;

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    box-shadow:
        0 5px 15px rgba(75, 51, 38, 0.08);

    transition: 0.2s ease;
}

.photo-upload:hover {
    border-color: #d4a62a;
    transform: translateY(-1px);
}

.photo-upload:active {
    transform: scale(0.97);
}


/* =========================================
   THUMBNAIL PREVIEW
========================================= */

.thumbnail-preview {
    width: 100%;

    margin-top: 12px;

    display: none;

    border-radius: 16px;

    overflow: hidden;

    border: 1px solid #eaded6;
}

.thumbnail-preview img {
    width: 100%;

    max-height: 220px;

    object-fit: cover;

    display: block;
}


/* =========================================
   START STREAMING
========================================= */

.start-btn {
    width: 100%;

    margin-top: 28px;

    padding: 18px;

    border: none;

    border-radius: 16px;

    background: #4b3326;

    color: #ffffff;

    font-size: 19px;

    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 5px 15px rgba(75, 51, 38, 0.18);

    transition: 0.2s ease;
}

.start-btn:hover {
    background: #5d4030;
    transform: translateY(-1px);
}

.start-btn:active {
    transform: scale(0.98);
}


/* =========================================
   PROFILE ICONS
========================================= */

#topProfileIcon {
    width: 40px;
    height: 40px;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    border-radius: 50%;

    padding: 0;

    background: #f1f1f1;

    border: 2px solid #d4a62a;
}

#topProfileIcon img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    border-radius: 50%;
}

#bottomProfileIcon {
    position: relative;
}

#bottomProfileIcon img {
    width: 25px;
    height: 25px;

    display: block;

    object-fit: cover;

    border-radius: 50%;

    border: 1.5px solid #d4a62a;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

    .page-title h1 {
        font-size: 25px;
    }

    .camera-box {
        height: 260px;

        border-radius: 0 0 26px 26px;
    }

    #cameraPreview {
        border-radius: 0 0 26px 26px;
    }

    .camera-controls {
        gap: 12px;
    }

    .camera-controls button {
        min-height: 58px;

        padding: 14px 8px;

        font-size: 15px;
    }

    .control-icon,
    .control-icon svg {
        width: 24px;
        height: 24px;
    }

    .stream-form label.form-label {
        font-size: 16px;
    }

    .stream-form input[type="text"],
    .stream-form select,
    .stream-form textarea {
        font-size: 16px;
    }

    #topProfileIcon {
        width: 38px;
        height: 38px;
    }

}

.bottom-nav {
    z-index: 1000;
}

</style>

</head>

<script>

/* =========================================
   CANVAS GO LIVE - JAVASCRIPT
========================================= */


/* =========================================
   CREATOR PROFILE
========================================= */

let creatorProfile = null;

window.addEventListener("DOMContentLoaded", function () {

    const savedProfile =
        localStorage.getItem("canvasProfile");

    const creatorName =
        document.getElementById("creatorName");


    if (savedProfile) {

        try {

            creatorProfile =
                JSON.parse(savedProfile);

            const name =
                creatorProfile.name || "";

            const username =
                creatorProfile.username || "";

            const fullName =
                (name + " " + username).trim();


            creatorName.textContent =
                fullName
                    ? "Streaming as " + fullName
                    : "Canvas Creator";

        }

        catch (error) {

            console.error(
                "Profile error:",
                error
            );

            creatorName.textContent =
                "Canvas Creator";
        }

    }

    else {

        creatorName.textContent =
            "Please create your Canvas profile first.";

    }

});



/* =========================================
   ELEMENTS
========================================= */

const cameraButton =
    document.getElementById("cameraButton");

const micButton =
    document.getElementById("micButton");

const cameraPreview =
    document.getElementById("cameraPreview");

const cameraMessage =
    document.getElementById("cameraMessage");

const permissionMessage =
    document.getElementById("permissionMessage");

const thumbnailInput =
    document.getElementById("thumbnail");

const thumbnailPreview =
    document.getElementById("thumbnailPreview");

const thumbnailImage =
    document.getElementById("thumbnailImage");

const startStreaming =
    document.getElementById("startStreaming");

const streamTitle =
    document.getElementById("streamTitle");

const category =
    document.getElementById("category");

const description =
    document.getElementById("description");



/* =========================================
   MEDIA STREAMS
========================================= */

let cameraStream = null;

let micStream = null;



/* =========================================
   CAMERA
========================================= */

cameraButton.onclick = async function () {

    try {

        /* CAMERA OFF */

        if (cameraStream) {

            cameraStream
                .getTracks()
                .forEach(function (track) {
                    track.stop();
                });

            cameraStream = null;

            cameraPreview.srcObject = null;

            cameraPreview.style.display =
                "none";

            cameraMessage.style.display =
                "block";

            cameraButton.classList.remove(
                "active"
            );

            permissionMessage.textContent =
                "Camera turned off.";

            return;
        }


        /* CHECK SUPPORT */

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            permissionMessage.textContent =
                "Camera is not supported on this browser.";

            return;
        }


        /* CAMERA ON */

        cameraStream =
            await navigator.mediaDevices
                .getUserMedia({
                    video: true,
                    audio: false
                });


        cameraPreview.srcObject =
            cameraStream;

        cameraPreview.style.display =
            "block";

        cameraMessage.style.display =
            "none";

        cameraButton.classList.add(
            "active"
        );

        permissionMessage.textContent =
            "Camera is ready.";

    }

    catch (error) {

        console.error(
            "Camera error:",
            error
        );

        cameraStream = null;

        permissionMessage.textContent =
            "Camera permission was denied or unavailable.";

    }

};



/* =========================================
   MICROPHONE
========================================= */

micButton.onclick = async function () {

    try {

        /* MICROPHONE OFF */

        if (micStream) {

            micStream
                .getTracks()
                .forEach(function (track) {
                    track.stop();
                });

            micStream = null;

            micButton.classList.remove(
                "active"
            );

            permissionMessage.textContent =
                "Microphone turned off.";

            return;
        }


        /* CHECK SUPPORT */

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            permissionMessage.textContent =
                "Microphone is not supported on this browser.";

            return;
        }


        /* MICROPHONE ON */

        micStream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio: true,
                    video: false
                });


        micButton.classList.add(
            "active"
        );

        permissionMessage.textContent =
            "Microphone is ready.";

    }

    catch (error) {

        console.error(
            "Microphone error:",
            error
        );

        micStream = null;

        permissionMessage.textContent =
            "Microphone permission was denied or unavailable.";

    }

};



/* =========================================
   THUMBNAIL PREVIEW
========================================= */

thumbnailInput.addEventListener(
    "change",
    function () {

        const file =
            this.files[0];


        if (!file) {

            thumbnailPreview.style.display =
                "none";

            thumbnailImage.src = "";

            return;
        }


        if (!file.type.startsWith("image/")) {

            permissionMessage.textContent =
                "Please choose an image.";

            this.value = "";

            thumbnailPreview.style.display =
                "none";

            return;
        }


        const reader =
            new FileReader();


        reader.onload = function (event) {

            thumbnailImage.src =
                event.target.result;

            thumbnailPreview.style.display =
                "block";

            permissionMessage.textContent =
                "Thumbnail selected.";

        };


        reader.readAsDataURL(file);

    }
);



/* =========================================
   START STREAMING
========================================= */

startStreaming.onclick = function () {

    const title =
        streamTitle.value.trim();

    const selectedCategory =
        category.value;

    const streamDescription =
        description.value.trim();


    /* CHECK TITLE */

    if (!title) {

        permissionMessage.textContent =
            "Please enter a stream title.";

        streamTitle.focus();

        return;
    }


    /* CHECK CAMERA */

    if (!cameraStream) {

        permissionMessage.textContent =
            "Please turn on your camera first.";

        return;
    }


    /* CHECK MICROPHONE */

    if (!micStream) {

        permissionMessage.textContent =
            "Please turn on your microphone first.";

        return;
    }


    /* GET CREATOR */

    const savedProfile =
        localStorage.getItem("canvasProfile");


    let creator = null;


    if (savedProfile) {

        try {

            creator =
                JSON.parse(savedProfile);

        }

        catch (error) {

            console.error(
                "Profile error:",
                error
            );

        }

    }


    /* CREATE STREAM DATA */

    const streamData = {

        title: title,

        category: selectedCategory,

        description: streamDescription,

        creator:
            creator
                ? (
                    creator.name ||
                    creator.username ||
                    "Canvas Creator"
                )
                : "Canvas Creator",

        username:
            creator
                ? (
                    creator.username ||
                    ""
                )
                : "",

        thumbnail:
            thumbnailImage.src || "",

        startedAt:
            new Date().toISOString(),

        live: true

    };


    /* SAVE CURRENT LIVE STREAM */

    localStorage.setItem(
        "canvasLiveStream",
        JSON.stringify(streamData)
    );


    /* SAVE STREAM STATUS */

    localStorage.setItem(
        "canvasStreaming",
        "true"
    );


    /* BUTTON STATE */

    startStreaming.disabled =
        true;

    startStreaming.textContent =
        "🔴 Streaming...";

    startStreaming.style.opacity =
        "0.7";


    permissionMessage.textContent =
        "Your stream is now live.";


    /*
       TEMPORARY FRONT-END BEHAVIOR

       This moves the user to the
       Stream page where the live stream
       can later be displayed.

       A real streaming backend will
       replace this part.
    */

    setTimeout(function () {

        window.location.href =
            "stream.html";

    }, 800);

};



/* =========================================
   CLEAN UP CAMERA WHEN LEAVING PAGE
========================================= */

window.addEventListener(
    "beforeunload",
    function () {

        if (cameraStream) {

            cameraStream
                .getTracks()
                .forEach(function (track) {
                    track.stop();
                });

        }


        if (micStream) {

            micStream
                .getTracks()
                .forEach(function (track) {
                    track.stop();
                });

        }

    }
);

</script>
