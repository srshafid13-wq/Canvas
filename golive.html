<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Canvas - Go Live</title>

<link
    rel="stylesheet"
    href="style.css">

<style>

/* =========================================
   GO LIVE PAGE
========================================= */

.container{
    width:100%;
    padding-bottom:120px;
}

.page-title{
    width:100%;
    max-width:760px;
    margin:0 auto 28px;
    text-align:center;
}

.page-title h1{
    color:#4b3326;
    font-size:28px;
    font-weight:800;
    margin-bottom:8px;
}

.page-title p{
    color:#8a6b58;
    font-size:15px;
    margin-bottom:5px;
}

#creatorName{
    color:#4b3326;
    font-weight:700;
}


/* =========================================
   CAMERA
========================================= */

.camera-section{
    width:100%;
    max-width:760px;
    margin:0 auto 30px;
}

.camera-box{
    width:100%;
    aspect-ratio:16 / 9;
    min-height:300px;
    background:#251b17;
    border-radius:22px;
    overflow:hidden;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 8px 25px rgba(75,51,38,.12);
}

#cameraPreview{
    width:100%;
    height:100%;
    display:none;
    object-fit:cover;
    background:#251b17;
    border-radius:22px;
}

#cameraMessage{
    color:#fff;
    font-size:18px;
    font-weight:700;
    text-align:center;
    padding:20px;
}


/* =========================================
   CAMERA CONTROLS
========================================= */

.camera-controls{
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-top:24px;
}

.camera-controls button{
    width:100%;
    min-height:62px;
    padding:14px 12px;
    border:1px solid rgba(75,51,38,.16);
    border-radius:18px;
    background:#fff;
    color:#4b3326;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    box-shadow:0 5px 15px rgba(75,51,38,.08);
}

.camera-controls button.active{
    background:#d4a62a;
    color:#fff;
    border-color:#d4a62a;
}

.control-icon{
    width:26px;
    height:26px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.control-icon svg{
    width:26px;
    height:26px;
    display:block;
}

#permissionMessage{
    width:100%;
    min-height:20px;
    margin-top:12px;
    text-align:center;
    color:#8a6b58;
    font-size:14px;
    font-weight:600;
}


/* =========================================
   STREAM FORM
========================================= */

.stream-form{
    width:100%;
    max-width:760px;
    margin:0 auto;
}

.form-field{
    width:100%;
    margin-top:24px;
}

.form-field:first-child{
    margin-top:0;
}

.stream-form label.form-label{
    display:block;
    width:100%;
    margin:0 0 9px;
    color:#4b3326;
    font-size:17px;
    font-weight:800;
}

.stream-form input[type="text"],
.stream-form select,
.stream-form textarea{
    display:block;
    width:100%;
    box-sizing:border-box;
    padding:16px 15px;
    border:2px solid #d8c7bb;
    border-radius:16px;
    outline:none;
    background:#fff;
    color:#4b3326;
    font-family:Arial,Helvetica,sans-serif;
    font-size:17px;
}

.stream-form input[type="text"]:focus,
.stream-form select:focus,
.stream-form textarea:focus{
    border-color:#d4a62a;
}

.stream-form select{
    min-height:54px;
    cursor:pointer;
}

.stream-form textarea{
    min-height:150px;
    resize:vertical;
    line-height:1.45;
}


/* =========================================
   STREAM TITLE
========================================= */

#streamTitle{
    width:100%;
    min-height:54px;
    padding:16px 15px;
    border:2px solid #d8c7bb;
    border-radius:16px;
    outline:none;
    background:#fff;
    color:#4b3326;
    font-family:Arial,Helvetica,sans-serif;
    font-size:17px;
}

#streamTitle:focus{
    border-color:#d4a62a;
}


/* =========================================
   THUMBNAIL
========================================= */

.photo-upload{
    width:100%;
    min-height:58px;
    box-sizing:border-box;
    padding:15px;
    border:1px solid rgba(75,51,38,.16);
    border-radius:16px;
    background:#fff;
    color:#4b3326;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:16px;
    font-weight:800;
}

.thumbnail-preview{
    width:100%;
    margin-top:12px;
    display:none;
    overflow:hidden;
    box-sizing:border-box;
    border:1px solid #eaded6;
    border-radius:16px;
}

.thumbnail-preview img{
    width:100%;
    max-height:220px;
    display:block;
    object-fit:cover;
}


/* =========================================
   STREAM BUTTONS
========================================= */

.streaming-buttons{
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:28px;
}

.start-btn,
.stop-btn{
    width:100%;
    padding:18px;
    border:none;
    border-radius:16px;
    color:#fff;
    font-size:18px;
    font-weight:800;
    cursor:pointer;
}

.start-btn{
    background:#4b3326;
}

.stop-btn{
    background:#9b2c2c;
}

.start-btn:disabled,
.stop-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.stop-btn.hidden{
    display:none;
}


/* =========================================
   PROFILE ICON
========================================= */

#topProfileIcon{
    width:40px !important;
    height:40px !important;
    min-width:40px;
    min-height:40px;
    max-width:40px;
    max-height:40px;
    padding:0 !important;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border:2px solid #d4a62a;
    border-radius:50%;
    background:#4b3326;
    color:#fff;
    text-decoration:none;
}

#topProfileImage{
    width:100% !important;
    height:100% !important;
    object-fit:cover;
    border-radius:50%;
    display:none;
}

#topProfileFallback{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

#topProfileFallback svg{
    width:23px;
    height:23px;
    display:block;
}


/* =========================================
   BOTTOM PROFILE ICON
========================================= */

#bottomProfileIcon .bottom-nav-icon{
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

#bottomProfileIcon .bottom-nav-icon svg{
    width:24px;
    height:24px;
    display:block;
}

#bottomProfileImage{
    width:28px;
    height:28px;
    object-fit:cover;
    border-radius:50%;
    display:none;
}


/* =========================================
   SEARCH BUTTON
========================================= */

#goLiveSearchButton{
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    color:inherit;
    text-decoration:none;
    cursor:pointer;
}

#goLiveSearchButton:active{
    transform:scale(.92);
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    .page-title h1{
        font-size:25px;
    }

    .camera-box{
        width:100%;
        aspect-ratio:16 / 9;
        min-height:0;
        height:auto;
        border-radius:20px;
    }

    #cameraPreview{
        border-radius:20px;
    }

    .camera-controls{
        gap:12px;
    }

    .camera-controls button{
        min-height:58px;
        padding:14px 8px;
        font-size:15px;
    }

    .streaming-buttons{
        grid-template-columns:1fr;
    }

}

</style>

</head>

</header>


<main class="container">

        <div class="camera-controls">

                            stroke-linejoin="round"/>

                Camera

            <button

                type="button">

                            height="12"

                        <path

    <section class="stream-form">

        <!-- CATEGORY -->

                <option value="Technology">

  </div>
          <!-- DESCRIPTION -->

        <div class="form-field">

<script>

/* =========================================
   PROFILE DATA
========================================= */

let savedProfile = {};

try {

    const profileData =
        localStorage.getItem("canvasProfile");

    if(profileData){

        savedProfile =
            JSON.parse(profileData) || {};

    }

}catch(error){

    console.warn(
        "Canvas profile could not be loaded.",
        error
    );

    savedProfile = {};

}


/* =========================================
   CREATOR NAME
========================================= */

const creatorName =
    document.getElementById("creatorName");

if(creatorName){

    const name =
        savedProfile.name ||
        savedProfile.username ||
        "";

    if(name){

        creatorName.textContent =
            "Streaming as " + name;

    }

}


/* =========================================
   PROFILE PHOTO
========================================= */

const profileImage =
    savedProfile.photo ||
    savedProfile.profileImage ||
    savedProfile.profilePhoto ||
    savedProfile.image ||
    "";


const topProfileImage =
    document.getElementById("topProfileImage");

const topProfileFallback =
    document.getElementById("topProfileFallback");

const bottomProfileImage =
    document.getElementById("bottomProfileImage");

const bottomProfileFallback =
    document.getElementById("bottomProfileFallback");


if(profileImage){

    if(topProfileImage){

        topProfileImage.src =
            profileImage;

        topProfileImage.style.display =
            "block";

    }

    if(topProfileFallback){

        topProfileFallback.style.display =
            "none";

    }

    if(bottomProfileImage){

        bottomProfileImage.src =
            profileImage;

        bottomProfileImage.style.display =
            "block";

    }

    if(bottomProfileFallback){

        bottomProfileFallback.style.display =
            "none";

    }

}


/* =========================================
   CAMERA / MICROPHONE
========================================= */

const cameraButton =
    document.getElementById("cameraButton");

const cameraPreview =
    document.getElementById("cameraPreview");

const cameraMessage =
    document.getElementById("cameraMessage");

const permissionMessage =
    document.getElementById("permissionMessage");

const micButton =
    document.getElementById("micButton");


let cameraStream = null;

let microphoneStream = null;


function cameraSupported(){

    return !!(
        navigator.mediaDevices &&
        typeof navigator.mediaDevices.getUserMedia ===
        "function"
    );

}


function microphoneSupported(){

    return !!(
        navigator.mediaDevices &&
        typeof navigator.mediaDevices.getUserMedia ===
        "function"
    );

}


/* =========================================
   CAMERA BUTTON
========================================= */

if(cameraButton){

    cameraButton.addEventListener(
        "click",
        async function(){

            if(cameraStream){

                cameraStream
                    .getTracks()
                    .forEach(function(track){

                        track.stop();

                    });

                cameraStream = null;

                cameraPreview.pause();

                cameraPreview.srcObject = null;

                cameraPreview.style.display =
                    "none";

                cameraMessage.style.display =
                    "block";

                cameraButton.classList.remove(
                    "active"
                );

                permissionMessage.textContent =
                    "Camera turned off.";

                return;

            }


            if(!cameraSupported()){

                permissionMessage.textContent =
                    "Camera access is not supported by this browser.";

                return;

            }


            try{

                cameraStream =
                    await navigator.mediaDevices
                        .getUserMedia({

                            video:{
                                facingMode:{
                                    ideal:"user"
                                },

                                width:{
                                    ideal:1280,
                                    min:640
                                },

                                height:{
                                    ideal:720,
                                    min:360
                                },

                                frameRate:{
                                    ideal:30,
                                    max:30
                                }
                            },

                            audio:false

                        });


                /* =================================
                   APPLY BEST AVAILABLE CAMERA QUALITY
                ================================= */

                const videoTrack =
                    cameraStream.getVideoTracks()[0];

                if(videoTrack){

                    try{

                        const capabilities =
                            videoTrack.getCapabilities();

                        const advancedConstraints = {};


                        if(
                            capabilities.width &&
                            capabilities.width.max >= 1280
                        ){

                            advancedConstraints.width = 1280;

                        }


                        if(
                            capabilities.height &&
                            capabilities.height.max >= 720
                        ){

                            advancedConstraints.height = 720;

                        }


                        if(
                            capabilities.frameRate &&
                            capabilities.frameRate.max >= 30
                        ){

                            advancedConstraints.frameRate = 30;

                        }


                        if(
                            Object.keys(
                                advancedConstraints
                            ).length
                        ){

                            await videoTrack.applyConstraints(
                                advancedConstraints
                            );

                        }

                    }catch(error){

                        console.warn(
                            "Could not apply advanced camera settings:",
                            error
                        );

                    }

                }


                cameraPreview.srcObject =
                    cameraStream;

                cameraPreview.muted = true;

                cameraPreview.playsInline = true;

                cameraPreview.style.display =
                    "block";

                await cameraPreview.play();

                cameraMessage.style.display =
                    "none";

                cameraButton.classList.add(
                    "active"
                );

                permissionMessage.textContent =
                    "Camera is ready.";

            }catch(error){

                console.error(
                    "Camera error:",
                    error
                );

                cameraStream = null;

                permissionMessage.textContent =
                    error.name === "NotAllowedError"
                        ? "Camera permission was denied."
                        : error.name === "NotFoundError"
                        ? "No camera was found."
                        : error.name === "NotReadableError"
                        ? "Camera is already being used."
                        : "Unable to start the camera.";

            }

        }
    );

}


/* =========================================
   MICROPHONE BUTTON
========================================= */

if(micButton){

    micButton.addEventListener(
        "click",
        async function(){

            if(microphoneStream){

                microphoneStream
                    .getTracks()
                    .forEach(function(track){

                        track.stop();

                    });

                microphoneStream = null;

                micButton.classList.remove(
                    "active"
                );

                permissionMessage.textContent =
                    "Microphone turned off.";

                return;

            }


            if(!microphoneSupported()){

                permissionMessage.textContent =
                    "Microphone access is not supported.";

                return;

            }


            try{

                microphoneStream =
                    await navigator.mediaDevices
                        .getUserMedia({

                            audio:{

                                echoCancellation:{
                                    ideal:true
                                },

                                noiseSuppression:{
                                    ideal:true
                                },

                                autoGainControl:{
                                    ideal:true
                                },

                                channelCount:{
                                    ideal:2
                                },

                                sampleRate:{
                                    ideal:48000
                                },

                                sampleSize:{
                                    ideal:16
                                }

                            },

                            video:false

                        });


                micButton.classList.add(
                    "active"
                );

                permissionMessage.textContent =
                    "Microphone is ready.";

            }catch(error){

                console.error(
                    "Microphone error:",
                    error
                );

                microphoneStream = null;

                permissionMessage.textContent =
                    error.name === "NotAllowedError"
                        ? "Microphone permission was denied."
                        : error.name === "NotFoundError"
                        ? "No microphone was found."
                        : error.name === "NotReadableError"
                        ? "Microphone is already being used."
                        : "Unable to start the microphone.";

            }

        }
    );

}
  /* =========================================
   THUMBNAIL
========================================= */

const thumbnailInput =
    document.getElementById("thumbnailInput");

const thumbnailPreview =
    document.getElementById("thumbnailPreview");

const thumbnailImage =
    document.getElementById("thumbnailImage");


if(thumbnailInput){

    thumbnailInput.addEventListener(
        "change",
        function(){

            const file =
                thumbnailInput.files &&
                thumbnailInput.files[0];

            if(!file){

                thumbnailPreview.style.display =
                    "none";

                thumbnailImage.src = "";

                return;

            }


            if(
                !file.type ||
                !file.type.startsWith("image/")
            ){

                thumbnailInput.value = "";

                thumbnailPreview.style.display =
                    "none";

                return;

            }


            const reader =
                new FileReader();

            reader.onload =
                function(event){

                    thumbnailImage.src =
                        event.target.result;

                    thumbnailPreview.style.display =
                        "block";

                };

            reader.readAsDataURL(file);

        }
    );

}


/* =========================================
   STREAM ELEMENTS
========================================= */

const streamTitle =
    document.getElementById("streamTitle");

const category =
    document.getElementById("category");

const description =
    document.getElementById("description");

const startStreamingButton =
    document.getElementById(
        "startStreamingButton"
    );

const stopStreamingButton =
    document.getElementById(
        "stopStreamingButton"
    );

const streamStatus =
    document.getElementById(
        "streamStatus"
    );


let isStreaming = false;


/* =========================================
   START STREAMING
========================================= */

if(startStreamingButton){

    startStreamingButton.addEventListener(
        "click",
        function(){

            if(isStreaming){
                return;
            }


            const title =
                streamTitle
                    ? streamTitle.value.trim()
                    : "";


            if(!title){

                alert(
                    "Please enter a stream title."
                );

                if(streamTitle){
                    streamTitle.focus();
                }

                return;

            }


            const streamData = {

                title:title,

                creator:
                    savedProfile.name ||
                    savedProfile.username ||
                    "Canvas Creator",

                username:
                    savedProfile.username ||
                    "",

                profilePhoto:
                    profileImage,

                category:
                    category
                        ? category.value
                        : "Gaming",

                description:
                    description
                        ? description.value.trim()
                        : "",

                thumbnail:
                    thumbnailImage
                        ? thumbnailImage.src
                        : "",

                cameraEnabled:
                    !!cameraStream,

                microphoneEnabled:
                    !!microphoneStream,

                startedAt:
                    new Date().toISOString()

            };


            try{

                localStorage.setItem(
                    "canvasActiveStream",
                    JSON.stringify(streamData)
                );

            }catch(error){

                console.warn(
                    "Could not save stream.",
                    error
                );

            }


            isStreaming = true;

            startStreamingButton.disabled =
                true;


            if(stopStreamingButton){

                stopStreamingButton.classList
                    .remove("hidden");

                stopStreamingButton.disabled =
                    false;

            }


            if(streamStatus){

                streamStatus.textContent =
                    "🔴 You are now live.";

                streamStatus.style.color =
                    "#9b2c2c";

            }

        }
    );

}


/* =========================================
   STOP STREAMING
========================================= */

if(stopStreamingButton){

    stopStreamingButton.addEventListener(
        "click",
        function(){

            if(!isStreaming){
                return;
            }


            isStreaming = false;


            /* STOP CAMERA */

            if(cameraStream){

                cameraStream
                    .getTracks()
                    .forEach(function(track){

                        track.stop();

                    });

                cameraStream = null;

            }


            /* STOP MICROPHONE */

            if(microphoneStream){

                microphoneStream
                    .getTracks()
                    .forEach(function(track){

                        track.stop();

                    });

                microphoneStream = null;

            }


            /* RESET VIDEO */

            if(cameraPreview){

                cameraPreview.pause();

                cameraPreview.srcObject =
                    null;

                cameraPreview.style.display =
                    "none";

            }


            if(cameraMessage){

                cameraMessage.style.display =
                    "block";

            }


            /* RESET CAMERA */

            if(cameraButton){

                cameraButton.classList.remove(
                    "active"
                );

            }


            /* RESET MICROPHONE */

            if(micButton){

                micButton.classList.remove(
                    "active"
                );

            }


            /* RESET BUTTONS */

            if(startStreamingButton){

                startStreamingButton.disabled =
                    false;

            }


            stopStreamingButton.classList.add(
                "hidden"
            );


            if(streamStatus){

                streamStatus.textContent =
                    "Stream ended.";

                streamStatus.style.color =
                    "#8a6b58";

            }


            try{

                localStorage.removeItem(
                    "canvasActiveStream"
                );

            }catch(error){

                console.warn(
                    "Could not clear stream.",
                    error
                );

            }

        }
    );

}


/* =========================================
   KEEP PROFILE ICON UPDATED
========================================= */

function updateProfileIcons(){

    let currentProfile = {};

    try{

        const data =
            localStorage.getItem(
                "canvasProfile"
            );

        if(data){

            currentProfile =
                JSON.parse(data) || {};

        }

    }catch(error){

        currentProfile = {};

    }


    const currentPhoto =
        currentProfile.photo ||
        currentProfile.profileImage ||
        currentProfile.profilePhoto ||
        currentProfile.image ||
        "";


    const topImage =
        document.getElementById(
            "topProfileImage"
        );

    const topFallback =
        document.getElementById(
            "topProfileFallback"
        );

    const bottomImage =
        document.getElementById(
            "bottomProfileImage"
        );

    const bottomFallback =
        document.getElementById(
            "bottomProfileFallback"
        );


    if(currentPhoto){

        if(topImage){

            topImage.src =
                currentPhoto;

            topImage.style.display =
                "block";

        }

        if(topFallback){

            topFallback.style.display =
                "none";

        }

        if(bottomImage){

            bottomImage.src =
                currentPhoto;

            bottomImage.style.display =
                "block";

        }

        if(bottomFallback){

            bottomFallback.style.display =
                "none";

        }

    }else{

        if(topImage){

            topImage.src = "";

            topImage.style.display =
                "none";

        }

        if(topFallback){

            topFallback.style.display =
                "flex";

        }

        if(bottomImage){

            bottomImage.src = "";

            bottomImage.style.display =
                "none";

        }

        if(bottomFallback){

            bottomFallback.style.display =
                "flex";

        }

    }

}


/* =========================================
   UPDATE WHEN PAGE BECOMES VISIBLE AGAIN
========================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(!document.hidden){

            updateProfileIcons();

        }

    }
);


/* =========================================
   UPDATE PROFILE WHEN RETURNING TO PAGE
========================================= */

window.addEventListener(
    "pageshow",
    function(){

        updateProfileIcons();

    }
);


/* =========================================
   PAGE CLEANUP
========================================= */

window.addEventListener(
    "pagehide",
    function(){

        if(cameraStream){

            cameraStream
                .getTracks()
                .forEach(function(track){

                    track.stop();

                });

            cameraStream = null;

        }


        if(microphoneStream){

            microphoneStream
                .getTracks()
                .forEach(function(track){

                    track.stop();

                });

            microphoneStream = null;

        }

    }
);


/* =========================================
   INITIAL PROFILE ICON UPDATE
========================================= */

updateProfileIcons();

</script>
