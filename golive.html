<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Canvas - Go Live</title>

<link
    rel="stylesheet"
    href="style.css"
>

<style>

/* =========================================
   GO LIVE PAGE
========================================= */

.go-live-page{
    width:100%;
    max-width:900px;
    margin:0 auto;
    padding:20px 16px 110px;
    box-sizing:border-box;
}


/* =========================================
   TOP BAR
========================================= */

.go-live-top{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.go-live-logo{
    font-size:24px;
    font-weight:800;
}

.top-profile{
    width:40px;
    height:40px;
    border-radius:50%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
}

.top-profile img,
.top-profile svg{
    width:100%;
    height:100%;
    object-fit:cover;
}


/* =========================================
   DEFAULT AVATAR
========================================= */

.default-avatar{
    width:100%;
    height:100%;
    display:block;
}


/* =========================================
   CAMERA BOX
========================================= */

.camera-box{
    width:100%;
    max-width:900px;
    height:500px;
    margin:0 auto 18px;
    border-radius:18px;
    overflow:hidden;
    position:relative;
    background:#111;
    display:flex;
    align-items:center;
    justify-content:center;
}

#cameraPreview{
    width:100%;
    height:100%;
    object-fit:cover;
    background:#111;
    display:block;
}

.camera-message{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    text-align:center;
    pointer-events:none;
    z-index:2;
}


/* =========================================
   MEDIA CONTROLS
========================================= */

.media-controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:22px;
}

.media-controls button{
    border:none;
    cursor:pointer;
    padding:11px 16px;
    border-radius:12px;
    font-size:14px;
    font-weight:700;
}

.media-controls button:disabled{
    opacity:.55;
    cursor:not-allowed;
}


/* =========================================
   FORM
========================================= */

.stream-form{
    width:100%;
}

.stream-form-group{
    margin-bottom:16px;
}

.stream-form-group label{
    display:block;
    margin-bottom:7px;
    font-weight:700;
}

.stream-form-group input,
.stream-form-group select,
.stream-form-group textarea{
    width:100%;
    box-sizing:border-box;
    border-radius:12px;
    padding:13px;
    border:1px solid #ddd;
    outline:none;
    font:inherit;
    background:white;
}

.stream-form-group textarea{
    min-height:110px;
    resize:vertical;
}


/* =========================================
   THUMBNAIL
========================================= */

.thumbnail-box{
    width:100%;
    margin-top:8px;
}

#choosePhotoButton{
    width:100%;
    min-height:55px;
    border:2px dashed #ccc;
    border-radius:14px;
    background:#fafafa;
    font-weight:800;
    cursor:pointer;
}

#thumbnailInput{
    display:none;
}

#thumbnailPreview{
    display:none;
    width:100%;
    margin-top:10px;
    border-radius:14px;
    overflow:hidden;
    cursor:pointer;
}

#thumbnailImage{
    width:100%;
    max-height:300px;
    object-fit:cover;
    display:block;
}


/* =========================================
   STREAM BUTTONS
========================================= */

.stream-actions{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:20px;
}

#startStreamingButton,
#stopStreamingButton{
    width:100%;
    border:none;
    border-radius:14px;
    padding:15px;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
}

#stopStreamingButton{
    display:none;
}


/* =========================================
   STATUS
========================================= */

#streamStatus,
#permissionMessage,
#webrtcStatus{
    text-align:center;
    margin-top:10px;
    font-size:14px;
}

#permissionMessage{
    min-height:18px;
}


/* =========================================
   BOTTOM NAV
========================================= */

.bottom-nav a.active::before,
.bottom-nav a.active::after{
    content:none !important;
    display:none !important;
}

.bottom-nav-icon{
    display:flex;
    align-items:center;
    justify-content:center;
}

.explore-icon{
    width:23px;
    height:23px;
}

.explore-icon circle,
.explore-icon path{
    stroke:currentColor;
}

.bottom-profile{
    width:24px;
    height:24px;
    border-radius:50%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
}

.bottom-profile img,
.bottom-profile svg{
    width:100%;
    height:100%;
    object-fit:cover;
}

</style>

</head>

                    Music

<!-- =========================================
     SOCKET.IO
========================================= -->

<script
    src="https://cdn.socket.io/4.8.1/socket.io.min.js"
></script>


<script>

/* =========================================
   CANVAS GO LIVE
   CORE CONFIGURATION
========================================= */

const API_BASE =
    "https://canvas-kh9p.onrender.com";

const SOCKET_URL =
    API_BASE;


/* =========================================
   MEDIA STATE
========================================= */

let canvasStream =
    null;

let cameraEnabled =
    false;

let microphoneEnabled =
    false;

let currentFacingMode =
    "user";

let isStreaming =
    false;


/* =========================================
   STREAM STATE
========================================= */

let currentStreamId =
    null;

let broadcasterRoom =
    null;

let socket =
    null;

let streamHeartbeat =
    null;


/* =========================================
   PEER CONNECTIONS
========================================= */

const peerConnections =
    {};


/* =========================================
   THUMBNAIL
========================================= */

let selectedThumbnail =
    "";


/* =========================================
   GET DOM ELEMENTS
========================================= */

const cameraPreview =
    document.getElementById(
        "cameraPreview"
    );

const cameraMessage =
    document.getElementById(
        "cameraMessage"
    );

const permissionMessage =
    document.getElementById(
        "permissionMessage"
    );

const webrtcStatus =
    document.getElementById(
        "webrtcStatus"
    );

const streamStatus =
    document.getElementById(
        "streamStatus"
    );

const streamTitle =
    document.getElementById(
        "streamTitle"
    );

const category =
    document.getElementById(
        "category"
    );

const description =
    document.getElementById(
        "description"
    );

const thumbnailInput =
    document.getElementById(
        "thumbnailInput"
    );

const thumbnailPreview =
    document.getElementById(
        "thumbnailPreview"
    );

const thumbnailImage =
    document.getElementById(
        "thumbnailImage"
    );

const choosePhotoButton =
    document.getElementById(
        "choosePhotoButton"
    );

const cameraButton =
    document.getElementById(
        "cameraButton"
    );

const micButton =
    document.getElementById(
        "micButton"
    );

const switchCameraButton =
    document.getElementById(
        "switchCameraButton"
    );

const startStreamingButton =
    document.getElementById(
        "startStreamingButton"
    );

const stopStreamingButton =
    document.getElementById(
        "stopStreamingButton"
    );


/* =========================================
   AUTH TOKEN
========================================= */

function getAuthToken(){

    return (
        localStorage.getItem(
            "canvasAuthToken"
        ) ||

        localStorage.getItem(
            "canvasToken"
        ) ||

        localStorage.getItem(
            "authToken"
        ) ||

        localStorage.getItem(
            "token"
        ) ||

        ""
    );

}


/* =========================================
   AUTH HEADERS
========================================= */

function authHeaders(){

    const headers = {

        "Accept":
            "application/json",

        "Content-Type":
            "application/json"

    };


    const token =
        getAuthToken();


    if(token){

        headers.Authorization =
            "Bearer " + token;

    }


    return headers;

}


/* =========================================
   STATUS HELPERS
========================================= */

function setStatus(
    message,
    isError = false
){

    if(!streamStatus){
        return;
    }


    streamStatus.textContent =
        message || "";


    streamStatus.style.color =
        isError
            ? "#9A3026"
            : "#806B5D";

}


function setPermissionMessage(
    message
){

    if(permissionMessage){

        permissionMessage.textContent =
            message || "";

    }

}


function setWebRTCStatus(
    message
){

    if(webrtcStatus){

        webrtcStatus.textContent =
            message || "";

    }

}


/* =========================================
   DEFAULT PROFILE SVG
========================================= */

function defaultAvatarSVG(){

    return `
        <svg
            class="default-avatar"
            viewBox="0 0 64 64"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
        >

            <circle
                cx="32"
                cy="32"
                r="32"
                fill="#eeeeee"
            />

            <circle
                cx="32"
                cy="24"
                r="10"
                fill="#999999"
            />

            <path
                d="M14 54c1.8-11 8.8-17 18-17s16.2 6 18 17"
                fill="#999999"
            />

        </svg>
    `;

}


/* =========================================
   PROFILE IMAGE FROM LOCAL STORAGE
========================================= */

function getStoredProfileImage(){

    let image =
        localStorage.getItem(
            "canvasProfilePicture"
        );


    if(!image){

        image =
            localStorage.getItem(
                "profilePicture"
            );

    }


    if(!image){

        try{

            const profile =
                JSON.parse(
                    localStorage.getItem(
                        "canvasProfile"
                    ) || "null"
                );


            if(profile){

                image =
                    profile.profile_picture ||
                    profile.profilePicture ||
                    profile.profileImage ||
                    profile.photo ||
                    profile.avatar ||
                    profile.image ||
                    "";

            }

        }catch(error){

            console.log(
                "Profile storage read failed:",
                error
            );

        }

    }


    return image || "";

}


/* =========================================
   SAVE PROFILE IMAGE
========================================= */

function saveProfileImage(
    image
){

    if(!image){
        return;
    }


    try{

        localStorage.setItem(
            "canvasProfilePicture",
            image
        );

        localStorage.setItem(
            "profilePicture",
            image
        );

    }catch(error){

        console.log(
            "Profile image cache failed:",
            error
        );

    }

}


/* =========================================
   APPLY PROFILE IMAGE
========================================= */

function applyProfileImage(
    element,
    image
){

    if(!element){
        return;
    }


    if(image){

        element.innerHTML = `
            <img
                src="${image}"
                alt="Profile"
            >
        `;


        const img =
            element.querySelector(
                "img"
            );


        if(img){

            img.onerror =
                function(){

                    element.innerHTML =
                        defaultAvatarSVG();

                };

        }


    }else{

        element.innerHTML =
            defaultAvatarSVG();

    }

}


/* =========================================
   UPDATE BOTH PROFILE ICONS
========================================= */

function updateGoLiveProfile(){

    const image =
        getStoredProfileImage();


    applyProfileImage(
        document.getElementById(
            "topProfileIcon"
        ),
        image
    );


    applyProfileImage(
        document.getElementById(
            "bottomProfileIcon"
        ),
        image
    );

}


/* =========================================
   LOAD PROFILE FROM SERVER
========================================= */

async function loadGoLiveProfile(){

    updateGoLiveProfile();


    const token =
        getAuthToken();


    if(!token){
        return;
    }


    /* -------------------------------------
       /api/me
    ------------------------------------- */

    try{

        const response =
            await fetch(
                API_BASE + "/api/me",
                {
                    method:"GET",
                    headers:authHeaders(),
                    cache:"no-store"
                }
            );


        if(response.ok){

            const data =
                await response.json();


            const user =
                data.user ||
                data.data ||
                data;


            if(user){

                try{

                    localStorage.setItem(
                        "canvasCurrentUser",
                        JSON.stringify(
                            user
                        )
                    );

                }catch(error){}


                const image =
                    user.profile_picture ||
                    user.profilePicture ||
                    user.profileImage ||
                    user.photo ||
                    user.avatar ||
                    user.image ||
                    "";


                if(image){

                    saveProfileImage(
                        image
                    );

                }

            }

        }

    }catch(error){

        console.log(
            "/api/me unavailable:",
            error
        );

    }


    /* -------------------------------------
       /api/profile
    ------------------------------------- */

    try{

        const response =
            await fetch(
                API_BASE + "/api/profile",
                {
                    method:"GET",
                    headers:authHeaders(),
                    cache:"no-store"
                }
            );


        if(response.ok){

            const data =
                await response.json();


            const profile =
                data.profile ||
                data.data ||
                data.user ||
                data;


            if(profile){

                try{

                    localStorage.setItem(
                        "canvasProfile",
                        JSON.stringify(
                            profile
                        )
                    );

                }catch(error){}


                const image =
                    profile.profile_picture ||
                    profile.profilePicture ||
                    profile.profileImage ||
                    profile.photo ||
                    profile.avatar ||
                    profile.image ||
                    "";


                if(image){

                    saveProfileImage(
                        image
                    );

                }

            }

        }

    }catch(error){

        console.log(
            "/api/profile unavailable:",
            error
        );

    }


    updateGoLiveProfile();

}


/* =========================================
   PROFILE INITIAL LOAD
========================================= */

updateGoLiveProfile();

loadGoLiveProfile();

  </script>
  <script>

/* =========================================
   THUMBNAIL
========================================= */

if(choosePhotoButton && thumbnailInput){

    choosePhotoButton.addEventListener(
        "click",
        function(event){

            event.preventDefault();

            thumbnailInput.click();

        }
    );

}


if(thumbnailInput){

    thumbnailInput.addEventListener(
        "change",
        function(){

            const file =
                thumbnailInput.files &&
                thumbnailInput.files[0];


            if(!file){
                return;
            }


            if(!file.type.startsWith("image/")){

                setStatus(
                    "Please choose an image.",
                    true
                );

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                function(event){

                    selectedThumbnail =
                        event.target.result;


                    if(thumbnailImage){

                        thumbnailImage.src =
                            selectedThumbnail;

                    }


                    if(thumbnailPreview){

                        thumbnailPreview.style.display =
                            "block";

                    }


                    if(choosePhotoButton){

                        choosePhotoButton.style.display =
                            "none";

                    }


                    setStatus(
                        "Thumbnail selected."
                    );

                };


            reader.onerror =
                function(){

                    setStatus(
                        "Could not load thumbnail.",
                        true
                    );

                };


            reader.readAsDataURL(file);

        }
    );

}


if(thumbnailPreview){

    thumbnailPreview.addEventListener(
        "click",
        function(){

            if(thumbnailInput){

                thumbnailInput.click();

            }

        }
    );

}


/* =========================================
   CAMERA BUTTON TEXT
========================================= */

function updateCameraButton(){

    if(!cameraButton){
        return;
    }


    cameraButton.textContent =
        cameraEnabled
            ? "📷 Camera On"
            : "📷 Camera Off";

}


/* =========================================
   MICROPHONE BUTTON TEXT
========================================= */

function updateMicButton(){

    if(!micButton){
        return;
    }


    micButton.textContent =
        microphoneEnabled
            ? "🎙️ Microphone On"
            : "🎙️ Microphone Off";

}


/* =========================================
   VIDEO PREVIEW
========================================= */

async function updateCameraPreview(){

    if(!cameraPreview){
        return;
    }


    cameraPreview.autoplay =
        true;

    cameraPreview.muted =
        true;

    cameraPreview.playsInline =
        true;


    cameraPreview.srcObject =
        canvasStream || null;


    if(canvasStream){

        try{

            await cameraPreview.play();

        }catch(error){

            console.log(
                "Video preview play:",
                error
            );

        }

    }

}


/* =========================================
   GET CAMERA + MICROPHONE
========================================= */

async function startCameraAndMicrophone(
    wantCamera,
    wantMicrophone
){

    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        setStatus(
            "Camera and microphone are not supported here.",
            true
        );

        return null;

    }


    /*
     * Default values.
     */

    if(typeof wantCamera !== "boolean"){

        wantCamera =
            true;

    }


    if(typeof wantMicrophone !== "boolean"){

        wantMicrophone =
            true;

    }


    try{

        setPermissionMessage(
            "Allow camera and microphone access..."
        );


        /*
         * KEEP THE ORIGINAL QUALITY.
         *
         * 1280 × 720
         * 30 FPS
         */

        const constraints = {

            video:
                wantCamera
                    ? {
                        facingMode:{
                            ideal:
                                currentFacingMode
                        },

                        width:{
                            ideal:1280
                        },

                        height:{
                            ideal:720
                        },

                        frameRate:{
                            ideal:30,
                            max:30
                        }
                    }
                    : false,

            audio:
                wantMicrophone
                    ? {
                        echoCancellation:true,
                        noiseSuppression:true,
                        autoGainControl:true
                    }
                    : false

        };


        const newStream =
            await navigator.mediaDevices
                .getUserMedia(
                    constraints
                );


        /*
         * New stream worked.
         * Now replace the old tracks.
         */

        if(canvasStream){

            canvasStream
                .getTracks()
                .forEach(
                    function(track){

                        track.stop();

                    }
                );

        }


        canvasStream =
            newStream;


        const videoTrack =
            canvasStream
                .getVideoTracks()[0];


        const audioTrack =
            canvasStream
                .getAudioTracks()[0];


        cameraEnabled =
            !!videoTrack;


        microphoneEnabled =
            !!audioTrack;


        if(videoTrack){

            videoTrack.enabled =
                cameraEnabled;

        }


        if(audioTrack){

            audioTrack.enabled =
                microphoneEnabled;

        }


        await updateCameraPreview();


        updateCameraButton();

        updateMicButton();


        setPermissionMessage("");

        setWebRTCStatus(
            "Camera and microphone ready."
        );


        return canvasStream;


    }catch(error){

        console.error(
            "getUserMedia failed:",
            error
        );


        setPermissionMessage(
            "Please allow camera and microphone permission."
        );


        setWebRTCStatus(
            "Camera or microphone permission failed."
        );


        setStatus(
            "Camera/microphone permission was not granted.",
            true
        );


        return null;

    }

}


/* =========================================
   CAMERA TOGGLE
========================================= */

let cameraBusy =
    false;


async function toggleCamera(){

    if(cameraBusy){
        return;
    }


    cameraBusy =
        true;


    try{

        /*
         * No stream yet:
         * request the camera.
         */

        if(!canvasStream){

            const result =
                await startCameraAndMicrophone(
                    true,
                    false
                );


            if(result){

                cameraEnabled =
                    true;

                updateCameraButton();

            }


            return;

        }


        let videoTrack =
            canvasStream
                .getVideoTracks()[0];


        /*
         * If camera track disappeared,
         * create it again.
         */

        if(!videoTrack){

            const result =
                await startCameraAndMicrophone(
                    true,
                    microphoneEnabled
                );


            if(result){

                cameraEnabled =
                    true;

                updateCameraButton();

            }


            return;

        }


        /*
         * Directly enable / disable
         * the actual video track.
         */

        videoTrack.enabled =
            !videoTrack.enabled;


        cameraEnabled =
            videoTrack.enabled;


        updateCameraButton();


        setWebRTCStatus(
            cameraEnabled
                ? "Camera is on."
                : "Camera is off."
        );


    }catch(error){

        console.error(
            "Camera toggle:",

        );


        setStatus(
            "Could not change camera.",

        );

    }finally{

/* =========================================
   MICROPHONE TOGGLE
========================================= */

let microphoneBusy =
    false;


async function toggleMicrophone(){

    if(microphoneBusy){
        return;
    }


    microphoneBusy =
        true;


    try{

        /*
         * No stream yet:
         * request microphone.
         */

        if(!canvasStream){

            const result =
                await startCameraAndMicrophone(
                    false,
                    true
                );


            if(result){

                microphoneEnabled =
                    true;

                updateMicButton();

            }


            return;

        }


        let audioTrack =
            canvasStream
                .getAudioTracks()[0];


        /*
         * If microphone track doesn't exist,
         * request one separately.
         */

        if(!audioTrack){

            const micStream =
                await navigator.mediaDevices
                    .getUserMedia({

                        audio:{
                            echoCancellation:true,
                            noiseSuppression:true,
                            autoGainControl:true
                        },

                        video:false

                    });


            const newAudioTrack =
                micStream
                    .getAudioTracks()[0];


            if(newAudioTrack){

                newAudioTrack.enabled =
                    true;


                canvasStream.addTrack(
                    newAudioTrack
                );


                microphoneEnabled =
                    true;


                updateMicButton();


                setWebRTCStatus(
                    "Microphone is on."
                );

            }


            return;

        }


        /*
         * Directly enable / disable
         * the real microphone track.
         */

        audioTrack.enabled =
            !audioTrack.enabled;


        microphoneEnabled =
            audioTrack.enabled;


        updateMicButton();


        setWebRTCStatus(
            microphoneEnabled
                ? "Microphone is on."
                : "Microphone is off."
        );


    }catch(error){

        console.error(
            "Microphone toggle:",
            error
        );


        setStatus(
            "Could not change microphone.",
            true
        );

    }finally{

        microphoneBusy =
            false;

    }

}


/* =========================================
   SWITCH CAMERA
   FRONT ↔ BACK
========================================= */

let switchCameraBusy =
    false;


async function switchCamera(){

    if(switchCameraBusy){
        return;
    }


    switchCameraBusy =
        true;


    try{

        /*
         * Camera hasn't started yet.
         * Start the front camera first.
         */

        if(!canvasStream){

            currentFacingMode =
                "user";


            const result =
                await startCameraAndMicrophone(
                    true,
                    microphoneEnabled
                );


            if(result){

                cameraEnabled =
                    true;

                updateCameraButton();

            }


            return;

        }


        const oldVideoTrack =
            canvasStream
                .getVideoTracks()[0];


        if(!oldVideoTrack){

            currentFacingMode =
                "user";


            const result =
                await startCameraAndMicrophone(
                    true,
                    microphoneEnabled
                );


            if(result){

                cameraEnabled =
                    true;

                updateCameraButton();

            }


            return;

        }


        /*
         * Determine next camera.
         */

        const nextFacingMode =
            currentFacingMode === "user"
                ? "environment"
                : "user";


        setWebRTCStatus(
            nextFacingMode === "environment"
                ? "Switching to back camera..."
                : "Switching to front camera..."
        );


        let newCameraStream;


        /*
         * First try exact front/back.
         */

        try{

            newCameraStream =
                await navigator.mediaDevices
                    .getUserMedia({

                        video:{
                            facingMode:{
                                exact:
                                    nextFacingMode
                            },

                            width:{
                                ideal:1280
                            },

                            height:{
                                ideal:720
                            },

                            frameRate:{
                                ideal:30,
                                max:30
                            }
                        },

                        audio:false

                    });

        }catch(error){

            /*
             * Some Android browsers reject
             * exact facingMode.
             *
             * Retry with ideal.
             */

            newCameraStream =
                await navigator.mediaDevices
                    .getUserMedia({

                        video:{
                            facingMode:{
                                ideal:
                                    nextFacingMode
                            },

                            width:{
                                ideal:1280
                            },

                            height:{
                                ideal:720
                            },

                            frameRate:{
                                ideal:30,
                                max:30
                            }
                        },

                        audio:false

                    });

        }


        const newVideoTrack =
            newCameraStream
                .getVideoTracks()[0];


        if(!newVideoTrack){

            newCameraStream
                .getTracks()
                .forEach(
                    function(track){

                        track.stop();

                    }
                );


            throw new Error(
                "No new camera found."
            );

        }


        /*
         * Remove old camera.
         */

        canvasStream.removeTrack(
            oldVideoTrack
        );


        /*
         * Add new camera.
         */

        canvasStream.addTrack(
            newVideoTrack
        );


        /*
         * Stop old camera only after
         * new camera is ready.
         */

        oldVideoTrack.stop();


        currentFacingMode =
            nextFacingMode;


        cameraEnabled =
            true;


        await updateCameraPreview();


        updateCameraButton();


        setWebRTCStatus(
            currentFacingMode === "environment"
                ? "Back camera is active."
                : "Front camera is active."
        );


    }catch(error){

        console.error(
            "Switch camera failed:",
            error
        );


        setStatus(
            "Could not switch camera on this device.",
            true
        );


        setWebRTCStatus(
            "Camera switch failed."
        );

    }finally{

        switchCameraBusy =
            false;

    }

}

 <script>

/* =========================================
   STREAM HELPERS
========================================= */

function createStreamId(){

    return (
        "canvas_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2,10)
    );

}


/* =========================================
   CURRENT USER
========================================= */

function getCurrentUser(){

    try{

        const user =
            JSON.parse(
                localStorage.getItem(
                    "canvasCurrentUser"
                ) || "null"
            );

        if(user){
            return user;
        }

    }catch(error){

        console.log(
            "Current user read failed:",
            error
        );

    }


    try{

        const profile =
            JSON.parse(
                localStorage.getItem(
                    "canvasProfile"
                ) || "null"
            );

        if(profile){
            return profile;
        }

    }catch(error){

        console.log(
            "Profile read failed:",
            error
        );

    }


    return {};

}


/* =========================================
   USERNAME
========================================= */

function getCurrentUsername(){

    const user =
        getCurrentUser();


    return (
        user.username ||
        user.userName ||
        user.name ||
        localStorage.getItem(
            "canvasUsername"
        ) ||
        localStorage.getItem(
            "username"
        ) ||
        "Canvas User"
    );

}


/* =========================================
   PROFILE PICTURE
========================================= */

function getCurrentProfilePicture(){

    return (
        getStoredProfileImage() ||
        ""
    );

}


/* =========================================
   STREAM DATA
========================================= */

function getStreamData(
    streamId
){

    return {

        id:
            streamId,

        streamId:
            streamId,

        title:
            streamTitle
                ? streamTitle.value.trim()
                : "",

        category:
            category
                ? category.value
                : "",

        description:
            description
                ? description.value.trim()
                : "",

        thumbnail:
            selectedThumbnail || "",

        streamer:
            getCurrentUsername(),

        username:
            getCurrentUsername(),

        profilePicture:
            getCurrentProfilePicture(),

        isLive:
            true,

        createdAt:
            new Date().toISOString()

    };

}


/* =========================================
   VALIDATE STREAM
========================================= */

function validateStreamDetails(){

    const title =
        streamTitle
            ? streamTitle.value.trim()
            : "";


    if(!title){

        setStatus(
            "Please enter a stream title.",
            true
        );


        if(streamTitle){

            streamTitle.focus();

        }


        return false;

    }


    return true;

}


/* =========================================
   REGISTER STREAM ON BACKEND
========================================= */

async function registerStreamOnServer(
    streamData
){

    const token =
        getAuthToken();


    if(!token){

        throw new Error(
            "Please log in before starting a stream."
        );

    }


    const response =
        await fetch(
            API_BASE + "/api/streams",
            {
                method:"POST",

                headers:
                    authHeaders(),

                body:
                    JSON.stringify(
                        streamData
                    )
            }
        );


    let data = {};


    try{

        data =
            await response.json();

    }catch(error){

        data = {};

    }


    if(!response.ok){

        throw new Error(
            data.message ||
            data.error ||
            "Could not register stream."
        );

    }


    return (
        data.stream ||
        data.data ||
        data
    );

}


/* =========================================
   LOCAL LIVE STREAM CACHE
========================================= */

function saveLocalLiveStream(
    streamData
){

    try{

        localStorage.setItem(
            "canvasActiveStream",
            JSON.stringify(
                streamData
            )
        );


        localStorage.setItem(
            "canvasLiveStream",
            JSON.stringify(
                streamData
            )
        );

    }catch(error){

        console.log(
            "Local stream cache failed:",
            error
        );

    }

}


/* =========================================
   REMOVE LOCAL LIVE STREAM
========================================= */

function removeLocalLiveStream(){

    try{

        localStorage.removeItem(
            "canvasActiveStream"
        );


        localStorage.removeItem(
            "canvasLiveStream"
        );

    }catch(error){

        console.log(
            "Local stream cleanup failed:",
            error
        );

    }

}


/* =========================================
   SOCKET CONNECTION
========================================= */

function connectBroadcasterSocket(
    streamId
){

    broadcasterRoom =
        "stream_" + streamId;


    if(typeof io !== "function"){

        console.warn(
            "Socket.IO is not loaded."
        );

        return;

    }


    try{

        socket =
            io(
                SOCKET_URL,
                {
                    transports:[
                        "websocket",
                        "polling"
                    ],

                    reconnection:true,

                    reconnectionAttempts:
                        Infinity
                }
            );


        socket.on(
            "connect",
            function(){

                console.log(
                    "Canvas broadcaster connected."
                );


                socket.emit(
                    "join-stream",
                    {
                        streamId:
                            streamId,

                        room:
                            broadcasterRoom,

                        role:
                            "broadcaster"
                    }
                );


                socket.emit(
                    "stream-started",
                    {
                        streamId:
                            streamId,

                        room:
                            broadcasterRoom
                    }
                );


                setWebRTCStatus(
                    "Live connection active."
                );

            }
        );


        socket.on(
            "disconnect",
            function(){

                if(isStreaming){

                    setWebRTCStatus(
                        "Connection interrupted. Reconnecting..."
                    );

                }

            }
        );


        socket.on(
            "connect_error",
            function(error){

                console.warn(
                    "Socket connection error:",
                    error
                );

            }
        );


        socket.on(
            "viewer-joined",
            function(data){

                console.log(
                    "Viewer joined:",
                    data
                );

            }
        );


        socket.on(
            "viewer-left",
            function(data){

                console.log(
                    "Viewer left:",
                    data
                );

            }
        );


    }catch(error){

        console.error(
            "Socket connection failed:",
            error
        );

    }

}


/* =========================================
   HEARTBEAT
========================================= */

function startStreamHeartbeat(){

    stopStreamHeartbeat();


    streamHeartbeat =
        setInterval(
            function(){

                if(
                    !isStreaming ||
                    !currentStreamId
                ){

                    return;

                }


                try{

                    localStorage.setItem(
                        "canvasStreamHeartbeat",
                        String(
                            Date.now()
                        )
                    );

                }catch(error){

                    console.log(
                        "Heartbeat failed:",
                        error
                    );

                }

            },
            15000
        );

}


function stopStreamHeartbeat(){

    if(streamHeartbeat){

        clearInterval(
            streamHeartbeat
        );

        streamHeartbeat =
            null;

    }

}


/* =========================================
   START STREAM
========================================= */

let startStreamBusy =
    false;


async function createLiveStream(){

    if(startStreamBusy){
        return;
    }


    if(isStreaming){

        setStatus(
            "Your stream is already live."
        );

        return;

    }


    if(!validateStreamDetails()){
        return;
    }


    startStreamBusy =
        true;


    if(startStreamingButton){

        startStreamingButton.disabled =
            true;

    }


    try{

        const token =
            getAuthToken();


        if(!token){

            throw new Error(
                "Please log in before starting a stream."
            );

        }


        /*
         * Make sure camera exists.
         * Keep microphone available too.
         */

        if(!canvasStream){

            const ready =
                await startCameraAndMicrophone(
                    true,
                    true
                );


            if(!ready){

                throw new Error(
                    "Camera and microphone are unavailable."
                );

            }

        }


        /*
         * Make sure the video track
         * is actually available.
         */

        const videoTrack =
            canvasStream
                .getVideoTracks()[0];


        if(!videoTrack){

            throw new Error(
                "Camera is not available."
            );

        }


        const streamId =
            createStreamId();


        const streamData =
            getStreamData(
                streamId
            );


        setStatus(
            "Starting your stream..."
        );


        /*
         * BACKEND FIRST.
         * Do not mark live until this succeeds.
         */

        const serverStream =
            await registerStreamOnServer(
                streamData
            );


        const confirmedId =
            serverStream.id ||
            serverStream._id ||
            serverStream.streamId ||
            streamId;


        currentStreamId =
            String(
                confirmedId
            );


        streamData.id =
            currentStreamId;


        streamData.streamId =
            currentStreamId;


        streamData.isLive =
            true;


        /*
         * NOW LIVE.
         */

        isStreaming =
            true;


        saveLocalLiveStream(
            streamData
        );


        connectBroadcasterSocket(
            currentStreamId
        );


        startStreamHeartbeat();


        if(startStreamingButton){

            startStreamingButton.style.display =
                "none";

            startStreamingButton.disabled =
                false;

        }


        if(stopStreamingButton){

            stopStreamingButton.style.display =
                "block";

            stopStreamingButton.disabled =
                false;

        }


        setStatus(
            "You are live now."
        );


        setWebRTCStatus(
            "Live connection active."
        );


    }catch(error){

        console.error(
            "Start stream failed:",
            error
        );


        isStreaming =
            false;


        currentStreamId =
            null;


        setStatus(
            error.message ||
            "Could not start stream.",
            true
        );


        if(startStreamingButton){

            startStreamingButton.style.display =
                "block";

            startStreamingButton.disabled =
                false;

        }


        if(stopStreamingButton){

            stopStreamingButton.style.display =
                "none";

            stopStreamingButton.disabled =
                false;

        }

    }finally{

        startStreamBusy =
            false;


        if(startStreamingButton){

            startStreamingButton.disabled =
                false;

        }

    }

}


/* =========================================
   START STREAM BUTTON

if(startStreamingButton){

}

/* =========================================
   END LIVE STREAM
   ONLY THIS BUTTON ENDS THE STREAM
========================================= */

let endStreamBusy = false;


async function endLiveStream(){

    if(endStreamBusy){
        return;
    }


    if(!isStreaming || !currentStreamId){

        setStatus(
            "No active stream to end.",
            true
        );

        return;

    }


    endStreamBusy = true;


    if(stopStreamingButton){

        stopStreamingButton.disabled =
            true;

    }


    const endedStreamId =
        currentStreamId;


    try{

        setStatus(
            "Ending your stream..."
        );


        /*
         * IMPORTANT:
         * The stream is ended ONLY through
         * the explicit End Streaming button.
         */

        const response =
            await fetch(
                API_BASE +
                "/api/streams/" +
                encodeURIComponent(
                    endedStreamId
                ) +
                "/end",
                {
                    method:"PUT",

                    headers:
                        authHeaders()
                }
            );


        let data = {};


        try{

            data =
                await response.json();

        }catch(error){

            data = {};

        }


        if(!response.ok){

            throw new Error(
                data.message ||
                data.error ||
                "Could not end the stream."
            );

        }


        /*
         * Tell connected viewers that
         * the broadcaster explicitly ended.
         */

        if(
            socket &&
            socket.connected
        ){

            socket.emit(
                "stream-ended",
                {
                    streamId:
                        endedStreamId,

                    room:
                        broadcasterRoom
                }
            );

        }


        /*
         * Now the stream is officially ended.
         */

        isStreaming =
            false;


        currentStreamId =
            null;


        stopStreamHeartbeat();


        removeLocalLiveStream();


        if(socket){

            try{

                socket.disconnect();

            }catch(error){

                console.log(
                    "Socket disconnect failed:",
                    error
                );

            }

            socket =
                null;

        }


        if(startStreamingButton){

            startStreamingButton.style.display =
                "block";

            startStreamingButton.disabled =
                false;

        }


        if(stopStreamingButton){

            stopStreamingButton.style.display =
                "none";

            stopStreamingButton.disabled =
                false;

        }


        setWebRTCStatus(
            "Stream ended."
        );


        setStatus(
            "Your stream has ended."
        );


    }catch(error){

        console.error(
            "End stream failed:",
            error
        );


        /*
         * If the backend failed, DO NOT pretend
         * that the stream ended.
         */

        setStatus(
            error.message ||
            "Could not end the stream.",
            true
        );


        if(stopStreamingButton){

            stopStreamingButton.disabled =
                false;

        }

    }finally{

        endStreamBusy =
            false;

    }

}


/* =========================================
   END STREAM BUTTON
========================================= */

if(stopStreamingButton){

    stopStreamingButton.onclick =
        function(event){

            event.preventDefault();
            event.stopPropagation();

            endLiveStream();

        };

}


/* =========================================
   CLEANUP
   DOES NOT END THE STREAM
========================================= */

function cleanupGoLive(){

    stopStreamHeartbeat();


    /*
     * Close any future WebRTC connections.
     * This cleanup must NOT call the backend
     * /end endpoint.
     */

    Object.keys(
        peerConnections
    ).forEach(
        function(key){

            try{

                const peer =
                    peerConnections[key];

                if(peer){

                    peer.close();

                }

            }catch(error){

                console.log(
                    "Peer cleanup failed:",
                    error
                );

            }

        }
    );


    peerConnections =
        {};


    /*
     * Do not call:
     *
     * endLiveStream()
     *
     * here.
     *
     * Leaving the page must NOT end
     * the live stream.
     */

}

   PAGE LEAVE
   STREAM STAYS LIVE
========================================= */

window.addEventListener(
    "pagehide",

        cleanupGoLive();
