<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas - Go Live</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        Canvas
    </div>

    <div class="nav-icons">
        <span>🔍</span>
        <a href="profile.html">👤</a>
    </div>

</header>

<main class="container">

    <section class="go-live-header">

        <h1>🎥 Go Live</h1>

        <p>Start streaming to your audience in seconds.</p>

    </section>

    <section class="camera-section">

        <div class="camera-preview">

            <video id="preview" autoplay muted playsinline></video>

            <div class="camera-placeholder">
                Camera Preview
            </div>

        </div>

    </section>

    <section class="stream-form">

        <label>Stream Title</label>

        <input
            type="text"
            id="streamTitle"
            placeholder="Enter stream title">

        <label>Category</label>

        <select id="category">
            <option>Gaming</option>
            <option>Music</option>
            <option>Sports</option>
            <option>Education</option>
            <option>Technology</option>
        </select>

        <label>Description</label>

        <textarea
            id="description"
            rows="4"
            placeholder="Tell viewers about your stream..."></textarea>

        <label>Thumbnail</label>

        <input type="file" accept="image/*">

        <button class="start-btn">
            🔴 Start Streaming
        </button>

    </section>

</main>

<nav class="bottom-nav">

    <a href="index.html">🏠</a>

    <a href="watch.html">📺</a>

    <a href="go-live.html" class="active">➕</a>

    <a href="profile.html">👤</a>

</nav>

<script src="js/script.js"></script>

</body>
