<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Canvas - Go Live</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================
   GO LIVE PAGE
========================= */

body{
    margin:0;
    padding-bottom:90px;
    background:#FAF9F6;
    color:#4A3728;
}

/* HEADER */

.navbar{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    background:#ffffff;
    border-bottom:2px solid #D4A017;
    box-sizing:border-box;
}

.nav-icons{
    display:flex;
    align-items:center;
    gap:15px;
}

.nav-icons span,
.nav-icons a{
    font-size:24px;
    text-decoration:none;
    color:#6F4E37;
}


/* MAIN */

.container{
    width:100%;
    max-width:900px;
    margin:0 auto;
    padding:25px 15px 110px;
    box-sizing:border-box;
}


/* PAGE TITLE */

.page-title{
    text-align:center;
    margin:10px 0 30px;
}

.page-title h1{
    color:#6F4E37;
    font-size:32px;
    margin:0 0 8px;
}

.page-title p{
    color:#7B6249;
    margin:6px 0;
}


/* =========================
   CAMERA
========================= */

.camera-section{
    width:100%;
    margin-bottom:30px;
}


/* CAMERA BOX */

.camera-box{
    width:100%;
    height:400px;
    background:#F3E8D3;
    border:2px solid #D4A017;
    border-radius:20px;
    position:relative;
    overflow:hidden;
    box-sizing:border-box;
}


/* CAMERA VIDEO */

#cameraPreview{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    border-radius:0;
}


/* CAMERA MESSAGE */

#cameraMessage{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:#6F4E37;
    font-size:22px;
    font-weight:bold;
    text-align:center;
    white-space:nowrap;
}


/* CAMERA CONTROLS */

.camera-controls{
    display:flex;
    gap:12px;
    margin-top:15px;
}

.camera-controls button{
    flex:1;
    margin:0;
    padding:14px;
    background:#D4A017;
    color:white;
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
