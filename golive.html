<!DOCTYPE html>  
<html lang="en">  
  
<head>  
  
<meta charset="UTF-8">  
  
<meta name="viewport"  
content="width=device-width,initial-scale=1.0">  
  
<title>Canvas - Go Live</title>  
  
<style>  
  
/* =================================  
   CANVAS GO LIVE  
   PART 1  
================================= */  
  
*{  
    margin:0;  
    padding:0;  
    box-sizing:border-box;  
}  
  
html,body{  
    width:100%;  
    min-height:100%;  
}  
  
body{  
    font-family:Arial,Helvetica,sans-serif;  
    background:#FAF9F6;  
    color:#4B3326;  
    padding-bottom:82px;  
}  
  
/* =================================  
   TOP BAR  
================================= */  
  
.top-nav{  
    width:100%;  
    height:62px;  
    display:flex;  
    align-items:center;  
    justify-content:space-between;  
    padding:0 15px;  
    background:#FAF9F6;  
    border-bottom:1px solid rgba(75,51,38,.10);  
    position:sticky;  
    top:0;  
    z-index:50;  
}  
  
.logo{  
    font-size:23px;  
    font-weight:800;  
    color:#4B3326;  
    letter-spacing:-.5px;  
}  
  
.top-actions{  
    display:flex;  
    align-items:center;  
}  
  
/* =================================  
   PROFILE  
================================= */  
  
.profile-icon{  
    width:40px;  
    height:40px;  
    min-width:40px;  
    border-radius:50%;  
    overflow:hidden;  
    display:flex;  
    align-items:center;  
    justify-content:center;  
    background:#4B3326;  
    color:#FAF9F6;  
    text-decoration:none;  
    font-size:17px;  
    font-weight:bold;  
}  
  
.profile-icon img{  
    width:100%;  
    height:100%;  
    object-fit:cover;  
    display:block;  
}  
  
/* =================================  
   MAIN  
================================= */  
  
.main{  
    width:100%;  
    max-width:760px;  
    margin:auto;  
    padding:18px 14px 25px;  
}  
  
.page-title{  
    font-size:26px;  
    font-weight:800;  
    margin-bottom:5px;  
}  
  
.page-subtitle{  
    font-size:14px;  
    color:#806B5D;  
    margin-bottom:17px;  
}  
  
/* =================================  
   CAMERA CARD  
================================= */  
  
.camera-card{  
    width:100%;  
    background:#F3E8D3;  
    border:2px solid #DCC8AA;  
    border-radius:18px;  
    overflow:hidden;  
}  
  
.camera-box{  
    width:100%;  
    height:350px;  
    background:#241B16;  
    display:flex;  
    align-items:center;  
    justify-content:center;  
    position:relative;  
    overflow:hidden;  
}  
  
#cameraPreview{  
    width:100%;  
    height:100%;  
    object-fit:cover;  
    object-position:center center;  
    display:none;  
    background:#111;  
}  
  
.camera-message{  
    text-align:center;  
    padding:20px;  
    color:#E8DCCB;  
}  
  
.camera-message-icon{  
    font-size:40px;  
    margin-bottom:9px;  
}  
  
.camera-message-title{  
    font-size:17px;  
    font-weight:700;  
    margin-bottom:5px;  
}  
  
.camera-message-text{  
    font-size:13px;  
    color:#BBAA98;  
    line-height:1.4;  
}  
  
/* =================================  
   MEDIA CONTROLS  
================================= */  
  
.camera-controls{  
    display:flex;  
    gap:8px;  
    padding:11px;  
    background:#F3E8D3;  
}  
  
.media-button{  
    flex:1;  
    min-height:44px;  
    border:1px solid rgba(75,51,38,.12);  
    border-radius:11px;  
    background:#FFF;  
    color:#4B3326;  
    font-size:12px;  
    font-weight:700;  
    cursor:pointer;  
}  
  
.media-button:active{  
    transform:scale(.97);  
}  
  
.media-button.active{  
    background:#4B3326;  
    color:#FFF;  
}  
  
/* =================================  
   MESSAGES  
================================= */  
  
.permission-message{  
    margin-top:9px;  
    text-align:center;  
    font-size:12px;  
    color:#9A7658;  
}  
  
.webrtc-status{  
    margin-top:4px;  
    text-align:center;  
    font-size:12px;  
    color:#806B5D;  
}  
  
/* =================================  
   STREAM CARD  
================================= */  
  
.stream-card{  
    margin-top:18px;  
    padding:17px;  
    background:#FFF;  
    border:1px solid rgba(75,51,38,.10);  
    border-radius:18px;  
    box-shadow:0 5px 20px rgba(75,51,38,.06);  
}  
  
.form-group{  
    margin-bottom:15px;  
}  
  
.form-label{  
    display:block;  
    margin-bottom:7px;  
    font-size:13px;  
    font-weight:700;  
}  
  
.form-input,  
.form-select,  
.form-textarea{  
    width:100%;  
    border:1px solid #DCCFC2;  
    border-radius:11px;  
    padding:12px 13px;  
    background:#FAF9F6;  
    color:#4B3326;  
    outline:none;  
    font-family:inherit;  
    font-size:14px;  
}  
  
.form-input:focus,  
.form-select:focus,  
.form-textarea:focus{  
    border-color:#9A7658;  
    box-shadow:0 0 0 3px rgba(154,118,88,.10);  
}  
  
.form-textarea{  
    min-height:95px;  
    resize:vertical;  
}  
  
/* =================================  
   THUMBNAIL  
================================= */  
  
.thumbnail-upload{  
    width:100%;  
    min-height:125px;  
    border:2px dashed #D5C2A8;  
    border-radius:14px;  
    background:#FBF6EE;  
    display:flex;  
    align-items:center;  
    justify-content:center;  
    text-align:center;  
    cursor:pointer;  
    overflow:hidden;  
}  
  
.thumbnail-upload-title{  
    font-size:15px;  
    font-weight:800;  
}  
  
.thumbnail-upload-text{  
    margin-top:5px;  
    font-size:12px;  
    color:#8A7768;  
}  
  
#thumbnailInput{  
    display:none;  
}  
  
#thumbnailPreview{  
    width:100%;  
    display:none;  
    cursor:pointer;  
}  
  
#thumbnailImage{  
    width:100%;  
    max-height:220px;  
    object-fit:cover;  
    display:block;  
}  
  
/* =================================  
   STREAM BUTTONS  
================================= */  
  
.stream-actions{  
    margin-top:18px;  
}  
  
.stream-button{  
    width:100%;  
    min-height:48px;  
    border:0;  
    border-radius:13px;  
    font-size:15px;  
    font-weight:800;  
    cursor:pointer;  
}  
  
.start-button{  
    background:#4B3326;  
    color:#FFF;  
}  
  
.end-button{  
    background:#8E3025;  
    color:#FFF;  
    margin-top:9px;  
}  
  
.stream-button:disabled{  
    opacity:.55;  
    cursor:not-allowed;  
}  
  
.hidden{  
    display:none!important;  
}  
  
.status-box{  
    min-height:20px;  
    margin-top:12px;  
    text-align:center;  
    font-size:13px;  
    color:#806B5D;  
}  
  
/* =================================  
   BOTTOM NAV  
================================= */  
  
.bottom-nav{  
    position:fixed;  
    left:0;  
    right:0;  
    bottom:0;  
    height:72px;  
    background:#FFF;  
    border-top:1px solid rgba(75,51,38,.10);  
    display:flex;  
    align-items:center;  
    justify-content:space-around;  
    z-index:100;  
}  
  
.bottom-nav a{  
    flex:1;  
    height:100%;  
    display:flex;  
    flex-direction:column;  
    align-items:center;  
    justify-content:center;  
    gap:4px;  
    text-decoration:none;  
    color:#806B5D;  
    font-size:11px;  
    font-weight:700;  
}  
  
.bottom-nav a.active{  
    color:#4B3326;  
}  
  
.bottom-nav-icon{  
    width:25px;  
    height:25px;  
    display:flex;  
    align-items:center;  
    justify-content:center;  
    font-size:22px;  
    line-height:1;  
}  
  
/* =================================  
   EXPLORE ICON  
================================= */  
  
.explore-icon{  
    width:22px;  
    height:22px;  
}  
  
.explore-icon circle,  
.explore-icon path{  
    stroke:currentColor;  
}  
  
/* =================================  
   PROFILE BOTTOM  
================================= */  
  
.bottom-profile{  
    width:25px;  
    height:25px;  
    border-radius:50%;  
    overflow:hidden;  
    background:#4B3326;  
    color:#FFF;  
    display:flex;  
    align-items:center;  
    justify-content:center;  
    font-size:11px;  
}  
  
.bottom-profile img{  
    width:100%;  
    height:100%;  
    object-fit:cover;  
}  
  
/* =================================  
   MOBILE  
================================= */  
  
@media(max-width:480px){  
  
    .top-nav{  
        height:60px;  
        padding:0 13px;  
    }  
  
    .logo{  
        font-size:22px;  
    }  
  
    .main{  
        padding:15px 12px 22px;  
    }  
  
    .page-title{  
        font-size:23px;  
    }  
  
    .camera-box{  
        height:300px;  
    }  
  
    .camera-controls{  
        gap:6px;  
    }  
  
    .media-button{  
        font-size:11px;  
    }  
  
    .stream-card{  
        padding:14px;  
    }  
  
}  
  
</style>  
  
</head>  
  
<body>  
  
<!-- =================================  
     TOP NAV  
================================= -->  
  
<header class="top-nav">  
  
    <div class="logo">  
        Canvas  
    </div>  
  
    <div class="top-actions">  
  
        <a href="profile.html"  
           class="profile-icon"  
           id="topProfileIcon"  
           aria-label="Profile">⬤</a>  
  
    </div>  
  
</header>  
  
  
<!-- =================================  
     MAIN  
================================= -->  
  
<main class="main">  
  
    <h1 class="page-title">  
        Go Live  
    </h1>  
  
    <p class="page-subtitle">  
        Start your live stream on Canvas.  
    </p>  
  
  
    <!-- CAMERA -->  
  
    <section class="camera-card">  
  
        <div class="camera-box">  
  
            <video  
                id="cameraPreview"  
                autoplay  
                muted  
                playsinline>  
            </video>  
  
            <div  
                class="camera-message"  
                id="cameraMessage">  
  
                <div class="camera-message-icon">  
                    📷  
                </div>  
                <div class="camera-message-title">  
                    Camera is off  
                </div>  
  
                <div class="camera-message-text">  
                    Turn on your camera and microphone

                </div>  
  
            </div>  
  
        </div>  
  
  
        <div class="camera-controls">  
  
            <button  
                type="button"  
                class="media-button"  
                id="cameraButton">  
                Camera Off  
            </button>  
  
            <button  
                type="button"  
                class="media-button"  
                id="micButton">  
                Microphone Off  
            </button>  
  
            <button  
                type="button"  
                class="media-button"

                🔄  
            </button>  
  
        </div>  
  
    </section>  
  
  
    <div

    </div>  
  
    <div

    <section class="stream-card">  
  
        <div class="form-group">  
  
            <label  
                class="form-label"  
                for="streamTitle">  
                Stream Title  
            </label>  
  
            <input  
                type="text"  
                id="streamTitle"  
                class="form-input"  
                maxlength="100"  
                placeholder="What are you streaming?"  
                autocomplete="off">  
  
        </div>  
  
  
        <div class="form-group">  
  
            <label  
                class="form-label"  
                for="category">  
                Category  
            </label>  
  
            <select  
                id="category"  
                class="form-select">  
  
                <option value="">  
                    Select Category  
                </option>  
  
                <option value="Gaming">  
                    Gaming  
                </option>  
  
                <option value="Music">  
                    Music  
                </option>  
  
                <option value="Entertainment">  
                    Entertainment  
                </option>  
  
                <option value="Sports">  
                    Sports  
                </option>  
  
                <option value="Education">  
                    Education  
                </option>  
  
                <option value="Technology">  
                    Technology  
                </option>  
  
                <option value="justTalking">  
                    Just Talking  
                </option>  
  
                <option value="Other">  
                    Other  
                </option>  
  
            </select>  
  
        </div>  
  
  
        <div class="form-group">  
  
            <label  
                class="form-label"  
                for="description">  
                Description  
            </label>  
  
            <textarea  
                id="description"  
                class="form-textarea"  
                maxlength="500"  
                placeholder="Tell viewers what your stream is about..."></textarea>  
  
        </div>  
  
  
        <!-- =================================  
             STREAM THUMBNAIL  
        ================================= -->  
  
        <div class="form-group">  
  
            <label class="form-label">  
                Stream Thumbnail  
            </label>  
  
            <input  
                type="file"  
                id="thumbnailInput"  
                accept="image/*">  
  
            <div  
                class="thumbnail-upload"  
                id="choosePhotoButton">  
  
                <div>  
  
                    <div class="thumbnail-upload-title">  
                        Choose Photo  
                    </div>  
  
                    <div class="thumbnail-upload-text">  
                        Select a thumbnail for your stream  
                    </div>  
  
                </div>  
  
            </div>  
  
            <div id="thumbnailPreview">  
  
                <img  
                    id="thumbnailImage"  
                    alt="Stream thumbnail">  
  
            </div>  
  
        </div>  
  
  
        <!-- =================================  
             STREAM ACTIONS  
        ================================= -->  
  
        <div class="stream-actions">  
  
            <button  
                type="button"  
                id="startStreamingButton"  
                class="stream-button start-button">  
  
                🔴 Start Streaming  
  
            </button>  
  
  
            <button  
                type="button"  
                id="stopStreamingButton"  
                class="stream-button end-button hidden">  
  
                ⏹ End Streaming  
  
            </button>  
  
        </div>  
  
  
        <div  
            id="streamStatus"  
            class="status-box">  
        </div>  
  
    </section>  
  
</main>  
  
  
<!-- =================================  
     BOTTOM NAVIGATION  
================================= -->  
  
<nav class="bottom-nav">  
  
    <a

                <circle

        <span>

</nav>

<!-- =================================  
     JAVASCRIPT  
     PART 2 STARTS NEXT  
================================= -->  
  
<script>  
  /* =================================  
   CANVAS GO LIVE  
   PART 2  
   CONFIG + AUTH + PROFILE  
================================= */  
  
const API_BASE =  
    "https://canvas-kh9p.onrender.com";  
  
const SOCKET_URL =  
    API_BASE;  
  
  
/* =================================  
   MEDIA STATE  
================================= */  
  
let canvasStream = null;  
  
let cameraEnabled = false;  
  
let microphoneEnabled = false;  
  
let currentFacingMode = "user";  
  
let isStreaming = false;  
  
  
/* =================================  
   STREAM STATE  
================================= */  
  
let currentStreamId = null;  
  
let broadcasterRoom = null;  
  
let socket = null;  
  
let streamHeartbeat = null;  
  
  
/* =================================  
   WEBRTC  
================================= */  
  
const peerConnections = {};  
  
  
/* =================================  
   THUMBNAIL  
================================= */  
  
let selectedThumbnail = "";  
  
  
/* =================================  
   DOM ELEMENTS  
================================= */  
  
const cameraPreview =  
    document.getElementById(  
        "cameraPreview"  
    );  
  
const cameraMessage =  
    document.getElementById(  
        "cameraMessage"  
    );  
  
const permissionMessage =  
    document.getElementById(  
        "permissionMessage"  
    );  
  
const webrtcStatus =  
    document.getElementById(  
        "webrtcStatus"  
    );  
  
const streamStatus =  
    document.getElementById(  
        "streamStatus"  
    );  
  
const streamTitle =  
    document.getElementById(  
        "streamTitle"  
    );  
  
const category =  
    document.getElementById(  
        "category"  
    );  
  
const description =  
    document.getElementById(  
        "description"  
    );  
  
const thumbnailInput =  
    document.getElementById(  
        "thumbnailInput"  
    );  
  
const thumbnailPreview =  
    document.getElementById(  
        "thumbnailPreview"  
    );  
  
const thumbnailImage =  
    document.getElementById(  
        "thumbnailImage"  
    );  
  
const choosePhotoButton =  
    document.getElementById(  
        "choosePhotoButton"  
    );  
  
const cameraButton =  
    document.getElementById(  
        "cameraButton"  
    );  
  
const micButton =  
    document.getElementById(  
        "micButton"  
    );  
  
const switchCameraButton =  
    document.getElementById(  
        "switchCameraButton"  
    );  
  
const startStreamingButton =  
    document.getElementById(  
        "startStreamingButton"  
    );  
  
const stopStreamingButton =  
    document.getElementById(  
        "stopStreamingButton"  
    );  
  
  
/* =================================  
   AUTH  
================================= */  
  
function getAuthToken(){  
  
    return (  
        localStorage.getItem(  
            "canvasAuthToken"  
        ) ||  
  
        localStorage.getItem(  
            "authToken"  
        ) ||  
  
        localStorage.getItem(  
            "token"  
        ) ||  
  
        ""  
    );  
  
}  
  
  
function authHeaders(){  
  
    const token =  
        getAuthToken();  
  
    const headers = {  
        "Content-Type":  
            "application/json"  
    };  
  
    if(token){  
  
        headers.Authorization =  
            "Bearer " + token;  
  
    }  
  
    return headers;  
  
}  
  
  
/* =================================  
   STATUS  
================================= */  
  
function setStatus(  
    message,  
    error  
){  
  
    if(!streamStatus){  
        return;  
    }  
  
    streamStatus.textContent =  
        message || "";  
  
    streamStatus.style.color =  
        error  
            ? "#9A3026"  
            : "#806B5D";  
  
}  
  
  
function setPermissionMessage(  
    message  
){  
  
    if(permissionMessage){  
  
        permissionMessage.textContent =  
            message || "";  
  
    }  
  
}  
  
  
function setWebRTCStatus(  
    message  
){  
  
    if(webrtcStatus){  
  
        webrtcStatus.textContent =  
            message || "";  
  
    }  
  
}  
  
  
/* =================================  
   PROFILE IMAGE HELPERS  
================================= */  
  
function getStoredProfileImage(){  
  
    let image =  
        localStorage.getItem(  
            "canvasProfilePicture"  
        );  
  
  
    if(!image){  
  
        image =  
            localStorage.getItem(  
                "profilePicture"  
            );  
  
    }  
  
  
    if(!image){  
  
        try{  
  
            const profile =  
                JSON.parse(  
                    localStorage.getItem(  
                        "canvasProfile"  
                    ) || "null"  
                );  
  
  
            if(profile){  
  
                image =  
                    profile.profile_picture ||  
                    profile.profilePicture ||  
                    profile.photo ||  
                    profile.avatar ||  
                    "";  
  
            }  
  
        }catch(error){  
  
            console.warn(  
                "Stored profile read error:",  
                error  
            );  
  
        }  
  
    }  
  
  
    return image || "";  
  
}  
  
  
/* =================================  
   SAVE PROFILE IMAGE  
================================= */  
  
function saveProfileImage(  
    image  
){  
  
    if(!image){  
        return;  
    }  
  
  
    try{  
  
        localStorage.setItem(  
            "canvasProfilePicture",  
            image  
        );  
  
  
        localStorage.setItem(  
            "profilePicture",  
            image  
        );  
  
  
    }catch(error){  
  
        console.warn(  
            "Could not save profile image:",  
            error  
        );  
  
    }  
  
}  
  
  
/* =================================  
   UPDATE PROFILE ICONS  
================================= */  
  
function updateGoLiveProfile(){  
  
    const image =  
        getStoredProfileImage();  
  
  
    const top =  
        document.getElementById(  
            "topProfileIcon"

/* =================================  
   LOAD PROFILE FROM BACKEND  
================================= */  
  
async function loadGoLiveProfile(){  
  
    /*  
     * Show cached picture immediately.  
     */  
  
    updateGoLiveProfile();  
  
  
    const token =  
        getAuthToken();  
  
  
    if(!token){  
  
        return;  
  
    }  
  
  
    /* =================================  
       LOAD /api/me  
    ================================= */  
  
    try{  
  
        const meResponse =  
            await fetch(  
                API_BASE + "/api/me",  
                {  
                    method:"GET",  
                    headers:authHeaders()  
                }  
            );  
  
  
        if(meResponse.ok){  
  
            const meData =  
                await meResponse.json();  
  
  
            const user =  
                meData.user ||  
                meData.data ||  
                meData;  
  
  
            if(user){  
  
                try{  
  
                    localStorage.setItem(  
                        "canvasCurrentUser",  
                        JSON.stringify(  
                            user  
                        )  
                    );  
  
                }catch(error){  
  
                    console.warn(  
                        "Could not save current user:",  
                        error  
                    );  
  
                }  
  
  
                /*  
                 * Some backend versions return  
                 * the profile picture through /api/me.  
                 */  
  
                const meImage =  
                    user.profile_picture ||  
                    user.profilePicture ||  
                    user.photo ||  
                    user.avatar ||  
                    "";  
  
  
                if(meImage){  
  
                    saveProfileImage(  
                        meImage  
                    );  
  
                    updateGoLiveProfile();  
  
                }  
  
            }  
  
        }  
  
    }catch(error){  
  
        console.warn(  
            "/api/me failed:",  
            error.message  
        );  
  
    }  
  
  
    /* =================================  
       LOAD /api/profile  
    ================================= */  
  
    try{  
  
        const profileResponse =  
            await fetch(  
                API_BASE + "/api/profile",  
                {  
                    method:"GET",  
                    headers:authHeaders()  
                }  
            );  
  
  
        if(  
            profileResponse.ok  
        ){  
  
            const profileData =  
                await profileResponse.json();  
  
  
            /*  
             * Support all profile response  
             * structures used by Canvas backend.  
             */  
  
            const profile =  
                profileData.profile ||  
                profileData.data ||  
                profileData.user ||  
                profileData;  
  
  
            if(profile){  
  
                try{  
  
                    localStorage.setItem(  
                        "canvasProfile",  
                        JSON.stringify(  
                            profile  
                        )  
                    );  
  
                }catch(error){  
  
                    console.warn(  
                        "Could not cache profile:",  
                        error  
                    );  
  
                }  
  
  
                const profileImage =  
                    profile.profile_picture ||  
                    profile.profilePicture ||  
                    profile.photo ||  
                    profile.avatar ||  
                    profile.image ||  
                    "";  
  
  
                if(profileImage){  
  
                    saveProfileImage(  
                        profileImage  
                    );  
  
                    updateGoLiveProfile();  
  
                }  
  
            }  
        }else{  
  
            console.warn(  
                "/api/profile returned:",  
                profileResponse.status  
            );  
  
        }  
  
    }catch(error){  
  
        console.warn(  
            "/api/profile failed:",  
            error.message  
        );  
  
    }  
  
  
    /*  
     * Final refresh after both backend  
     * requests have completed.  
     */  
  
    updateGoLiveProfile();  
  
}

/* =================================  
   START CAMERA + MICROPHONE  
================================= */  
  
async function startCameraAndMicrophone(  
    wantCamera,  
    wantMicrophone  
){  
  
    if(  
        !wantCamera &&  
        !wantMicrophone  
    ){  
  
        setPermissionMessage(  
            "Turn on the camera or microphone first."  
        );  
  
        return;  
  
    }  
  
  
    try{  
  
        setPermissionMessage(  
            "Requesting camera and microphone permission..."  
        );  
  
  
        const constraints = {  
  
            video:  
                wantCamera  
                    ? {  
                        facingMode:{  
                            ideal:  
                                currentFacingMode  
                        },  
  
                        width:{  
                            ideal:1280  
                        },  
  
                        height:{  
                            ideal:720  
                        },  
  
                        frameRate:{  
                            ideal:30,  
                            max:30  
                        }  
                    }  
                    : false,  
  
  
            audio:  
                wantMicrophone  
                    ? {  
                        echoCancellation:true,  
                        noiseSuppression:true,  
                        autoGainControl:true  
                    }  
                    : false  
  
        };  
  
  
        const stream =  
            await navigator.mediaDevices.getUserMedia(  
                constraints  
            );  
  
  
        if(canvasStream){  
  
            canvasStream  
                .getTracks()  
                .forEach(  
                    function(track){  
  
                        track.stop();  
  
                    }  
                );  
  
        }  
  
  
        canvasStream =  
            stream;  
  
  
        const videoTracks =  
            stream.getVideoTracks();  
  
        const audioTracks =  
            stream.getAudioTracks();  
  
  
        cameraEnabled =  
            videoTracks.length > 0 &&  
            wantCamera;  
  
  
        microphoneEnabled =  
            audioTracks.length > 0 &&  
            wantMicrophone;  
  
  
        updateCameraButton();  
  
        updateMicButton();  
  
        updatePreview();  
  
  
        if(videoTracks.length){  
  
            try{  
  
                const videoSettings =  
                    videoTracks[0].getSettings();  
  
                console.log(  
                    "Canvas video:",  
                    videoSettings.width,  
                    "x",  
                    videoSettings.height,  
                    "@",  
                    videoSettings.frameRate  
                );  
  
            }catch(error){  
  
                console.warn(  
                    "Could not read video settings:",  
                    error  
                );  
  
            }  
  
        }  
  
  
        setPermissionMessage(  
            "Camera and microphone ready."  
        );  
  
        setWebRTCStatus("");  
  
  
    }catch(error){  
  
        console.error(  
            "Media permission error:",  
            error  
        );  
  
  
        cameraEnabled =  
            false;  
  
        microphoneEnabled =  
            false;  
  
  
        updateCameraButton();  
  
        updateMicButton();  
  
  
        if(  
            error.name ===  
            "NotAllowedError"  
        ){  
  
            setPermissionMessage(  
                "Camera or microphone permission was denied."  
            );  
  
        }else if(  
            error.name ===  
            "NotFoundError"  
        ){  
  
            setPermissionMessage(  
                "Camera or microphone was not found."  
            );  
  
        }else if(  
            error.name ===  
            "NotReadableError"  
        ){  
  
            setPermissionMessage(  
                "Camera or microphone is already being used."  
            );  
  
        }else{  
  
            setPermissionMessage(  
                "Could not access camera or microphone."  
            );  
  
        }  
  
  
        setStatus(  
            "Media access failed.",  
            true  
        );  
  
    }  
  
}  
  
  
/* =================================  
   CAMERA SWITCH  
================================= */  
  
async function switchCamera(){  
  
    if(!canvasStream){  
  
        await startCameraAndMicrophone(  
            true,  
            microphoneEnabled  
        );  
  
        return;  
  
    }  
  
  
    if(!cameraEnabled){  
  
        await startCameraAndMicrophone(  
            true,  
            microphoneEnabled  
        );  
  
        return;  
  
    }  
  
  
    const oldVideoTracks =  
        canvasStream.getVideoTracks();  
  
  
    if(  
        !oldVideoTracks ||  
        oldVideoTracks.length === 0  
    ){  
  
        return;  
  
    }  
  
  
    const oldTrack =  
        oldVideoTracks[0];  
  
  
    const nextFacingMode =  
        currentFacingMode === "user"  
            ? "environment"  
            : "user";  
  
  
    setPermissionMessage(  
        "Switching camera..."  
    );  
  
  
    try{  
  
        const newStream =  
            await navigator.mediaDevices.getUserMedia(  
                {  
                    video:{  
                        facingMode:{  
                            ideal:  
                                nextFacingMode  
                        },  
  
                        width:{  
                            ideal:1280  
                        },  
  
                        height:{  
                            ideal:720  
                        },  
  
                        frameRate:{  
                            ideal:30,  
                            max:30  
                        }  
                    },  
  
                    audio:false  
                }  
            );  
  
  
        const newVideoTracks =  
            newStream.getVideoTracks();  
  
  
        if(  
            !newVideoTracks ||  
            !newVideoTracks.length  
        ){  
  
            newStream  
                .getTracks()  
                .forEach(  
                    function(track){  
  
                        track.stop();  
  
                    }  
                );  
  
            throw new Error(  
                "No video track returned."  
            );  
  
        }  
        const newVideoTrack =  
            newVideoTracks[0];  
  
  
        canvasStream.removeTrack(  
            oldTrack  
        );  
  
  
        oldTrack.stop();  
  
  
        canvasStream.addTrack(  
            newVideoTrack  
        );  
  
  
        currentFacingMode =  
            nextFacingMode;  
  
  
        cameraEnabled =  
            true;  
  
  
        if(cameraPreview){  
  
            cameraPreview.srcObject =  
                null;  
  
            cameraPreview.srcObject =  
                canvasStream;  
  
            cameraPreview.muted =  
                true;  
  
            cameraPreview.autoplay =  
                true;  
  
            cameraPreview.playsInline =  
                true;  
  
            cameraPreview.style.display =  
                "block";  
  
        }  
  
  
        updateCameraButton();  
  
        updatePreview();  
  
  
        try{  
  
            await cameraPreview.play();  
  
        }catch(error){  
  
            console.warn(  
                "Preview play warning:",  
                error  
            );  
  
        }  
  
  
        setPermissionMessage(  
            currentFacingMode === "environment"  
                ? "Back camera active."  
                : "Front camera active."  
        );  
  
  
        setStatus("");  
  
  
    }catch(error){  
  
        console.warn(  
            "Camera switch failed:",  
            error  
        );  
  
  
        setPermissionMessage(  
            "Could not switch camera."  
        );  
  
  
        setStatus(  
            "Could not switch camera on this device.",  
            true  
        );  
  
    }

/* =================================  
   SOCKET CONNECTION  
================================= */  
  
function connectSocket(){  
  
    if(socket){  
  
        return socket;  
  
    }  
  
  
    if(typeof io !== "function"){  
  
        console.warn(  
            "Socket.IO client is not available."  
        );  
  
        return null;  
  
    }  
  
  
    try{  
  
        socket =  
            io(  
                SOCKET_URL,  
                {  
                    transports:[  
                        "websocket",  
                        "polling"  
                    ],  
  
                    reconnection:true,  
  
                    reconnectionAttempts:  
                        Infinity,  
  
                    timeout:10000  
                }  
            );  
  
  
        socket.on(  
            "connect",  
            function(){  
  
                console.log(  
                    "Canvas socket connected:",  
                    socket.id  
                );  
  
  
                if(broadcasterRoom){  
  
                    socket.emit(  
                        "join-stream",  
                        {  
                            streamId:  
                                broadcasterRoom  
                        }  
                    );  
  
                }  
  
  
                if(  
                    isStreaming &&  
                    currentStreamId  
                ){  
  
                    socket.emit(  
                        "stream-started",  
                        {  
                            streamId:  
                                currentStreamId  
                        }  
                    );  
  
                }  
  
            }  
        );  
  
  
        socket.on(  
            "connect_error",  
            function(error){  
  
                console.warn(  
                    "Canvas socket connection error:",  
                    error.message  
                );  
  
                setWebRTCStatus(  
                    "Realtime connection reconnecting..."  
                );  
  
            }  
        );  
  
  
        socket.on(  
            "disconnect",  
            function(reason){  
  
                console.log(  
                    "Canvas socket disconnected:",  
                    reason  
                );  
  
  
                if(isStreaming){  
  
                    setWebRTCStatus(  
                        "Realtime connection reconnecting..."  
                    );  
  
                }  
  
            }  
        );  
  
  
        socket.on(  
            "reconnect",  
            function(){  
  
                console.log(  
                    "Canvas socket reconnected."  
                );  
  
  
                if(  
                    isStreaming &&  
                    currentStreamId  
                ){  
  
                    socket.emit(  
                        "join-stream",  
                        {  
                            streamId:  
                                currentStreamId  
                        }  
                    );  
  
                    socket.emit(  
                        "stream-started",  
                        {  
                            streamId:  
                                currentStreamId  
                        }  
                    );  
  
                }  
  
            }  
        );  
  
  
        return socket;  
  
    }catch(error){  
  
        console.warn(  
            "Socket initialization failed:",  
            error  
        );  
  
        socket =  
            null;  
  
        return null;  
  
    }  
  
}  
  
  
/* =================================  
   JOIN BROADCASTER ROOM  
================================= */  
  
function joinBroadcasterRoom(){  
  
    const activeSocket =  
        connectSocket();  
  
  
    if(  
        !activeSocket ||  
        !currentStreamId  
    ){  
  
        return;  
  
    }  
  
  
    broadcasterRoom =  
        String(  
            currentStreamId  
        );  
  
  
    if(activeSocket.connected){  
  
        activeSocket.emit(  
            "join-stream",  
            {  
                streamId:  
                    broadcasterRoom  
            }  
        );  
  
    }  
  
}

/* =================================  
   CREATE STREAM REQUEST  
================================= */  
  
async function registerStreamOnServer(  
    streamData  
){  
  
    const token =  
        getAuthToken();  
  
  
    if(!token){  
  
        throw new Error(  
            "AUTH_REQUIRED"  
        );  
  
    }  
  
  
    /*  
     * The backend receives the same stream  
     * ID that the frontend and Socket.IO use.  
     *  
     * This prevents the frontend from creating  
     * one ID locally and the backend using  
     * another ID.  
     */  
  
    const payload = {  
  
        id:  
            streamData.id,  
  
        streamId:  
            streamData.streamId,  
  
        title:  
            streamData.title,  
  
        category:  
            streamData.category,  
  
        description:  
            streamData.description,  
  
        thumbnail:  
            streamData.thumbnail || "",  
  
        streamer:  
            streamData.streamer || "",  
  
        username:  
            streamData.username || "",  
  
        profilePicture:  
            streamData.profilePicture || "",  
  
        isLive:true,  
  
        createdAt:  
            streamData.createdAt || Date.now()  
  
    };  
  
  
    const response =  
        await fetch(  
            API_BASE + "/api/streams",  
            {  
                method:"POST",  
  
                headers:authHeaders(),  
  
                body:  
                    JSON.stringify(  
                        payload  
                    )  
            }  
        );  
  
  
    /*  
     * Read the response even when the backend  
     * returns an error. This gives us the real  
     * backend message instead of a generic error.  
     */  
  
    let data = null;  
  
  
    try{  
  
        data =  
            await response.json();  
  
    }catch(error){  
  
        data = null;  
  
    }  
  
  
    if(!response.ok){  
  
        const backendMessage =  
            data &&  
            (  
                data.error ||  
                data.message ||  
                data.details  
            );  
  
  
        throw new Error(  
            backendMessage ||  
            "Stream registration failed (" +  
            response.status +  
            ")"  
        );  
  
    }  
  
  
    /*  
     * Accept different response formats from  
     * the Canvas backend.  
     */  
  
    const serverStream =  
        data &&  
        (  
            data.stream ||  
            data.data ||  
            data  
        );  
  
  
    return {  
  
        data:data,  
  
        streamId:  
            serverStream &&  
            (  
                serverStream.streamId ||  
                serverStream.id  
            )  
                ? String(  
                    serverStream.streamId ||  
                    serverStream.id  
                )  
                : String(  
                    streamData.streamId  
                )  
  
    };  
  
}  
  
  
/* =================================  
   UPDATE LOCAL STREAM  
================================= */  
  
function saveLocalLiveStream(  
    streamData  
){  
  
    try{  
  
        localStorage.setItem(  
            "canvasActiveStream",  
            JSON.stringify(  
                streamData  
            )  
        );  
  
  
        localStorage.setItem(  
            "canvasLiveStream",  
            JSON.stringify(  
                streamData  
            )  
        );  
  
  
    }catch(error){  
  
        console.warn(  
            "Could not save local live stream:",  
            error  
        );  
  
    }  
  
}  
  
  
/* =================================  
   REMOVE LOCAL STREAM  
================================= */  
  
function removeLocalLiveStream(  
    streamId  
){  
  
    try{  
  
        const active =  
            JSON.parse(  
                localStorage.getItem(  
                    "canvasActiveStream"  
                ) || "null"  
            );  
            if(  
            !active ||  
            !streamId ||  
            String(active.id) ===  
                String(streamId) ||  
            String(active.streamId) ===  
                String(streamId)  
        ){  
  
            localStorage.removeItem(  
                "canvasActiveStream"  
            );  
  
        }  
  
  
        const live =  
            JSON.parse(  
                localStorage.getItem(  
                    "canvasLiveStream"  
                ) || "null"  
            );  
  
  
        if(  
            !live ||  
            !streamId ||  
            String(live.id) ===  
                String(streamId) ||  
            String(live.streamId) ===  
                String(streamId)  
        ){  
  
            localStorage.removeItem(  
                "canvasLiveStream"  
            );  
  
        }  
  
    }catch(error){  
  
        localStorage.removeItem(  
            "canvasActiveStream"  
        );  
  
        localStorage.removeItem(  
            "canvasLiveStream"  
        );  
  
    }  
  
}  
  
  
/* =================================  
   START LIVE STREAM  
================================= */  
  
async function createLiveStream(){  
  
    if(isStreaming){  
  
        return;  
  
    }  
  
  
    if(!validateStreamDetails()){  
  
        return;  
  
    }  
  
  
    if(!canvasStream){  
  
        setStatus(  
            "Please turn on your camera or microphone first.",  
            true  
        );  
  
        return;  
  
    }  
  
  
    const videoTracks =  
        canvasStream.getVideoTracks();  
  
  
    const audioTracks =  
        canvasStream.getAudioTracks();  
  
  
    if(  
        videoTracks.length === 0 &&  
        audioTracks.length === 0  
    ){  
  
        setStatus(  
            "Please enable your camera or microphone.",  
            true  
        );  
  
        return;  
  
    }  
  
  
    const token =  
        getAuthToken();  
  
  
    if(!token){  
  
        setStatus(  
            "Please log in before starting a stream.",  
            true  
        );  
  
        return;  
  
    }  
  
  
    const streamData =  
        getStreamData();  
  
  
    /*  
     * Create ONE ID and use it everywhere.  
     */  
  
    const newStreamId =  
        createStreamId();  
  
  
    currentStreamId =  
        newStreamId;  
  
  
    streamData.id =  
        newStreamId;  
  
    streamData.streamId =  
        newStreamId;  
  
    streamData.isLive =  
        true;  
  
  
    /*  
     * Get username from all supported  
     * Canvas localStorage keys.  
     */  
  
    const storedUsername =  
        localStorage.getItem(  
            "canvasUsername"  
        ) ||  
        localStorage.getItem(  
            "username"  
        ) ||  
        "";  
  
  
    streamData.streamer =  
        storedUsername;  
  
  
    streamData.username =  
        storedUsername;  
  
  
    /*  
     * Get profile image.  
     */  
  
    streamData.profilePicture =  
        localStorage.getItem(  
            "canvasProfilePicture"  
        ) ||  
        localStorage.getItem(  
            "profilePicture"  
        ) ||  
        "";  
  
  
    streamData.createdAt =  
        Date.now();  
  
  
    /*  
     * Do NOT mark the stream as successfully  
     * live before the backend accepts it.  
     */  
  
    startStreamingButton.disabled =  
        true;  
  
  
    setStatus(  
        "Starting your live stream..."  
    );  
  
  
    setWebRTCStatus(  
        "Connecting to Canvas server..."  
    );  
  
  
    try{  
  
        /* =================================  
           BACKEND FIRST  
        ================================= */  
  
        const serverResult =  
            await registerStreamOnServer(  
                streamData  
            );  
          /*  
         * Keep the server-confirmed ID.  
         */  
  
        currentStreamId =  
            serverResult.streamId ||  
            newStreamId;  
  
  
        streamData.id =  
            currentStreamId;  
  
        streamData.streamId =  
            currentStreamId;  
  
  
        /*  
         * Save only after backend registration  
         * succeeded.  
         */  
  
        saveLocalLiveStream(  
            streamData  
        );  
  
  
        /* =================================  
           SOCKET  
        ================================= */  
  
        connectSocket();  
  
        joinBroadcasterRoom();  
  
  
        if(socket){  
  
            if(socket.connected){  
  
                socket.emit(  
                    "stream-started",  
                    {  
                        streamId:  
                            currentStreamId,  
  
                        title:  
                            streamData.title,  
  
                        category:  
                            streamData.category,  
  
                        description:  
                            streamData.description,  
  
                        thumbnail:  
                            streamData.thumbnail,  
  
                        streamer:  
                            streamData.streamer,  
  
                        username:  
                            streamData.username,  
  
                        profilePicture:  
                            streamData.profilePicture  
                    }  
                );  
  
            }  
  
        }  
  
  
        /* =================================  
           STREAM STATE  
        ================================= */  
  
        isStreaming =  
            true;  
  
  
        startStreamingButton.classList.add(  
            "hidden"  
        );  
stopStreamingButton.classList.remove(  
            "hidden"  
        );  
  
  
        setStatus(  
            "🔴 You are now live."  
        );  
  
  
        setWebRTCStatus(  
            "Live stream started."  
        );  
  
  
        startStreamHeartbeat();  
  
  
        console.log(  
            "Canvas live stream registered:",  
            currentStreamId  
        );  
  
  
    }catch(error){  
  
        console.error(  
            "Canvas stream start failed:",  
            error  
        );  
  
  
        /*  
         * IMPORTANT:  
         * If backend registration fails,  
         * do not pretend the stream is live.  
         */  
  
        isStreaming =  
            false;  
  
  
        removeLocalLiveStream(  
            newStreamId  
        );  
  
  
        currentStreamId =  
            null;  
  
  
        broadcasterRoom =  
            null;  
  
  
        if(  
            error.message ===  
            "AUTH_REQUIRED"  
        ){  
  
            setStatus(  
                "Please log in before starting a stream.",  
                true  
            );  
  
        }else{  
  
            setStatus(  
                "Could not start stream: " +  
                error.message,  
                true  
            );  
  
        }  
  
  
        setWebRTCStatus(  
            "Canvas server registration failed."  
        );  
  
  
    }finally{  
  
        if(startStreamingButton){  
  
            startStreamingButton.disabled =  
                false;  
  
        }  
  
    }  
  
}  
  
  
/* =================================  
   END LIVE STREAM  
================================= */  
  
async function endLiveStream(){  
  
    if(!isStreaming){  
  
        return;  
  
    }  
  
  
    const endedStreamId =  
        currentStreamId;  
  
  
    isStreaming =  
        false;  
  
  
    stopStreamHeartbeat();  
  
  
    setStatus(  
        "Ending stream..."  
    );  
  
  
    setWebRTCStatus(  
        ""  
    );  
  
  
    /*  
     * Tell connected viewers first.  
     */  
  
    if(  
        socket &&  
        socket.connected &&  
        endedStreamId  
    ){  
  
        socket.emit(  
            "stream-ended",  
            {  
                streamId:  
                    endedStreamId  
            }  
        );  
  
    }  
  
  
    const token =  
        getAuthToken();  
  
  
    /*  
     * Tell the backend to end/delete the  
     * active stream.  
     */  
  
    if(  
        token &&  
        endedStreamId  
    ){  
  
        try{  
  
            const response =  
                await fetch(  
                    API_BASE +  
                    "/api/streams/" +  
                    encodeURIComponent(  
                        endedStreamId  
                    ),  
                    {  
                        method:"DELETE",  
                        headers:authHeaders()  
                    }  
                );  
                if(!response.ok){  
  
                console.warn(  
                    "End stream API returned:",  
                    response.status  
                );  
  
            }  
  
        }catch(error){  
  
            console.warn(  
                "Could not end server stream:",  
                error.message  
            );  
  
        }  
  
    }  
  
  
    /*  
     * Always clear local live state.  
     */  
  
    removeLocalLiveStream(  
        endedStreamId  
    );  
  
  
    currentStreamId =  
        null;  
  
    broadcasterRoom =  
        null;  
  
  
    if(startStreamingButton){  
  
        startStreamingButton.classList.remove(  
            "hidden"  
        );  
  
    }  
  
  
    if(stopStreamingButton){  
  
        stopStreamingButton.classList.add(  
            "hidden"  
        );  
  
    }  
  
  
    setStatus(  
        "Stream ended."  
    );  
  
  
    /*  
     * Keep camera/microphone available after  
     * ending the stream so the user can start  
     * another stream without reopening them.  
     */  
  
    console.log(  
        "Canvas stream ended:",  
        endedStreamId  
    );  
  
}

function stopMedia(){  
  
    if(!canvasStream){  
        return;  
    }  
  
  
    canvasStream  
        .getTracks()  
        .forEach(  
            function(track){  
  
                try{  
  
                    track.stop();  
  
                }catch(error){  
  
                    console.warn(  
                        "Media track stop error:",  
                        error  
                    );  
  
                }  
  
            }  
        );  
  
  
    canvasStream =  
        null;  
  
  
    cameraEnabled =  
        false;  
  
  
    microphoneEnabled =  
        false;  
  
  
    if(cameraPreview){  
  
        cameraPreview.srcObject =  
            null;  
  
        cameraPreview.style.display =  
            "none";  
  
    }  
  
  
    updateCameraButton();  
  
    updateMicButton();  
  
    updatePreview();  
  
}  
  
  
/* =================================  
   CLOSE PEER CONNECTIONS  
================================= */  
  
function closePeerConnections(){  
  
    Object.keys(  
        peerConnections  
    ).forEach(  
        function(peerId){  
  
            try{  
  
                if(  
                    peerConnections[peerId]  
                ){  
  
                    peerConnections[peerId]  
                        .close();  
  
                }  
  
            }catch(error){  
  
                console.warn(  
                    "Peer connection close error:",  
                    error  
                );  
  
            }  
  
  
            delete peerConnections[  
                peerId  
            ];  
  
        }  
    );  
  
}  
  
  
/* =================================  
   DISCONNECT SOCKET  
================================= */  
  
function disconnectSocket(){  
  
    if(!socket){  
        return;  
    }  
    try{  
  
        socket.disconnect();  
  
    }catch(error){  
  
        console.warn(  
            "Socket disconnect error:",  
            error  
        );  
  
    }  
  
  
    socket =  
        null;  
  
}
